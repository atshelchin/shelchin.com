刻，二十六小时。三个人没人说话。周冉把笔放下，这是她早上进门之后第一次放下笔。阿凯把眼镜摘了，揉眼睛。林拓看着窗外，滨江的路灯一排一排的，很安静。<\/p><p class=\"stamp\"><strong>01:30<\/strong><\/p><p>通知发出去。八千一百封邮件，八千一百个推送。周冉写的，林拓改了两个字，阿凯加了一句。<\/p><blockquote><p>信风恢复模块有一个漏洞。攻击者在特定时机可以给你的钱包多加一把钥匙。我们查了所有钱包，没有人受到影响。漏洞已修复。请你更新 App，打开后按一次指纹，三十秒。24 小时内我们会公开全部过程。<\/p><\/blockquote><p>没有「非常抱歉」，没有「高度重视」。周冉说那些词是给不打算解释的人用的。<\/p><p class=\"stamp\"><strong>08:00<\/strong><\/p><p>用户群里炸了一阵。<\/p><p>有人说：这就是我不用新钱包的原因。有人说：所以没人丢钱？有人说：按了，三十秒不到。有人说：你们凌晨一点半发邮件，是不是不睡觉。<\/p><p>林拓一条一条回。周冉一条一条回。阿凯回了三条，每条都以「有一个问题」开头，然后自己回答。<\/p><p>到中午，按了指纹的人四成。到晚上，六成。<\/p><p>夜航船群里，老船长问了一句：船漏了？<\/p><p>林拓回：漏了。堵上了。<\/p><p>老船长：堵上之前谁知道。<\/p><p>林拓：我们三个，和报的人。<\/p><p>老船长：那就好。漏了不丢人，漏了不说才丢人。<\/p><p>群里安静了几秒，然后有人发了一个船的表情，接着一排船。<\/p><p><strong>4 月 3 日，晚上<\/strong><\/p><p>晚饭后，林拓把账本打开，放在桌上。<\/p><p>「赏金。」他说。<\/p><p>沈月在洗碗，没回头。「多少。」<\/p><p>「两万。」<\/p><p>「现在有多少。」<\/p><p>「十四万。」<\/p><p>「付了剩十二万。」<\/p><p>「嗯。」<\/p><p>她关了水，擦手，走过来看那本账。上面一行是三月的房租，四千二。<\/p><p>「你赏金页上写的是两万？」<\/p><p>「嗯。」<\/p><p>「那就付。」她说，「写了不付，以后谁给你报。」<\/p><p>他没说话。<\/p><p>「你在想什么。」<\/p><p>「十二万，六个多月。」<\/p><p>「六个多月还是六个多月。」她说，「没有他，你不知道要少几个月。」<\/p><p>他把钱换成稳定币，转到 0xRain 邮件里的地址。用的是信风。他按了指纹。手不抖了。<\/p><p class=\"stamp\"><strong>21:40<\/strong><\/p><p>公开时间线发出去了。发在圈子、海外社交平台和信风的网站上，中英文各一版。周冉搭的架子，林拓填的内容。<\/p><p>只有一张表：<\/p><blockquote><p>4 月 1 日 23:12，收到报告。<\/p><p>4 月 2 日 01:10，复现确认。<\/p><p>01:30，回复报告者。<\/p><p>03:05，链上排查 8,100 个钱包，受影响：0。<\/p><p>04:10，暂停「更换备用钥匙」。<\/p><p>12:20，修复完成。<\/p><p>16:30，报告者复核，一处修正。<\/p><p>4 月 3 日 01:12，修复上线。<\/p><p>01:30，通知全部用户。<\/p><p>赏金：¥20,000。发现者：0xRain（经本人同意公开）。<\/p><\/blockquote><p>表下面一段话讲漏洞是什么，用的还是那句：门锁允许在换锁的一瞬间多配一把钥匙。再下面一段讲为什么会有这个漏洞。恢复模块是他们自己写的，写的时候没有想到「同一次换锁」需要一个编号。<\/p><p>林拓写这一段的时候停了很久。他想加一句「我们已经尽力」。<\/p><p>周冉看了一眼，说：「删。写你做了什么，别写你多努力。」<\/p><p>他删了。<\/p><p>距离收到邮件，四十六小时二十八分。<\/p><p><strong>4 月 4 日<\/strong><\/p><p>0xRain 回信。还是很短。<\/p><blockquote><p>收到赏金。你们是我见过处理最快的。大多数团队要几个星期，有的从来不回。<\/p><p>以后有新模块，上线前发我。<\/p><\/blockquote><p>林拓把这封邮件转给阿凯和周冉。阿凯回：那他就是顾问了。周冉回：不付钱的顾问。阿凯回：先这样。以后再说。<\/p><p>那天下午，一个做安全内容的博主写了一篇文章。标题是「26 小时」。里面把那张时间线整个贴了出来。最后一句是：他们三个人，没有公关，没有律师，做的事比很多几百人的公司干净。<\/p><p>用户没有跑。<\/p><p>4 月 4 日晚上，后台的数字是八千六百。比漏洞前多了五百。<\/p><p>阿凯说：「有一个问题。人为什么多了。」<\/p><p>「因为他们看到了门是怎么修的。」周冉说，「看到修门的过程，比看到一扇新门放心。」<\/p><p>林拓没说话。他去洗碗了。<\/p><p>沈月把那篇文章读完，把手机放在他洗碗的水槽边上。「他说你们干净。」<\/p><p>「嗯。」<\/p><p>「你妈问我你最近怎么样，我说他在修门。」她说，「她说修门好，修门是正经事。」<\/p><p>他把水关了，把手擦干，看了她一眼。这一眼她收下了。<\/p><p>周冉那天晚上在群里说：把时间线放到首页去。别藏。谁问「你们安全吗」，就把这个给他看。<\/p><p>阿凯：有一个问题。放首页会不会吓到新用户。<\/p><p>周冉：吓走的不是我们的用户。<\/p><p><strong>4 月 20 日，下午两点<\/strong><\/p><p>周冉发来一个链接，没有任何字。<\/p><p>是一个发布会的直播。星象钱包，那家大交易所的钱包。屏幕上八个字，很大：<\/p><p>无助记词，指纹登录。<\/p><aside class=\"log\"><div class=\"log-label\">航海日志<\/div><p>4 月 3 日。有漏洞。26 小时修好。全过程公开。<\/p><p>23:12 收到，01:10 复现，03:05 查完链上 8,100 个钱包，受影响 0。<\/p><p>先停掉换锁，再修锁。修好再告诉所有人，48 小时内公开时间线。<\/p><p>通知里不写「抱歉」，写你做了什么、用户要做什么。<\/p><p>赏金 20,000。存款 14 万到 12 万。沈月说：写了就付。<\/p><p>谢谢 0xRain。<\/p><\/aside>", "words": 4819}, {"num": 24, "title": "巨人的影子", "vol": 2, "html": "<p>2026 年 4 月 20 日，下午两点零六分。滨江，出租屋。<\/p><p>林拓点开周冉发的链接。发布会已经开始了。<\/p><p>台上站着一个穿白衬衫的人，身后的大屏幕上是八个字：无助记词，指纹登录。台下坐满了人，掌声很整齐。<\/p><p>那是星象钱包，某家大交易所的钱包。交易所有几千万用户，钱包是送的。<\/p><p>冰箱上那张纸还贴着。4 月 11 日那天周冉在最下面写了一个数字：55%。三十天后，留下来的人五成五。她说这个数不差，能看。那天他去洗了碗。<\/p><p>现在他坐在阳台上，看着屏幕里那个人讲云备份、讲换手机、讲「再也不用抄十二个词」。四十分钟。他从头看到尾。<\/p><p>周冉发消息：别看了。<\/p><p>他没回。他在数。星象的文案里，有十七处和信风的一样。「钥匙」这个词他们也用了。「再给自己留一把」，一字不差。<\/p><p>看完，他把手机扣在桌上。<\/p><p><strong>铺天盖地<\/strong><\/p><p>那天下午，应用商店首页最上面那一格是星象。搜索引擎搜「无助记词」，第一条是星象的广告。海外社交平台上，交易所的官方账号发了一条，一小时转发两万。<\/p><p>应用商店的榜单上，信风从钱包类的第九掉到第二十一。他刷新了三次，没变。<\/p><p>晚上沈月回来，说她们学校电梯里的广告换了。<\/p><p>「换成什么。」<\/p><p>「一个钱包。指纹的。」她看着他，「是不是你说的那个。」<\/p><p>「嗯。」<\/p><p>信风的用户群里，那天下午一共三百多条消息。他翻了一遍。<\/p><p>「星象也有了。」<\/p><p>「大厂做的，应该更安全吧。」<\/p><p>「他们免费，还送手续费。」<\/p><p>「你们怎么办？」<\/p><p>大鹏在里面回了一句：我不换。没人接他的话。<\/p><p>郑浩的消息是晚上十点来的：看到星象了吧。这就是大厂。他们一个季度的预算比你十年赚的多。我上次说的话还算数，你想想。<\/p><p>林拓没回。他把手机翻过去，屏幕朝下。<\/p><p><strong>三天<\/strong><\/p><p>那天晚上他没发日志。<\/p><p>夜航船的规矩是每天说一句话。他从去年十一月开始，没断过。漏洞那两天都没断。<\/p><p>第二天也没发。<\/p><p>第三天，周冉来了。她进门没脱鞋，站在阳台门口。<\/p><p>「数据你看了没有。」<\/p><p>「看了。」<\/p><p>「说。」<\/p><p>「用户没掉。新增从一天一百二掉到六十。」<\/p><p>「掉一半。」她说，「你觉得是什么。」<\/p><p>「他们一天的用户，比我一年多。」<\/p><p>「我没问这个。」<\/p><p>他不说话。<\/p><p>「你在这儿丧什么。」她说，「我在大厂的时候，我们一个功能上线，一天一百万人用。你知道三个月后还剩几个吗？」<\/p><p>他看着她。<\/p><p>「我不告诉你。你自己去看。」她把包往沙发上一扔，又拎起来，「你想通了给我发消息。想不通也发，我好知道你还活着。」<\/p><p>门关上了。<\/p><p>阿凯的消息是晚上来的，一行：有一个问题。星象的钱包，钥匙在谁手里？<\/p><p>他没回。<\/p><p>小杜也发了一条：哥，群里有人问你是不是出事了。要我替你说一句吗。<\/p><p>他回：不用。<\/p><p>他打开日志的编辑框，光标闪了十几分钟。他打了一句「星象上线了」，删了。打了一句「今天没什么」，也删了。最后关掉。<\/p><p>沈月那天晚上做了饭。他吃了，一句话没说。吃完他又坐回阳台，没开电脑，坐到两点。<\/p><p>她两点起来，站在门口。「你三天没发那个东西。」<\/p><p>「嗯。」<\/p><p>「他们抄你？」<\/p><p>「不算抄。」他说，「他们做得比我好。」<\/p><p>她站了一会儿。「你去年十二月，转一百块进去，手抖。」<\/p><p>「嗯。」<\/p><p>「他们的人手抖不抖。」<\/p><p>他没听懂。她回去睡了。<\/p><p><strong>茶馆<\/strong><\/p><p>4 月 23 日，老船长发来一条：三天没说话了。来喝茶。<\/p><p>「不打烊」下午还是没什么人。老船长的普洱已经泡好了。他把杯子推过来，没问发布会。<\/p><p>「你觉得他们做的是什么。」<\/p><p>「跟我一样的东西。」<\/p><p>老船长摇头，很慢。「不一样。他们做了一个功能。你做了一个产品。」<\/p><p>「有什么区别。」<\/p><p>「功能是大船上的一块板子。他们有几千万人，加一块板子，几千万人都能踩。」他喝了一口茶，「产品是一条船。船是给特定的人坐的。」<\/p><p>林拓看着杯子里的茶。<\/p><p>「大厂做功能，你做产品。」老船长说，「大厂服务所有人。你服务谁？」<\/p><p>「不知道。」<\/p><p>「那就回去看。」他说，「看你的用户是谁。不是看数字。看人。一个一个看。」<\/p><p>「八千多人，怎么看。」<\/p><p>「不看八千。看最常用的那两百个。他们是谁，他们拿信风干什么，他们以前用什么。看完你就知道你的船是给谁的。」<\/p><p>老船长把茶壶提起来，又给他倒满。<\/p><p>「三天不说话，船不会沉。」他说，「但别习惯。」<\/p><p>林拓喝了一口茶，问：「你那三十个站，没有大厂做一样的？」<\/p><p>「都有。」老船长说，「每一个都有。有的搜索引擎自己就做了。」<\/p><p>「那你怎么还在。」<\/p><p>「因为大厂做的是给所有人用的，做完就走了。我的站是给一小撮人用的，我天天在。」他放下杯子，「他们要的不是功能。他们要的是有人在。」<\/p><p>回去的地铁上，他给周冉发了一条：明天来。<\/p><p>周冉回：几点。<\/p><p>他回：九点。带电脑。<\/p><p><strong>两百个人<\/strong><\/p><p>4 月 24 日，上午九点。<\/p><p>周冉坐在厨房搬来的凳子上。阿凯请不了假，晚上再来。林拓从后台导出了一张表：最近三十天签名次数最多的两百个用户。<\/p><p>签名就是用指纹按一次。转账、换币、登录，都算。按得多，说明用得勤。<\/p><p>表上只有编号和地址。他们要一个一个看。<\/p><p>「看什么。」周冉说，「三列。他是谁。他拿信风干什么。他以前用什么。」<\/p><p>「怎么知道。」<\/p><p>「地址在链上是公开的，看他跟哪些合约打交道。注册的时候填了来源。用户群里说过话的，翻记录。提过工单的，翻工单。留了海外社交账号的，去看主页。」<\/p><p>「两百个。」<\/p><p>「两天。」她说，「你去年录视频录了六遍，也没嫌多。」<\/p><p>第一个用户。地址跟四个小合约有来往，都是同一个人部署的。工单里问过一次：能不能把信风接进他自己的应用里。周冉在第一列写：小应用开发者。<\/p><p>第二个。从一家交易所提出来的币，全放在信风。群里说过一句：我不放交易所。周冉写：不信任交易所的人。<\/p><p>第三个。自己跑了信风的四个后端服务，在群里贴过一份教程，讲怎么在一台小机器上把它们跑起来。周冉写：自托管。<\/p><p>第四个。大鹏。他拿信风干什么，周冉写了三个字：发红包。以前用什么，写了两个字：咔哒。<\/p><p>第九个。一个韩国用户，群里用翻译软件说过话，志愿者帮他答的。他做一个小工具站，想让用户不用装插件就能付钱。周冉写：小应用开发者。<\/p><p>第二十三个。地址三年前就有，很老。跟很多合约打过交道。去年十一月把所有东西都挪进了信风。群里说过一句话，很长。大意是：我不信任何一家交易所，我也不想背十二个词，你们是第一个让我两个都不用的。周冉写完第一列，停了一下，在第三列写：自己记词，记了三年。<\/p><p>第二十七个。一个日本用户，工单是日文的，志愿者翻的。他做一个小游戏，用户要装钱包插件，装不上就走了。他问能不能让玩家用指纹直接进。周冉写：小应用开发者。她在旁边画了一个圈。<\/p><p>到中午，看了四十个。下午看到九十。阿凯晚上来了，看了一遍表，说：「有一个问题。这九十个里面，没有一个是从星象那种地方来的。」<\/p><p>「什么意思。」<\/p><p>「他们一开始就没打算把币放在交易所。」<\/p><p>晚上周冉走了以后，他一个人又翻了一遍那九十行。他想起父亲的店。父亲不看账本也知道谁是谁：买水管的老张，修风扇的老头，隔壁开饭馆的每个月来买一次灯泡。二十几年，一个一个记在脑子里。他以前觉得那是小店才需要的本事。<\/p><p>第二天，剩下的一百一十个。<\/p><p>第一百四十三个。地址是一月内测那几天创建的，签名次数不多，但每周都有。注册来源那一栏写的是：邮件。<\/p><p>林拓看着那个地址，看了一会儿，去翻邮箱。<\/p><p>阿珍。<\/p><p>她去年八月回过他的邮件，说她重新开始攒钱了。她的钱包里现在有六千多块的稳定币，每个月转进去一笔，从来没转出去过。<\/p><p>周冉在第一列写：阿珍。第二列：存钱。第三列：一张纸。<\/p><p>她写完，没说话。<\/p><p><strong>三类人<\/strong><\/p><p>4 月 25 日晚上，表看完了。<\/p><p>周冉在冰箱那块磁贴板上写：<\/p><p>小应用开发者：68。<\/p><p>不信任交易所的人：71。<\/p><p>想自托管的人：34。<\/p><p>其他：27。<\/p><p>「其他」里有大鹏，有阿珍，有几个用来发红包的，有两个看不出是干什么的。<\/p><p>林拓看着这四行。<\/p><p>「星象的用户，」周冉说，「是想把钥匙交给别人的人。他们本来就把币放在交易所，交易所说你不用抄词了，他们说好。」<\/p><p>她敲了敲前三行。<\/p><p>「你的用户，是不想把钥匙交给别人的人。开发者不想让他的用户把钥匙交给交易所。不信任交易所的人，不用说。自托管的人，连你都不想信，要自己跑。」<\/p><p>「所以。」<\/p><p>「所以你们根本不在一条船上。」她说，「星象的『无助记词』，是把钥匙拿走替你保管。你的『无助记词』，是钥匙还在你手里，只是不用你记。这是两句话。你之前只说了前半句。」<\/p><p>阿凯在旁边说：「有一个问题。这个区别，用户看得出来吗。」<\/p><p>「看不出来。」周冉说，「所以首页得改。」<\/p><p>阿凯那天晚上装了星象的钱包，试了一遍。他在磁贴板上写了三行：<\/p><p>备份在哪：交易所的云。<\/p><p>开源吗：不。<\/p><p>能自己跑吗：不能。<\/p><p>「不是说他们不好。」他说，「他们的用户不需要这三条。你的用户只看这三条。」<\/p><p><strong>首页<\/strong><\/p><p>首页最上面那一行，从 2026 年 1 月开始就是：没有助记词的钱包。<\/p><p>现在星象也这么说。<\/p><p>林拓写了第一版：真正的无助记词。<\/p><p>周冉看了一眼。「『真正的』是跟人吵架。」<\/p><p>第二版：不把钥匙交给任何人的钱包。<\/p><p>「太长。而且『不』字开头，像在防谁。」<\/p><p>第三版他写了很久。写完他没给周冉看，先给了沈月。她在改作业，红笔停了一下。<\/p><p>「钥匙在你手里，也不用你记。」她念了一遍，「『也』字留着。」<\/p><p>「为什么。」<\/p><p>「『也』是接着前面说的。前面那句是别人说的，你接了一句。」她说，「没有『也』，就是两句话。有『也』，是一句话。」<\/p><p>他把这一行发给周冉。周冉回了一个字：行。<\/p><p>下面三行小字：开源。可自托管。不发币。<\/p><p>4 月 28 日，首页换了。<\/p><p>那天晚上他发了日志。三天空白之后的第一条，只有一行：首页改了。钥匙在你手里，也不用你记。<\/p><p>老船长在底下回：这句话是给人说的，不是给榜单说的。<\/p><p>大鹏回：早该这么写。<\/p><p>搜索引擎那边，「无助记词」这个词的广告位被星象买走了，信风从这个词来的人少了七成。周冉换了词。「自托管钱包」「开源钱包」「开发者钱包」。这几个词星象不买，因为星象的用户不搜这个。<\/p><p><strong>五月，六月<\/strong><\/p><p>五月，新增用户回到一天一百出头。<\/p><p>奇怪的是，一部分人是从星象那边过来的。他们在星象里用了指纹登录，然后去搜「钱包钥匙在谁手里」，搜到了信风首页。<\/p><p>用户群里多了一种人。他们进来第一句话是：你们的后端我能自己跑吗。<\/p><p>那个日本开发者六月初上线了他的小游戏，玩家用指纹进。他发来一封邮件，附了一张截图，一天四百个玩家。信风没收他一分钱。<\/p><p>6 月 27 日，夜航船的月聚。老船长照例让新人说第一问，然后忽然点了林拓。<\/p><p>「你的三问。」<\/p><p>林拓站起来。「第一问，谁付钱。不知道。」<\/p><p>茶馆里安静了一下。<\/p><p>「第二问，他们现在用什么凑合。抄十二个词，或者把币放交易所。第三问，凭什么比他们现在的好。钥匙在自己手里，也不用记。」<\/p><p>老船长点头。「三问答了两问。比上次多一问。」<\/p><p>「第一问呢。」有人问。<\/p><p>「还在看。」林拓说。<\/p><p>坐下的时候，周冉在他旁边低声说：「答得不错。就是最重要的那个没答。」<\/p><p>六月末，用户一万五千。活跃三千。<\/p><p>换币分成，六月一共九百块。他记在账本上，一笔一笔的，最大的一笔六块四。<\/p><p>公司开了以后多了几笔钱：社保、记账、服务器。咔哒每月一万出头，撑着家。存款九万。<\/p><p>林拓每天早上先看冰箱上的纸，再发日志。三天的空白他没补，就让它空在那儿。<\/p><p>阿珍的钱包六月又进了一笔。他没点开看数字，只看到那个地址亮了一下。<\/p><p>沈月的学期快结束了。她晚上在家写期末评语，一个孩子一段话，写完就看他。她说他这两个月回来了一点，但不多。他问什么叫回来，她说：吃饭的时候看我，就叫回来。<\/p><p><strong>6 月 30 日<\/strong><\/p><p>晚上八点。周冉把三张打印出来的表放在茶几上，一张一张摆开。<\/p><p>第一张：用户，15,000。<\/p><p>第二张：收入，¥900。<\/p><p>第三张：存款，¥90,000。<\/p><p>她坐下来，看着他。窗外天还没黑透，阳台上那把螺丝刀在桌上放着，沈月在厨房洗菜。<\/p><p>「你服务谁，你知道了。」她说，「谁付钱，你还不知道。」<\/p><p>他看着那三张纸。<\/p><p>「我们得谈谈第一问。」<\/p><aside class=\"log\"><div class=\"log-label\">航海日志<\/div><p>6 月 30 日。用户 15,000，活跃 3,000。月收入 900。存款 9 万。<\/p><p>四月星象上线一样的功能。我三天没发日志。<\/p><p>老船长问：大厂服务所有人，你服务谁。<\/p><p>我们把最活跃的 200 个用户一个一个看了：开发者 68，不信任交易所的 71，自托管 34。<\/p><p>周冉说：你的用户是不想把钥匙交给别人的人。<\/p><p>首页从「没有助记词」改成「钥匙在你手里，也不用你记」。<\/p><p>我还没回答第一问。<\/p><\/aside>", "words": 4812}, {"num": 25, "title": "用户不是钱", "vol": 3, "html": "<p>2026 年 5 月 6 日，凌晨四点零七分。<\/p><p>林拓坐在阳台的小桌前。屏幕上是信风的后台。用户数 14,362，比昨晚多了 118 个。他往下拉，看收入那一栏。换币分成，本月到现在：¥187。<\/p><p>外面的江还是黑的。楼下有人在卸货，铁架子碰地，一声一声。他把页面刷新了一下。用户数变成 14,363。收入那栏没动。<\/p><p>信风上线快两个月了。猎品榜第三，漏洞修好了，星象来了，首页也改了。用户一直在涨。钱没有。<\/p><p>他把电脑合上，回屋躺下。沈月背对着他睡着。他闭上眼，脑子里还是那张表。用户，一万四。收入，一百八十七。<\/p><p>睡不着。他又起来了。<\/p><hr><p>周冉的三张表还贴在冰箱上。用户 14,000，收入 600，存款 11 万。这是她四月底贴的，用的是宾馆里那种小磁铁。<\/p><p>「先做最简单的。」她说，「Pro 会员。咔哒有的，信风也上一个。」<\/p><p>三个人在出租屋的餐桌上定了方案。信风 Pro，¥30 一个月，¥299 一年。给的东西：多链的高级功能、地址簿、交易记录导出、优先回工单。阿凯问了一句「有一个问题」，问 Pro 用户和普通用户的合约有没有区别。林拓说没有，钱包本身一模一样，只是外面多几个按钮。阿凯说那行。<\/p><p>他花了九天做完。九个晚上。地址簿是最麻烦的，要加密存，要跟着通行密钥走，换了手机还得在。他改到第七天晚上才对。沈月每天十一点睡，他每天两点合电脑。中间那三个小时，家里只有阳台一盏灯和楼下偶尔过一辆车。<\/p><p>5 月 15 日上线。<\/p><p>上线第一天，付费 4 人。他认得其中两个，一个是夜航船的，一个是大鹏。<\/p><p>一周之后，付费 11 人。夜航船的 3 个，大鹏，剩下 7 个不认识。11 个人，¥330。<\/p><p>周冉在群里发了一句：「不是渠道问题。我们给 15,000 人推了弹窗，点开的 900 多，点进付费页的 210，付的 11。」<\/p><p>「弹窗文案改改？」林拓打字。<\/p><p>「改过两版了。」<\/p><p>林拓把手机放下，去看工单。<\/p><hr><p>工单里有人回复了那个弹窗。<\/p><p>第一条：「我放在里面的钱本来就不多，还要再交钱？」<\/p><p>第二条：「交了这个钱，能保证我的钱不丢吗？不能的话我交的是什么？」<\/p><p>第三条是英文的，翻过来意思差不多：「我不需要地址簿。我只需要它别出事。」<\/p><p>他把这三条截图，发到三人群里。<\/p><p>周冉半小时后回：「你看，他们不觉得自己在用一个软件。」<\/p><p>「那他们觉得在干什么？」<\/p><p>「放钱。」周冉说，「你去银行存钱，银行跟你说，交三十块一个月，给你一个高级版的存折。你交不交？」<\/p><p>林拓没回。<\/p><p>「他们觉得这钱像保护费。」周冉又打了一行，「不交，是不是我的钱就不安全了？交了，好像你在暗示原来不安全。两头都不对。」<\/p><p>阿凯：「有一个问题。咔哒为什么能收 Pro？」<\/p><p>「咔哒是工具。」周冉说，「转账、扫描、归集，人是来干活的。干活的人知道自己在用软件，用软件就付软件的钱。钱包不是。钱包是个地方。」<\/p><p>林拓盯着「钱包是个地方」这几个字看了很久。<\/p><p>他下楼去买烟。他不抽烟，走到便利店门口才想起来。就买了一瓶水。扫码，滴一声，六块钱出去了。收银员在看手机，没抬头。<\/p><p>他站在门口把水拧开。刚才那一下，他也没觉得自己在用软件。他就是付了个钱。<\/p><p>回去的电梯里，他想，那 15,000 个人，每天打开信风，看一眼余额，关掉。他们也没觉得自己在用软件。他们只是看了一眼自己的钱。<\/p><p>他打字：「那我们再换一种。」<\/p><hr><p>第二种是打赏。<\/p><p>按钮放在设置页最下面，一行小字：「请开发者喝杯咖啡。」点开可以选 ¥6、¥18、¥66，也可以自己填。<\/p><p>他做了两天。5 月 24 日上线。<\/p><p>两周，收到 ¥340。其中 ¥200 是一笔，备注是「大鹏」。大鹏在圈子里给他留言：「我又给你买咖啡了。两年了，你还欠我一杯。」<\/p><p>剩下 ¥140，来自 9 个人。<\/p><p>他给大鹏回：「Pro 你也买了。谢谢。」<\/p><p>大鹏：「Pro 我买了，但我说实话，我不会续。」<\/p><p>「为什么？」<\/p><p>「我不用地址簿啊。我钱放里面，能进能出，就够了。」大鹏说，「咔哒我年年续，那是干活的。信风这个，我说不上来。就像我不会给我的抽屉交年费。」<\/p><p>林拓看着「抽屉」两个字。<\/p><p>他算了一笔账。家里一个月一万八千五，沈月九千，他要出九千五。咔哒一万，够。但信风要自己活，按 ¥30 一个月算，要 317 个人每月付。活跃 3,000，就是十分之一的人。<\/p><p>现在是 11 个。<\/p><p>沈月晚上看到他在算这个，问：「这是什么？」<\/p><p>「打赏。」<\/p><p>「多少？」<\/p><p>「三百四。」<\/p><p>她没说什么，把筷子递给他。<\/p><hr><p>第三种是付费主题。<\/p><p>周冉一开始不同意。「主题是给闲人用的。你的用户闲吗？」<\/p><p>「试一下。」林拓说，「成本低。」<\/p><p>三套深色主题，一套 ¥12。他用了一个周末。6 月 1 日上线。<\/p><p>卖了 27 套，¥324。<\/p><p>第三天晚上，阿凯在群里发了一段话：「有一个问题。主题是从服务器拉下来的。如果有人改了主题包，能不能在页面里塞东西？我看了一下，理论上可以。」<\/p><p>林拓看完，把电脑打开，把主题功能整个下掉。二十七个已经买了的人，他一个个退款。退款要写理由，他写的是「功能下线」。<\/p><p>退款要一个一个点。第十九个的时候，他看到那个人的备注是「支持一下」。他停了几秒钟，点了退。<\/p><p>退完以后，他坐在阳台上，什么也没做。<\/p><p>三种，都不行。他把三种放在一张纸上，一条一条写：Pro，用户不觉得在用软件。打赏，一个月三百。主题，安全。三条下面他画了一条线，线下面什么也没写。<\/p><p>第二天早上那张纸还在桌上。沈月出门前看了一眼。她看了一会儿那条线，把纸放回原处，走了。他晚上回来，纸还在，只是被压在了那把螺丝刀底下。<\/p><hr><p>那几天他开始把账记得特别细。<\/p><p>这是他爸教的。以前在五金店，每天晚上关了卷帘门，他爸就在柜台后面翻开那本账，把当天的每一笔写上去。一颗螺丝五毛钱，也写。<\/p><p>他用的是一个表格。5 月：<\/p><p>咔哒，¥10,200。信风换币分成，¥900。Pro，¥330。打赏，¥340。主题，¥324，退了。<\/p><p>支出：房租 4,200，吃饭和日常 6,100，服务器和各种工具 4,300，公司的社保和记账 3,300，沈月她妈的生日礼物 800，杂七杂八 2,900。合计 ¥21,600。<\/p><p>沈月工资 9,000。他这边算上咔哒，¥11,770。<\/p><p>一个月过去，存款少了八百多。看起来不多。但信风的那一栏，去掉咔哒，是 ¥1,570。<\/p><p>咔哒才是那个撑着家的东西。他做了快两年的那个「店」，一个月一万块，安安静静地在那儿。他造了一年的「船」，一万五千人在上面，一个月九百块。<\/p><p>他把表格关了。<\/p><p>6 月 1 日，按夜航船的规矩，他在群里发了五月的收入截图。两张。咔哒 ¥10,200。信风 ¥1,570。<\/p><p>发完，他看着群。群里陆陆续续有人发。有人发 0，有人发 ¥2,800，小杜发了一个 0，后面加了一句「插件还没上线」。<\/p><p>老船长没发。他半退休，群里默认他不用发。<\/p><p>有人在林拓的截图下面回：「信风都一万五千用户了吧？才这么点？」<\/p><p>林拓回：「嗯。」<\/p><p>那人又说：「那你怎么不做广告？」<\/p><p>周冉替他回了：「钱包里放广告，你敢用吗？」<\/p><p>那人没再说话。<\/p><hr><p>失眠是从五月下旬开始的。<\/p><p>不是睡不着。是睡到三点多，醒了，然后就再也睡不回去。<\/p><p>醒了以后他先看手机。后台的用户数，每天早上都比前一天多一两百。这个数字很好看。他看一会儿，然后去看收入。收入不动。<\/p><p>然后他就起来，去阳台。<\/p><p>阳台那张小桌子，是四年前搬来的时候沈月从二手网站上买的。桌腿有一条短了一点，他垫了两张纸。桌上一把旧螺丝刀，他爸的，木头把子磨得发亮。<\/p><p>他坐在那儿，把后台开着。刷新。用户数加一。刷新。收入没动。<\/p><p>凌晨四点，江对岸的楼一栋一栋亮起来。他知道那是写字楼在开灯，保洁上班了。<\/p><p>有一天他给自己写了个小脚本，每小时把用户数发到手机上。第二天早上他看到手机里二十几条通知，全是数字。他把脚本删了。删了以后，手还是去点后台。<\/p><p>有时候他会把那把螺丝刀拿起来，在手里转。转几下，放下。再拿起来。<\/p><p>有一天晚上，他回头，桌角多了一杯水。温的。他没听见沈月什么时候出来过。<\/p><p>有一天早上沈月起来上厕所，看到阳台的灯亮着。她站在门口看了一会儿。<\/p><p>「几点了？」<\/p><p>「四点多。」<\/p><p>「你睡了吗？」<\/p><p>「睡了。」<\/p><p>她没再问，回屋了。<\/p><hr><p>6 月 9 日，周三，晚饭。<\/p><p>沈月做了番茄炒蛋和一个青菜汤。她说学校下周要搞一个阅读节，让她班上排一个课本剧。有个男孩子非要演大灰狼，因为大灰狼台词最多。<\/p><p>「嗯。」<\/p><p>她说，那男孩子平时上课一句话都不肯说，一到演戏就来劲。她想给他多加两句词。<\/p><p>「嗯。」<\/p><p>「你听到我说什么了吗？」<\/p><p>「嗯。」<\/p><p>「我说什么？」<\/p><p>他抬起头。她看着他。他张了张嘴。<\/p><p>「大灰狼。」他说。<\/p><p>她把碗端起来，去了厨房。水龙头开了，很久没关。<\/p><p>他坐在桌前。手机在旁边，屏幕暗着。他没拿。<\/p><p>过了一会儿她出来，擦手，站在他旁边。<\/p><p>「你现在不跟我说话了。」她说。<\/p><p>「我在说。」<\/p><p>「你在嗯。」<\/p><p>他没接。<\/p><p>「不是今天。」她说，「一个多月了。你吃饭在看后台，你躺下了脑子在算账。我在你旁边，你不在。」<\/p><p>她说完，回了卧室。门没关。<\/p><p>他在客厅坐了很久。后来他去把碗洗了。洗了两遍。<\/p><hr><p>6 月 10 日，他在群里发了一条长的。<\/p><p>「Pro：11 人。打赏：340。主题：324，下掉了。三种都试了。我想再试一种，按交易量收，用得多的人多交一点。」<\/p><p>周冉隔了很久才回。<\/p><p>「你已经试了三个。」<\/p><p>「第四个不一样。」<\/p><p>「问题不在方案。」她说，「你换十个方案，用户还是那个用户。他们放钱进来，是因为你说钥匙在他们手里。你现在跟他们要钱，他们就会想，那钥匙到底在谁手里？」<\/p><p>阿凯没说话，发了一个「+1」。<\/p><p>林拓打了一行又删掉。打了一行又删掉。<\/p><p>老船长那天下午在夜航船群里发了一句，不知道是不是说给他的：「墙就在那儿。你用肩膀顶，顶一天，墙不动，你肩膀肿了。这不叫坚持，这叫没看清那是一堵墙。」<\/p><p>有人在下面问：「那怎么办？」<\/p><p>老船长：「绕。或者找门。反正不是顶。」<\/p><p>林拓把这句话截了图。没存。删了。<\/p><hr><p>那一周，小杜给他发了一条私信。<\/p><p>小杜比他小两岁，还在云梯。去年裁员的时候留下来了，现在做的还是那些接口。方哲还是他们的总监。小杜说方哲现在开会更多了，一天四个。<\/p><p>小杜前年跟着他去了夜航船，答三问的时候答得磕磕巴巴，老船长也让他进了。他现在做的是一个小的翻译插件，用了三个月，还没上线。他每次发进度，都会@林拓一下。<\/p><p>「拓哥，我也想辞职。」<\/p><p>后面跟了一句：「我看你做得挺好的。」<\/p><p>林拓看了这条消息。用户 15,000。做得挺好的。<\/p><p>他把手机翻过去，扣在桌上。<\/p><p>第二天小杜又发了一句：「你觉得呢？」<\/p><p>他还是没回。他不知道回什么。说别辞？他自己就是辞的。说辞？他这个月信风收了一千五。<\/p><p>手机在桌上，翻着，一直到晚上。<\/p><hr><p>6 月中，用户过了 15,000。活跃 3,000。周冉把冰箱上的三张表撕了，换了一张新的，只有一行：<\/p><p>「用户 15,000。活跃 3,000。分成 900。」<\/p><p>下面没写存款。她说：「你自己知道。」<\/p><p>他知道。9 万。<\/p><p>那天晚上他做了一件事。把信风的付费页从首页导航里撤下来了。Pro 还在，但藏到设置里，不推了。已经付的 11 个人，他一个个发了邮件，问要不要退。有 8 个人说不用，留着。一个人回了一句：「留着。你们别倒了就行。」<\/p><p>他把这封邮件读了三遍。<\/p><p>那天夜里他没看信风的后台。他打开了咔哒的。十四个工具，九种语言，日访客一千出头。Pro 续费的提醒一条一条，¥299，¥299，¥299。没人问他为什么要收钱。他们来干活，干完活，走。<\/p><p>他想起他爸的店。有人进来，买一把扳手，付钱，走。没人问为什么扳手要钱。<\/p><p>他把两个后台并排放着，看了一会儿。左边是店，右边是船。店在挣钱。船上有一万五千个人。<\/p><p>他关了电脑。<\/p><hr><p>6 月 17 日，晚上十一点。<\/p><p>他还在阳台。后台开着。沈月已经睡了。<\/p><p>手机震了。是郑浩。<\/p><p>他们上一次通电话是去年七月。郑浩在深圳，做 AI 客服，融了两千万。那次郑浩来杭州，说帮他融五百万，发个币。他没同意。郑浩说，你会后悔。<\/p><p>之后郑浩偶尔在朋友圈发一些照片，办公室、团建、路演。今年以来发得少了。<\/p><p>林拓接了。<\/p><p>「拓子。」<\/p><p>郑浩的声音不对。不是喝醉那种不对。是慢。郑浩说话从来不慢。<\/p><p>「嗯。」<\/p><p>「你在杭州吗？」<\/p><p>「在。」<\/p><p>那边安静了几秒钟。他听见郑浩那边有风的声音，像是在外面。<\/p><p>「我想喝酒。」郑浩说。<\/p><aside class=\"log\"><div class=\"log-label\">航海日志<\/div><p>6 月 10 日。<\/p><p>试了三种付费。Pro，11 个人。打赏，340。主题，卖了 27 套，又全退了。<\/p><p>周冉说，钱包用户不觉得自己在用软件，觉得自己在放钱。跟放钱的人要钱，像收保护费。<\/p><p>用户不是钱。这句话我两年前就听过。今天才懂。<\/p><p>不试第四种了。先找到那扇门。<\/p><\/aside>", "words": 4895}, {"num": 26, "title": "郑浩", "vol": 3, "html": "<p>2026 年 6 月 18 日，晚上九点。杭州东站。<\/p><p>郑浩从出站口出来，背一个黑色双肩包，没有行李箱。他穿一件灰 T 恤，头发比去年短，人比去年瘦。林拓站在柱子边上，看见他，抬了一下手。<\/p><p>「就这些？」林拓看他的包。<\/p><p>「就这些。」<\/p><p>两个人上了地铁。一路没怎么说话。郑浩靠在车门上，看窗外黑掉的隧道。他的手机响了一下，他看了一眼，递给林拓。<\/p><p>是一条消息。「浩哥，今天没来得及说。谢谢你。我学到很多。」<\/p><p>「实习生。」郑浩说，「来了四个月。今天最后一天，我连转正都没给他办。」<\/p><p>他把手机收回去，没回。到滨江的时候，他说：「不去店里。找个能坐的地方。」<\/p><p>林拓带他去了江边。出租屋走过去十五分钟，有一段步道，台阶下去就是水。他们在便利店买了两提啤酒，一包花生，一包鸭脖。收银员问要不要袋子，郑浩说要，两个。<\/p><hr><p>去年七月，郑浩也来过杭州。那次他住在滨江最贵的酒店，拉林拓在江边吃大排档，说要帮他融五百万，发个币，一年上所。林拓没答应。郑浩说，你会后悔。<\/p><p>那时候郑浩的公司刚拿完 A 轮，两千万，做 AI 客服。团队从五个人涨到二十几个，办公室在深圳南山，六百平。他给林拓看过照片，落地窗，工位一排一排，墙上写着「让每一次对话都有价值」。<\/p><p>今天早上十点，郑浩在那间办公室里开了最后一次全员会。四十个人。他念了一份说明，三段话。念完，问有没有问题。没有人问。然后大家开始收拾东西。<\/p><p>「两千万。」郑浩拉开一罐啤酒，「二十三个月。」<\/p><p>林拓没说话。<\/p><p>「上个月还剩六十万。发不出下个月工资。我找了三个投资人，都说再看看。再看看，就是不看了。」他喝了一口，「最后那个月的工资，我自己借了四十万发的。遣散是按法律走的，能走的都走了。有几个老员工不要，说给公司留着。我说公司没了，留给谁。」<\/p><p>「借谁的？」<\/p><p>「我爸妈，还有以前一个老板。」<\/p><p>他喝了一口。「有个后端，跟了我两年。今天下午最后走的。他走之前把所有服务器的账号密码整理成一份文档，打印出来，放我桌上。上面写着：记得关，不然还扣钱。」<\/p><p>「关了吗？」<\/p><p>「明天关。」郑浩说，「今天我不想看那个后台。」<\/p><p>江上有一艘货船慢慢过去，灯很暗。<\/p><p>「钱到账那天，」郑浩说，「我们在办公室开了一瓶香槟。二十几个人，一人一口。我发了朋友圈。你看到了吧。」<\/p><p>「看到了。」<\/p><p>「你第一笔钱是多少？」<\/p><p>「一百三十七。」<\/p><p>「块？」<\/p><p>「块。手续费。」林拓说，「那天晚上我看了半个小时，没敢动。怕是错的。」<\/p><p>郑浩想了想，说：「我那两千万到账，我看了两分钟。然后就开始想怎么花。」<\/p><hr><p>「你知道我这两年在干什么吗？」郑浩说。<\/p><p>林拓摇头。<\/p><p>「开会。」<\/p><p>他掰着手指头数。每周一，管理层会，两小时。每周三，产品评审。每周五，跟投资人同步进展，做一份 PPT。每个月，董事会，一份更大的 PPT。每个季度，融资材料更新。<\/p><p>「招人。」他说，「招一个人，三轮面试，我自己面最后一轮，一个人一小时。最多的时候我一周面二十个。四十个人里，写代码的九个。销售十二个，运营六个，行政财务人事五个，剩下的是管这些人的人。」<\/p><p>「我做 PPT 的时间，比我看产品的时间多。」他说，「我们的东西卖给企业，企业买了给他们的客户用。我见过的人是什么人？采购。老板。投资人。财务。」<\/p><p>他停了一下。<\/p><p>「我做了两年，从来没见过一个真实用户。」<\/p><p>林拓把手里的啤酒放在台阶上。<\/p><p>「一个都没见过？」<\/p><p>「有一次差点见到。」郑浩说，「一个客户的客服主管，坐高铁来我们公司，说要当面说问题。那天我在见投资人。我让产品经理接待了。他走了以后，产品经理跟我说，他说我们的机器人把他们一个老客户气跑了。我说，那就改。改什么，我没问。」<\/p><p>「一个都没见过。」他又说，「我知道他们在哪。数据后台里有。每天多少对话，多少解决，多少转人工。我看的是数字。我没跟他们说过一句话。我不知道他们长什么样，不知道他们用我们的东西的时候在骂什么。」<\/p><p>「那你们改产品靠什么？」<\/p><p>「靠采购说什么。靠投资人说什么。」他笑了一下，「投资人说，你们要做大客户，我们就去做大客户。做了半年，签了三个，都是试用。投资人说，你们要做增长，我们就招了十二个销售。销售一个月十几万成本，签回来的单，一年八万。」<\/p><p>「然后？」<\/p><p>「然后钱就没了。」<\/p><hr><p>郑浩问他：「你呢？」<\/p><p>林拓想了一下。「信风上线三个月。用户一万五。」<\/p><p>「一万五？」郑浩坐直了，「真的？三个月？」<\/p><p>「嗯。」<\/p><p>「收入呢？」<\/p><p>「九百。」<\/p><p>「九百什么？」<\/p><p>「九百块。一个月。」<\/p><p>郑浩看着他。看了大概三秒钟。然后他笑了，先是憋着，后来憋不住，靠在台阶上笑，肩膀一抖一抖的。林拓看着他笑，自己也笑了。两个人在江边台阶上笑了快一分钟，旁边遛狗的人回头看了一眼。<\/p><p>「你一万五千个人，」郑浩喘着气说，「收九百。」<\/p><p>「嗯。」<\/p><p>「我两千万，一个人都没见过。」<\/p><p>「嗯。」<\/p><p>「咱俩。」郑浩把啤酒举起来，碰了一下林拓那罐，「咱俩真行。」<\/p><p>笑完，郑浩问：「你见过的用户，你记得几个？」<\/p><p>林拓想了想。大鹏，三百个地址，第一个付钱的人。山田，日本的，发邮件报 bug，客气得像在道歉。阿珍，大学生，丢了八万，实习工资和奖学金。0xRain，不知道长什么样。还有那个买了主题又被退款、备注「支持一下」的人。<\/p><p>「十几个。」他说，「名字都记得。」<\/p><p>「阿珍是谁？」<\/p><p>林拓讲了。去年六月，一个女孩子丢了助记词，八万块，攒了两年。她在圈子里发帖，没人能帮她。他看到那个帖子，那天晚上开始想信风。<\/p><p>郑浩听完，很久没说话。<\/p><p>「你记得她的名字。」他说。<\/p><hr><p>花生吃完了。郑浩把袋子叠成一个方块，塞进口袋。<\/p><p>「去年我跟你说，你会后悔。」他说。<\/p><p>「嗯。」<\/p><p>「你现在后悔吗？」<\/p><p>林拓想了一会儿。「不知道。有时候。」<\/p><p>「我也不知道。」郑浩说，「我以为我今天会后悔。早上开完会，我一个人在办公室坐了两个小时。我想，要是当初不融那笔钱，五个人做，慢一点，会怎么样。想了两个小时，没想出来。」<\/p><p>「为什么？」<\/p><p>「因为我不是那种人。」郑浩说，「五个人做，慢一点，一个月赚一万，我做不了。我坐不住。我需要有人跟我一起，需要有事情在变大。我看你那个日志，天天发，一天说一句，两年了。我做不到。我三天不开会就慌。」<\/p><p>他看着江面。<\/p><p>「你那条路适合你。我那条不适合我。」他说，「但我当时以为只有那一条。」<\/p><p>林拓没接话。<\/p><p>「所有人都在讲那一条。」郑浩说，「融资，扩张，上市，退出。你不走那条，就好像你没在创业，你在过家家。我去年跟你说那些话，我是真的觉得你在过家家。」<\/p><p>「现在呢？」<\/p><p>「现在我觉得，你至少见过你的用户。」<\/p><hr><p>「你跟嫂子什么时候结婚？」郑浩忽然问。<\/p><p>「不知道。」<\/p><p>「别等钱。」郑浩说，「我等了两年，等公司做起来再结。现在公司没了，人也走了。三月走的。我没跟你说。」<\/p><p>林拓看着他。郑浩摆摆手，意思是别问。<\/p><p>十一点多，江边的人少了。风从水上过来，有一点凉。郑浩把第二提的最后一罐拉开。<\/p><p>「你们那个群，」他说，「夜航船，是吧。进群要答三个问题。」<\/p><p>「嗯。」<\/p><p>「哪三个？」<\/p><p>林拓说了。谁会为它付钱。他们今天在哪儿、正在用什么凑合。你凭什么比他们现在的办法好。<\/p><p>郑浩听完，把三个问题重复了一遍。他说：「我们公司要是进这个群，一个都答不上来。谁付钱？我们说企业。哪个企业？不知道。他们现在用什么？人工客服。凭什么比人工好？便宜。便宜多少？我们从来没算过。」<\/p><p>他转过来看林拓。<\/p><p>「你答一下。」<\/p><p>「答什么？」<\/p><p>「信风。第一问。谁会为它付钱？」<\/p><p>林拓张了张嘴。「用户。」<\/p><p>「哪些用户？」<\/p><p>「放钱进来的人。」<\/p><p>「他们付了吗？」<\/p><p>林拓没说话。<\/p><p>「你上个月收九百。」郑浩说，「一万五千个人，九百块。这不叫付钱。」<\/p><p>林拓看着水面。他想说 Pro，想说打赏，想说主题。他没说。<\/p><p>「我不知道。」他说。<\/p><p>郑浩点了点头，没笑。<\/p><p>「你比我强。」他说，「你知道你不知道。我当时不知道我不知道。」<\/p><hr><p>回到出租屋是十二点半。沈月没睡，在客厅看书。看到郑浩，她站起来，说沙发铺好了。<\/p><p>「嫂子，麻烦了。」<\/p><p>「不麻烦。」沈月说，「热水器开着，毛巾在架子上。」<\/p><p>郑浩洗了澡出来，坐在沙发上，看着阳台。「你就在那儿写代码？」<\/p><p>「嗯。」<\/p><p>「一张桌子。」<\/p><p>「一张桌子。」<\/p><p>郑浩看了一会儿，躺下了。「我那六百平，明天就退了。」他说，「押金还能拿回来一点。」<\/p><p>林拓关了灯。<\/p><p>他没去阳台。他躺在沈月旁边，眼睛睁着。外面郑浩翻了个身，沙发响了一下。<\/p><hr><p>第二天早上，沈月煮了面，三碗。郑浩吃得很快，吃完把碗洗了。他说要回深圳，注销公司要跑好几个地方，社保、税务、银行，一个一个来。<\/p><p>吃面的时候郑浩问沈月：「嫂子，他天天这样，你怎么看？」<\/p><p>沈月说：「我看他吃不吃饭。」<\/p><p>郑浩看了林拓一眼，没再问。<\/p><p>「你接下来干什么？」林拓问。<\/p><p>「先把这些跑完。」郑浩说，「然后不知道。歇一阵。我爸妈那四十万得想办法还。」<\/p><p>他背上包，在门口停了一下。<\/p><p>「拓子。」<\/p><p>「嗯。」<\/p><p>「你那个第一问，想出来了告诉我。」<\/p><p>「行。」<\/p><p>门关上。林拓站在门口听他下楼，脚步声一层一层往下，然后没了。<\/p><p>沈月在厨房里说：「他瘦了好多。」<\/p><p>林拓说：「嗯。」<\/p><p>「你也是。」她说。<\/p><hr><p>那天他发了日志。6 月 19 日。发完没有看回复。<\/p><p>接下来的三个星期，他没做出什么新东西。信风的用户还在涨，每天一两百。收入那栏还是那样。他把 Pro 藏起来了，换币分成六月到最后是 ¥900。<\/p><p>老船长在群里私信他：「郑浩那边，人没事就行。公司是船，人是人。」他回了个「嗯」。老船长又说：「你最近日志短了。」他没回。<\/p><p>他把三问抄在一张纸上，贴在阳台的墙上。第一问后面是空的。第二问他写了「插件钱包、交易所」。第三问他写了「不用记助记词」。写完看着第一问，看了很久。<\/p><p>有天晚上他把那张纸撕下来，揉了。第二天早上又展开，用胶带贴回去。纸上多了几道褶子，第一问后面还是空的。<\/p><p>周冉知道了郑浩的事。她在群里说：「两千万烧二十三个月，正常。我以前那家，一个季度烧这个数。烧完继续融，融不到就散。我见过四次。」<\/p><p>「你觉得他错了吗？」林拓问。<\/p><p>「我不评价。」周冉说，「那条路有人走通了，我见过。但我也知道，走通的人，账上有一万五千个真用户的，一个都没有。」<\/p><p>阿凯发了一句：「有一个问题。他的用户数据后台，现在谁在管？」<\/p><p>没人回答。<\/p><p>郑浩偶尔发消息。「税务跑完了。」「银行账户销了。」「今天把办公室的绿植送人了，三十几盆，搬了一下午。」都是一句话，没有表情。林拓每条都回，回的也是一句话。<\/p><p>7 月 5 日，郑浩发来一张照片。一个空房间，落地窗，地上有一圈圈桌子留下的印子。<\/p><p>「退了。」<\/p><p>林拓看着那张照片。他想起去年郑浩给他看的那张，工位一排一排，墙上写着字。<\/p><p>他回：「嗯。」<\/p><p>想了想，又加了一句：「回来喝酒。」<\/p><p>「等我还完钱。」<\/p><hr><p>7 月 8 日，晚上。<\/p><p>他跟沈月一起吃了饭。她说了阅读节的事，那个演大灰狼的男孩子，多加的两句词说得比谁都响。林拓这次听着，说：「他后来呢？」<\/p><p>沈月看了他一眼。「后来他妈来接他，他说他明年还要演。」<\/p><p>「嗯。」<\/p><p>「你今天听了。」她说。<\/p><p>他没说话，去洗碗。<\/p><p>洗完碗他站在阳台门口，没进去。墙上那张纸还贴着。他看了一眼，回了屋。<\/p><p>夜里他没去阳台。躺下的时候是十二点。三点多醒了一次，看了一眼手机，用户数 16,780。他把手机扣过去，又睡了。<\/p><hr><p>7 月 9 日，凌晨四点二十。<\/p><p>手机在床头震。不是闹钟。是电话。<\/p><p>屏幕上是「妈」。<\/p><p>他妈从来不在这个时间打电话。她说过，晚上十点以后打电话的都是出事的。<\/p><p>他坐起来，接了。<\/p><p>「崽。」他妈的声音很急，还有别的声音，走廊，推车，有人在喊什么。「你爸住院了。刚才他起来刷牙，牙刷拿不住，掉了两次。我说你怎么了，他说没事。我一看他嘴有点歪，讲话有点不清。我就叫了车。现在在县医院，医生说是中风，轻的，轻的，你别急。医生说要住几天看看。你爸不让我打电话给你，说你忙。我说忙什么忙。你回来一趟。」<\/p><p>她一口气说完，喘了一下。<\/p><p>「你爸右手现在抬不起来。」她说，「他不让我说。」<\/p><p>林拓握着手机。沈月醒了，坐起来，看着他。<\/p><p>「我马上回。」他说。<\/p><aside class=\"log\"><div class=\"log-label\">航海日志<\/div><p>6 月 19 日。<\/p><p>老同学的公司没了。两千万，四十个人，二十三个月。<\/p><p>他说他两年没见过一个真实用户。我说我一万五千个用户，一个月收九百。我们笑了很久。<\/p><p>他问我信风谁付钱。我答不出。<\/p><p>他说我比他强，因为我知道我不知道。我不确定这算不算强。<\/p><\/aside>", "words": 4821}, {"num": 27, "title": "五金店", "vol": 3, "html": "<p>2026 年 7 月 9 日，中午十二点四十。上饶县医院，三楼神经内科。<\/p><p>林拓从杭州坐最早一班高铁，转了一次车，又坐了四十分钟大巴。到医院的时候，衬衫后背全湿了。<\/p><p>病房六张床。他爸在靠窗那张。人躺着，眼睛睁着，看天花板。右手放在被子外面，手指微微弯着，像握着什么，又什么都没握。<\/p><p>「崽来了。」他妈说。<\/p><p>他爸把头转过来。嘴角左边比右边低一点。他看了林拓一眼，说：「回来干什么。」<\/p><p>声音有点含，但听得懂。<\/p><p>「看你。」<\/p><p>「有什么好看的。」他爸把头转回去，「店谁看？」<\/p><p>他妈说：「关门了。」<\/p><p>他爸没说话。过了一会儿，说：「关一天，少一天的钱。」<\/p><hr><p>医生说是轻度的。血管堵了一小块，来得早，溶掉了。右手要恢复，三个月左右，要练。嘴会好得快一点。以后烟要戒，酒要戒，盐要少。<\/p><p>他爸听到「烟要戒」，没吭声。<\/p><p>晚上林拓在病房陪床。他妈回家拿东西。他爸睡了，呼吸很重。他坐在走廊的椅子上，给沈月打了个电话。<\/p><p>「怎么样？」<\/p><p>「轻的。手不太好。」<\/p><p>「你吃饭了吗？」<\/p><p>「嗯。」<\/p><p>「吃了什么？」<\/p><p>他想了一下。「面。」<\/p><p>她那边安静了一会儿。「照顾好你爸。」她说，「也照顾好你自己。」<\/p><p>「嗯。」<\/p><p>挂了以后他坐着，没动。走廊尽头的灯一闪一闪的。<\/p><p>住了四天。第四天下午出院，林拓扶他下楼。他爸不要扶，自己走，走得很慢，右脚有点拖。到医院门口，他停下来，喘了一会儿，说：「回店里。」<\/p><p>「先回家。」<\/p><p>「回店里。」<\/p><p>回了店里。卷帘门拉起来，一股铁和机油的味道。货架一排一排，跟林拓小时候一模一样。柜台后面那张凳子，他爸坐下去，左手扶着柜台，右手放在腿上。他坐在那儿，看了店里一圈。<\/p><p>「好了。」他说，「开门。」<\/p><hr><p>「建国五金」在县城老街上，临街，一开间，往里深。门口摆的是常用的：胶带、水管接头、锁、灯泡。往里走，一排排货架，螺丝按大小分在几十个塑料格子里，每个格子贴着手写的标签。最里面是电动工具，钻，切割机，一排。<\/p><p>柜台上有一本账。硬皮的，旧了，边角卷起来。他妈管这本账，他爸管店。但记账的时候，都是他爸念，他妈写。<\/p><p>他爸右手拿不住笔了。<\/p><p>第一天晚上关门，他爸坐在柜台后面，说：「记账。」<\/p><p>林拓把账本翻开。今天的：一卷生料带，三块。一个水龙头，三十五。两个插座，十六。一把锁，四十八。一包螺丝，五块。<\/p><p>「一共一百零七。」他妈说。<\/p><p>「写。」他爸说。<\/p><p>林拓写。他写得快，他爸看着。<\/p><p>「慢点。」他爸说，「一笔一笔写清楚。以后翻回来要看得懂。」<\/p><p>林拓放慢了。写完，他爸伸左手过来，把账本转过去，看了一遍。<\/p><p>「明天你看店。」他说，「我坐着。」<\/p><hr><p>第二天早上七点开门。<\/p><p>他爸坐在柜台后面。林拓站着。来的第一个人是隔壁修车铺的老板，要一根钢丝绳。林拓不知道在哪。他爸用左手指了一下，靠墙那边，第三排。<\/p><p>第二个是个女的，要一个灯泡。第三个是个中年男人，进来就说：「建国，听说你住院了？」<\/p><p>「没事。」他爸说。<\/p><p>「手怎么了？」<\/p><p>「没事。」<\/p><p>那人看了他爸一眼，没再问。他在店里转了一圈，拿了一个水管接头，问多少钱。他爸说八块。那人放下十块，说不用找，走了。<\/p><p>他爸让林拓把两块钱记在账本上，另起一行：「老刘多给的，两块。」<\/p><p>下午来了个年轻人，二十几岁，要买电钻。林拓拿了两款给他看。年轻人拿手机拍了一下型号，查了一会儿，说：「网上便宜八十。」<\/p><p>「那你网上买。」他爸说。<\/p><p>年轻人愣了一下。<\/p><p>「网上便宜八十，坏了你寄回去，等一个星期。」他爸说，「在我这买，坏了你拎过来，我给你看。」<\/p><p>年轻人站了一会儿，把贵的那款买了。走的时候说：「那坏了我真拎过来。」<\/p><p>「拎。」他爸说。<\/p><hr><p>上午十点多，进来一个老头。七十多岁，穿一件背心，手里拿着一颗螺丝。<\/p><p>「建国。」<\/p><p>「老陈。」<\/p><p>「这个，有没有？」老头把螺丝放在柜台上。<\/p><p>他爸看了一眼，左手拿起来，转了转。「六毫米的。」他跟林拓说，「第二排，左边数第四格。」<\/p><p>林拓找到了。拿了一颗出来。<\/p><p>老头接过去，问：「多少钱？」<\/p><p>「拿走。」他爸说。<\/p><p>老头也没客气，把螺丝揣进口袋，跟他爸说了两句话，什么时候修的房顶，儿子什么时候回来。说完走了。<\/p><p>林拓看着他走出门。<\/p><p>「不收？」<\/p><p>「一颗螺丝收什么。」他爸说。<\/p><p>「他要是每天来拿一颗呢？」<\/p><p>他爸看了他一眼。<\/p><p>「他在我这买了二十年东西。」他爸说，「他家的水龙头、锁、电线，全是我这的。一颗螺丝。」<\/p><p>林拓没再问。他把账本翻开，想了想，没记。他爸说：「记。写零。」<\/p><p>他写了：「老陈，螺丝一颗，零。」<\/p><p>四天以后老陈又来了。这次是买锁，一把四十八块的，付了钱。他爸跟他说了两句房顶的事。老陈走了以后，他爸也没说什么，看了林拓一眼。<\/p><p>林拓把账记上。「老陈，锁一把，四十八。」<\/p><hr><p>在店里的第三天，他开始用手机回信风的工单。<\/p><p>店里不忙。一天几十个人，中间有很长的空。他爸坐着，有时候闭眼，有时候看门口。林拓站在柜台边上，手机开着后台。<\/p><p>工单不多，一天十几条。大部分是问怎么加备用钥匙，怎么换手机。他一条一条回。<\/p><p>有一条是英文的。发件人在新加坡。他说他们是一个三个人的小团队，做一个链上的小游戏。他问：能不能把信风嵌到我们的游戏里？我们的玩家不想装钱包插件。<\/p><p>林拓看了一眼。这种问题以前也有过，问能不能接、能不能改、能不能定制。他一般都回「以后考虑」。<\/p><p>他回了：「可以研究。」<\/p><p>发出去，把手机放下。柜台前来了一个人，要一把美工刀。<\/p><p>他没再想那条工单。<\/p><hr><p>老陈来的第二天，又有人来。是另一个老头，拎着一台落地扇。<\/p><p>「建国，这个不转了。」<\/p><p>「放这。」<\/p><p>老头把风扇放在柜台边上。他爸看了一眼，跟林拓说：「你来。」<\/p><p>「我不会修风扇。」<\/p><p>「我说你做。」<\/p><p>林拓把风扇放倒。他爸说，先把后罩拆了。四颗螺丝，十字的。林拓从柜台底下拿了螺丝刀。他爸说，不是那把，那把太大，你拿小的。<\/p><p>后罩拆了。他爸说，看电机后面，有个小孔，滴两滴油进去。林拓找到了小孔。他爸说，别滴多，两滴。<\/p><p>滴了。他爸说，用手转一下扇叶。林拓转了。开始有点涩，转了几圈，顺了。<\/p><p>「装上。」<\/p><p>装上了。插电。风扇转起来了，一档，二档，三档。风吹在老头脸上，老头笑了。<\/p><p>「多少钱？」<\/p><p>「拿走。」他爸说。<\/p><p>老头拎着风扇走了。走的时候说：「下次买灯泡来你这。」<\/p><p>林拓收拾螺丝刀。他说：「这个修一下，外面要收二十。」<\/p><p>「他下次买东西还来。」他爸说。<\/p><p>「就为了这个？」<\/p><p>「不然为什么。」他爸说，「灯泡哪都有卖。他来我这，不是为灯泡。」<\/p><p>林拓把螺丝刀放回去。他忽然想到，去年十一月，周冉说过一句差不多的话。她说的是「客户成功」，说企业软件卖出去以后要一直帮客户用起来，这样他们才续费。她说的时候用了一堆词。他爸说的是：他下次还来。<\/p><hr><p>晚上他住在小时候的房间。床还是那张，短了，脚伸不直。<\/p><p>三点多他醒了。习惯。他拿起手机看后台，用户 17,400。收入那栏，本月到现在 ¥610。他看了一会儿，把手机放下，躺着。<\/p><p>五点不到，他听见外面有动静。他爸起来了。走路的声音，一步一拖。然后是水声，他在洗脸。然后是门开了又关。<\/p><p>林拓看了一眼时间。五点十分。店七点开门。<\/p><p>他起来，跟着去了。他爸已经把卷帘门拉起来一半，用左手，拉得很慢。林拓过去帮他拉上去。他爸没说话，进去开灯。<\/p><p>「你不用来这么早。」林拓说。<\/p><p>「习惯了。」<\/p><p>他爸每天下午要练手。医生教的，捏一个软球，一次五十下。他捏的时候脸绷着，捏到三十几下手就抖。<\/p><p>林拓在旁边看。他爸说：「看什么。看店。」<\/p><p>他妈把午饭送过来，在店里吃。他妈话多，一边吃一边说。谁家孩子考上了什么，谁家的店转让了，隔壁镇上新开了个大的建材市场，生意分走一半。<\/p><p>「以前一天两三百，现在一天一百多。」他妈说，「你爸不肯搬。」<\/p><p>「搬什么。」他爸说，「老主顾都在这。」<\/p><p>「老主顾也会老。」他妈说。<\/p><p>他爸不说话，用左手夹菜。<\/p><p>林拓说：「我给店做个小程序吧。老主顾要什么，手机上说一声，你送过去。」<\/p><p>他爸摇头。「他们要什么，走过来说一声就行。」<\/p><p>「那要是走不动了呢？」<\/p><p>他爸想了一下。「那我送过去。」<\/p><p>吃完饭他妈收拾碗，跟林拓说：「你爸的病，医生说跟累有关系。一个人守一个店，二十几年，没歇过。你劝劝他，招个人。」<\/p><p>「招人要钱。」他爸在旁边说。<\/p><p>他妈叹了口气，拎着饭盒走了。<\/p><hr><p>周冉打过一次电话。他走到店门口接。<\/p><p>「你爸怎么样？」<\/p><p>「好一点。」<\/p><p>「你什么时候回？」<\/p><p>「二十五号。」<\/p><p>「行。」她停了一下，「第一问，你在那边有想吗？」<\/p><p>「没有。」他说，「在卖螺丝。」<\/p><p>周冉笑了一声。「那也行。卖螺丝的人知道谁付钱。」<\/p><p>挂了电话他回到柜台。他爸问：「谁？」<\/p><p>「搭档。」<\/p><p>「女的？」<\/p><p>「嗯。搭档。」<\/p><p>他爸没再问。<\/p><p>第二个星期，林拓已经知道大部分东西在哪了。螺丝的格子，接头的规格，哪种胶带是防水的，哪种锁配几把钥匙。<\/p><p>有个下午没人。他爸在打盹。他在柜台边上回工单。回了七八条，抬头，发现他爸在看他。<\/p><p>「回什么？」<\/p><p>「用户的问题。」<\/p><p>「什么问题？」<\/p><p>「换了手机怎么把钱包拿回来。」<\/p><p>他爸看了他一会儿。「你一条一条回？」<\/p><p>「嗯。」<\/p><p>「一天多少条？」<\/p><p>「十几条。」<\/p><p>「收钱吗？」<\/p><p>「不收。」<\/p><p>他爸点了点头。「你也在开店。」他说。<\/p><p>林拓愣了一下。<\/p><p>他爸没再说话，把眼睛闭上了。<\/p><p>林拓把手机放下。他看了一眼货架，一排一排，每个格子一个标签。又看了一眼手机，工单列表，一条一条，每条一个名字。<\/p><p>他把下一条打开，继续回。<\/p><hr><p>那天晚上关了门，他没走。他爸也没走。两个人坐在柜台后面，店里就一盏灯。<\/p><p>他把账记完。今天一百二十三块。<\/p><p>「爸。」<\/p><p>「嗯。」<\/p><p>「你这二十八年怎么过来的？」<\/p><p>他从来没问过这种话。他爸也从来没说过。他爸看着货架，看了很久。<\/p><p>「一颗一颗卖。」他爸说。<\/p><p>林拓等他说下面的。没有下面的。<\/p><p>「就这样？」<\/p><p>「不然呢。」他爸说，「今天卖一百，明天卖一百。有一天卖三百，第二天就卖五十。你不能看一天。你看一年。一年下来，够不够吃饭。够，就再开一年。」<\/p><p>「没想过做大？」<\/p><p>「想过。」他爸说，「九几年的时候，有人叫我去市里开。我去看了。市里的店大，人多，账也大。我回来想了一个月。我怕。」<\/p><p>「怕什么？」<\/p><p>「怕看不过来。」他爸说，「一个店，我知道每颗螺丝在哪。两个店，我就不知道了。」<\/p><p>他站起来，慢慢走到货架尽头，弯腰，从底下拖出一个东西。绿色的铁皮工具箱，掉了漆，角上有锈。他用左手拎着，右手扶着箱子边，放到柜台上。<\/p><p>「你小时候踩这个上面拿东西。」<\/p><p>林拓记得。<\/p><p>他爸把箱子打开。里面是他用了几十年的工具，扳手，钳子，几把螺丝刀，一把小锤子。每一样都在固定的位置，用旧了，把手都是黑的。<\/p><p>他看了一会儿，把盖子合上。<\/p><p>「咔哒。」<\/p><p>那一声很轻，很干脆。林拓小时候听了几千遍。他当年给工具站起名字的时候，想的就是这一声。<\/p><p>「工具就是这样。」他爸说，「不用讲。拿起来顺手，就是道理。」<\/p><hr><p>7 月 25 日，周六。他要回杭州了。<\/p><p>他爸的右手好了一些。能拿勺子了，拿笔还不行，写出来的字歪。嘴基本正了。医生说恢复得比预期快。<\/p><p>早上他妈做了面。他爸吃完，先去了店里。林拓收拾完东西，去店里告别。<\/p><p>他爸坐在柜台后面。店开着，没有人。<\/p><p>「走了。」林拓说。<\/p><p>「嗯。」<\/p><p>「账本我教了妈，她自己写。」<\/p><p>「嗯。」<\/p><p>他站在柜台前，不知道还说什么。他爸也不说。<\/p><p>「去吧。」他爸说，「店里我看得住。」<\/p><p>他走到门口。他爸在后面说：「崽。」<\/p><p>他回头。<\/p><p>「你那个店，」他爸说，「也一颗一颗卖。」<\/p><p>他站了一秒钟，说：「嗯。」<\/p><hr><p>高铁下午两点开。他在车上睡了一觉，醒来的时候已经过了金华。<\/p><p>手机里有几条消息。周冉问他什么时候回。阿凯发了一份新的安全检查清单。信风的工单有十一条新的。<\/p><p>还有一条，是沈月的。发的时间是中午十二点零三分。<\/p><p>「回来我们谈谈。」<\/p><p>他看着这五个字。车厢里很安静，有人在睡觉，有人在看剧。窗外是江南的稻田，绿的，一块一块过去。<\/p><p>这三年，沈月没说过这句话。她说过「你吃饭」，说过「你睡觉」，说过「付」。她说狠话的时候都很短，说完会给他一个台阶。这句话没有台阶。<\/p><p>他没回。他把手机翻过来，扣在小桌板上。过了一会儿，又翻回来，看了一遍。<\/p><p>还是那五个字。<\/p><aside class=\"log\"><div class=\"log-label\">航海日志<\/div><p>7 月 25 日。<\/p><p>在老家看了两周店。<\/p><p>我爸右手不太好，坐着指挥我修了一台风扇，不收钱。他说，他下次买东西还来。<\/p><p>老主顾来拿一颗螺丝，不收钱。他让我记账，写零。<\/p><p>我问他二十八年怎么过来的。他说，一颗一颗卖。<\/p><p>他看我回工单，说，你也在开店。<\/p><p>今天回杭州。<\/p><\/aside>", "words": 4822}, {"num": 28, "title": "谈谈", "vol": 3, "html": "<p>2026 年 8 月 15 日，周六，晚上七点。滨江的出租屋。<\/p><p>沈月把最后一个菜端上桌。三个菜一个汤，比平时多一个。她把林拓的手机从桌上拿起来，放进电视柜的抽屉里，关上。<\/p><p>「今天谈。」她说。<\/p><p>林拓坐着，没动。<\/p><p>从上饶回来那天是 7 月 25 日。他进门的时候她在沙发上看书。他放下包，站在门口。她看了他一眼，看了很久，然后说：「你先睡。我们找个时间。」<\/p><p>那个时间一直没找到。他回来第二天就坐回了阳台。她开学前要备课，去她妈那儿住了一个星期。回来以后他还是在阳台。三个星期，两个人说的话加起来不到一页纸。<\/p><p>今天她把手机收了。<\/p><p>「吃饭。」她说，「吃完说。」<\/p><hr><p>吃饭的时候她没提。她说了学校的事，新学期她带三年级，有个转学来的孩子，普通话不太好。他听着，说了一句「多久能好」。她说一个学期。<\/p><p>碗收了。她没去洗，放在水池里。她坐回桌前，两只手放在桌上。<\/p><p>「三年了。」她说。<\/p><p>他点头。<\/p><p>「2024 年 3 月。你半夜起来建了个文件夹。我记得，那天早上你眼睛是红的。」<\/p><p>「嗯。」<\/p><p>「三年。番茄账本，咔哒，信风。你辞了职，你做出来了。我不是来说这些的。」<\/p><p>她拿了一张纸出来。上面是她的字，几行。<\/p><p>「存款，五万三。我昨天看的。」她说，「四月付了赏金，十二万。六月九万。现在五万三。」<\/p><p>「咔哒还有一万。」<\/p><p>「我知道。我不是说钱不够。房租我出得起。我是说，这个数字在往下走。它走了一年了。」<\/p><p>他没说话。<\/p><p>「我妈每周问。」她说，「不是问你赚多少。她不懂你做什么。她问房子，问结婚，问什么时候。我每周都跟她说，快了。我说了一年快了。」<\/p><p>「我知道。」<\/p><p>「你不知道。」她说，「你没接过她的电话。」<\/p><p>她看了他一眼。<\/p><p>「六月你桌上有张纸。三行字，底下一条线，线底下什么都没有。」她说，「我看了。我把它压在你那把螺丝刀底下。你没发现。」<\/p><p>「发现了。」<\/p><p>「你没问我为什么。」她说，「以前你会问。」<\/p><hr><p>她把纸翻过来。背面也有字。<\/p><p>「我不是反对你做这个。」她说，「你听清楚。我陪你去过工商局。你转一百块手抖，我在旁边看着。赏金两万，我说付。我不是反对你做。」<\/p><p>「嗯。」<\/p><p>「我反对的是，你不在了。」<\/p><p>他抬起头。<\/p><p>「你在阳台上。你人在家里，你不在。」她说，「吃饭的时候你在看手机。你以为你在听，你在看那个数字。晚上你躺下了，我知道你在想那个漏洞，你的手指头在被子上动。你说梦话，说的是英文。」<\/p><p>她的声音不大，也不快。<\/p><p>「我跟你说话，你说嗯。我说大灰狼，你说嗯。我说我妈住院了，你说嗯。」<\/p><p>他看着她。<\/p><p>「四月。」她说，「我妈住了三天院，胆结石，小手术。我跟你说了。你说嗯。你不记得。」<\/p><p>他不记得。<\/p><p>「我没怪你。那阵子你在改漏洞。我知道。」她说，「但你从那以后就没回来。发布了，你没回来。漏洞修好了，你没回来。星象来了，你更不在了。你回你爸那儿两个星期，我以为你回来能好一点。你进门的时候我看你的脸，我就知道，没有。」<\/p><p>她停了一会儿。<\/p><p>「郑浩走的那天，我说他瘦了。我说你也是。你说嗯。」她说，「你去照镜子了吗？」<\/p><p>他没有。<\/p><p>「我怕的不是穷。」她说，「我教书，一个月九千，够我自己活。我怕的是有一天我跟一个人住在一起，他坐在阳台上，我叫他，他说嗯。我叫他吃饭，他说嗯。我说我要走了，他说嗯。」<\/p><p>她的手在桌上，没动。<\/p><p>「我要的不是你成功。」她说，「我从来没要过这个。我要的是你别把自己弄丢。你现在就是丢了。」<\/p><hr><p>他坐在那儿。手在桌子底下，攥着，又松开。<\/p><p>「我在做。」他说。<\/p><p>「我知道你在做。」<\/p><p>「快了。」<\/p><p>她看着他。<\/p><p>「你说快了，说了多久了？」<\/p><p>他没说话。<\/p><p>「我不问你第一问。」她说，「周冉问，你那个老船长问，郑浩问。我不问。我不懂那个。我问你一句话：我刚才说了什么？」<\/p><p>他张了张嘴。<\/p><p>然后他说了。三年了。存款五万三。她妈每周问。她妈三月住院。她不是反对他做。是他不在了。吃饭在看手机，睡觉在想漏洞，她说话他嗯。<\/p><p>他说得很慢。说完，桌上安静了一会儿。<\/p><p>「你听了。」她说。<\/p><p>「嗯。」<\/p><p>「今天听了。」她说，「昨天没有。前天没有。」<\/p><hr><p>她把纸收起来，折成两折。<\/p><p>「到年底。」她说。<\/p><p>他看着她。<\/p><p>「不是收入多少。」她说，「我不看那个。我不管你到年底是一万还是十万。我看你回不回来。」<\/p><p>「回来是什么？」<\/p><p>「你吃饭的时候看着我。」她说，「我说话，你听见。你晚上睡觉是睡觉。你跑步也行，做饭也行，什么都行。你在这儿。」<\/p><p>「到年底没回来呢？」<\/p><p>她没有马上回答。<\/p><p>「那我就知道了。」她说，「我不是在威胁你。我只是告诉你，我在数。我数了一年了。我不想不告诉你就一直数下去。」<\/p><p>「你要是想问我，年底之前要不要去上班，要不要放弃，我不回答。」她说，「那是你的事。我说过我不反对你做。你做到年底，做到明年，做到后年，我都不反对。我只看一件事。」<\/p><p>「嗯。」<\/p><p>「别嗯。」她说，「说话。」<\/p><p>他张了张嘴。「我听见了。」他说，「到年底。回不回来。」<\/p><p>她点头。<\/p><p>她站起来，去水池洗碗。水开了。她洗得很慢。<\/p><p>他坐在桌前。他想去阳台。他没去。<\/p><p>洗完碗，她擦干手，走过来，把抽屉里的手机拿出来，放回他面前。<\/p><p>「汤凉了。」她说，「明天我热了给你带。」<\/p><p>她进了卧室。门没关。<\/p><hr><p>那天夜里他躺下的时候是十一点。三年来第一次这么早。沈月背对着他，没睡，他知道。他也没睡。两个人都没说话。<\/p><p>三点多他醒了。手伸到床头去摸手机，摸到了，停住。他把手收回来。躺着。天亮之前他又睡过去一次。<\/p><p>第二天早上他去洗澡。<\/p><p>他站在花洒底下。水冲下来。他站着。过了一会儿他发现水是凉的。他低头看，热水的开关没拧。他不知道站了多久。<\/p><p>他把热水拧开。水热起来。他站在那儿，等着，等着，没拿沐浴露。<\/p><p>出来以后沈月问他：「洗这么久？」<\/p><p>「嗯。」<\/p><hr><p>航海日志他还是每天写。写完，看一遍，删了。第二天再打开草稿，什么都没有，再写，再删。<\/p><p>他写的东西都差不多。「8 月 17 日。用户 18,200。收入 ¥31。」写完，看着「¥31」。删了。<\/p><p>「8 月 18 日。今天没做什么。」删了。<\/p><p>「8 月 19 日。」后面写不出。删了。<\/p><p>三天没发。夜航船群里没人问。周冉私信他一句：「你还在吗？」他回：「在。」<\/p><p>第四天他打开草稿，写了两个字。看了一会儿，没删。发了。<\/p><p>「还在。」<\/p><hr><p>小杜辞职了。<\/p><p>8 月 21 日，他发消息给林拓：「拓哥，我辞了。今天办完手续。我能来找你一趟吗？」<\/p><p>林拓看着这条消息。他上一次没回小杜，是六月。小杜问「你觉得呢」，他没回。之后小杜没再问。<\/p><p>他回：「来。」<\/p><p>小杜下午到的。比他小两岁，二十八。背一个包，包里一台电脑。进门先看了一眼阳台。<\/p><p>「你就在那写？」<\/p><p>「嗯。」<\/p><p>「我看你发过照片。」小杜说，「那把螺丝刀。」<\/p><p>两个人坐在餐桌前。小杜把电脑打开，是他那个插件。给做跨境生意的小卖家用的，把商品页翻成外文。做了五个月。<\/p><p>「你答过三问了。」林拓说，「前年，进群的时候。」<\/p><p>「答得不好。」小杜说，「老船长说，先进来，慢慢答。我现在辞了，我想再答一遍。」<\/p><p>「答。」<\/p><p>「谁付钱。」小杜说，「用户。」<\/p><p>「哪些用户？」<\/p><p>「跨境的小卖家。」<\/p><p>「他们今天在哪？在用什么？」<\/p><p>「在用免费翻译。」小杜说，「翻出来的商品描述不对，客人买回去发现不对，退货。有个人跟我说，他一个月退货里三成是这个原因。」<\/p><p>「你凭什么比免费翻译好？」<\/p><p>「我……」小杜停了，「我翻得准？」<\/p><p>林拓看着他。<\/p><p>「不是翻得准。」林拓说，「是你知道那一行的词。免费翻译不知道『均码』该翻成什么，你知道。他们退一次货，赔的运费比你一年会员贵。」<\/p><p>小杜愣住。<\/p><p>「付钱的，」林拓说，「是每个月因为翻译错退货的卖家。他们现在用免费的凑合。你比他们好，是你懂他们那行。你把这三句写下来，写在首页上。」<\/p><p>小杜低头打字。打完，抬头看他。<\/p><p>「拓哥，你说得真清楚。」<\/p><p>林拓没说话。<\/p><p>「那你的呢？」小杜问，「你的第一问。」<\/p><p>「还空着。」<\/p><p>「怎么会。」小杜说，「你都做到这样了。」<\/p><p>林拓看着他。这个人比他小两岁，辞了职，包里一台电脑，眼睛亮着。他也这样过。<\/p><p>「你备粮了吗？」林拓问。<\/p><p>「十个月。」小杜说，「副业收入零。我知道不够。四律第四条我不合格。」<\/p><p>「那你为什么辞？」<\/p><p>「等不了了。」小杜说，「方哲一天四个会。我每天写完接口就去改插件，改到两点。我快三十了。」<\/p><p>林拓想说什么。他没说。他自己辞的时候有十四个月。现在不到三个。<\/p><p>「你先把首页写了。」他说，「然后去找十个卖家聊。别写代码。」<\/p><p>「周冉姐的话。」<\/p><p>「嗯。」<\/p><p>小杜走的时候在门口说：「拓哥，你肯定行的。」<\/p><p>他关上门。门口那句话还在。他没接。<\/p><p>他走到阳台。墙上那张纸还贴着，褶子还在。第二问，第三问，都有字。第一问后面还是空的。<\/p><p>他刚才帮小杜答了三句。用了两分钟。<\/p><p>他站在纸前面，站了一会儿，回屋了。<\/p><hr><p>八月底，一个猎头打电话来。说一家大厂要做钱包底层，他们的总监看了四月那篇漏洞公开帖，想聊聊。猎头说得很客气，说不是挖人，就是聊聊。<\/p><p>他说好。他没跟沈月说。<\/p><p>九月初聊了两轮，视频。第一轮聊架构，第二轮聊那二十六个小时。他答得很顺。那些事他闭着眼都能说。<\/p><p>聊完他把电脑合上，去阳台坐了一会儿，把这件事放到一边。<\/p><p>9 月 1 日，他记账。<\/p><p>八月：咔哒 ¥9,800。信风换币分成 ¥870。Pro 续了两个，¥60。合计 ¥10,730。<\/p><p>支出：房租 4,200，生活 5,900，服务器和工具 1,600，他爸的药 1,200，杂项 2,100。合计 ¥15,000。<\/p><p>沈月工资 9,000。<\/p><p>存款：¥46,213。<\/p><p>他把这个数字写在表格上。四万六。表格最上面一行还是 2024 年 3 月的十一万。他往下拉，一行一行，涨过，然后一直在跌。去年六月是二十六万。他算过，那时候够十四个月。现在够两个半。<\/p><p>钱去哪儿了，他一行一行看得见。咔哒夏天只有七八千。信风一万八千个用户，服务器和链上查询的账单一个月三千多。公司注册以后，两个人的社保要自己交。四月的赏金两万。阿凯的兼职费，他坚持每月给四千，阿凯坚持只收两千。哪一笔都不大。加起来，每个月少一万多。<\/p><p>他在夜航船群里发了截图。咔哒 9,800。信风 930。<\/p><p>有人回：「信风用户多少了？」<\/p><p>「一万八。」<\/p><p>那人没再说话。<\/p><hr><p>他妈中午打了个电话。说他爸右手能拿笔了，每天晚上在账本背面练字，写得歪，但能看。<\/p><p>「写什么？」<\/p><p>「写你的名字。」他妈说，「写了一页。我说你写店名，他说店名天天看，不用练。」<\/p><p>她又说了一堆，隔壁建材市场，谁家的猫，他爸偷偷抽了一根烟被她发现。他听着。说了三次「嗯」，说了一次「让他别抽」。<\/p><p>挂了电话，他看着手机，看了一会儿。<\/p><p>那天下午他出门了。<\/p><p>他没想好去哪。走到楼下，看到江边有人跑步。他回去换了鞋。那双鞋是三年前买的，跑过两次，一直放在鞋柜最里面。<\/p><p>他沿着江边的步道跑。开始还行。跑了一公里，胸口开始疼。跑到两公里，腿不听使唤了。他停下来，扶着栏杆喘。<\/p><p>旁边有人跑过去，很轻，一步一步的。他看着那个人的背影变小。那人的鞋是新的，他的鞋底已经硬了，踩在地上像踩木板。<\/p><p>他走到台阶边上坐下。这是六月跟郑浩喝酒的地方。台阶上还有一点烟头，不是他们的。<\/p><p>江对面的楼在太阳底下白花花的。有一艘船过去，跟那天晚上一样慢。<\/p><p>他坐着。没看手机。手机在口袋里，他能感觉到它在，但他没拿。<\/p><p>他不知道坐了多久。太阳偏过去了，台阶上有一半是阴的。他挪到阴的那边。<\/p><p>一个老太太带着孙子从步道上走过，小孩子指着江里的船说什么，老太太说：「船。船去上海。」<\/p><p>他想起他爸的店，货架，格子，一颗一颗。想起沈月说「我在数」。想起小杜说「你肯定行的」。想起第一问后面那块空的。<\/p><p>他没想出什么。<\/p><p>站起来的时候腿是软的。他慢慢走回去。两公里。<\/p><hr><p>到家的时候沈月还没回来。他冲了个澡，这次热水拧开了。<\/p><p>出来，他去厨房。冰箱里有菜。他把米淘了，按下电饭锅。洗了两根黄瓜。他不太会做别的。<\/p><p>七点，沈月回来，看见桌上有一盘拍黄瓜，一锅饭。<\/p><p>「你做的？」<\/p><p>「嗯。」<\/p><p>她坐下，吃了一口。「盐多了。」<\/p><p>「嗯。」<\/p><p>「跑步了？」她看他的鞋。鞋放在门口，鞋帮上有一道江边的泥。<\/p><p>「两公里。」<\/p><p>「明天呢？」<\/p><p>「不知道。」他说，「试试。」<\/p><p>她没说话，又吃了一口黄瓜。<\/p><hr><p>9 月 11 日，周五，晚上十点。<\/p><p>他打开邮箱。四十几封未读。大部分是工单和通知。他一封一封往下看。<\/p><p>有一封不一样。发件人是那家大厂的名字，他每天都能在新闻里看到的那种。主题是：技术专家岗位录用意向。<\/p><p>他点开。<\/p><p>「林拓先生您好。经过前两轮沟通，我们希望邀请您加入基础平台部门，担任技术专家，负责钱包与账户安全方向。岗位年薪 60 万，其中固定部分 45 万，年终奖金 15 万。」<\/p><p>下面一行小字：请于 10 月 12 日前回复。<\/p><p>六十万。<\/p><p>他在云梯的时候税前一万八，一年二十一万六。这个数是那时候的差不多三倍。他算了一下：一年，存款就回到二十六万，跟裁员那时候一样。<\/p><p>他坐在阳台上，看着这封邮件。一年六十万。存款四万六。<\/p><p>沈月在屋里翻了个身。<\/p><p>他没有关掉。也没有回。<\/p><p>屏幕的光照在那把螺丝刀上。<\/p><aside class=\"log\"><div class=\"log-label\">航海日志<\/div><p>（连着三天没发。第四天，发了一行。）<\/p><p>还在。<\/p><\/aside>", "words": 5080}, {"num": 29, "title": "六十万", "vol": 3, "html": "<p>九月十四日，星期一，早上六点。林拓坐在阳台的小桌子前，把那封邮件又读了一遍。<\/p><p>邮件是上周五晚上到的。一家大厂，技术专家岗，年薪六十万。四十五万是固定的，十五万是年终。下面一行小字：请于 10 月 12 日前回复。<\/p><p>他已经读了十几遍。每一遍都停在同一个地方，六十万那三个字。<\/p><p>这件事的来头他理得清。四月那次漏洞，他们四十八小时公开了全过程。帖子在海外社交平台上传得不小。八月底一个猎头打电话来，说那家公司要做钱包底层，总监看了那篇帖子，想聊聊。猎头在电话里说得很客气，说不是挖人，就是聊聊。他说好。<\/p><p>他聊了。两轮视频面试，一轮聊架构，一轮聊那次漏洞。总监姓吴，四十出头，问得很细，问到修复那二十六个小时里他是怎么排优先级的。他的团队三十来人，要分十个人给林拓带。林拓没带过人。他说了实话。吴总监说没关系，会教。他答得很顺，那些事他在梦里都能背。第二轮结束的时候，吴总监说了一句：「你做的东西，正好是我们要做的。」<\/p><p>然后就是这封邮件。<\/p><p>他打开记账软件。存款那一栏，四万六。他在备忘录里算了一遍。到手一个月三万五上下。房租四千二，生活六千，服务器还有一千五。沈月九千。两个人一个月能存两万五。十二个月，三十万。<\/p><p>一年。一年就能把裁员那天的数补回来。<\/p><p>他把备忘录关了。又打开，把「三十万」删掉，改成「三十万左右」。又关了。<\/p><p>七点，沈月起来了。她煮了两碗面，端到客厅。他把手机放在桌上，屏幕朝上，推过去。<\/p><p>她看了一眼。没伸手拿。<\/p><p>「多少？」<\/p><p>「六十万。」<\/p><p>她把筷子放下了。面的热气在两人之间飘。她看了他一会儿。<\/p><p>「去吗？」<\/p><p>「不知道。」<\/p><p>「你去，我不拦。你不去，我也不拦。」她把筷子又拿起来，「我就问一句。」<\/p><p>「嗯。」<\/p><p>「你是想去，还是想跑？」<\/p><p>他没答上来。<\/p><p>「想清楚再答。」她低头吃面，「面凉了。」<\/p><p>他吃了半碗。她出门的时候说了一句，今天周一，她要早点到校。门关上了。<\/p><p>九点，他给猎头回了电话，说想再考虑考虑。猎头说没问题，十二号前给答复就行，国庆假期正好想想。猎头的声音很轻快，像已经知道答案了。<\/p><p>那天他开了信风的后台。用户一万八千。三十天收入，九百四十块。工单十二条。六条问换手机怎么恢复，三条问什么时候出安卓平板版。两条骂人，一条是空的。<\/p><p>他一条一条回。回到第四条，手停了。<\/p><p>他想起吴总监那句话。「你做的东西，正好是我们要做的。」他做了十六个月，一万八千个用户，九百块。他们出六十万，让他去做同一件事，只是名字换成他们的。<\/p><p>他把工单关了。那天他没写一行代码。<\/p><p>第二天也没有。<\/p><p>第三天，周冉在群里问他，上周新用户第二天的留存怎么掉了三个点。他看见了，没回。半小时后周冉直接打电话过来。<\/p><p>「你死了吗？」<\/p><p>「没。」<\/p><p>「那回个话。」<\/p><p>「在想事。」<\/p><p>「想什么？」<\/p><p>他把邮件的事说了。周冉那头安静了几秒。<\/p><p>「六十万。」她说，「行啊。去吧。」<\/p><p>「你不骂我？」<\/p><p>「骂你什么？六十万是钱。」她顿了一下，「但你要是去了，别跟我说是为了沈月。你自己想去就说想去。」<\/p><p>他没接话。周冉挂了。<\/p><p>九月二十六号，星期六，夜航船的聚会。他没去。上个月也没去。晚上十点，老船长在群里发了一张茶馆的照片，几个人围一张桌子。没人@他。<\/p><p>第二天，老船长私聊了他一句。<\/p><p>「两个月没来。茶还在。」<\/p><p>他回了一个「嗯」。<\/p><p>国庆假期，沈月放假，她妈叫她回去住两天。她问他去不去。他说不去。她没劝。<\/p><p>十月三号，星期六，下午两点。他一个人去了西湖边。<\/p><p>「不打烊」在一条老街的尽头。门口两棵桂花树，正开着，一股甜味。里面没什么人。老船长坐在靠窗那张桌子，面前一壶普洱，一个人。<\/p><p>「来了。」老船长说。<\/p><p>「嗯。」<\/p><p>老船长给他倒了一杯。茶是深红色的，杯子是粗陶的，烫手。<\/p><p>「说吧。」<\/p><p>林拓把邮件的事说了。六十万，技术专家岗，做钱包底层。十月十二号前回复。说完了，他等老船长问「谁付钱」。<\/p><p>老船长没问。老船长喝了一口茶，问了另一句。<\/p><p>「你睡得好吗？」<\/p><p>「不太好。」<\/p><p>「几点睡？」<\/p><p>「三四点。」<\/p><p>「几点醒？」<\/p><p>「六点。有时候四点半。」<\/p><p>老船长点了点头，像一个医生听完了症状。他把杯子放下，看了一会儿窗外。桂花的味道从门口飘进来。<\/p><p>「我跟你讲一件事。」他说，「群里没人听我讲完过。」<\/p><p>林拓等着。<\/p><p>「2015 年，我做了一个 App。手机上的一个小工具，名字不说了。三个人，一间办公室，一年一百多万。那时候我三十三岁，觉得这辈子就这样了，挺好。」<\/p><p>他倒茶。壶嘴对着杯子，一滴没洒。<\/p><p>「2018 年 4 月 17 号，早上七点，我收到一封邮件。应用商店的。说我的 App 违反了条款，已下架。一行字。没说哪一条。」<\/p><p>「你申诉了吗？」<\/p><p>「三次。三次回的都是同一段话。第三次我把那段话打印出来，贴在墙上。」<\/p><p>「后来呢？」<\/p><p>「后来就没有后来了。」老船长说，「那个 App 一天进四千块。那天开始，零。不是慢慢掉下来，是一天。用户的邮件倒是来了一堆，问 App 去哪儿了。我一封都没回。两个员工，我给了三个月工资，让他们走了。办公室退了。」<\/p><p>他停了一下。<\/p><p>「然后我半年没开电脑。」<\/p><p>林拓没说话。<\/p><p>「电脑就在桌上。落灰。我每天坐在沙发上看电视，看到天亮，睡到下午。我老婆一开始还说我，后来不说了。八月，她带着孩子回了娘家。不是吵架。她说她受不了看我坐在那儿。」<\/p><p>茶馆里很安静。隔壁桌的人走了，服务员过来收杯子，收完又走。<\/p><p>「我那时候有一个想法，」老船长说得很慢，「我觉得我就是那个 App。它是我做的，它上面的每一个按钮都是我画的。它死了，我也死了。剩下这个人，只是还在吃饭。」<\/p><p>「什么时候好的？」<\/p><p>「不是一天好的。」老船长说，「2019 年我给人写外包。写得很烂，也没人挑。2020 年春天，有个朋友让我帮他做一个小站，一个查快递的工具。三天做完了。第一个月，三百块。」<\/p><p>「三百块。」<\/p><p>「三百块。」老船长笑了一下，「一天进四千的人，拿三百块。你说可笑不可笑。」<\/p><p>林拓没笑。<\/p><p>「可我发现一件事。」老船长把杯子转了半圈，「那个站一个月三百块，但我发现船没沉。它只是停在那儿。」<\/p><p>「船。」<\/p><p>「我这个人。我会的东西。我知道怎么找用户，知道怎么做一个人家肯用的东西。这些没有跟着那个 App 一起死。停了两年，一样在。船没沉。它只是停在那儿。」<\/p><p>他看着林拓。<\/p><p>「产品不是你。」<\/p><p>林拓低头看茶。<\/p><p>「你可以停。」老船长说，「停一周，一个月都行。船不会沉。」<\/p><p>「信风呢？」<\/p><p>「服务器会跑。用户明天还在。有人骂你，后天还会骂。你停一周，一样。」<\/p><p>「六十万呢？」<\/p><p>「去不去，我不说。」老船长把壶里最后一点茶倒给他，「我只说一句。你现在做的决定，是一个每天睡三个小时的人做的。先睡。睡够了再决定。」<\/p><p>「后来，」林拓问，「你老婆回来了吗？」<\/p><p>「回来了。」<\/p><p>老船长没再多说。<\/p><p>「那个查快递的站还在。」老船长过了一会儿说，「上个月三百二十块。我一直没关。」<\/p><p>林拓在茶馆坐到四点。两个人没再讲什么，喝茶，看窗外。走的时候，老船长说了一句：「跑步。跑不动也跑。」<\/p><p>他回到家，六点。沈月在厨房，她中午从她妈那儿回来的。锅里在炖东西。<\/p><p>「我停一周。」他站在厨房门口说。<\/p><p>沈月回头。「停什么？」<\/p><p>「全部。信风，咔哒，邮件，工单。」<\/p><p>她看了他两秒。<\/p><p>「好。」<\/p><p>他以为她还会说什么。她转回去搅锅。过了一会儿，她说：<\/p><p>「明天早饭你做。」<\/p><p>「我不会。」<\/p><p>「学。」<\/p><p>他去群里发了一句：「我停一周。工单周冉看一下。」<\/p><p>周冉几乎是秒回：「早该停了。滚去睡。」<\/p><p>阿凯：「有一个问题。服务器报警谁看？」<\/p><p>周冉：「我看。看不懂我叫你。」<\/p><p>阿凯：「好。」<\/p><p>他把手机关了。不是静音，是关机。他有两年没关过机了。<\/p><p>第一天，星期天。他睡到十一点。醒来的时候屋里很亮，沈月在客厅改作业，红笔在纸上划的声音。他躺着听了一会儿。<\/p><p>早饭没做成，改成了午饭。他煎了两个蛋，一个碎了。沈月把碎的那个夹走了。<\/p><p>「碎的好吃。」她说。<\/p><p>下午他又睡了两个小时。<\/p><p>第二天，星期一。六点半，他跑步。跑到江边，两公里，停了。腿不酸，是心慌。他站着喘，看江上的船。一条运沙船慢慢过去。看着像不动，是在走。回家做早饭，鸡蛋没碎。<\/p><p>第三天，三公里。手机还关着。中午沈月说，周冉打她电话了，说服务器凌晨报了一次警，是误报，阿凯看过了，让他别管。他手往口袋里伸了一下，又收回来。沈月看见了，没说话。晚上他坐在客厅，沈月改作业，他不知道干什么，从她的书架上抽了一本小说。看了三十页，看不进去。又看了三十页，看进去了。<\/p><p>第四天。跑了三公里半。晚上沈月改完作业，他们坐在阳台上。他把话说了。<\/p><p>四点看数据的事。洗澡站着忘了开水的事。六十万那晚他一个人在阳台算到天亮的事。他说得不好，一句一句的，没有顺序。<\/p><p>她没有打断。<\/p><p>「我以为我不说，你就不知道。」他说。<\/p><p>「你不说，我才知道。」她说。<\/p><p>他没听懂。她也没解释。<\/p><p>「六十万，你想要吗？」她问。<\/p><p>「我想要三十万存款。」<\/p><p>「那不一样。」<\/p><p>「嗯。」<\/p><p>她没往下说。楼下的桂花味飘上来，跟茶馆门口的一样。<\/p><p>第五天，星期四，假期结束。沈月要回学校，他说我陪你去。她愣了一下，说行，帮我拿作业本。<\/p><p>两摞作业本，用绳子捆着。他一手一摞。她的学校在一个老小区旁边，红砖楼，操场很小。早上七点半，门口全是家长和孩子。<\/p><p>「沈老师好！」<\/p><p>「沈老师好！」<\/p><p>一个小男孩仰头看他。「你是沈老师的谁？」<\/p><p>他张了张嘴。「嗯……」<\/p><p>「家属。」沈月说。<\/p><p>他把作业本搬到三楼的办公室。办公室里六张桌子，她那张靠窗，桌上一盆绿萝，一个保温杯，一叠备课本。隔壁桌一个年纪大的老师抬头看了一眼，问，小沈男朋友？沈月说嗯。那个老师说，看着挺老实。沈月说，是挺老实。第一节是她的课。他站在教室后门口，看了一会儿。<\/p><p>她在讲生字。「船」这个字，左边是舟，右边不是「沿」的右边，她让孩子们看清楚。四十个孩子跟着念。她的声音跟在家里不一样，高一点，慢一点，每个字都咬得很清楚。<\/p><p>他站到下课。她从讲台上下来，走到后门。<\/p><p>「怎么样？」<\/p><p>「你讲得好。」<\/p><p>「废话。」她说，「回去吧。中午别等我。」<\/p><p>他走出校门，回头看了一眼。三楼那扇窗，绿萝的一角。他在这个城市八年，第一次站在她的地方看她。<\/p><p>那天傍晚他跑了四公里。<\/p><p>第六天，五公里。手表上显示 5.02，三十四分钟。他停在江边，弯着腰喘。他没截图，没发。<\/p><p>傍晚沈月拉他去菜场。她教他挑青椒，捏一下，硬的新鲜，软的放久了。他捏了七八个，挑了四个。摊主看着他笑。回来的路上她把袋子给他拎，说明天青椒炒肉你做，我看着。他说行。<\/p><p>第七天，星期六，十月十号。<\/p><p>早上他跑了第五次，还是五公里。回来洗了澡，坐到阳台上。他把手机开了，两年来第一次觉得开机很慢。<\/p><p>他打开邮箱。那封邮件在最上面。10 月 12 日前回复。还有两天。<\/p><p>他看了一会儿。吴总监那句话又浮上来。你做的东西，正好是我们要做的。他现在能听出这句话的另一半了：所以你不用做自己的了。<\/p><p>他新建了一个文件夹，取名叫「以后」。他把那封邮件拖了进去。<\/p><p>没有回复。也没有拒绝。<\/p><p>他把邮箱关了。他打开记账软件，记了一笔：青椒，六块五。存款那一栏没动，还是四万六。他看了一眼，关了。阳台外面，另一栋楼有扇窗亮着，一个人影走来走去。他看了一会儿，去厨房洗昨晚的碗。<\/p><p>晚上他发了一条帖子。三周以来第一条。<\/p><p>第八天，星期天早上，七点。<\/p><p>他醒了，没赖床。手机在床头。他拿起来，一封新邮件，英文的。<\/p><p>发件人：Tom Zhang。标题：Embedding Xinfeng in our game.<\/p><p>他点开。三段话。他们是一个三人团队，在新加坡，做链上游戏。七月的时候在工单里问过一次。他们的玩家讨厌装钱包插件，十个人里七个在那一步走掉。他们想把信风嵌到游戏里，让玩家用指纹直接进。<\/p><p>最后一句：我们能为此付费吗？<\/p><p>署名是英文的。下面还有一行小字，中文：张桐。<\/p><p>他把邮件从头又读了一遍。十个人里七个走掉。这个数他看得懂，信风上线第一周，他自己的漏斗也是这样。<\/p><p>七月。工单。他想起来了。<\/p><p>五金店的柜台后面，父亲坐在那儿，闭着眼。他站在柜台边上，用手机回工单。一个新加坡开发者问，能不能嵌到我们的游戏里。他回了四个字。<\/p><p>可以研究。<\/p><p>然后他把手机放下，给一个客人拿了一把美工刀。<\/p><p>他坐起来。沈月还在睡。窗外天亮了一半。<\/p><p>他没有研究过。一次都没有。<\/p><aside class=\"log\"><div class=\"log-label\">航海日志<\/div><p>10 月 10 日。<\/p><p>停了一周。跑了五次，从两公里到五公里。<\/p><p>没碰代码。没看数据。做了六天早饭，碎了一个蛋。<\/p><p>老船长说船不会沉。它只是停在那儿。<\/p><p>明天再看。<\/p><\/aside>", "words": 4844}, {"num": 30, "title": "第一问的答案", "vol": 3, "html": "<p>十月十一日，星期天，上午九点。林拓坐在阳台上，给张桐回邮件。<\/p><p>他用英文写了三行，删了两行。最后只剩一句：我们可以视频聊一下吗？明天晚上九点，方便吗？<\/p><p>回得很快。中文的。<\/p><p>「你会中文？太好了。我中文比英文好，就是打字慢。明天九点 OK，新加坡跟你们一个时区。」<\/p><p>他把邮件转给周冉。周冉回了三个字：「我也上。」<\/p><p>停了一周，他今天开了电脑。沈月端着杯子从旁边过，看了一眼。<\/p><p>「一周到了？」<\/p><p>「到了。」<\/p><p>「行。」她说，「中午你做。」<\/p><p>桌面上的东西没变，那个叫「自己的东西」的文件夹还在老地方。他打开信风的后台，用户一万八千六，一周没管，多了四百。<\/p><p>十月十二日，晚上九点。<\/p><p>视频接通，屏幕上三个人。中间是张桐，三十五六岁，短头发，戴一副细框眼镜。背后是一面白墙，墙上贴着几张游戏的画。左边一个年轻人，叫小韦，做开发。右边一个印度面孔的男生，叫拉维，做美术。<\/p><p>「叫我 Tom 就行。」张桐说，「我们做 game 的，链上的游戏。这个你懂吧？」<\/p><p>「懂。」<\/p><p>链上的游戏，说人话，就是游戏里的刀、盔甲、宠物不存在游戏公司的电脑里。它们存在链上。玩家真的拥有它，可以拿出去卖，游戏公司倒了它也还在。听着好。麻烦在门口：要玩，你得先有一个钱包。<\/p><p>「我们的问题很简单。」Tom 共享了屏幕，「你看这个。」<\/p><p>一张漏斗图。最上面一行，一千个人点了「开始游戏」。往下，六百二十个人到了钱包页。再往下，三百零一个人装完了插件。最下面，二百八十个人进了游戏。<\/p><p>「一千个人，进来二百八。」Tom 说，「七成，走在装插件那一步。」<\/p><p>插件钱包，是装在浏览器上的一个小程序。打个比方，你去一家店，店门口有把锁。店家说：你先去五金店买一把钥匙，回来自己装，装好了再进。十个人里七个转身走了。<\/p><p>「这七百个人，」Tom 指着漏斗中间那块，「每一个都是我花钱买来的。广告，一个人两块新币。七百个人，一千四。每天。」<\/p><p>周冉在旁边的手机上打字。林拓看见她打了一行：「一天一千四新币，一个月三万人民币烧在门口。」<\/p><p>「我们试过交易所登录。」小韦说，「玩家得先有交易所账号。更差。」<\/p><p>「也想过自己写一个。」Tom 摇头，「三个人，写不起。写出来也不敢用。钱包出事是要赔命的。」<\/p><p>林拓点了点头。阿凯的话。钱包是最容易让人倾家荡产的软件。<\/p><p>「所以我七月找到你们。」Tom 说，「你们的网页版，我试过。点一下，指纹一按，钱包就有了。不用装任何东西。我要的就是这个。玩家点『开始』，指纹，进游戏。中间没有五金店。」<\/p><p>「你们想要什么形式？」<\/p><p>「SDK。」Tom 说，「或者随便什么。我们能嵌进去就行。」<\/p><p>SDK 这个词，说人话，就是一盒现成的零件。你不用自己造锁，把这盒零件装到你的门上就行。<\/p><p>「你们的合约 audit 过吗？」小韦问。<\/p><p>「核心合约不是我们写的。」林拓说，「用的是一个审计过的开源智能账户，当龙骨。我们只在上面搭甲板。」<\/p><p>「四月那次呢？」Tom 问。<\/p><p>「恢复流程的漏洞。二十六小时修好，四十八小时公开。赏金两万。」<\/p><p>「我看过那篇。」Tom 说，「就是那篇让我来找你们。出过事、说清楚的，比没出过事的放心。」<\/p><p>林拓看着那张漏斗图。<\/p><p>七百个人。他在信风的后台看过一模一样的图。三月发布那周，一万个人来，六千个人留下。他当时盯着流失的那四千个人，想他们为什么不要。他做了收费会员，做了打赏，做了付费主题，四千个人一个也没回来。剩下的六千个人，也没人付钱。<\/p><p>Tom 不是那六千个人里的一个。Tom 不用钱包。Tom 要的是那七百个人进门。<\/p><p>「Tom，」林拓说，「你的玩家会为钱包付钱吗？」<\/p><p>「不会。」Tom 笑了，「他们连装个插件都不肯。」<\/p><p>「你会吗？」<\/p><p>「我会。」Tom 说，「因为他们是我的 user。他们进不来，我一天烧一千四。」<\/p><p>林拓没说话。<\/p><p>周冉在桌子底下踢了他一脚。他没动。<\/p><p>他在本子上写了三个字：谁付钱。后面写了一个名字：Tom。<\/p><p>十六个月。他第一次在这三个字后面写上东西。<\/p><p>「喂。」周冉在屏幕外面小声叫他。<\/p><p>「在。」他抬头，「SDK 两周能出。你们先用网页版接一个测试页，看看行不行。」<\/p><p>「两周 OK。」Tom 说，「Budget 我们不多。但会付。」<\/p><p>「二十号再聊一次。」林拓说，「我给你们看个东西。」<\/p><p>「好。」Tom 说，「别让我等太久。我一天一千四。」<\/p><p>挂了视频，十点。沈月在卧室看书。周冉没走，坐在客厅的桌子边，把手机扣过来。<\/p><p>「你刚才愣了半分钟。」<\/p><p>「嗯。」<\/p><p>「想明白了？」<\/p><p>「付钱的不是用户。」他说，「是需要这些用户的人。」<\/p><p>周冉看了他一会儿。<\/p><p>「你说慢一点。」<\/p><p>「信风的用户，一万八千个。他们不觉得自己在用软件，他们觉得在放钱。放钱还要交钱，像交保护费。我试了三种，都不行。」他把本子翻过来，「Tom 不一样。Tom 开一个店，店门口那把锁挡住了七成客人。锁是给客人用的，但付钱换锁的是店主。」<\/p><p>「所以卖给店主。」<\/p><p>「卖给店主。」<\/p><p>「你爸店里那个修风扇的老头，」周冉说，「不收钱。为什么？」<\/p><p>「他下次买东西还来。」<\/p><p>「对。付钱的不是风扇，是老主顾。」周冉说，「你以前一直在问风扇要钱。」<\/p><p>周冉拿过本子，撕了一页，摊平。她在最上面写：三问，重过。<\/p><p>「第一问，谁付钱。」<\/p><p>「小应用的开发者。做游戏的，做小工具的。三五个人的团队。」林拓说，「他们不用钱包。他们需要玩家用钱包。」<\/p><p>「第二问。他们今天在哪儿，用什么凑合。」<\/p><p>「插件钱包，玩家自己装，走七成。交易所登录，玩家得先有账号，走得更多。自己写，写不起，写了不敢用。」<\/p><p>「第三问。你凭什么比他们现在的办法好。」<\/p><p>「玩家不用装任何东西。指纹一按，三秒。」他停了一下，「还有，我们上线七个月，一万八千个用户，出过一次漏洞，四十八小时公开了。他们敢用。」<\/p><p>周冉把三条写完，看了一遍。然后抬头。<\/p><p>「你跟几个开发者聊过？」<\/p><p>「一个。」<\/p><p>「一个不算。」她把纸折起来，塞进口袋，「我这周聊十个。你写你的 SDK。」<\/p><p>「哪儿找十个？」<\/p><p>「等待名单一千二百个人，有邮箱后缀是公司的四十几个。Tom 认识的群，我让他拉我进去。」她站起来穿外套，「你十六个月没问过人。我一周问十个。」<\/p><p>她走到门口，又回头。<\/p><p>「刚才那半分钟，」她说，「值。」<\/p><p>门关了。沈月从卧室出来，倒水。<\/p><p>「她骂你了？」<\/p><p>「没。」<\/p><p>「那你笑什么？」<\/p><p>他没笑。他去洗碗了。<\/p><p>一周。周冉真的聊了十一个。<\/p><p>她在群里发进度，一天一条。星期二，三个。星期三，两个，一个做链上小游戏的，一个做社区积分的。星期四，两个。星期五，三个，其中一个团队在越南，五个人。星期六，一个，做数字藏品展览的。<\/p><p>星期六晚上她发了汇总。星期五那个越南团队，周冉让林拓一起上。视频里五个人挤在一间小办公室，风扇在头顶转。周冉开口之前先跟他说：「你别说话。听。」<\/p><p>他听了四十分钟。那边的负责人讲他们怎么做了一版自己的登录。做了两个月，上线前一天撤了。没人敢签字说它安全。「我们不是做钱包的。」那人说，「我们是做游戏的。可是不做钱包，游戏没人进。」<\/p><p>周冉问：「如果有现成的，多少钱你们肯付？」<\/p><p>那人说：「先说你们多少钱。」<\/p><p>周冉说：「还没定。」<\/p><p>挂了之后周冉问他：「听见了？」<\/p><p>「听见了。」<\/p><p>「他们跟 Tom 说的是同一句话。」<\/p><p>十一个团队。七个说门口那把锁挡人，流失五成到八成。四个问了价。三个说自己写过一版，写完不敢上。一个说没这个问题，因为他们的用户本来就是老手。<\/p><p>「四个问价的。」她在群里说，「你知道这意味着什么？」<\/p><p>阿凯：「有一个问题。他们问价的时候，你说了多少？」<\/p><p>周冉：「我说还没定。他们说定了告诉我。」<\/p><p>阿凯：「好。那就是真问。」<\/p><p>林拓：「嗯。」<\/p><p>周冉：「你能不能多打一个字。」<\/p><p>林拓：「好的。」<\/p><p>SDK 他写了六天。不是从零写，信风的网页版本来就有，他把它拆出来，包成一盒零件。一段代码，三行，放进任何一个网页，就多了一个「用指纹登录」的按钮。他让阿凯看了一遍。阿凯提了一个问题，把三行里的一行改了。阿凯的问题是：「嵌进去的那个网页，能不能读到钱包地址以外的东西？」林拓说不能。阿凯说那这一行为什么要传整个对象。林拓看了一眼，改成只传地址。<\/p><p>十月二十日，星期二，下午。周冉来了，带着一张纸。<\/p><p>「先把这个弄了。」她把纸放在客厅桌上，「第一笔钱还没到，但我要先说清楚。我不想做免费的。」<\/p><p>「我早想给你。」<\/p><p>「那你为什么不说？」<\/p><p>「不知道怎么说。」<\/p><p>「所以我来说。」<\/p><p>纸是空白的，A4。她拿笔，在最上面写：合伙。<\/p><p>「我不要多。」她说，「你从零做的，主意是你的，代码是你的，漏洞是你扛的。二十。」<\/p><p>「二十可以。」<\/p><p>「三十我说不出口。」周冉说，「十我不干。」<\/p><p>「二十，四年。」她写，「四年成熟，一年悬崖。」<\/p><p>沈月从卧室出来，站在旁边听。周冉跟她解释了一遍。<\/p><p>「成熟就是股份不是一次给我，是四年分四十八个月慢慢给。做满一个月，给我四十八分之一。做满四年，全给。」<\/p><p>「悬崖呢？」<\/p><p>「悬崖就是第一年是道坎。做不满一年走人，一股没有。做满一年，那一年的一起给。」周冉说，「这是防我的。防我三个月拍拍屁股走，还带着股份。」<\/p><p>「也防他。」沈月说。<\/p><p>「对。也防他。」<\/p><p>第二条，分工。周冉写：周冉管增长和客户。林拓管产品和技术。各管各的，自己的地盘自己拍板。拍不了的，两个人一起，一起拍不了的，不做。<\/p><p>「客户是我的。」周冉说，「报价我来，谈判我来。你在旁边坐着，不许打折。」<\/p><p>「嗯。」<\/p><p>「你不许打折。」<\/p><p>「嗯。」<\/p><p>第三条，退出。周冉写得很慢。<\/p><p>「谁走，没成熟的部分收回，公司的。成熟的部分，走的人可以留着，但不能卖给外人。公司要买的话，按上一年利润的三倍算。」<\/p><p>「利润现在是负的。」林拓说。<\/p><p>「所以现在走等于白干。」周冉说，「我知道。」<\/p><p>第四条，工资。两人各拿五千，从十一月起。收入过三万再涨。<\/p><p>第五条，生效日期。2026 年 11 月 1 日。<\/p><p>一页纸，写满了。周冉把笔放下，转过来给他看。他从头看了一遍。没什么要改的。他想说点什么，没说出来。<\/p><p>「签吧。」周冉说。<\/p><p>他签了。她签了。<\/p><p>「见证人。」周冉把笔递给沈月。<\/p><p>沈月接过纸，先看了一遍。看到第三条，她指了一下。<\/p><p>「成熟的『熟』写错了。」<\/p><p>周冉凑过去看。「哪儿？」<\/p><p>「你写的是『孰』。」<\/p><p>「你是语文老师你说了算。」周冉把那个字划了，重写。<\/p><p>沈月又看了一遍。然后在最下面签了名，写了日期。她把纸推回桌子中间。<\/p><p>「我见证的是这张纸。」她说，「你们俩说的话，我见证不了。」<\/p><p>「够了。」周冉说。<\/p><p>沈月去厨房了。周冉把纸拍了照，发到群里。<\/p><p>阿凯几乎是立刻回的：「有一个问题。」<\/p><p>周冉：「说。」<\/p><p>阿凯：「我的呢？」<\/p><p>周冉：「你要多少？」<\/p><p>阿凯：「不要。现在不谈。等做出第一笔再谈我的。现在谈是分一张没画的饼。」<\/p><p>周冉：「随你。」<\/p><p>阿凯：「还有一个问题。第三条『卖给外人』，外人怎么定义？」<\/p><p>周冉：「你不是外人。」<\/p><p>阿凯：「好。」<\/p><p>林拓把那张纸收起来，放进抽屉，跟父亲的那把旧螺丝刀放在一起。<\/p><p>周冉走了。沈月在厨房洗菜。<\/p><p>「五千。」她说。<\/p><p>「嗯。」<\/p><p>「比六十万少。」<\/p><p>「嗯。」<\/p><p>「先这样。」她把水关了，「九点你们视频？」<\/p><p>「嗯。」<\/p><p>「那先吃饭。吃完碗你洗。」<\/p><p>「嗯。」<\/p><p>晚上九点。第二次视频。<\/p><p>Tom 那边还是三个人，多了一杯咖啡。林拓没说话，先把屏幕共享了。<\/p><p>一个测试页，白底，中间一个按钮：开始游戏。他拿起手机，对着摄像头，让他们看着。点按钮。手机上弹出一个框，指纹。他把拇指按上去。<\/p><p>三秒。页面上出现一行字：钱包已创建。下面一串地址。<\/p><p>小韦在那头吹了一声口哨。拉维说了一句英文，Tom 没翻译。<\/p><p>「再来一次。」Tom 说。<\/p><p>林拓换了一个浏览器，又来了一次。三秒。<\/p><p>「没有插件。」Tom 说。<\/p><p>「没有。」<\/p><p>「没有助记词。」<\/p><p>「没有。」<\/p><p>「玩家换手机呢？」<\/p><p>「指纹跟着手机的云账号走。换手机，登录账号，钱包回来。再加一把备用钥匙，第二台设备或者一个信任的人。两把丢一把，还能进门。」<\/p><p>Tom 靠回椅子里，两只手交叉放在脑后。他看了小韦一眼。小韦点头。<\/p><p>「OK。」Tom 坐直，「我们要。这个礼拜就接。」<\/p><p>他把咖啡拿起来，喝了一口，放下。<\/p><p>「多少钱？」<\/p><p>林拓张了张嘴。<\/p><aside class=\"log\"><div class=\"log-label\">航海日志<\/div><p>10 月 20 日。<\/p><p>第一问：付钱的是需要用户的开发者。<\/p><p>花了 16 个月。<\/p><p>周冉一周聊了 11 个团队，7 个有同一个问题。<\/p><p>周冉入伙了。一页纸，20%，四年。沈月做见证，改了一个错字。<\/p><p>今晚客户问多少钱。我没答上来。<\/p><\/aside>", "words": 4809}, {"num": 31, "title": "报价", "vol": 3, "html": "<p>十月二十日，晚上九点四十分。视频刚挂，客厅里只剩笔记本的风扇声。林拓还坐在桌前，周冉站在他旁边，手撑着桌子。<\/p><p>「你刚才想说四十九。」她说。<\/p><p>「嗯。」<\/p><p>「我看见了。你嘴张开的时候就是四十九。」<\/p><p>刚才是她接的话。她说：「明天正式报价，邮件给你。」Tom 说 OK。屏幕黑了。<\/p><p>存款四万七。周冉那张纸在抽屉里，十一月一号生效。离生效还有十二天，离第一笔钱不知道还有多少天。<\/p><p>「四十九为什么不行？」林拓问。<\/p><p>「不是不行。」周冉拉了把椅子坐下，「是你还不知道行不行。你先说，凭什么四十九？」<\/p><p>「他们三个人。小团队。钱不多。」<\/p><p>「他一个月在门口烧多少钱？」<\/p><p>他算过。一天一千四新币，一个月四万二，人民币二十二万。<\/p><p>「二十二万。」周冉说，「你收他四十九美元，三百多块。你是在告诉他，你这东西值三百块。他信了，就当三百块的东西用，出了事骂你三百块的骂法。」<\/p><p>沈月在卧室门口站了一下，又回去了。<\/p><p>「那收多少？」<\/p><p>「不知道。」周冉说，「所以今晚定。」<\/p><p>她把本子摊开。第一行写：按什么收。<\/p><p>「按人头？」她自己先否了，「他们三个人，按座位一个人收几十，一年不到两千块。没意思。」<\/p><p>「按次？玩家每登录一次收一次？」<\/p><p>「他不敢用。玩家越多他越怕。」周冉在本子上划掉，「要收在他赚钱的那个数上。他什么时候赚钱？」<\/p><p>「玩家进来。」<\/p><p>「玩家进来，留下，一个月里真的在玩。」她写下两个字：月活。<\/p><p>月活，就是一个月里真正来用过的人数。不是注册过的，是来过的。Tom 的月活涨，说明他的游戏在赚钱。账单跟着月活涨，他不会觉得亏，因为涨的时候他比谁都高兴。<\/p><p>「分几档？」<\/p><p>「三档。」周冉说，「一档给小的试水，一档给正常的，一档给大的。大的现在没有，但价格要挂在那儿，让人知道往上还有路。」<\/p><p>她写：一千月活以内，九十九。一万以内，二百九十九。十万以内，九百九十九。再往上，谈。<\/p><p>「Tom 现在两千出头。」林拓说，「二百九十九。」<\/p><p>「对。」<\/p><p>「他会觉得贵。」<\/p><p>「他上次说过什么？」周冉翻本子，「服务器一个月二百美元。看数据的工具九十九。」她抬头，「他已经在给一个画图的工具付九十九了。你让他七成的客人进门。你比画图的值钱。」<\/p><p>「一百以下呢？刚起步的？」<\/p><p>「免费。」周冉说，「让人试。试了留下的才是客户。」<\/p><p>美元。客户都在海外，收款走海外的平台。周冉说先用林拓在平台上的个人账户收，年后再挂到公司的对公账户上，到时候找个会计问清楚。<\/p><p>阿凯这时候在群里冒出来。他一直在看。<\/p><p>「有一个问题。他们自己不想跑后端呢？」<\/p><p>信风的四个后端服务，任何人都可以拿去自己跑。这是一开始就定的规矩。但三个人的团队不想自己跑。跑一套服务，要买机器，要有人半夜起来看报警。<\/p><p>「那就我们替他跑。」周冉说，「托管版。」<\/p><p>「多少？」<\/p><p>「四十九一个月。」林拓说。这次他说得很快，「机器成本我算过，十几个客户摊下来，一个客户十块钱不到。」<\/p><p>「有一个问题。」阿凯说，「托管出了事算谁的？」<\/p><p>三个人都停了一下。<\/p><p>「写清楚。」阿凯说，「我们托管的是门房，不是保险箱。钥匙在玩家手机上，我们碰不到。我们负责门房在线，不负责保险箱。这一条要写进去，让客户看明白，也让我们自己看明白。」<\/p><p>「写。」周冉说。<\/p><p>阿凯把那句话发过来了，他已经写好了。托管服务保证门房在线，一个月里不少于百分之九十九点五的时间。不接触、不保管任何用户的钥匙。周冉一个字没改，贴进去。<\/p><p>晚上十一点半，一页定价写完了。三档，一个托管，一个免费档，一条阿凯的话。周冉拍了照，发群里。<\/p><p>「明天早上发邮件。」她说，「你别改。」<\/p><p>「不改。」<\/p><p>十月二十一日，早上九点，报价发出去。十点零七分，Tom 回了。<\/p><p>「299 太贵了。我们 3 个人。99 可以吗？我们月活 2,000 出头，才刚过 1,000 一点点。」<\/p><p>周冉把邮件转给林拓，附了一句：「他砍了。正常。今晚九点视频，你坐我旁边，闭嘴。」<\/p><p>十月二十二日，晚上九点。<\/p><p>Tom 一个人上的。背后的白墙没变，游戏的画多了一张。<\/p><p>「我直说。」Tom 说，「99 我今天签。299 我要想想。或者 199，我们 meet in the middle？」<\/p><p>林拓看了周冉一眼。周冉没看他。<\/p><p>「Tom，」周冉说，「你一个月在门口烧二十二万人民币。」<\/p><p>「那是广告费。」<\/p><p>「二百九十九美元是两千块。你一天的零头。」<\/p><p>「Budget 是 budget。」Tom 摊手，「我们三个人，每一笔都要算。」<\/p><p>「我明白。」周冉说，「所以我们按月活收。你现在两千，是二百九十九这一档。你哪个月掉到一千以下，那个月就是九十九。按实际的算，每月看。」<\/p><p>「不会掉。」Tom 说，「会涨。」<\/p><p>「那你就一直是二百九十九，直到过一万。」<\/p><p>Tom 笑了一下。「你们说话跟我一样。」<\/p><p>林拓忍不住了。<\/p><p>「Tom，要不第一年……」<\/p><p>周冉在桌子底下踢了他一脚。不轻。他闭嘴了。<\/p><p>「不打折。」周冉说，「但你是第一个。」<\/p><p>「第一个什么？」<\/p><p>「第一个客户。」周冉说，「我给你一样东西。价格锁两年。我们以后涨价，你不涨。两年后按你那时候的档重新算。」<\/p><p>「会涨多少？」<\/p><p>「不知道。但会涨。」<\/p><p>Tom 靠回椅子里，手交叉放在脑后，跟上次一样。他想了大概二十秒。<\/p><p>「锁两年，写进邮件。」<\/p><p>「写。」<\/p><p>「Deal。」Tom 说，「一号付。」<\/p><p>邮件是当晚发的。锁价两年那一条，周冉写在第一行。Tom 回了一个字：「签。」<\/p><p>视频挂了。林拓揉了揉小腿。<\/p><p>「你踢得真准。」<\/p><p>「你刚才要说什么？第一年打五折？」<\/p><p>「六折。」<\/p><p>「六折。」周冉说，「你一说六折，他就知道二百九十九是假的。他会觉得还能再砍。以后每一个客户都会砍，因为他会告诉别人。」她收起本子，「锁价不一样。锁价是给他一样能拿回去跟合伙人说的东西。『我们拿到了两年锁价。』他能说这句话，他就签。」<\/p><p>「那我们呢？」<\/p><p>「我们也拿到一样东西。」周冉说，「一个知道二百九十九是真的的客户。」<\/p><p>十一月一日，星期天，早上七点。每月一号，群里的规矩，发上月收入截图。<\/p><p>他发了。咔哒，一万二千三百。信风，九百六十。两张图，没配字。<\/p><p>老船长回了两个字：「还在。」<\/p><p>小杜回了一张图。他的第一个小工具，上线两个月，收入零。配了一句：「第一问还在改。」<\/p><p>林拓给小杜回了一句：「谁付钱，想清楚了告诉我。」<\/p><p>小杜：「拓哥你怎么想清楚的？」<\/p><p>林拓：「有人问我多少钱。」<\/p><p>八点，林拓跑完五公里回来，手机响了一下。海外收款平台的通知。<\/p><p>299.00 USD。<\/p><p>手续费九块。到手二百九十。按当天的汇率，两千零六十块人民币。<\/p><p>他看了三遍。然后把手机放在桌上，去厨房。水池里只有两个杯子。他把两个杯子洗了，又把水池擦了一遍。<\/p><p>沈月站在厨房门口。<\/p><p>「到了？」<\/p><p>「嗯。」<\/p><p>「多少？」<\/p><p>「两千零六十。」<\/p><p>她点了点头。「杯子洗完了。」<\/p><p>他把水龙头关上。<\/p><p>群里周冉发了截图，配了一个字：「首。」<\/p><p>阿凯：「有一个问题。这笔钱记在哪一栏？」<\/p><p>周冉：「信风，企业。新开一栏。」<\/p><p>阿凯：「好。」<\/p><p>周冉：「还有，工资月底发。各五千。」<\/p><p>阿凯：「有一个问题。五千够吗？」<\/p><p>周冉：「不够。先这样。」<\/p><p>从那天起，三天。<\/p><p>Tom 的团队开始接。小韦负责。第一天下午，小韦发来第一个问题。他们的游戏用的框架，跟 SDK 里一段代码打架。按钮出来了，点了没反应。林拓看了二十分钟，是他的问题，改了一行，发新版。<\/p><p>第一天晚上十一点，第二个问题。Tom 的游戏很多玩家是从一个社交软件里点链接进来的。那个软件自带的浏览器，把指纹弹框拦了。玩家点了按钮，什么都没有。<\/p><p>这个问题不是一行能改的。林拓坐在阳台上，想到凌晨一点。他在 SDK 里加了一个判断。如果发现是那种内嵌浏览器，就弹一句话：「请在系统浏览器打开」。下面加一个按钮，一点就跳出去。不好看，但能进门。<\/p><p>凌晨一点半，小韦发消息：「还在吗？」<\/p><p>「在。」<\/p><p>「刚才那个，我们试了，能用。谢了。你们几点睡？」<\/p><p>「不一定。」<\/p><p>「我们也是。」<\/p><p>卧室门开了。沈月站在门口，眯着眼。<\/p><p>「几点？」<\/p><p>「一点半。」<\/p><p>「客户？」<\/p><p>「嗯。」<\/p><p>「水在桌上。」她说，回去了。<\/p><p>第二天，阿凯给小韦发了一份清单。八条，都是接钱包的时候容易踩的坑。小韦回：「你们比我们还紧张。」<\/p><p>阿凯：「有一个问题。你们游戏里的道具值钱吗？」<\/p><p>小韦：「值。有人一件卖过两千美元。」<\/p><p>阿凯：「那就该紧张。」<\/p><p>小韦：「收到。」<\/p><p>第二天下午，周冉在群里问了一句：「你半夜回工单，不要钱？」<\/p><p>「不要。」<\/p><p>「接入服务是可以收费的。别人家收一天两千。」<\/p><p>林拓想了一会儿才回。他想到七月，五金店的柜台后面，父亲坐着，右手还不太灵，指挥他修一台风扇。风扇修好了，老头要给钱，父亲说不要。老头走了，父亲说，他下次买东西还来。<\/p><p>「我爸修风扇不收钱。」他打了这一句。<\/p><p>周冉：「那是老主顾。」<\/p><p>林拓：「他会是。」<\/p><p>周冉没再说什么。过了一会儿，她发了一句：「行。但下一个客户，接入这三天我来盯，你只管答技术的。你不能每个客户都熬三个通宵。」<\/p><p>「好的。」<\/p><p>「你多打了一个字。」<\/p><p>第三天，晚上八点。小韦发来一段录屏。游戏的开始页，一个按钮，一个指纹弹框，三秒，进游戏。<\/p><p>「接完了。」小韦说，「明天上线。」<\/p><p>Tom 在后面补了一句：「明天上。谢谢。这三天你们比我们自己的人还上心。」<\/p><p>后面跟着一张照片。三个人挤在一张桌子前，三罐啤酒，背后那面白墙。<\/p><p>林拓没回。他去把晚饭的碗洗了。<\/p><p>十一月五日，Tom 的新版本上线。<\/p><p>十一月十二日，星期四，晚上。Tom 发来一张图。<\/p><p>还是那张漏斗。最上面一行，一千个人点了「开始游戏」。往下，九百三十个人到了指纹那一步。再往下，七百零二个人进了游戏。<\/p><p>「70 到 30。」Tom 写，「七天平均。」<\/p><p>后面又一句：「我算了一下。以前一天走七百个人，现在走三百。省下四百个，一个人两块新币，一天八百。一个月两万四新币。你们收我 299 美元。我省的比你们收的多五十倍。你们亏了。」<\/p><p>周冉回：「锁两年。」<\/p><p>Tom：「哈哈。」<\/p><p>Tom：「我们下个月月活估计过五千。还是 299。你们真的亏了。」<\/p><p>周冉：「过一万再说。」<\/p><p>林拓看着那张图。七百零二。他在信风的后台看过太多往下掉的线。这是第一次看别人的线往上走，而那条线是他的东西托着的。<\/p><p>沈月在旁边改作业，看了他一眼。<\/p><p>「什么？」<\/p><p>「有个客户，玩家进门的多了一倍多。」<\/p><p>「你的东西？」<\/p><p>「嗯。」<\/p><p>「哦。」她低头继续改。过了一会儿，又说，「那你笑一下也行。」<\/p><p>他没笑。他把手机放下了。<\/p><p>睡前他把那张漏斗图存下来，放进「自己的东西」那个文件夹。两年多了，第一次往里面放别人的图。<\/p><p>十一月十三日，星期五。Tom 在海外社交平台上发了一段视频。<\/p><p>三十秒。手机屏幕录的。点「开始游戏」，指纹弹框，拇指按上去，进游戏。没有插件，没有助记词，没有等待。视频下面一句英文：不用装插件，不用记助记词，三秒进游戏。后面带了信风的账号。<\/p><p>周冉把链接发到群里。「转发三百多。评论四十几条。有人问这是什么。」<\/p><p>阿凯：「有一个问题。有没有人问安全？」<\/p><p>周冉：「有。两个。Tom 自己回了，贴的是我们四月那篇。」<\/p><p>阿凯：「好。」<\/p><p>十一月十四日，星期六，上午。一封英文邮件，一个做链上卡牌游戏的团队，四个人，在首尔。「看到 Tom 的视频。我们有同样的问题。多少钱？」<\/p><p>周冉回的。价目表，一页。最后一行：不打折，早期客户锁价两年，名额还有两个。<\/p><p>林拓看见了。「名额是你编的？」<\/p><p>「不是编的。」周冉说，「是我定的。定了就是真的。」<\/p><p>下午，周冉在群里转了一条私信。一个做社区积分的团队，在马来西亚。「Tom 群里的。问价。」<\/p><p>十一月十五日，星期天，晚上九点。第三个。越南那个五人团队，上个月周冉让他听了四十分钟的那个。负责人直接发了一句中文：「你们定了吗？多少钱？」<\/p><p>周冉在群里发了三个截图，配了一行字。<\/p><p>「三个。三天。」<\/p><p>阿凯：「有一个问题。接入我们一次只能盯一个。三个一起来怎么排？」<\/p><p>周冉：「排队。先付的先接。」<\/p><p>林拓看着三个截图。他想起七月，五金店，父亲让他记账。一颗一颗卖。<\/p><p>他打了两个字：「排队。」<\/p><p>然后他去阳台，把三个团队的名字写在本子上，按来的时间排好。第一个，首尔。<\/p><aside class=\"log\"><div class=\"log-label\">航海日志<\/div><p>11 月 15 日。<\/p><p>第一笔企业收入 299 美元。Tom 的流失从 70% 到 30%。我们没打折。<\/p><p>定价：按月活分三档，99/299/999，托管 49。早期客户锁价两年。<\/p><p>三天帮他们接完，半夜回消息。我爸修风扇不收钱，他下次还来。<\/p><p>Tom 发了一段视频。三天，三个团队来问价。<\/p><p>排队。<\/p><\/aside>", "words": 4830}, {"num": 32, "title": "年底", "vol": 3, "html": "<p>十二月一日，星期二，早上六点。林拓跑完步回来，在阳台上发了两张截图。<\/p><p>每月一号，群里的规矩。十一月：咔哒，一万三千一百。信风，六千五百。<\/p><p>信风那一栏，第一次有了三个来源。换币分成一千零二十。企业客户四千八百，Tom 一个，首尔一个，马来西亚一个。托管六百八十，两家。<\/p><p>他没配字。老船长回了两个字：「掉头。」<\/p><p>小杜回了一张图，收入零，配了一句：「第一问改到第四版。」<\/p><p>他给小杜回：「拿来我看。」<\/p><p>存款五万三。他在记账软件里看了一眼，关了。三个月前是四万六。<\/p><p>账现在分两本。公司一本，周冉记，收入、服务器、两个人的工资。家里一本，他记，房租、菜、水电。他拿五千，沈月九千，一万四进来，一万二出去。服务器的钱从家里那本挪到公司那本之后，家里第一次是正的。不多。正的。<\/p><p>十二月二日，越南那个团队的负责人在群里发了一句：「排第三太久了。我们先付托管，自己接，行不行？」<\/p><p>周冉：「行。四十九，今天开通。文档在这儿。接的时候有问题问阿凯。」<\/p><p>那人付了。当天晚上就开始接。阿凯在群里答了十一个问题，最后一个是凌晨两点。周冉第二天早上说：「你也不要钱？」<\/p><p>阿凯：「有一个问题。他付了四十九。」<\/p><p>周冉：「那是托管的钱。」<\/p><p>阿凯：「托管的是门房。门房要答话。」<\/p><p>周冉没再说。<\/p><p>十二月的头两周，周冉盯着首尔那个团队接入。她说到做到，三天里所有的消息都是她先回，答不了的才转给林拓。林拓只在第二天半夜出过一次手，改了一个跟韩文输入法打架的问题。首尔那边的负责人在群里发了一段录屏，接完了。周冉回了一句英文，然后转回中文对林拓说：「看见没，你不用熬三个通宵。」<\/p><p>十二月十日，马来西亚那个团队的账单跳到了二百九十九。他们的月活过了一千。<\/p><p>周冉把账单转过去的时候，附了一句话：「你们过一千了。恭喜。」<\/p><p>那边回得很快：「涨了。好事。付。」<\/p><p>林拓看着这三个字，看了一会儿。按月活收，涨的时候客户不生气。周冉那天晚上说的话，现在变成了三个字。<\/p><p>十二月十一日，周冉约了一个会计。滨江一个写字楼的小办公室，会计姓钱，五十来岁，桌上一台老式计算器。周冉带着林拓去的，说你得听。<\/p><p>钱会计翻了他们的收款记录。三笔美元，两笔小的。<\/p><p>「海外收的钱，」她说，「也是收入。要报。」<\/p><p>「怎么报？」周冉问。<\/p><p>「走公司的对公账户，按季度报。你们现在收在个人账户上，小钱可以，大了不行。」她把计算器按了几下，「明年你们一个月三万，一年三十六万，就得正经走公司的账。」<\/p><p>「不报呢？」林拓问。<\/p><p>钱会计看了他一眼。「不报，现在没人管你。三年后有人管，一起算，加滞纳金。我见过。」<\/p><p>周冉说：「报。一月就转到公司账上。」<\/p><p>钱会计说：「你们记账的是谁？」<\/p><p>「代办。一个月两百。」<\/p><p>「两百的只会帮你报零。」<\/p><p>周冉说回去换。<\/p><p>出来的时候周冉说：「你听见了？不是我吓你。」<\/p><p>「听见了。」<\/p><p>「以前你一个人的时候，这些事你不想。」<\/p><p>「不想。」<\/p><p>「现在三个人，得想。」<\/p><p>十二月十三日，星期天，上午。母亲的电话。<\/p><p>母亲先说了十分钟。店里的事，隔壁的事，天气冷了，父亲每天早上走半小时，右手能拧螺丝了，就是拧得慢。然后母亲说，你爸要跟你说话。<\/p><p>电话换了手。那头安静了两秒。<\/p><p>「崽。」<\/p><p>「爸。」<\/p><p>「店里换了新账本。」<\/p><p>「旧的呢？」<\/p><p>「记满了。」<\/p><p>「手呢？」<\/p><p>「能写。慢。」<\/p><p>林拓在阳台上站着，看着对面那栋楼。<\/p><p>「你那边呢？」父亲问。<\/p><p>「掉头了。」<\/p><p>「嗯。」<\/p><p>停了一会儿。<\/p><p>「一颗一颗卖。」父亲说。<\/p><p>「嗯。」<\/p><p>「过年回来。」<\/p><p>「回。」<\/p><p>「带她回。」<\/p><p>「嗯。」<\/p><p>电话又换回母亲。母亲说，你爸昨天把那个绿箱子拿出来擦了一遍。林拓问擦它干什么。母亲说不知道，他不说。<\/p><p>挂了电话，他站了一会儿。沈月在客厅问，谁。他说我爸。她说，他说什么。他说，换了新账本。<\/p><p>十二月十五日，早上六点，江边。零度出头，呼出来的气是白的。他跑五公里，第十一周了。江边那个打太极的老头每天都在，今天冲他点了点头。他也点了点头。回去的路上他想，这个老头不知道他是谁，不知道信风，不知道六十万。老头只知道他每天早上来。这样挺好。<\/p><p>十二月二十日，星期天，下午两点。阿凯来了。<\/p><p>他很少来这个出租屋。他坐在客厅的桌边，从包里拿出一张纸，放在桌上。纸上打印着十条。<\/p><p>「有一个问题。」他说，「先看这个。」<\/p><p>第一条：十。四年成熟，一年悬崖，跟周冉那张一样。<\/p><p>第二条：2027 年 1 月 1 日起。<\/p><p>第三条：全职。他跟现在的公司说了，十二月三十一号走。<\/p><p>第四条：工资五千。「我存款够两年。」他说，「不用照顾我。」<\/p><p>第五条：任何东西上线之前，他要看过。他说不能上线，就不能上线。<\/p><p>周冉把第五条读了两遍。<\/p><p>「一票否决？」<\/p><p>「对。」<\/p><p>「这是产品的事。」周冉看了林拓一眼，「你的地盘。」<\/p><p>林拓看着那条。<\/p><p>「你们可以骂我。」阿凯说，「不能绕过我。」<\/p><p>「行。」林拓说，「但你说不能上线，二十四小时内要把为什么写出来。写清楚，我们看得懂的那种。」<\/p><p>「好。」<\/p><p>第六条到第十条，都是安全的事。备用钥匙的规矩，赏金的规矩，出了事谁先说话，多久内公开。都是这一年半他们做过的，他把它们写成了字。<\/p><p>周冉看完，把纸推回去。<\/p><p>「就这些？」<\/p><p>「就这些。」<\/p><p>「你不砍我们点什么？」<\/p><p>「有一个问题。」阿凯说，「我为什么要砍？」<\/p><p>周冉看了他一会儿。<\/p><p>「你在公司拿多少？」<\/p><p>「两万三。」<\/p><p>「来这儿拿五千。为什么？」<\/p><p>阿凯把纸转了一下，让字对着自己。<\/p><p>「我在交易所待了三年。」他说，「见过太多人把钱丢了。大部分不是被偷的，是自己丢的。丢了钥匙，丢了手机，把助记词拍照存在相册里。我在那儿做安全，做得再好，那些人还是丢。」<\/p><p>他指了一下纸。<\/p><p>「这个东西，没有助记词。丢不了那种丢法。我想做这个。」<\/p><p>「就这个理由？」<\/p><p>「还有一个。」阿凯说，「四月那次，你们四十八小时公开了。我在交易所的时候，出事是先删帖。」<\/p><p>周冉笑了。她拿笔，在第一条旁边签了名。林拓签了。阿凯签了。沈月从卧室出来，看了一遍，没找到错字，签了。<\/p><p>「这张纸也放抽屉。」林拓说。<\/p><p>「跟那把螺丝刀一起？」沈月问。<\/p><p>「嗯。」<\/p><p>阿凯走的时候，在门口停了一下。<\/p><p>「还有一个问题。」<\/p><p>「说。」<\/p><p>「一月一号，我第一天上班。办公室在哪儿？」<\/p><p>三个人都没说话。周冉先笑出来。<\/p><p>「明年一月再说。」她说，「先在这儿。桌子不够，你坐阳台。」<\/p><p>「好。」阿凯说。<\/p><p>「阳台是我的。」林拓说。<\/p><p>「那你坐客厅。」周冉说，「你早该从阳台出来了。」<\/p><p>沈月把抽屉拉开，把纸放进去。「三张了。」她说，「一把螺丝刀，两张纸。」<\/p><p>十二月二十四日，晚上。Tom 在群里发了一句：「Merry Christmas。我们月活四千八。还是 299。」<\/p><p>周冉：「过一万再说。」<\/p><p>Tom：「还有一个事。我们 CTO 问，你们的 SDK 和后端明年开源吗？他说合约开了，配套的不开，他不放心长期用。」<\/p><p>周冉没有马上回。过了十分钟，她回了一句：「明年聊。」<\/p><p>然后她私聊林拓：「你看见了？」<\/p><p>「看见了。」<\/p><p>「先不说。年后说。」<\/p><p>「嗯。」<\/p><p>十二月二十六日，星期六，晚上七点。夜航船，这个月的最后一个周六。<\/p><p>林拓去了。六月以来第一次。沈月说你去吧，我在家改作业。他一个人坐地铁到西湖边，走那条老街。桂花早就谢了，树上光秃秃的。「不打烊」门口挂着一串灯。<\/p><p>十几个人。老船长坐在老位子上，面前一壶普洱。小杜在角落里，看见他，举了一下杯子。<\/p><p>有一个新人。二十五六岁，第一次来。按规矩，新人第一次发言要说自己的第一问。他说他做了一个帮人整理书签的工具，做了四个月。<\/p><p>「谁付钱？」老船长问。<\/p><p>「书签多的人。」<\/p><p>「书签多的人今天用什么？」<\/p><p>「浏览器自带的。」<\/p><p>「免费的。」老船长说，「你凭什么比免费的好？」<\/p><p>那个年轻人说了三分钟。老船长听完，没评价，给他倒了杯茶。<\/p><p>林拓坐在旁边听着。三年前他坐在那个位子上。现在他听得出来，那三分钟里有两分半是在讲功能，半分钟是在讲人。他没说话。老船长看了他一眼，也没让他说。<\/p><p>「那封邮件呢？」老船长后来问他。<\/p><p>「在文件夹里。」<\/p><p>「回了？」<\/p><p>「过期了。」<\/p><p>老船长点了点头，没往下问。<\/p><p>聊到九点，人陆续走了。老船长给他添了一杯茶。<\/p><p>「四月的夜航船，」老船长说，「该你来讲一次。」<\/p><p>「讲什么？」<\/p><p>「讲你怎么答上第一问的。」<\/p><p>「十六个月。」<\/p><p>「那就讲十六个月。」老船长说，「讲你怎么答不上的。答不上的那段，比答上的有用。」<\/p><p>林拓喝了一口茶。<\/p><p>「我讲不好。」<\/p><p>「你三年前第一次来，在这张桌子上说的第一句话是什么？」<\/p><p>林拓想了一下。「我做了一个记账软件，没人用。」<\/p><p>「那句话讲得挺好。」老船长说，「四月，二十四号。」<\/p><p>「嗯。」<\/p><p>走的时候，小杜跟他一起出来。两个人在老街上走。<\/p><p>「拓哥。」<\/p><p>「嗯。」<\/p><p>「我第一问改到第五版了。」<\/p><p>「拿来。」<\/p><p>小杜把手机递过来。一行字。林拓看了，还给他。<\/p><p>「谁付钱那一栏，你写的是『想省时间的人』。」<\/p><p>「对。」<\/p><p>「谁不想省时间？」<\/p><p>小杜不说话了。<\/p><p>「去问。」林拓说，「问十个。别写第六版。」<\/p><p>小杜把手机收起来。「拓哥，你以前不这么说话。」<\/p><p>「以前我不会。」<\/p><p>十二月二十八日，周冉把记账的换成了钱会计，一个月八百。阿凯说有一个问题，比原来多六百。周冉说，两百的只会报零。阿凯说好。<\/p><p>十二月三十日，晚上。郑浩发来一条消息。上一次是六月，江边喝酒那次以后，他们没怎么联系。<\/p><p>「还活着？」<\/p><p>「活着。」<\/p><p>「我也。」郑浩说，「在做一个小东西。不说了，做出来再说。」<\/p><p>「谁付钱？」林拓问。<\/p><p>那边停了很久。<\/p><p>「你也问这个。」<\/p><p>「嗯。」<\/p><p>「我在找。」郑浩说，「明年见。」<\/p><p>十二月三十一日，星期四。<\/p><p>上午他把十二月的账算了。咔哒，一万四千。年底 Pro 续费的多，比上个月多了九百。信风，九千零一十七。三个企业客户，二百九十九乘三。托管，三家，越南那个团队也上了。换币分成一千五百多，Tom 的玩家在里面换东西。<\/p><p>合计二万三千零一十七。<\/p><p>他把这个数写在本子上，看了一会儿。三月份最好的时候，咔哒一个月两万一。现在两万三，两个产品，三个人分。不多。但十一月是一万九，十月是一万三，九月是一万一。<\/p><p>线掉头了。不是往上冲，是从往下变成了往上。他在本子上把四个月的数画成一条线，很丑，但方向对了。<\/p><p>存款那一栏，六万零四百。他把手机放下。<\/p><p>他打开邮箱，点开那个叫「以后」的文件夹。那封邮件还在。10 月 12 日前回复。他没删。他把文件夹关了。<\/p><p>下午他去菜场。青椒，捏一下，硬的。肉。豆豉。他做了青椒炒肉，这是第八次做，前七次沈月吃了，没说好也没说不好。<\/p><p>六点，沈月回来。今天学校放假早。她进门，闻了一下。<\/p><p>「豆豉？」<\/p><p>「嗯。」<\/p><p>两个人坐下吃。她吃了两口，没说话。又吃了两口。<\/p><p>「可以了。」她说。<\/p><p>他没说话，低头吃饭。<\/p><p>吃到一半，她把筷子放下了。<\/p><p>「年底了。」<\/p><p>「嗯。」<\/p><p>「我说过到年底。」<\/p><p>「嗯。」<\/p><p>她看着他。他也看着她。屋里只有暖气片的声音。<\/p><p>「我没看你的账。」她说。<\/p><p>「我知道。」<\/p><p>「我看你。」她说，「你做饭。你跑步。你跟我说话。你回来了。」<\/p><p>他没接话。<\/p><p>「我妈上周又问房子。」她说，「我说先不买。她说随你。」<\/p><p>「嗯。」<\/p><p>「明年结婚吧。」她说，「不是因为数字。」<\/p><p>他张了张嘴。没说出话来。<\/p><p>「五月。」她说，「天气好。简单办。你家一桌，我家一桌，夜航船那些人一桌。」<\/p><p>「嗯。」<\/p><p>「我爸让我过年回去。」他说。<\/p><p>「一起回。」她说，「我还没见过那个箱子。」<\/p><p>他站起来，把两个人的碗收了，端到厨房。水开了。他洗碗。洗得很慢。一个碗，两个碗，两双筷子。锅。他把锅也洗了。<\/p><p>沈月站在厨房门口，靠着门框，看着他洗。<\/p><p>「洗完了再说行。」她说。<\/p><p>「行。」<\/p><p>「行什么？」<\/p><p>「行。」<\/p><p>她笑了。不大。她转身回客厅了。<\/p><p>他把锅擦干，挂起来。厨房的灯照着水池。干净的。<\/p><p>晚上十点，他在阳台上写年终的帖子。写了删，删了写。写到十一点半，写完了。发出去。<\/p><p>十一点五十分，手机响了一下。周冉在三个人的工作群里发了一条。<\/p><p>「新年计划。第一条：全部开源。」<\/p><p>后面跟了一句：「开发者才信。星象抄不走用过我们的人。」<\/p><p>阿凯：「好。」<\/p><p>林拓看着屏幕。<\/p><p>阳台外面，对面那栋楼，很多窗都亮着。有一家在放电视，跨年晚会的声音隔着玻璃传过来。<\/p><p>他打了两个字。<\/p><p>「等等。」<\/p><aside class=\"log\"><div class=\"log-label\">航海日志<\/div><p>12 月 31 日。年终。<\/p><p>2026 年：咔哒全年约 13 万 8，信风约 2 万 4。信风 App 用户 2 万，SDK 里建的钱包 3 万多，那些不算我们的，算客户的。企业客户 3 个。存款从 9 万到 4 万 6，再到 6 万。<\/p><p>12 月：咔哒 14,000，信风 9,017。合计 23,017。不多。线掉头了。<\/p><p>三个教训：用户不是钱。产品不是你。付钱的是需要用户的人。<\/p><p>明年 1 月起，三个人。<\/p><p>船没沉。<\/p><\/aside>", "words": 4876}, {"num": 33, "title": "开源", "vol": 4, "html": "<p>二〇二七年一月四日，早上九点，林拓站在一间空房子里。<\/p><p>四十平米。白墙，灰地，一扇朝东的窗。窗外是滨江一个老园区，楼下一家早餐店，一家打印店。屋里什么都没有，只有一根网线从墙角伸出来，像一条没人认领的尾巴。<\/p><p>中介说，三千五一个月，押二付一，随时能搬。<\/p><p>他没有马上答。他在屋里走了两圈，走到窗边，又走回门口。走第三圈的时候，他在心里过了一遍数。十二月收入两万三。三千五，占一成半。存款六万。周冉有一半日子在咖啡馆办公，一天两杯咖啡，一个月也是几百块。阿凯一月一号起正式入伙，三个人挤在一室一厅的客厅里，沈月晚上回家没地方改作业。<\/p><p>去年这个时候，他不敢想办公室。去年十二月的两万三，是三个月里头一回稳住的数。稳一个月不算稳。他又等了一个月，看到一月头上信风的企业客户还在续费，才打电话给中介。<\/p><p>「要。」他说。<\/p><p>中介愣了一下，大概没见过想这么久、答这么短的人。<\/p><p>三张桌子是周冉买的。二手，一共九百块，送货的人骂骂咧咧扛上四楼。她挑了背对窗的那张。「我看数据，屏幕不能反光。」剩下两张，阿凯要靠门的，说习惯了坐在出口边上。靠窗那张就归了林拓。阿凯从家里搬来自己的椅子，说坐惯了。林拓带来的东西只有一台电脑，一个杯子，和那把木头柄的旧螺丝刀。他把螺丝刀放在桌上靠窗那一角，跟在云梯的时候一样。<\/p><p>周冉看了一眼。「又是它。」<\/p><p>「嗯。」<\/p><p>「你爸知道你搬办公室吗？」<\/p><p>「还没说。」<\/p><p>「说一声。他会高兴的。」<\/p><p>林拓没接话。他把网线插上，开机。屏幕亮了，桌面上还是那个黄色的文件夹，「自己的东西」。他没点开，把浏览器打开，打开了群。<\/p><p>群里置顶的还是周冉十二月三十一号发的那条。<\/p><p>新年计划，第一条：全部开源。<\/p><p>下面阿凯回了一个字：好。<\/p><p>再下面是他自己的：等等。<\/p><p>已经等了四天。<\/p><p>开源这两个字，要说人话，就是把图纸贴在墙上。谁都能看，谁都能照着做。信风的合约图纸一年半前就贴出去了，那是七条原则里的一条，写在群里，写在首页上。但只贴了一半。合约是船的龙骨，贴了。四个后端服务、手机端、给开发者用的那套接口，图纸还锁在抽屉里。可自托管，说的是把打包好的程序给你，你能在自己机器上跑起来。程序是怎么写的，你看不见。<\/p><p>周冉的意思是，全拿出来。<\/p><p>第一天上午，三个人在新办公室谁都没干活。周冉把她那台笔记本转过来，屏幕上是星象钱包的介绍页。<\/p><p>「星象钱包团队四十个人。」她说，「上次他们抄『没有助记词』，用了一个月。我们把图纸贴出去，恢复流程、备用钥匙、整套接口，他们照着抄，一个月都不用。」<\/p><p>「他们想抄早就抄了。」阿凯说。<\/p><p>「他们没有代码。」<\/p><p>「他们有四十个人。」<\/p><p>「四十个人也要看图纸。」周冉说，「你不给，他们要猜。猜就慢。」<\/p><p>阿凯把杯子放下。「有一个问题。」<\/p><p>周冉等他。<\/p><p>「你会把钱放进一个看不见里面的保险箱吗？」<\/p><p>「用户又不看代码。」<\/p><p>「用户不看，开发者看。审计的人看。0xRain 看。」阿凯说，「去年那个洞，是因为合约开着他才找得到。后端不开，下一个洞就没人找。等谁找？等坏人找？」<\/p><p>周冉不说话了。她看数据，先看漏斗。这个她没法用漏斗看。<\/p><p>「安全这种东西，」阿凯说，「不开源，没人信。信我们的人，不是信林拓这个人，是信他们自己能看见。」<\/p><p>两个人都看林拓。<\/p><p>林拓一直没说话。他面前的杯子空着。他把杯子转了半圈。<\/p><p>「我不是担心星象。」<\/p><p>「那你担心什么？」周冉问。<\/p><p>「托管版。」<\/p><p>托管版是去年十一月上的，四十九美元一个月。客户不想自己搭后端，就用他们搭好的。图纸贴出去，客户自己照着搭一个，还付这四十九干什么？<\/p><p>自托管，就是后厨的门是开着的。你可以进去看，也可以照着搭一个一模一样的厨房。<\/p><p>周冉想了几秒。「你这个担心比我的靠谱。」<\/p><p>她说话就是这样。她自己的论点，她说扔就扔。<\/p><p>「那你怎么办？」她问。<\/p><p>「我想想。」<\/p><p>「想多久？」<\/p><p>「不知道。」<\/p><p>这一想，想了两个星期。<\/p><p>那两个星期，他白天在办公室做客户的事，晚上回家，坐在阳台的小桌前，不写代码。他把托管版的客户列了一张表。四个。一个是 Tom，一个是 Tom 介绍来的，两个是自己找来的。他对着表看了两个晚上。<\/p><p>第三个晚上，他没看表。他翻出了二〇二五年七月那条帖子。信风的七条原则，他自己敲的字，发在群里，底下一句：以后打脸大家看得见。<\/p><p>第四条：开源。<\/p><p>就两个字。当时写的时候他没想过，开一半算不算开。合约开了，是因为阿凯说不开没人审。后端没开，是因为忙，是因为没人问，是因为一直有更急的事。一年半，没人打他的脸，是因为没人看见那一半。<\/p><p>他把帖子关了。<\/p><p>沈月端了一杯水过来，看了一眼屏幕。<\/p><p>「四个人？」<\/p><p>「四家。」<\/p><p>「那你问他们不就行了？」<\/p><p>他抬头。<\/p><p>「你不是老说，」她说，「先别写代码，先问人。」<\/p><p>那是周冉的话。沈月学得很像。<\/p><p>第二天他给四家都发了邮件，一句话：如果信风能自己搭，你们还会付托管的钱吗？<\/p><p>三家当天回了。<\/p><p>第一家：我们没人会搭，付钱买的就是省事。<\/p><p>第二家：我们本来就想自己搭，但看不到代码不敢用。你们开了，我们反而会付接口的钱。<\/p><p>第三家：不会付托管，但会推荐给别人。<\/p><p>第四家是 Tom。Tom 第二天回，回得最长。大意是：你们的钱包放在我的游戏里，我的玩家的钱就在里面。我的安全顾问问过我三次，后端在哪，代码谁审过。我说不出来。你们要是开了，我就能答他了。<\/p><p>林拓把四封邮件打印出来，带去办公室，放在周冉桌上。<\/p><p>周冉一封一封看。看完，她把纸推回来。<\/p><p>「你打印它干什么？」<\/p><p>「给你看。」<\/p><p>「发我不就行了。」<\/p><p>「打印了好记。」<\/p><p>她笑了一下，没再说什么。那天下午，她在群里回了一句：我没意见了。<\/p><p>阿凯说：那我写文档。<\/p><p>写文档之前，阿凯先定了两件事。<\/p><p>第一件是许可证。图纸贴在墙上，旁边要写一行字，说清楚别人能拿去干什么。他们选的那种最松：拿去用，拿去改，拿去卖都行，只要写明图纸是从哪儿来的。周冉问为什么不选严一点的，不许人拿去赚钱那种。阿凯说，你不许，人家就不用，不用就不看，不看就没人帮你找洞。<\/p><p>第二件是一个文件，放在仓库最显眼的地方。标题就一句：找到洞怎么联系我们。里面写了一个邮箱，一个加密的公钥，赏金的规矩。最后一句是承诺：四十八小时内回复，修好之后公开。<\/p><p>「去年 0xRain 是碰运气找到我们邮箱的，」阿凯说，「这次别让人碰运气。」<\/p><p>自托管文档是阿凯写的。他说，一份文档，从零到能跑起来，一个下午，不能再多。他写了三天。写完，他不自己测，他找了小杜。<\/p><p>小杜去年八月辞了职，现在一个人做东西，还没收入。他来办公室那天穿了件新羽绒服，进门先看了一圈。<\/p><p>「拓哥，你们这儿真好。」<\/p><p>「就三张桌子。」<\/p><p>「三张也好。」<\/p><p>阿凯把文档发给他，什么也不说，让他照着搭。三个人在旁边干自己的活，不看他。<\/p><p>小杜第一次卡在第二十分钟。文档里一个命令，少了一个参数。阿凯改。第二次卡在一个小时零五分。一个环境变量的名字，文档里写的和代码里的差一个字母。阿凯改。第三次卡在两小时。不是文档的问题，是小杜自己的电脑装的版本太老。<\/p><p>阿凯在文档最上面加了一行：先检查版本。<\/p><p>下午四点二十，小杜的屏幕上出现了信风的登录页。他自己搭的。<\/p><p>「拓哥，」他说，「跑起来了。」<\/p><p>「嗯。」<\/p><p>「就这么简单？」<\/p><p>「就这么简单。」阿凯说，「他能搭，人人能搭。这才叫开着门。」<\/p><p>小杜盯着那个登录页看了一会儿。「那我回去也搭一个。」<\/p><p>「搭去。」阿凯说，「搭完把卡住的地方告诉我。」<\/p><p>一月十五号是周五。晚上九点，三个人都在办公室。<\/p><p>代码仓库是他们存图纸的地方。仓库上有一个开关，「私有」和「公开」。私有是抽屉，公开是墙。<\/p><p>林拓的鼠标停在那个开关上。<\/p><p>「你按。」周冉说。<\/p><p>「你按吧。是你提的。」<\/p><p>「你是产品。」<\/p><p>阿凯没说话。他在看最后一遍代码，看有没有一句不该贴出去的话，有没有一个密码忘了删。他看了四十分钟，说：「干净了。」<\/p><p>林拓按了。<\/p><p>页面刷新了一下。什么都没发生。<\/p><p>仓库还是那个仓库，代码还是那些代码。只是从这一秒起，谁都能看。<\/p><p>三个人坐着，看着屏幕。楼下打印店的卷帘门拉下来，哗啦一声。<\/p><p>「就这样？」周冉说。<\/p><p>「就这样。」<\/p><p>「我以为会有个声音什么的。」<\/p><p>「没有。」<\/p><p>阿凯站起来去接水。周冉收了电脑。林拓在群里发了一句：全开了。仓库链接在下面。<\/p><p>老船长过了半小时才回。<\/p><p>「图纸贴出去，人家造得出船壳。造不出你的船员。」<\/p><p>林拓看了很久。他回：「嗯。」<\/p><p>周六早上，他醒得比平时晚。沈月已经起了，在厨房。他躺在床上，手伸过去拿手机。<\/p><p>代码仓库上有一个东西叫星标。路过的人看了图纸觉得好，就按一下。像在墙上按一个手印。<\/p><p>四十一个。<\/p><p>一晚上，四十一个手印。他没见过这些人。<\/p><p>周日，二百。周一早上进办公室，六百出头。<\/p><p>不是什么大数。他知道有的仓库一天几万。但这六百个人，是六百个开发者，六百个看得懂图纸的人。<\/p><p>周一中午，讨论区里出现了一个他认得的名字。0xRain。他只写了两个字。<\/p><p>「终于。」<\/p><p>阿凯把这两个字截了图，发到群里，没加一句话。<\/p><p>看得懂的人开始提问。<\/p><p>一个越南的开发者问，备用钥匙那一步，为什么要等六秒。阿凯回：为了防去年那个洞，等六秒是让两把钥匙的登记不可能撞在同一瞬间。<\/p><p>一个人说，文档第三页有一个错字。周冉改了。<\/p><p>一个人提了一个补丁。补丁就是路过的人看到图纸画错一笔，用铅笔改了，问你要不要。那个补丁改的是一个日志格式，二十行。阿凯一行一行看了半小时，才收下。<\/p><p>「二十行也要看半小时？」周冉问。<\/p><p>「开着门，不代表谁进来都行。」<\/p><p>第三天，一个人在讨论区写了一长段。他把信风搭在自己的机器上，给公司内部的二十个员工用。他说他不打算付钱，但他会告诉别人。<\/p><p>林拓把这条转给周冉。周冉回：第三家说的就是他这种人。<\/p><p>一月十八号，周一。<\/p><p>早上十点，邮箱里两封邮件。一封来自一个做小游戏的团队，五个人，在首尔。他们说，安全负责人之前不批闭源钱包，现在能自托管，批了。要接口的中档，二百九十九美元一个月。<\/p><p>另一封来自大阪，一个做记账应用的小公司。用户要存一点加密货币，他们不想自己碰钱包。之前看过信风，没敢用。他们的原话是：能自托管我们才敢用。九十九美元一个月，先试三个月。<\/p><p>两封邮件隔了四十分钟。<\/p><p>他把两封都转到群里。<\/p><p>周冉看完，没马上回。她从包里拿出一个本子。那个本子林拓见过，黑皮，小开本，她从大厂带出来的习惯。她说过，做增长的人最怕的不是判断错，是错了不认。她记的都是自己看走眼的事。<\/p><p>她翻到新的一页，写了几行。写完，把本子转过来给他看。<\/p><p>「1 月 18 日。反对开源。错。只看了对手，没看客户。」<\/p><p>「我错了，」她说，「记一笔。」<\/p><p>林拓看着那行字。他想说点什么。周冉不需要他说什么。<\/p><p>他站起来，把三个人的杯子收了，去楼道尽头的水池洗。水很凉。他洗得很慢。<\/p><p>晚上回家，沈月在客厅改作业。客厅又是客厅了，桌上没有三台电脑，只有她的作业本和一杯茶。<\/p><p>「办公室怎么样？」<\/p><p>「有窗。」<\/p><p>「朝哪？」<\/p><p>「东。」<\/p><p>「早上晒得到太阳？」<\/p><p>「嗯。」<\/p><p>她在一本作业上画了一个勾。「以后你在那边熬夜，我在家就不知道了。」<\/p><p>「九点关。」<\/p><p>「说了算数。」<\/p><p>「算数。」<\/p><p>他坐到她旁边，看她改作业。看了一会儿，他把手机拿出来，翻到父亲的号码，打过去。<\/p><p>响了四声。<\/p><p>「崽。」<\/p><p>「爸。我租了个办公室。」<\/p><p>那边安静了两秒。背景里有货架的声音，有人在问什么型号。<\/p><p>「多大？」<\/p><p>「四十平。」<\/p><p>「几个人？」<\/p><p>「三个。」<\/p><p>又安静了两秒。<\/p><p>「行。」父亲说，「账要记。」<\/p><p>「记。」<\/p><p>「挂了。有人买东西。」<\/p><p>他放下手机。沈月没抬头，嘴角动了一下。<\/p><p>一月的最后一个周五，下午五点。周冉和阿凯已经走了。他一个人在办公室，等一个部署跑完。<\/p><p>邮箱响了一声。<\/p><p>发件人是一家东南亚的交易所。他听过名字，中等规模，主要做那边几个国家的用户。<\/p><p>邮件不长。他们想做一个自己牌子的钱包，用信风做底。白标，就是别人把你的东西贴上他的牌子卖。厨房是你的，招牌是他的。<\/p><p>预算：三万美元。<\/p><p>附件是一份表格，二十行。每一行一个要求。他们的登录页、他们的颜色、他们的语言、他们的客服入口。再往下，改恢复流程、加一种他们自己的链、接他们的风控系统、每周一次专人会议。<\/p><p>他从头数到尾，二十项。<\/p><p>又数了一遍。还是二十项。<\/p><p>他把邮件转到群里，什么都没写。<\/p><p>周冉回得最快，一个字：「哟。」<\/p><p>阿凯回：「有一个问题。」<\/p><p>林拓看了看窗外。天已经黑了。楼下早餐店在收摊。<\/p><p>他回：「明天说。」<\/p><aside class=\"log\"><div class=\"log-label\">航海日志<\/div><p>1 月 18 日。<\/p><p>全部开源了。周冉反对，阿凯支持，我犹豫了两周。<\/p><p>犹豫的两周里，我问了四个付托管钱的客户。三个说还会付，一个说会付别的钱。<\/p><p>今天两个新客户说：能自托管才敢用。<\/p><p>周冉记了一笔。我洗了三个杯子。<\/p><\/aside>", "words": 4910}, {"num": 34, "title": "白标", "vol": 4, "html": "<p>二〇二七年三月二日，早上八点半，太阳从东窗照进来，正好照在周冉的桌上。<\/p><p>她把桌子往左挪了半尺。「这窗户冬天好，春天就不行了。」<\/p><p>林拓在自己的位子上开机。阿凯还没到，他这个月每周二上午去看牙。办公室搬进来两个月，三张桌子各自长出了各自的样子。周冉那张摆着两块屏幕和一个黑皮本子。阿凯那张什么都没有，一台电脑，一杯水，人走了桌面像没人用过。林拓那张靠窗，螺丝刀在角上，旁边多了一盆沈月拿来的绿萝。<\/p><p>周冉把一张纸放到他桌上。<\/p><p>「二十项。我算完了。」<\/p><p>那封东南亚交易所的邮件是一月最后一个周五来的。三万美元，做一个贴他们牌子的钱包。二月里三个人跟对方开了两次视频会。对方姓陈，马来西亚人，中文说得慢，带一点口音，每次开会先问「你们杭州冷不冷」。人客气，要求一条不少。<\/p><p>第一次会是二月九号。陈先生把那二十项一条一条念，念到第九项改恢复流程的时候，林拓说了一句「可以研究」。<\/p><p>会一结束，周冉就转过来。<\/p><p>「你又『可以研究』了。」<\/p><p>「嗯。」<\/p><p>「上次你『可以研究』，是在你爸店里回 Tom。那次是好事。这次不是。」她说，「『可以研究』在客户耳朵里就是『可以』。你回头再说不行，他会觉得你反悔。」<\/p><p>「那说什么？」<\/p><p>「说『我们回去算』。算完再答。答了就不改。」<\/p><p>第二次会是二月二十三号。那次是周冉说的，说他们算过了，二十项里有十二项不能做。陈先生说，再想想。周冉说，好。<\/p><p>三万美元，按现在的汇率是二十一万多。他们三个人的存款加起来没有这么多。沈月说过五月结婚。父亲的店去年换了新账本，但右手还是慢。这些事林拓没有跟周冉说，周冉也知道。<\/p><p>周冉第一次看到那封邮件回了一个「哟」。那个「哟」里有一半是动心。她跟他说过，做增长的人看到一条新的收入线，跟猫看到虫子一样，会先扑上去。<\/p><p>阿凯的那句「有一个问题」在第二天说了。<\/p><p>「二十项里，第九项，改恢复流程。第十三项，接他们的风控。这两项碰的是骨头。」<\/p><p>「骨头是什么？」周冉问。<\/p><p>「备用钥匙怎么登记，怎么撤。」阿凯说，「去年那个洞就在这儿。我们修好之后守了一年，开源了两个月，六百个人在看。现在为了一家客户改一版只有他们用的，谁审？」<\/p><p>「他们自己审。」<\/p><p>「他们的安全团队审我们的钱包？」阿凯摇头，「他们要是能审，就不来找我们了。」<\/p><p>周冉没再问。她把那两项在表上画了圈。<\/p><p>现在这张表在林拓桌上。二十行，每一行后面三个数：要几天，谁做，做的时候什么事做不了。<\/p><p>他一行一行看。<\/p><p>第一项，换他们的标志和颜色。两天。这个信风本来就支持，Tom 的游戏里用的就是自己的颜色。第二项，换域名。一天。第三项，加马来语和泰语。五天，要找人校对。到第八项，都是皮。加起来十六天。<\/p><p>第九项，改恢复流程。阿凯的估算：四十天。后面括号里一行小字：不含审计，不含赏金重开。<\/p><p>第十项到第二十项。加一条他们自己的链，二十天。接风控，三十天。每周一次专人会议，一次半天，六个月就是十三天。客服入口，接他们的工单系统，十天。往下还有。<\/p><p>最后一行，周冉用红笔写的：合计二百七十个工作日。三个人，六个月。<\/p><p>六个月，三个人什么都不做，只做这一家。<\/p><p>「六个月里，Tom 呢？」林拓问。<\/p><p>「Tom 自己玩。」周冉说，「首尔那家上个月问过我们，能不能加一个签名的批量接口。我说三月看。这个要是接了，就是九月看。」<\/p><p>「咔哒呢？」<\/p><p>「你晚上做。」她说，「跟二〇二五年一样。」<\/p><p>林拓没说话。二〇二五年他白天造船，晚上守店，那一年他把自己弄丢过一次。沈月的期限就是那一年攒下的。<\/p><p>他拿过计算器，按了几下。<\/p><p>三万美元，六个月，一个月五千美元，三万六千块人民币。他们二月的收入，咔哒加信风，四万三。也就是说，接这一单，六个月里每个月赚的，比不接还少七千。而且六个月之后，那二十项定制是只有一家在用的东西，谁也带不走。<\/p><p>他把计算器推给周冉看。<\/p><p>周冉看了一眼，没说话。她早算过了。她只是想让他自己算一遍。<\/p><p>「那怎么回？」他问。<\/p><p>「不接定制。」她说，「但可以卖白标。」<\/p><p>白标和定制不是一回事。白标是别人把你的东西贴上他的牌子卖。厨房是你的，招牌是他的，菜单他可以选，但菜是你炒的。定制是让你为他一家重新造一个厨房。前八项是白标，后十二项是定制。<\/p><p>「白标多少钱？」<\/p><p>周冉翻开本子。「标准版，一年一万二美元。他们自己换皮，我们给文档。加一个支持包：四十八小时内回复，每月一次电话，重大漏洞优先通知。」<\/p><p>「一万二。」<\/p><p>「一万二。」<\/p><p>「他们要的是三万的东西。」<\/p><p>「他们要的是三万的东西，他们付得起的也是三万。」周冉说，「但我们卖得起的是一万二。这不是一回事。」<\/p><p>晚上他回家，沈月在厨房煮面。<\/p><p>「三万美元的那个，怎么样了？」<\/p><p>「不接。」<\/p><p>她关小火，转过身。「动心吗？」<\/p><p>「动。」<\/p><p>「那怎么不接？」<\/p><p>「半年。」<\/p><p>她想了几秒。大概在想半年是什么意思。想明白了，她把面捞出来，分成两碗。<\/p><p>「五月我要嫁的那个人，得在。」她说，「你二〇二五年不在过一回。」<\/p><p>「嗯。」<\/p><p>「一万二你们也不亏？」<\/p><p>「不亏。够办公室一年房租，够阿凯半年工资。」<\/p><p>「那就一万二。」她把筷子递给他，「吃面。」<\/p><p>吃了几口，她又说：「我妈问几桌。」<\/p><p>「两桌。」<\/p><p>「我也说两桌。她说太少。」<\/p><p>「你怎么说？」<\/p><p>「我说，来的都是认识的人。」她夹了一筷子青菜，「她说那你们那个办公室的人来不来。我说来。她说那就三桌。」<\/p><p>「三桌。」<\/p><p>「先说两桌。」<\/p><p>他吃着面，想起一件很小的事。<\/p><p>十几岁的时候，店里来过一个人，要一种螺丝。那个规格很怪，父亲翻遍了货架没有。那人说，你给我定做一批，我多给钱。父亲说，全县都没有这个规格。那人说，所以才要定做。父亲说，你把那个孔扩一毫米，用标准的。那人骂骂咧咧走了。<\/p><p>第二天那人又来了。买了一盒标准的螺丝，说孔扩好了。<\/p><p>父亲收了钱，一句话没说。<\/p><p>林拓当时觉得父亲太硬。现在他觉得父亲是算过的。一批定做的螺丝，做出来只有这一个人用，模具的钱谁出？做完了摆在货架上，卖给谁？<\/p><p>第三次视频会定在三月十号，晚上八点，对方那边是九点。<\/p><p>开会前，周冉把他叫到窗边。<\/p><p>「今天你说。」<\/p><p>「你说吧。」<\/p><p>「我说过两次了。定制的事，得你说。你是产品，你说不，他们才信是真的不。」<\/p><p>「嗯。」<\/p><p>「说『不』的时候，」周冉说，「别解释三遍。说一遍。说完闭嘴。」<\/p><p>「嗯。」<\/p><p>「你会想解释的。你一紧张就解释。」<\/p><p>「嗯。」<\/p><p>「你已经说了四个嗯了。」<\/p><p>他笑了一下。他确实紧张。<\/p><p>八点整，陈先生的脸出现在屏幕上。背景是一间会议室，他身后还坐着两个人，没有开摄像头。<\/p><p>「杭州冷不冷？」<\/p><p>「暖了。」周冉说。<\/p><p>寒暄了两分钟。陈先生打开那份二十项的表，说他们内部过了一遍，有几项可以缓。恢复流程和风控是必须的，要过他们的合规。<\/p><p>周冉看了林拓一眼。<\/p><p>林拓清了清嗓子。<\/p><p>「陈先生。定制我们不做。」<\/p><p>他停住了。他本来想接着说「因为」。他把「因为」咽了回去。<\/p><p>屏幕那边安静了。<\/p><p>安静了大概五秒。五秒很长。他能听见办公室外面有人在走廊里打电话，能听见阿凯在他左边喝了一口水。<\/p><p>他没有说话。<\/p><p>陈先生先开口了。「一项都不做？」<\/p><p>「前八项不算定制。那是白标，标准版本来就支持。」林拓说，「后面十二项我们不做。改恢复流程，谁都不做。这是我们的规矩，写在首页上。」<\/p><p>「那你们卖什么？」<\/p><p>「标准版，加支持。一年一万二美元。」<\/p><p>「一万二……」陈先生看了看身后。有人说了一句什么，听不清。「我们的预算是三万。」<\/p><p>「知道。」<\/p><p>「三万你们不要？」<\/p><p>「三万要六个月。我们只有三个人。」林拓说，「六个月做完，只有你们一家能用。我们不做这种东西。」<\/p><p>他又停住了。他想说「不好意思」。周冉在桌子底下踢了他一脚。<\/p><p>他没说。<\/p><p>陈先生笑了一下，笑得有点无奈。「你们的钱包，是我看过的里面最不肯改的。」<\/p><p>「嗯。」<\/p><p>「也是唯一一个把后端全开着的。」<\/p><p>「嗯。」<\/p><p>「我们回去商量。」<\/p><p>会议结束是八点四十。陈先生下线之前，又问了一句：「一万二，包括你们说的四十八小时回复？」<\/p><p>「包括。」周冉说。<\/p><p>屏幕黑了。<\/p><p>三个人坐着没动。<\/p><p>「你说了几遍『不』？」周冉问。<\/p><p>「三遍。」<\/p><p>「解释了几遍？」<\/p><p>「一遍。」<\/p><p>「有进步。」<\/p><p>阿凯站起来去接水。走到门口，他回头说了一句：「他问后端的时候，你说『嗯』的声音跟平时不一样。」<\/p><p>「什么不一样？」<\/p><p>「有点得意。」<\/p><p>林拓想否认，没否认。<\/p><p>对方三天后回了邮件。接受一万二。附加一条：如果他们的用户量过了某个数，第二年可以谈价。周冉回：可以谈，谈涨。<\/p><p>合同是周冉拟的，两页纸。第一页写清楚哪些是标准版自带的，哪些是支持包里的，哪些「不在服务范围内」。最后这一栏是阿凯坚持加的。他说，客户不是记不住你答应了什么，是记不住你没答应什么。<\/p><p>「不在服务范围内」那一栏，第一条：修改钱包恢复流程。<\/p><p>支持包那一栏是林拓写的。四十八小时回复，他改成了二十四小时。周冉说四十八就够了，别把话说满。他说，Tom 那次是半夜回的。<\/p><p>「那是 Tom。」<\/p><p>「以后都是 Tom。」<\/p><p>周冉看了他一眼，没改回去。她知道这是哪儿来的。去年夏天在五金店，一个老头拿一台风扇来修，父亲坐着指挥他修，不收钱。他回杭州之后一直记着那句「他下次买东西还来」。定制他不做，但修东西这件事，他要做到底。<\/p><p>三月十七号，定金到账。半年的，六千美元。<\/p><p>林拓把到账截图发到群里。周冉回了一个「记一笔」。这次是好的那种。<\/p><p>夜航船的群里，他发了一句：拒了三万的定制，接了一万二的标准版。<\/p><p>小杜第一个回：「拓哥，三万真不要？」<\/p><p>「不要。」<\/p><p>「为什么？」<\/p><p>「六个月。」<\/p><p>过了一会儿小杜回：「我记下了。」<\/p><p>老船长回得晚，只有四个字：「船小，装不下。」<\/p><p>那天下午，周冉在白板上画了一张表。办公室的白板是二月买的，二手，左上角有前一个主人没擦干净的一个箭头。<\/p><p>她写了四行。<\/p><p>企业接口，五家。Tom 的游戏去年冬天用户涨了三倍，一月升到了最高档。马来西亚那家和首尔的两家都是中档，大阪那家低档。加起来一个月一万五上下。<\/p><p>托管，十四家，每家四十九美元。一个月五千。<\/p><p>换币分成。行情从去年底开始回暖，一月开始好起来，二月一万。<\/p><p>信风二月合计：三万。<\/p><p>下面她另起一行：咔哒，二月，一万三。<\/p><p>再下面：白标，四月起，每月七千二。<\/p><p>她退后一步看这张表。<\/p><p>「去年这个时候，」她说，「信风一行是零。」<\/p><p>「嗯。」<\/p><p>「今年四条。」她用笔敲了敲白板，「四条腿。哪条断了，桌子都不倒。」<\/p><p>「老船长的话。」<\/p><p>「老船长说的是三十个站。我们没三十个，先四条。」她想了想，「哪一条都别超过一半。超过一半，你就得看它脸色。」<\/p><p>阿凯从他的位子上抬起头。「有一个问题。」<\/p><p>「说。」<\/p><p>「咔哒那条，最近有点不对。」<\/p><p>周冉转过去。「怎么不对？」<\/p><p>「我不看数据。」阿凯说，「但我上周在一个群里看见有人说，某家交易所的网页版，里面新加了一个东西。」<\/p><p>「什么东西？」<\/p><p>「批量转账。免费。」<\/p><p>周冉的表情变了。她回到自己的位子，打开咔哒的后台。<\/p><p>林拓也打开了。<\/p><p>日访客那条线，他每天都看。三月头上是两千出头。他往回拉了两周。<\/p><p>两千一。两千。一千九。一千九。一千八。一千七。一千六。一千六。<\/p><p>不是一天掉的。是每天掉一点，掉了两周。他每天都看，每天都觉得是波动。<\/p><p>周冉把她那边的漏斗调出来。批量转账那个页面，搜索来的人少了三成。别的页面没动。<\/p><p>「就一个工具。」她说。<\/p><p>「就那一个。」<\/p><p>那一个，是二〇二四年九月七号上线的第一个。三百个地址，大鹏的两百块，一百三十七块的手续费。咔哒是从那一页开始的。<\/p><p>周冉在白板上，「咔哒，二月，一万三」那一行后面，写了一个数。<\/p><p>「负百分之二十。」<\/p><p>林拓已经打开了代码。批量转账那个页面，他想加点什么。加一个他们没有的功能，加一个更快的合约，加一个……<\/p><p>「先别写代码。」周冉说。<\/p><p>他停下。<\/p><p>「你跟几个用户聊过？」<\/p><p>「还没。」<\/p><p>「明天先问十个。问他们用了那边的没有，为什么用，为什么不用。」她说，「问完再写。」<\/p><p>「嗯。」<\/p><p>「你二〇二五年被抄的时候，第一反应也是先动手。」<\/p><p>「那次你说，比他快。」<\/p><p>「那次对面是个抄袭站。」周冉说，「这次对面是交易所。你快不过它。得想别的。」<\/p><p>外面天黑了。楼下打印店的卷帘门哗啦一声拉下来。<\/p><p>林拓看着那条往下走的线。他没有说话。他打开了那家交易所的网页版，注册了一个账号，找到了那个新加的入口。<\/p><p>界面很干净。一个上传按钮，一个地址列表，一个「发送」。<\/p><p>他上传了一个三个地址的测试文件。<\/p><p>十秒，发完了。<\/p><p>免费。<\/p><aside class=\"log\"><div class=\"log-label\">航海日志<\/div><p>3 月 20 日。<\/p><p>拒了一单 3 万美元的定制，接了 1.2 万的标准版。<\/p><p>二十项定制，我们算了一下，三个人六个月。三万美元除以六个月，比我们现在赚得还少。<\/p><p>说「不」的时候，我说了三遍，解释了一遍。周冉说有进步。<\/p><p>三个人只做一件事。<\/p><\/aside>", "words": 4918}, {"num": 35, "title": "矩阵", "vol": 4, "html": "<p>二〇二七年四月一日，上午十点，林拓打了第一个电话。<\/p><p>办公室里只有他和周冉。阿凯在家改白标的文档。窗外园区里的樱花开过了，落在早餐店的棚子上，粉一层，脏一层。咔哒的日访客停在一千六，已经停了一个星期。白板上那行「负百分之二十」还在，周冉没擦。<\/p><p>名单是周冉列的。十个人。五个最近一个月没再来的，五个还在用的。都是咔哒 Pro 的老用户，交过钱的，留过联系方式的。<\/p><p>「每个人二十分钟。」周冉说，「你只问，别推销。他们说什么你记什么。」<\/p><p>「嗯。」<\/p><p>「说『嗯』的时候别打断。」<\/p><p>第一个是一个做社区运营的，广州人。他直说了：那家交易所他本来就在用，钱在里面，地址在里面，发的时候点一下就完了。免费。「你们那个要我先把钱提出来，再连钱包，再上传。多三步。」<\/p><p>林拓记下：多三步。<\/p><p>第二个，第三个，说的差不多。方便，免费，本来就在。<\/p><p>第四个不一样。他说他试过交易所那个，用了一次，不用了。<\/p><p>「为什么？」<\/p><p>「我给三千个地址发空投，」他说，「那三千个地址是我半年攒的社区。我上传上去，交易所就知道我给谁发、发多少。这个名单是我的命。我不给它。」<\/p><p>空投，就是项目方给一批地址免费发代币，像新店开业在门口撒糖。撒给谁，是运营最值钱的东西。<\/p><p>第五个说的是链。交易所那个只支持它自己的几条链，他要发的那条不在里面。<\/p><p>第六个，还在用的，说他不把钱放交易所。「放交易所的钱不是我的，是它借我用的。」<\/p><p>第七个说，交易所那个没有校验。地址错一个字母，钱就没了。咔哒那个确认页会拦他。他被拦过两次。<\/p><p>第八个是大鹏。<\/p><p>大鹏的电话是林拓自己打的。二〇二四年八月，三百个地址，两百块咖啡钱。这个号码他三年没删过。<\/p><p>「兄弟，」大鹏在那边笑，「你终于给我打电话了。」<\/p><p>「嗯。问你几个问题。」<\/p><p>「问。」<\/p><p>「交易所那个，你用过没有？」<\/p><p>「用过一次。不用了。」<\/p><p>「为什么？」<\/p><p>「我现在给三个项目做运营，每个星期都要发。」大鹏说，「我的名单，我不往交易所传。它看得见我给谁发。我不放心。」<\/p><p>「嗯。」<\/p><p>「还有一个。它那个发完了，你想查哪笔没到，查不到。你们那个有记录，我能一笔一笔对。我做运营的，对不上账就是我背锅。」<\/p><p>林拓记：能对账。<\/p><p>「我跟你说，」大鹏又说，「三年了，我还在用你这个。每个星期都用。我换过三家公司，你这个我没换过。」<\/p><p>林拓没说话。<\/p><p>「你别不吭声啊。」<\/p><p>「嗯。谢谢。」<\/p><p>「谢什么。你那年收我两百块，我今天想想还是便宜。」<\/p><p>挂了电话，还剩两个。<\/p><p>第九个是山田。二〇二五年一月帮他校对日语的那个日本用户，后来一直在用。视频里山田很认真地鞠了一下躬，然后说，交易所那个工具没有日语，他看不懂，不敢点。「钱的事，看不懂的按钮我不按。」他说。他还说，咔哒的日语页面有一处翻译两年没改，他早想说了。林拓记下：一处翻译。<\/p><p>第十个是土耳其人，用英文。他说他不知道交易所出了什么工具，问那是什么。林拓解释了两句。对方说，哦，那我不用，我的钱不在那儿。<\/p><p>十个打完，周冉把她记的和他记的对在一起。十个人，两张纸。<\/p><p>走的五个，理由一样：方便，免费，本来就在那儿。<\/p><p>留的五个，理由也一样：钱不在交易所，名单不给交易所，要校验，要对账，要别的链。<\/p><p>周冉盯着两张纸看了很久。<\/p><p>「你发现没有，」她说，「留下的这五个人，是什么人？」<\/p><p>「不信交易所的人。」<\/p><p>「信风的用户是什么人？」<\/p><p>他愣了一下。<\/p><p>去年四月，星象上线之后，周冉说过一句话。信风的用户是不想把钥匙交给别人的人。星象的用户是想交给别人的人。<\/p><p>现在她把两张纸并排放在一起。<\/p><p>「同一群人。」她说，「你做了两个东西，给同一群人。这两个东西到今天还没见过面。」<\/p><p>四月五号，周一，三个人开会。阿凯从家里过来，带了一袋橘子。<\/p><p>周冉在白板上画了两个圈。左边写「咔哒」，右边写「信风」。中间空着。<\/p><p>「以前咔哒的用户来发转账，第一步是什么？」<\/p><p>「连钱包。」林拓说。<\/p><p>连钱包就是连一个浏览器插件。插件钱包，说人话，就是给浏览器装的一把外挂钥匙。每次用，你得先找到它，打开它，输密码，点同意。发一批转账，要点四五次同意。新用户装插件这一步就走掉一半。Tom 的游戏去年流失七成，就是卡在这儿。<\/p><p>「Tom 用信风把这一步省了。」周冉说，「咔哒为什么不能？」<\/p><p>阿凯剥了一个橘子。「有一个问题。」<\/p><p>「说。」<\/p><p>「咔哒的页面不能碰钥匙。这是二〇二四年就定的。」<\/p><p>「不碰。」林拓说，「跟 Tom 一样。咔哒接信风的接口，签名在信风里做，咔哒只拿到签完的结果。」<\/p><p>「那咔哒就是信风的客户。」<\/p><p>「嗯。」<\/p><p>「我们成了自己的客户。」阿凯把橘子掰成两半，一半递给周冉，「那就按客户来。走一样的接口，一样的文档，一样的流程。哪一步卡了，说明文档有问题。」<\/p><p>周冉在两个圈中间画了一条线，从右往左，写上：一键用信风签名。<\/p><p>「再来。信风的用户，装了钱包之后，除了放钱，还干什么？」<\/p><p>「查余额。」<\/p><p>「还有？」<\/p><p>「撤授权。」阿凯说，「去年有个用户被一个假网站骗了授权，问我们怎么撤。我把咔哒的链接发给他了。」<\/p><p>「你发了几次？」<\/p><p>「十几次吧。」<\/p><p>周冉画了第二条线，从左往右。信风里放一个「工具」入口，把咔哒里跟钱包有关的几个放进去。授权撤销，余额雷达，批量归集。<\/p><p>「第三条。」她说，「Tom 上个月问过我一件事。」<\/p><p>Tom 的游戏要给两万个玩家发一次奖励。两万个地址。他的团队三个人，问周冉有没有办法。周冉当时回：四月看。<\/p><p>「现在四月了。」周冉画了第三条线，从右下绕到左边：信风的企业客户，用咔哒发空投。<\/p><p>三条线，两个圈。<\/p><p>「这叫什么？」阿凯问。<\/p><p>「产品矩阵。」周冉说，「大厂的词。」<\/p><p>林拓看着白板。他想起的不是大厂的词。<\/p><p>他想起父亲的店。电钻挂在货架第三层，钻头就挂在电钻旁边。买电钻的人，手一伸就是钻头。父亲从来不说「您要不要配个钻头」。他只是把钻头挂在那儿。<\/p><p>「货架。」他说。<\/p><p>周冉看了他一眼。「什么？」<\/p><p>「没什么。做吧。」<\/p><p>做了九天。<\/p><p>九天里他每天九点关电脑。第三天晚上八点五十，一个回调没调通，他看了一眼时间，把电脑合上了。第二天早上七点半到办公室，二十分钟调通。周冉八点半进来，看见他在洗杯子，问：「通了？」他说：「嗯。」她说：「昨晚几点走的？」他说：「九点。」她没再问，回自己位子上，在本子上写了一行什么。他没问她写的什么。<\/p><p>咔哒那一头，林拓做。批量转账的页面上，「连接钱包」按钮旁边多了一个按钮：「用信风签名」。点了，跳出一个指纹的框。手指按上去，签完，回来。不用装任何东西。<\/p><p>阿凯按客户的流程走了一遍。他真的卡了一次，在接口的一个回调上。文档里写得不清楚。他把文档改了，然后在群里发了一句：「客户反馈已处理。」周冉回了一个笑脸。<\/p><p>信风那一头，阿凯做。钱包的首页底下多了一栏，「工具」。<\/p><p>这一栏的名字吵了半个小时。周冉的第一版写的是「推荐工具」。阿凯说不行。<\/p><p>「有一个问题。钱包里出现『推荐』两个字，用户第一个想法是什么？」<\/p><p>「广告。」林拓说。<\/p><p>「用户把钱放在这儿。他看见广告，会想我们是不是缺钱。」阿凯说，「缺钱的钱包，谁敢放钱？」<\/p><p>周冉把「推荐」划了。「那写什么？」<\/p><p>「写它是干什么的。」林拓说，「不写谁推荐的。」<\/p><p>最后定的是三个入口，每个入口后面一行小字。「撤掉你不认识的授权」「看这个地址在几条链上有多少钱」「把几十个地址的钱收到一个地址」。没有「推荐」，没有「咔哒」。点进去是咔哒的页面，签名还是用信风。用户不用知道这是两个东西。<\/p><p>四月十四号，Tom 的两万个地址。<\/p><p>Tom 的团队用的是咔哒批量转账，签名用信风，钱走批量合约。两万笔，打包成六十几笔。从上传到发完，四十分钟。中间校验拦下来十一个格式错的地址。<\/p><p>发完，Tom 在群里发了一张截图，写了一句英文：这是我们第一次不用求人。<\/p><p>第二天，首尔那家在客户群里问：我们也有五千个地址要发，能不能用一样的办法。周冉把 Tom 用的那份步骤转过去，没改一个字。<\/p><p>林拓看了那句话，去楼道洗杯子。<\/p><p>四月十八号，周冉在群里发了一张表。<\/p><p>不是日访客那张，是另一张。咔哒十四个工具，每个工具一行，后面是这个页面每天从搜索引擎来的人。<\/p><p>第一行，批量转账，二〇二四年九月上线的那个。六百。<\/p><p>这个数林拓看了两遍。<\/p><p>那个页面掉了三成，还有六百。掉之前是八百多。它一个页面，顶咔哒后面十个工具加起来。<\/p><p>「你上次改这个页面是什么时候？」周冉问。<\/p><p>他想了想。「去年七月。」<\/p><p>「去年七月你在你爸店里。」<\/p><p>「嗯。改了一个错字。」<\/p><p>「一个错字。九个月。每天六百人。」周冉说，「你二〇二四年九月熬的那两周，现在每天还在给你干活。」<\/p><p>第二行，钱包批量生成，二〇二四年十一月的。三百。第三行，授权撤销，二〇二五年一月的。二百六。<\/p><p>往下，越新的工具，数越小。最新的那个，去年上的，每天四十。<\/p><p>「老船长说三十个小站。」周冉说，「我们没三十个站，我们有十四个页面。每一个都是二〇二四年、二〇二五年做的，到今天都还在带人。这就是他说的东西。」<\/p><p>「复利。」阿凯说。<\/p><p>「什么？」<\/p><p>「利滚利。」阿凯说，「做一次，收很多年。」<\/p><p>四月二十号，周二。<\/p><p>日访客那条线，林拓看了一眼。<\/p><p>两千三。<\/p><p>不是两千。掉之前是两千出头，现在两千三。信风的「工具」入口每天带四百多人过来，这些人本来不搜咔哒，也不知道咔哒。Tom 的截图被他的玩家转了，来了一批看热闹的，有几十个留下了。交易所那边走掉的人，有几个回来了。第七个用户说的那种，地址错了一个字母，交易所没拦，他损失了一笔。<\/p><p>线过了原来的那条。周冉把白板上「负百分之二十」擦了。她没写新的数。<\/p><p>「不写？」林拓问。<\/p><p>「不写。」她说，「写了你又天天看。」<\/p><p>那天晚上他发了航海日志。发完，大鹏在底下回了一条：「三年了。」<\/p><p>他回：「嗯。三年。」<\/p><p>再下面是山田，一句日语，翻译过来是：那处翻译改了吗。<\/p><p>他回：「改了。谢谢。」<\/p><p>周冉在群里补了一句：这个月 Pro 续费的人，比上个月多了十一个。<\/p><p>周三晚上，家里。<\/p><p>沈月在客厅改作业。作业本旁边压着一张纸，三桌的名单，她妈手写的，最后一桌写着「杭州的同事」。他在阳台开着电脑。桌面上是一个演示文稿的文件，标题「信风：三年」。里面一页，两页，三页。第三页他删了，又建了一页，又删了。<\/p><p>「你在干什么？」沈月问。<\/p><p>「周六讲的东西。」<\/p><p>「老船长让你讲？」<\/p><p>「嗯。」<\/p><p>「讲什么？」<\/p><p>「不知道。」<\/p><p>她放下红笔，走到阳台。屏幕上那页写着「第一部分：产品」，底下是空的。<\/p><p>「你要做这个？」<\/p><p>「大家不都做这个。」<\/p><p>「你在那儿三年，见过谁做这个？」<\/p><p>他想了想。老船长没做过。周冉那次讲漏斗，也是拿一张纸。<\/p><p>「你就讲你怎么过来的。」她说，「从那个文件夹。」<\/p><p>「太长。」<\/p>
