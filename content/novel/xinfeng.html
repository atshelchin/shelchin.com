<p>「那就挑。」她回去坐下，拿起红笔，「讲你答不上来的那几次。」<\/p><p>他看着屏幕。「第一部分：产品」。他把整个文件删了。<\/p><p>四月二十四号，周六下午两点。<\/p><p>「不打烊」茶馆还是那个茶馆。西湖边，二楼，木头窗。三年前他第一次来，十几个人，一张长桌。今天长桌拼了两张，还不够，靠墙又加了一排椅子。他数了一下，三十多个人。有几张脸认识，大部分不认识。<\/p><p>他往里走的时候，一个戴眼镜的年轻人站起来。「你是林拓？」<\/p><p>「嗯。」<\/p><p>「我看你日志两年多了。从一百三十七块那条开始。」<\/p><p>林拓不知道说什么，说了一句「谢谢」。年轻人也不知道说什么，坐下了。<\/p><p>靠门那把椅子有人坐。很年轻，二十五六，一个人，背着包没放下，手机扣在腿上。他看了林拓一眼，又低下头。三年前林拓坐的就是那把椅子。<\/p><p>小杜坐在中间，看见他就招手。周冉坐小杜旁边，阿凯坐周冉旁边。沈月没来。她说这是你的地方，你自己去。<\/p><p>老船长坐在他老位子上，靠窗那头。桌上一壶普洱，几个白瓷杯。他四十五了，头发比三年前白了一些，说话还是慢。<\/p><p>林拓走过去。<\/p><p>「来了。」老船长说。<\/p><p>「嗯。」<\/p><p>「坐。」<\/p><p>他坐在老船长右边。三年前他坐的是最角落那张椅子，靠门，方便走。<\/p><p>老船长给自己倒了一杯，又拿了一个空杯，倒满。<\/p><p>普洱的颜色很深。热气从杯口上来，一下就散了。<\/p><p>他把那杯推到林拓面前。<\/p><p>「你讲。」<\/p><aside class=\"log\"><div class=\"log-label\">航海日志<\/div><p>4 月 20 日。<\/p><p>咔哒和信风连起来了。咔哒里一键用信风签名，信风里放了咔哒的工具，Tom 用咔哒给两万个玩家发了奖励。<\/p><p>交易所内置了免费的批量转账，咔哒掉了两成。我问了十个用户。走的人为了方便，留的人为了名单不给别人。留的人和信风的用户是同一群人。<\/p><p>2024 年 9 月做的第一个工具，今天还每天带 600 人。我上次改它是九个月前，改了一个错字。<\/p><p>日访客回到 2,300。周冉把白板上的负数擦了。<\/p><\/aside>", "words": 4866}, {"num": 36, "title": "夜航船", "vol": 4, "html": "<p>二〇二七年四月二十四日，下午两点十分，那杯普洱在林拓面前，热气已经散了。<\/p><p>「不打烊」二楼，三十多个人，两张长桌拼在一起，靠墙又加了一排椅子。窗开着，西湖那边的风进来，把桌上一张纸吹得动了一下。老船长说完「你讲」，就靠回椅背，端着自己那杯，不看他。<\/p><p>没有人催。这是夜航船的规矩，谁讲都不催。<\/p><p>林拓把杯子端起来，喝了一口，放下。手有点抖，他把手放到桌子底下。<\/p><p>「嗯。」他说，「我叫林拓。」<\/p><p>有人笑了一下，不是嘲笑。三十多个人里大部分知道他是谁。<\/p><p>「我不会讲话。」他说，「我做后端的。」<\/p><p>对面周冉抬了抬下巴。她嘴型说了三个字：讲故事。<\/p><p>他点了一下头。<\/p><p>「那我从头讲。」<\/p><p>「二〇二四年三月十四号，凌晨一点。我在公司修线上故障。订单服务超时。修好了，一点二十六分。打车回家，快两点。桌上有一碗饭，我女朋友留的。我坐在阳台上刷手机，看到一张截图。一个人，一个小工具站，一个月三万。底下一百多条评论，一半骂假的，一半问怎么做的。」<\/p><p>「我那时候一个月到手一万四。不是馋那三万。是想不通。我写了六年代码，做的东西没有一样是自己的。」<\/p><p>「那天晚上我在桌面上建了一个文件夹。想了很久，叫『自己的东西』。里面什么都没有。」<\/p><p>「空的。我盯着它，比线上故障还慌。」<\/p><p>他停了一下。<\/p><p>「然后我做了个东西。记账加番茄钟。为什么做这个？因为我自己想要。三个月，周末和凌晨。用 AI 写得很快。上线，发朋友圈，四十七个下载，都是认识的人。收入零。」<\/p><p>「一条差评。写的是：这是给谁用的？」<\/p><p>「我答不出来。」<\/p><p>「七月底，小杜带我来这儿。就这个桌子。人比现在少，十几个。老船长问了我三个问题。谁会为它付钱。他们现在在哪，用什么凑合。你凭什么比他们现在的办法好。」<\/p><p>「我一个都答不上。」<\/p><p>「然后周冉问我，三个月，你跟几个用户聊过。」<\/p><p>他看了周冉一眼。周冉没有表情。<\/p><p>「零。」<\/p><p>「全场没人说话。就跟现在一样。」<\/p><p>这次有人笑出了声。他也笑了一下，很短。<\/p><p>「散场的时候老船长说，下次来，带一个别人问过你的问题。我想了一路。我在公司被人问过的问题，都是『线上又挂了吗』。」<\/p><p>他喝了一口茶。<\/p><p>「八月，一个做社区运营的，叫大鹏。他在群里骂，给三百个地址发代币要手点两个小时，点错一个就完了。我说我帮你写个脚本。当晚写完，他用了，十分钟。他转我两百块，说请你喝咖啡。」<\/p><p>「两百块。」<\/p><p>「我盯着那两百块看了很久。我做了六年后端，那是第一次有人为我做的东西付钱。」<\/p><p>「我拿三问对了一遍。谁付钱，大鹏这样的人。他们现在用什么，手点，表格，找程序员朋友。凭什么好，十分钟对两小时，不会点错。」<\/p><p>「三个都过了。我给我爸打了个电话。他在店里，背景有工具箱合上的声音。咔哒。我就叫它咔哒。」<\/p><p>「两周做成网页。只做一件事，批量转账。九月七号上线，第一天三个访客，都是我。」<\/p><p>「第一周十二个用户。二十六天后，第一笔手续费，一百三十七块。」<\/p><p>「我女朋友说，够一顿火锅。我们真去吃了。」<\/p><p>「周冉教我发帖。数字，一件事，一个教训。失败也发，截图不 P。我发了第一条，二十个赞，三个人问怎么做的。从那天到今天，我发了三年。」<\/p><p>他停下来，好像在数什么。<\/p><p>「我跳一点。」<\/p><p>「十月，我打开搜索控制台，发现有人搜『批量转账』找到了我。三十七个不同的搜索词。我一个一个看，像在听陌生人说话。周冉说，你做的不是 App，是一堆页面。每个工具一页，标题就是别人会搜的话。」<\/p><p>「一月，上了三种语言。一个日本用户帮我校对日语，叫山田。他很认真。上个月他还在用。」<\/p><p>「二月，出了事故。一种代币小数位不一样，三个用户多转出去四千块。我先想的是怎么解释。后来想到我爸。他修东西不收钱。我两小时修好，全赔，写了报告，发出去。」<\/p><p>「新用户反而多了。老船长说，工具站的护城河是信任，不是功能。」<\/p><p>「三月，有人抄了我的站。域名不一样，页面一样，连那句『我们只是一把扳手』都抄了。买了广告，排在我前面。」<\/p><p>「我想投诉，想改名。周冉说，他抄得走页面，抄不走你每周的更新，抄不走你群里三百个人。」<\/p><p>「我就每周上一个新工具。三个月，他死了。我那个月一万二。第一次破万。」<\/p><p>「五月，行情好，两万一。比工资高。我飘了。想同时做五个工具，想买广告。老船长说，潮水来的时候每个人都是天才。你现在该做的是备粮。」<\/p><p>「我信了。还好我信了。」<\/p><p>「六月，我领导把我叫进会议室。投影上是我的站。有人举报。」<\/p><p>「人事问了三个问题。用没用公司设备，用没用公司时间，跟不跟公司业务相关。我说没有。我拿得出证据，提交记录全在夜里，电脑是我自己的。这个习惯是第一天就有的。」<\/p><p>「不追究。但裁员名单里有我。六月二十号。N 加一，八万二。」<\/p><p>「我抱着纸箱下楼，箱子里有我爸的螺丝刀。在楼下算了一笔账。存款加赔偿二十六万。月支出一万八千五。十四个月。」<\/p><p>「四律第四条，离岸前先备粮。十二个月生活费，副业收入过工资一半，连续三个月。我都过了。但我知道那三个月里有一个月是潮水。」<\/p><p>「我没投简历。」<\/p><p>「不是因为勇敢。是因为算过。」<\/p><p>他把杯子拿起来，发现空了。老船长给他添上。他等茶倒完。<\/p><p>「六月二十八号，全职第三天。群里一个女孩发消息，说她的助记词丢了，八万块没了。她叫阿珍。大学生。实习工资和奖学金攒的。抄在一个本子上，本子丢了。」<\/p><p>「助记词，就是一把只有一份、丢了没法补的钥匙。谁捡到谁就能开门。」<\/p><p>「我什么都做不了。钱还在链上，永远拿不出来。我陪她查了一晚上。」<\/p><p>「我想，钱包不该有这个东西。用指纹。钱包是链上一个有规矩的保险箱，不是一把裸钥匙。」<\/p><p>「老船长说，这是一艘大船。三问。」<\/p><p>「第一问，谁付钱。我答不清。」<\/p><p>「阿凯说，钱包是最容易让人倾家荡产的软件。你确定？」<\/p><p>「周冉说，小工具养大船。咔哒继续跑，拿它的钱造船。」<\/p><p>「我们叫它信风。每年按时来的风，靠得住的风。」<\/p><p>「造了八个月。七条原则，写在群里，说以后打脸大家看得见。今年一月我发现有一条我只做了一半。」<\/p><p>「审计报价四十万，我们存款十八万。阿凯说，核心合约用已经审过的开源的当龙骨，我们只审自己写的那一小块。开赏金。」<\/p><p>「提交应用商店，被拒三次。第一次，主体不对。第二次，审核员看不懂什么叫没有助记词的钱包。我录了三分钟视频。第三次，一个页面的词像投资引导。我们把所有『收益』都删了。」<\/p><p>「二月二十七号凌晨三点，过了。」<\/p><p>「三月十二号上线。猎品榜第三。一周六千用户。」<\/p><p>「四月一号，夜里十一点，一封邮件。标题：我发现了一个漏洞。发件人 0xRain。」<\/p><p>「恢复流程里，在一个特定时间点，备用钥匙可以被登记两次。攻击者能在你不知道的时候多配一把钥匙。」<\/p><p>「两小时确认，二十六小时修好，四十八小时公开。赏金两万。存款从十四万到十二万。」<\/p><p>「我女朋友说，付。」<\/p><p>「四月二十号，星象钱包上线，一样的功能。无助记词，指纹登录。铺天盖地。」<\/p><p>「我三天没发日志。」<\/p><p>他停了很久。窗外有船的声音。<\/p><p>「然后是我最想跳过的一段。」<\/p><p>「用户涨到一万五。活跃三千。收入九百。」<\/p><p>「九百。」<\/p><p>「试了三种付费，都不行。钱包用户不觉得自己在用软件，觉得自己在放钱。收费像交保护费。」<\/p><p>「我开始四点醒。看数据。我女朋友说我不在了。吃饭看手机，睡觉想漏洞，她说话我嗯。」<\/p><p>「一个老同学的公司倒了，两千万烧完。我们在江边喝酒。他说他做了两年，没见过一个真实用户。我说我有一万五千个用户，收入九百。我们都笑了。」<\/p><p>「他问我谁付钱。我答不出。」<\/p><p>「七月，我爸中风。轻度。我回去看了两周店。」<\/p><p>「店里的日常是这样的。一个老主顾来买一颗螺丝，不收钱。一个老头拿风扇来修，我爸坐着指挥我修，不收钱。他说，他下次买东西还来。」<\/p><p>「我在店里用手机回工单。一个新加坡的开发者问，能不能嵌到我们的游戏里。我随手回，可以研究。没在意。」<\/p><p>「我爸看我回工单，说，你也在开店。」<\/p><p>「我问他，二十八年怎么过来的。」<\/p><p>「他说，一颗一颗卖。」<\/p><p>「八月，我女朋友说，到年底。不是收入多少，是你回不回来。」<\/p><p>「九月，存款四万六。一封邮件，年薪六十万。我算了，一年就能把存款补回来。」<\/p><p>「我去找老船长。他讲了他二〇一八年的事。他讲完说，产品不是你。你可以停。船不会沉，它只是停在那儿。」<\/p><p>「我停了一周。睡觉，跑步，不碰代码。」<\/p><p>「第八天，那个新加坡开发者又来了邮件。他叫 Tom。他的游戏用户讨厌装钱包插件，流失七成。他想用信风让用户用指纹直接进。他问，能付费吗。」<\/p><p>「我看着那封邮件，忽然明白了。」<\/p><p>「付钱的不是用户。是需要这些用户的开发者。」<\/p><p>「第一问。十六个月。」<\/p><p>「周冉入伙。定价，二百九十九美元一个月。Tom 砍价，我想打折，周冉踢我。不打折，锁价两年。」<\/p><p>「三天，我们帮他接完。他的流失从七成到三成。」<\/p><p>「十二月，咔哒一万四，信风九千。两万三。不是发财。是掉头了。」<\/p><p>「今年，开源，租了四十平米，三张桌子。拒了一单三万美元的定制。咔哒和信风连起来了。四月，两个产品，三个人，四万多一个月。」<\/p><p>「二〇二四年九月做的第一个工具，今天每天还带六百个人。」<\/p><p>他停下来。看了看那杯茶。<\/p><p>「就这些。」<\/p><p>「我没有成功。这个词我不用。我只是还在。船没沉。」<\/p><p>「我爸说，工具不用讲，拿起来顺手就是道理。我讲了这么多，也是这个意思。你做一个东西，有人拿起来顺手，付你两百块。然后一颗一颗卖。」<\/p><p>「讲完了。」<\/p><p>他把杯子端起来，喝了一大口。茶已经凉了。<\/p><p>安静了几秒。然后老船长敲了敲桌子。他敲一下，大家就都敲。这是夜航船鼓掌的方式，木头桌子，三十几只手，声音闷闷的。<\/p><p>「提问。」老船长说。<\/p><p>第一个举手的是那个戴眼镜的年轻人，看他日志两年的那个。<\/p><p>「什么时候辞职？」<\/p><p>「四律第四条。」林拓说，「十二个月生活费，副业收入过工资一半，连续三个月。数字过了线再走。」<\/p><p>「你是过了线才走的？」<\/p><p>「我是被裁的。」他说，「但数字过了线，所以我没投简历。没过线，我会投。」<\/p><p>年轻人点头，记了什么。<\/p><p>第二个是一个女孩，坐在周冉后面。「被抄怎么办？」<\/p><p>「比他快。」<\/p><p>「就这样？」<\/p><p>「他抄得走你这周的页面，抄不走你下周的更新。也抄不走你群里的人。」林拓说，「你跑起来，他追一个月就累了。我那个三个月就死了。」<\/p><p>第三个从最后一排来，声音不大。「没收入怎么办？」<\/p><p>林拓想了一会儿。<\/p><p>「问第一问。」<\/p><p>「问了。答不出。」<\/p><p>「我答了十六个月。」他说，「一万五千个用户，九百块，我还是答不出。后来是一个客户替我答的。你别自己想。去问旁边的人，问用你东西的人，问需要你东西的人。」<\/p><p>那人没再问。<\/p><p>老船长看了一圈。「还有吗？」<\/p><p>小杜举手。<\/p><p>他坐在中间，周冉旁边。手举得不高。<\/p><p>「我说一句。」<\/p><p>「你讲。」老船长说。<\/p><p>「我去年八月辞职的。」小杜说，「做了一个给小网店算运费的工具。做了八个月。」<\/p><p>他停了一下。<\/p><p>「上个月，第一笔收入。六十块。一个人买了年费。」<\/p><p>没人说话。<\/p><p>然后老船长敲了一下桌子。<\/p><p>三十几只手，一起敲。比刚才响。<\/p><p>小杜的脸红了，低下头，又抬起来。他看向林拓。<\/p><p>林拓没说话。他冲小杜点了一下头。<\/p><p>「好。」老船长说。<\/p><p>只这一个字。二〇二四年九月七号，咔哒上线那天，他在群里回的也是这一个字。<\/p><p>散场是四点半。<\/p><p>人陆陆续续站起来。有人来加林拓的微信，有人跟周冉聊漏斗。阿凯已经走到楼梯口，回头等他们。<\/p><p>林拓收东西的时候，看见靠门那把椅子。<\/p><p>那个年轻人还坐着。背包一直没放下来。手机扣在腿上。他从头到尾没说一句话，也没举手。<\/p><p>三年前林拓坐的就是那把椅子。也是背着包，也是没说话，也是等所有人走了才走。<\/p><p>他走过去。<\/p><p>年轻人抬起头，有点慌，站起来，包带从肩上滑下来。<\/p><p>「你第一次来？」林拓问。<\/p><p>「嗯。」<\/p><p>「做了什么？」<\/p><p>「一个……一个记单词的。」年轻人说，「我自己想要的。」<\/p><p>林拓点头。<\/p><p>「有人用吗？」<\/p><p>「没有。」<\/p><p>他们站着。楼下有人在收杯子。<\/p><p>「下次来，」林拓说，「带一个别人问过你的问题。」<\/p><p>年轻人愣了一下。「什么问题？」<\/p><p>「随便什么。别人问你的。不是你自己想的。」<\/p><p>年轻人想了一会儿，点了点头。他把包背好，说了声谢谢，下楼了。<\/p><p>林拓站在那儿，看着那把空椅子。<\/p><p>周冉在楼梯口喊他。「走了。」<\/p><p>「嗯。」<\/p><p>他转过身。<\/p><p>靠墙那排椅子，最后一把，还坐着一个人。<\/p><p>刚才提问的时候他没注意。散场的时候他没注意。那个人一直坐在那儿，没动，没举手，没来加微信。<\/p><p>穿一件灰色的夹克，瘦了很多。头发比以前短。<\/p><p>那个人端着一杯凉了的茶，冲他举了一下。<\/p><p>郑浩。<\/p><aside class=\"log\"><div class=\"log-label\">航海日志<\/div><p>4 月 24 日。<\/p><p>第一次在夜航船讲。没用幻灯片。讲了一个多小时，讲得不好，中间跳了几段。<\/p><p>三个问题：什么时候辞职，被抄怎么办，没收入怎么办。答案都在前面三年里。<\/p><p>小杜第一笔收入，60 块。全场敲桌子。<\/p><p>角落里坐着一个背着包的人。我跟他说了三年前老船长跟我说的那句话。<\/p><p>郑浩来了。坐在最后一排。<\/p><\/aside>", "words": 4992}, {"num": 37, "title": "郑浩的第一个用户", "vol": 4, "html": "<p>2027 年 4 月 26 日，星期一，早上八点。林拓到办公室的时候，郑浩坐在门口的台阶上。<\/p><p>办公室在滨江一个园区里，四十平米，三张桌子，一月租的。林拓的桌子靠窗，阿凯的靠门，周冉的背对窗。靠窗的桌角上放着那把旧螺丝刀。咔哒和信风加起来，一个月四万多。婚礼在五月，日子还没定。<\/p><p>郑浩手里两杯咖啡，一杯已经空了。<\/p><p>「你几点来的？」<\/p><p>「七点。我怕你六点就来。」郑浩把另一杯递给他，「我有个东西，想给你看。」<\/p><p>林拓开门。郑浩跟进来，包放在阿凯的桌上，笔记本掏出来，开机。他的动作还是快，像两年前在滨江大排档讲融资的时候。<\/p><p>屏幕上是一份文档。标题：「智排云 · 餐饮门店智能排班 SaaS」。<\/p><p>林拓看了标题，没往下看。<\/p><p>「你姐的店叫什么？」<\/p><p>郑浩愣了一下。「芳姐小炒。就在楼下那条街，第三家。」<\/p><p>「她管这个叫什么？」<\/p><p>「叫什么？」<\/p><p>「她说『我打开智排云』吗？」<\/p><p>郑浩把笔记本合上一半，又打开。「她说『排班』。」<\/p><p>「那就叫排班。」<\/p><p>周冉进来了，手里一袋包子。她看了一眼屏幕，看了一眼郑浩，把包子放在桌上。<\/p><p>「先别写代码。」她说。<\/p><p>「我还没写。」郑浩说。<\/p><p>「那就好。」<\/p><p>阿凯最后到。他进门先看郑浩的包放在自己桌上，没说话，把包挪到椅子上，坐下开电脑。<\/p><p>郑浩是四月二十四号来的。那天他坐在夜航船最后一排，散场以后跟林拓走到西湖边，说了一句话：「我想做个小的。」林拓说，好。郑浩说，你帮我。林拓说，我帮你过三问。<\/p><p>现在是三问的时候了。<\/p><p>「第一问。」林拓说，「谁付钱？」<\/p><p>郑浩坐直了。「全国餐饮门店九百多万家。小店占八成。现在的排班软件都是给连锁做的，年费几千上万，小店用不起。这个市场是空的。就算只做一个点……」<\/p><p>「你姐付吗？」<\/p><p>「她是我姐。」<\/p><p>「那不算。」林拓说，「除了你姐，说一个名字。」<\/p><p>郑浩张了张嘴。<\/p><p>「一个就行。」<\/p><p>「……我还没问。」<\/p><p>「那第一问没答。」林拓在便签上写了个「1」，画了个圈，「第二问。他们今天在哪儿，用什么凑合？」<\/p><p>「市面上没有给小店的产品。我查过了，应用商店里……」<\/p><p>「我问的不是软件。」林拓说，「你姐现在怎么排班？」<\/p><p>郑浩想了想。「外卖单背面。每周日晚上写一张，拍照发群里。」<\/p><p>「然后呢？」<\/p><p>「然后有人看不见。周三有个人没来，说没看到。她骂了一顿。」<\/p><p>「别的店呢？」<\/p><p>「应该差不多。」<\/p><p>「应该。」林拓把这两个字重复了一遍。<\/p><p>郑浩不说话了。<\/p><p>周冉在旁边吃包子。她咬了一口，说：「他三年前也说『应该』。我问他跟几个用户聊过，他说零。」<\/p><p>「那时候是零。」林拓说。<\/p><p>「现在呢？」周冉看着郑浩。<\/p><p>「……一个。我姐。」<\/p><p>「半个。」周冉说，「亲戚算半个。」<\/p><p>林拓在便签上写了「2」，画了个圈。「第三问。凭什么比他们现在的办法好？」<\/p><p>这一问郑浩准备过。他把笔记本转过来，翻到一页。上面有五个功能：智能排班、高峰预测、一键生成、多店管理、数据看板。<\/p><p>「AI 自动排。她只要填几个人、几个班，一键就出来。还能根据外卖平台的数据预测高峰，自动多排一个人。」<\/p><p>林拓看着那五个功能。<\/p><p>「你姐会点『一键生成』吗？」<\/p><p>「……她连群里的消息都不会@人。」<\/p><p>「那她凭什么换？」<\/p><p>郑浩没答。他看着那五个功能，看了一会儿，把笔记本合上了。<\/p><p>办公室里只有阿凯敲键盘的声音。<\/p><p>「去问她。」林拓说，「再问四个不是你姐的。」<\/p><p>「问什么？」<\/p><p>「不要问他们要不要软件。问他们上个星期排班出了什么事。」<\/p><p>郑浩把这句话记在手机上。他记的时候嘴唇在动。<\/p><p>阿凯忽然抬头。「有一个问题。」<\/p><p>三个人都看他。<\/p><p>「员工的手机号存哪儿？」阿凯说，「你要发通知，就得有手机号。你存在哪儿，谁能看，店关了怎么删。」<\/p><p>郑浩看着他。「我还没想到这一步。」<\/p><p>「现在想。」阿凯说完，低头继续敲。<\/p><p>郑浩走的时候，把那份「智排云」的文档删了。林拓看见他删的。他没说什么。<\/p><p>楼下那条街有二十几家店。早餐店、面馆、奶茶店、烧烤、小炒、便利店。中午人多，下午三点到五点没人，晚上又满。林拓每天走过去，从来没进去看过。<\/p><p>郑浩去了三天。<\/p><p>第一天他回来得早，五点。坐在阿凯的椅子上，不说话。周冉问他怎么样，他说，被赶出来一次。面馆老板正忙，让他等着，他等了四十分钟，老板说没空。<\/p><p>「几点去的？」林拓问。<\/p><p>「十二点。」<\/p><p>「他们十二点最忙。」<\/p><p>「我知道了。」郑浩说。<\/p><p>第二天他下午三点去的。回来是七点。他没来办公室，在群里发了一句：「聊了三个。明天继续。」<\/p><p>第三天，周四，他六点半回来。林拓在改一个工单，周冉已经走了，阿凯在开会。郑浩推门进来，把一个本子拍在桌上。<\/p><p>不是笔记本电脑。是一个纸的本子，小学生用的那种，田字格。<\/p><p>「五个。」他说。<\/p><p>林拓把工单放下。<\/p><p>郑浩翻开本子。每一页上面一个名字，下面写满了字。字很潦草，有的地方划掉了重写。<\/p><p>「面馆老王。十二个员工，两班倒。用的是白板，挂在后厨。每周一擦掉重写。他说排班不难，十分钟的事。难的是改。有人临时换班，跟另一个人私下说好了，不告诉他。他以为今天有六个人，来了五个。」<\/p><p>「奶茶店，店长小蒋，二十三岁。八个人，都是学生兼职。用表格软件排，打印出来贴墙上。问题一样，换班。她说她一天要在群里问三遍『明天谁上』。」<\/p><p>「烧烤店，老刘两口子。七个人。老刘排在手机备忘录里，一个一个私聊。他老婆说他每次都漏一个。」<\/p><p>「早餐店，老太太。没有员工，就她和儿子。不需要。」<\/p><p>「我姐。你知道的。」<\/p><p>他合上本子。<\/p><p>「五个里面四个有员工。四个都说排班不难。四个都说，难的是换班以后没人知道。」<\/p><p>林拓看着那个本子。<\/p><p>「所以我原来那五个功能，」郑浩说，「一个都不要。他们要的是一张表，谁都能在手机上看，换班了点一下，老板知道。」<\/p><p>他停了一下。<\/p><p>「就这么一件事。」<\/p><p>林拓没说话。他站起来，拿了自己的杯子和郑浩带来的那个纸杯，去茶水间洗。水开着，他洗了很久。<\/p><p>回来的时候郑浩还在说。他说老王后厨的白板上有一块擦不掉的印子，是两年前用记号笔写的，一直在那儿。他说小蒋给他看了群聊记录，她一个月问了七十多次「明天谁上」。他说老刘的老婆一边串肉一边跟他讲，讲到一半客人来了，让他明天再来，他明天真去了。<\/p><p>他说着说着，忽然停下来。<\/p><p>「你说。」他说。<\/p><p>「说什么？」<\/p><p>「我说太多了。你说。」<\/p><p>林拓想了一下。「你以前不这样。」<\/p><p>「以前我说话是给人听的。投资人、员工、媒体。」郑浩说，「这三天我发现，说话没用。他们在忙，你说什么他们都点头。你得闭嘴，看他们干活。」<\/p><p>「嗯。」<\/p><p>「老王擦白板的时候我在旁边看。他擦了三遍才擦干净。我就想，他每周都要擦三遍。」<\/p><p>林拓点头。<\/p><p>「我见到用户了。」郑浩说。<\/p><p>这句话他说得很平，没有加语气。但他说完以后，两只手在桌上放着，不动了。<\/p><p>那天晚上林拓回家，沈月在改作业。<\/p><p>「郑浩怎么样？」<\/p><p>「跟五个老板聊了。」<\/p><p>「然后呢？」<\/p><p>「他说他见到用户了。」<\/p><p>沈月抬头看他。「你笑什么？」<\/p><p>「没笑。」<\/p><p>「你笑了。」她把红笔放下，「叫他来吃饭。他一个人在杭州，住他姐家，他姐开店的，哪有时间给他做饭。」<\/p><p>「好。」<\/p><p>「还有，」她说，「我妈问日子。」<\/p><p>「我妈说她在看。」<\/p><p>「看什么？」<\/p><p>「日子。」林拓说，「她要看那个书。」<\/p><p>沈月笑了一下，没再问。<\/p><p>接下来一周，郑浩在办公室的角落里加了一张折叠桌。他自己买的，八十块。周冉说，这里不是孵化器。郑浩说，我付房租。周冉说，一天二十。郑浩真的每天转二十。<\/p><p>他开始写代码。<\/p><p>林拓没帮他写。第二天晚上郑浩卡在一个地方，说林拓你帮我看一眼。林拓走过去，看了一眼，手已经放到键盘上了。周冉在门口说了一句：「他的船，他自己造。」<\/p><p>林拓把手拿开。<\/p><p>「你自己查。」他说，「AI 助手会告诉你。」<\/p><p>郑浩查了两个小时，查出来了。他没说什么，但第二天他没再叫林拓。<\/p><p>阿凯倒是过去了一次。他站在郑浩后面看了十分钟，说了一句：「手机号别存明文。」然后回自己的座位。郑浩问什么叫明文，阿凯说，就是谁打开数据库都能看见，像把钥匙挂在门上。郑浩改了。<\/p><p>林拓给了郑浩一个建议，只有一个。<\/p><p>「先别上线。先手动。」<\/p><p>「什么意思？」<\/p><p>「你先帮老王排一周。用表格，手动排，做成一张图发给他。看他用不用。」<\/p><p>「那不是软件。」<\/p><p>「大鹏那三百个地址，我先写的是脚本。」林拓说，「有人用了，再做网页。」<\/p><p>郑浩想了想，说好。<\/p><p>他帮老王排了一周。老王的白板擦掉了，换成一张打印的表贴在原来的位置。周三有人换班，老王在群里@郑浩，郑浩改了表，重新打印，送过去。他一天跑了三趟面馆。<\/p><p>周五，老王说，你那个东西能不能让他们自己改。<\/p><p>郑浩说，能。<\/p><p>五月七日，星期五，郑浩把那个东西上线了。一个网页，没有 App。打开是一张表，七天，两个班，十二个名字。员工点自己的名字，能看到自己哪天上班。想换班，点一下，选一个人，对方同意，老板那边亮一下。<\/p><p>名字他改了三次。「智排云」删了以后叫「排班表」，周冉说太像文件名。又叫「小店排班」，阿凯说像广告。最后叫「今天谁上班」。<\/p><p>郑浩说，小蒋一天问三遍的就是这句话。<\/p><p>林拓说，行。<\/p><p>老王用了。第一天，周五晚上，一个员工要换周日的班，在网页上点了。另一个人同意了，老王的手机亮了一下。老王在群里发了一条：「以后换班用这个。」<\/p><p>郑浩把这条截图发给林拓。<\/p><p>林拓回了一个字：「好。」<\/p><p>发完他想起来，三年前老船长在群里回他的，也是这个字。<\/p><p>五月八日，星期六。<\/p><p>郑浩早上没来办公室。林拓在家。沈月去学校补课，走之前把粥煮上了。他坐在阳台那张小桌子前，回用户工单。工单就是用户写来的问题，一条一条，像店里来的客人，来一个接待一个。<\/p><p>十点二十，手机响。郑浩。<\/p><p>「他付了。」<\/p><p>「谁？」<\/p><p>「老王。」郑浩的声音有点抖，「我昨天说三十块一个月，先免费试。他今天早上说不用试了，直接付。」<\/p><p>「怎么付的？」<\/p><p>「扫我的码。三十块。」<\/p><p>林拓没说话。<\/p><p>「我以前融了两千万。」郑浩说，「到账那天，我们在深圳湾开香槟，四十个人。我记得那天挺高兴的。」<\/p><p>他停了一下。<\/p><p>「没有这三十块高兴。」<\/p><p>林拓拿着手机，看着阳台外面。对面那栋楼，白天，窗户都亮着，看不出哪扇有人。<\/p><p>「晚上去江边。」他说。<\/p><p>「好。」<\/p><p>滨江的江边离出租屋二十分钟。一年前的六月，他们在这里喝过一晚上酒，郑浩的公司刚倒。那时候林拓一万五千个用户，收入九百，郑浩问他谁付钱，他答不出来。<\/p><p>今天他们没喝酒。郑浩买了两杯奶茶，小蒋店里的。小蒋知道他做了什么，说下个月她也用，还没付。<\/p><p>「她说等她把八个学生的名字都填进去。」郑浩说，「我说我帮你填。她说不用，她自己来。」<\/p><p>「那就让她自己来。」<\/p><p>「嗯。」<\/p><p>江上有船。夜里船开得慢，灯一个一个往下游走。对岸的楼一半亮着。<\/p><p>「一个用户，三十块。」郑浩说，「我算了一下，要到我以前工资的水平，得一千个老王。」<\/p><p>「嗯。」<\/p><p>「你当年多久？」<\/p><p>「从两百块到一万，七个月。」<\/p><p>「那我得一年多。」<\/p><p>「不一定。」林拓说，「也可能三年，也可能到不了。」<\/p><p>郑浩笑了。「你三年前不会这么说话。」<\/p><p>「三年前我不知道。」<\/p><p>两个人喝奶茶。奶茶太甜。郑浩把吸管拔出来又插回去。<\/p><p>「我想过，」他说，「如果两年前我也这么干。找五个老板，先手动排，收三十块。」<\/p><p>「然后呢？」<\/p><p>「然后不知道。」郑浩说，「可能还是会去融资。那时候我坐不住。有人给你两千万，你说不要？我不是那种人。」<\/p><p>林拓没接。<\/p><p>「去年在这儿，我说你那条路适合你，我那条不适合我。」郑浩说，「我说完就后悔了。我觉得我在安慰你。」<\/p><p>「你是在安慰我。」<\/p><p>「现在不是了。」郑浩看着江面，「现在我不知道哪条路适合我。我就知道老王明天要用。周日他有人换班。」<\/p><p>林拓喝了一口奶茶。<\/p><p>「够了。」他说。<\/p><p>「什么够了？」<\/p><p>「知道老王明天要用。够了。」<\/p><p>郑浩没再说话。一条船开过去，很慢，灯从他们面前走到左边，走到看不见。<\/p><p>「你结婚，我去。」郑浩说。<\/p><p>「日子还没定。」<\/p><p>「定了告诉我。我买票。」他想了想，「不，我先看老王那周有没有人换班。」<\/p><p>林拓笑了。他笑得很短，郑浩没看见。<\/p><p>十点，郑浩走了，说明天早上要去老王店里，看看周日的班怎么样。他走的时候把两个奶茶杯带走了，说小蒋让他把杯子送回去，她要回收。<\/p><p>林拓一个人往回走。<\/p><p>路上手机响。母亲。<\/p><p>「崽。」这是父亲的叫法，母亲平时不这么叫，今天叫了。<\/p><p>「妈。」<\/p><p>「日子定了。二十号。」<\/p><p>「哪个二十号？」<\/p><p>「这个月。五月二十。」母亲说，「我看了书，那天好。酒店我订了，就县里那家，两桌。你跟月月说一声。她妈那边我打过电话了，她妈说行。」<\/p><p>「好。」<\/p><p>「你回来早一天。」<\/p><p>「好。」<\/p><p>「还有。」母亲停了一下。她平时不停的，今天停了。<\/p><p>「你爸有东西给你。」<\/p><p>「什么东西？」<\/p><p>「他不让我说。」<\/p><p>林拓站在路边。路灯一根一根，往江边那头去。<\/p><p>「妈。」<\/p><p>「嗯？」<\/p><p>「他手好了吗？」<\/p><p>「好了。」母亲说，「拧螺丝没问题。就是拧得慢。」<\/p><aside class=\"log\"><div class=\"log-label\">航海日志<\/div><p>5 月 8 日。<\/p><p>郑浩的第一个用户，30 块。一个面馆老板，十二个员工。<\/p><p>他跟五个老板聊了。三天，一个本子，五页。<\/p><p>他原来想做五个功能。聊完以后，做了一个：换班了，老板知道。<\/p><p>这比 2,000 万难。他自己说的。<\/p><p>我妈打电话，婚礼定在 20 号。<\/p><\/aside>", "words": 5059}, {"num": 38, "title": "婚礼", "vol": 4, "html": "<p>2027 年 5 月 20 日，星期四，早上六点半。林拓跑到建国五金门口的时候，卷帘门拉起了一半。<\/p><p>他是昨天到的县城。沈月和她父母住在酒店，他住家里。今天中午两桌酒，酒店在县政府对面，母亲订的。他早上六点醒，换了鞋，沿着河堤跑了五公里。这个习惯是去年十月养成的，回老家也没断。跑完正好到店门口。<\/p><p>父亲蹲在门里面，在拧一个水龙头的阀芯。右手拿螺丝刀，拧得慢，一下一下。<\/p><p>「爸。」<\/p><p>父亲没抬头。「跑步？」<\/p><p>「嗯。」<\/p><p>「跑什么。」<\/p><p>林拓没答。他站在门口等父亲把阀芯拧上。父亲拧了三下，停了，换左手扶着，右手再拧。拧上了。父亲把阀芯放在柜台上，站起来，膝盖响了一声。<\/p><p>「崽，过来。」<\/p><p>父亲走到货架尽头，弯腰，从底下把那个绿色铁皮工具箱拖出来。角上的锈比去年夏天又多了一点。他用两只手拎着，放到柜台上，打开。<\/p><p>里面一格一格。扳手，钳子，几把螺丝刀，一把小锤子，一卷电工胶布。把手都是黑的。每样东西都在它自己的位置上，像一直没动过。左上角有一格是空的，那一格的形状是一把螺丝刀。<\/p><p>林拓看着那一格。<\/p><p>那把螺丝刀在杭州，办公室靠窗的桌角上。九年了。<\/p><p>父亲把盖子合上。<\/p><p>咔哒。<\/p><p>那一声跟他小时候听到的一样。不响。但整个店都能听见。母亲在里屋咳了一声，也停了。<\/p><p>「拿着。」父亲说。<\/p><p>「你还要用。」<\/p><p>「我买了个新的。」父亲朝货架下面偏了偏头。那里有一个塑料的，蓝色，带轮子。<\/p><p>「顺手吗？」<\/p><p>父亲想了想。「还行。」<\/p><p>林拓把箱子拎起来。比他记忆里轻。小时候他拎不动，两只手抱着走。现在一只手就行。<\/p><p>「里面少一把。」父亲说。<\/p><p>「在我那儿。」<\/p><p>「我知道在你那儿。」父亲说，「配齐了。」<\/p><p>父亲转身去拉卷帘门。哗啦一声，门全开了，早上的光进来，照在货架上。膨胀螺丝。水管接头。合页。每一格上面的纸条还是那些字，纸黄了。<\/p><p>林拓拎着箱子往回走。河堤上有人在放风筝，风不大，风筝起不来，那人跑一段，停一段。<\/p><p>酒店在县政府对面，六层。婚礼在二楼一个包间，两张圆桌，母亲说十六个人，多一个都不请。<\/p><p>林拓上去的时候，沈月在房间里换衣服。红色的裙子，不是婚纱。她说婚纱要租，租一天八百，穿两个小时，不划算。她妈说过一句，她没听。<\/p><p>「跑步了？」她隔着门问。<\/p><p>「嗯。」<\/p><p>「箱子拿到了？」<\/p><p>「嗯。」<\/p><p>门开了。她看了他一眼，从头到脚，又看了看他手里的箱子。<\/p><p>「放床底下。晚上再看。」<\/p><p>「好。」<\/p><p>「你换衣服。九点半他们到。」<\/p><p>「好。」<\/p><p>她伸手把他领子理了一下，理完手没马上放下。<\/p><p>「看我。」<\/p><p>他看她。<\/p><p>「行。」她说，「人在。」<\/p><p>九点四十，杭州来的人到了。<\/p><p>高铁到上饶，大鹏租了一辆车，七座，正好。车停在酒店门口。第一个下来的是周冉，穿着黑色的外套，一下车就说：「你们这儿怎么这么晒。」<\/p><p>阿凯第二个，背着包，包没离过身。小杜第三个，手里一个红色的袋子，袋子上印着「喜」，是他在上饶站买的。大鹏最后，从后备箱里搬出一箱东西，是他老家的橙子，二十斤。<\/p><p>老船长从副驾驶下来，慢。他手里一个保温杯。<\/p><p>「有热水吗？」他问林拓。<\/p><p>「有。」<\/p><p>「我带了茶。」<\/p><p>他站在酒店门口，看了一会儿对面的县政府，又看了看街上。「我十几年没来过县城了。」他说，「跟我小时候那个一样。」<\/p><p>他们上楼。母亲在包间门口，见一个人拉一个人的手，说一遍「路上累了吧」。大鹏把橙子放下，说：「阿姨，我是大鹏。你儿子的第一笔钱是我付的。两百块，请他喝咖啡。」<\/p><p>母亲说：「两百块？他跟我说的是一百三十七。」<\/p><p>「那是第二笔。」大鹏说，「第一笔是我。」<\/p><p>母亲说：「那你坐主桌。」<\/p><p>沈月的父母坐在第一桌。她妈见到林拓母亲，两个人拉着手说了很久。她爸话少，跟林拓父亲坐一起，两个人都不说话，一起看窗外。<\/p><p>十一点半开席。<\/p><p>没有司仪。母亲找了个远房舅舅主持。舅舅站起来说了三句话：今天是林拓和沈月的好日子，大家吃好喝好，来，举杯。<\/p><p>举杯。<\/p><p>老船长举的是保温杯。他跟林拓碰了一下，杯子是塑料的，没声音。<\/p><p>「船到岸了？」他问。<\/p><p>「没有。」<\/p><p>「那就好。」老船长喝了一口茶，坐下了。<\/p><p>菜上来。上饶的菜，辣。周冉夹了一筷子，放下，喝水，又夹一筷子。<\/p><p>「你们这儿有不辣的吗？」<\/p><p>「有。」母亲说，「汤。」<\/p><p>周冉喝汤。喝了两口，把手机拿出来，看了一眼，又放回去。<\/p><p>「今天别看。」林拓说。<\/p><p>「看了。」周冉说，「没事，正常。」<\/p><p>阿凯坐在周冉旁边，一直没怎么说话。菜上到第六道，他忽然放下筷子。<\/p><p>「有一个问题。」<\/p><p>大家看他。<\/p><p>「这酒店的无线网没有密码。」<\/p><p>桌上安静了两秒。小杜先笑出来。周冉说：「你能不能吃饭。」阿凯说：「我就是说一下。」然后继续吃。<\/p><p>小杜坐在林拓左边。他把那个红袋子递过来，里面是一个相框，相框里是三年前在「不打烊」茶馆的一张合照。林拓在角落，穿着公司的工牌带子都没摘。<\/p><p>「哪儿来的？」<\/p><p>「老船长手机里。」小杜说，「我让他发给我，洗了一张。」<\/p><p>林拓看了很久那张照片。<\/p><p>「拓哥。」小杜说，「上个月四百二。」<\/p><p>「嗯。」<\/p><p>「比六十多了。」<\/p><p>「嗯。」<\/p><p>「你不说点什么？」<\/p><p>「够一顿火锅了。」林拓说。<\/p><p>小杜愣了一下，然后笑了。他不知道这句话是三年前沈月说的。<\/p><p>母亲话多。她一边给沈月妈夹菜一边说。说林拓小时候在店里写作业，说他从来不肯多说一句话，说他十八岁走了以后一年回来一次。说到去年，她停了一下。<\/p><p>「去年他爸住院，他回来看了两个星期店。」母亲说，「那时候他说要做个东西，让老主顾在手机上说一声要什么，他爸不要。回去以后他做了另一个。」<\/p><p>「什么东西？」沈月妈问。<\/p><p>「账本。」母亲说，「在手机上的。以前我一天记一页，现在点几下就行。他爸也不要，用了一个月才肯。」<\/p><p>她看了父亲一眼。<\/p><p>「现在他每天晚上还是要点一遍。点完了还要在纸上记个总数。说不放心。」<\/p><p>父亲没说话，往嘴里夹了一块笋。<\/p><p>「那个东西叫什么？」沈月妈问。<\/p><p>「没名字。」林拓说。<\/p><p>「怎么会没名字。」<\/p><p>「就叫账本。」父亲忽然说。<\/p><p>大家看他。他没再说，低头吃笋。<\/p><p>沈月妈转过来问沈月：「你们现在，一个月能有多少？」<\/p><p>「六万上下。」沈月说，「不固定。」<\/p><p>「两个人？」<\/p><p>「三个人分。」周冉替她答，「公司的账。」<\/p><p>「有一个问题，」阿凯说，「分完还得还我房贷。」<\/p><p>「那你们……」沈月妈斟酌了一下，「没人投钱？」<\/p><p>「没有。」沈月说。<\/p><p>「存了多少？」<\/p><p>「二十一万。」沈月说得很平，像在报菜名，「县里够首付。杭州不够。」<\/p><p>她妈没再问。她夹了一块鱼给沈月。<\/p><p>林拓在旁边听着，没插话。这些数他都知道。每个月一号，他和沈月一起看账。两年了。他们看的时候不说话，看完沈月会说一句「行」或者「省一点」。今天沈月当着两桌人说出来，一个字没差。<\/p><p>老船长要热水。林拓起身去茶水间，帮他接了一杯。回来的时候他没马上坐下，把桌上几个空茶杯收了，又去茶水间。<\/p><p>「他干嘛去？」周冉问。<\/p><p>「洗杯子。」沈月说，「他高兴的时候就这样。」<\/p><p>周冉看着茶水间的方向，没说话。过了一会儿她说：「我合伙半年了，第一次见他高兴。」<\/p><p>「你见过。」沈月说，「你没认出来。」<\/p><p>林拓洗完杯子回来。手机上有一条消息，郑浩的。一张截图。<\/p><p>「第二个用户。小蒋。三十块。」<\/p><p>下面一句：「我走不开，周四她八个学生的名字要全部上线。婚礼你拍照给我。」<\/p><p>林拓把手机递给周冉看。周冉看了，说：「小蒋是谁？」<\/p><p>「奶茶店店长。」<\/p><p>「他真的一个一个去聊了？」<\/p><p>「五个。」<\/p><p>周冉把手机还他。「记一笔。我以前说他不行。」<\/p><p>又一条消息进来，英文的。Tom 张。一段十秒的视频，他们那个游戏的登录页，一个玩家按了一下指纹，进去了。下面一句话：「恭喜。我们的玩家到现在都不知道他们在用一个钱包。」<\/p><p>林拓把这条也给周冉看。周冉说：「这是夸你。」<\/p><p>「我知道。」<\/p><p>「你不回？」<\/p><p>「回了。」他回的是一个字：「好。」<\/p><p>大鹏喝了两杯酒，脸红了。他站起来，要说话，被他自己的椅子绊了一下，坐回去，又站起来。<\/p><p>「我说两句。」他说，「三年前我在群里抱怨，三百个地址要手点两个小时。这小子私聊我，说我帮你写个脚本。我以为是骗子。」<\/p><p>大家笑。<\/p><p>「我到现在还在用。上个月我发了一千二百个地址，十分钟。」大鹏说，「我不会说话。就这样。祝你们好。」<\/p><p>他坐下来，又站起来。「橙子是我老家的，甜。」<\/p><p>沈月妈说：「你多吃点菜。」<\/p><p>轮到沈月。没人让她说，是舅舅问了一句：「新娘子有什么想说的？」<\/p><p>沈月站起来。她手里没杯子。<\/p><p>「三年前我跟他说，回家先看我一眼，再看手机。」<\/p><p>她停了。包间里很安静，只有窗外的鸟叫。<\/p><p>「现在他做到了。」她说，「别的我不管。」<\/p><p>她坐下了。<\/p><p>林拓没站起来。他看着桌上那个空了的茶杯，看了一会儿。父亲在对面，也没看他，在剥一个橙子。剥得慢，右手不太听使唤，剥了很久。剥完了，把橙子掰成两半，一半推给母亲，一半推给沈月爸。<\/p><p>下午两点散席。<\/p><p>沈月陪她父母回房间休息。周冉和阿凯去楼下找咖啡，县城没有他们要的那种，找了半小时，回来一人手里一杯奶茶。小杜跟着大鹏去还车。<\/p><p>包间里剩下父亲和老船长。<\/p><p>林拓在门口，没进去。他听见老船长在问。<\/p><p>「你这店，开了多少年？」<\/p><p>「二十九年。」<\/p><p>「怎么开的？」<\/p><p>父亲隔了很久才答。「一颗一颗卖。」<\/p><p>老船长喝了一口茶。「我三十个站，也是一颗一颗。」<\/p><p>父亲说：「站是什么？」<\/p><p>「网上的店。」<\/p><p>「哦。」父亲说，「能修吗？」<\/p><p>「能。」<\/p><p>「那行。」<\/p><p>两个人不说话了。林拓在门口站了一会儿，走开了。<\/p><p>四点，沈月说想去店里看看。<\/p><p>两个人走过去，十分钟。卷帘门开着，母亲在柜台后面，父亲在货架那头给一个老头找合页。老头买了两个，四块钱，父亲说算了，老头说那不行，把钱放在柜台上走了。<\/p><p>母亲把手机拿出来给沈月看。<\/p><p>「就这个。」<\/p><p>屏幕上是林拓写的那个东西。一个页面，白底，字很大。今天的进账一行，今天的支出一行，底下一个总数。再底下是一个格子，一天一格，绿的是有进账的，灰的是没开门的。<\/p><p>「以前一天一页。」母亲说，「现在我点这个，输个数，就行了。他爸不识这个，他只看底下那个总数。」<\/p><p>柜台上压着一张纸，纸上一行一行的数字，是父亲的字，一天一个总数，写到今天。手机上有，纸上也有。<\/p><p>沈月看了一会儿。「字大一点会更好。」<\/p><p>「够大了。」林拓说。<\/p><p>「给你妈用，不是给你用。」<\/p><p>母亲说：「我觉得够大。」想了想又说，「他爸看不清。」<\/p><p>林拓在手机上记了一笔：字号。<\/p><p>父亲从货架那头过来，手里一把螺丝刀，新的，黄柄。他把螺丝刀放进那个蓝色的塑料箱，盖上。盖子是塑料的，合上没声音。<\/p><p>他看了一眼那个箱子，没说话，去柜台后面坐下了。<\/p><p>晚上七点，杭州的人住在同一家酒店。老船长八点就睡了，说年纪大了。周冉在大堂改一份客户的合同，阿凯在旁边看她改。小杜和大鹏去逛县城，回来说什么都没有，只有一条街，街上一家五金店卷帘门关着。<\/p><p>「那是我爸的店。」林拓说。<\/p><p>「就那家？」<\/p><p>「就那家。」<\/p><p>大鹏说：「我明天去买个扳手。」<\/p><p>「你买扳手干嘛？」<\/p><p>「不干嘛。」大鹏说，「买一个。」<\/p><p>九点，林拓回房间。沈月在床上看小说。那个箱子在床底下，他弯腰把它拉出来，放在桌上。没打开。<\/p><p>「不看？」沈月问。<\/p><p>「明天看。」<\/p><p>「行。」<\/p><p>他坐在床边。窗外是县城，路灯不多，九点就没什么人了。他在这里长到十八岁。三十岁那年，他在这里看过两个星期的店。<\/p><p>手机震了一下。<\/p><p>咔哒的用户群。有人@他。不是大鹏，大鹏在隔壁房间打呼噜。<\/p><p>「林老师在吗？我今天收到第一笔钱了。能跟你说句话吗？」<\/p><p>后面跟着一个手机号。<\/p><p>林拓看了一眼沈月。她说：「去吧。」<\/p><p>他走到走廊上。走廊的灯是感应的，他一出门就亮了，走到头又暗下去。他在灯下拨了那个号。<\/p><p>响了两声就接了。<\/p><p>「喂？林老师？」<\/p><p>声音不大，有点紧，普通话里带着一点口音。听不出哪里，但是南方。<\/p><p>「我是。」<\/p><p>「不好意思这么晚打扰。我姓陈。我在一个县城教高中，教信息课。」对方说得很快，像准备了很久，「我做了一个小东西，给学生排座位的。放在网上，英文的。前天有一个国外的人要付钱，我没法收。我搜到你们那个收款链接，今天下午钱到了。」<\/p><p>「多少？」<\/p><p>「九美元。」<\/p><p>林拓没说话。<\/p><p>「六十几块钱。」对方说，「我教书十一年，工资卡上从来没有一笔钱是这么来的。」<\/p><p>走廊的灯暗了。林拓动了一下，又亮了。<\/p><p>「你想问什么？」<\/p><p>对方停了一下。<\/p><p>「我看了你的日志。三年，从头到尾。我知道你被裁过，知道你有一年收入九百块。我不是要问怎么赚钱。」<\/p><p>「嗯。」<\/p><p>「我想问，」他说，「怎么开始。」<\/p><p>林拓站在走廊里。房间的门虚掩着，能看见桌上那个箱子的一角。绿色的，边角磕掉了漆。<\/p><p>灯又暗了。<\/p><aside class=\"log\"><div class=\"log-label\">航海日志<\/div><p>5 月 20 日。<\/p><p>结婚了。两桌。<\/p><p>我爸把工具箱给了我。他买了个新的，塑料的，带轮子。他说还行。<\/p><p>沈月说，别的她不管。<\/p><p>晚上一个县城的高中老师打电话来，收到第一笔钱，九美元。他问我怎么开始。<\/p><p>我还没回答。<\/p><\/aside>", "words": 4927}, {"num": 39, "title": "风", "vol": 4, "html": "<p>2027 年 9 月 14 日，星期二，早上六点零七分，林拓跑到了江边。<\/p><p>他五点五十八分醒的，闹钟还没响。沈月还在睡。他换了鞋出门，从滨江的出租屋到江边一公里，沿着江跑两公里，再跑回来，正好五公里。这条路他跑了一年。去年十月第一次跑，两公里就停了，坐在江边，坐了很久。<\/p><p>九月的早上有风。不大，从江那边过来，带一点水气。<\/p><p>江边有一个老头，天天在。他把收音机挂在树上，放老歌，九十年代那种，男人唱的，嗓子沙沙的。林拓跑过去的时候他在打太极，跑回来的时候他还在打，歌换了一首，还是老歌。<\/p><p>「今天跑得快。」老头说。<\/p><p>「嗯。」<\/p><p>「年轻好啊。」<\/p><p>林拓跑过去了。他没答。他三十一了，不算年轻，也不算不年轻。<\/p><p>跑完他看了一眼表，二十七分钟。去年十月第一次跑完五公里，三十四分钟，跑完弯着腰喘了很久。那次他没截图，没发。这次也没有。跑步不是给人看的。<\/p><p>六点四十到家。他在门口站了一会儿，等呼吸匀下来，才开门。<\/p><p>沈月起来了，在厨房煮粥。她穿着去学校的衣服，头发还没扎。<\/p><p>「几公里？」<\/p><p>「五。」<\/p><p>「快点洗，粥好了。」<\/p><p>他去洗澡。出来的时候粥在桌上，两碗，一碟咸菜，两个煎蛋。他坐下，椅子晃了一下。<\/p><p>「这椅子早就该修了。」沈月说。<\/p><p>他起身，去阳台。阳台的小桌子底下放着那个绿色铁皮工具箱，五月从老家带回来的。他打开，拿出那把螺丝刀，木柄，柄上一道裂。左上角那一格现在不空了。<\/p><p>他把椅子翻过来，拧了两颗螺丝。拧完他盖上盖子。<\/p><p>咔哒。<\/p><p>螺丝刀还在手里，他随手放进了裤兜。<\/p><p>「好了？」沈月问。<\/p><p>「好了。」<\/p><p>她坐上去，晃了晃，不晃了。「早该修了。」她又说了一遍。<\/p><p>七点整，手机震了一下。周冉的日报。<\/p><p>她每天七点发，从去年十一月入伙起，没断过。格式是她定的：三行数字，一件事，一个问题。<\/p><p>「昨日：咔哒访客 2,960，信风企业客户 9 家，托管 14 个。本月到今天 28,400。」<\/p><p>「一件事：新加坡那家要加两条链，Tom 说不急。」<\/p><p>「一个问题：你下午不在，谁回 Tom？」<\/p><p>林拓回：「我回。三点前。」<\/p><p>周冉回了一个「好」。<\/p><p>夜航船的群里也有一条，老船长发的，六点五十。「月底周六，茶馆。谁来。」他发东西从来不带标点，这一条带了一个句号，大概是手滑。<\/p><p>底下已经有七个人回了。第一个是小杜：「来。第一次不是空手来。」<\/p><p>林拓回：「来。」<\/p><p>沈月吃完了，把碗放进水池。她七点二十走，学校八点上课，她要提前到。<\/p><p>「下午三点，」她在门口说，「你别忘了。」<\/p><p>「不会。」<\/p><p>「电脑坏了，我班上那个。修不好我就用黑板。」<\/p><p>「能修。」<\/p><p>「你没看怎么知道能修。」<\/p><p>「看了再说。」<\/p><p>她笑了一下，关门走了。<\/p><p>他洗了碗，端着一杯水去阳台。<\/p><p>阳台上还是那张小桌子。一台笔记本，一盏台灯，一个杯子。窗外是另一栋楼，早上，每扇窗都亮着，看不出哪扇有人。<\/p><p>他打开工单。工单就是用户写来的问题，一条一条，像店里来的客人，来一个接待一个。今天早上十一条。<\/p><p>第一条，山田。日本的。他从二〇二五年帮着校对日语开始，每个月都会发一两条。这一条说，新工具的日语说明里有一个词用错了，「转账」又用成了那个不对的说法。林拓改了，回他：谢谢。山田回了一个鞠躬的表情。<\/p><p>第二条，大鹏。「红包工具能不能一次发五百个？我这次有五百个人。」林拓查了一下，上限是三百。他把上限改成一千，回：可以了。大鹏回：「牛。」<\/p><p>第三条到第七条，都是信风的。一个换了手机，用备用钥匙进去了，问为什么要等十分钟。林拓回：为了等你反悔。如果不是你自己换的手机，这十分钟是你的。一个问能不能用两个指纹。一个说图标太小。一个说英文版有个按钮没翻译。一个是骂人的，说钱包转账慢。林拓查了，是那条链堵了，不是钱包的事。他回了一句话说明，没辩解。<\/p><p>第八条，署名阿珍。<\/p><p>「换手机了。用备用钥匙进来了，钱还在。就是想告诉你一声。」<\/p><p>林拓看了一会儿这条。他回：「好。」想了想，又加了一句：「备用钥匙记得换一把新的。」<\/p><p>第九条到第十一条，企业客户的。都是小事，一个要发票，一个问下个月账单，一个问能不能拉个群。<\/p><p>八点二十五，十一条回完了。他把杯子里的水喝完，记了一笔账：早饭，零。沈月买的菜，前天记过了。<\/p><p>八点半出门。到办公室走路二十分钟。<\/p><p>园区里的人不多，九点才上班。他走在最前面。办公室的门开着，阿凯已经在了，包放在椅子上，正在看一段代码，眉头皱着。<\/p><p>「早。」<\/p><p>「早。」阿凯说，「有一个问题。」<\/p><p>「说。」<\/p><p>「新加坡那两条链，其中一条的签名格式跟我们现在的不一样。要单独处理。」<\/p><p>「多大的改动？」<\/p><p>「两百行左右。你写还是我写？」<\/p><p>「我写。」林拓说，「你看。」<\/p><p>「行。」<\/p><p>周冉九点到。她进门先看两个人，然后看自己的电脑，然后说：「Tom 那边我说了你三点前回。你别忘了。」<\/p><p>「不会。」<\/p><p>「你上次也说不会。」<\/p><p>「上次是去年。」<\/p><p>周冉不说话了，坐下来打电话。她打电话的时候声音大，整个办公室都是她的。林拓戴上耳机。<\/p><p>九点到十二点。他写那两百行。<\/p><p>签名格式，说人话，就是一张支票上签名的位置。大多数链签在右下角，这条链签在左上角。钱是一样的钱，签的地方不一样，收的人就不认。他要做的是让信风知道，遇到这条链，签在左上角。<\/p><p>用 AI 助手，大半是它写的。他花时间最多的还是那几处：签错了怎么办，签一半断了怎么办，用户看到的那句话怎么写。他改了三遍那句话。最后是：「这条链需要换一种签名方式，跟你的钱没关系。」<\/p><p>十一点五十，测试跑完。绿了。<\/p><p>他把改动交给阿凯。阿凯看了十分钟，说：「行。下午我再看一遍。」<\/p><p>「嗯。」<\/p><p>「一百九十六行。」阿凯说。<\/p><p>「差不多。」<\/p><p>中午三个人去楼下吃面。老王的面馆。<\/p><p>老王认识他们了。周冉要不辣的，老王说没有，周冉说那就少辣，老王说少辣也是辣。周冉每次都点，每次都说辣。<\/p><p>角落里坐着郑浩，面前一台笔记本，一碗面没动。老王朝那边喊了一声：「小郑，三号桌要换周六的班。」<\/p><p>郑浩头也不抬：「让他自己点。」<\/p><p>「他不会。」<\/p><p>「我教过三遍了。」<\/p><p>「你再教一遍。」<\/p><p>郑浩站起来，走到后厨去了。回来的时候看到林拓他们，坐过来，把面端过来。<\/p><p>「二十三家店。」他说，「上个月六百九。」<\/p><p>「嗯。」<\/p><p>「你不问我怎么样？」<\/p><p>「你说了。」<\/p><p>郑浩笑了。他把面吃完，说下午要去城西看一家店，一个老板娘，十七个员工，是老王介绍的。「老王说，那边有个开店的，跟他一样烦。他就把我的名字给她了。」<\/p><p>「一颗一颗卖。」林拓说。<\/p><p>「什么？」<\/p><p>「没什么。」<\/p><p>十二点四十，回办公室。林拓回了 Tom 的邮件，用了二十分钟。两条链，一条这周，一条下周，价格不变。Tom 回得很快：「好。婚礼视频看了。恭喜。」<\/p><p>两点半，他关了电脑。<\/p><p>「走了。」他说。<\/p><p>「三点。」周冉说。<\/p><p>「知道。」<\/p><p>沈月的学校在城西，坐地铁四站。三点差五分他到了校门口。门卫问他找谁，他说沈老师，门卫说四楼，三年级二班。<\/p><p>三年级二班的电脑坏了。不是电脑坏了，是投影不亮。他看了两分钟，是线松了，线后面的接口有一颗螺丝掉了。他从裤兜里掏出那把螺丝刀。早上放进去的，一天没想起来。<\/p><p>拧上。投影亮了。<\/p><p>四十个孩子看着他。<\/p><p>「这是谁？」一个孩子问。<\/p><p>「我先生。」沈月说。<\/p><p>「他是修电脑的？」<\/p><p>「他是做工具的。」<\/p><p>「什么工具？」<\/p><p>「你们长大就知道了。」沈月说，「翻开书，第十二课。」<\/p><p>林拓坐在教室最后一排，一把小椅子，膝盖顶着桌子。这节是作文课。沈月在黑板上写题目，粉笔一笔一笔的。题目四个字，他在三年半前的桌上见过，一个作业本翻开着。三年半过去，还是这四个字，还是三年级。<\/p><p>孩子们写。教室里只有笔的声音。沈月在过道里走，走到一个孩子旁边，弯下腰看一眼，不说话，走开。<\/p><p>他坐在那里看了四十分钟。他没看手机。<\/p><p>下课铃响，孩子们往外跑。一个男孩跑到最后一排，停下来，看他。<\/p><p>「叔叔，投影仪你会修，手机你会修吗？」<\/p><p>「会一点。」<\/p><p>「我爸的手机坏了。」<\/p><p>「让他拿去店里。」<\/p><p>男孩想了想，跑了。<\/p><p>沈月收拾东西。走廊上一个家长等着，跟她说了几句，看了林拓一眼。走出校门以后沈月说：「她问我你是做什么的。」<\/p><p>「你怎么说？」<\/p><p>「开店的。」<\/p><p>林拓没说话。走了几步，他说：「行。」<\/p><p>「本来就是。」沈月说，「你爸说的。」<\/p><p>四点半放学。五点，两个人在校门口的菜场买了菜。青椒，一块肉，一把葱。沈月说她来做，林拓说他来。<\/p><p>「你做的太咸。」<\/p><p>「上次不咸。」<\/p><p>「上次是我放的盐。」<\/p><p>「这次我少放。」<\/p><p>「行。」<\/p><p>五点五十进门。<\/p><p>屋里亮着，是他们自己开的灯。客厅的桌上没有盘子。有一摞作业本，红笔压在最上面一本上。沈月把包放下，坐下来，翻开第一本。<\/p><p>林拓去厨房。<\/p><p>青椒炒肉，放一点豆豉，跟他母亲的做法一样。这是他有一次随口说的，沈月记住了。后来他学会了，也这么放。两个荷包蛋。电饭煲叮了一声。<\/p><p>六点半吃饭。两个人，一张桌子，桌上没有手机。<\/p><p>「咸吗？」<\/p><p>「不咸。」沈月说，「放盐了吗？」<\/p><p>「放了。」<\/p><p>「那就是正好。」<\/p><p>吃完他洗碗。她改作业。水池里两个碗，两双筷子，一个锅，他洗了很久，比该用的时间长。沈月在客厅说了一句：「洗完了吗？」他说：「快了。」<\/p><p>七点半，阳台。<\/p><p>台灯，笔记本，杯子。窗外那栋楼，有一半窗亮着。他不知道哪扇是三年前那扇。<\/p><p>邮箱里有一封信。是五月打电话的那个陈老师。这四个月他每个月写一封，林拓每封都回。这一封说：排座位的工具有四十个用户了，每月六十美元。有人问他能不能加一个排课表的功能，有人问能不能做成手机 App。还有人说这个东西可以做大，问他要不要一起做。他不知道该先做哪个。<\/p><p>信的最后一句：「我不想再问你怎么开始了。我想问，接下来呢。」<\/p><p>林拓看了两遍。<\/p><p>他回信。回的不长。<\/p><p>「陈老师：<\/p><p>先别写代码。<\/p><p>问三个问题。<\/p><p>一，加排课表，谁会为它付钱？说一个名字，不是『老师们』，是一个人的名字。<\/p><p>二，那个人今天在哪儿，用什么凑合？去看，别猜。<\/p><p>三，你做的，凭什么比他现在的办法好？他自己说，不是你说。<\/p><p>三个都答上来，再做。答不上来，就还做排座位，把它做顺手。<\/p><p>要一起做的那个人，让他也回答这三个问题。<\/p><p>林拓」<\/p><p>他把信读了一遍，没改，发了。<\/p><p>八点半，他记了一笔账：菜，三十二。存款那一栏动了一下。他没细看。这一栏他现在每月一号才看，跟沈月一起。<\/p><p>八点四十，他打开「圈子」。他还是不怎么发东西，每月一号发一张截图，其他时候只看。<\/p><p>刷到第三条，他停了。<\/p><p>一张截图。一个后台页面，最上面一行「本月收入」，后面一个数：690。截图下面一句话：「小工具第四个月。二十三个小餐馆。一个人。」<\/p><p>发帖的头像是郑浩。<\/p><p>他往下拉评论。<\/p><p>第一条：「六百九也好意思发？」<\/p><p>第二条：「什么工具？」<\/p><p>第三条：「楼上，他不会发的。」<\/p><p>第四条：「怎么做的？」<\/p><p>第五条：「一个月六百九，还不如去送外卖。」<\/p><p>第六条：「送外卖你去。」<\/p><p>第七条：「我做了。两个月，收入零。」<\/p><p>底下三十多条。发帖的人出现了一次，回的是第七条：「我第一个月也是零。你跟几个用户聊过？」<\/p><p>林拓看了很久。他没回。他给这条点了一个赞，把手机扣在桌上。<\/p><p>楼下有人在遛狗，链子哗啦哗啦响。九点了，还有人遛狗。<\/p><p>九点整，他把所有窗口关了。<\/p><p>关到最后一个的时候，桌面露出来。公司的东西他早就不用了，桌面上很空。一个黄色的夹子，底下四个字。<\/p><p>沈月在客厅收作业本。<\/p><p>「几点了？」<\/p><p>「不晚。」他说。<\/p><p>「我睡了。」<\/p><p>「嗯。马上。」<\/p><p>她进了卧室。门虚掩着。<\/p><p>他站起来，裤兜里硌了一下。他掏出那把螺丝刀，弯腰打开桌底下的箱子，放回左上角那一格，盖上。<\/p><p>咔哒。<\/p><p>他坐回来。<\/p><p>他看着那个文件夹。图标是一个黄色的夹子，底下四个字，自己的东西。三年半了，他没改过名字。沈月看见的时候笑过一次，说傻。他没改。<\/p><p>他双击打开。<\/p><p>里面有四样。<\/p><p>一个文件夹，叫「咔哒」。里面是十四个工具的代码，和一个「更新日志」，从二〇二四年九月七日写到上个星期。<\/p><p>一个文件夹，叫「信风」。里面是那艘船。<\/p><p>一个文件，叫「原则」。七条，二〇二五年七月写的，一条没改。<\/p><p>一个文件，叫「账」。从二〇二四年三月十四日开始，每一笔都在。第一笔是打车，二十八块。<\/p><p>底下还有一个文件夹，叫「旧」。里面是番茄账本。他没删。<\/p><p>他看了一会儿。<\/p><p>他没有新建什么，也没有删什么。他把文件夹关上，合上电脑。阳台的灯灭了，对面那栋楼还亮着几扇窗。<\/p><p>他把椅子推进去，去了卧室。<\/p><aside class=\"log\"><div class=\"log-label\">航海日志<\/div><p>9 月 14 日。<\/p><p>跑了五公里。<\/p><p>回了 11 个工单。一个日本用户，一个换了手机的用户，一个要发五百个红包的用户。<\/p><p>写了 200 行。阿凯说是 196。<\/p><p>下午去了沈月的学校，修了一根线。<\/p><p>9 点关电脑。<\/p><\/aside>", "words": 4845}, {"num": 40, "title": "航海日志", "vol": 4, "html": "<p><strong>给三年前的我<\/strong><\/p><p>2027 年 10 月。五月结婚那天晚上，一个县城的高中老师打电话来，说收到了第一笔钱，九美元，问我怎么开始。我没答上来。九月他又写信，问接下来呢。我回了三问。挂了电话我想，三年前那个凌晨两点建了个空文件夹的人，也想有人告诉他这些。所以写这一篇。写给他。你要是也刚建了一个文件夹，就当写给你。数字都是真的，不 P 图。<\/p><h2>一、开始之前<\/h2><ol start=\"1\"><li>先别写代码。三问：谁会为它付钱；他们今天在哪儿，正在用什么凑合；你凭什么比他们现在的办法好。番茄账本三个月，四十七个下载，全是熟人，第二周还在用的一个，是我自己。三问我一个都答不上。<\/li><li>去问人，别问自己。三句就够：你昨天是怎么做这件事的；上次没做是为什么；明天这东西没了你怎么办。第三句答「无所谓」的，不会付钱。我问了五个人，五个无所谓，我把番茄账本下架了。<\/li><li>带一个别人问过你的问题。我在云梯三年，被问过的只有「线上又挂了吗」。后来大鹏在群里骂了一句手点两小时，那才是问题。我爸进货也是这个规矩：有人问过的才进，问三回，进。<\/li><li>郑浩做排班表，先写了五个功能。跟五个老板聊完，剩一件事：换班了，老板知道。名字叫「今天谁上班」，是奶茶店店长一天问三遍的那句话。<\/li><\/ol><h2>二、第一个产品<\/h2><ol start=\"1\"><li>先用脚本手动服务一个人。大鹏三百个地址，手点两小时，我当晚写了个脚本，十分钟发完。他转了两百块请我喝咖啡。有人付了钱，再做成网页。<\/li><li>两周，一件事。清单写了六条，划掉五条，只剩批量转账。主流程五天就通了，剩下九天全花在「别让用户点错」上，确认页最上面一句「这一步之后不能撤回」。<\/li><li>让一个不懂的人试。沈月二十分钟找出七个问题，第一条是红字太小，她妈看不见。你自己用得顺手，是因为是你做的。<\/li><li>不碰用户的钱。签名在用户自己的浏览器里完成。首页一句话：我们只是一把扳手，钱一直在你自己口袋里。<\/li><li>AI 写得快，坑要自己填。它给三百个地址只配了二百九十九个金额，没拦。管别人钱的代码，每一行你得知道在干什么。<\/li><li>上线第一天三个访客，都是我。第一周十二个用户，有一个不认识，发了六十笔。一个不认识的人，比四十七个熟人值钱。<\/li><li>一开始就收钱。千分之一，写在确认页上，字和总额一样大。老船长说，现在收，他们觉得这就是价格；用户多了再收，他们觉得你变了。收费后两天零笔，第三天来了一百三十七块。二十六天。<\/li><\/ol><h2>三、流量<\/h2><ol start=\"1\"><li>打开搜索控制台。三十七个搜索词，没有一个是「咔哒」。他们不是来找你的，是带着麻烦来的。你做的不是 App，是一堆页面。<\/li><li>标题是招牌。「咔哒工具箱」改成「批量转账工具，一次给很多个地址转账，不用一个一个签名」。改完那周，排名从二十一到十四。月底到了九，中间上了第二个工具，我说不清是谁的功劳。周冉说，标题改一行，比写三天代码值钱。<\/li><li>找没人排队的窗口。「批量转账」是大站的，打不过。「批量生成钱包地址 离线」一个月几百个人搜，没人认真做。三个条件：搜的人少，竞争小，意图明确。第二个工具一天六十人，每一个都是明天要发币的人。<\/li><li>第二问的答案可能不在中文互联网。四百个搜索词，中文一百六十个。做法：AI 初翻，找母语用户校对，用一年免费 Pro 换。山田给了我一张二十七行的表，第一行是「転送」是转发邮件，钱要用「送金」。每种语言一个独立路径。日语上线八天，从零到每天四十。<\/li><li>公开构建的格式：一个数字，一件事，一个教训。数字放第一行，因为数字是别人能核对的。失败也发，截图不 P。每月一号发上月收入截图，可以是零。<\/li><li>广告一个月六百块，页面变丑，用户骂了三次。我爸的卷帘门上二十六年只有「建国五金」四个字。第三次我听了，撤了。<\/li><li>老工具会复利。二〇二四年九月熬两周做的批量转账页，今年四月每天还带六百人。我上一次改它是九个月前，改了一个错字。<\/li><\/ol><h2>四、钱<\/h2><ol start=\"1\"><li>上定价之前，跟五个付过钱的人各聊三十分钟。不问「你想要什么功能」，问「你现在怎么算这笔钱」。大鹏要一个固定的数拿去跟老板说；山田说免费让他害怕，要收据；老麦在乎的是出了事有人管；Ben 要按次；阿康一年用两次，要免费。所以按次和年费并存。五个访谈教会我的比一千份问卷多。<\/li><li>别定太低。九十九一年，一周三十一个人买。大鹏说，九十九太便宜了我不信，你不是要跑路吧。老船长说我定低了，我说先跑。但你知道自己定低了，以后涨价别怪用户。<\/li><li>给一个锚。购买页加一行：按您过去三十天的用量，一年手续费约为多少。大鹏看到三千八百四十，阿康看到四十二。一百个人打开，买的从三个变成七个。<\/li><li>涨价锁老用户。九十九涨到二百九十九，已经付过的续费永远九十九，提前两周公告。新 Pro 少了四成，这一块收入多了七成，没有一个老用户骂。<\/li><li>备粮。单开一个账户，只进不出，叫「粮」。算底拿最差的月份算，我的底是二月的五千六，五月的两万一是潮水。潮水来的时候别加帆。<\/li><li>卖给企业，按他赚钱的那个数收。月活分三档，九十九、二百九十九、九百九十九美元，托管四十九。Tom 砍到九十九，我想打六折，周冉在桌子底下踢了我一脚。不打折，但第一个客户锁价两年。他一天在门口烧一千四新币，我们收他一个月两千块人民币。<\/li><\/ol><h2>五、事故与抄袭<\/h2><ol start=\"1\"><li>出了事四步：修、赔、公开、防。六位小数当七位算，三个用户多转了十倍，四千块。修用了两小时。赔，是沈月说的那个字：补。她说，你不补，以后每笔手续费你都会想起这四千块。防，是十二个格子的测试表，全绿才上架。<\/li><li>报告写三样：你搞砸了什么，跟我有没有关系，你以后还会不会。报告发出去，访客涨了三成。老船长说，护城河是信任，不是功能；信任要一年，丢掉只要一天。<\/li><li>被抄了，别打官司。周冉的四件事：每周上一个新工具；群变成正式的，每天在里面说一句话；更新日志公开，每条带日期；请老用户去外面写评价。抄袭站抄了我的更新日志，日期比我晚三天。三个月他死了。<\/li><li>抄袭站连合约都没自己部署，收银台是我的。我加了来源校验，他的页面还在，转不了账了。别人的门面不能挂你的收银台。<\/li><li>大厂来了，去看你的用户是谁。星象上线一样的功能，老船长说，大厂做功能，你做产品；大厂服务所有人，你服务谁。我们把最活跃的两百个用户一个一个看：开发者六十八，不信交易所的七十一，自托管三十四。首页从「没有助记词」改成「钥匙在你手里，也不用你记」。那个「也」字是沈月留的。<\/li><li>交易所内置了免费的批量转账，咔哒掉两成。问了十个用户，走的为了方便，留的为了名单不给别人。留的人和信风的用户是同一群人。两个产品连起来，访客回到两千三，过了原来那条线。<\/li><\/ol><h2>六、公司与辞职<\/h2><ol start=\"1\"><li>边界五条，我在收到一百三十七块那个月写的：不用公司电脑；不用公司时间，提交只在晚上九点后和周末；不用公司账号；不碰公司业务；竞业条款拍照存着。越小越要想，大了来不及。<\/li><li>HR 问三个问题：用没用公司设备，用没用公司时间，跟不跟公司业务相关。我拿出两千一百多次提交记录，工作日白天零次。不追究。但降本增效的名单里有我。<\/li><li>签字前看三样：N+1 怎么算，让他们写在纸上；当月工资、没休的年假、报销结清，写进协议；离职证明写「协商解除」。<\/li><li>四律第四条：十二个月生活费，副业月收入到工资一半，连续三个月。存款加补偿二十六万，月支出一万八千五，十四个月。三、四、五月都过了线。但我在旁边写了一行小字：五月是潮水，按二月的五千六算，不过。<\/li><li>过线不是保你赢，是保你输了还能回来。去人才市场走一圈，看看退路长什么样。我没投。不是因为勇敢，是因为算过。<\/li><li>跟家里人对齐的办法是一起看账。每月一号晚上，三个数：挣了多少，花了多少，还剩几个月。少一个数，就当我在瞒她。我爸说，五金店开了二十七年，也没有铁饭碗。<\/li><\/ol><h2>七、大船<\/h2><ol start=\"1\"><li>原则写在墙上。信风七条：没有助记词，不碰用户资产，核心合约不自写，开源，可自托管，不发币，不融 VC。发在群里，说以后打脸大家看得见。答不上的那条画一个圈，欠着的不能上线。<\/li><li>造之前先看有没有人要。咔哒每个页面顶上加一行字和一个输入框。三天：看见七千一，点四百三，留一百三十八。周冉说，三天留不到一百，这船别造。<\/li><li>龙骨用别人的。审计报价四十万，我们存款十八万。核心合约用被审过三次的开源智能账户，自己只写六百行，阿凯一行一行读了两周。赏金五千起，能让人丢钱的两万，低于两万真正会找的人不看你。规则第一条：修好之后公开时间线，写上报告人的名字。<\/li><li>用户测试：五个人，录屏，边做边说，你不许开口，看退出点。五个人三个卡在同一步，零个做完备用钥匙。沈月拿红笔改了十一处，「注册通行密钥」改成「用你的指纹当钥匙」。先改字再改代码，字最便宜。改完，留备用钥匙的从零到三分之二。<\/li><li>内测分两层：五十个老用户先跑一周，再放等待名单前两百。每个钱包上限一千块，因为阿凯还没看完。<\/li><li>审核清单。三次被拒，原因都不一样。主体：注册有限公司，对公账户、企业邮箱、经营范围加「软件开发」，工商局排了两小时零七分。说明：审核员一个应用只看三分钟，录一个两分五十八秒的视频，只演示不解释。文案：删掉所有「收益」类的词。等的四个星期，每周四给等待名单发一封进展，不管有没有进展。人怕的不是慢，是没消息。<\/li><li>发布日清单：00:10 提交猎品榜；00:30 首评论，讲阿珍丢的那张纸，不讲功能；07:00 中文社区；08:00 给等待名单一千二百一十四人发邮件。当天只做三件事：回话，记数，别死。不改代码，别回骂的。三十天后还在的人才算数。<\/li><li>披露流程，二十六小时。23:12 收到；两小时复现；03:05 扫完链上八千一百个钱包，受影响零；04:10 先停掉换锁；12:20 修好；次日 01:12 上线，01:30 通知全部用户；四十八小时内公开时间线。通知里不写「非常抱歉」，写你做了什么、用户要做什么。赏金两万，沈月说，写了就付。用户多了五百。<\/li><\/ol><h2>八、没收入的时候<\/h2><ol start=\"1\"><li>用户不是钱。一万五千用户，活跃三千，一个月九百块。Pro 十一个人；打赏三百四，里面两百是大鹏；付费主题卖了二十七套，阿凯说主题包能塞东西，全退了。<\/li><li>别用肩膀顶墙。周冉说，钱包用户不觉得自己在用软件，觉得在放钱，跟放钱的人要钱像收保护费。老船长说，顶一天墙不动，肩膀肿了，这不叫坚持，叫没看清那是一堵墙。绕，或者找门。<\/li><li>谁需要你的用户，谁付钱。Tom 的游戏十个玩家七个走在装插件那一步。他不用钱包，他要那七百个人进门。付钱换锁的不是客人，是店主。这句话我十六个月才听懂，还是客户替我答的。<\/li><li>第一笔企业收入二百九十九美元，到手两千零六十块。三天帮他们接完，凌晨一点半回消息。我爸修风扇不收钱，他下次买东西还来。Tom 的流失从七成到三成，三天三个团队来问价。排队，先付的先接。<\/li><li>掉头不是发财。十二月咔哒一万四加信风九千，两万三，方向从往下变成了往上。今年四条收入线，哪一条都别超过一半。<\/li><li>我在店里学到的：一颗螺丝不收钱，账本写零。我爸看我回工单，说，你也在开店。我问他这么多年怎么过来的，他说，一颗一颗卖。<\/li><\/ol><h2>九、人<\/h2><ol start=\"1\"><li>合伙写在一页纸上。二十，四年成熟，一年悬崖；分工，她管增长和客户，我管产品和技术；退出，没成熟的收回，成熟的可以留但不能卖给外人；工资各五千。沈月做见证，改了一个错字。阿凯说等做出第一笔再谈他的，现在谈是分一张没画的饼。<\/li><li>不定制。三万美元，二十项，三个人六个月，每个月赚的比不接还少七千。说「不」说一遍，别解释三遍。最后接了一万二的标准版加支持。合同里加一栏「不在服务范围内」，客户不是记不住你答应了什么，是记不住你没答应什么。<\/li><li>开源。周冉反对，怕星象抄得更快；阿凯说安全的东西不开源没人信。最后问了四个付托管钱的客户，三个说还会付，一个说会付别的钱。开了以后两家新客户说，能自托管我们才敢用。周冉在本子上记了一笔：只看了对手，没看客户。<\/li><li>帮人，别替人。郑浩卡住叫我看一眼，我手已经放到键盘上，周冉在门口说，他的船，他自己造。我把手拿开。<\/li><li>记住用户的名字。大鹏，山田，老麦，阿珍，0xRain。郑浩两千万烧了二十三个月，没见过一个真实用户。他跟五个餐馆老板聊了三天，说，我见到用户了。第一个用户付了三十块，他说没有两千万到账那天高兴。<\/li><\/ol><h2>十、你<\/h2><ol start=\"1\"><li>沈月说，我不需要你成功，我需要你别把自己弄丢。她判断我的状态不看收入，看我进门有没有先看她一眼。她的期限不是钱，是「你回不回来」。<\/li><li>这些是信号：四点醒了先看数据；洗澡站着忘了开热水；日志写了删，删了写；她说她妈住院，你说嗯。出现两条，停。<\/li><li>停。老船长二〇一八年 App 一天被下架，半年没开电脑，后来从一个月三百块的小站重新开始。他说，船没沉，它只是停在那儿。产品不是你。你可以停一周，服务器会跑，用户明天还在。<\/li><li>跑。跑不动也跑。第一次两公里就停了，一周之后五公里，三十四分钟。没截图，跑步不是给人看的。<\/li><li>说出来。停到第四天，我把四点看数据、洗澡忘开水、算到天亮的事都说了，说得没有顺序。她说，你不说，我才知道。<\/li><li>六十万那封邮件，她只问了一句：你是想去，还是想跑。我把它拖进一个叫「以后」的文件夹，没回，也没拒。后来它过期了。<\/li><li>九点关电脑。高兴的时候去洗碗。三天不发日志船不会沉，但别习惯。<\/li><\/ol><p>写完了。这些条没有一条是我自己想出来的。都是有人问过我，骂过我，踢过我一脚，或者不收我钱。三年前我要是有这张清单，会少走一些路，不会少走全部。<\/p><p>九点了。螺丝刀在裤兜里。我打开桌底下那个绿箱子，把它放回左上角那一格，盖上盖子。<\/p><p>咔哒。<\/p><p>先建一个文件夹。<\/p>", "words": 5423}]}</script>
<script>
(function(){
  var DATA = JSON.parse(document.getElementById('data').textContent);
  var CH = DATA.chapters, VOLS = DATA.vols;
  var root = document.documentElement;
  var page = document.getElementById('page'), where = document.getElementById('where'), prog = document.getElementById('prog');
  var toc = document.getElementById('toc'), scrim = document.getElementById('scrim'), panel = document.getElementById('panel');

  function load(k, d){ try{ var v = localStorage.getItem('xf.'+k); return v===null? d : JSON.parse(v);}catch(e){ return d; } }
  function save(k, v){ try{ localStorage.setItem('xf.'+k, JSON.stringify(v)); }catch(e){} }

  var prefs = { theme: load('theme','system'), font: load('font','serif'), fs: load('fs',18), lh: load('lh',1.95) };
  var readSet = load('read', {});
  var cur = null;

  function applyPrefs(){
    if(prefs.theme==='system') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', prefs.theme);
    root.style.setProperty('--body-font', prefs.font==='sans' ? 'var(--sans)' : 'var(--serif)');
    root.style.setProperty('--fs', prefs.fs+'px');
    root.style.setProperty('--lh', prefs.lh);
    document.getElementById('fs-out').textContent = prefs.fs;
    seg('seg-theme', prefs.theme); seg('seg-font', prefs.font); seg('seg-lh', String(prefs.lh));
  }
  function seg(id, v){ var bs = document.getElementById(id).querySelectorAll('button'); for(var i=0;i<bs.length;i++) bs[i].classList.toggle('on', bs[i].dataset.v===v); }
  function bindSeg(id, key, cast){ document.getElementById(id).addEventListener('click', function(e){ var b = e.target.closest('button'); if(!b) return; prefs[key] = cast? cast(b.dataset.v) : b.dataset.v; save(key, prefs[key]); applyPrefs(); }); }
  bindSeg('seg-theme','theme'); bindSeg('seg-font','font'); bindSeg('seg-lh','lh', parseFloat);
  document.getElementById('fs-minus').onclick = function(){ prefs.fs = Math.max(14, prefs.fs-1); save('fs',prefs.fs); applyPrefs(); };
  document.getElementById('fs-plus').onclick = function(){ prefs.fs = Math.min(26, prefs.fs+1); save('fs',prefs.fs); applyPrefs(); };
  document.getElementById('btn-theme').onclick = function(){
    var dark = root.getAttribute('data-theme')==='dark' || (!root.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
    prefs.theme = dark ? 'light' : 'dark'; save('theme', prefs.theme); applyPrefs();
  };
  document.getElementById('btn-set').onclick = function(e){ e.stopPropagation(); panel.hidden = !panel.hidden; };
  document.addEventListener('click', function(e){ if(!panel.hidden && !panel.contains(e.target)) panel.hidden = true; });

  // 目录
  function buildToc(){
    var h = '';
    VOLS.forEach(function(v, vi){
      h += '<div class="vol"><div class="vol-h"><b>'+v.id+' · '+v.name+'</b><i>'+v.span+'</i></div><ol>';
      CH.filter(function(c){return c.vol===vi;}).forEach(function(c){
        h += '<li><button data-n="'+c.num+'"><span class="n">'+String(c.num).padStart(2,'0')+'</span><span>'+c.title+'</span></button></li>';
      });
      h += '</ol></div>';
    });
    document.getElementById('toc-list').innerHTML = h;
  }
  document.getElementById('toc-list').addEventListener('click', function(e){ var b = e.target.closest('button'); if(b){ go(+b.dataset.n); closeToc(); } });
  function markToc(){
    var bs = document.querySelectorAll('#toc-list button');
    for(var i=0;i<bs.length;i++){ var n = +bs[i].dataset.n; bs[i].classList.toggle('on', n===cur); bs[i].classList.toggle('read', !!readSet[n]); }
    if(cur){ var on = document.querySelector('#toc-list button.on'); if(on && on.scrollIntoView) on.scrollIntoView({block:'nearest'}); }
  }
  function openToc(){ toc.classList.add('open'); scrim.classList.add('show'); }
  function closeToc(){ toc.classList.remove('open'); scrim.classList.remove('show'); }
  document.getElementById('menu').onclick = openToc; scrim.onclick = closeToc;
  var brand = document.getElementById('brand'); brand.onclick = function(){ cover(); closeToc(); }; brand.onkeydown = function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); cover(); closeToc(); } };

  // 封面
  function cover(){
    cur = null; save('cur', null);
    var last = load('last', null);
    var lastCh = last ? CH[last-1] : null;
    var readN = Object.keys(readSet).length;
    var h = '<div class="cover">'
      + '<p class="kicker">一个独立开发者的三年</p>'
      + '<h1>信风</h1>'
      + '<p class="sub">林拓在杭州一家公司写后端。凌晨一点改完线上故障，他建了一个空文件夹，取名「自己的东西」。这本书写他从那个文件夹开始，做一个没人要的 App，做一个小工具站，造一个没有助记词的钱包，到两个人的小公司，三年半。</p>'
      + '<button class="cta" id="cta">'+(lastCh?'继续读 · 第 '+lastCh.num+' 章 '+lastCh.title:'从第 1 章开始')+'<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>'
      + '<div class="facts"><div><b>40</b>章</div><div><b>19.5 万</b>字</div><div><b>'+readN+' / 40</b>已读</div></div>'
      + '<ul class="vols">';
    VOLS.forEach(function(v, vi){
      var first = CH.filter(function(c){return c.vol===vi;})[0];
      h += '<li><button data-n="'+first.num+'"><span class="v">'+v.id+'</span><span class="t">'+v.name+'<small>第 '+first.num+' 章起</small></span><span class="r">'+v.span+'</span></button></li>';
    });
    h += '</ul>'
      + '<div class="rules"><b>夜航船 · 三问</b>谁会为它付钱？<br>他们今天在哪儿、正在用什么凑合？<br>你凭什么比他们现在的办法好？</div>'
      + '<p class="foot">书中的工具站「咔哒工具箱」与「信风钱包」均为虚构。每章末尾的「航海日志」是主角公开发布的短帖。</p>'
      + '</div>';
    page.innerHTML = h;
    document.getElementById('cta').onclick = function(){ go(lastCh ? lastCh.num : 1); };
    page.querySelector('.vols').addEventListener('click', function(e){ var b = e.target.closest('button'); if(b) go(+b.dataset.n); });
    where.textContent = '信风'; prog.style.width = '0'; document.title = '信风'; markToc();
    window.scrollTo(0,0);
  }

  // 章节
  function go(n, keepScroll){
    var c = CH[n-1]; if(!c) return;
    cur = n; save('cur', n); save('last', n);
    var v = VOLS[c.vol];
    var prev = CH[n-2], next = CH[n];
    page.innerHTML = '<article>'
      + '<p class="eyebrow">'+v.id+' · '+v.name+' &nbsp;/&nbsp; 第 '+c.num+' 章</p>'
      + '<h1>'+c.title+'</h1>'
      + '<p class="meta">约 '+(Math.round(c.words/100)/10).toFixed(1)+' 千字 · 读完约 '+Math.max(8, Math.round(c.words/450))+' 分钟</p>'
      + c.html + '</article>'
      + '<nav class="pager">'
      + '<button class="prev" id="prev"'+(prev?'':' disabled')+'><small>上一章</small><span>'+(prev? '第 '+prev.num+' 章 · '+prev.title : '')+'</span></button>'
      + '<button class="next" id="next"'+(next?'':' disabled')+'><small>下一章</small><span>'+(next? '第 '+next.num+' 章 · '+next.title : '全书完')+'</span></button>'
      + '</nav>';
    document.getElementById('prev').onclick = function(){ if(prev) go(prev.num); };
    document.getElementById('next').onclick = function(){ if(next) go(next.num); else cover(); };
    where.innerHTML = v.id+' · '+v.name+'<b>第 '+c.num+' 章 · '+c.title+'</b>';
    document.title = '第 '+c.num+' 章 · '+c.title+' — 信风';
    markToc();
    if(keepScroll){ var y = load('scroll.'+n, 0); window.scrollTo(0, y); } else window.scrollTo(0,0);
    if(history.replaceState) history.replaceState(null, '', '#ch'+n);
  }
  function prevCh(){ if(cur>1) go(cur-1); } function nextCh(){ if(cur && cur<40) go(cur+1); }

  // 进度、已读、位置记忆
  var tick = null;
  window.addEventListener('scroll', function(){
    if(!cur) return;
    var doc = document.documentElement;
    var max = doc.scrollHeight - innerHeight;
    var r = max>0 ? Math.min(1, scrollY/max) : 1;
    prog.style.width = (r*100).toFixed(1)+'%';
    if(r>0.92 && !readSet[cur]){ readSet[cur]=1; save('read', readSet); markToc(); }
    clearTimeout(tick); tick = setTimeout(function(){ save('scroll.'+cur, scrollY); }, 250);
  }, {passive:true});

  document.addEventListener('keydown', function(e){
    if(e.target.tagName==='INPUT') return;
    if(e.key==='ArrowRight') nextCh(); else if(e.key==='ArrowLeft') prevCh();
    else if(e.key==='t'||e.key==='T'){ if(toc.classList.contains('open')) closeToc(); else openToc(); }
    else if(e.key==='Escape'){ closeToc(); panel.hidden = true; }
  });

  // 启动
  applyPrefs(); buildToc();
  var m = location.hash.match(/^#ch(\d+)$/);
  if(m && CH[+m[1]-1]) go(+m[1], true);
  else { var c0 = load('cur', null); if(c0 && CH[c0-1]) go(c0, true); else cover(); }
})();
</script>
</body>
</html>
