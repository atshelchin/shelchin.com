<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>信风</title>
<meta name="description" content="一个独立开发者业余起步、做小工具站、造一个钱包、从没收入到稳定收入的三年。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@400;500&display=swap">
<style>
:root{
  --ground:#F1F3EF; --surface:#FAFBF8; --surface-2:#E8ECE7; --ink:#1E2722; --ink-2:#4A554F; --muted:#6F7A73;
  --rule:#D5DBD5; --accent:#2F6A4E; --accent-ink:#FFFFFF; --brass:#A8742F; --brass-soft:#F3E9D8;
  --shadow:0 12px 32px rgba(30,39,34,.14);
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:"Noto Sans SC",-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --body-font:var(--serif); --fs:18px; --lh:1.95; --measure:36em; --toc-w:300px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#121715; --surface:#1A211D; --surface-2:#232C27; --ink:#E3E8E2; --ink-2:#B4BDB6; --muted:#8B968E;
    --rule:#2B352F; --accent:#7CC5A0; --accent-ink:#0F1A14; --brass:#D6A868; --brass-soft:#2A2519;
    --shadow:0 12px 32px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#121715; --surface:#1A211D; --surface-2:#232C27; --ink:#E3E8E2; --ink-2:#B4BDB6; --muted:#8B968E;
  --rule:#2B352F; --accent:#7CC5A0; --accent-ink:#0F1A14; --brass:#D6A868; --brass-soft:#2A2519;
  --shadow:0 12px 32px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:var(--toc-w) 1fr;min-height:100vh}

/* ---------- 目录 ---------- */
.toc{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--rule);padding:28px 22px 40px;scrollbar-width:thin}
.toc .brand{display:flex;align-items:baseline;gap:10px;margin-bottom:6px;cursor:pointer}
.toc .brand h1{font-family:var(--serif);font-weight:700;font-size:26px;margin:0;letter-spacing:.12em;color:var(--ink)}
.toc .brand span{font-size:12px;color:var(--muted);letter-spacing:.14em}
.toc .tag{font-size:12px;color:var(--muted);margin:0 0 22px}
.vol{margin-bottom:18px}
.vol-h{display:flex;align-items:baseline;gap:8px;padding:6px 0;border-bottom:1px solid var(--rule);margin-bottom:6px}
.vol-h b{font-family:var(--serif);font-size:15px;font-weight:600;color:var(--ink)}
.vol-h i{font-style:normal;font-size:11px;color:var(--muted);letter-spacing:.06em;margin-left:auto;font-variant-numeric:tabular-nums}
.toc ol{list-style:none;margin:0;padding:0}
.toc li button{display:grid;grid-template-columns:2.2em 1fr;align-items:baseline;width:100%;text-align:left;padding:7px 8px;border-radius:6px;color:var(--ink-2);line-height:1.4}
.toc li button:hover{background:var(--surface-2);color:var(--ink)}
.toc li button.on{background:var(--accent);color:var(--accent-ink)}
.toc li button.read:not(.on){color:var(--muted)}
.toc li button .n{font-variant-numeric:tabular-nums;font-size:12px;opacity:.75}
.toc li button.on .n{opacity:.9}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20}

/* ---------- 主区 ---------- */
main{min-width:0;display:flex;flex-direction:column}
.bar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:saturate(1.2) blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
.bar-in{display:flex;align-items:center;gap:10px;padding:10px 18px;max-width:calc(var(--measure) + 120px);margin:0 auto;width:100%}
.bar .where{flex:1;min-width:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .where b{color:var(--ink);font-weight:500;margin-left:6px}
.ib{width:36px;height:36px;display:inline-grid;place-items:center;border-radius:8px;color:var(--ink-2)}
.ib:hover{background:var(--surface-2);color:var(--ink)}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib.menu{display:none}
.progress{height:2px;background:var(--rule)}
.progress i{display:block;height:100%;width:0;background:var(--brass);transition:width .15s linear}

.page{flex:1;width:100%;max-width:calc(var(--measure) + 120px);margin:0 auto;padding:40px 60px 60px}
article{font-family:var(--body-font);font-size:var(--fs);line-height:var(--lh);color:var(--ink);max-width:var(--measure)}
article .eyebrow{font-family:var(--sans);font-size:12px;letter-spacing:.2em;color:var(--brass);margin:0 0 10px;font-variant-numeric:tabular-nums}
article h1{font-family:var(--serif);font-size:2em;font-weight:700;line-height:1.3;margin:0 0 .3em;text-wrap:balance;letter-spacing:.02em}
article .meta{font-family:var(--sans);font-size:12px;color:var(--muted);margin:0 0 2.4em;padding-bottom:1.2em;border-bottom:1px solid var(--rule);font-variant-numeric:tabular-nums;letter-spacing:.04em}
article h2{font-family:var(--serif);font-size:1.25em;font-weight:600;margin:2.2em 0 .8em;color:var(--ink);letter-spacing:.04em}
article p{margin:0 0 1.15em;text-align:justify;text-justify:inter-ideograph;overflow-wrap:anywhere}
article p.stamp{font-family:var(--sans);font-size:.78em;letter-spacing:.12em;color:var(--brass);margin:2em 0 .6em;font-variant-numeric:tabular-nums}
article p.stamp strong{font-weight:500}
article hr{border:0;height:1px;background:var(--rule);margin:2.4em auto;width:40%}
article blockquote{margin:1.4em 0;padding:.2em 0 .2em 1.1em;border-left:2px solid var(--rule);color:var(--ink-2);font-size:.95em}
article blockquote p{margin-bottom:.6em}
article ol{padding-left:1.6em;margin:0 0 1.4em}
article ol li{margin-bottom:.9em;padding-left:.2em}
article strong{font-weight:600}
.log{margin:3em 0 0;padding:1.4em 1.5em 1.1em;background:var(--brass-soft);border-radius:6px;position:relative;font-size:.92em;color:var(--ink)}
.log::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;background:var(--brass);border-radius:2px}
.log .log-label{font-family:var(--sans);font-size:11px;letter-spacing:.24em;color:var(--brass);margin-bottom:1em;font-weight:500}
.log p{margin-bottom:.55em;text-align:left}
.log hr{display:none}

/* 封面 */
.cover{max-width:var(--measure)}
.cover .kicker{font-size:12px;letter-spacing:.24em;color:var(--brass);margin:30px 0 18px}
.cover h1{font-family:var(--serif);font-size:clamp(56px,10vw,96px);font-weight:700;letter-spacing:.18em;margin:0 0 10px;line-height:1.05;color:var(--ink)}
.cover .sub{font-family:var(--serif);font-size:19px;line-height:1.8;color:var(--ink-2);margin:0 0 34px;max-width:30em}
.cover .cta{display:inline-flex;align-items:center;gap:10px;background:var(--accent);color:var(--accent-ink);padding:12px 22px;border-radius:8px;font-weight:500;font-size:15px}
.cover .cta:hover{filter:brightness(1.06)}
.cover .cta svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cover .facts{display:grid;grid-template-columns:repeat(3,auto);gap:28px;margin:44px 0 0;padding-top:24px;border-top:1px solid var(--rule);width:fit-content}
.cover .facts div{font-size:12px;color:var(--muted);letter-spacing:.06em}
.cover .facts b{display:block;font-family:var(--serif);font-size:24px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:0;margin-bottom:2px}
.cover .vols{margin:40px 0 0;padding:0;list-style:none;display:grid;gap:10px}
.cover .vols button{display:grid;grid-template-columns:3.2em 1fr auto;align-items:baseline;gap:12px;width:100%;text-align:left;padding:14px 16px;border:1px solid var(--rule);border-radius:8px;background:var(--surface)}
.cover .vols button:hover{border-color:var(--accent)}
.cover .vols .v{font-family:var(--serif);font-weight:600;color:var(--brass)}
.cover .vols .t{font-family:var(--serif);font-size:17px;font-weight:600;color:var(--ink)}
.cover .vols .t small{display:block;font-family:var(--sans);font-weight:400;font-size:12px;color:var(--muted);margin-top:3px}
.cover .vols .r{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.cover .rules{margin:40px 0 0;padding:20px 22px;border-left:3px solid var(--brass);background:var(--surface);border-radius:0 6px 6px 0;font-family:var(--serif);color:var(--ink-2);font-size:15px;line-height:1.9}
.cover .rules b{display:block;font-family:var(--sans);font-size:11px;letter-spacing:.24em;color:var(--brass);margin-bottom:8px;font-weight:500}

/* 翻页 */
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:var(--measure);margin:48px 0 0;padding-top:24px;border-top:1px solid var(--rule)}
.pager button{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border:1px solid var(--rule);border-radius:8px;background:var(--surface);text-align:left}
.pager button:hover:not(:disabled){border-color:var(--accent)}
.pager button:disabled{opacity:.35;cursor:default}
.pager button.next{text-align:right;align-items:flex-end}
.pager small{font-size:11px;letter-spacing:.14em;color:var(--muted)}
.pager span{font-family:var(--serif);font-weight:600;color:var(--ink);font-size:15px}

/* 设置 */
.panel{position:fixed;top:56px;right:16px;z-index:30;width:300px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);padding:16px}
.panel h3{margin:0 0 12px;font-size:12px;letter-spacing:.2em;color:var(--muted);font-weight:500}
.row{display:grid;grid-template-columns:64px 1fr;align-items:center;gap:10px;margin-bottom:12px}
.row label{font-size:13px;color:var(--ink-2)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:8px;padding:3px;gap:3px}
.seg button{padding:7px 4px;border-radius:6px;font-size:13px;color:var(--ink-2);text-align:center}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.stepper{display:grid;grid-template-columns:36px 1fr 36px;align-items:center;background:var(--surface-2);border-radius:8px;padding:3px}
.stepper button{height:30px;border-radius:6px;font-size:18px;color:var(--ink-2)}
.stepper button:hover{background:var(--surface);color:var(--ink)}
.stepper output{text-align:center;font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink)}
.panel .hint{font-size:12px;color:var(--muted);margin:6px 0 0;line-height:1.5}
kbd{font-family:var(--sans);font-size:11px;padding:1px 5px;border:1px solid var(--rule);border-bottom-width:2px;border-radius:4px;background:var(--surface-2)}

/* 底部 */
.foot{max-width:var(--measure);font-size:12px;color:var(--muted);margin:60px 0 0;line-height:1.7}

/* ---------- 手机 ---------- */
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .toc{position:fixed;left:0;top:0;bottom:0;width:min(84vw,340px);z-index:25;transform:translateX(-104%);transition:transform .22s ease;box-shadow:none}
  .toc.open{transform:none;box-shadow:var(--shadow)}
  .scrim.show{display:block}
  .ib.menu{display:inline-grid}
  .page{padding:26px 20px 48px}
  :root{--measure:100%}
  article{max-width:100%}
  .cover .facts{grid-template-columns:repeat(3,1fr);width:100%;gap:14px}
  .cover .vols button{grid-template-columns:2.6em 1fr;}
  .cover .vols .r{grid-column:2}
  .panel{top:auto;bottom:0;left:0;right:0;width:100%;max-width:100%;border-radius:14px 14px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
}
@media (prefers-reduced-motion:reduce){.toc{transition:none}.progress i{transition:none}}
[hidden]{display:none!important}
</style>
</head>

</div>

<script id="data" type="application/json">{"vols": [{"id": "卷一", "name": "业余时间", "span": "2024.03 – 2025.01"}, {"id": "卷二", "name": "流量的秘密", "span": "2025.01 – 2025.07"}, {"id": "卷三", "name": "造一艘船", "span": "2025.07 – 2026.06"}, {"id": "卷四", "name": "长夜", "span": "2026.05 – 2026.12"}, {"id": "卷五", "name": "信风", "span": "2027.01 – 2027.10"}], "chapters": [{"num": 1, "title": "咔哒", "vol": 0, "html": "<p>凌晨一点零七分，林拓的屏幕上还有一行红字。<\/p><p>订单服务超时。第三次了。<\/p><p>他坐在云梯科技十四层靠窗的位子上。整层楼只剩两盏灯，一盏在他头顶，一盏在隔壁小杜头顶。窗外是滨江的写字楼，一栋挨一栋，大多数已经黑了。三月的夜，空调停了，楼里有点冷。<\/p><p>工作群又跳出一条。方哲：「还要多久？客服电话被打爆了。」<\/p><p>林拓打了两个字：「快了。」删掉。又打：「十分钟。」发出去。<\/p><p>他做的是后端。这个词要说人话，就是饭店的后厨。客人在前面点菜，看不到后厨。后厨一慢，菜上不来，客人就走。今晚的后厨就是慢了。几十万人在手机上点「提交订单」，转圈，转圈，然后一句「网络错误」。<\/p><p>故障是晚上十一点报的。他那时候刚到家楼下，又打车回来了。<\/p><p>第一次他重启了服务，红字退下去十分钟，又爬上来。第二次他把机器加了一倍，撑了半小时，又爬上来。加机器就是后厨多请几个人。人多了，菜还是慢，那问题就不在人，在别的地方。<\/p><p>小杜端着两杯速溶咖啡过来，放一杯在他手边。<\/p><p>「拓哥，找到了吗？」<\/p><p>「嗯。」<\/p><p>「哪儿？」<\/p><p>「查库存那一步。」林拓指着屏幕，「下午有人改了一个查询，没加索引。」<\/p><p>索引是什么，小杜知道，但他还是凑过来看了一眼。索引就是书后面的目录。没有目录，找一个词得从第一页翻到最后一页。下午那个人写的查询，就是在一本两千万页的书里，一页一页地翻。白天人少，翻得过来。晚上八点一波促销进来，就翻不动了。<\/p><p>「谁改的？」<\/p><p>「不重要。」<\/p><p>小杜不说话了。他比林拓小两岁，来公司一年半，跟着林拓做订单这一块。他习惯林拓这样，问什么答什么，多一个字不给。<\/p><p>林拓知道是谁改的。提交记录上有名字。但那个人晚上十一点就没回消息了，骂他也没用。明天开会再说。<\/p><p>林拓把索引加上，跑了一遍测试。绿了。他把改动提交上去，等发布流水线走完。流水线就是一条传送带，代码从这头放上去，检查、打包、送到服务器，从那头出来。传送带走了六分钟。他盯着进度条，一口咖啡都没喝。<\/p><p>一点二十六分，红字消失了。监控图上那条爬到天上去的线，慢慢往下落，像一个人松了口气。<\/p><p>他在群里发：「修好了。原因明天写复盘。」<\/p><p>方哲回了一个「好」。隔了几秒，又回：「辛苦。早点休息。」<\/p><p>方哲是技术总监，三十八岁。他不是坏人。他只是每次出事都在群里，人不在。<\/p><p>小杜伸了个懒腰。「走吧，我叫车。」<\/p><p>「你先走。」<\/p><p>「你呢？」<\/p><p>「再看十分钟。」<\/p><p>「拓哥，你天天这样。」<\/p><p>「嗯。」<\/p><p>小杜没跟他争，背上包走了。电梯门合上的声音在空楼里很响。<\/p><p>林拓在这层楼坐了两年多。刚来的时候坐里面，靠过道；后来换到靠窗。工位换了两次，事情没变过，都是别人的订单，别人的库存，别人的促销。<\/p><p>他又看了十分钟监控。线没有再往上爬。订单一笔一笔进来，绿的，绿的，绿的。他看着那些绿点，想起有一年过年，父亲店里进了一批新货，母亲一箱一箱点数，他在旁边帮着数。也是这样，一个一个，数到最后一个，才能关门。<\/p><p>他关了电脑，把桌上一把旧螺丝刀放进抽屉。木头柄，柄上一道裂，刀头磨得发亮。那是他父亲的。他从老家带来杭州六年了，一直放在工位上。不用，就是放着。<\/p><p>二〇一八年他来杭州，父亲送他到车站，从口袋里掏出这把螺丝刀，塞给他。没说为什么。他也没问。后来他想，父亲大概是觉得，一个人出门，手边总得有一件顺手的东西。<\/p><p>十四层的大厅里，墙上一行大字：「让每一笔交易更快」。他每天进出都看见，从来没抬头看过。今晚他看了一眼。保安在门口打瞌睡，听见脚步声抬起头，又低下去。<\/p><p>下楼，打车。<\/p><p>司机五十来岁，车里放着老歌。九十年代那种，男人唱的，嗓子沙沙的。林拓小时候，父亲店里的收音机就放这个。<\/p><p>「加班啊？」司机问。<\/p><p>「嗯。」<\/p><p>「你们做电脑的，钱多吧。」<\/p><p>林拓没答。车拐出园区，路灯一根一根往后退。<\/p><p>他心里过了一遍数。税前一万八，到手一万四。房租四千二，两个人分。存款十一万，两个人的，能动的。这些数他不用翻，都在脑子里。记账是父亲教的。父亲店里的账本每天晚上记，一笔不落，记完了才关卷帘门。他到杭州之后也记，记了六年。手机上一个记账软件，每一笔都有。<\/p><p>司机把歌换了一首，还是老歌。<\/p><p>「我儿子也想学电脑，」司机说，「我说学吧。学了以后不用像我这样开夜车。」<\/p><p>「我以前开修车铺的，」司机自己接着说，「后来开不下去。修车的多，修的人少。」<\/p><p>「嗯。」<\/p><p>「现在好，开车，天天有活。就是夜里冷。」<\/p><p>林拓「嗯」了一声。他想说点什么，没想出来。<\/p><p>「你多大了？」司机又问。<\/p><p>「二十八。」<\/p><p>「哪儿人？」<\/p><p>「江西。」<\/p><p>「江西好，江西人能吃辣。」<\/p><p>「结婚了没？」<\/p><p>「没。」<\/p><p>「二十八也该结了。」<\/p><p>「嗯。」<\/p><p>林拓看着窗外。他没说他也这么想。他也没说，一想到结婚就要想房子，一想到房子就要想那十一万，一想到那十一万就不想了。<\/p><p>车停在小区门口。他付了钱，站在路边，打开记账软件，记了一笔：打车，二十八。存款那一栏的数字动了一下，还是十一万出头。他把手机收起来，往里走。<\/p><p>进门是一点五十。<\/p><p>屋里黑着。他没开大灯，开了玄关那盏小的。一室一厅，他和沈月住了两年。客厅的桌上放着一个盘子，盘子上扣着另一个盘子。他掀开，一碗饭，饭上盖着青椒炒肉和一个荷包蛋。旁边压着一张便利贴：「微波炉两分钟。」<\/p><p>便利贴旁边是一摞作业本，红笔压在最上面一本上。沈月是小学语文老师，晚上改作业，改到几点他不知道。最上面那本翻开着，一篇作文，题目是「我的爸爸」。<\/p><p>沈月说过一次，不是抱怨，就是那么一说：「你回来的时候，能不能先看我一眼，再看手机。」他说行。后来他回来的时候她多半睡了，这句话就没机会兑现。<\/p><p>他把饭放进微波炉，站在旁边等。微波炉嗡嗡地转。叮的一声，他赶紧按开门，怕吵醒她。卧室门虚掩着，能听见沈月的呼吸声，很匀。<\/p><p>他端着饭去了阳台。<\/p><p>阳台上有一张小桌子，是他的位子。一台笔记本，一盏台灯，一个杯子。窗外是另一栋楼，黑的，只有一扇窗还亮着，一个人影在走来走去。<\/p><p>青椒炒肉是他爱吃的。她做的时候放了一点豆豉，和他母亲的做法一样。这是他有一次随口说的，她记住了。<\/p><p>他吃了几口饭，掏出手机。<\/p><p>手机上有个软件叫「圈子」。做互联网的人都在上面，发一些工作上的话，也发一些牢骚。他刷这个不是为了看什么，就是手在动。<\/p><p>刷到第五条，他停下了。<\/p><p>是一张截图。一个后台页面，最上面一行「本月收入」，后面一个数：30,412。截图下面一句话：「副业第二年。一个小工具站。一个人。」<\/p><p>他往下拉评论。<\/p><p>第一条：「假的。P 图谁不会。」<\/p><p>第二条：「什么站？发个链接。」<\/p><p>第三条：「楼上想多了，人家不会发的。」<\/p><p>第四条：「怎么做的？求教。」<\/p><p>第五条：「一个月三万，工具站根本不可能。」<\/p><p>第六条：「不可能的话你做一个试试。」<\/p><p>第七条：「我做了。三个月，收入零。」<\/p><p>第八条：「那是你的问题。」<\/p><p>底下一百多条，吵成一片。发帖的人没有再出现。<\/p><p>林拓把评论翻完了。骂的人多，问的人也多。骂的人说得都很肯定，问的人说得都很小声。他不知道自己是哪一种。他一条都没回。他在圈子上三年，一条都没发过，只看。<\/p><p>林拓把截图放大看。后台的字体，页面的边角，收入曲线上那几个小起伏。看不出真假。他又缩回去，看那句话。「一个人。」<\/p><p>他点进发帖人的主页。头像是一只猫。往下翻，帖子不多，一个月一两条。一年前的一条：「第一个月，收入 216。」再往前一条：「上线了。没人来。」再往前，是一张深夜的桌子，一台电脑，一碗泡面。配的字只有两个：「开始。」<\/p><p>他看了很久那碗泡面。<\/p><p>中间还有几条。「第六个月，一千九。第一个不认识的人付了钱。」「第九个月，被人抄了。」「第十一个月，八千。换了个新键盘。」每一条底下都没几个人回。热闹的只有今晚这一条。<\/p><p>林拓把这些数字在心里排了一遍。二百一十六，一千九，八千，三万。他记账记了六年，看数字比看人快。这不是一条直线，是一条慢慢往上爬的线，中间有坑。<\/p><p>饭凉了。他没管。<\/p><p>他把手机扣在桌上，靠在椅背上。<\/p><p>楼下有人在遛狗，链子哗啦哗啦响。两点了，还有人遛狗。<\/p><p>三万块。他一个月到手一万四。这个数不是让他馋，是让他想不通。他会写代码，写了六年。他今晚一个人修好了一个几十万人在用的东西。方哲说辛苦，小杜说拓哥。可他做出来的东西，从来没有一样是自己的。明天他不来了，那些东西照样在，只是名字换成别人的。<\/p><p>那只猫的主人，第一个月两百一十六块。也是一个人，也是一台电脑。他有什么是那个人没有的？他有什么是那个人有的？<\/p><p>他闭上眼。<\/p><p>有一个声音。不是人的声音，是一个铁盖子扣上的声音。<\/p><p>咔哒。<\/p><p>那是他父亲店里的工具箱。绿色的，铁皮，边角磕掉了漆，露出底下的银色。店叫「建国五金」，在县城临街，一扇卷帘门，里面一排排货架，柜台后面一张旧账本。他小时候放学去店里写作业，父亲在柜台后面修东西。修好了，把螺丝刀、扳手一样一样放回箱子，盖上盖子。咔哒。那一声很脆，不响，但整个店都能听见。<\/p><p>他七八岁的时候问过父亲，为什么不买个新的。<\/p><p>父亲说，这个顺手。<\/p><p>他问，什么叫顺手。<\/p><p>父亲没答。父亲把箱子打开，让他拿一把螺丝刀。他拿了。父亲说，你看，你不用想，手就知道往哪儿伸。这就是顺手。<\/p><p>后来又有一次，一个客人来买电钻。问了很多，功率多大，转速多少，哪个牌子好。父亲一句没讲，把电钻拿下来，接上电，递过去，说你钻一下试试。客人对着一块木头钻了一下，买了。<\/p><p>客人走了，父亲说了一句话。那时候林拓没太懂，但记住了。<\/p><p>「工具不用讲，拿起来顺手就是道理。」<\/p><p>母亲在旁边记账，头也不抬，说你少教他这些，让他好好读书。<\/p><p>父亲没接话。父亲把电钻那一栏的库存改了一个数，合上账本，去关卷帘门。<\/p><p>林拓睁开眼。<\/p><p>阳台的灯照着笔记本。他把它打开。桌面上是公司的东西，一堆文档，一堆截图，一个叫「复盘」的文件夹。他明天要写今晚的复盘，写谁改了查询，写为什么没加索引，写以后怎么防。他写过很多这样的东西。写完发出去，方哲说好，然后归档，然后下一次。<\/p><p>他在桌面空白的地方点了右键。新建文件夹。<\/p><p>光标在那里闪。<\/p><p>他想叫它「工具站」。不对。他还不知道要做什么工具。<\/p><p>他想叫它「副业」。这个词让他不舒服，像是偷偷摸摸，像是在公司电脑上藏东西。这台电脑是他自己的，可他还是不舒服。<\/p><p>他想叫它「项目」。太像公司了。公司里什么都叫项目。<\/p><p>他想叫它「咔哒」。手停了一下。这个词他从来没打出来过。他没打。他不知道为什么没打。<\/p><p>光标闪了很久。阳台外面那扇亮着的窗黑了。<\/p><p>他想起父亲店里的货架。每一格上面贴一张纸条，写着东西的名字。膨胀螺丝。水管接头。合页。父亲说，东西要有名字，没名字就找不着。他现在要给一个还没有的东西起名字。<\/p><p>他打了四个字：自己的东西。<\/p><p>回车。<\/p><p>名字有点傻。沈月看见了大概会笑。但是他想不出别的。这四个字至少是真的。<\/p><p>卧室里有一点动静。沈月翻了个身，声音闷闷的。<\/p><p>「几点了？」<\/p><p>「两点多。」<\/p><p>「吃了没？」<\/p><p>「吃了。」<\/p><p>「早点睡。」<\/p><p>「嗯。快了。」<\/p><p>她没有再说话。过了一会儿，呼吸声又匀了。<\/p><p>林拓看着桌面上那个文件夹。图标是一个黄色的夹子，底下四个字。他双击打开。里面什么都没有。一片白。<\/p><p>他关上，又打开。还是白的。<\/p><p>他想，那只猫的主人一年前也有一个这样的文件夹。里面也是白的。后来里面有了东西，两百一十六块，一千九，八千。他不知道中间是什么。截图上看不出来。<\/p><p>他新建了一个文本文件，想写点什么。写一个想法，写一个名字，写随便什么。光标在第一行闪。他打了「做一个」，停住。做一个什么。他把三个字删了。文件空着，他把它也删了。文件夹又是白的。<\/p><p>他拿起手机，打开备忘录，打了一行字。打完看了一遍，没删。<\/p><p>时间是两点三十一分。上午十点有复盘会。他算了一下，能睡六个小时。够。<\/p><p>他习惯性地打开监控页面看了一眼。绿的。订单一笔一笔进来，比刚才少了，凌晨没多少人买东西。他看着那些绿点，忽然觉得它们离自己很远。<\/p><p>线上故障他不怕。红字出来，他知道从哪儿查。日志、监控、最近的改动，一步一步往下找，总能找到。找到了就修，修好了线就落下来，有人说一句辛苦。<\/p><p>今晚这个不一样。这个文件夹是空的。没有红字，没有报错，没有人在群里催。没有人告诉他从哪儿开始，也没有人告诉他做完了算什么。<\/p><p>他坐在那里，看着那一片白，觉得比线上故障还让人心慌。<\/p><aside class=\"log\"><div class=\"log-label\">航海日志<\/div><p>（备忘录）<\/p><p>3 月 14 日，凌晨两点。<\/p><p>建了个文件夹。<\/p><p>里面什么都没有。<\/p><\/aside>", "words": 4820}, {"num": 2, "title": "番茄账本", "vol": 0, "html": "<p>三月十六日，周六，上午十点。林拓坐在阳台的小桌前，文件夹还是空的。<\/p><p>他已经盯了它两天。周四建的，周五加了一夜班，没碰。今天他不打算再看它了。他打算往里放东西。<\/p><p>沈月在客厅拖地。拖把碰到桌腿，她说了一句「抬脚」，他抬了。<\/p><p>他打开记账软件，翻了翻。六年的账，每一笔都在。打车二十八，房租两千一，早饭七块。他一直觉得这个软件不好用，分类太多，广告太多，每次打开先弹一个会员。他想过很多次，自己写一个。<\/p><p>他又打开另一个软件，一个番茄钟。番茄钟是什么，就是一个二十五分钟的闹钟。定上，专心干一件事，响了歇五分钟，再定。像煮东西，定个时，到点了就停，不用一直盯着锅。他写代码的时候用这个，也不好用，太花哨。<\/p><p>两个软件他都不满意。两个他都天天用。<\/p><p>他把两个软件的图标并排放在一起，看了一会儿。<\/p><p>然后他在文件夹里新建了一个文档，打了几个字：记账 + 番茄钟。<\/p><p>沈月拖完地，端着水杯站到阳台门口。<\/p><p>「你在干嘛？」<\/p><p>「想做个东西。」<\/p><p>「什么东西？」<\/p><p>「一个软件。记账，加番茄钟。」<\/p><p>「番茄钟是什么？」<\/p><p>「一个闹钟。二十五分钟，专心干活。」<\/p><p>「记账和闹钟放一起？」<\/p><p>「嗯。」<\/p><p>她喝了一口水。「谁会用？」<\/p><p>「跟我一样的人。」<\/p><p>「跟你一样的人是什么人？」<\/p><p>「写代码的，要记账，也要专心。」<\/p><p>她想了想。「那你问过他们吗？」<\/p><p>「我自己就是。」<\/p><p>她没再问，回屋里去了。过了一会儿，屋里传来翻书的声音。她周末看小说。<\/p><p>她走之前又说了一句：「你先做吧。做出来我看看。」<\/p><p>林拓对着那行字坐了一上午。他想好了名字，叫「番茄账本」。他想好了图标，一个番茄，番茄上画一个小本子。他想好了要做安卓和网页，因为另一家应用商店要交年费，他先不交。<\/p><p>他没有想过谁会用。他觉得这个不用想。<\/p><p>他在文档里列了一个清单。记账、分类、报表、番茄钟、统计。五行。他看了看，觉得少，又加了三行。八行。他把文档保存了，文件夹里终于有了一个东西。他关上电脑，去洗了碗。沈月看他洗碗，没说话，只是笑了一下。<\/p><p>下午他开始写。<\/p><p>他用了一个 AI 编程助手。这东西怎么解释，就是一个手很快的学徒。你说一句，他写一段。你说要一个记账页面，他三秒钟给你一个，按钮、输入框、列表，样样都有。你说加一个番茄钟，他又三秒钟给你一个，圆的，会转。他不累，不抱怨，不问为什么。<\/p><p>他也不知道你要开的是什么店。<\/p><p>有一次他半开玩笑，在对话框里打：「这个软件谁会用？」学徒答了一大段。「适合需要管理个人财务并提升专注力的用户，例如学生、自由职业者、上班族……」他看了一眼，关了。跟没说一样。<\/p><p>第一个周末，林拓做出了能记一笔账的页面。第二个周末，做出了能转的番茄钟。第三个周末，他把两个东西放进同一个软件，底下两个标签，左边「账」，右边「钟」。<\/p><p>他用了一下。记了一笔账，切到钟，定了二十五分钟，写代码。响了。他切回去，看了一眼账。<\/p><p>好像还行。他说不上来哪里怪。<\/p><p>四月，他开始加东西。<\/p><p>记账要有分类。分类要能自定义。要有月报表，饼图，柱状图。要有预算，超了要提醒。番茄钟要能改时长，有人不喜欢二十五分钟。要有统计，今天几个番茄，这周几个。要有白噪音，下雨声，咖啡馆声。要有深色模式。要有导出。要能云同步，换手机不丢。<\/p><p>每一样他都觉得应该有。每一样学徒都三秒钟给他。<\/p><p>每一样加上去，软件就厚一点。<\/p><p>五月初的一个晚上，沈月拿他的手机试了一下。她记了一笔：晚饭，三十五。然后她点到番茄钟那边，看了一会儿。<\/p><p>「这个干嘛用？」<\/p><p>「专心用。」<\/p><p>「记完账为什么要专心？」<\/p><p>「不是记完账专心。是两个东西放一起。」<\/p><p>「哦。」她把手机还给他，「我记账用本子。」<\/p><p>他知道她用本子。一个小本子，放在厨房抽屉里，每天买菜记一笔。他没想过问她要不要用他的。他觉得她不算。<\/p><p>他的作息变成这样：工作日晚上十点到家，吃饭，十一点坐到阳台，写到一两点。周六周日，上午写，下午写，晚上写。沈月偶尔过来站一会儿，看一眼屏幕，不说话，走了。<\/p><p>那天下午方哲路过，也看了他一眼。「小林，昨晚又上线了？」<\/p><p>「没有。」<\/p><p>「那你这脸色。」<\/p><p>「没睡好。」<\/p><p>方哲点点头，走了。方哲不管人晚上干什么，只管白天线上不出事。<\/p><p>四月底，小杜在工位上问他：「拓哥，你最近眼睛好红。」<\/p><p>「嗯。」<\/p><p>「加班？」<\/p><p>「自己做点东西。」<\/p><p>「什么？」<\/p><p>「一个记账软件。」<\/p><p>小杜「哦」了一声，没往下问。他自己也在做点东西，林拓知道，但两个人都没细聊。<\/p><p>五月的一个晚上，十一点多，电话响了。郑浩。<\/p><p>郑浩是林拓大学上铺。毕业后去了深圳，换过三家公司，去年自己开了一家，做 AI 客服。林拓半年没跟他说过话。<\/p><p>「拓！」郑浩的声音很大，背景里有人在笑，有杯子碰的声音。「睡了没？」<\/p><p>「没。」<\/p><p>「跟你说个事。我们 A 轮拿到了。两千万。」<\/p><p>「嗯。恭喜。」<\/p><p>融资是什么，林拓大概知道。就是有人先给你一笔钱，让你去造船。船造出来，赚了钱，大头分给他。A 轮就是第一笔正经的大钱。两千万，能造一艘不小的船。<\/p><p>「你还在云梯？」<\/p><p>「嗯。」<\/p><p>「过来吧。」郑浩说，「我们现在二十个人，缺一个能扛后端的。你来做技术负责人。期权我给你，比你现在多。」<\/p><p>「我想想。」<\/p><p>「想什么？杭州那点工资，你干到四十岁也就那样。」<\/p><p>林拓没接。他看着屏幕上那个番茄，转了一半。<\/p><p>「你最近在忙啥？」郑浩问。<\/p><p>「做了个小软件。记账的。」<\/p><p>「记账？」郑浩笑了，「拓，别做小东西。小东西没意思。要做就做大的，做平台，做能融资的。你看我，一年，两千万。」<\/p><p>「嗯。」<\/p><p>「你自己想，想好了给我打电话。我们这边随时要你。」<\/p><p>电话挂了。背景里的笑声一下没了，阳台上很静。<\/p><p>他点开郑浩的朋友圈。最新一条是今天的，一张合影。二十来个人挤在一块白板前。白板上写着「A 轮」两个字，画了一个大大的对勾。郑浩站在中间，笑得最大。底下八十多个赞。<\/p><p>林拓也点了一个赞。<\/p><p>沈月从屋里出来，头发湿的，刚洗完澡。<\/p><p>「谁？」<\/p><p>「郑浩。」<\/p><p>「说什么？」<\/p><p>「融了两千万。让我去深圳。」<\/p><p>她站着没动。「你怎么说？」<\/p><p>「我说想想。」<\/p><p>「那你想吗？」<\/p><p>他没答。他不知道。他知道的是他不想去深圳，他也不想一直在云梯。这两个「不想」加起来，不等于任何一个「想」。<\/p><p>「你去洗澡吧，」她说，「水热着。」<\/p><p>他去洗澡。水很热。他站在水底下想，两千万，二十个人，一年。他想不出这些数跟他有什么关系。他只知道，他的文件夹里有一个番茄，转了一半。<\/p><p>六月的第一个周日，沈月的妈妈来吃饭。<\/p><p>沈月做了四个菜，红烧鱼、炒青菜、番茄蛋汤，还有一个林拓爱吃的青椒炒肉。她妈妈带了一袋杨梅，说是邻居家自己种的。<\/p><p>林拓洗了杨梅，放在桌上。他跟沈月的妈妈见过七八次，每次都是这样，他洗水果，她说话。<\/p><p>「小林最近忙吧？」<\/p><p>「嗯。还行。」<\/p><p>「小月说你晚上睡得晚。」<\/p><p>「有点事情做。」<\/p><p>「工作上的？」<\/p><p>「自己的。」<\/p><p>她妈妈夹了一块鱼，没往下问这个。过了一会儿，她换了个话头。<\/p><p>「小月，你们那个学校旁边新开的盘，你看了没有？」<\/p><p>「没看。」<\/p><p>「两万八一平，不算贵。首付的话，你们两个凑一凑……」<\/p><p>「妈。」<\/p><p>「我就是说说。你今年二十七了。」<\/p><p>「我知道我多大。」<\/p><p>林拓低着头剥杨梅。杨梅的汁染在指头上，红的。<\/p><p>「小林，你觉得呢？」她妈妈问。<\/p><p>「嗯，」林拓说，「看看。」<\/p><p>「他在做自己的事，」沈月说，「等做出来再说房子。」<\/p><p>「做什么事？」<\/p><p>「一个软件。」<\/p><p>「软件能当房子？」<\/p><p>「妈，你吃鱼。」<\/p><p>她妈妈吃鱼。桌上安静了一会儿。沈月给林拓夹了一块鱼，没看他。<\/p><p>晚上她妈妈走了。林拓洗碗。沈月靠在厨房门口。<\/p><p>「我妈说的你别往心里去。」<\/p><p>「嗯。」<\/p><p>「你也别不往心里去。」<\/p><p>「嗯。」<\/p><p>「你那个软件，什么时候能做完？」<\/p><p>「七月。」<\/p><p>「做完了呢？」<\/p><p>「上线。」<\/p><p>「上线了呢？」<\/p><p>他把碗放进架子上，水滴下来。「不知道。」<\/p><p>他没告诉她，这三个月他加的功能有二十多个，删掉的是零。<\/p><p>七月初他把软件提交到应用商店。第一次被打回来，说缺一份隐私政策。隐私政策就是一张纸，写清楚你收用户什么数据，拿去干什么。他没想过这个。他让学徒写了一份，读了一遍，改了几个词，交上去。<\/p><p>七月十三日，周六，番茄账本上线。<\/p><p>安卓的应用商店审核了五天，通过了。网页版他自己挂在一个服务器上。图标是那个番茄，上面一个小本子，是他找 AI 画的，画了三十多版。<\/p><p>晚上九点，他发了一条朋友圈。一张截图，三句话：「做了一个记账加番茄钟的小软件。安卓和网页都有。欢迎试试。」附了链接。<\/p><p>发完他把手机扣在桌上，等。<\/p><p>十分钟，八个赞。小杜评论：「支持拓哥！」大学同学评论：「牛。」一个表哥评论：「下了。」沈月评论了一个番茄。<\/p><p>郑浩也点了个赞，评论了四个字：「加油，小而美。」林拓看了这四个字很久。他不知道郑浩是夸他还是可惜他。<\/p><p>她也下了一个。当着他的面记了一笔：番茄账本，零元。他说这不是花钱。她说，那记什么，记时间？他没答上来。<\/p><p>他打开后台。下载：3。<\/p><p>十一点，下载：11。<\/p><p>睡前，下载：19。<\/p><p>第二天，31。第三天，38。第四天，41。<\/p><p>一周后，47。<\/p><p>那一周他在公司也在看后台。改一会儿代码，切过去看一眼。数字不动。再改一会儿，再看。小杜有一次从后面经过，看见了，什么也没说。<\/p><p>他把这四十七个人在心里过了一遍。小杜。同组的两个同事。大学同学七八个。表哥。沈月。沈月学校的两个老师，她转发的。他妈妈，他教了半个小时才装上。剩下的，大概也是朋友的朋友。<\/p><p>四十七个人里，第二天还在用的，后台显示，四个。<\/p><p>第二周，一个。<\/p><p>那一个是他自己。<\/p><p>他在群里问小杜：「你还用吗？」<\/p><p>小杜过了很久才回：「拓哥，说实话，我不记账。」<\/p><p>林拓看着这句话。他从来没问过小杜记不记账。他也没问过表哥，没问过大学同学，没问过沈月学校的老师。他谁也没问过。四十七个人里，他不知道有几个记账。<\/p><p>七月二十日，周六，商店里出现了第一条评价。也是唯一一条。<\/p><p>两颗星。一句话。<\/p><p>「这是给谁用的？」<\/p><p>没有署名，没有头像，看不出是谁。不是熟人，熟人不会这么写。<\/p><p>小杜看见了，发消息问他，要不要找几个人刷几条好评盖住。林拓说不用。<\/p><p>林拓把那句话看了一遍。又一遍。<\/p><p>他想回复。他打了「给需要记账和专注的人」，删了。打了「给我这样的人」，删了。打了「你觉得呢」，删了。<\/p><p>他关了商店页面，打开软件。记账页面，十七个分类。报表页面，三种图。番茄钟，五种时长，四种白噪音。设置页面，往下翻了三屏。<\/p><p>他一项一项地看。每一项他都记得是哪个周末加的，为什么加。每一项单看都有道理。<\/p><p>十七个分类，他自己常用的只有六个。三种图，他只看过一种。四种白噪音，他从来不开，他写代码要安静。这些东西是给谁加的，他现在答不出。当时他觉得，别人可能要。可是别人是谁，他没问过。<\/p><p>他又打开自己的记账软件。不是番茄账本，是那个旧的，有广告的，六年账都在里面的。他今天记了三笔，都记在这里。<\/p><p>他没有把六年的账搬过去。他试过一次，搬到一半嫌麻烦，放下了。<\/p><p>他自己都没换。<\/p><p>他把软件切到番茄钟，定了二十五分钟。番茄开始转。他看着它转，没写代码，什么也没干。<\/p><p>二十五分钟响了。他没有切回账本。他不想切。<\/p><p>他明白了一件事，但是说不出来。他做的这个东西，两边各是一个别人已经有的东西，中间没有东西。<\/p><p>沈月出来倒水，看见他坐着，屏幕上一个番茄。<\/p><p>「怎么了？」<\/p><p>「有人问，这是给谁用的。」<\/p><p>她站了一会儿。「你怎么答的？」<\/p><p>「没答。」<\/p><p>「答不出来？」<\/p><p>「嗯。」<\/p><p>她把水杯放在他桌上。「那就先别答。」<\/p><p>她回屋了。他坐到天亮。<\/p><p>四十七个下载，一条评价。三个月，两百多个小时。存款还是十一万，一分没多，也没少，只是服务器和域名花了几百。他在账本上记了这几笔，分类选了「其他」。他没有一个分类叫「自己的东西」。<\/p><p>天亮的时候，他写了一条朋友圈。写完看了一遍。删了。<\/p><p>周一早上沈月出门前，看见他还坐在阳台上，眼睛红的。<\/p><p>「一晚上？」<\/p><p>「嗯。」<\/p><p>「想出来了？」<\/p><p>「没有。」<\/p><p>「那去上班吧。」她说，「想不出来的事，先放着。」<\/p><p>周一上班，他在工位上改公司的东西。改到下午，小杜转过椅子来。<\/p><p>「拓哥。」<\/p><p>「嗯。」<\/p><p>「周六有个聚会。一群做自己东西的人，在西湖边一个茶馆。你来不来？」<\/p><p>林拓没抬头。「什么人？」<\/p><p>「不知道。我一个朋友拉我去的，说是有个群，叫夜航船。他说去了就知道。」<\/p><p>林拓的手停在键盘上。<\/p><p>「你去不去？」小杜问。<\/p><p>「嗯。」他说，「去。」<\/p><aside class=\"log\"><div class=\"log-label\">航海日志<\/div><p>（删掉的朋友圈草稿）<\/p><p>三个月，47 个下载。<\/p><p>第二周还在用的，1 个。<\/p><p>有人问我这是给谁用的。<\/p><p>我不知道问题在哪。<\/p><\/aside>", "words": 4837}, {"num": 3, "title": "夜航船", "vol": 0, "html": "<p>七月二十七日，周六，下午一点五十。林拓和小杜站在西湖边一条小巷口，找一家叫「不打烊」的茶馆。<\/p><p>太阳很毒。湖边的柳树一动不动。小杜拿着手机看地图，转了两圈，说在这儿。一扇木门，门口一块小黑板，粉笔写着两个字：夜航船。底下一行小字：二楼，AA。<\/p><p>小杜的朋友已经在门口等着了，圆脸，戴一顶棒球帽，做一个给相册去重的小工具。他说他来过三次，第一次也是这样，不知道该说什么，坐着听就行。<\/p><p>林拓昨晚没睡好。他想过不来。早上沈月问他去哪儿，他说一个聚会，她说去吧，穿件干净的。他穿了那件灰色的。<\/p><p>二楼是一个大间，一张长桌，能坐二十个人。桌上摆着一套茶具，一个矮胖的紫砂壶，十几个小杯子。已经坐了七八个人，有人在聊，有人在看手机。窗开着，能看见一角湖。<\/p><p>坐在桌子那头倒茶的是一个四十来岁的男人。短头发，有一点白，穿一件很旧的黑 T 恤。他不说话，只倒茶，倒完一杯推给旁边的人，再倒下一杯。<\/p><p>小杜的朋友迎上来。「来了。这是我说的那两位，都在云梯。」<\/p><p>那个倒茶的男人抬头看了一眼，点点头。「坐。喝茶。」<\/p><p>声音很慢。每个字之间有一点空。<\/p><p>「这是老船长，」小杜的朋友小声说，「韩沛。群是他建的。」<\/p><p>林拓坐下。面前一杯茶推过来，深红色的。他喝了一口，普洱，有点苦，后面回甜。<\/p><p>桌上的人穿得都很普通。T 恤，短裤，拖鞋。有一个人还背着买菜的布袋。没有人穿西装，没有人带名片。要不是那块小黑板，这就是一桌来喝茶的街坊。<\/p><p>两点整，人到齐了。十四个人。老船长把壶放下，看了一圈。<\/p><p>「老规矩。有新人，新人先说。」<\/p><p>他看着林拓和小杜。「说三样。名字。在做什么。你的第一问。」<\/p><p>小杜先说。名字，云梯科技，业余在做一个浏览器插件。第一问，他说他还不太清楚第一问是什么意思，朋友没跟他讲。<\/p><p>桌上有人笑了一下，不是笑他，是笑那个朋友。<\/p><p>老船长没笑。「那我先讲一遍。」<\/p><p>他喝了一口茶。<\/p><p>「这个群，进来要答三个问题。第一，谁会为它付钱。第二，他们今天在哪儿，正在用什么凑合。第三，你凭什么比他们现在的办法好。」<\/p><p>「答不上来也能进。但要知道自己答不上来。」<\/p><p>「第二问最容易漏。人都以为用户在等他。用户不等人。用户在凑合。」<\/p><p>他看向林拓。「到你。」<\/p><p>「林拓。云梯科技，后端。」他停了一下，「做了一个记账加番茄钟的软件。上个月上线的。」<\/p><p>「谁付钱？」老船长问。<\/p><p>「没人付。免费的。」<\/p><p>「以后呢？以后谁付钱？」<\/p><p>「想过加会员。」<\/p><p>「谁买会员？」<\/p><p>林拓想了想。「需要记账的人。」<\/p><p>「需要记账的人今天在用什么？」<\/p><p>「别的记账软件。或者本子。」<\/p><p>「那你凭什么比别的记账软件好？」<\/p><p>「功能多一点。有番茄钟。」<\/p><p>老船长没说话。他把壶提起来，给林拓那杯添满。<\/p><p>「功能多，」他说，「不是好。功能多是重。」<\/p><p>桌上安静了几秒。<\/p><p>坐在林拓斜对面的一个女人开口了。三十来岁，短发，说话很快，东北口音。<\/p><p>「我问一句。三个月，你跟几个用户聊过？」<\/p><p>「什么？」<\/p><p>「用你软件的人。你跟几个说过话。问过他们为什么用，为什么不用。几个？」<\/p><p>林拓说：「零。」<\/p><p>全场安静。<\/p><p>不是那种尴尬的安静。是那种大家都遇到过，所以谁也不笑的安静。有人低头喝茶。有人看着窗外。小杜在旁边坐直了一点。<\/p><p>「我叫周冉，」那个女人说，「做增长的。在一家大厂，管一个产品的用户增长。日活百万。日活就是每天来的人。」<\/p><p>「我管的是别人的船。自己的一条没有。来这儿看你们造。」<\/p><p>她拿过一张纸巾，在上面画了一个倒三角。<\/p><p>「这叫漏斗。一百个人进店，十个拿起东西看，一个付钱。每一层都会漏。做增长就是看每一层漏了多少，为什么漏。」<\/p><p>她在倒三角旁边写了三个数。四十七。四。一。<\/p><p>「你的四十七个下载，第二天剩四个，第二周剩一个。这个漏斗，」她指了指，「没有口。人进来就掉出去了。你连他们为什么掉出去都不知道。因为你没问过。」<\/p><p>「嗯。」林拓说。<\/p><p>「那四十七个都是熟人。」林拓说。<\/p><p>「熟人更该问。熟人不好意思骗你，也不好意思一直用你。问熟人，问出来的都是实话。」<\/p><p>「先别写代码。」周冉把笔放下，「下次写之前，先跟十个人聊。十个不是一百个，不难。」<\/p><p>「嗯。」<\/p><p>「你老『嗯』什么。」<\/p><p>「行。」<\/p><p>「行也别光说。」<\/p><p>周冉笑了。她笑起来没那么凶。<\/p><p>「聊什么？」林拓问。<\/p><p>「三句就够。你昨天是怎么记账的。上一次没记，是为什么。要是这个软件明天没了，你会怎么办。」她掰着手指，「第三句最要紧。答『无所谓』的，就是不会付钱的。」<\/p><p>老船长把话头接回去。「三问讲完了。晒收入。」<\/p><p>他看了看林拓。「群里每月一号发上月收入截图。今天线下，也发一遍。可以是零。不可以不发。」<\/p><p>「为什么？」小杜问。<\/p><p>「因为不发的人，会以为别人都比自己好。」<\/p><p>第一个发的是一个戴眼镜的男人，三十五六岁。他把手机放在桌子中间，屏幕朝上。上面一个数：0。<\/p><p>「第五个月，零。」他说，「做一个浏览器插件，帮人整理书签。装的人有八百多，没人付钱。我在想是不是该收费了，又怕一收费人就跑。」<\/p><p>没有人笑。有人问他八百个人从哪儿来的。他说一半是搜索引擎，一半是海外一个论坛。老船长说，那先问那八百个人，你收五块钱他们跑不跑。<\/p><p>第二个是一个女人，四十岁上下，穿得很整齐。屏幕上的数：41,270。<\/p><p>「简历模板站。第三年。」她说得很平，「前两年加起来没有这个月多。上个月有一个大学发了一篇文章，带了我的链接，来了一批人。这个月估计掉回三万。」<\/p><p>也没有人笑。有人问她怎么做的。她说没什么秘密，每一种岗位一个页面，做了四百多个页面。老船长点点头，说这个叫池塘多。<\/p><p>第三个：6,800。一个做小程序的男生，给餐馆做排队。<\/p><p>他家里就开餐馆。他说，第一个用户是他妈，第二个是隔壁面馆，都是骂着骂着用起来的。<\/p><p>第四个：1,200。做英语单词工具的。<\/p><p>是个英语老师，四十多岁，说他本来就是给自己学生做的，后来别的老师也要。<\/p><p>第五个：300。做一个天气小工具，靠广告。<\/p><p>是个大专生，在宁波，早上坐火车来的。他说三百块刚好够来回车票加茶钱。<\/p><p>第六个：0。刚上线。<\/p><p>第七个：0。上线半年，正在想要不要关。<\/p><p>老船长说：「关了也发。发『关了』两个字。」<\/p><p>小杜的朋友：2,100。<\/p><p>相册去重，靠一个付费的高级版。<\/p><p>一个一个过去。零有四个。最高的是那个四万。中间的都是几百几千。每个人说数字的时候，都像在说今天几度。没有人拍手，也没有人叹气。<\/p><p>轮到小杜。「零。还没上线。」<\/p><p>轮到林拓。「零。上线两周。四十七个下载。」<\/p><p>说完他发现自己声音很平。跟说今天几度一样。<\/p><p>「记着，」老船长说，「下个月一号，群里再发一次。」<\/p><p>他自己没发。有人问他，他说：「我的数字对新人没用。会让人以为快。」<\/p><p>坐在最里面的一个人举了一下手。三十出头，瘦，眼镜，一直没说话。<\/p><p>「有一个问题。」<\/p><p>他看着林拓。「你那个记账软件，用户的账存在哪儿？」<\/p><p>「服务器上。云同步。」<\/p><p>「你的服务器？」<\/p><p>「嗯。」<\/p><p>「那你哪天不做了，他们的账呢？」<\/p><p>林拓没答。<\/p><p>「我叫陈凯，做安全的。」那人说，「我不是说你会跑。我是说你没想过。用户把东西放你这儿，你就得想。」<\/p><p>「行。」<\/p><p>老船长把壶里的茶倒完，换了一泡。<\/p><p>「讲讲四律。新人听一遍。老人再听一遍。」<\/p><p>「第一，别造没人问过的船。」他看着林拓，「你那条船，就是没人问过。」<\/p><p>「第二，船小才能掉头。一次做一件事。做错了，扔了不心疼。」<\/p><p>他看了林拓一眼。「记账，加番茄钟，就是两条船绑在一起。绑着的船掉不了头。」<\/p><p>「第三，每天说一句话。在外面说，公开说。做了什么，几个人来了，赚了几块钱。说了才有人知道你在。」<\/p><p>「第四，离岸前先备粮。」他慢慢说，「十二个月生活费。副业月收入到工资一半，连续三个月。没到，不许辞职。」<\/p><p>他停了一下。<\/p><p>「这条最重要。我不劝人辞职。也不劝人坚持。我只劝人先备粮。」<\/p><p>「我见过没备粮就跳船的。有的游回来了。有的没有。」<\/p><p>他讲这几句的时候一点也不快，像在数一个一个的钉子。<\/p><p>小杜的朋友问：「船长，为什么叫夜航船？」<\/p><p>老船长笑了一下。他很少笑。<\/p><p>「明朝有个人叫张岱，写了一本书叫《夜航船》。以前人走水路，晚上船在河里慢慢走，一船的人睡不着，天南海北聊天。有个和尚跟一个读书人一条船。读书人一路吹牛，和尚缩着脚，不敢伸，怕挤着人家。聊到后来和尚发现，这人讲的好多都是错的。和尚说，那我伸伸脚。」<\/p><p>「我不是读书人。这个故事是别人讲给我听的。我就记住了伸脚那一句。」<\/p><p>有人笑了。<\/p><p>「夜里行船，谁也看不清前面。」老船长说，「能做的就是互相说话。说数字，说错的事。说了，别人才知道该不该伸脚。」<\/p><p>「二〇二〇年我建这个群，二百人上限，不扩。想进来的，先答三问。」<\/p><p>「那时候我刚从一个坑里爬出来。什么坑，以后再说。」<\/p><p>他不说了。没人追问。<\/p><p>三点半歇了一会儿。有人去窗边抽烟，有人续水。<\/p><p>陈凯先过来，站了两秒，只说了一句：「云同步，先关了吧。」然后就走了。<\/p><p>老船长端着杯子走到林拓旁边，站着。<\/p><p>「老家哪儿的？」<\/p><p>「江西。上饶。」<\/p><p>「家里做什么？」<\/p><p>「开五金店。」<\/p><p>老船长点点头，好像听见了一件早就知道的事。<\/p><p>「那你爸懂。」<\/p><p>「懂什么？」<\/p><p>「谁付钱。」他说，「开店的人，进一样货，先想的就是这个。你回去问问他。」<\/p><p>林拓没说话。他想起父亲的账本。<\/p><p>四点半，散场。茶位费一人六十八，桌上放一个二维码，各扫各的。<\/p><p>老船长说过，AA 是规矩。谁也不请谁，谁也不欠谁。<\/p><p>林拓扫了，转身看见老船长在门口。<\/p><p>老船长看着他。<\/p><p>「下次来，」他说，「带一个别人问过你的问题。」<\/p><p>「什么问题？」<\/p><p>「别人问你的。不是你想的。」<\/p><p>「行。」<\/p><p>「不用今天想。」<\/p><p>林拓和小杜往地铁站走。太阳低了一点，湖边人多起来。湖边有人在拍婚纱照。小杜一路在说话，说周冉太狠了，说那个四万的姐太厉害了，说他的插件也得改改。<\/p><p>「我那个插件，」小杜忽然说，「好像也没人问过。」<\/p><p>林拓没说话。<\/p><p>「还有那个备粮，」小杜说，「十二个月。拓哥你存了多少？」<\/p><p>林拓没答。他心里算了一下。十一万，两个人一个月花一万八千五。六个月。差一半。<\/p><p>林拓没说话。<\/p><p>「拓哥，你怎么了？」<\/p><p>「没事。」<\/p><p>「被说懵了？」<\/p><p>「没有。」<\/p><p>「那你想什么呢？」<\/p><p>「什么问题？」<\/p><p>「别人问我的。」<\/p><p>「谁问的？」<\/p><p>「还没想出来。」<\/p><p>「一个问题。」<\/p><p>地铁上人挤。林拓抓着扶手，看着窗玻璃上自己的脸。<\/p><p>别人问过你的问题。<\/p><p>他想。三年，在云梯，别人问他什么。<\/p><p>「线上又挂了吗？」<\/p><p>「什么时候能修好？」<\/p><p>「这个接口能不能快一点？」<\/p><p>「明天能上线吗？」<\/p><p>「你又几点回的？」<\/p><p>他一个一个想。想到最后，几乎都是同一句。线上又挂了吗。<\/p><p>没有一个人问过他，你想做什么。也没有一个人问过他，我需要一个什么东西，你能做吗。<\/p><p>那些问题都是别人的船上的问题。<\/p><p>手机震了一下。沈月：「吃了没？」<\/p><p>他打：「没。」<\/p><p>她回：「回来吃。烧了鱼。」<\/p><p>他打了一个「好」。想了想，又打了一行：「今天听人讲了一下午。」<\/p><p>她回：「讲什么？」<\/p><p>他看着这三个字，不知道怎么答。打了几个字，删了。最后打：「回来说。」<\/p><p>到家六点半。鱼在桌上，沈月在改作业。他洗了手坐下，吃了两口。<\/p><p>「怎么样？」她问。<\/p><p>「有个人问我，三个月跟几个用户聊过。」<\/p><p>「你说几个？」<\/p><p>「零。」<\/p><p>她放下红笔。「然后呢？」<\/p><p>「然后没人笑。」<\/p><p>她看了他一会儿。「那挺好的。」<\/p><p>「那个建群的人什么样？」<\/p><p>「说话慢。先问谁付钱。」<\/p><p>「问你了？」<\/p><p>「问了。答不上。」<\/p><p>她把鱼往他那边推了推。「答不上就答不上。你以前连问都没人问。」<\/p><p>「嗯。」<\/p><p>「吃鱼。」<\/p><p>吃完他洗碗。她在后面问：「下个月还去？」<\/p><p>「去。」<\/p><p>晚上十点，小杜把他拉进群。群名「夜航船」，一百九十七人。群公告很短，三问，四律，一行「新人第一次发言说第一问」。<\/p><p>公告最后一行：「每月一号发上月收入截图。可以是 0。」他算了一下，还有五天。<\/p><p>他看了一会儿群里的记录。有人在发一个页面的截图，问标题这么写行不行。有人回，太长了。有人问服务器哪家便宜。有人发了一张图，一个数字，1,900，配一句「第七个月」，底下三个人回了一个字：好。<\/p><p>他打开输入框。<\/p><p>打了「大家好」。删了。打了「新人报到」。删了。<\/p><p>他想起老船长说的，答不上来也能进，但要知道自己答不上来。<\/p><p>他打了一行，发了出去。<\/p><p>然后把手机扣在桌上，不敢看。<\/p><p>过了两分钟，老船长回了一个字。<\/p><p>「好。」<\/p><p>又过了一分钟，周冉回了一句。<\/p><p>「先跟十个人聊。」<\/p><aside class=\"log\"><div class=\"log-label\">航海日志<\/div><p>（夜航船群，第一次发言）<\/p><p>新人，林拓。<\/p><p>做后端。业余做了一个记账软件，47 个下载。<\/p><p>第一问：不知道。<\/p><p>先学。<\/p><\/aside>", "words": 4831}, {"num": 4, "title": "三百个地址", "vol": 0, "html": "<p>八月二十日，周二，晚上十一点。林拓坐在阳台上，没有写代码。他在看群。<\/p><p>沈月睡了。今天他回来得早，饭是一起吃的。<\/p><p>夜航船之后三个多星期，他没碰番茄账本。周冉说先别写代码，他就没写。老船长说带一个别人问过你的问题，他就去找。找问题的办法很笨：把手机里所有的群翻出来，一个一个看，看有没有人在抱怨什么。<\/p><p>周冉说的那件事他也做了。跟十个人聊。他没找到十个，找到了五个。表哥，两个同事，一个大学同学，沈月学校的一个老师。他一个一个问那三句。昨天怎么记的账。上次没记是为什么。软件明天没了怎么办。<\/p><p>表哥说，我不记账，下了是给你捧场。同事说，记过两天，忘了。大学同学说，我用信用卡账单，不用记。那个老师说，我用本子。<\/p><p>第三句，五个人都是一个答案：无所谓。<\/p><p>他把五个「无所谓」写在文档里，看了一晚上。然后他把番茄账本从商店下架了。没有发朋友圈。沈月问他，他说，没人要的东西，放着也是放着。<\/p><p>他的群不多。公司的，同学的，一个跑步群从来没跑过。还有几个二〇二一年留下来的群。那年他跟风买过一点币，赔了两千，钱不要了，群没退。<\/p><p>他的钱包里还剩几十块钱的币，三年没动过。<\/p><p>其中一个群是一个链上项目的社区。项目做什么他早忘了，群里六百多人，每天都在聊天。他平时屏蔽着。今晚他点进去，往上翻。<\/p><p>翻到十点四十的一条。发的人叫大鹏，头像是一只戴墨镜的企鹅。<\/p><p>「又要发空投了。三百个地址。我手点了两个小时，还剩一百多。眼睛都花了。」<\/p><p>底下有人回：「辛苦鹏哥。」<\/p><p>大鹏又发：「上次点错一个，多打了一个零。那哥们一晚上多拿了两千，我自己赔的。」<\/p><p>「今晚点完估计一点。谁有好办法？」<\/p><p>没人回。过了一会儿有人发了一个表情。<\/p><p>林拓把这几条来回看了三遍。<\/p><p>空投是什么，他大概知道。就是项目方给用户白送一点代币，像新店开张发优惠券。代币是链上的一种记账单位，像游戏厅的游戏币。只不过这个游戏币记在一个所有人都能看的公共账本上。谁有多少，一笔一笔都在。地址就是每个人在这个账本上的账号，一长串字母和数字，像一个收钱的门牌号。<\/p><p>给三百个地址发代币，就是给三百个人分别汇款。每一笔汇款都要签一次字。签字用的是一把私钥，就是一个只有你自己有的印章。签一笔，盖一次章。三百笔，盖三百次。<\/p><p>手点两个小时，就是这么来的。<\/p><p>他点开大鹏的头像，私聊。<\/p><p>「鹏哥，我会写代码。我帮你写个脚本，你把地址和数量做成一张表，脚本自动发。」<\/p><p>发出去他就有点后悔。他跟这个人一句话没说过。<\/p><p>一分钟后，大鹏回了。<\/p><p>「真的？」<\/p><p>「嗯。」<\/p><p>「多久？」<\/p><p>「今晚。」<\/p><p>「兄弟你叫什么？」<\/p><p>「林拓。」<\/p><p>「拓哥，我等你。」<\/p><p>拓哥这两个字让他有点不好意思。小杜也这么叫，可小杜是同事。这是一个没见过面的人。<\/p><p>林拓关掉聊天窗口，打开电脑。<\/p><p>他先问了大鹏几个问题。哪条链。发什么币。表长什么样。大鹏发来一张截图，一个表格，两列，左边地址，右边数量，三百行。大鹏说他就是照着这个表，一行一行复制到钱包里，粘贴，输数，确认，再下一行。<\/p><p>「每一行都要确认一次？」<\/p><p>「对。点三下。三百行，九百下。」<\/p><p>「点错过几次？」<\/p><p>「三次。一次多打零，一次地址少复制了一位，发不出去还好。一次发重了。」<\/p><p>「发错了能撤回吗？」<\/p><p>「链上没有撤回。发出去就是发出去。」<\/p><p>林拓记下这几句。他觉得这几句比代码重要。<\/p><p>脚本不难写。读表，一行一行，签名，发出去，等确认，记下结果，下一行。他让 AI 助手写了大半，自己改了一小时。<\/p><p>每一笔发出去，还要等链上确认，像寄信要等邮局盖戳。每一笔都要付一点手续费，就是邮费。三百笔，三百份邮费。他想，能不能一次寄三百封。这个先不管。<\/p><p>改的主要是两件事。<\/p><p>第一件，发之前先把表检查一遍。地址长度对不对，数量是不是数字，有没有重复的地址。有问题先停下来，不发。<\/p><p>第二件，发之前把总数算出来，打印在屏幕上。三百个地址，一共发多少。让大鹏看一眼再按回车。<\/p><p>这两件事 AI 助手都没主动做。他说要，它才做。它不知道大鹏赔过两千。<\/p><p>写到这一步，他停了一下。<\/p><p>他想起茶馆里那个瘦子，陈凯。有一个问题。用户的东西放你这儿，你就得想。<\/p><p>这个脚本要签名，签名要私钥。私钥就是大鹏的印章。如果大鹏把印章发给他，他就能动大鹏所有的钱。<\/p><p>他在脚本里加了一段说明，写得很白。私钥放在你自己电脑上的一个文件里。脚本在你电脑上跑，不发给任何人，包括我。跑完删掉那个文件。<\/p><p>他又给大鹏发了一句：「钥匙别发给我。任何人要你的私钥都别给。」<\/p><p>大鹏回：「懂。」<\/p><p>凌晨一点二十，他把脚本发过去。附了一个安装说明，五步。<\/p><p>一点三十五，大鹏：「停了。说第 214 行有问题。」<\/p><p>林拓让他看那一行。地址后面多了一个空格。表格里看不出来，复制进钱包就会说地址不对。<\/p><p>「就是这行，」大鹏说，「上次点错的就是这行。我还以为是我手抖。」<\/p><p>「删掉空格，重跑。」<\/p><p>一点四十，大鹏：「跑起来了。」<\/p><p>一点四十五，大鹏发了一张截图。屏幕上一行一行往下走，每一行一个地址，一个数，一个对勾。<\/p><p>一点五十二，大鹏：「发完了。三百个。十分钟。」<\/p><p>「一个都没错？」<\/p><p>「对了两遍。没错。」<\/p><p>林拓看着那张截图。三百个对勾。<\/p><p>他没说话，也没什么可说的。他把电脑合上一半，又打开。<\/p><p>他把那张三百个对勾的截图存下来，放进「自己的东西」文件夹里。里面原来只有一个番茄账本的目录。现在多了一张图。<\/p><p>两点零五，手机响了一下。转账通知。二百元。<\/p><p>大鹏：「请你喝咖啡。别嫌少。」<\/p><p>林拓盯着那个数字。<\/p><p>二百。<\/p><p>这不是他第一次收到别人转的钱。同事转过饭钱，同学转过份子钱，母亲转过生活费。可这二百块不一样。这是有一个人，因为他做的一个东西，主动给的。不是还钱，不是人情，是付钱。<\/p><p>他做了六年后端。六年的工资加起来一百多万。没有一分钱是这样来的。<\/p><p>他回了一句：「谢谢鹏哥。」<\/p><p>他打开记账软件，记了一笔收入：二百。分类那一栏他翻了一遍，没有合适的。他新建了一个，打了四个字：自己的东西。<\/p><p>大鹏：「以后还有这种活找你。我们这行天天发。」<\/p><p>林拓打了一行：「你们这行都是手点吗？」<\/p><p>「多数是。有的用表格软件拼命令，有的找程序员朋友，程序员朋友一般帮一次就不耐烦了。有几个网站能批量发，要么收费贵，要么不知道靠不靠谱，我不敢把钱放上去。」<\/p><p>「靠谱是什么意思？」<\/p><p>「就是它会不会碰我的钥匙。」<\/p><p>林拓把这句话记下来了。<\/p><p>「你们这样发币的人多吗？」<\/p><p>「我认识的运营群，三百多号人。每个月都有活。」<\/p><p>他把这个数也记下来了。<\/p><p>沈月早上六点半起床，看见他还坐在阳台上。<\/p><p>「又一晚上？」<\/p><p>「嗯。」<\/p><p>「做什么？」<\/p><p>「帮一个人发了三百笔钱。」<\/p><p>她没听懂。「什么钱？」<\/p><p>「他的钱。链上的。」<\/p><p>「然后呢？」<\/p><p>「他给了我二百块。」<\/p><p>她站住了。「给你的？」<\/p><p>「嗯。」<\/p><p>「他为什么给你？」<\/p><p>「因为省了他两个小时。」<\/p><p>沈月看了他一会儿。他的眼睛红的，但跟七月那次不一样。她说不上哪里不一样。<\/p><p>后来她想明白了。七月那次他在看屏幕。这次他在看她。<\/p><p>「这钱你收了？」<\/p><p>「收了。」<\/p><p>「那你去洗碗吧。」她说，「昨晚的碗还泡着。」<\/p><p>他去洗碗。水凉的。他洗得很慢，一个碗一个碗，洗完一个放一个。她站在厨房门口看他，看了一会儿，去换衣服上班了。<\/p><p>那天他在公司改了一天代码，脑子里都是那三百个对勾。<\/p><p>中午小杜问他昨晚干嘛了，眼睛又红。<\/p><p>「帮人发了三百笔钱。」<\/p><p>「什么钱？」<\/p><p>「链上的。写了个脚本。」<\/p><p>「然后呢？」<\/p><p>「他给了我二百。」<\/p><p>小杜看着他。「拓哥，你笑了。」<\/p><p>「没有。」<\/p><p>「你笑了。」<\/p><p>他低头吃饭。<\/p><p>晚上他回到阳台，打开夜航船的群公告。三问。<\/p><p>他一个一个问自己。<\/p><p>谁会为它付钱。<\/p><p>大鹏这样的人。做运营的，在项目方，天天要给一堆地址发币。他昨天就付了二百。这不是他猜的，是真的。<\/p><p>他们今天在哪儿，正在用什么凑合。<\/p><p>在这种社区群里。用手点，两个小时。用表格软件拼命令。找程序员朋友，帮一次就散了。有几个网站，贵，或者不敢用。<\/p><p>你凭什么比他们现在的办法好。<\/p><p>十分钟对两个小时。不会点错。不碰钥匙。<\/p><p>他把三个答案写在文档里。写完了看了一遍。<\/p><p>三问，都能答。<\/p><p>他又问了一遍。谁付钱。大鹏。还有呢。大鹏的朋友，做运营的。还有呢。他不知道。三百多个运营，他认识一个。<\/p><p>三个月前，番茄账本，一个都答不上。现在这个东西还不存在，只是一个脚本，可三个问题一个不落。<\/p><p>他不知道该高兴还是该害怕。他觉得可能是害怕。答得上，就意味着要做了。<\/p><p>老船长说过，用户不等人，用户在凑合。大鹏凑合了一年多。他没等林拓。他只是刚好在群里说了一句。<\/p><p>周四晚上，大鹏又找他。另一个项目也要发，五百个地址。林拓把脚本改了改，发过去。半小时发完。大鹏没转钱，发了一句「下次请你吃饭」。林拓说不用。<\/p><p>周五，大鹏拉他进了一个小群，四个人，都是做社区运营的。群名叫「发币互助」。第一句话是：「这是我说的那个拓哥，脚本神了。」<\/p><p>有人问：「拓哥，能做成网页吗？我不会跑脚本。」<\/p><p>另一个人：「做成网页我肯定用。收费也行，比我手点便宜就行。」<\/p><p>第三个人：「别碰我钥匙就行。」<\/p><p>大鹏：「拓哥不碰。他脚本都让我把钥匙留自己电脑上。」<\/p><p>林拓一句都没回。他把这几句话一条一条复制到文档里。<\/p><p>他数了一下。四个人，五句话，三句提到钥匙。<\/p><p>林拓看着这句话。<\/p><p>他把那句「能做成网页吗」截了图，发到夜航船群里。<\/p><p>「船长，带来了一个别人问我的问题。」<\/p><p>老船长过了半小时回：「谁付钱？」<\/p><p>「他们。已经付了二百。」<\/p><p>老船长：「好。」<\/p><p>周冉：「你跟他聊了吗？」<\/p><p>「聊了。两个小时。他们现在怎么发，错过几次，怕什么。」<\/p><p>周冉：「行。先做一件事。」<\/p><p>陈凯：「有一个问题。网页碰不碰钥匙？」<\/p><p>「不碰。」<\/p><p>「好。」<\/p><p>周六下午，他给父亲打了电话。<\/p><p>他很少给父亲打电话。一般是母亲打来，说几句，把手机递给父亲，父亲说两句，再递回去。这次他主动打，父亲那边响了很久才接。<\/p><p>「崽。」<\/p><p>「爸。」<\/p><p>「吃了没？」<\/p><p>「吃了。」<\/p><p>「有事？」<\/p><p>「没事。问你个事。」<\/p><p>背景里有人说话，是母亲，在跟客人讲价。再远一点，有东西碰在铁皮上的声音。<\/p><p>「店里进货，」林拓说，「你怎么知道该进什么？」<\/p><p>背景里有电钻的声音，停了。父亲没马上答。他好像在做别的事。过了一会儿说：「有人问过的才进。」<\/p><p>「问过的？」<\/p><p>「来店里问过，没有的。问一回记一回。问三回，进。」<\/p><p>「没人问过的呢？」<\/p><p>「不进。压着。」<\/p><p>「压着的货，钱就死在那儿。」<\/p><p>电话那头，母亲在喊什么。父亲说等下。然后是一个声音，很脆，不响，林拓隔着电话都听得清。<\/p><p>咔哒。<\/p><p>工具箱的盖子。父亲修完了什么东西，把工具收回去了。<\/p><p>「还有事？」父亲问。<\/p><p>「没了。」<\/p><p>「钱够用不？」<\/p><p>「够。」<\/p><p>「行。」<\/p><p>挂之前母亲抢过手机说了两句。「崽，沈月呢？」「上班。」「过年带回来。」「嗯。」<\/p><p>电话挂了。林拓坐在阳台上，手机还贴在耳朵边。<\/p><p>咔哒。<\/p><p>他把手机放下，在文档最上面打了两个字：咔哒。<\/p><p>他早就想打这两个字了。三月十四号那天晚上他就想打。那时候他不知道要做什么，打了也是空的。现在他知道了。<\/p><p>他在「自己的东西」文件夹里新建了一个目录，也叫咔哒。番茄账本的目录还在旁边。他没删。留着看。<\/p><p>他往下写。<\/p><p>网页。不用装，不用跑脚本，打开就用。<\/p><p>只做一件事：批量转账。传一张表，看一眼总数，签字，发出去。<\/p><p>不做别的。不做钱包，不做查询，不做别的链。老船长说船小才能掉头。一件事做顺手了，再说下一件。<\/p><p>两周。<\/p><p>他算了一下时间。每天晚上十点到两点，四个小时。周末多一点。十四天，六十来个小时。<\/p><p>他写完两周，停住了。番茄账本做了三个月。三个月，功能加了一屏又一屏，四十七个人下载。这次两周，一个功能。他不知道两周够不够。他只知道不能再三个月了。<\/p><p>沈月在屋里问他晚上吃什么。他说随便。她说那就面。<\/p><p>他把文档拿给她看。她看了最上面两个字。<\/p><p>「咔哒？」<\/p><p>「工具箱盖子的声音。我爸那个。」<\/p><p>「哦。」她想了想，「比番茄账本好。」<\/p><p>「好在哪？」<\/p><p>「番茄账本一听就是给你自己用的。这个不是。」<\/p><p>面端上来了。他吃面，她坐在对面看他吃。<\/p><p>「两周以后，」她说，「我要看。」<\/p><p>「嗯。」<\/p><p>「不是看代码。是看有没有人用。」<\/p><p>「行。」<\/p><p>他打开日历。八月二十四日，今天，周六。往后数十四天。九月七日，周六。<\/p><p>他在那一天上画了一个圈。<\/p><p>圈画得不圆。他没改。<\/p><aside class=\"log\"><div class=\"log-label\">航海日志<\/div><p>8 月 24 日。<\/p><p>有人为一段脚本付了 200 块。<\/p><p>他们现在的办法：手点两小时，点错自己赔。<\/p><p>我要把它做成一个网页。只做批量转账一件事。<\/p><p>两周。9 月 7 日。<\/p><\/aside>", "words": 4822}, {"num": 5, "title": "两周", "vol": 0, "html": "<p>2024 年 8 月 24 日，晚上十点。杭州滨江，出租屋的阳台。<\/p><p>林拓把日历翻到 9 月，用红笔在 7 号上画了一个圈。圈画得不圆。他又描了一遍。<\/p><p>阳台上只有一张小桌子。桌上一台笔记本，一杯凉了的茶，一把旧螺丝刀。螺丝刀是父亲给的，木柄，柄上有一道裂。他写代码的时候用不上它，但它一直在那儿。<\/p><p>客厅里沈月在改作业。红笔划过纸的声音，隔着玻璃门能听见。<\/p><p>两周。他在便利贴上写了这两个字，贴在屏幕边上。<\/p><p>第一个晚上他没写代码。他先写了一张清单。<\/p><p>大鹏那天说过的话，他一句一句记下来。三百个地址。手点两个小时。点错一个就完了。表格是运营自己拉的。发完还要一个个对账。<\/p><p>然后他在清单下面写功能。批量转账。地址簿。定时发送。发送记录。多链切换。团队账号。<\/p><p>写到第六条，他停了。<\/p><p>他想起茶馆里老船长说的第二条：船小才能掉头。<\/p><p>他把后面五条全划掉了。划得很重，纸破了一点。只剩下一行：批量转账。<\/p><p>「就做这一件事。」他对自己说。<\/p><p>十二点，沈月推开阳台门。<\/p><p>「几点睡？」<\/p><p>「两点。」<\/p><p>「每天？」<\/p><p>「两周。」<\/p><p>她看了一眼屏幕，看了一眼便利贴，什么也没说，把门带上了。<\/p><p>第二个晚上，他遇到第一个真正的问题。<\/p><p>脚本是给大鹏一个人用的。大鹏把自己的私钥填在脚本的配置文件里，脚本在大鹏自己的电脑上跑。私钥是什么，林拓在群里给大鹏解释过：就是你保险箱的钥匙，只有一把，谁拿到谁就能开箱。<\/p><p>现在要做成网页。网页是开在别人家的门面。用户来了，把钥匙交给你的网页，你替他开箱。<\/p><p>他盯着这个流程看了半小时，越看越冷。<\/p><p>一个陌生人凭什么把钥匙给他。他凭什么拿。哪天网站被人黑了，丢的不是他的钱，是所有用户的钱。他想起大鹏群里那些人，一个运营手里管的是整个项目要发出去的币。<\/p><p>他把这一页删了。<\/p><p>新的流程是：钥匙不离开用户。用户的浏览器里装着自己的钱包插件，像一个随身的印章盒。网页只负责把三百笔转账整理好，摆在用户面前。要不要盖章，用户自己在自己的印章盒里决定。网站从头到尾看不到那把钥匙。<\/p><p>这样做有一个代价。用户必须先装插件，多一步。他想了想，多一步就多一步。<\/p><p>他在便利贴下面又贴了一张，写了一句话：<\/p><p>我们只是一把扳手，钱一直在你自己口袋里。<\/p><p>写完他觉得这句话可以放在网站首页。<\/p><p>第三个问题是钱。<\/p><p>链上转一笔要交一次过路费。三百笔就是三百次过路费，还要签三百次字。大鹏说的两个小时，一半时间是在等每一笔过路。<\/p><p>解决的办法是合约。合约就是链上一段写死的规矩，贴在墙上，谁都能看，谁都改不了。他写一份合约，规矩只有一条：收到一张清单，就按清单把钱分发出去。用户把三百笔打包成一个包裹，交给合约，签一次字，付一次过路费。<\/p><p>像去邮局寄三百封信，以前要排三百次队。现在把三百封信装进一个箱子，排一次。<\/p><p>AI 助手帮他把合约的骨架写出来了。几分钟。他花了一个晚上读那几十行代码，一行一行读，读到能背。他不放心的不是 AI，是自己。这份合约以后要管别人的钱，他必须知道每一行在干什么。<\/p><p>然后他把合约发到测试网上跑。测试网像驾校的练习场，车是真的，路是假的，撞了不花钱。他自己给自己发了三百笔，发了十几遍。<\/p><p>第三遍的时候他发现一个问题。清单里有三百个地址，他故意只给了二百九十九个金额。合约没有拦，最后一个地址收到了零。AI 写的骨架没有检查两列数目是不是一样。他补了一行：数目不对，整单不发。补完他在便利贴上记了一句：AI 写得快，坑要自己填。<\/p><p>到第五天，主流程通了。他在测试网上给三百个地址发钱，一次签字，四十秒。<\/p><p>他有点想笑，没笑。他去厨房把沈月晚上的碗洗了。<\/p><p>洗到一半，他想起大鹏说的另一半话：点错一个就完了。<\/p><p>主流程只用了五天。剩下的九天，他全花在「别让用户点错」上。<\/p><p>他列了一张单子，写用户可能会怎么错。<\/p><p>地址少一位。地址多一位。粘贴的时候把两行粘成了一行。金额多打一个零。同一个地址出现了两次。表格里混进了一行标题。小数点用成了逗号。<\/p><p>每一条他都要在页面上拦住。<\/p><p>地址像银行卡号，里面藏着一位校验位，可以查出来抄错了没有。他给每一行地址做校验，错的那行标红，红字后面写清楚是哪一位不对。<\/p><p>金额他不只显示每一笔，还在页面最下面算一个总数，字号比标题还大。三百笔小钱加起来是多少，用户签字之前必须看见这个数。<\/p><p>重复的地址，页面自动标黄，问一句：这两行是一样的，你确定要发两次吗？<\/p><p>然后是最后一步。他做了一个确认页。上面只有三行：多少个地址，一共多少钱，一句话「这一步之后不能撤回」。确认的按钮不放在默认位置，用户要自己伸手去点。<\/p><p>他做完这些，让沈月来试。<\/p><p>沈月坐在阳台上，往页面里贴他准备好的地址表。他在旁边看。她故意把一行地址删掉一个字。页面立刻标红。她把金额改成一万。总数跳了一下，变成一个很大的数。她停了停。<\/p><p>「这个红字太小了。」她说，「我妈看不见。」<\/p><p>他把红字放大了两号。<\/p><p>「还有。」她指着确认页，「这句『不能撤回』，你放在最下面。人看不到最下面的。」<\/p><p>他把那句话挪到了最上面。<\/p><p>她试了二十分钟，找出七个问题。第七个是：她粘贴完表格，不知道下一步该点哪儿。<\/p><p>「你自己用得顺手，是因为是你做的。」她说。<\/p><p>他没说话，把「下一步」的按钮改成了蓝色，放大了一倍。<\/p><p>夜里一点。沈月端了一碗面出来，面上卧着一个荷包蛋。她把面放在桌角，自己搬了张小凳子坐在旁边，膝盖上摊着一摞作业本。<\/p><p>他吃面。她改作业。<\/p><p>作文题是《我的爸爸》。她一边看一边笑。<\/p><p>「这个孩子写，他爸爸修车，手上全是黑的，洗不掉，他不好意思跟同学说。最后一句是：可是我爸爸修的车都能开。」<\/p><p>林拓吃面的手停了一下。<\/p><p>「两周够吗？」她问。<\/p><p>「不知道。」<\/p><p>「不够呢？」<\/p><p>「就三周。」<\/p><p>她笑了一下：「你终于会说不够了。」<\/p><p>他低头把面吃完，把碗端进厨房。<\/p><p>网站要有一个名字，还要有一个门牌号。<\/p><p>他在注册网站上试了「kada」。后缀 .com 早被人占了，挂着要价几万。他往下翻，看到 .tools。一年一百二十八块。没被占。<\/p><p>kada.tools。咔哒工具箱。<\/p><p>他叫沈月看。<\/p><p>「名字哪来的？」<\/p><p>「我爸店里的工具箱。盖子合上是这个声。」<\/p><p>她念了一遍：「咔哒。好记。像开关。」<\/p><p>8 月 27 日凌晨一点，他付了一百二十八块。然后他打开记账的表格，在新的一行写下：域名，128，一年。这是「自己的东西」这一栏的第一笔支出。前面那一栏是番茄账本，一共花了三百多，收入是零。<\/p><p>白天他还是云梯科技的后端。<\/p><p>方哲那阵子不太催，线上也没出事。小杜中午吃饭时问他最近怎么老打哈欠。<\/p><p>「在做个东西。」<\/p><p>「什么东西？」<\/p><p>「一个网页。」<\/p><p>小杜等他往下说。他没往下说。小杜也就不问了。<\/p><p>有一次方哲从工位后面走过，停了一下，看他屏幕。屏幕上是公司的订单服务。方哲说：「最近状态不错。」就走了。林拓的手心出了一层汗。他什么都没做错，但他还是把阳台上那台笔记本的密码改长了。<\/p><p>他不在公司电脑上碰这些。手机上也不看。地铁上他睡觉，一坐下就睡，到站前一站醒。<\/p><p>9 月 6 日，周五。晚上他把所有东西过了最后一遍。合约在主网上部署了，花了一百多块过路费，他记在账上。首页只有一句话和一个按钮。那句话是：我们只是一把扳手，钱一直在你自己口袋里。<\/p><p>两点，他把便利贴上的「两周」撕下来，扔进垃圾桶。<\/p><p>9 月 7 日，周六，早上九点。<\/p><p>他打开访客统计。访客 3。<\/p><p>一个是他的电脑。一个是他的手机。一个是他用沈月的手机点开的。<\/p><p>他在那个页面刷了一上午。数字没动。沈月出门买菜，回来看他还在刷，说：「你再刷也是三个。」<\/p><p>中午他把链接发到夜航船群里。<\/p><p>「咔哒工具箱上线了。只做一件事：批量转账。地址：kada.tools」<\/p><p>群里安静了一个小时。他把手机翻过去扣在桌上，又翻回来。<\/p><p>一点半，老船长回了一个字。<\/p><p>「好。」<\/p><p>他看着这个字，看了很久。<\/p><p>周冉紧接着回了一句：「第一个用户是谁？」<\/p><p>「大鹏。」<\/p><p>「那你还看群干什么。」<\/p><p>他把链接发给了大鹏。<\/p><p>大鹏晚上十点才回，一条六十秒的语音。背景是酒桌的声音。他说他明天有一批要发，三百八十个地址，正好试试。<\/p><p>第二天下午三点，大鹏发来一张截图。三百八十笔，一次签字，八分钟。<\/p><p>「兄弟牛的。」大鹏说，「我发我们运营群了。」<\/p><p>林拓问他发了什么。大鹏把截图转过来。他在一个五百人的群里写的是：一个哥们做的，不碰私钥，粘表格就能发，谁要发空投用这个。<\/p><p>那天晚上访客 41。<\/p><p>大鹏又发来一条：能不能加个定时，到点自动发。还有，发完能不能导出一张表。<\/p><p>「先不做。」林拓回。<\/p><p>「行。」大鹏说，「你这个不出错就行。」<\/p><p>他把这两个需求记在清单最下面，没划掉，也没动。<\/p><p>第一周结束，9 月 14 日。他先记账。服务器一个月四十块，域名一百二十八，部署合约一百零六。支出一栏合计二百七十四。收入一栏他写了一个零，想了想，在旁边注了一行小字：大鹏的两百算脚本，不算网页。<\/p><p>然后他把用过合约的地址拉出来数。<\/p><p>12 个。<\/p><p>他一个一个看。大鹏。大鹏群里的几个人，地址在那个群里出现过。有两个是夜航船的人，试着发了一笔一块钱。<\/p><p>第 12 个他不认识。发了 60 笔。<\/p><p>他把那个地址复制下来，在区块浏览器上查。区块浏览器是链上的公开账本，谁都能翻。那个地址一年前就有了，转过很多次账，和他知道的任何人都没有关系。<\/p><p>一个不认识的人，用了他做的东西。<\/p><p>他想说声谢谢，不知道跟谁说。<\/p><p>沈月睡前问他：「十二个，值吗？」<\/p><p>「值。」<\/p><p>「为什么？」<\/p><p>「有一个不认识。」<\/p><p>她想了想，说：「番茄账本四十七个，全认识。」然后关了灯。<\/p><p>第二周的周三，9 月 18 日，凌晨。<\/p><p>他照例看统计，看到一笔大的。一个地址，一次发了 400 笔。总额是他这辈子没经手过的数。签名一次，过路费不到手点的十分之一。<\/p><p>他把那笔交易在区块浏览器上翻来覆去看了半小时。看合约怎么接收清单，怎么一笔一笔分出去，四百笔全部成功。<\/p><p>那个地址他也不认识。<\/p><p>他忽然有点怕。怕的不是这个人，是这个数。如果他的确认页上少拦了一种错，这个人今晚会出事。<\/p><p>他起来把「别让用户点错」那张单子又过了一遍。又加了一条：总额超过一定数目，确认页多停三秒钟才能点。<\/p><p>9 月 28 日是这个月最后一个周六。他去了西湖边的茶馆。<\/p><p>这次他带了一个别人问过他的问题。大鹏问的：发完能不能导出记录。他说了这个问题，老船长点头，没接话，倒茶。<\/p><p>「上线三周。」老船长说，「几个用户？」<\/p><p>「二十几个。」<\/p><p>「谁付钱？」<\/p><p>「大鹏付过两百。是脚本那次。」<\/p><p>「网页呢？」<\/p><p>「免费。」<\/p><p>老船长喝了一口茶。<\/p><p>「打算收吗？」<\/p><p>「想收千分之一。」<\/p><p>「那就收。」老船长把杯子放下，「现在收，他们会觉得这就是价格。等用户多了再收，他们会觉得你变了。」<\/p><p>周冉在旁边翻手机：「那个发四百笔的人，你跟他聊过吗？」<\/p><p>「不知道是谁。」<\/p><p>「页面上有联系方式吗？」<\/p><p>「没有。」<\/p><p>「那你等谁来找你。」<\/p><p>回去那晚，他做了两件事。<\/p><p>第一件，页面底部加了一行：有问题写信给我。后面是一个邮箱。<\/p><p>第二件，他改了合约。每一笔打包转账，合约收千分之一作手续费，进他自己的地址。他把这一行写在确认页上，字号和总额一样大。手续费 0.1%。他不想让任何人签完字才发现。<\/p><p>9 月 30 日改完，凌晨两点上线。<\/p><p>接下来两天，访客还在，用的人少了。10 月 1 日，零笔。10 月 2 日，零笔。<\/p><p>他在阳台上坐着，没开电脑。沈月放假，早早睡了。<\/p><p>他想，老船长说的也可能不对。<\/p><p>他打开确认页，光标停在那行手续费上。删掉只要几秒钟。<\/p><p>沈月起夜，看见他坐在黑里。<\/p><p>「怎么了？」<\/p><p>「两天没人用。」<\/p><p>「收费之前呢？」<\/p><p>「一天两三个。」<\/p><p>「才两天。」她说，「你番茄账本等了三个月。」<\/p><p>他没删。把电脑合上了。<\/p><p>10 月 3 日，凌晨一点四十。<\/p><p>手机在桌上震了一下。是他给自己设的合约提醒。<\/p><p>合约地址收到一笔转入。19 个多稳定币。稳定币是链上的美元，一块钱永远是一块钱。他按当天的汇率换算了一下。<\/p><p>一百三十七块。<\/p><p>他把手机拿起来，又放下。又拿起来。<\/p><p>屏幕上是一串陌生的地址，一个数字，一个时间。凌晨一点三十九分。有一个他不认识的人，在深夜把十三万多块钱交给他做的东西发了出去，然后留下了一百三十七块。<\/p><p>他没有叫醒沈月。他坐在阳台上，看着那个数字，一直坐到天亮。<\/p><aside class=\"log\"><div class=\"log-label\">航海日志<\/div><p>「9 月 7 日。咔哒工具箱上线。只做一件事：批量转账。访客 3，全是我。」<\/p><p>「9 月 14 日。第一周 12 个用户。有一个我不认识。他发了 60 笔。」<\/p><p>「9 月 30 日。开始收手续费，千分之一。写在确认页上，和总额一样大。用的人少了。先记着。」<\/p><\/aside>", "words": 4836}, {"num": 6, "title": "一百三十七块", "vol": 0, "html": "<p>2024 年 10 月 3 日，早上七点。滨江的出租屋。<\/p><p>林拓在阳台上坐了一夜。天亮的时候他站起来，腿是麻的。他走到卧室门口，沈月正好醒。<\/p><p>他把手机递过去。屏幕上是一张截图：一串地址，一个数字，一个时间。<\/p><p>沈月看了三秒钟。<\/p><p>「多少？」<\/p><p>「一百三十七。」<\/p><p>她把手机还给他，翻了个身，又翻回来。<\/p><p>「够一顿火锅。」<\/p><p>「嗯。」<\/p><p>「那今晚去吃。」<\/p><p>「嗯。」<\/p><p>「你睡了吗？」<\/p><p>「没。」<\/p><p>「去睡。」<\/p><p>他躺下，睡到中午。醒来的时候手机在枕头边，他先看了一眼合约后台，再看时间。<\/p><p>国庆假期，火锅店门口排队。他们拿了号，六十七桌。沈月靠在墙上看小说，他看手机。合约地址没有新的转入。他每隔几分钟看一次。<\/p><p>「你再看它也不会变成两百七十四。」沈月说。<\/p><p>他把手机收起来。<\/p><p>「那个人是谁？」她问。<\/p><p>「不知道。」<\/p><p>「你不知道他是谁，他也不知道你是谁。」<\/p><p>「嗯。」<\/p><p>「那他为什么信你？」<\/p><p>他想了一会儿。<\/p><p>「他不用信我。钱不经过我。」<\/p><p>沈月点点头，回去看小说。过了一会儿她说：「这句话你应该写在网站上。」<\/p><p>「写了。」<\/p><p>锅上来了。她夹了一筷子毛肚，问：「你爸知道吗？」<\/p><p>「没说。」<\/p><p>「什么时候说？」<\/p><p>「有一万再说。」<\/p><p>「一百三十七到一万，要多久？」<\/p><p>「不知道。」<\/p><p>「那你先吃。」她把毛肚放进他碗里。<\/p><p>火锅吃了一百六十二块。他回家记账的时候，把一百三十七写在收入那一栏，一百六十二写在生活那一栏。两笔并排。他看了很久，觉得这样挺好。<\/p><p>第二天他想在群里说这件事。<\/p><p>他打了一段字。三百多个字。从 8 月 24 日大鹏的三百个地址讲起。讲两周，讲不碰私钥，讲手续费的犹豫，讲那两天零笔。最后讲到一百三十七。<\/p><p>他读了两遍，发了。<\/p><p>群里安静。半小时后，周冉私聊他。<\/p><p>「你那条我读到一半就划走了。」<\/p><p>「哦。」<\/p><p>「不是内容不好。是太长。三百字，第一行是 8 月 24 日。谁管你 8 月 24 日。」<\/p><p>他没接话。<\/p><p>「你重新发。」她说，「我教你一个格式。三样东西：一个数字，一件事，一个教训。数字放第一行。人只看第一行。」<\/p><p>「就这些？」<\/p><p>「就这些。多了没人看。」<\/p><p>「为什么数字放第一行？」<\/p><p>「因为数字是别人能核对的。你说你很努力，没人能核对。你说一百三十七，谁都知道是多少。」<\/p><p>「感想呢？」<\/p><p>「不写感想。写你做了什么。感想是你自己的，做了什么是别人能用的。」<\/p><p>他把那三百字删了，重新打。<\/p><p>第一行：第一笔手续费，137 块。<\/p><p>第二行：从上线到今天，26 天。<\/p><p>第三行：改成收费之后两天零笔，第三天来了这一笔。<\/p><p>他犹豫要不要写第四行。周冉又发来一句。<\/p><p>「还有两条。」<\/p><p>「嗯。」<\/p><p>「失败也发。发失败的人少，所以有人看。你那两天零笔，就是失败，写进去。」<\/p><p>「写了。」<\/p><p>「第二条，截图不 P。」<\/p><p>「我没 P 过。」<\/p><p>「我是说以后。」周冉说，「P 图不是道德问题，是麻烦问题。P 过一次，以后每一张都得 P，你自己会记不住哪张是真的。」<\/p><p>他把合约后台的截图附上，没裁。截图上能看到他自己的地址后四位，还有服务器的时间。<\/p><p>「发吧。」周冉说，「顺便，你跟几个用户聊过？」<\/p><p>「一个。大鹏。」<\/p><p>「付一百三十七那个呢？」<\/p><p>「不知道是谁。」<\/p><p>「邮箱有人写信吗？」<\/p><p>「没有。」<\/p><p>「那你就继续发。有一天会有人写。」<\/p><p>他发了。群里，还有「圈子」上。圈子是他平时刷的那个地方，看别人晒收入的地方。这是他第一次在上面发自己的。<\/p><p>发完他把手机放下，去洗碗。碗早就洗过了。他又擦了一遍灶台。<\/p><p>晚上十一点，他看了一眼。二十个赞。三条评论。<\/p><p>第一条：怎么让第一个人付钱的？<\/p><p>第二条：不碰私钥是怎么做的，用户不会怕吗？<\/p><p>第三条：我也做了一个工具，上线三个月没人用，能不能看看。<\/p><p>他一条一条回。回第三条的时候，他点进对方的主页看了看。一个大学生，做了一个课程表工具，界面很好看。他想说什么，想了半天，回了一句：你跟几个用户聊过？<\/p><p>发出去他自己愣了一下。这是周冉的话。<\/p><p>那个大学生第二天回他：两个，都是室友。<\/p><p>他回：去找第三个。不是室友的。<\/p><p>大鹏也在底下留了一句：这个我用了，真的不碰私钥，我们群里现在都用这个。二十个赞里有八个是大鹏留言之后来的。<\/p><p>还有一条他没回。那条只有三个字：假的吧。<\/p><p>他把这条截图发给周冉。周冉回：「有人骂假的，说明有人看。半年前你看别人的截图，底下也有人骂。」<\/p><p>他想起 3 月 14 日那个凌晨。是有人骂。他当时也没信。<\/p><p>10 月 8 日，假期结束，上班第一天。<\/p><p>方哲把他和小杜叫进小会议室。一个新客户，对接系统要在月底前上线。两周。<\/p><p>「这两周晚上都要留一下。」方哲说，「九点半之前别走。我也在。」<\/p><p>「行。」林拓说。<\/p><p>小杜在旁边叹了一口气。方哲看了他一眼。<\/p><p>「明年的事，你们知道的。」方哲说，「这个项目做好了，大家都好过一点。」<\/p><p>林拓不知道「明年的事」是什么。方哲没有解释。<\/p><p>出了会议室，小杜追上他，压低声音：「你群里发的我看到了。真收到钱了？」<\/p><p>「嗯。」<\/p><p>「多少？」<\/p><p>「一百三十七。」<\/p><p>小杜想了一下：「比我基金今年赚得多。」<\/p><p>「你基金亏的。」<\/p><p>「所以说。」小杜说，「你那个叫什么？」<\/p><p>「咔哒。」<\/p><p>「咔哒。」小杜念了一遍，「我回头也发个东西试试。」<\/p><p>他说了很多次「回头」。林拓没接话。<\/p><p>从那天起，他的一天变成了三段。<\/p><p>早上九点到晚上九点半，云梯科技十四楼。他把咔哒的事全部从脑子里清出去。方哲坐在他斜后方，他能感觉到。他做接口，做联调，做压测，跟小杜一起改一个不知道谁写的旧模块。他做得比平时还快。他不想让方哲有任何理由多看他一眼。<\/p><p>晚上十点到家。沈月留了饭。他吃饭的时候不说话，沈月也不问。<\/p><p>十一点到凌晨一点半，阳台。咔哒的事。<\/p><p>第一个星期，夜航船群里有人出了事。<\/p><p>一个做记账工具的群友，被公司发现了。公司的电脑装了监控软件，他在工位上开过自己的网站后台，被截了图。HR 谈话，让他选：停掉，或者走。<\/p><p>群里很多人说话。有人骂公司，有人说自己也这么干过。<\/p><p>周冉发了一条：「你们回去把劳动合同翻出来，找『兼职』两个字。」<\/p><p>林拓那晚翻了。合同在衣柜顶上的一个文件袋里。第十四条，未经公司书面同意，不得在外兼职。<\/p><p>他坐在床边看那一条，看了很久。<\/p><p>沈月洗完澡出来，看到他的脸色。<\/p><p>「怎么了？」<\/p><p>他把那一条指给她看。<\/p><p>她看完，说：「你现在有兼职收入了，一百三十七。」<\/p><p>「嗯。」<\/p><p>「所以你就是在违反第十四条。」<\/p><p>他没说话。<\/p><p>「你打算停吗？」<\/p><p>「不。」<\/p><p>「那你就得做到一件事。」她把毛巾搭在椅背上，「哪天有人来问，你拿得出证据，证明你没占公司一分钟，一台电脑。」<\/p><p>老船长那天在群里也说了一句，说得很慢，一句话分了三条发。<\/p><p>「不用公司的设备。」<\/p><p>「不用公司的时间。」<\/p><p>「提交记录都在夜里。」<\/p><p>然后又补了一条：「不是防谁。是让你自己心里有底。」<\/p><p>林拓当晚在便利贴上写了这三行，贴在阳台的笔记本上。他把公司的电脑和自己的电脑彻底分开。公司的电脑上没有咔哒的一个字，浏览器书签里没有，聊天记录里没有。手机上他不在公司时间打开任何跟咔哒有关的东西。地铁上都不看。<\/p><p>他打开自己的代码提交记录看了一遍。提交记录就是每次改代码留下的打卡，什么时候改的，改了什么，一条一条都在。从 8 月 24 日到现在，最早的一条是晚上十点零四分，最晚的一条是凌晨两点五十。周末白天有几条。没有一条在工作日的九点到九点半之间。<\/p><p>他把这个页面截了图，存进一个文件夹。文件夹叫「证据」。<\/p><p>沈月看到这个名字，说：「你起得像要打官司。」<\/p><p>「防万一。」<\/p><p>「行。」她说，「万一真有那天，我给你作证，你每天晚上十一点才开电脑。」<\/p><p>第一封信是 10 月 15 日来的。<\/p><p>凌晨一点，他刷新邮箱，有一封新的。英文，很短。问他这个工具能不能在另一条链上用，他们有一批要发。落款是一个他没见过的名字。<\/p><p>他坐直了。这是周冉说的「有一天」。<\/p><p>他回了。用翻译软件查了两个词，写了四句话。现在只支持一条链，另一条链他可以看看，需要几天，你们要发多少笔。<\/p><p>对方两个小时后回了：一千二百笔。<\/p><p>他把这封信截图，存进一个新文件夹。文件夹叫「用户」。里面只有这一张。<\/p><p>第二个星期，他每天晚上十一点发一条。有一天他写的是：今天零笔。7 个赞。他照发。周冉在底下回了一个字：对。<\/p><p>方哲也在加班。有一天晚上九点多，办公室只剩下他们三个，方哲站在窗边看手机看了很久。林拓去倒水，经过的时候方哲忽然说了一句。<\/p><p>「我以前也想过出去。」<\/p><p>林拓停下来。<\/p><p>方哲没看他，看着窗外。「后来有了房贷。」<\/p><p>然后方哲把手机收起来，回去改文档了。林拓端着水站了一会儿，不知道这句话是说给谁听的。<\/p><p>第二个星期，他撑不住了。<\/p><p>10 月 17 日，周四。晚上九点四十下班，他在地铁上坐下就睡着了。醒的时候有人拍他的肩膀，是保洁的阿姨。车厢里没人，灯很白。终点站。阿姨说：「小伙子，到头了。」他坐反方向回去，又睡着了，又坐过了两站。<\/p><p>到家十二点。沈月在沙发上等他，电视没开。<\/p><p>「我睡过站了。」他说。<\/p><p>「我知道。你不回消息。」<\/p><p>他坐下。她没说话，起来给他热饭。热到一半，她背对着他说了一句。<\/p><p>「你脸跟纸一样。」<\/p><p>「这周就完了。」<\/p><p>「你上周也这么说。」<\/p><p>他吃饭。她坐在对面看他吃。<\/p><p>「你今晚别上阳台了。」她说。<\/p><p>「嗯。」<\/p><p>他没上阳台。他躺下五分钟就睡着了。<\/p><p>项目在 10 月 25 日上线了，比方哲说的早两天。方哲在群里发了一句「辛苦」，加了个红包，每人二十块。林拓领了，记在账上。<\/p><p>周六下午，沈月的妈妈打电话来。<\/p><p>沈月在厨房切菜，电话开了免提放在台面上。林拓在客厅，能听到。<\/p><p>先是问吃了没有，问学校放不放假。然后是那个问题。<\/p><p>「小林那边，家里有没有说帮忙付一点？」<\/p><p>沈月切菜的声音没停。「妈，我们没打算买。」<\/p><p>「不买你们总要有个打算。你们同学都买了。」<\/p><p>「妈。」<\/p><p>「我不是催你。我是说你都二十七了。」<\/p><p>「妈，我知道了。」<\/p><p>「你知道什么了。」<\/p><p>沈月把电话拿起来，说了一句「我这儿油热了」，挂了。<\/p><p>厨房里只剩下切菜的声音。她切得很匀，一下一下。<\/p><p>林拓站在厨房门口。<\/p><p>她没回头。「没事。」<\/p><p>他没走。<\/p><p>「你去做你的事。」<\/p><p>他还是没走。他走进去，把水池里的青菜拿出来洗。两个人挤在小厨房里，谁也不说话。菜洗完了，她把锅热了，油下去的时候响了一声。<\/p><p>「我烦的不是房子。」她说。<\/p><p>他等她说完。<\/p><p>「我烦的是她觉得我在等你。」她把菜倒进锅里，「我不是在等你。是我自己选的。」<\/p><p>锅里的声音盖过了后面半句。他没听清，也没问。<\/p><p>那顿饭吃得很安静。吃完他洗碗，她在沙发上看小说，看了半天没翻页。<\/p><p>夜里他上阳台。合约后台上有了第二笔手续费，四十一块。第三笔，十八块。加起来，10 月到现在一百九十六。<\/p><p>他把这个数记在账本上。然后在旁边算了一笔：一百九十六块，是十九万六的千分之一。要到一万，一个月要有一千万从这把扳手上过。他把这个数写下来，看了一眼，划掉了。太远。<\/p><p>然后他打开了一个他一直没打开过的东西。<\/p><p>上线那天他给网站装了一个搜索控制台。搜索控制台是搜索引擎给每个网站的后台。像商场给每家店铺发的一张客流单，上面写着顾客是问着什么找到你这家店的。他装上以后就没再看过。他以为不会有人从搜索引擎找到他。<\/p><p>后台打开了。<\/p><p>第一行：稳定币 批量转账。有人搜了这句话，在结果里看到了他，点了进来。<\/p><p>他盯着这一行。<\/p><p>一个人，在某个地方，某个时间，坐在电脑前面，打了这几个字。他不认识大鹏，不在大鹏的群里，不在夜航船。他就是有三百个地址要发，他去问搜索引擎。搜索引擎把咔哒给了他。<\/p><p>他往下翻。<\/p><p>批量发币工具。空投 批量发送。合约 批量转账 省手续费。多个地址 一次转账。批量转账 网页版。<\/p><p>有的词他能想到。有的他想不到。有一条是「一次给很多人转账 不用一个一个签名」，像一个人在跟朋友抱怨。<\/p><p>他数了数。三十七个不同的搜索词。<\/p><p>三十七句陌生人说的话。<\/p><p>他一个一个看，一个一个念出来。念到第十几个的时候，他忽然明白了一件事。这些人不是在找「咔哒」。他们不知道咔哒是什么。他们在说自己的麻烦。<\/p><p>他把三十七个词全部抄下来，抄在一张纸上。抄完是凌晨一点。他给周冉发了一句：三十七个词。周冉没回。她睡了。<\/p><p>沈月在里面翻了个身。<\/p><p>他没有关电脑。他坐在那儿，一遍一遍读那张纸，像在听三十七个陌生人说话。<\/p><aside class=\"log\"><div class=\"log-label\">航海日志<\/div><p>「10 月 3 日。第一笔手续费，137 块。花了 26 天。」<\/p><p>「改成收费之后两天零笔，第三天来了这一笔。不 P 图，附截图。」<\/p><p>「10 月 15 日。第一封用户来信。问另一条链。一千二百笔。我说我看看。」<\/p><p>「10 月 26 日。10 月手续费合计 196 块。三笔。」<\/p><p>「今天第一次打开搜索控制台。有人搜『稳定币 批量转账』找到了这里。我不认识他。」<\/p><\/aside>", "words": 4846}, {"num": 7, "title": "有人在找", "vol": 0, "html": "<p>2024 年 10 月 27 日，周日下午两点。滨江一家咖啡馆，靠窗的位子。<\/p><p>周冉比林拓先到。她面前一台笔记本，一杯美式，已经喝了一半。林拓坐下，从包里拿出那张纸。三十七个搜索词，手抄的。<\/p><p>周冉看了一眼，没接。<\/p><p>「不用抄。」她说，「我看后台。你给我的只读账号我昨晚看了两个小时。」<\/p><p>她把电脑转过来。<\/p><p>屏幕上是一张饼图。搜索引擎来的，百分之八十。大鹏的群和夜航船，百分之十二。剩下的是不知道哪儿来的。<\/p><p>「上线五十天，你以为你的用户是谁带来的？」<\/p><p>「大鹏。」<\/p><p>「第一周是。现在不是。」她敲了一下那块最大的饼，「现在是搜索引擎。所以我跟你说一件事，你记住。你做的不是一个 App。你做的是一堆页面。」<\/p><p>林拓没听懂。<\/p><p>周冉把杯子挪开，用手指在桌上画。<\/p><p>「搜索引擎是一条大街。每一个页面是街上的一个门面。门面的招牌，就是页面的标题。人走在街上，不是来找你咔哒的。他们不知道咔哒是什么。他们是带着一个麻烦来的，看见哪块招牌上写着他的麻烦，就进哪家。」<\/p><p>她把他的网站打开。浏览器标签上写着四个字：咔哒工具箱。<\/p><p>「这就是你的招牌。」她说，「你告诉我，谁会在搜索引擎里打『咔哒工具箱』？」<\/p><p>他没说话。<\/p><p>「没人。三十七个词里有没有这四个字？」<\/p><p>「没有。」<\/p><p>「所以。」<\/p><p>「我看数据先看漏斗。」她说，「上次画给你的那个。最上面是搜索引擎把你摆出来给人看，下面是有人点进来。再下面是有人真的用了，最底下是有人付钱。每一层都会漏掉一大半。你要知道漏在哪一层。」<\/p><p>她把搜索控制台打开，按一个数字排序。<\/p><p>「先看真实的词。不是你猜的，是别人打过的。这一栏是展示，就是搜索引擎把你摆出来给人看了多少次。这一栏是点击，就是人真的进来了多少次。这一栏是排名。」<\/p><p>「批量转账」在第一行。展示一千多次，点击二十几次，排名二十一。<\/p><p>「展示多，点击少，排名二十一。」周冉说，「你知道二十一是什么意思吗？第三页。没人翻到第三页。」<\/p><p>她在搜索引擎里打了「批量转账」，把第一页的结果一个一个点开，只看标题。<\/p><p>第一个是一家大交易所的帮助页。第二个是一个大钱包的功能介绍。第三个、第四个是两个做了好几年的老站。<\/p><p>「看他们的标题。」她说，「都是大站。这个词你打不过他们。别打。」<\/p><p>「那我做什么？」<\/p><p>「找没人排队的窗口。」<\/p><p>她在搜索框里换了一个词：批量生成钱包地址 离线。<\/p><p>结果出来了。第一页是几个论坛的旧帖，一个代码仓库，两篇三年前的博客。没有一个是能直接用的工具。<\/p><p>「你看，」她说，「这个词有人搜。搜的人不多，一个月几百个。但是没有人认真做一个页面给他们。这就是长尾。」<\/p><p>她看他还是没完全懂，换了个说法。<\/p><p>「菜市场。最大的摊位卖白菜，谁都卖，你去挤没用。旁边有人要香菜，一天就十几个人要，可是没人摆香菜的摊。你摆一个，这十几个人全是你的。」<\/p><p>「三个条件。」她伸出三根手指，「搜的人少，竞争小，意图明确。意图明确是说，打这个词的人已经知道自己要什么，他不是来看热闹的，他今天就要用。」<\/p><p>林拓拿起那张纸，从头看。他用笔在几个词旁边画了勾。<\/p><p>批量生成钱包。批量查余额。批量地址 导入 表格。<\/p><p>「这三个，批量转账做不了。」他说。<\/p><p>「对。这三个是三个新工具，也是三个新页面。」周冉说，「一个工具，一个页面，一个标题。标题就是用户会搜的那句话。不是『功能二』，不是『咔哒工具箱之钱包生成』。就是那句话。」<\/p><p>「先做哪个？」<\/p><p>「你跟几个用户聊过？」<\/p><p>「两个。大鹏，还有一个写信的。」<\/p><p>「去问大鹏。问他发完空投的前一天在干什么，后一天在干什么。」<\/p><p>他当场发了消息。大鹏回得快，语音。<\/p><p>前一天，要先生成一批新地址，测试用的，或者给团队分的。他现在用一个不知道哪儿下载的小软件，不敢用，怕里面有东西。后一天，要一个一个查余额，看有没有发漏。<\/p><p>周冉听完语音，看着他。<\/p><p>「你现在知道先做哪个了。」<\/p><p>她合上电脑，站起来穿外套。走之前又说了一句。<\/p><p>「先别写代码。回去先改标题。标题改一行，比你写三天代码值钱。」<\/p><p>回家的路上他一直在想那块招牌。<\/p><p>到家他先改标题。「咔哒工具箱」改成「批量转账工具：一次签名发给几百个地址，不碰私钥」。<\/p><p>沈月在旁边看他改，看了一会儿说：「你写的像说明书。」<\/p><p>「哪儿像？」<\/p><p>「『一次签名发给几百个地址』。人不这么说话。人说『一次给很多人转账』。」<\/p><p>他想起搜索控制台里那句像抱怨的话。他把标题改了一遍：批量转账工具，一次给很多个地址转账，不用一个一个签名，不碰私钥。<\/p><p>「长了。」沈月说。<\/p><p>「搜索引擎不嫌长。」<\/p><p>「人嫌。」<\/p><p>他删掉了最后四个字，不碰私钥放进了第一句话下面的小字里。<\/p><p>改完标题，他每天晚上看一次排名。前三天没动。第四天，二十一变成十八。第八天，十四。他不知道是标题的功劳还是别的，他把每天的数字记在账本旁边一栏。周冉说过，改一个东西就看一个数，别同时改三个。<\/p><p>第二个工具他做了十一天。<\/p><p>批量生成钱包地址。原理不难，难的是让人放心。<\/p><p>钱包地址和它的钥匙，是一对。生成的时候两样一起出来。以前大鹏用的那个小软件，就是替人配钥匙。可是配钥匙的师傅如果偷偷留一把，谁也不知道。<\/p><p>林拓的做法是：配钥匙的机器搬到用户自己家里。整个生成过程在用户的浏览器里跑，页面打开以后，一个字节都不往外发。用户可以拔掉网线，照样能用。生成完，一个文件直接落到用户的电脑上，网站从头到尾没见过。<\/p><p>他在页面最上面写了一句：这个页面断网也能用。不信你拔了网线试试。<\/p><p>他真的拔了网线试。试了三十几遍。<\/p><p>有一个地方他卡了两个晚上。生成钥匙要用随机数。随机数就像摇骰子，骰子不能有记号，摇出来的点数谁也猜不到。AI 助手最开始给的写法用的是一种普通的骰子，写游戏够用，配钥匙不够。他查了两个晚上，换成了浏览器自带的那种，专门给密码用的。换完他在页面上加了一行小字，写明用的是哪一种。他不确定有几个用户会看这行字。他觉得该写。<\/p><p>沈月问他为什么要写「不信你拔了网线试试」。<\/p><p>「因为我说不联网，没人信。」他说，「拔网线他们信。」<\/p><p>11 月 8 日，第二个工具上线。页面标题：批量生成钱包地址，离线，在你自己的浏览器里生成，不联网。<\/p><p>他在夜航船群里发了一句。老船长回了一个「好」。这次多了一个字：好，稳。<\/p><p>大鹏第二天就用了。他生成了两百个测试地址，回了一条语音：「终于不用那个来路不明的软件了。」然后又说，「下一个做查余额吧，发完对账我还得手动。」<\/p><p>林拓把这句话记在清单上。清单上现在有三条大鹏的话。<\/p><p>第一周，这个页面一天二十个人。<\/p><p>第二周，排名到了第一页。那个长尾词，搜索引擎第一页只有他一个是能直接用的工具，其他还是那几篇旧帖。一天涨到六十。<\/p><p>他有点失望。六十。<\/p><p>他把这个数发给周冉。周冉回：「六十个人，每个都是要生成钱包的。你要多少？」<\/p><p>他没回。<\/p><p>10 月那封信的事，他也做完了。另一条链的支持花了四个晚上。11 月 12 日，那个人用它发了一千二百笔。手续费三百多。对方回了一封信，一句话：谢谢，很顺。<\/p><p>他回信问了一句：你是怎么找到这个工具的。对方说，一个中国朋友转的链接。他把这封信也放进「用户」文件夹。两张。<\/p><p>11 月中，他在圈子上看到一个人晒图。一个做图片工具的，被一个大号转了一下，一天进来五千人。评论里全是恭喜。<\/p><p>他看着五千这个数，再看自己的六十。那天晚上他在阳台上坐着，没写代码。他想，是不是应该做一个那样的。<\/p><p>沈月出来收衣服，看到他没开电脑。<\/p><p>「怎么了？」<\/p><p>「有人一天五千。」<\/p><p>「你一天多少？」<\/p><p>「六十。加上转账的，两百多。」<\/p><p>「那五千个人，第二天还在吗？」<\/p><p>他没想过这个问题。他打开那个人的主页往前翻。上个月那人也晒过一次，一天三千。再上个月，一天两千。中间的日子，没晒。<\/p><p>「你问问他中间的日子。」沈月说，收了衣服进去了。<\/p><p>11 月的最后一个周六，30 号。「不打烊」茶馆。<\/p><p>来的人比上次多。天冷了，茶馆里开了暖气，普洱的味道更重。<\/p><p>轮到林拓说的时候，他把两个工具说了，把六十个人说了。他说完停了一下，说了一句心里话。<\/p><p>「我想做一个大的。」<\/p><p>老船长倒茶的手没停。<\/p><p>「多大？」<\/p><p>「一天几千人那种。」<\/p><p>「谁付钱？」<\/p><p>「转账那个付钱。生成钱包那个不付，免费。」<\/p><p>「那你想做大的，是想要谁付钱？」<\/p><p>林拓答不上来。<\/p><p>老船长把茶倒满，慢慢说。<\/p><p>「2020 年，我从一个小站重新开始。一个页面，一件事，一天三十个人。」<\/p><p>他停了停。<\/p><p>「第二个站，一天五十个人。第三个，二十个。我现在三十几个站。没有一个一天过一千。」<\/p><p>「加起来呢？」有人问。<\/p><p>「加起来，一个月五六万。」<\/p><p>「三十几个站，你记得住吗？」林拓问。<\/p><p>「账本。」老船长说，「一个站一行。每天记。哪个站掉了，哪个站涨了，一眼看得见。」<\/p><p>林拓想起父亲柜台后面那本账。他没说。<\/p><p>茶馆里安静了一下。<\/p><p>「不靠一个爆款。」老船长说，「靠三十个小池塘。一个池塘干了，还有二十九个。一个爆款干了，你就干了。」<\/p><p>他看了林拓一眼。<\/p><p>「我以前有过一条大船。」<\/p><p>他没往下说。倒茶。<\/p><p>周冉在旁边补了一句：「他那条大船的事，你以后会听到。今天你先记住小池塘。」<\/p><p>散场的时候，老船长在门口跟他说了一句话，说得很慢。<\/p><p>「你那个生成钱包的页面，一天六十个人，都是明天要发空投的人。你的转账工具，在那个页面上放一句话了吗？」<\/p><p>林拓愣住了。<\/p><p>没有。两个页面，各管各的。<\/p><p>「池塘和池塘之间，要挖一条沟。」老船长说完，就走了。<\/p><p>他回家挖了那条沟。生成钱包的页面底下，一行小字：生成好了？下一步可能要批量发币，点这里。转账页面底下，也放了一行：发之前要先生成一批测试地址？点这里。<\/p><p>第二天，转账工具的用户里，有三分之一是从生成页面过来的。<\/p><p>11 月过完，他把数字拉出来。<\/p><p>日访客，三百。搜索引擎来的，百分之八十一。批量转账那个页面，排名从二十一爬到了九。生成钱包的页面，第一页第一个。<\/p><p>手续费，两千三百块。<\/p><p>这个数他算了三遍。11 月有四笔大的。那个海外用户的一千二百笔。大鹏群里一个项目方，发了两次，每次都是几十万。还有一个不认识的地址，一次发了八十多万，手续费八百多。剩下的是几十笔小的，几块几十块。<\/p><p>两千三。<\/p><p>他去洗碗。碗洗完了，他把厨房的地也拖了。<\/p><p>沈月看着他拖地，什么都没问。拖完他才说。<\/p><p>「两千三。」<\/p><p>「一个月？」<\/p><p>「一个月。」<\/p><p>她想了想，说：「我一个月九千。」<\/p><p>「嗯。」<\/p><p>「你要追上我，还要四个。」她说完就笑了，「我不是在比。我是在算。」<\/p><p>「我知道。」<\/p><p>12 月 1 日，早上。<\/p><p>群里的规矩，每月一号发上月的收入截图。10 月 1 日他没发，那时候是零，他觉得零没什么好发的。11 月 1 日他发了一行字，10 月，一百九十六。老船长回：「截图。规矩是截图。」他没发。他觉得一百九十六截出来太难看。<\/p><p>这次他发了。合约后台，11 月，两千三百一十二块。没裁，没 P。发之前他把截图给沈月看了一眼。她说：「地址后四位露着，没事吧？」「没事。链上本来就是公开的。」<\/p><p>发出去以后他去刷牙。刷完回来，底下有十几条。<\/p><p>「不错。」<\/p><p>「两个月到两千三，可以了。」<\/p><p>「转账那个页面标题谁教你的，好。」<\/p><p>周冉回了一句：「两千三里有多少是四笔大的？」<\/p><p>「两千。」<\/p><p>「所以你靠四个人。记住这个。」<\/p><p>他一条一条看。看到最后一条，是老船长的。<\/p><p>「不错。现在你该想想，你的第二个问题是什么。」<\/p><p>他愣了一下。<\/p><p>第一问，谁会为它付钱。第二问，他们今天在哪儿，正在用什么凑合。<\/p><p>他们今天在哪儿。<\/p><p>他打开搜索控制台，翻到最下面。三十七个词早就变成了一百多个。最下面有几行他一直没在意的。字他不认识。是日文。还有两行是韩文。有人用日文搜「批量转账」，找到了他的中文页面，点进来，然后走了。<\/p><p>他叫沈月来看。她凑过来看了一眼那几行字。<\/p><p>「日文。」她说，「这句我认识两个字，『一括』，一起的意思。」<\/p><p>「一起转账。」<\/p><p>「他们也有三百个地址要发。」她说。<\/p><p>他把其中一行复制到搜索引擎里。第一页有一个日本的网站，页面很干净，标题他一个字都看不懂。他点进去。<\/p><p>一个陌生的语言，一个陌生的页面，上面画着和他一模一样的东西：一张地址表，一个总数，一个按钮。<\/p><p>他盯着那个页面，忽然明白了老船长的话。<\/p><p>他们不只在这儿。<\/p><aside class=\"log\"><div class=\"log-label\">航海日志<\/div><p>「11 月 30 日。月收入 2,300。两个工具。日访客 300。搜索来的占 81%。」<\/p><p>「第二个工具上线三周，长尾词第一页第一个。一天 60 人。都是明天要发币的人。」<\/p><p>「两个页面之间挖了一条沟。转账用户三分之一从生成页面来。」<\/p><p>「12 月 1 日。第一次发月收入截图。没裁。后台有日文和韩文的搜索词，我看不懂。」<\/p><\/aside>", "words": 4867}, {"num": 8, "title": "年终", "vol": 0, "html": "<p>2024 年 12 月 6 日，周五晚上。滨江的出租屋，阳台。<\/p><p>林拓打开了广告后台。<\/p><p>上个月两千三百块，他算过，一个月至少要有两百多万从扳手上过，才有这个数。12 月才过了五天，链上安静得像放了假。他在群里看到有人说，做工具站的都挂广告，一天几百个访客，一个月能有几百块。<\/p><p>广告是这么回事：把页面上一块地方租出去，像在自己店门口挂别人的招牌。有多少人看见，就按人头给你钱。挂谁的招牌，你自己说了不算。<\/p><p>他挂了。批量转账页面右边一条，生成钱包页面底下一条。<\/p><p>第二天早上他打开自己的网站，愣了一下。页面变丑了。右边那条广告是一个闪着光的钱包，字很大，写着「零手续费，年化三十」。他自己看了都想关掉。<\/p><p>沈月路过看了一眼。<\/p><p>「这是什么？」<\/p><p>「广告。」<\/p><p>「你的页面上写着不碰私钥。旁边挂着一个让人把钱交出去的东西。」<\/p><p>他没说话。<\/p><p>12 月的第三周，大鹏群里有人发了一张截图，圈出那条广告，问：这是不是骗子钱包？大鹏把截图转给了林拓，没加评论。<\/p><p>他查了一下。那个钱包在海外社交平台上被人骂过。他把广告后台里能屏蔽的类别全屏蔽了。第二天换成了一个借贷平台的横幅，绿底黄字，还是闪。<\/p><p>月底一算，广告六百块。<\/p><p>六百是这个月手续费的四分之一。他盯着这个数，想把广告撤了，又没撤。他在账本上给广告单独开了一栏。开了一栏，就是还没决定。<\/p><p>12 月中的一个晚上，沈月在饭桌上说，学校要她带一个新班，她有点不想带。林拓说：「嗯，行。」她看了他一眼，说：「我问你觉得我该不该带。」他抬起头，才发现她刚才说了很长一段。他说不知道。她说：「你人在这儿，人不在。」然后收了碗，没让他洗。<\/p><p>12 月他做了第三个工具。余额雷达。大鹏说的那句「发完对账我还得手动」。粘一张地址表进去，一次把几百个地址的余额全查出来。像拿一张名单去银行柜台，柜员一次给你查完，不用一个一个排队。这个工具不碰钱，只看，所以做得快，八天。<\/p><p>第四个工具在 12 月底，授权撤销。这个东西他解释了好几遍才有人听懂。链上很多网站会让你签一张长期委托书，允许它替你动某一种币。签的时候你不觉得。签多了，你的钱包上挂着十几张委托书。有一张的主人跑了，或者被黑了，你的钱就跟着没了。撤销，就是把那些委托书一张一张收回来。<\/p><p>他做这个，是因为 12 月中一个用户写信来问。那个人签过一张委托书给一个已经关了的网站，不知道怎么收回来。林拓在信里教了他一遍，教完想，这不该是写信教的事。<\/p><p>上线的时候已经是 12 月 31 日。四个工具。<\/p><p>公司的年会在 1 月 17 日。<\/p><p>一个酒店的宴会厅，二十几桌。林拓和小杜一桌，方哲在前面一桌。<\/p><p>开场是老板讲话。讲完是各部门总监上台。轮到方哲，他拿着一张纸念。念到最后一段，他停了一下，念出四个字。<\/p><p>「降本增效。」<\/p><p>台下没人鼓掌。<\/p><p>方哲自己也停了两秒，把纸折起来，下台了。<\/p><p>小杜凑过来小声说：「明年的事，就是这个。」<\/p><p>「什么意思？」<\/p><p>「裁人。」小杜说，「我们组听说要走两个。」<\/p><p>林拓看着方哲。方哲坐回去，端起杯子，跟旁边的人碰了一下，脸上没什么表情。<\/p><p>抽奖抽到十一点。林拓什么都没抽到。小杜抽到一个电饭煲，抱在怀里，说：「行，明年要是走了，也有饭吃。」<\/p><p>散场的时候，小杜在路边等车，忽然说：「你那个，一个月真有两千多？」<\/p><p>「嗯。」<\/p><p>「我回头也做一个。」<\/p><p>「你说了四次回头了。」林拓说。<\/p><p>小杜愣了一下，笑了：「五次。」<\/p><p>回去的地铁上，林拓打开账本，把年会那桌的车费记上。然后他翻到「自己的东西」那一栏，从 9 月往下看。<\/p><p>一百三十七。一百九十六。两千三百一十二。两千三百多加六百广告。<\/p><p>他把手机收起来。窗外黑的，什么也看不见。<\/p><p>1 月 25 日，腊月二十六。他坐早班高铁回上饶。<\/p><p>高铁开出杭州，沈月发来一条：到了说一声。替我跟叔叔阿姨问好。他回了个「好」。过了一站，又补了一句：你记得吃饭。她回：你才是。<\/p><p>县城比去年又多了几栋楼。五金店还在老地方，临街，卷帘门半拉着。他弯腰钻进去。<\/p><p>店里还是那个味道。铁、机油、纸箱。三排货架，从门口到最里面。柜台后面，父亲戴着老花镜，低头写东西。<\/p><p>「崽。」父亲说，没抬头，「回来了。」<\/p><p>「嗯。」<\/p><p>「吃了没。」<\/p><p>「车上吃了。」<\/p><p>父亲写完那一行，把笔插回账本里，才抬头看他。看了两秒。<\/p><p>「瘦了。」<\/p><p>母亲从里屋出来，接过他的包，话就没停过。高铁挤不挤，杭州冷不冷，怎么又瘦了，晚上想吃什么。问到第六句，她问：「小沈呢？」<\/p><p>「她在杭州，她妈家。」<\/p><p>「过年怎么不带回来？」<\/p><p>「明年。」<\/p><p>「你去年也说明年。」母亲说，「明年一定带回来，我给她做糖醋鱼。」<\/p><p>「嗯。」<\/p><p>父亲在旁边翻账本，没说话。<\/p><p>在店里的第一天，他坐在柜台旁边一张矮凳上，看父亲做生意。<\/p><p>上午来了一个老头，进门不看货，直接走到柜台前，把一个旧水龙头放在台面上。<\/p><p>「建国，这个又漏。」<\/p><p>父亲拿起来看了看，拧了拧。<\/p><p>「垫片坏了。」<\/p><p>他从抽屉里翻出一个小垫片，换上，拧紧，用手试了试。前后两分钟。<\/p><p>老头问：「多少？」<\/p><p>「走吧。」父亲说。<\/p><p>老头把水龙头揣进口袋，顺手在货架上拿了一卷生料带，扔了五块钱在柜台上，走了。<\/p><p>林拓看着那五块钱。<\/p><p>「垫片不要钱？」<\/p><p>「几毛钱的东西。」父亲说，「修东西不收钱。人下次还来。」<\/p><p>「他下次买什么？」<\/p><p>「不知道。」父亲把五块钱收进抽屉，「他家儿子去年装修，水电全在我这儿拿的。」<\/p><p>下午来了一个年轻人，看样子是附近新开工地的。他要买一箱膨胀螺丝，问了价，说隔壁便宜两块。<\/p><p>「那你去隔壁。」父亲说。<\/p><p>年轻人站了一会儿，还是在这儿买了。走了以后林拓问：「怎么不让两块？」<\/p><p>「新客讲价，老主顾不讲。」父亲说，「你让了新客，老主顾知道了，心里不舒服。」<\/p><p>「他不一定来第二次。」<\/p><p>「来不来是他的事。」父亲说，「老主顾比新客重要。一个老主顾，一年来二十趟。一个新客，来一趟，讲一次价。」<\/p><p>晚上关门之前，母亲坐到柜台后面，翻开账本。店里的账一直是她管。<\/p><p>账本是那种最普通的硬壳本，封面磨得发白。一天一页。今天卖了什么，进了什么，谁赊了多少，谁还了多少。一笔一笔，字很密。父亲站在旁边，把白天收的零钱一把一把数给她，她一笔一笔记。两个人不说话，配合了二十几年。<\/p><p>「你还记账吗？」父亲问。<\/p><p>「记。」<\/p><p>「每天？」<\/p><p>「每天。」<\/p><p>父亲点了下头。等母亲写完最后一行，他说了一句。<\/p><p>「账本每天记。一天不记，就乱。乱了就不知道自己在哪儿。」<\/p><p>母亲把账本合上，放回抽屉。父亲站起来，把里面的工具箱拎到柜台上，把今天用过的螺丝刀放回去。绿色的铁皮，边角掉漆。盖子扣上。<\/p><p>咔哒。<\/p><p>第二天上午没客人的时候，林拓把手机递给父亲，页面上是咔哒。<\/p><p>父亲拿远了看，看了半天。<\/p><p>「这是什么？」<\/p><p>「一个网页。帮人转账的。」他指着首页那句话，「我们只是一把扳手，钱一直在你自己口袋里。」<\/p><p>父亲把手机还给他。<\/p><p>「扳手不值钱。」父亲说，「值钱的是知道哪儿拧。」<\/p><p>林拓把这句话记在了备忘录里。父亲已经去货架那边理货了。<\/p><p>林拓在店里坐了三天。<\/p><p>第一天他看父亲。第二天他看客人。第三天他自己站到了柜台后面。母亲去买菜，父亲去送货，店里只有他。<\/p><p>一个中年人进来，找一种型号的水管接头。他找了半天没找到。中年人说：「你爸知道在哪儿。」然后坐在门口等。等了二十分钟，父亲回来了，伸手就从第三排货架下面摸出来。<\/p><p>「你不认得，人家就等你爸。」父亲说，「不是等这个接头。」<\/p><p>那天晚上，林拓躺在自己以前的床上，忽然明白了一件事。<\/p><p>老船长说的三十个小池塘，父亲说的老主顾，沈月那天问的「五千个人第二天还在吗」，是同一件事。<\/p><p>大鹏是老主顾。那个发了一千二百笔的海外用户是老主顾。生成钱包页面上每天那六十个人，明天要发币，后天要对账，他们是老主顾。一天五千个人，是来讲价的新客。<\/p><p>用户群不是一个数。是一个个会回来的人。<\/p><p>他坐起来，打开手机，把那封让他做授权撤销的信找出来。上线那天他忘了回。他回了一句：工具上线了，你试试。<\/p><p>回完他又想起广告。他打开网站看了看。那块绿底黄字的广告还挂在那儿，跟货架上的接头挨着，不像一家店的东西。<\/p><p>他没动。他觉得还没到时候。他不知道到时候是什么时候。<\/p><p>1 月 27 日，腊月二十八。郑浩发了一条朋友圈。<\/p><p>九张图。年会舞台，红色背景，上面写着「A 轮后首个年会」。全体合影，四十个人，郑浩站在中间。还有一张是一块蛋糕，上面写着「冲刺 B 轮」。<\/p><p>配的字是：感谢每一位并肩的人。明年，更大的船。<\/p><p>林拓点了赞。过了一会儿，郑浩私聊他。<\/p><p>「回上饶了？」<\/p><p>「嗯。」<\/p><p>「你那个小网页怎么样了？」<\/p><p>「还行。」<\/p><p>「有空来深圳。我们这边缺人。」<\/p><p>「嗯。」<\/p><p>郑浩发了一个笑脸。林拓把手机放下，去帮母亲剥蒜。<\/p><p>除夕，1 月 28 日。<\/p><p>晚饭吃得早。父亲喝了一杯酒，脸红了，话还是不多。夹菜的时候他忽然问了一句。<\/p><p>「崽，你做的那个，有人回头来吗？」<\/p><p>「有。」<\/p><p>「那就行。」<\/p><p>他没再问。母亲给他添了一勺汤。母亲在厨房收拾。林拓上了楼，站到阳台上。县城的夜里有鞭炮声，一阵一阵。<\/p><p>沈月的视频打过来。<\/p><p>她在她爸妈家的小房间里，头发扎起来，穿着一件旧毛衣。背后是一张贴着卡通贴纸的书桌，她小时候的。<\/p><p>「吃了？」<\/p><p>「吃了。你呢？」<\/p><p>「吃了。我妈做了十个菜。」她把镜头转了一下，转回来，「你爸喝酒了？」<\/p><p>「一杯。」<\/p><p>「他说什么了？」<\/p><p>「没说什么。」他想了想，「他说修东西不收钱，人下次还来。」<\/p><p>沈月笑了。「这话你要记住。」<\/p><p>「记住了。」<\/p><p>「还有呢？」<\/p><p>「他说，账本每天记，一天不记就乱，乱了就不知道自己在哪儿。」<\/p><p>沈月安静了一会儿。<\/p><p>「林拓。」<\/p><p>「嗯。」<\/p><p>「你知道我这半年怎么看你的吗？」<\/p><p>他不知道。<\/p><p>「我不看你赚多少。我看你晚上进门，有没有看我。」她说，「10 月那两个星期，你进门是看沙发的。你眼睛看着我，看的是沙发。」<\/p><p>他没说话。<\/p><p>「11 月好一点。12 月又不行了。你在阳台上，人在，人不在。」<\/p><p>鞭炮声停了一阵。楼下母亲在叫他吃汤圆。<\/p><p>「我不需要你成功。」沈月说，「我需要你别把自己弄丢。」<\/p><p>他握着手机，站在阳台上。县城的夜很黑，只有远处有几家亮着灯。<\/p><p>「嗯。」他说。<\/p><p>「嗯什么。」<\/p><p>「我知道了。」<\/p><p>「你不知道。」她说，「你去吃汤圆。明天再想。」<\/p><p>「行。」<\/p><p>「去吧。你妈叫第二遍了。」<\/p><p>视频挂了。屏幕黑下来，映出他自己的脸。他站了一会儿才下楼。<\/p><p>他下楼吃了汤圆。吃完他洗碗。母亲说不用他洗，他还是洗了，洗得很慢。<\/p><p>夜里十一点，他回到楼上，打开电脑。<\/p><p>他要写年终总结。周冉说过，数字，一件事，一个教训。一年的话，就多写几个数。<\/p><p>他先把数字列出来。<\/p><p>四个工具。批量转账，钱包批量生成，余额雷达，授权撤销。<\/p><p>月收入，两千三。12 月还有六百块广告，他写了，写在旁边，注明是广告。<\/p><p>日访客，三百。<\/p><p>存款，十一万六。3 月是十一万。中间给家里打过两次钱，买过一台电脑。一年，六千。咔哒到现在一共挣了五千多。他看着这两个数，想说什么，没写。<\/p><p>然后是教训。他写了三条。<\/p><p>第一条：先找到一个愿意付钱的人，再写代码。番茄账本三个月四十七个下载，咔哒两周十二个用户，差别不在代码。<\/p><p>第二条：标题是招牌。搜索来的占八成，他们不是来找咔哒的，是带着麻烦来的。<\/p><p>第三条：老主顾比新客重要。一天五千个人，不如每天六十个明天还来的人。<\/p><p>他读了一遍。三条里有两条不是他想出来的，一条是周冉的，一条是父亲的。他没改。教训是谁的不重要。<\/p><p>最后一行，他停了很久。<\/p><p>明年目标。<\/p><p>他打了「月入一万」四个字。<\/p><p>打完他盯着看。一万。现在两千三，要四倍多。他不知道怎么来。<\/p><p>他想起小时候写作文，老师让写理想。他写的是「长大要当科学家」。写的时候也是这样，字写得很端正，心里一点底都没有。<\/p><p>楼下父亲在关卷帘门。哗啦一声，落到底。然后是那一声，很轻，隔着一层楼板也听得见。<\/p><p>咔哒。<\/p><p>他把那四个字留下了。<\/p><p>发出去之前，他把父亲那本账的封面拍了一张照，没发。存在「证据」旁边那个文件夹里。那个文件夹到现在还没有名字。<\/p><aside class=\"log\"><div class=\"log-label\">航海日志<\/div><p>「2024 年终总结。」<\/p><p>「4 个工具：批量转账、钱包批量生成、余额雷达、授权撤销。月收入 2,300。日访客 300。存款 11.6 万。」<\/p><p>「教训一：先找到一个愿意付钱的人，再写代码。番茄账本 47 个下载，咔哒两周 12 个用户，差别不在代码。」<\/p><p>「教训二：标题是招牌。搜索来的占八成，他们不是来找咔哒的，是带着麻烦来的。」<\/p><p>「教训三：老主顾比新客重要。一天 5,000 个人，不如每天 60 个明天还来的人。」<\/p><p>「12 月挂了广告，600 块。页面变丑了。还没决定。」<\/p><p>「明年目标：月入一万。」<\/p><\/aside>", "words": 4856}, {"num": 9, "title": "十种语言", "vol": 1, "html": "<p>2025 年 1 月 2 日，晚上十一点。杭州滨江，出租屋的阳台。<\/p><p>林拓坐在那张小桌子前，桌上放着一杯凉了的水，一把旧螺丝刀，一台笔记本。屏幕上是咔哒工具箱的后台。后台就像五金店门口的计数器，谁进来、从哪条街进来、进来干了什么，都记一笔。<\/p><p>昨天是元旦，也是一号。群里的规矩，一号发上月收入截图。他把 12 月的发了：手续费两千三百多，广告六百，日访客三百。四个工具，第四个授权撤销是 12 月 31 日上的，才上线一天。<\/p><p>页面右下角有一块广告位。一个借贷平台的横幅，绿底黄字，闪。一个月六百块。用户群里有人说过难看，他没动。<\/p><p>手机震了一下。周冉在群里回了他的截图。<\/p><p>「你后台的搜索词，看过没有？有多少不是中文？」<\/p><p>他愣了一下。12 月 1 日那几行日文他看见过，但没有数过。<\/p><p>他点开搜索来源。一列词往下拉。<\/p><p>batch transfer。bulk send token。airdrop tool。还有几行他不认识的字，方块的，圆圈的。他用翻译软件扫了一下：一括送金，是日语。일괄 전송，是韩语。<\/p><p>他数了一遍。四百个搜索词里，中文的一百六十个。剩下的全是外文。<\/p><p>他把截图发回群里。三分钟后，周冉的语音电话打过来。<\/p><p>「你自己看到了吧。」周冉的声音很快，像在赶时间。「你的第二问，他们今天在哪儿。你之前答的是什么？」<\/p><p>「圈子，推上，几个群。」<\/p><p>「错了。答案是，他们不在中文互联网。玩这个的人，一半以上不说中文。你的站是中文的，他们能搜到，进来看不懂，走了。你三百个访客里有一百多个是白来的。」<\/p><p>林拓没说话。<\/p><p>「你打算干什么？」周冉问。<\/p><p>「翻译。」<\/p><p>「先别写代码。」周冉说。「先把那四百个词全导出来。按语言分。哪种语言的人多，先做哪种。你知道日本人搜的是哪个词吗？」<\/p><p>「一括送金。」<\/p><p>「你知道这四个字里，哪两个是关键词吗？」<\/p><p>他不知道。<\/p><p>「那就先搞清楚。」周冉说完就挂了。<\/p><p>他把四百个词导进一张表。中文，英文，日文，韩文，还有俄文和西班牙文的零星几个。英文最多，日文第二，韩文第三。<\/p><p>他在本子上写了三行：英，日，韩。<\/p><p>想了想，又往下写：俄，越，西，葡，土，德，法。凑成十行。<\/p><p>十种语言。他盯着那十行看了一会儿，把后面七行用笔划了一道，写：以后。<\/p><p>他又去查「一括送金」。翻译软件说，一括是批量，送金是把钱寄出去。<\/p><p>他把这两个词抄在英文旁边。batch 对一括，transfer 对送金。他觉得自己搞清楚了。<\/p><p>第二天他把这个发给周冉。周冉回了两个字：「不错。」过了一分钟又补一句：「你搞清楚的是词。人还没搞清楚。」<\/p><p>翻译这件事，他一开始以为很简单。<\/p><p>他用的是 AI。AI 就像一个什么都懂一点的实习生，你给它一段中文，它一秒钟给你一段英文，看着像那么回事。他把网站上所有的文字扔进去，一个晚上，三种语言全出来了。<\/p><p>沈月端着一碗汤圆进来，从他背后看了一眼屏幕。<\/p><p>「你什么时候会日语了？」<\/p><p>「机器会。」<\/p><p>「机器会，你就敢放上去？」<\/p><p>他停下来。<\/p><p>「你要是用一个日本人做的记账软件，」沈月说，「里面的中文全是机器翻的，你信不信它？」<\/p><p>「不信。」<\/p><p>「那你还放。」她把汤圆放在桌上。「吃了再干。」<\/p><p>他吃了汤圆。吃完，他把 AI 翻出来的三种语言全部标成「待校对」。<\/p><p>先做结构。<\/p><p>结构他花了一个周末。他做了一张翻译文件表。这张表像五金店货架上的标签，一件东西，一个标签，标签上三行字，中文、英文、日文。页面上每一句话，不再写死在页面里，而是从表里取。用户选哪种语言，页面就去表里取哪一行。<\/p><p>第二件事是路径。路径就是门牌号。他没有做「一个门牌，门口挂个牌子写着我们也说英语」。他给每种语言一个自己的门牌：kada.tools/en，kada.tools/ja，kada.tools/ko。搜索引擎就像邮递员，一个门牌算一户人家，分别登记。要是三种语言挤在一个门牌里，邮递员只登记一次，日本人搜日语，找不到那户人家。<\/p><p>这两件事都不难，只是烦。他周日凌晨两点写完，把网站在本地跑起来，切到日语。整个页面变成他看不懂的字，只有「咔哒工具箱」四个字他认识。<\/p><p>他把广告横幅也一起切了一下。绿底黄字，闪，在日语页面上也闪。<\/p><p>他关了电脑。<\/p><p>那个周末他还顺手把授权撤销改了一版。上线才几天，就有两个人来信说找不到撤销按钮。他把按钮放大了一倍。<\/p><p>搜索词表里，「revoke」出现了三十一次，比中文的「授权撤销」多一倍。他把这个工具的英文页面排在第一个做。<\/p><p>周一，1 月 6 日。他在群里发了一条消息。<\/p><p>「咔哒要上英日韩三种语言。翻译是机器初翻，我自己看不懂。找母语的人帮我校对。给不了钱。以后咔哒会出一个 Pro，一年不收手续费，先欠你们一年。」<\/p><p>他还没有 Pro。他打字的时候才决定叫这个名字。<\/p><p>发完他去上班。公司里方哲在开会，讲今年要「降本增效」，每个人的脸都平着。他坐在角落，手机在裤兜里震了三次。<\/p><p>中午他在食堂看群。<\/p><p>大鹏第一个回：「韩语我认识一个人！在首尔做社区的，叫敏智，我拉她进来。」<\/p><p>一个叫 Ben 的澳大利亚人回了一句英文，意思是，他用批量转账发过三次空投，英文他可以看。<\/p><p>第三条是一个他没见过的头像，一个灰色的圆。名字是 Yamada。<\/p><p>「你好。我是山田。我在日本，用你的工具做过两次转账。日语我可以帮忙。请把文件发给我。我会认真看。」<\/p><p>中文写的，每一句都很短，像从教科书上抄下来的。<\/p><p>林拓回了一个「谢谢」，把日语文件发过去。<\/p><p>三天没有消息。<\/p><p>第四天，1 月 10 日，晚上九点，山田发来一张表。<\/p><p>不是改好的文件。是一张表，三列：原文，问题，建议。二十七行。<\/p><p>第一行是「转账」。<\/p><p>「你把『转账』翻成了『転送』。『転送』在日语里是转发，转发邮件，转发包裹。钱的话，要用『送金』。日本人看到『一括転送』，会以为是把邮件批量转发出去。」<\/p><p>第二行是「钱包」。<\/p><p>「『財布』是裤子口袋里那个。链上的钱包，日本人说『ウォレット』。用『財布』不算错，但会显得你不懂。」<\/p><p>第三行是「手续费」。第四行是按钮上的「确认」。第五行是「网站不碰你的私钥」那句话，他写：「这句话很重要。机器翻得太软了。我改硬了一点。」<\/p><p>二十七行，每一行后面都有理由。<\/p><p>林拓一行一行看。看到最后一行，山田写：「以上是我的意见。如果有不同意的地方，请告诉我，我们可以讨论。」<\/p><p>他把这张表看了两遍，回了一句：「全部接受。谢谢你。」<\/p><p>山田回：「不客气。有几个地方我不确定，我问了一个做交易所的朋友。他说你的工具很好。」<\/p><p>林拓盯着这句话看了一会儿。<\/p><p>他起来去洗了个碗。碗是干净的，他又洗了一遍。<\/p><p>敏智的韩语校对第二天到了，改了十九处。Ben 的英文改得最少，八处，但把首页那句「我们只是一把扳手，钱一直在你自己口袋里」重写了一遍。他说原来那句英文像说明书，他改成了像人说的话。<\/p><p>1 月 12 日凌晨，三种语言上线。<\/p><p>他在圈子和推上各发了一条。推上那条是英文的，Ben 帮他看过。<\/p><p>发完他坐在阳台上，把三个页面各切了一遍。英文的他能看懂。日文和韩文他一个字不认识，只能看排版有没有断掉，按钮有没有掉出框。<\/p><p>沈月睡了。客厅的灯关着。他把屏幕亮度调低，又看了一遍日文首页。「送金」两个字在标题里，是山田改的。他忽然想起自己抄在本子上那两个词。他查对了，AI 翻错了。要是没有山田，这个错会在首页挂一年。<\/p><p>然后什么都没发生。<\/p><p>第一天，英文页面进来十一个人，日文两个，韩文零。第二天差不多。第三天日文是零。<\/p><p>他每天早上刷一次后台，晚上刷一次。刷完把数字记在本子上。<\/p><p>第五天，1 月 17 日，早上。日文页面，十四个。<\/p><p>他以为看错了，刷新了一下。十四。<\/p><p>他去看这十四个人从哪儿来。搜索引擎。搜的词是「一括送金 ツール」。<\/p><p>邮递员把那个门牌登记进去了。<\/p><p>1 月 20 日，周一。他在公司厕所里刷后台。日文页面，四十一个。英文一百零二。韩文十九。<\/p><p>他站在隔间里算了一下。一周前，这三个数字加起来是零。<\/p><p>晚上他在群里发了截图。山田回了一个鞠躬的表情。<\/p><p>大鹏回：「拓哥，你这是开了三家分店啊。」<\/p><p>老船长过了一会儿才回，还是那么慢：「三家分店，一个老板。你一个人能看几个门？」<\/p><p>林拓想了想，回：「先看着。」<\/p><p>「看着可以。」老船长说，「每个门口放一个人。你不用付工资，但要记得他们的名字。」<\/p><p>他把山田、敏智、Ben 三个名字写在本子上，写在那十行语言的旁边。<\/p><p>周冉回了一句：「日本人进来以后干了什么？看没看第二页？」<\/p><p>他去看。日文用户平均看了三页，有六个人用了批量转账。韩文用户平均看一页半，走了。<\/p><p>「韩文页面有问题。」周冉说。「不是翻译，是入口。你去看首页他们点了什么。」<\/p><p>他去看。韩文用户进来后，点得最多的是语言切换按钮，切回英文。<\/p><p>他把这个发给敏智。敏智说，韩国人做这行的，英文都好，看到一个韩文站反而不放心，怕是骗子。<\/p><p>「那我韩文白做了。」<\/p><p>「没白做。」敏智说。「搜索是韩文搜的。进门以后他们想看英文，让他们看就是了。」<\/p><p>他把韩文页面的语言切换按钮放大了一点。<\/p><p>第二天在公司茶水间，小杜凑过来，压低声音。<\/p><p>「你那个站，有日语了？」<\/p><p>「嗯。」<\/p><p>「你会日语？」<\/p><p>「不会。」<\/p><p>小杜想了几秒。「那你怎么知道翻得对不对？」<\/p><p>「找会的人看。」<\/p><p>「找的谁？」<\/p><p>「用户。」<\/p><p>小杜端着杯子站了一会儿，说：「我要是做站，第一反应是自己学。」<\/p><p>「学要一年。」林拓说，「他们看要三天。」<\/p><p>那天晚上，用户群里有人又提了广告的事。<\/p><p>「拓哥，那个绿的黄的，能不能撤了。我在日本客户面前打开你的站，他第一句问我这是什么。」<\/p><p>下面有人接：「上次说过了，一直没撤。」<\/p><p>「我用了半年，头一回觉得这个站像个野路子。」<\/p><p>三条消息，他看了三遍。<\/p><p>一个月六百块。去年十二月收入两千三，六百块是四分之一。<\/p><p>他去找沈月。沈月在沙发上看书。<\/p><p>「广告我想撤了。」<\/p><p>「一个月多少？」<\/p><p>「六百。」<\/p><p>「撤。」沈月说，头没抬。<\/p><p>「四分之一收入。」<\/p><p>「你爸店门口贴过别人的广告没有？」<\/p><p>他想了一下。没有。二十六年，卷帘门上只有「建国五金」四个字，和一个电话。<\/p><p>「他不贴，是没人给他钱。」林拓说。<\/p><p>「他不贴，是怕老主顾进门先看见别人。」沈月翻了一页。「你自己在店里看了三天，看的什么。」<\/p><p>他回到阳台，把广告代码删了。三行。<\/p><p>页面刷新。右下角空了一块，白的。整个页面忽然变得很安静。<\/p><p>他在群里回了一句：「撤了。骂得对。」<\/p><p>那条消息下面，十几个人点了赞。山田回了一句：「干净了。」<\/p><p>1 月 22 日，公司发了年终奖。比去年少三千。方哲在群里说了句「今年不容易，明年一起努力」，没人回。<\/p><p>1 月 25 日，是月底最后一个周六，不打烊茶馆有聚会。他没去成，请了假。他要提前回老家，父亲让他早点回去帮忙盘货。老船长在群里说：「去吧。船靠岸也是航行。」<\/p><p>春节那七天，他在县城。店里信号不好，他每天晚上走到街口，蹭一下隔壁面馆的网，看一眼后台，看完把手机揣回口袋。父亲问他看什么，他说看店。父亲没再问。<\/p><p>正月初八，他回杭州。高铁到站是下午四点。沈月比他早两天回来。他到家时她去了菜市场，他打开电脑。<\/p><p>后台。日文页面，一天五十六个。英文一百三十。韩文二十四。<\/p><p>七天没动，数字自己长了。他把这一行记进本子。<\/p><p>邮箱里有三十几封没读的邮件。大部分是平台通知。有一封是山田的，标题是英文：About a transfer amount.<\/p><p>他点开。<\/p><p>「林先生，新年快乐。有一件事，我不太确定，所以先写邮件给你，没有发在群里。」<\/p><p>「上个月 23 号，我用批量转账给三十个地址发了一种代币。我填的是每个地址 100 个。发完以后，有一个收款的朋友告诉我，他收到的是 1000 个。我查了链上记录，三十个地址，都是 1000 个。」<\/p><p>「我不确定是我填错了，还是别的原因。我把当时的截图放在附件里。金额好像不对。请你看一下。如果是我的问题，请告诉我，我很抱歉打扰。」<\/p><p>「山田」<\/p><p>林拓把附件点开。<\/p><p>一张手机截图。日文页面，批量转账，三十行地址，每一行后面是数字：100。最下面一行是合计。<\/p><p>他把图放大。再放大。<\/p><p>合计那一行，小数点后面，多了一位。<\/p><aside class=\"log\"><div class=\"log-label\">航海日志<\/div><p>1 月 20 日。上线日语、韩语、英语。用的是 AI 初翻，三个母语用户校对，我用一年免费 Pro 换的。Pro 还没有，先欠着。<\/p><p>日语流量从 0 到每天 40。方法只有一条：每种语言一个独立路径，让搜索引擎分别收录。<\/p><p>顺便把广告撤了。一个月 600 块。用户骂了三次，第三次我听了。<\/p><p>下一个目标：十种语言。今天划掉了三种。<\/p><\/aside>", "words": 4826}, {"num": 10, "title": "第一次事故", "vol": 1, "html": "<p>2025 年 2 月 5 日，正月初八，晚上七点。杭州滨江。<\/p><p>林拓坐在阳台的小桌子前，行李箱还在客厅没打开。沈月去菜市场了。屏幕上是山田那张截图，放大到最大，一个个数字像积木一样摆着。<\/p><p>合计那一行，小数点后面有七个零。<\/p><p>他记得很清楚，这种代币的小数位是六位。<\/p><p>他先解释一下这件事。链上的钱不按「个」记，按最小单位记，像银行记账只记「分」，不记「元」。一个代币等于多少「分」，每种代币自己定。最常见的是十八位，一个等于一后面十八个零。山田转的这种是六位，一个等于一百万分。用户在页面上填一百个，程序要把它换成分，再发到链上。<\/p><p>他打开代码，找到换算那一段。<\/p><p>那里有两把尺子。一把是给常见代币用的，刻度写死是十八，用了半年，没出过错。另一把是十二月加的，给少见的代币用，刻度从合约里读出来。读出来是六。<\/p><p>他在六旁边加了一。<\/p><p>他盯着那个加一看。想起来了。那个加一是给屏幕显示用的，小数点要占一个格。他写显示的时候加的，写完顺手把这个变量也用到了换算里。<\/p><p>程序把六位当成了七位。多乘了一个十。就像有人告诉你一元等于一百分，你记成了一元等于一千分。用户说转一百元，你给他转出去一千元。<\/p><p>十八位的代币没事，因为走的是另一把尺子。只有少见的代币，只有十二月以后，只有走了第二把尺子的那些转账。<\/p><p>他把手放在键盘上，没动。<\/p><p>沈月回来了，塑料袋放在厨房台面上，进来看了他一眼。<\/p><p>「怎么了？」<\/p><p>「出事了。」<\/p><p>「多大的事？」<\/p><p>「还不知道。」<\/p><p>「那先吃饭。」<\/p><p>他没吃。他打开链上记录，把十二月以来经过他那个批量合约的转账全拉出来。批量合约就像一个大信封，用户把几百笔转账塞进去，一次寄出，省邮费。他要在这些信封里找出哪几封走了第二把尺子。<\/p><p>一共一千九百多笔。走第二把尺子的，二十二笔。其中转的代币小数位是六位的，五笔。五笔来自三个地址。<\/p><p>三个人。<\/p><p>一个是山田。一个地址他认识，是群里一个叫「老麦」的用户，做空投的。第三个地址他没见过，页面语言记录是英文。<\/p><p>他把三个人多转出去的部分算了一遍。代币不值钱，一个几分钱。山田多转了两万七千个，老麦多转了一万一千个，那个陌生地址多转了四万个。按当天的价折成人民币，加起来三千九百多。<\/p><p>四千块。<\/p><p>他把这个数字写在本子上，坐在那里看。<\/p><p>十一点，沈月睡了。他还坐着。<\/p><p>他脑子里第一件事是，怎么解释。<\/p><p>要说清楚这是「少见代币」「特定情况」，说清楚十八位的没事，说清楚用户应该在确认页再看一眼。他甚至已经想好了第一句话：「由于部分代币的小数位设置不同……」<\/p><p>他把这句话打在文档里，看了一会儿，删了。<\/p><p>他想起父亲。<\/p><p>除夕前两天，店里来了一个老头，拿着一把断了柄的锤子。父亲接过去，看了一眼，从货架上拿了一根新柄，装上，敲了两下，递回去。老头问多少钱，父亲说不要钱。老头走了。林拓问，那根柄不要本钱？父亲说，他下次买东西还来这儿。<\/p><p>修东西不收钱。<\/p><p>他把文档关了，打开代码。<\/p><p>修用了两个小时。把那个加一从换算里拿掉，只留在显示里。然后他给每一种代币加了一道检查。换算之前先读一遍小数位，换算之后再倒着算回来。两边对不上就不让发。<\/p><p>凌晨一点四十，他把修好的版本发上线。<\/p><p>然后他打开邮箱，给山田回信。<\/p><p>「山田先生，您没有填错。是我的程序错了。这种代币的小数位是六位，我的程序按七位算，多转了十倍。受影响的一共三个人，您是第一个告诉我的。多转出去的部分，我按当天价格折算，全部补给您。手续费也全退。程序已经修好。我会写一份公开的报告。抱歉。」<\/p><p>发完，他给老麦发了消息。老麦在群里，他把话说了一遍。<\/p><p>第三个地址，他找不到人。<\/p><p>他坐在那儿想了一会儿。然后在网站首页最上面加了一条黄色的横条，中英日韩四种语言。「批量转账在 2024 年 12 月到 2025 年 2 月 5 日之间有一个错误，影响三个用户。如果您的地址是 0x4a…，请联系我。」<\/p><p>凌晨三点，他去睡了。六点半起来，去公司。<\/p><p>白天他什么都没干成。方哲在会上说了什么，他一句没听见。中午在食堂，他把本子拿出来，写了四行：<\/p><p>修。赔。公开。防。<\/p><p>修，做完了。赔，四千块。公开，报告。防，测试。<\/p><p>晚上回家，他跟沈月说了。<\/p><p>「四千块。」沈月说。<\/p><p>「嗯。」<\/p><p>「你上个月收入多少？」<\/p><p>「三千一。」<\/p><p>「一个多月的钱。」<\/p><p>「嗯。」<\/p><p>沈月没说话。过了一会儿，她问：「你想怎么办？」<\/p><p>「手续费肯定退。多转的那部分，我想……」他停了一下。「不是我转的，是他们自己点的确认。」<\/p><p>「你自己信这句话吗？」<\/p><p>他没答。<\/p><p>「补。」沈月说。<\/p><p>「四千。」<\/p><p>「补。」沈月站起来去厨房，走到门口回过头。「你要是不补，以后每次收到手续费，你都会想起这四千块。补了，你就想不起来了。」<\/p><p>他坐在那儿，听见厨房水龙头的声音。<\/p><p>他把四千块分成三份。前两份转了出去。老麦当晚就收到了，回了一句「拓哥你这样搞我都不好意思了」。山田那份第二天早上到，山田回了一封邮件。<\/p><p>「林先生，钱收到了。这个代币很便宜，您不需要补这么多。但我明白您的意思。我会把这件事告诉我的朋友。不是坏话。」<\/p><p>第三份，他放在一个单独的地址里，等着。<\/p><p>周五晚上周冉打电话来。她已经看到群里的事了。<\/p><p>「你跟这三个人聊过没有？」<\/p><p>「发了消息，赔了钱。」<\/p><p>「那不叫聊。」周冉说，「你知道他们为什么没发现吗？三个人，只有一个发现了，还是收款的人告诉他的。另外两个到现在都不知道自己多转了。」<\/p><p>「代币便宜。」<\/p><p>「不是便宜。是他们从来不核对。你的确认页上有合计，他们不看。为什么不看？」<\/p><p>他想了想。「习惯了。」<\/p><p>「习惯了信你。」周冉说，「所以你不能只赔钱。你得去问他们，下次怎样才会看。问了再改确认页。先别改。」<\/p><p>他去问了老麦。老麦说，确认页上数字太多，三十行，眼睛滑过去了。要是把合计单独放大，红字，他会看。<\/p><p>他又去问山田。山田想了一晚上，回了一句：「如果页面告诉我，这笔转账比我上一次多了十倍，我会停下来。」<\/p><p>他把这两句话写进了本子。<\/p><p>周末，2 月 8 日，他写报告。<\/p><p>他写了三遍。<\/p><p>第一遍写了一千多字，把技术原理讲了一大段。周冉在群里看了初稿，回了一句：「谁看这个？用户不需要知道你的尺子。他们需要知道三件事：你搞砸了什么，跟我有没有关系，你以后还会不会搞砸。」<\/p><p>第二遍他删到四百字。周冉说：「别写『可能』。是就是。第一句话别道歉，先说事实，道歉放最后。」<\/p><p>第三遍，他写成了这样：<\/p><p>「事故报告 · 批量转账金额错误<\/p><p>发生了什么：2024 年 12 月 14 日到 2025 年 2 月 5 日，批量转账在处理小数位为 6 位的代币时，实际转出金额是用户填写金额的 10 倍。原因是我在换算时用错了一个变量。<\/p><p>影响谁：3 个用户，5 笔转账，多转出的部分折合约 ¥4,000。其余转账不受影响。18 位小数的代币从未受影响。<\/p><p>怎么修的：2 月 6 日凌晨 1:40 修复上线。3 个用户的手续费全退，多转的部分我个人全额补偿。其中 1 个用户我还没联系上，地址前四位是 0x4a，请看到这条的人帮忙转发。<\/p><p>以后怎么防：①每接入一种新代币，先测小数位，18、6、8、0 四种都要过一遍。②换算之后反向算回来，对不上不让发。③确认页同时显示「你填的数」和「链上实际的数」。<\/p><p>这是咔哒的第一次事故。抱歉。<\/p><p>林拓，2 月 8 日」<\/p><p>他把报告发在网站上，发在圈子里，发在推上，发在用户群里。发的时候手心有汗。<\/p><p>用户群安静了几分钟。<\/p><p>然后大鹏回了一句：「拓哥这个报告写得比我们公司年报还清楚。」<\/p><p>有人回：「四千块自己掏的？」<\/p><p>「嗯。」<\/p><p>「牛的。」<\/p><p>老船长的消息隔了半小时才来。<\/p><p>「工具站的护城河是信任，不是功能。功能别人一个月能抄完。信任要一年，丢掉只要一天。你今天把这一天变成了加分。」<\/p><p>林拓看了很久。回了一个字：「嗯。」<\/p><p>老船长又发了一条：「顺便说一句，报告里那个『我个人全额补偿』，以后别写。写『全额补偿』就够了。你是一个站，不是一个人。」<\/p><p>他回：「记住了。」<\/p><p>第四条是「防」。<\/p><p>周日他花了一整天写测试用例。测试用例就像五金店进了一批新货，父亲会在柜台上先试一遍，扳手拧一下，锤子敲两下，试过了才上架。以前他没有这个柜台。所有东西进来直接上货架。<\/p><p>他做了一张表。四种小数位，每种三个金额：整数、带小数、极小的数。十二个格子，每个格子换算过去，再换算回来，两边对得上才算过。<\/p><p>跑完的时候是晚上十点，十二个格子全绿。<\/p><p>他把这张表也贴在了报告下面。<\/p><p>然后他改确认页。合计单独一行，放大，红字。旁边是链上实际要发的那个长数字。再加一条：这笔转账的总额如果比这个地址上一次多出五倍以上，页面先弹一句话，问一遍「您确定吗」。<\/p><p>老麦要的那个，山田要的那个，都在里面。他没有多加一个自己想的。<\/p><p>事情本来到这里就结束了。<\/p><p>2 月 10 日，周一，他在公司刷了一下后台。访客比前一周多了三成。<\/p><p>他去看来源。推上，有一个他不认识的账号转发了他的事故报告，配了一句英文，意思是：这才是工具站该有的样子。那条转发下面，有二百多个转发。<\/p><p>他一条一条往下看。有人说这种小站敢公开事故，比大平台强。有人说自己被别的工具坑过一万块，连一封邮件都没收到。有人问链接。<\/p><p>日文页面那天来了七十个人。山田在群里说，他把报告发给了三个做交易所的朋友。<\/p><p>那天晚上他第一次问山田是做什么的。<\/p><p>山田说，他在东京一家小游戏公司做社区，二十几个人，游戏里有一种代币，每个月要给玩家发奖励。以前发一次要手动点三百次，点到手抖。用了咔哒以后，一次三十秒。<\/p><p>「所以您的工具对我很重要。」山田写，「我不希望它出事。但出了事您这样处理，我更放心了。」<\/p><p>林拓回：「以后有问题，请第一个告诉我。」<\/p><p>「我会的。」<\/p><p>2 月 11 日，那个 0x4a 的地址来了邮件。英文，很短。一个在柏林的用户。他说他根本没发现多转了，看到报告才去查。他说：「你不用补。但既然你已经说了要补，我收下。以后我只用你的站。」<\/p><p>林拓把第三份钱转了过去。<\/p><p>他把「还没联系上」那一句从报告里改成了「已全部联系上」。<\/p><p>那天晚上他写了航海日志。写完看了一遍，去洗碗。<\/p><p>碗是沈月刚洗过的。他又洗了一遍。<\/p><p>2 月剩下的十几天，他没再出事。<\/p><p>2 月 22 日，周六，不打烊茶馆。<\/p><p>这是他今年第一次去。老船长坐在老位置，紫砂壶，普洱，杯子摆了一圈。人到了七个。<\/p><p>老船长没提事故。聊到一半，他忽然说：「我讲一个小事。」<\/p><p>大家安静下来。<\/p><p>「2016 年，我有一个 App，查快递的。有一天服务器出问题，一批用户的快递单号发错了人。不多，几十个。我当时想，几十个，不吭声，改了就完了。」<\/p><p>他倒了一杯茶。<\/p><p>「改了。没人发现。过了两个月，有一个用户在应用商店留言，说他的单号被别人看到了，问是不是我们泄露的。我没回。一个星期，评分从四点七掉到三点九。」<\/p><p>「后来呢？」小杜问。<\/p><p>「后来我发了一个说明。太晚了。人家已经认定你藏了两个月。」老船长看着林拓。「你这次报告发得快。快就值钱。」<\/p><p>林拓说：「周冉逼的。」<\/p><p>「逼得好。」<\/p><p>回去的路上，小杜在地铁上问他：「四千块，你真不心疼？」<\/p><p>「疼。」<\/p><p>「那你怎么想的？」<\/p><p>「想了一晚上。」他说，「想通了，就不疼了。」<\/p><p>他做了第五个工具，合约部署器。部署器就像一个装好的工具箱，以前每个人要自己去买零件、自己拧，现在打开盖子就能用。这个工具是英文用户在群里要的，要了三次。2 月 27 日，他先给群里二十个人试，没对外放。这一次他学乖了，先试，再上架。<\/p><p>2 月 28 日，周五。他在阳台上算了月账。<\/p><p>手续费四千八，Pro 还没有。多语言带来的英文和日文用户，占了手续费的一半。加上七百多块零散的，二月收入五千六。<\/p><p>他把这个数字记在本子上，跟一月那行比了一下。一月是三千一。<\/p><p>存款那一栏，他扣掉四千，写了个十一万二。<\/p><p>他在数字后面写了一句：这四千是学费。<\/p><p>沈月从背后看到了这句话。「你这学费交得不亏。」<\/p><p>「你怎么知道？」<\/p><p>「群里那些人，以后出事了，第一个想到的是你。」<\/p><p>3 月 1 日，周六晚上。他在群里发上月收入截图，五千六，配了一句「多语言起作用了」。<\/p><p>群里正热闹的时候，一个用户私信了他一个链接。<\/p><p>「拓哥，这是你的站吗？」<\/p><p>他点开。<\/p><p>首页，绿色的工具箱图标，「咔哒工具箱」四个字，「我们只是一把扳手，钱一直在你自己口袋里」。四个工具排成一行。<\/p><p>一模一样。<\/p><p>他抬头看地址栏。<\/p><p>kadatools.xyz。<\/p><aside class=\"log\"><div class=\"log-label\">航海日志<\/div><p>2 月 11 日。出了事故。批量转账把一种 6 位小数的代币按 7 位算，多转了十倍。3 个用户，4,000 块。全赔。报告在这里，谁都能看。<\/p><p>四步：修、赔、公开、防。修用了 2 小时，赔用了 4,000 块，报告改了 3 遍，测试表 12 个格子。<\/p><p>意外的是，报告发出去以后，访客涨了三成。老船长说，护城河是信任。<\/p><p>以后每种代币接进来，先测小数位。这句话我贴在屏幕上了。<\/p><\/aside>", "words": 4945}, {"num": 11, "title": "抄袭者", "vol": 1, "html": "<p>2025 年 3 月 2 日，周日早上七点。杭州滨江。<\/p><p>林拓没睡好。他坐在阳台上，屏幕上开着两个窗口，左边是 kada.tools，右边是 kadatools.xyz。他把两个窗口并排，一行一行对。<\/p><p>图标一样。四个工具的名字一样。首页那句「我们只是一把扳手，钱一直在你自己口袋里」一样，连标点都一样。往下拉，「常见问题」十二条，一样。最底下的「关于」，写的是「我们是一支热爱区块链的团队」。<\/p><p>他的「关于」写的是「一个人做的。有问题直接找我」。<\/p><p>只有这一处不一样。<\/p><p>他打开搜索引擎，搜「批量转账 工具」。<\/p><p>第一条结果，左上角有一个小小的「广告」标记。kadatools.xyz。<\/p><p>广告位就像商场门口花钱租的摊位。你的店在里面，人家的摊位摆在门口，客人先看见谁，不用说。他自己的站在第二条，没有标记。<\/p><p>他搜了英文，搜了日文。日文那条也是。对方连三种语言都抄了，山田改的「送金」也抄走了。<\/p><p>沈月起来了，看见他坐着不动。<\/p><p>「还在看？」<\/p><p>「嗯。」<\/p><p>「看出什么了？」<\/p><p>「他连我改错的那个错别字都抄了。」<\/p><p>沈月凑过来看了一眼。「那不是好事吗，证明是抄你的。」<\/p><p>他没笑。<\/p><p>那天他做了三件事。<\/p><p>第一件，查域名。域名就像门牌，谁登记的、什么时候登记的，能查。查出来是 2 月 20 日，登记人打了码，服务器在海外。<\/p><p>第二件，写投诉。他给搜索引擎的广告平台写了一封，附上两个站的对比截图，说对方抄袭。写了七百字。他又给域名商写了一封。<\/p><p>第三件，他打开代码，想在页面上加水印。所有文字底下垫一层淡淡的「kada.tools」。<\/p><p>写到一半，他停了。加了水印，用户看着难受，抄的人把那一层删掉就完了。<\/p><p>他删了水印，又在本子上写了一个词：改名。<\/p><p>要是叫别的名字，对方抄的就是一个旧名字。<\/p><p>沈月晚上看到本子上那两个字。<\/p><p>「改名？」<\/p><p>「嗯。」<\/p><p>「你爸的店叫什么？」<\/p><p>「建国五金。」<\/p><p>「隔壁要是开了一家『建国五金二店』，你爸改名吗？」<\/p><p>他想了一下。「不改。」<\/p><p>「为什么？」<\/p><p>「老主顾认那块牌子。」<\/p><p>「那你改什么。」沈月把本子合上。「你那个『咔哒』，是你爸工具箱的声音。别人抄得走字，抄不走那个声音。」<\/p><p>他把「改名」划掉了。<\/p><p>周一，3 月 3 日，投诉回信来了。广告平台说，已收到，将在十五个工作日内处理。域名商说，抄袭属于知识产权纠纷，请提供法院判决。<\/p><p>他把两封信发给周冉。周冉正在开会，过了两个小时才回，直接打电话。<\/p><p>「你打算打官司？」<\/p><p>「问问。」<\/p><p>「问了，律师费两万起，跨境，一年。你的站一个月五千六。」<\/p><p>他没吭声。<\/p><p>「我告诉你我们以前怎么处理这种事的。」周冉说。「不处理。」<\/p><p>「不处理？」<\/p><p>「你听我说完。他抄得走页面，抄不走你每周的更新，抄不走你群里三百个人。他今天抄的是 3 月 2 日的你。你要是 3 月 9 日还是 3 月 2 日那个样子，那他抄得对。你要是每周都不一样，他每周都得重抄一遍。抄一个月，他就累了。」<\/p><p>「他买广告，排我前面。」<\/p><p>「他一天烧两百块，你能跟他烧吗？」<\/p><p>「不能。」<\/p><p>「那就别跟他拼钱。跟他拼时间。你一个人，他也一个人，可能还是外包。你有三百个人，他一个也没有。」<\/p><p>「怎么拼？」<\/p><p>「四件事。」周冉说得很快，像早就想好了。「一，每周上一个新工具，别停。二，把你那个松松垮垮的群变成正式的，你每天在里面。三，你每次改了什么，公开写出来，有日期。四，让老用户去外面写评价。他抄页面，抄不了评价。」<\/p><p>「就这些？」<\/p><p>「就这些。先别写投诉信了。写代码去。」<\/p><p>他挂了电话，把那七百字的投诉信关了。<\/p><p>第一件事，工具。<\/p><p>合约部署器在群里试了一周，二十个人提了三十几条意见。3 月 7 日，周五，他把它对所有人开放。第二天，抄袭站上还是四个工具。<\/p><p>第二周他做事件扫描。链上每一笔交易都会留下一行记录，像每个进店的人在门口签个到。事件扫描就是把这些签到一页一页翻出来，找出你要的那一个。做空投的人天天要用，以前得自己写程序翻。<\/p><p>他周一开始，周五凌晨写完，周六上线。用了六天。<\/p><p>那一周他每天睡四个小时。周三下午，他在公司写一段查询，写着写着，屏幕上的字排成了一行一行签到记录。小杜在旁边碰了他一下。<\/p><p>「方哲刚才叫你。」<\/p><p>「啊？」<\/p><p>「叫了两遍。」<\/p><p>他站起来去方哲工位。方哲问他一个接口的事，他答了，答得对。方哲看了他一眼，说：「你最近黑眼圈挺重。」<\/p><p>「没睡好。」<\/p><p>「悠着点。」方哲说，「今年不比往年。」<\/p><p>他回到座位，把这句话在脑子里过了一遍，不知道方哲说的是他，还是公司。<\/p><p>第二件事，群。<\/p><p>他之前有一个群，是去年十月随手建的，三百来个人，大部分不说话，有事才冒出来。他新建了一个，取名「咔哒用户群」，进群要回答一个问题：你用咔哒的哪个工具，干什么用。<\/p><p>答不上来的不拉。<\/p><p>他把旧群的人一个一个请过去。三天，二百八十人。他又开了一个英文群，在海外的聊天软件上，山田、Ben、老麦的两个外国合伙人，四十几个人。<\/p><p>他给自己定了一条：每天在群里说一句话。不管有没有人问。<\/p><p>这是四律的第三条。他以前以为那是发帖。现在明白了，是在群里。<\/p><p>有一天他实在没什么可说的。事件扫描还差两天，没新东西。他在群里打了一行：「今天没更新。修了一个错别字，『授权』写成了『受权』，是敏智发现的。」<\/p><p>发完他觉得这句话没用。<\/p><p>十分钟后，一个做空投的人回：「原来拓哥也会写错字。」下面又有人接，说自己上周发空投把地址贴错了一个，还好余额雷达查出来了。三四个人聊起来，聊了一晚上，全是他们自己的事。<\/p><p>他没插话，看完了。第二天早上他发现，这个群他不在的时候也能自己转。<\/p><p>第三件事，更新日志。<\/p><p>他做了一个页面，kada.tools/changelog。这个页面就像五金店门口挂的小黑板，今天进了什么货，写上去，写日期。3 月 7 日，合约部署器开放。3 月 8 日，确认页红字合计。3 月 11 日，日语页面修了两处。3 月 15 日，事件扫描上线。<\/p><p>每一条都有日期。抄袭站可以抄页面，但抄不了日期。谁先做的，一眼看得出。<\/p><p>3 月 16 日，他发现抄袭站也做了一个更新日志页面。<\/p><p>他点进去看。四条。第一条是「3 月 10 日，合约部署器上线」。<\/p><p>他的是 3 月 7 日。<\/p><p>他把两个页面截图并排，发到群里，一个字没写。下面一排人在笑。老麦说：「他抄你抄出时差来了。」<\/p><p>从那天起，他每次上线新东西，先写日志，再发群。日志的时间戳就是证据。<\/p><p>他还养成了另一个习惯。每条日志末尾写一句，这条是谁提的。「敏智」「老麦」「英文群的 Ben」。抄袭站可以抄这些名字，但这些人不会认它。<\/p><p>第四件事，评价。<\/p><p>他在群里说了一句：「有人抄了咔哒的站。我不打算告他。我想请用过的人，去外面说一句真话，好的坏的都行。」<\/p><p>他发了三个地方的链接，海外的一个工具评价站，猎品榜，还有推。<\/p><p>大鹏第一个跳出来。<\/p><p>「什么人啊这是，连扳手那句都抄。拓哥你
