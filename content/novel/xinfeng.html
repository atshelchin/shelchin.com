把链接发我，我拉五十个人去举报他。」<\/p><p>「别举报。」<\/p><p>「为什么不举报？」<\/p><p>「刷举报，我跟他就一样了。」<\/p><p>大鹏安静了一会儿，回：「行。那我写评价。写长的。」<\/p><p>那天晚上，评价站上多了十一条。大鹏写了六百字，从三百个地址那天写起。老麦写了事故那件事，说「多转四千块他自己赔的，你去问问别的站谁干这个」。山田用日语写了一条，又用英语写了一遍。Ben 写了一句：「一个人做的站，回邮件比大公司快。」<\/p><p>第二天，猎品榜上咔哒的评论从三条变成十九条。<\/p><p>抄袭站上没有一条评价。<\/p><p>3 月 17 日，周冉发来一张他后台的截图，是他昨天发群里的。她在上面画了两个圈。<\/p><p>「搜索来的，这两周没涨，被他的广告堵了。直接访问，涨了四成。」<\/p><p>直接访问，就是不经过搜索，自己在地址栏打 kada.tools 进来的人。老主顾。<\/p><p>「你爸说的对。」周冉说，「老主顾比新客重要。他堵的是门口，堵不了熟人从后门进。」<\/p><p>「广告平台还没回我。」<\/p><p>「回不回都一样。等他钱烧完。」<\/p><p>3 月 18 日，周二，出了一件事。<\/p><p>他在群里看到一个新用户说，用 kadatools.xyz 转了一笔，成功了，但手续费好像扣了两次。<\/p><p>他先私信了那个用户，问要了交易记录。看了一遍，手续费没扣两次，是对方页面上的显示写错了，把手续费和转账金额加在一起显示了。钱没少。<\/p><p>他把这个告诉了那个用户。用户说，谢谢，那我下次用你的。他没说抄袭站一句坏话。<\/p><p>林拓愣了一下。他点进抄袭站，打开批量转账，把页面代码翻出来看。<\/p><p>代码里有一个地址。那是转账用的批量合约的地址。<\/p><p>他盯着那串地址，又打开自己的代码。<\/p><p>一样的。<\/p><p>抄袭站根本没有部署自己的合约。它的页面是抄的，但页面背后收钱、发钱的那个合约，还是他的。就像有人把他店面抄了一遍，连收银台都没换，客人在那边付钱，钱进了他这边的抽屉。<\/p><p>他坐了一会儿，先是想笑。抄袭站每一笔转账的手续费，千分之一，都进了他的合约。这两周他账上多出来的那几百块，有一部分是抄袭站送的。<\/p><p>然后他不笑了。<\/p><p>用户在那边转账，页面是别人的。要是哪天对方把页面里的收款地址偷偷改一个，用户的钱就转到别人口袋里去了。出了事，用户会说，我用的是咔哒的合约。<\/p><p>他不能让别人的门面挂着他的收银台。<\/p><p>他给周冉发了消息。周冉回了三个字：「加校验。」<\/p><p>他花了两天。办法是这样的：他的网站每次转账前，会给用户发一张当天有效的小票，小票上有他的签名。合约只认带小票的转账。抄袭站的页面拿不到小票，发过去的转账，合约不收。就像五金店的会员卡，只认自己店里发的。<\/p><p>3 月 20 日晚上，他把新版合约上线，旧版停了。<\/p><p>那天夜里两点，他刷了一下抄袭站。批量转账页面还在，点确认，转圈，然后一行红字：交易失败。<\/p><p>他截了图，放进本子里。<\/p><p>那天晚上沈月没睡，在客厅等他。<\/p><p>「你这周跟我说过几句话？」<\/p><p>他想了一下。「不多。」<\/p><p>「三句。」沈月说，「周一一句，周三一句，今天一句。今天这句是『饭在锅里吗』。」<\/p><p>他没说话。<\/p><p>「你比他快，我知道。」沈月说，「但你别比你自己快。你上次这样的时候，是做番茄账本。」<\/p><p>他坐到她旁边。<\/p><p>「下周慢一点。」他说。<\/p><p>「不用慢。」沈月说，「回来就行。回来的意思是，你看我一眼。」<\/p><p>他看了她一眼。<\/p><p>「行。」他说。<\/p><p>第二天群里有人问：「那个假站是不是挂了？」<\/p><p>「没挂。」林拓说，「只是转不了账了。」<\/p><p>「为什么？」<\/p><p>「他用的是我的合约。我换了锁。」<\/p><p>大鹏发了一排笑脸。<\/p><p>3 月 22 日，周六，他去了不打烊。<\/p><p>老船长听完，喝了一口茶，慢慢说：「2012 年我做站群，抄过别人，也被别人抄过。你知道抄来的站为什么活不长？」<\/p><p>「不更新。」<\/p><p>「不是。是抄的人不知道自己为什么这么做。他看你写『我们只是一把扳手』，抄了。但他不知道，这句话是你被人问了三十遍『你会不会碰我的钱』才写出来的。他不知道，就答不了下一个问题。」<\/p><p>老船长把杯子放下。<\/p><p>「三个月。我说的。」<\/p><p>小杜问：「那要是他也每周更新呢？」<\/p><p>「那他就不是抄袭者了。」老船长说，「是同行。同行不用怕。这行里的活多得很，两个人干不完。」<\/p><p>「那什么才用怕？」<\/p><p>老船长想了想。「你自己停下来。」<\/p><p>回去的地铁上，林拓把这句话记在本子上，记在「改名」那两个划掉的字底下。<\/p><p>3 月 29 日，事件扫描上线两周，用的人比合约部署器多一倍。做空投的人在群里说，以前翻记录要半小时，现在十秒。<\/p><p>抄袭站还在。广告还在。搜索「批量转账」，它还排第一。它的更新日志停在 3 月 10 日那一条，再没动过。<\/p><p>他不看了。本子上那句「你自己停下来」，他每天早上看一眼。<\/p><p>3 月 31 日，周一，晚上。他在阳台上算月账。<\/p><p>手续费一万零八百。合约部署器每次部署收一点固定费，六百多。剩下几百是零散的。<\/p><p>一万二千。<\/p><p>他把这个数字写在本子上，往上翻，翻到去年除夕在县城写的那一页。「明年目标：月入一万。」<\/p><p>他在那行字后面画了一个勾。画得很轻。<\/p><p>沈月那天做了一桌菜。四个菜一个汤，有他爱吃的辣椒炒肉。她一个字没提数字。<\/p><p>吃饭的时候她讲学校的事，讲一个学生把「咔哒」写进了作文，说是爸爸工具箱的声音。林拓听着，吃了两碗饭。<\/p><p>吃完，他去洗碗。<\/p><p>水开着。他洗得很慢，一个碗冲了三遍。<\/p><p>沈月在后面收桌子，收到一半，停下来。<\/p><p>「我妈问，」她说，「你们那个……是不是能当饭吃了。」<\/p><aside class=\"log\"><div class=\"log-label\">航海日志<\/div><p>3 月 31 日。月收入 12,000。第一次过一万。<\/p><p>这个月有人抄了我的站，连文案都抄，还买广告排我前面。我没告他。我的办法是比他快。<\/p><p>本月上线 2 个工具：合约部署器、事件扫描。建了正式用户群，每天说一句话。更新日志公开，每条有日期。老用户去外面写了三十多条评价。<\/p><p>抄袭站用的是我的合约，我加了来源校验。他的页面还在，转不了账了。<\/p><p>老船长说他活不过三个月。我不看他了。<\/p><\/aside>", "words": 4877}, {"num": 12, "title": "定价课", "vol": 1, "html": "<p>2025 年 4 月 1 日，周二，早上六点。杭州滨江。<\/p><p>林拓比闹钟早醒了半小时。他没起，躺着看天花板。昨天晚上沈月问的那句话还在。<\/p><p>我妈问，你们那个，是不是能当饭吃了。<\/p><p>他当时手上还有泡沫，回了一句：「能当半碗。」<\/p><p>沈月说：「哪半碗？」<\/p><p>他没答上来。<\/p><p>现在他起来，坐到阳台上，把三月的账翻开，想把那半碗算清楚。<\/p><p>一万二千块。手续费一万零八百，占了九成。合约部署器六百多，零散的几百。<\/p><p>九成靠手续费。手续费靠什么？靠有人转账。有人转账靠什么？靠行情。行情好，做空投的人一天发几万个地址；行情冷，一周没人动。<\/p><p>他往回翻。去年十月，行情冷了两周，手续费那两周加起来一百三十块。十二月热了一阵，一周就有八百。<\/p><p>这就是靠天吃饭。雨水多，收成好；不下雨，地里什么都没有。他的站是一块地，他自己从来没管过下不下雨。<\/p><p>他把这个算清楚了，还是答不上沈月的问题。半碗是哪半碗，要看天。<\/p><p>4 月 3 日，周四，手续费一天只有一百一十块。行情冷了。<\/p><p>他把三月的收入结构发到夜航船群里，附了一句：「九成靠手续费，很不稳。想做一个固定收费的东西。」<\/p><p>周冉回得很快。<\/p><p>「你跟几个用户聊过？」<\/p><p>「群里每天聊。」<\/p><p>「那不叫聊。我问的是，你坐下来，跟一个付过钱的人，认认真真谈过半小时吗？」<\/p><p>「没有。」<\/p><p>「那先别写代码。」周冉说，「你还没跟付钱的人聊过。你不知道他们怎么算这笔钱。」<\/p><p>晚上她打电话来，教他怎么做。<\/p><p>「五个人。付过钱的，用得多的。每个人三十分钟，语音，不发文字。」<\/p><p>「问什么？」<\/p><p>「不问『你想要什么功能』。这个问题没用，人人都说想要，做出来没人用，你那个番茄账本就是这么死的。」<\/p><p>「那问什么？」<\/p><p>「问『你现在怎么算这笔钱』。问他上个月付了多少，怎么付的，谁批的，付的时候心里怎么想的。问他以前用别的东西怎么付。问到他讲自己的事为止。你只管听，别推销，别解释，别说『我们下个版本会有』。」<\/p><p>「三十分钟够吗？」<\/p><p>「够。前十分钟他跟你客气，中间十分钟他说真话，最后十分钟他会说一句你没想到的话。记下来。」<\/p><p>「记什么？」<\/p><p>「记原话。别记你的理解。」<\/p><p>「还有一条。」周冉说，「每个人最后问一句：还有谁我应该聊？他说的那个人，比你自己挑的准。」<\/p><p>他挂了电话，在本子上写了五个名字：大鹏，山田，老麦，Ben，还有一个叫阿康的大学生，一年用两三次。<\/p><p>4 月 5 日，周六上午，第一个是大鹏。<\/p><p>「鹏哥，你上个月给咔哒付了多少？」<\/p><p>「不知道啊。手续费嘛，扣了就扣了。」<\/p><p>「大概呢？」<\/p><p>「让我看看。」大鹏翻了一会儿。「三百二。前一个月一百多，再前面……八十？」<\/p><p>「你们公司怎么报这笔钱？」<\/p><p>「报不了。」大鹏说，「这就是我头疼的地方。我们老板每个月问我，工具花多少钱，我说不准。他说不准就别用。我说这个好用啊。他说好用你给我一个数。我给不出来。」<\/p><p>「为什么给不出来？」<\/p><p>「你那个千分之一，我怎么知道下个月发多少空投？项目方临时加一批，我就多付。我算不清。」<\/p><p>大鹏停了一下。<\/p><p>「说实话，我宁愿一年付一次。你给我一个数，我拿去跟老板说，他签个字，这一年我用得踏实。现在这样，每次转账我都要想一下，这笔要扣多少。」<\/p><p>「一年多少你能接受？」<\/p><p>「你别问我这个，我不懂定价。」大鹏说，「你就告诉我一个数，我去要钱。」<\/p><p>三十分钟到了。林拓看本子，记了满满一页。最后一行是：「每笔 0.1% 我算不清，宁愿一年付一次。」<\/p><p>挂电话前他问：「鹏哥，还有谁我该聊聊？」<\/p><p>「老麦。」大鹏想都没想。「他跟我不一样，他自己的钱，他不在乎多少，他在乎别的。你去问他在乎什么。」<\/p><p>第二个是山田，周六晚上，日本时间九点。<\/p><p>山田先道歉，说他的中文口语不好，说慢一点。<\/p><p>「山田先生，您公司用咔哒，是怎么付钱的？」<\/p><p>「我个人付。手续费从我的钱包里出。」<\/p><p>「不是公司付？」<\/p><p>「公司没有办法付。」山田说，「我们公司要用一个工具，要有合同，或者至少有一张收据。您的网站没有这些。我跟我的上司说，这是一个免费的工具，只扣一点点手续费。上司问我，免费的东西，为什么不会消失？我答不出来。」<\/p><p>林拓在本子上写：免费的东西，为什么不会消失。<\/p><p>「所以您是……」<\/p><p>「我是自己付，不告诉公司。」山田说，「但这样不对。如果有一天工具不见了，我要向公司解释，为什么我们的奖励发不出去。」<\/p><p>「如果有一个付费版本，有收据，您公司会用吗？」<\/p><p>「会。」山田说得很快。「免费的，我不敢用。付了钱，我才敢跟上司说，这是我们买的东西。」<\/p><p>他停了一下。<\/p><p>「林先生，这句话可能有一点奇怪。但是免费让我害怕。」<\/p><p>三十分钟，林拓只问了四个问题。剩下的时间山田在讲他们公司怎么批预算。讲到一半，他说他们用的另一个海外工具一年收九万日元，上司没有犹豫就签了。<\/p><p>那天晚上他把「免费让我害怕」这句话念给沈月听。<\/p><p>沈月正在批作业，笔停了一下。<\/p><p>「我妈也这样。」她说，「小区门口有免费的书法班，她不去。她说免费的，教一半人就跑了。后来她报了一个一学期八百的，去了三年。」<\/p><p>「为什么？」<\/p><p>「付了钱，她觉得那个老师跑不掉。」沈月低头继续批。「你那个山田，跟我妈一个意思。」<\/p><p>第三个是老麦，周日下午。<\/p><p>「麦哥，你现在怎么算这笔钱？」<\/p><p>「不算。」<\/p><p>「一点都不算？」<\/p><p>「几百块的事，算什么。」老麦说，「我一个月发出去的空投几十万，你那点手续费，零头。」<\/p><p>「那你在乎什么？」<\/p><p>老麦想了一会儿。「出了事有人管。」<\/p><p>「怎么算有人管？」<\/p><p>「二月那次。」老麦说，「你自己掏四千块，凌晨一点四十修好，第二天报告就出来了。我以前用一个大站，出过一次事，一万多块，客服让我提交工单，等了十一天，回我一句『系统正常』。」<\/p><p>「所以……」<\/p><p>「所以我不在乎你收多少。我在乎你还在不在。你要是收个年费，能让你一直在，我付。」老麦停了一下，「但你别学那个大站，收了钱就把人当工单。」<\/p><p>二十分钟就完了。林拓在本子上记了一句：「我在乎你还在不在。」<\/p><p>第四个是 Ben。Ben 说他一年发三次空投，按次付挺好，别改。「不要逼我订阅。我讨厌订阅。」<\/p><p>第五个是阿康。阿康说他是学生，一年用两三次，每次几十个地址，手续费几块钱。「你要是收年费，我就不用了。我不是不想付，是我用不了那么多。」<\/p><p>五个人聊完，他把本子摊在桌上，看了很久。<\/p><p>大鹏要一个固定的数。山田要一张收据。老麦要有人管。Ben 要按次。阿康要免费。<\/p><p>他以前以为定价是选一个。现在看，是都要有。<\/p><p>他把五页笔记从头翻了一遍。五个人，没有一个提过「功能」两个字。他们说的全是钱怎么过手：谁批，怎么报，付完心里踏不踏实。要是他按老办法在群里发一份问卷，问「你希望增加什么功能」，收上来的会是五十条功能。一条都不会告诉他这些。<\/p><p>他在本子上画了两栏。左边写：按次，千分之一，不变。右边写：Pro，一年一个数，不收手续费，额度不设上限，问题优先回，开收据。<\/p><p>中间那一栏空着，是数字。<\/p><p>他打给大鹏，问：「一年九十九，行不行？」<\/p><p>大鹏在电话那头愣了两秒。<\/p><p>「九十九？一年？」<\/p><p>「嗯。」<\/p><p>「太便宜了，我不信。」<\/p><p>「为什么不信？」<\/p><p>「你自己算，我一个月手续费三百，一年就是三千多。你收我九十九？你不是要跑路吧。」大鹏说，「我跟老板说一年九十九，他要问我这是什么东西，是不是骗子。」<\/p><p>他愣住了。他以为便宜是好事。<\/p><p>他又打给山田，问了同一个数。山田沉默了一会儿，很礼貌地说：「可以。但是如果是九百九十九，我也会付。」<\/p><p>他把这两句话记在本子上，用笔框起来。<\/p><p>4 月 8 日，周二晚上，他把 Pro 上线了。<\/p><p>九十九一年。他没改。他想先看看有多少人付。<\/p><p>购买页面很简单，一行字：Pro，¥99/年，转账不收手续费，额度不设上限，问题优先回复，开收据。下面一个按钮。<\/p><p>他先做了三件事。给山田、敏智、Ben 各开了一年，那是一月欠下的。然后在群里发了一条：「Pro 上了，99 一年。不强迫，按次的还在。」<\/p><p>十分钟后，大鹏买了。<\/p><p>半小时，五个。<\/p><p>第一天晚上，十一个。<\/p><p>他把每一个买的人的名字记下来。十一个人里，八个是他能叫出名字的。<\/p><p>第二天他去上班。云梯新项目在赶进度，他白天写了六个小时代码，没看手机。中午吃饭的时候看了一眼，十六个。<\/p><p>下午方哲路过他工位，看了一眼屏幕，说：「这段写得干净。」<\/p><p>他说：「嗯。」<\/p><p>方哲走了两步又回头。「你最近状态不错。」<\/p><p>他没说是因为什么。<\/p><p>第三天山田在英文群里发了一句，说他把 Pro 的收据交给了上司，上司说：「好，明年继续。」<\/p><p>第七天，4 月 15 日，晚上十点。三十一个。<\/p><p>三千零六十九块。<\/p><p>他在本子上记了这个数，然后写航海日志。写完，去洗碗。<\/p><p>4 月 16 日，老船长在群里回他的航海日志。隔了半个小时，慢慢地，一句一句。<\/p><p>「三十一个人，一周。说明你的东西有人要。」<\/p><p>「但你定得太低了。」<\/p><p>林拓回：「便宜才有人买。」<\/p><p>「大鹏一个月给你三百。你收他九十九，一年。你算过没有？」<\/p><p>他算过。大鹏一年手续费三千多，现在九十九。他亏了三千。<\/p><p>「他自己都说不信。」老船长说，「一个人说不信的时候，不是嫌贵，是觉得你不值。你把自己标便宜了，他就按便宜的看你。」<\/p><p>「先跑。」林拓回，「跑三个月，看数据再调。」<\/p><p>「行。」老船长说，「先跑。但你记住今天，今天你知道自己定低了，还是定了。以后涨价的时候，别怪用户。」<\/p><p>他没回。他不服，但他把这段话截了图，存在本子里。<\/p><p>周冉在下面补了一句：「他说得对。但先跑也对。你这个阶段，有人买比定对价重要。定价可以改，没人买改不了。」<\/p><p>4 月 18 日，周冉又发了一条。<\/p><p>「你那个购买页，太空了。九十九一个人放在那儿，没有参照。」<\/p><p>「参照什么？」<\/p><p>「锚。你去饭店，菜单第一道菜八百八，你翻一页看到一百八，觉得便宜。八百八那道菜不是给你点的，是给你比的。」<\/p><p>「我没有八百八。」<\/p><p>「你有。」周冉说，「每个人去年的手续费。」<\/p><p>他明白了。<\/p><p>那天晚上他改了购买页。Pro 那个九十九的旁边，加了一行小字：「按您过去 30 天的用量，一年手续费约为 ¥___」。这个数是每个人自己的，从他的账里算出来的。大鹏打开，看见的是三千八百四十。阿康打开，看见的是四十二。<\/p><p>大鹏那种人会看到一个大数，旁边九十九。阿康那种人看到四十二，旁边九十九，他就知道自己不用买。<\/p><p>他没骗任何人。他只是把他们自己的账放在了旁边。<\/p><p>上线第二天，又多了九个。<\/p><p>周冉让他把数字拉出来看。改之前，一百个人打开购买页，三个人买。改之后，一百个人，七个。<\/p><p>「页面一个字没动。」林拓说，「就加了一行。」<\/p><p>「一行就够了。」周冉说，「人不是不想买。人是不知道跟什么比。」<\/p><p>阿康那天在群里说了一句：「拓哥，你那个页面告诉我一年才四十二块，让我别买。头一回见网站劝人别花钱的。」<\/p><p>林拓回：「你用得少，按次划算。等你用多了再说。」<\/p><p>4 月 19 日，周六，他上了第七个工具，批量归集。归集是把散在几百个钱包里的零钱，收回到一个钱包里。像五金店月底关门，父亲把每个柜台抽屉里的现金收进一个保险柜。做空投的人发完钱，剩下的零头散在几百个地址里，以前要一个一个点回来。这个工具是大鹏访谈时顺嘴提的，他记在了本子最后一页。<\/p><p>4 月 20 日，周日，他把账本拿给沈月看。三月过万以后，她说过想看看。<\/p><p>「Pro 四十个。」沈月说，「三千九。」<\/p><p>「嗯。」<\/p><p>「手续费呢？」<\/p><p>「四月到现在，两千一。」<\/p><p>「加起来六千。」沈月合上本子。「半碗变成六成了。」<\/p><p>他笑了一下。<\/p><p>「你笑什么？」<\/p><p>「你算得比我快。」<\/p><p>「我教小学数学的。」<\/p><p>4 月 22 日，周二。他早上起来看后台，日访客一千一。前一天是八百。<\/p><p>他没在意。<\/p><p>4 月 24 日，一千六。<\/p><p>4 月 25 日，一千九。<\/p><p>他在群里问，怎么回事。大鹏说：「拓哥你不看行情的？涨了三天了。空投一天出七八个。」<\/p><p>他打开行情页面。绿的。<\/p><p>4 月 26 日，周六，不打烊。老船长看了他的后台，看了很久，只说了一句：「潮水来了。」<\/p><p>「好事吧。」小杜说。<\/p><p>「是好事。」老船长把杯子转了半圈。「潮水来的时候，别去数浪。数你桶里有多少水。」<\/p><p>林拓没听懂。他把这句话记下来了。<\/p><p>4 月 27 日，周日，日访客两千四百。是三月平均的三倍。<\/p><p>手续费那一天九百块。Pro 又多了十四个。<\/p><p>他晚上十一点睡的，睡前看了一眼服务器，正常。他想，从八百到两千四，不到一个月。<\/p><p>凌晨两点十分，手机在枕头边震。是服务器的报警。<\/p><p>他摸到手机，看了一眼。网站打不开。<\/p><p>沈月翻了个身，没醒。<\/p><p>他光着脚下床，往阳台走。人太多了。<\/p><aside class=\"log\"><div class=\"log-label\">航海日志<\/div><p>4 月 15 日。上了 Pro，99/年。一周 31 个。<\/p><p>上之前做了 5 个用户访谈，每人 30 分钟。问的不是「你想要什么功能」，是「你现在怎么算这笔钱」。<\/p><p>5 个人给了 5 个答案：要固定数、要收据、要有人管、要按次、要免费。所以按次和 Pro 并存。<\/p><p>老船长说我定低了。我知道。先跑。<\/p><p>5 个访谈教会我的比 1,000 份问卷多。<\/p><\/aside>", "words": 4958}, {"num": 13, "title": "牛市", "vol": 1, "html": "<p>2025 年 4 月 28 日，凌晨两点十分，手机在枕头边震。<\/p><p>林拓摸到手机，屏幕上是服务器的报警：网站打不开了。他光着脚走到阳台，坐下，开电脑。沈月在里屋翻了个身，没醒。<\/p><p>阳台上的小桌子是他的工位。桌角放着昨晚没喝完的水，一本账本，一支笔。他把账本往边上推了推，腾出地方放电脑。<\/p><p>服务器就是一台放在别人机房里的电脑，网站住在里面。它挂了，就像店门被人从外面堵住，谁也进不来。他先把它重启，网站亮了，三分钟后又挂。他看了一眼访问记录，一个晚上进来的人比上个月一整天还多。<\/p><p>他给服务器加了一台机器，又开了缓存。缓存的意思是，把常卖的东西提前摆在柜台上，不用每次都跑仓库去拿。天亮的时候网站稳了。他在阳台上睡着了，被沈月推醒。<\/p><p>「几点睡的？」<\/p><p>「没睡。」<\/p><p>「网站又坏了？」<\/p><p>「人太多。」<\/p><p>她看了他一眼，去厨房煮面。他趴回桌上看后台。日访客：两千四百。一个月前是八百。<\/p><p>行情起来了。<\/p><p>他跟沈月解释过一次什么叫行情好：就像县城赶集的日子，街上人多，谁摆个摊都能卖出去东西。币价涨，链上转账的人就多，发空投的人就多。这些人要批量转账、要查余额、要撤销授权，搜索引擎就把他们送到咔哒工具箱来。<\/p><p>不是他变强了。是街上的人变多了。<\/p><p>这句话他四月底还想得很清楚。到了五月，就没那么清楚了。<\/p><p>那天上午他在公司差点睡着。小杜从隔壁工位探过头来。<\/p><p>「拓哥，你昨晚又没睡？」<\/p><p>「服务器挂了。」<\/p><p>「多少人了？」<\/p><p>「两千四。一天。」<\/p><p>小杜吹了一声口哨，声音不小。前排的老陈回头看了一眼。林拓把电脑屏幕调暗了一点。<\/p><p>「你小点声。」<\/p><p>「知道知道。」小杜压低声音。「那一个月得多少？」<\/p><p>「还不知道。」<\/p><p>他知道。他每天早上都算一遍，算完不说。<\/p><p>五月一号，他在夜航船群里发四月的收入截图：¥15,200。群里有人发了一个鼓掌的表情。老船长没说话，发了一杯茶。<\/p><p>五月的头一周，大鹏在用户群里问：「能不能做个红包？我们搞活动，要给几百个地址发同样的钱，让他们自己来领。」<\/p><p>林拓两个晚上做出来了。这是咔哒的第八个工具。上线那天，大鹏拉了三个做社区的人进群，每人开了一个 Pro。<\/p><p>红包的做法很简单。发的人把钱放进一个合约里，定好每人领多少、总共多少份，生成一个链接。领的人点链接，用自己的钱包签个名，钱就到自己账上。跟过年发红包一个意思，只是这个红包不用一个个点名字。<\/p><p>大鹏第一天就发了三百份。当天晚上领走了两百一十份。他在群里发了一句：「省了我两个小时。」又发了一个二百块的红包，备注还是「咖啡钱」。<\/p><p>林拓没领。他把那二百块留在群里，让别人抢了。<\/p><p>数字开始往上跑。手续费每天两三百，Pro 每天卖出四五个。他晚上回家先开后台，看一眼，再吃饭。吃完饭再看一眼。<\/p><p>五月十号，周六，他在便签上列了一张单子：<\/p><ol start=\"1\"><li>多签管理<\/li><li>空投查询<\/li><li>代币发行<\/li><li>链上监控<\/li><li>手机 App 版<\/li><\/ol><p>他算了一下，五个都做，两个月。他又查了搜索广告的价格，一个点击两块多。他想，一天投两百块，能来一百个人，一百个人里有五个开 Pro，就是五百块。稳赚。<\/p><p>他还查了应用商店开发者账号的年费。<\/p><p>周日中午，沈月的妈妈叫他们回去吃饭。沈月早上问他去不去。<\/p><p>「下周吧。」他说。「我今天想把多签的第一版写出来。」<\/p><p>「上周你也说下周。」<\/p><p>「嗯。」<\/p><p>她没再说，一个人走了。门关上的时候声音不大。他在阳台上写了一下午代码，写到一半发现自己不知道多签是给谁用的。他把窗口最小化，又打开了广告后台。<\/p><p>沈月晚上九点回来，带了一盒她妈妈做的酱鸭。<\/p><p>「我妈问房子。」她说。「我说在看。」<\/p><p>「嗯。」<\/p><p>「你要是不想去，下次直接说，别说下周。」<\/p><p>「行。」<\/p><p>她把酱鸭放进冰箱，关门的时候比平时用力一点。<\/p><p>他把单子拍照发到夜航船群：「下个月计划。」<\/p><p>群里安静了两分钟。周冉回了一句：「你跟几个用户聊过这五个？」<\/p><p>他回：「红包是大鹏要的。」<\/p><p>「我问的是这五个。」<\/p><p>他没回。过了一会儿，老船长私聊他：「周六下午来喝茶。」<\/p><p>五月十七号，不打烊茶馆，只有老船长一个人。桌上一壶普洱，两个杯子。窗外西湖，游人很多。<\/p><p>老船长给他倒茶，倒得很慢。<\/p><p>「五月到现在多少？」<\/p><p>「一万三了，还有半个月。」<\/p><p>「涨了多少？」<\/p><p>「三倍。」<\/p><p>「三倍里头，多少是你做的？」<\/p><p>林拓想了想。「红包大概两千。Pro 有一部分是老用户。」<\/p><p>「剩下的呢？」<\/p><p>「行情。」<\/p><p>老船长点头。「你知道就好。」他喝了一口茶。「潮水来的时候，每个人都是天才。潮水退了，才知道谁在裸泳。你那张单子我看了。五个工具，广告，App。你这是要在浪头上加帆。」<\/p><p>「趁行情好，多做点。」<\/p><p>「行情好的时候做的东西，行情坏了还有人用吗？」<\/p><p>林拓没答。<\/p><p>「我 2015 年的时候，一个月挣十几万。我租了办公室，招了八个人，做了三个新 App。2018 年主力 App 下架，八个人的工资，一个月二十万。」老船长把杯子放下。「那时候我也觉得是我厉害。」<\/p><p>「后来呢？」<\/p><p>「后来再说。」老船长又倒茶。「你现在该做的，不是加帆。是把粮备足。」<\/p><p>「怎么备？」<\/p><p>「三件事。」老船长伸出一根手指。「第一，单开一个账户，只进不出。放你十二个月的生活费。你一个月花多少？」<\/p><p>「一万八千五。」<\/p><p>「那就是二十二万二。有多少放多少，差多少记着。」第二根手指。「第二，算你的底。不要拿五月算，拿最差的月份算。你今年最差是几月？」<\/p><p>「二月，五千六。」<\/p><p>「那你的站，一个月就是五千六。别的都是潮水给的。」第三根手指。「第三，不在高点扩张。你这五个工具，留一个，别的放在单子上，等潮水退了再看还想不想做。广告不投。App 不做。」<\/p><p>「为什么一个都不做？」<\/p><p>「因为你现在每一个决定，都是行情替你做的。」<\/p><p>「还有。」老船长说。「备粮不是你一个人的事。账本给她看。她要是不点头，你备再多也不算数。」<\/p><p>「她管我账本？」<\/p><p>「不是管。是一起看。你现在挣多少，她得知道。以后你挣不到，她也得知道。」<\/p><p>林拓喝了一口茶，是凉的。<\/p><p>「你公司知道吗？」老船长问。<\/p><p>「不知道。」<\/p><p>「早晚知道。」老船长说。「知道之前，把该留的东西留好。」<\/p><p>回去的地铁上，他把那张单子重新写了一遍。五个划掉四个，留下「空投查询」。广告划掉。App 划掉。底下加了一行：五月的数字不算数。<\/p><p>他想起父亲。每年腊月，店里生意最好，爷爷在的时候总要多进货，父亲不肯。父亲说，正月里卖不动，货压在架子上，钱就死在架子上了。他小时候不懂，觉得父亲胆小。<\/p><p>到家，他开了一个新账户，命名「粮」。把能动的钱转进去，十七万出头。差五万。他在账本上记了一笔：「粮，差 5 万。」<\/p><p>沈月在沙发上看书。他把账本给她看。<\/p><p>「这是什么？」<\/p><p>「老船长说的。备粮。」<\/p><p>她看了一会儿，把账本还给他。「你上个月说要做 App。」<\/p><p>「不做了。」<\/p><p>「广告呢？」<\/p><p>「不投。」<\/p><p>她把书合上。「你最近吃饭都不看我。」<\/p><p>「嗯。」<\/p><p>「看手机也行。你把菜吃了。」<\/p><p>他把手机放到桌上，反面朝上。<\/p><p>五月二十号，下午三点，夜航船群里跳出周冉的一条消息：「自由了。」<\/p><p>底下一张图。一张工牌，放在空桌上。<\/p><p>有人回「恭喜」，有人回「终于」。林拓盯着那条消息看了很久。周冉发东西，一向是早上八点，带数据，带结论。这条是下午三点，两个字，一张图。<\/p><p>他私聊她：「吃饭？」<\/p><p>「行。你请。」<\/p><p>五月二十三号，周五晚上，滨江一家东北菜馆。周冉先到，已经点了锅包肉、地三鲜、一瓶啤酒。她三十一岁，头发扎着，穿一件黑 T 恤，看上去跟平时没什么不一样。<\/p><p>「别问。」她说。「我自己说。」<\/p><p>林拓坐下，「嗯」了一声。<\/p><p>「六年。」她倒啤酒。「我做了六年增长。日活从三十万做到一百万，我带的组十二个人。上周三早上，一封邮件。整个增长部裁百分之六十，名单里有我。」<\/p><p>「为什么？」<\/p><p>「降本增效。」她笑了一下。「你们公司不也天天说这四个字？」<\/p><p>他点头。<\/p><p>「我给你讲个数。」她用筷子在桌上画了个漏斗，上宽下窄。「漏斗你懂吧。进门的人多，最后掏钱的人少，中间一层一层漏掉。我们那产品，日活一百万，一半是买来的。停一天广告，日活掉三成。停一周，掉一半。」她把筷子放下。「一百万日活，是我用钱堆出来的。钱一停，水就退。」<\/p><p>「你们那产品，跟我这个不一样。」<\/p><p>「对。」她说。「你那个小站，我看比我们那产品健康。」<\/p><p>「为什么？」<\/p><p>「你的用户是自己搜过来的。用完了下个月还来。付钱的是他们自己掏的，不是我们发优惠券骗来的。你不投一分钱广告，日访客两千四。我们投一百万，日活一百万。你算算哪个便宜。」<\/p><p>锅包肉上来了。她夹了一块，吃完才继续。<\/p><p>「我不是说你厉害。你现在这个数，一半以上是行情。行情走了，你还剩五六千。但那五六千是真的，是有人要你的东西。我那一百万，一个都不是。」<\/p><p>林拓想说点什么，没想出来。他给她倒酒。<\/p><p>「你打算干什么？」他问。<\/p><p>「不知道。先睡两天。」她喝了一口。「大厂我不回了。回去还是那一套，买量，冲日活，年底做 PPT。我做了六年，没见过一个真的用户。」<\/p><p>「你可以来帮我。」<\/p><p>她看着他。「帮你什么？」<\/p><p>「你一直在帮我。」<\/p><p>「那不算。」她说。「群里说两句话不算帮。」<\/p><p>吃完饭，他抢着结了账，两百三十块。周冉没客气。<\/p><p>出门的时候她站在路边等车，忽然问：「你的站，用过一次就不来的人，有多少？」<\/p><p>「不知道。」<\/p><p>「一个月来两次以上的呢？」<\/p><p>「没算过。」<\/p><p>「那你天天看后台看什么？」她说。「看总数没用。总数是行情。回头的人才是你的。」她的车来了，她拉开车门。「先别写代码。回去查。」<\/p><p>他回去查了一晚上。五月到现在，来过的人里，来两次以上的占四成。他把这个数记在便签上，跟那个「五月不算数」写在一起。这四成里，日本用户占了一小块，山田还在。<\/p><p>当晚他给周冉转了五千块，备注：「四月五月顾问费。」<\/p><p>十分钟后，钱退回来了。<\/p><p>周冉：「等你付得起再说。」<\/p><p>他回：「我付得起。」<\/p><p>「你这个月两万一，明年这时候可能八千。五千块对你不是小钱。现在给我，你是在还人情。等你有一天能按月给我发工资，再说付钱。」<\/p><p>他盯着屏幕。过了一会儿回：「行。」<\/p><p>五月三十一号，周六。他没去茶馆。晚上十一点他算了五月的账：手续费一万三千八，Pro 七千二，合计两万一千块。<\/p><p>第一次超过工资。到手的工资是一万四。<\/p><p>他在「圈子」上发了一条航海日志。<\/p><p>发完他没去看数字。他去洗碗。碗早就洗过了，他又洗了一遍。沈月靠在厨房门口。<\/p><p>「怎么了？」<\/p><p>「没事。」<\/p><p>「超过工资了？」<\/p><p>「嗯。」<\/p><p>「那你洗什么碗？」<\/p><p>他没答。她过来，把水龙头关了。<\/p><p>六月一号早上八点，他把五月的截图发到群里。周冉隔了一分钟回：「回头率多少？」<\/p><p>「四成。」<\/p><p>「行。这个数比两万一有用。」<\/p><p>六月的第一周，公司的新项目上线。是一个对账平台，各个业务线的钱要在一个地方对上。林拓做了最难的一块：几十个业务的数据格式不一样，要把它们对齐，一笔都不能错。<\/p><p>他白天全力做这个。方哲让他两周上，他一周半就上了。上线当天，零故障。<\/p><p>周三周会，方哲当着二十个人说：「这次对账平台，林拓立了功。有人白天干活晚上还有精力，我们要学。」<\/p><p>小杜在旁边捅他，小声说：「拓哥，你这是被点名了。」<\/p><p>「嗯。」<\/p><p>散会的时候，隔壁组的老陈在茶水间碰到他。「听说你在外面搞东西？」<\/p><p>「嗯。」<\/p><p>「挺好。」老陈说。「小心点。」<\/p><p>林拓没问小心什么。<\/p><p>周四下午，他去打水，看见方哲在玻璃会议室里跟 HR 赵姐说话。赵姐面前放着一台笔记本。方哲的脸朝着门，看见他，点了一下头。<\/p><p>周四晚上，他把「空投查询」的第一版做完了。上线之前他在用户群里问了一句：「有人需要这个吗？」十五分钟内二十三个人说要。他才发上去。<\/p><p>周五，六月六号。<\/p><p>下午四点，方哲从办公室出来，走到他工位边。<\/p><p>「来一下。」<\/p><p>林拓跟着他进了小会议室。小杜抬头看了他们一眼。<\/p><p>会议室里只有方哲一个人的笔记本，还有一杯没喝的水。方哲关上门，把投影打开。投影亮起来用了几秒钟，林拓站着，手插在口袋里，摸到一把钥匙。<\/p><p>投影上是 kada.tools 的首页。绿色的工具箱图标，底下一行字：我们只是一把扳手，钱一直在你自己口袋里。<\/p><p>方哲坐下来，看着他。<\/p><p>「这是你的？」<\/p><aside class=\"log\"><div class=\"log-label\">航海日志<\/div><p>5 月 31 日。月收入 21,000。第一次超过工资。<\/p><p>三倍里头，我做的大概两成，别的是行情。老船长说这是潮水不是我。我信。<\/p><p>本月做的事：上了红包工具。开了一个只进不出的账户，叫「粮」，放了 17 万，差 5 万。<\/p><p>本月没做的事：五个新工具划掉四个，广告不投，App 不做。<\/p><p>五月的数字不算数。我的底是二月的 5,600。<\/p><\/aside>", "words": 4830}, {"num": 14, "title": "副业与饭碗", "vol": 1, "html": "<p>2025 年 6 月 6 日，周五，下午四点零五分。云梯科技十四层，小会议室。<\/p><p>投影上是 kada.tools 的首页。方哲坐在桌子那头，面前一台笔记本，一杯没喝的水。<\/p><p>「这是你的？」<\/p><p>「嗯。」林拓说。<\/p><p>方哲点了点头，好像早知道答案。他把投影关了，屋里暗下来一点。<\/p><p>「你先坐。」<\/p><p>林拓坐下。<\/p><p>「我先说清楚。」方哲说。「不是我要查你。是 HR 找到我，问我知不知道这事。有同事反映的。」<\/p><p>「谁？」<\/p><p>「这个我不能说。」方哲搓了搓脸。「赵姐一会儿过来。她要按流程问你几个问题。你怎么答，你自己想好。」<\/p><p>「行。」<\/p><p>「你别紧张。」<\/p><p>「嗯。」<\/p><p>门开了，赵姐进来。四十来岁，短发，抱着一台笔记本和一个文件夹。她跟林拓点头，坐在方哲旁边，把笔记本打开。<\/p><p>「林拓，今天找你，是有同事反映你在公司之外经营一个网站。公司有规定，我们要了解一下情况。我问几个问题，你如实回答就行。」<\/p><p>「行。」<\/p><p>「这个网站是你个人的？」<\/p><p>「是。」<\/p><p>「做什么的？」<\/p><p>「链上的批量工具。转账、查余额这些。」<\/p><p>「跟公司业务有关系吗？」<\/p><p>「没有。公司做企业采购系统。我的站是做加密货币的。」<\/p><p>赵姐在笔记本上记了一行。「用没用过公司的电脑做这个？」<\/p><p>「没有。」<\/p><p>「有没有在工作时间做？」<\/p><p>「没有。」<\/p><p>「你怎么证明？」<\/p><p>林拓拿出手机。他早想过这个问题。<\/p><p>「代码每次改动都有记录，什么时候改的，改了什么，一条一条，改不了。跟店里的账本一样。」他把手机推过去。「这是从去年八月到现在所有的记录。时间全在晚上九点以后，或者周末。工作日早上九点到晚上七点，一条都没有。」<\/p><p>赵姐看着屏幕，往下滑了很久。<\/p><p>「这个记录能导出来吗？」<\/p><p>「能。周一给你。」<\/p><p>「网站放在哪儿？」<\/p><p>「我自己租的服务器，账单是我的名字。域名也是我的名字，我家的地址。」<\/p><p>「公司电脑上有没有登录过这个网站的后台？」<\/p><p>「没有。我在公司电脑上没登过我自己的任何账号。」<\/p><p>赵姐又记了一行。她抬头，第一次看着他的眼睛。「你准备得很全。」<\/p><p>「去年就想过。」<\/p><p>「为什么？」<\/p><p>「因为早晚会有今天。」<\/p><p>赵姐没接这句。她翻开文件夹，拿出一份合同。「你的劳动合同里有竞业条款，你看过吗？」<\/p><p>「看过。第十二条。限于企业采购、供应链软件的同行业。」他把手机拿回来，翻出一张照片，是那一页的合同。「我拍过。」<\/p><p>方哲在旁边看了一眼赵姐。赵姐没什么表情。<\/p><p>「好。」赵姐合上笔记本。「今天先到这里。周一把记录发我邮箱。公司会研究一下，有结果通知你。」<\/p><p>「行。」<\/p><p>「你先回去工作吧。」<\/p><p>林拓站起来，出门。小杜在工位上看他，他没看小杜。他坐下，把对账平台的一个报错改完，才发现手心是湿的。<\/p><p>晚上七点半，他到家。沈月在厨房，锅里炖着排骨。<\/p><p>「今天怎么了？」她问。<\/p><p>「公司知道了。」<\/p><p>她关小火。「然后呢？」<\/p><p>「问了几个问题。周一交材料。」<\/p><p>「他们能怎么样？」<\/p><p>「不知道。」他坐在餐桌边。「开除，或者不开除。」<\/p><p>「那你怕不怕？」<\/p><p>他想了想。「不怕。」<\/p><p>「为什么？」<\/p><p>「东西我都留着。」<\/p><p>他打开电脑，给她看一个文本文件。文件名叫「边界」，是 2024 年 10 月建的。里面五行字：<\/p><ol start=\"1\"><li>不用公司电脑。一台电脑就是一台电脑，我的东西在我自己的机器上。<\/li><li>不用公司时间。提交只在晚上九点以后和周末。白天想到什么，写在手机备忘录里，晚上再动手。<\/li><li>不用公司账号。邮箱、代码仓库、服务器、域名，全是自己的名字，自己的地址。<\/li><li>不碰公司业务。做的东西跟公司卖的东西不沾边。<\/li><li>合同上的竞业条款拍照存着，知道它管的是什么。<\/li><\/ol><p>「去年十月写的。」他说。「那时候刚拿到一百三十七块。」<\/p><p>他记得写这个文件的那天。方哲让他连加两周班上新项目，他白天做公司的，晚上做自己的，累到在地铁上睡过站。醒来的时候地铁停在终点站，车厢里只有他一个人。他坐在那儿想：要是公司知道了，他们会问什么。他把能想到的问题一条条列出来，回家就写了这五行。<\/p><p>「那时候你一个月挣一百三十七块，就想这个？」<\/p><p>「越小越要想。大了就来不及了。」<\/p><p>沈月看了很久。「你那时候就想到今天了？」<\/p><p>「没想到今天。想到早晚。」<\/p><p>她把排骨端上来。「吃饭。」<\/p><p>吃完饭他坐在阳台上，没开电脑。他在想是谁。老陈？老陈说过「小心点」。还是别人？他把组里的人想了一遍。<\/p><p>沈月端了一杯水出来，放在桌上。<\/p><p>「别猜了。」<\/p><p>「嗯。」<\/p><p>「猜出来你能怎么样？」<\/p><p>「不能怎么样。」<\/p><p>「那就别猜。」她说。「你现在要做的是把材料整好。别的没用。」<\/p><p>他把电脑打开，开始导记录。<\/p><p>十一点，他在夜航船群里没发东西，私聊了老船长一句：「公司知道了。」<\/p><p>老船长隔了十分钟回：「留好了？」<\/p><p>「留好了。」<\/p><p>「那就没事。」老船长说。「有事的话，也是他们的事。」<\/p><p>他把这句话看了两遍，关了手机。<\/p><p>周六周日他把材料整理出来。代码记录导出来，按时间排了一张表：一共两千一百多次提交，工作日白天零次。服务器账单十个月的截图。域名注册信息。合同第十二条的照片。他打包发给赵姐，抄送方哲。<\/p><p>周日晚上，小杜发消息：「拓哥，需要我说话你说。」<\/p><p>「不用。」<\/p><p>「我认真的。」<\/p><p>周一早上，他在走廊碰到小杜。小杜没绕开，站在他面前。<\/p><p>「拓哥，去年十月那两周，我天天跟你一起加班到十点。你白天在写对账，晚上回家才弄你的。我作证。」<\/p><p>「用不着。」<\/p><p>「用得着的时候我在。」小杜说完走了。<\/p><p>林拓站在走廊上，过了一会儿才回工位。<\/p><p>周二下午，赵姐又叫他。还是那个小会议室，方哲也在。<\/p><p>赵姐把一张纸推过来。「公司研究了。你提供的材料我们看了。没有使用公司设备，没有占用工作时间，业务跟公司无关，也不在竞业范围里。这件事公司不追究。」<\/p><p>「行。」<\/p><p>「这里签个字，说明你知道公司的规定，以后也不会用公司资源做个人项目。」<\/p><p>他看了一遍，两页，没有别的内容。他签了。<\/p><p>「还有一件事。」赵姐说。「公司下半年有一轮降本增效。名单还在定。我先跟你说一声，不代表结果。」<\/p><p>「我在名单里？」<\/p><p>赵姐没答。方哲低头看着桌子。<\/p><p>「知道了。」林拓说。<\/p><p>散了以后，方哲在楼梯间等他。楼梯间没人，方哲靠着墙，手里拿着一根没点的烟。他不抽烟，只是拿着。<\/p><p>「名单不是我定的。」方哲说。<\/p><p>「嗯。」<\/p><p>「但我也没把你划掉。」他把烟在手指间转了一圈。「他们问我你能不能走。我说能。我说你在外面有东西，走了不会饿死。」<\/p><p>「嗯。」<\/p><p>「你不问我为什么？」<\/p><p>「你说了。」<\/p><p>方哲笑了一下，很短。「说实话，我羡慕你。」<\/p><p>林拓没说话。<\/p><p>「我三十八。房贷一万二。两个小孩。我也想做点自己的东西，想了五年，一行没写。」方哲把烟收回口袋。「你这个站，我周五那天看了一晚上。做得挺好。那个扳手的话，写得好。」<\/p><p>「谢谢。」<\/p><p>「别谢。我什么也没帮你。」方哲推开楼梯间的门，又停住。「你那个群，我能进吗？」<\/p><p>「能。」<\/p><p>「我用小号。」<\/p><p>「随你。」<\/p><p>方哲点点头，出去了。「走吧。对账平台还有两个 bug。」<\/p><p>那一周他照常上班。对账平台的 bug 改完了。周会上方哲没再提他的名字。老陈在茶水间碰到他，眼睛看别处。他也没看老陈。<\/p><p>周三，方哲让他把对账平台交接给小杜。两个人在白板前站了一下午。林拓画了整个流程，几十个业务的数据从哪儿来，在哪儿对，错了怎么报。小杜拍照，拍了十几张。<\/p><p>「拓哥，你这个不像要走的人。」<\/p><p>「东西是公司的。做完就做完。」<\/p><p>「那你自己的呢？」<\/p><p>「我自己的在家里。」<\/p><p>他把交接文档写了十二页，发给方哲。方哲回了一个字：「好。」<\/p><p>晚上回家，他照常更新。空投查询上了第二版，日本用户山田提了一个建议，他改了。用户群里没人知道他白天发生了什么。<\/p><p>六月十五号，他给周冉发消息：「可能要被裁。」<\/p><p>周冉回得很快：「多久？」<\/p><p>「不知道。」<\/p><p>「三件事。一，N+1 一分不能少，让他们把算法写在纸上给你看。二，当月工资、没休的年假、报销，全部结清，写进协议。三，离职证明上写协商解除，不能写别的。签之前把协议拿回家看一晚上，他们不让你带走就拍照。」<\/p><p>「你怎么知道这些？」<\/p><p>「我上个月刚签过。」<\/p><p>「谢谢。」<\/p><p>「别谢。记住第三条，最重要。以后你要是回去上班，那张纸别人要看。」<\/p><p>他把这三条记在「边界」文件的最后。<\/p><p>六月二十号，周五。早上他六点就醒了。沈月还在睡。他到阳台上看了一眼后台，昨天日访客两千一，比五月低一点，行情在往下走。手续费四百二，Pro 卖了三个。他把数字记在账本上，跟往常一样。<\/p><p>八点半到公司。工位上的东西他前一天已经收过一遍，能带走的不多。他把电脑开了，改了小杜昨天问的一个问题，回了两封邮件。九点半，他去接了一杯水。<\/p><p>上午十点，赵姐的消息：「十点半，小会议室。」<\/p><p>他去了。这次只有赵姐一个人。桌上一份协议。<\/p><p>「林拓，公司决定跟你协商解除劳动合同。补偿按 N+1。」她把一张纸推过来，上面是算法。<\/p><p>「你 2022 年 1 月入职，到现在三年五个月。年限按三年半算。加一，就是四个半月。月工资按你前十二个月平均，一万八千二。四个半月，八万一千九。公司凑个整，八万二。」<\/p><p>他看了一遍。又看了一遍。<\/p><p>「六月的工资？」<\/p><p>「发到二十号，下个月十号跟补偿一起打。」<\/p><p>「年假我还有六天没休。」<\/p><p>赵姐翻了一下。「六天，折算成工资，一起结。写进去。」<\/p><p>「报销我有一笔，四百多。」<\/p><p>「一起结。」<\/p><p>「离职证明写什么？」<\/p><p>「协商解除劳动合同。」<\/p><p>「社保公积金？」<\/p><p>「交到六月底。」<\/p><p>「行。」他说。「协议我能带回去看一晚上吗？」<\/p><p>赵姐顿了一下。「按流程今天签。」<\/p><p>「那我在这儿看。」<\/p><p>他把协议从头看到尾，一共四页。看到「双方无其他争议」那一句，他停了一下，往前翻，确认年假和报销都写进了「结清」那一条。他又看了一遍离职证明的样子，六个字：协商解除劳动合同。<\/p><p>他签了字。赵姐也签了。<\/p><p>签完他去茶水间，把马克杯洗了。杯子用了三年，里面有一圈茶渍，洗不掉。他洗了两遍，放在水池边晾着。老陈进来接水，看见他，站了一下。<\/p><p>「走了？」<\/p><p>「嗯。」<\/p><p>「那个……」<\/p><p>「没事。」林拓说。他把杯子拿走，没等老陈说完。<\/p><p>「下午办手续。电脑、工牌交给 IT。有什么需要找我。」<\/p><p>「谢谢赵姐。」<\/p><p>「不用。」她把协议收进文件夹。「祝你顺利。」她说这四个字的时候没看他，但声音比平时低一点。<\/p><p>下午三点，他把电脑交了。工牌交了。IT 的小伙子在系统里点了一下，说「好了」。他回到工位，打开抽屉。<\/p><p>抽屉里有一把螺丝刀。木柄，被手磨得发亮。2018 年他离开家来杭州，父亲在车站把它塞给他，没说为什么。2022 年他来云梯的第一天，椅子晃，他用这把螺丝刀把椅子拧紧了。之后它白天放在桌上，晚上收进这个抽屉。<\/p><p>他找 IT 要了一个纸箱。往里装：螺丝刀，一个马克杯，一本没看完的书，一盒还剩半盒的名片，一条充电线。名片上印着「云梯科技 后端工程师 林拓」，他印了一盒，三年发出去不到一半。装完看了看，不到半箱。<\/p><p>小杜过来帮他抬，他说不用，一只手就行。小杜还是跟着他到电梯口。<\/p><p>「拓哥。」<\/p><p>「嗯。」<\/p><p>「你那个站，我能不能……」<\/p><p>「进群。」林拓说。「用户群。周五晚上我在。」<\/p><p>电梯门开了。他进去，小杜站在外面。门关上之前，小杜说：「我周五去。」<\/p><p>方哲的办公室门开着，他经过的时候方哲在打电话，抬头看了他一眼，点了一下头。他也点了一下头。<\/p><p>十四层到一层，电梯停了三次。他抱着纸箱，箱子不重。有人上来，看了他一眼，看了箱子一眼，没说话。<\/p><p>大堂里很凉。保安认得他，看了一眼纸箱，没问。三年半，他每天从这儿刷卡进去，今天工牌没了，他是从闸机旁边的小门出来的。<\/p><p>他没直接出去，在一张长椅上坐下，把纸箱放在腿上。<\/p><p>他拿出手机，打开账本。<\/p><p>存款十七万八。补偿八万二。加起来二十六万。<\/p><p>月支出一万八千五。<\/p><p>二十六万除以一万八千五。<\/p><p>十四个月。<\/p><p>他给沈月发消息：「裁了。N+1。」<\/p><p>她回：「回家吃饭。」<\/p><p>他又给周冉发：「签了。三条都在。」<\/p><p>周冉：「离职证明呢？」<\/p><p>「协商解除。」<\/p><p>「行。你比我强，我当时忘了看年假。」<\/p><p>他把这个数记下来，关上手机。纸箱里的螺丝刀滚到了一边。他把它扶正，抱着箱子，出了大堂。<\/p><p>外面很晒。下午四点，六月二十号。他有十四个月。<\/p><aside class=\"log\"><div class=\"log-label\">航海日志<\/div><p>6 月 20 日。被裁了。N+1，8.2 万。<\/p><p>不怪谁。公司查我副业，查完不追究，但名单上有我。这个顺序我早想到了。<\/p><p>去年十月留的东西今天用上了。提交记录全在夜里和周末，电脑账号服务器全是自己的，合同的竞业条款拍了照。有副业的，先把这些留好。<\/p><p>签协议前看清三样：补偿怎么算，年假报销结没结清，离职证明写的什么。<\/p><p>晚上继续更新。<\/p><\/aside>", "words": 4816}, {"num": 15, "title": "十四个月", "vol": 1, "html": "<p>2025 年 6 月 21 日，周六，早上七点。滨江的出租屋。<\/p><p>林拓醒了，没有闹钟。七年来，这是第一个身后没有工作的周六。看上去跟以前的周六没什么两样。他躺了一会儿，听见沈月在厨房煮粥。<\/p><p>阳台桌上放着昨天那个纸箱。他把螺丝刀拿出来，放在桌角。马克杯拿到厨房。别的东西留在箱子里，塞到桌子底下。<\/p><p>吃完粥，他把账本翻开，又打开夜航船群的公告。四律第四条写在那儿：离岸前先备粮。十二个月生活费，加上副业月收入不低于工资一半，连续三个月。<\/p><p>他在账本上一条一条对。<\/p><p>第一条，十二个月生活费。存款十七万八，补偿八万二，二十六万。月支出一万八千五。十四个月。过线。<\/p><p>第二条，副业月收入不低于工资一半。他的工资到手一万四，一半是七千。税前一万八，一半是九千。他按九千算。<\/p><p>三月，一万二。四月，一万五千二。五月，两万一。<\/p><p>连续三个月，过线。<\/p><p>他在两条后面各画了一个勾。画完看着那两个勾，觉得不对。<\/p><p>五月是潮水。<\/p><p>他翻到前面，二月：五千六。要是把五月换成二月，第二条就不过。他把六月到昨天的数字加了一下，一万一千多，还剩十天，估计全月一万六。行情在往下走，七月不知道。<\/p><p>他在两个勾旁边写了一行小字：五月不算，二月算。按二月，不过线。<\/p><p>然后他把账本合上，去洗碗。<\/p><p>小杜昨晚进了用户群。方哲的小号也进了，头像是一片云，没说话。小杜在群里发了一句：「新人，以前跟林拓一个组。」大鹏回：「你们组都散了？」小杜没答。<\/p><p>下午他睡了一觉。醒来五点，沈月在做饭，鱼香肉丝，番茄蛋汤。她把菜端上来，他去盛饭。两个人吃了一会儿，谁也没提。<\/p><p>吃完，她没收碗。她把账本从阳台拿进来，放在桌子中间。<\/p><p>「你算了？」<\/p><p>「算了。」<\/p><p>「给我讲。」<\/p><p>他翻开，指给她看。两条，两个勾，旁边一行小字。<\/p><p>她看了很久。「这行小字什么意思？」<\/p><p>「五月的收入是行情给的。按二月的，不够。」<\/p><p>「那你自己觉得过没过？」<\/p><p>「账上过了。心里没过。」<\/p><p>她点点头。「那我们从心里没过的那个开始说。」<\/p><p>她把碗往边上推了推，两只手放在桌上。<\/p><p>「我先说我怕什么。你听着，别接话。」<\/p><p>「嗯。」<\/p><p>「第一，房子。我妈每次打电话都问。我说在看，说了两年。我知道你不想听这个，但我得说。我今年二十八。我们租这个房子四千二，住了三年。我不是非要现在买，但我要知道，买房这件事，是往后推，还是没有了。」<\/p><p>他没接话。<\/p><p>「第二，我爸妈。我怎么跟他们说？说你辞职了？你没辞，是被裁的。说你在家做网站？我妈会问网站是什么，一个月挣多少，稳不稳定。我不知道怎么答。我不是怕他们，我是不想每次回去都替你解释。」<\/p><p>「第三，万一。万一一年后什么都没有。万一你三十岁了，简历上空一年，回去找工作，人家问你这一年干了什么。万一行情一直不好。万一你病了。万一……」她停了一下。「万一你又像三月那样，一个月不看我。」<\/p><p>她说完，把手收回去。<\/p><p>「说完了。你说。」<\/p><p>他想了很久。风扇在转，楼下有人在收衣服，晾衣架碰在栏杆上响了一下。<\/p><p>「我先说最坏的。」他说。「一年以后，可能什么都没有。」<\/p><p>她看着他。<\/p><p>「行情走了，收入回到五六千。五六千够服务器，不够生活。二十六万花到剩六七万。我三十岁，简历空一年。找工作，可能找得到，可能比现在差。这是最坏的。」<\/p><p>「有多大可能？」<\/p><p>「我不知道。三成？我不敢说少。」<\/p><p>「病了呢？」<\/p><p>「医疗险去年买了，一年两千多。意外险也有。单子在抽屉里，你知道的那个。」<\/p><p>「我不知道。」<\/p><p>「那今天你看一眼。」<\/p><p>「那好的呢？」<\/p><p>「好的是，一年以后收入稳在一万以上，不靠行情。够我一个人的开销。房子的事往后推一年，不是没有了。」<\/p><p>「往后推一年，你保证？」<\/p><p>「不保证。我只保证，一年以后，账上是什么样，我如实告诉你。」<\/p><p>「你妈呢？你爸呢？」<\/p><p>「我自己说。」<\/p><p>「怎么说？」<\/p><p>「实话。被裁了。有个网站，一个月一两万，行情好的时候。行情不好的时候几千。存款够一年。做一年看看。」<\/p><p>她听完，沉默了一会儿。「你跟我说的，和你跟他们说的，是一样的？」<\/p><p>「一样的。」<\/p><p>「不许有两个版本。」<\/p><p>「没有。」<\/p><p>她低头看账本，翻了一页，是他在上面写的那句「粮，差 5 万」。<\/p><p>「这个是什么？」<\/p><p>「老船长说的。单开一个账户，只进不出，放十二个月的。」<\/p><p>「现在够了？」<\/p><p>「加上补偿够了。」<\/p><p>「那这个账户，我要能看见。」<\/p><p>「能。」<\/p><p>她把账本推回来。「我的工资你算了没有？」<\/p><p>「没算。」<\/p><p>「为什么？」<\/p><p>「算了你就得跟我一起赌。」<\/p><p>「我本来就跟你一起。」她说。「算上我的，多少个月？」<\/p><p>他算了一下。「我们两个人一个月一万八千五，你九千，差九千五。二十六万除以九千五，二十七个月。」<\/p><p>「那我就当十四个月。」她说。「剩下的十三个月是我的底。你不许碰。」<\/p><p>「行。」<\/p><p>「现在说我的条件。」她坐直了一点。「两条。」<\/p><p>「嗯。」<\/p><p>「第一，每个月一号，晚上，你把账本拿出来，我们一起看。三个数：上个月挣了多少，花了多少，还剩几个月。不是你告诉我，是我们一起看。你少一个数，我就当你在瞒我。」<\/p><p>「行。」<\/p><p>「剩六个月的时候，我们再谈一次。谈什么到时候说，现在不定。」<\/p><p>「行。」<\/p><p>「第二。」她停了一下。「不许消失。」<\/p><p>他没说话。<\/p><p>「三月那次，你一个月没跟我说过一句整话。三月十六号你妈打电话你没接，是我接的。她问你怎么样，我说挺好。她问你在干什么，我说在忙。我替你说了二十分钟。你在阳台上，离我三米。」<\/p><p>「嗯。」<\/p><p>「你在家，人不在。我不管你挣多少，我看你有没有回来。你每天要看我一眼，跟我说一句话，不是‘嗯’，不是‘行’，是一句话。做不到，你就去找工作，我不商量。」<\/p><p>「我做得到。」<\/p><p>「你现在说做得到。」<\/p><p>「我做得到。」他又说了一遍。「做不到的时候，你说。」<\/p><p>「我会说的。」她说。「我说了你得听。」<\/p><p>「听。」<\/p><p>她看了他一会儿，然后笑了一下，很短，像方哲在楼梯间那种。<\/p><p>「你以为我会哭？」<\/p><p>「没有。」<\/p><p>「我不哭。哭有什么用。」她站起来收碗。「我怕归怕，账我看得懂。十四个月，一万八千五，二十六万，你算得没错。」<\/p><p>她端着碗走到厨房门口，回头说：「你那个最坏的，三成。我认了。」<\/p><p>他坐在桌边没动。过了一会儿他站起来，走到厨房，把她手里的碗接过来。<\/p><p>「我洗。」<\/p><p>「你今天已经洗过一次了。」<\/p><p>「再洗一次。」<\/p><p>周日早上，他把桌子底下的纸箱拖出来。阳台的椅子晃了两年，他一直没管。他拿出螺丝刀，把椅子翻过来，四个螺丝一个一个拧紧。拧完坐上去，不晃了。<\/p><p>他把马克杯放在桌角，螺丝刀放在杯子旁边。书放进书架。名片扔了。纸箱压扁，塞到鞋柜后面。<\/p><p>沈月站在阳台门口看着。「这算上班了？」<\/p><p>「算搬家。」<\/p><p>周日上午十点，母亲的电话。她每周日都打。前面十分钟是店里的事，天热，风扇卖得好，隔壁药店换了老板。然后她问沈月，问吃饭，问天气。<\/p><p>「你最近忙不忙？」<\/p><p>「不忙。」他说。「妈，我被裁了。」<\/p><p>那边安静了两秒。「什么时候？」<\/p><p>「周五。」<\/p><p>「赔钱了没有？」<\/p><p>「赔了。八万二。」<\/p><p>「那还好。」母亲说。「你爸要跟你说话。」<\/p><p>电话换了人。父亲的呼吸声，然后：「崽。」<\/p><p>「爸。」<\/p><p>「被裁了？」<\/p><p>「嗯。」<\/p><p>「钱够不够？」<\/p><p>「够一年多。」<\/p><p>「那个网站还做？」<\/p><p>「做。」<\/p><p>父亲没马上说话。他能听见店里的声音，有人在问什么东西多少钱，母亲在答。<\/p><p>「五金店开了二十七年。」父亲说。「也没有铁饭碗。」<\/p><p>「嗯。」<\/p><p>「做吧。」父亲说。「缺钱说话。」<\/p><p>电话挂了。前后不到一分钟。他拿着手机在阳台上站了一会儿，把父亲那句话记在账本上，记在两个勾的底下。<\/p><p>沈月从里屋出来。「你爸说什么？」<\/p><p>「五金店开了二十七年，也没有铁饭碗。」<\/p><p>她想了想。「你爸比你会说话。」<\/p><p>「嗯。」<\/p><p>「他说缺钱说话，你会说吗？」<\/p><p>「不会。」<\/p><p>「那我说。」<\/p><p>周一下午，他去了不打烊。老船长在老位置，一壶普洱，一本书。<\/p><p>「坐。」<\/p><p>他坐下。老船长给他倒茶，问都没问，倒完才说：「裁了？」<\/p><p>「嗯。」<\/p><p>「N+1？」<\/p><p>「八万二。」<\/p><p>「算过了？」<\/p><p>他把账本递过去。老船长翻到那一页，看了两个勾，看了小字，看了父亲那句话。看完把账本还给他。<\/p><p>「我不劝人辞职。」老船长说。「也不劝人坚持。这两件事我都劝过，结果都不好。」<\/p><p>「嗯。」<\/p><p>「但你的数字过了线。」老船长喝了一口茶。「过线不是说你会成。是说你输得起。四律第四条不是保你赢，是保你输了还能回来。」<\/p><p>「按二月算，不过。」<\/p><p>「按二月算，你就该多备三个月。你备了十四个月，比十二个月多两个。够了。」老船长把杯子放下。「你那行小字写得对。别人只会画勾。你画了勾还写了不过。这样的人我放心一点。」<\/p><p>「你 2018 年那次，备了吗？」<\/p><p>老船长没答。他给自己倒了一杯，倒得很慢。<\/p><p>「那次以后再说。」他说。「你先把船开出去。」<\/p><p>「还有一件事。」老船长说。「明天去人才市场走一圈。」<\/p><p>「去找工作？」<\/p><p>「不是找。是看。看看退路长什么样。你要是看完回来还想做，那就做。你要是看完觉得还是上班好，那也不丢人，省了十四个月。」<\/p><p>「看一圈就知道？」<\/p><p>「你会知道的。」<\/p><p>周二上午，他去了人才市场。滨江区有一个，离地铁站不远。<\/p><p>九点半，里面已经很多人。一排排展位，每个展位一张桌子，两把椅子，一张打印的招聘信息贴在墙上。他一个一个看过去。后端开发，三到五年，一万五到两万。后端开发，五年以上，两万到两万五。有一家写的是「加密货币交易平台，后端，急聘」，他站了一会儿，没上去。<\/p><p>他在一个展位前排了队。前面四个人。轮到他，对面是一个二十多岁的女孩，问他做过什么。他说了对账平台，说了订单系统。女孩点头，记下来，说「简历发我」。他说好。<\/p><p>「为什么离开上一家？」<\/p><p>「被裁了。」<\/p><p>女孩点了点头，像听过很多次。「现在很多。」她说。「什么时候能到岗？」<\/p><p>「不确定。」<\/p><p>她在纸上画了一个圈，没再问。<\/p><p>出来的时候十一点。太阳很大，门口有人在发传单，一张接一张，没人停下来看。他在门口的台阶上坐下，手里一张宣传单。他把单子折了两折，放进口袋。<\/p><p>他想的不是这些工作好不好。他想的是排队的时候，前面那四个人。四个人里有两个跟他年纪差不多，穿着衬衫，手里拿着简历。轮到他们的时候，他们说话很快，笑得很快。<\/p><p>他坐了二十分钟，回家了。<\/p><p>下午他把简历打开，改了一遍。把对账平台加上去。把「云梯科技 2022.01–2025.06」写好。他把文件存了，没有发。<\/p><p>晚上沈月问：「去了？」<\/p><p>「去了。」<\/p><p>「怎么样？」<\/p><p>「有工作。一万五到两万。」<\/p><p>「投了？」<\/p><p>「没有。」<\/p><p>「为什么？」<\/p><p>他想了一下。「排队的时候，我在想六月的数字。」<\/p><p>她没再问。<\/p><p>周三，六月二十五号。<\/p><p>早上他把简历文件又打开，看了一遍。关掉。他给周冉发了一条消息：「不投了。」<\/p><p>周冉回：「先别写代码。把六月的账算完，七月的目标定了再说。」<\/p><p>「行。」<\/p><p>「还有，回头率。」<\/p><p>「四成，没变。」<\/p><p>「那就行。」<\/p><p>他打开电脑，没写代码。他把六月到今天的收入算出来，一万三千四。然后他把七月的目标写下来：不看行情，看回头的人；上一个工具；每天在群里。<\/p><p>晚上，沈月下班回来。他没等她开口，把账本拿出来，放在桌子中间。<\/p><p>「今天几号？」她问。<\/p><p>「二十五。」<\/p><p>「不是一号。」<\/p><p>「先看一次。」<\/p><p>她坐下来。他翻开账本，一条一条念：六月收入到今天一万三千四；六月支出到今天一万七千一，比往常多，有一笔是补偿到账前垫的社保；存款加补偿二十六万，粮的账户里二十二万二，另外三万八在活期。还剩十四个月。<\/p><p>她听完，拿过笔，在那一页底下写了一行：「6.25，一起看过。」签了一个「月」字。<\/p><p>「下次一号。」她说。<\/p><p>「嗯。」<\/p><p>「你今天说了几句整话？」<\/p><p>「不知道。」<\/p><p>「我数了。七句。」她把账本合上。「够了。」<\/p><p>十一点，他在圈子上发了航海日志。发完没看数字，把手机放在桌上，反面朝上。<\/p><p>过了一会儿他还是翻过来看了一眼。小杜在底下回了一句：「拓哥，我也想。」<\/p><p>他没回。他把手机又翻过去。<\/p><p>三天以后，六月二十八号，凌晨一点。他在阳台上改空投查询的一个小问题，用户群跳出一条消息。<\/p><p>「我的助记词丢了。八万块没了。有办法吗？」<\/p><p>发消息的人叫阿珍。<\/p><aside class=\"log\"><div class=\"log-label\">航海日志<\/div><p>6 月 25 日。全职了。不是因为勇敢，是因为算过。<\/p><p>存款加补偿 26 万，月支出 1.85 万，14 个月。副业收入 3、4、5 月都过了工资一半。这两条是夜航船的第四律，我逐条对了。<\/p><p>但我知道 5 月是潮水。按 2 月的 5,600 算，第二条不过。多备的两个月就是给这个用的。<\/p><p>家里的规矩：每月一号一起看账，三个数，挣了多少、花了多少、还剩几个月。<\/p><p>去人才市场看了一圈。有工作。没投。<\/p><\/aside>", "words": 4820}, {"num": 16, "title": "助记词", "vol": 1, "html": "<p>2025 年 6 月 28 日，凌晨一点零七分。滨江出租屋的阳台。<\/p><p>林拓全职的第三天。他在改空投查询的一个小问题，用户群跳出一条消息：「我的助记词丢了。八万块没了。有办法吗？」<\/p><p>发消息的人叫阿珍。头像是一只猫。<\/p><p>群里没人回。这个点，大鹏他们都睡了。林拓看着那条消息，过了一分钟，私聊她：「在吗？说说怎么回事。」<\/p><p>她回得很快，像是一直盯着屏幕。<\/p><p>「我大三。去年在一家海外的公司远程实习，工资是用稳定币发的。」<\/p><p>稳定币，链上的美元，一块钱永远是一块钱。<\/p><p>「加上奖学金换的，一共八万零三百。都在一个钱包里。我是照着教程建的钱包，教程说把十二个单词抄下来，抄在纸上，别拍照。我抄在一个本子的最后一页。」<\/p><p>「本子呢？」<\/p><p>「放假搬宿舍，一箱东西没带走，让宿管处理了。今天回来翻，没了。」<\/p><p>「手机上的钱包 App 还在吗？」<\/p><p>「换手机了。旧的恢复出厂卖了。我想着有本子就行。」<\/p><p>林拓没马上回。他知道这意味着什么，但他还是把地址要过来，在余额雷达上查了一遍。<\/p><p>八万零三百一十二块。一分没少。钱在那儿。<\/p><p>「钱还在。」他说。「但拿不出来。」<\/p><p>「怎么会？钱不是在那儿吗？」<\/p><p>他想了一下怎么说。<\/p><p>「助记词是一把钥匙。这把钥匙只有一份，丢了没法补，没有人能给你配。而且谁捡到，谁就能开门。」<\/p><p>那边安静了很久。<\/p><p>「那本子要是被人捡到……」<\/p><p>「那钱就是他的了。没人拦得住。」<\/p><p>「没有客服吗？」<\/p><p>「没有。链上没有客服。这是它的规矩，也是它的问题。」<\/p><p>「那我怎么办？」<\/p><p>他打了几个字，删掉。又打了几个字，又删掉。最后他说：「没办法。我陪你看一段时间。要是钱一直不动，说明本子没被人捡到，只是丢了。要是动了，就是被人拿走了。两种结果，钱都回不来。」<\/p><p>「那看有什么用？」<\/p><p>「没用。」他说。「就是看。」<\/p><p>她隔了很久回了一句：「谢谢。」<\/p><p>他把她的地址放进余额雷达的监控里，设了提醒，一有变动就通知。这个功能是三月做的，本来是给做空投的人盯大户用的。做完这个，凌晨两点。他没再改代码，坐在阳台上，看对面楼一扇亮着的窗，看到它灭了。<\/p><p>早上他跟沈月说了这件事。她在刷牙，听完把牙刷拿出来。<\/p><p>「八万，大学生？」<\/p><p>「实习攒的。」<\/p><p>「一个本子？」<\/p><p>「一个本子。」<\/p><p>「这种事多吗？」<\/p><p>「我去查查。」<\/p><p>他查了一天。海外有人做过估算：永远拿不出来的币，按现在的价格算，值上万亿人民币。每年都在增加。原因排在前面的是三个：钥匙丢了，钥匙被人偷了，人没了钥匙没交代。<\/p><p>他把这些数记在账本上，觉得这些数没有意义。八万零三百一十二，这个数有意义。<\/p><p>晚上他在圈子上发了一条：「你丢过助记词吗？或者差点丢过？说说怎么丢的。」<\/p><p>第二天早上有四十一条回复。抄在本子上本子丢了，八个。拍了照片手机丢了，六个。存在网盘账号被盗，三个。抄错了一个字母，五个。记在脑子里忘了，两个。剩下的是「差点」：搬家、洗衣服、小孩撕了、老婆扔了。<\/p><p>有一条只有一句话：「我爸走了，钱在他手机里，我们谁也进不去。」<\/p><p>他把四十一条一条一条看完，按原因分了类，记在文件里。不是一个人的事。<\/p><p>大鹏白天看到了消息，在群里问阿珍要了地址，也帮着看。大鹏说：「我见过五个这样的。都是本子、截图、微信收藏。没一个回来的。」<\/p><p>二十九号，周日，阿珍的地址没动。<\/p><p>三十号，周一，没动。<\/p><p>七月一号，周二晚上，第一次正式一起看账。沈月把账本放在桌子中间，他念数：六月收入一万五千八，比五月少五千二，行情在走；六月支出一万八千九；粮的账户二十二万二，没动；还剩十四个月，没变。<\/p><p>她在底下写：「7.1，一起看过。月。」<\/p><p>「阿珍那个钱呢？」她问。<\/p><p>「没动。」<\/p><p>「她还在群里？」<\/p><p>「每天问我一次。」<\/p><p>「你每天答她一次？」<\/p><p>「嗯。」<\/p><p>「答什么？」<\/p><p>「没动。」<\/p><p>她把账本合上。「你在想什么？」<\/p><p>「我在想，为什么要有那把钥匙。」<\/p><p>七月二号，凌晨，他把想法写在一个新文件里。文件名他没想好，先叫「没有钥匙」。<\/p><p>钱包为什么要有助记词？因为链上的钱认钥匙不认人。谁有钥匙，谁就是主人。钥匙丢了，主人就没了。这个设计是为了不靠任何人，结果是不能靠任何人。<\/p><p>那能不能换一种钥匙？<\/p><p>手机上早就有一种钥匙了：指纹，面容。开手机用它，付钱用它，进银行 App 也用它。它叫通行密钥。人话说，就是用你的手指或者你的脸当钥匙。钥匙存在手机的一块安全芯片里，你自己都拿不出来，别人也偷不走。换手机的时候，它跟着你的云账号走。<\/p><p>如果钱包用这个签名，就不用抄十二个单词。<\/p><p>但还有一个问题。钥匙换了，锁没换。链上的账户还是一把钥匙对一个地址，钥匙丢了还是一样。<\/p><p>除非账户本身不是一把钥匙，是一个保险箱。<\/p><p>链上有一种账户，叫智能合约账户。普通账户是一把裸露的钥匙，谁拿到谁开。合约账户是一个有规矩的保险箱。规矩是写进去的：可以有两把钥匙，丢一把另一把还能开；可以规定一天最多取多少；可以换锁，不用换箱子。钥匙丢了，用另一把钥匙进去，换一把新的。<\/p><p>他写到这里，天亮了。<\/p><p>他把文件读了一遍，删掉一半形容词，发给周冉。<\/p><p>周冉半小时后回：「先别写代码。你这是要做钱包？」<\/p><p>「嗯。」<\/p><p>「钱包。」周冉又打了两个字。「你知道这是什么东西吗？」<\/p><p>「知道。」<\/p><p>「不，你不知道。阿凯你见过，去年夏天在不打烊问你云同步那个。你得再见他一次。周四，不打烊，老船长也在。」<\/p><p>七月三号，周四下午两点，不打烊。桌上一壶普洱，四个杯子。<\/p><p>老船长坐在老位置。周冉旁边坐着陈凯。还是那副黑框眼镜，背着一个很旧的双肩包，包上一个字都没有。去年夏天在这张桌子上，他问过林拓一句：你哪天不做了，他们的账呢。这一年他只在群里冒过几次头，每次开头都是「有一个问题」。他坐下之后先把手机反面朝上放在桌上，然后才看林拓。<\/p><p>「阿凯在一家交易所做过安全。」周冉说。「现在自己接活。」<\/p><p>「你好。」林拓说。<\/p><p>阿凯点了点头，没说你好。他说：「有一个问题。」<\/p><p>三个人都看着他。<\/p><p>「你为什么要做钱包？」<\/p><p>林拓把阿珍的事讲了一遍。八万零三百一十二，一个本子，一个宿管。讲到「没有客服」的时候，阿凯的表情没变。<\/p><p>「我见过几百个。」阿凯说。「在交易所的时候，每天都有。八万算少的。我见过八百万的。本子被水泡了。」<\/p><p>「所以我想做一个没有助记词的钱包。」<\/p><p>阿凯没接。他把杯子端起来，喝了一口，放下。<\/p><p>「有一个问题。钱包是最容易让人倾家荡产的软件。你做工具站，出了错，赔四千块，发个报告，用户原谅你。你做钱包，出了错，用户的钱没了，是全部。不是一个人，是所有用户。你确定？」<\/p><p>林拓没马上答。<\/p><p>「我确定我想做。」他说。「不确定能不能做好。」<\/p><p>「这两个不是一回事。」<\/p><p>「我知道。」<\/p><p>阿凯看了他几秒钟，然后看周冉。周冉耸了一下肩。<\/p><p>老船长这时候才开口。他倒茶，倒得很慢，倒完才说：「这是一艘大船。」<\/p><p>「嗯。」<\/p><p>「咔哒是小船。小船翻了，你游回来。大船翻了，你和船上的人一起沉。」老船长把壶放下。「大船还是要过三问。一个一个来。第一问，谁会为它付钱？」<\/p><p>林拓想了很久。<\/p><p>「不知道。」他说。「钱包都是免费的。没人为钱包付钱。」<\/p><p>「那你靠什么活？」<\/p><p>「换币的时候抽一点。企业客户。这些我都没想清楚。」<\/p><p>「第一问答不清楚。」老船长说。「记下来。第二问，他们今天在哪儿，正在用什么凑合？」<\/p><p>「在交易所。钱放在交易所里，交易所替他们管钥匙，方便，但钱不是自己的。或者用浏览器插件钱包，自己管钥匙，抄在本子上，怕丢。像阿珍这样的。」<\/p><p>「第三问，你凭什么比他们现在的办法好？」<\/p><p>「不用记十二个单词。用指纹和脸开门。钥匙丢一把还有一把。」<\/p><p>老船长点点头。「第二问和第三问过了。第一问没过。」<\/p><p>「那能做吗？」<\/p><p>「我不劝人造船。」老船长说。「但我告诉你我怎么看。第一问答不出来，说明你还不知道这艘船开到哪儿去。可以造，边造边问。但你得每个月把第一问拿出来问一遍，问三个月还答不出来，就停。」<\/p><p>「行。」<\/p><p>「还有。」老船长看了阿凯一眼。「大船得有一个看水的。」<\/p><p>阿凯没表态。他说：「有一个问题。你说钥匙丢一把还有一把。另一把在哪儿？」<\/p><p>「第二台设备。或者一个信任的人。」<\/p><p>「信任的人要是不可信呢？两把都在你手上，两把一起丢呢？备用钥匙能不能被人偷偷多加一把？」阿凯一句接一句。「你现在答不出来没关系。我只是告诉你，每一个问题背后都是有人的钱。」<\/p><p>「我记下来。」<\/p><p>「记下来不够。」阿凯说。「你要一条一条写清楚，写不清楚的那条，就不做。」<\/p><p>「还有一个问题。」阿凯说。「代码给不给人看？」<\/p><p>「给。」<\/p><p>「全部？」<\/p><p>「全部。」<\/p><p>「那好。」阿凯说。「不给人看的钱包我不碰。用户的钱放在里面，凭什么信一个看不见的东西。」<\/p><p>周冉这时候把杯子往前推了一下。<\/p><p>「我说两句。」<\/p><p>「说。」<\/p><p>「他这个东西，一年之内不会有收入。我做过增长，我知道钱包这种东西要多久才有人用。所以先说清楚，钱从哪儿来。」她看着林拓。「咔哒继续跑。咔哒一个月一万多，够你服务器，够你一半生活费。你拿咔哒的钱造船。小工具养大船。粮的账户一分不能碰。」<\/p><p>「行。」<\/p><p>「咔哒每周还得更新。你不能一头扎进船里，把工具箱扔了。工具箱扔了，船也没钱造。」<\/p><p>「行。」<\/p><p>「别老说行。」周冉说。「你回去把预算写出来。一个月能给船花多少，写个数。」<\/p><p>散的时候阿凯先走，背着那个旧包，走得很快。周冉和林拓一起去地铁站。<\/p><p>「他那个人，说话难听。」周冉说。「但他在交易所三年，拦下来的钱比你这辈子能挣的多。你要做这个，得有一个天天说不的人。」<\/p><p>「他会来吗？」<\/p><p>「他没说不来。」周冉说。「他要是不想来，刚才第一个问题问完就走了。」<\/p><p>回去的地铁上，他算了一下。咔哒六月一万五千八，服务器和工具四千。剩下一万一千八。他和沈月的开销一万八千五，沈月九千，他这边九千五。一万一千八减九千五，两千三。<\/p><p>一个月两千三造船。他把这个数写在手机备忘录里。<\/p><p>晚上他把这个数给沈月看。她看了一眼，「两千三」，没说别的。过了一会儿她说：「比我买书的钱多。」<\/p><p>他看着觉得很少。又想，九十九块能卖一年 Pro，两千三也能做点什么。审计不够。服务器够。<\/p><p>七月四号，阿珍的地址还是没动。他告诉她，她说「好」。他问她开学以后打算怎么办，她说不知道，可能再找一份实习。<\/p><p>「本子的事别再想了。」他说。<\/p><p>「我不想。」她说。「我就是想知道，为什么非得是个本子。」<\/p><p>他没答。他把这句话记下来。<\/p><p>七月四号晚上，他没写信风的代码。他做了一个很小的东西：一个网页，一个按钮。按下去，手机弹出指纹验证，按一下手指，网页上出现一串签名。<\/p><p>他把手机递给沈月。「你按一下。」<\/p><p>她按了。手机震了一下，屏幕上跳出一行字母和数字。<\/p><p>「这是什么？」<\/p><p>「签名。你刚才用手指签了一个名。以后转账，就是这样签。不用抄单词。」<\/p><p>「就这样？」<\/p><p>「就这样。」<\/p><p>她把手机翻过来看了看背面，又翻回来。「手机丢了呢？」<\/p><p>他没答。<\/p><p>「手指没了呢？」<\/p><p>「你先问的是手机。」他说。「手机丢了，钥匙跟着云账号走，新手机能拿回来。手指没了……用脸。」<\/p><p>「脸也没了呢？」<\/p><p>「那就得有第二把钥匙。」<\/p><p>「第二把在哪儿？」<\/p><p>「还没想好。」<\/p><p>她把手机还给他。「你这个东西，我一个小学老师问三句就问住了。」<\/p><p>「嗯。」<\/p><p>「阿珍要是问呢？」<\/p><p>「她问过了。她问为什么非得是个本子。」<\/p><p>「那你先回答她这个。」沈月说。「别的以后再说。」<\/p><p>七月五号，周六晚上。沈月在沙发上看书，一本讲大航海的小说。他坐在旁边，开着电脑，那个叫「没有钥匙」的文件夹在屏幕上。<\/p><p>「名字还没想好？」她问。<\/p><p>「没有。」<\/p><p>「你们那个群，什么都是船。」<\/p><p>「嗯。」<\/p><p>「那你要的是什么？」<\/p><p>他想了一下。「阿珍要的不是船。是靠得住。」<\/p><p>她翻了一页。「有一种风靠得住。地理课本上的。每年按时来，从同一个方向来，以前跑船的人靠它。」<\/p><p>「什么风？」<\/p><p>「信风。」<\/p><p>他看着她。<\/p><p>「信是相信的信。」她说。「也是守信的信。」<\/p><p>他把文件夹的名字改了：信风。<\/p><p>改完，他新建了一个文件，在第一行写：「原则一：没有助记词。」<\/p><p>他把这行字拍了照，发到一个新建的群里。群里三个人：他，周冉，阿凯。<\/p><p>阿凯回得很快，像一直在等。<\/p><p>「那你要先回答，钥匙丢了怎么办。」<\/p><aside class=\"log\"><div class=\"log-label\">航海日志<\/div><p>7 月 5 日。开始造一艘大船。名字叫信风。<\/p><p>起因是一个用户丢了本子，本子上抄着助记词。八万，永远拿不出来了。我什么也帮不上。<\/p><p>三问过了两问。第一问「谁付钱」我还答不全。老船长的规矩：每月问一次，三个月答不出就停。<\/p><p>咔哒养它。每月能给它 2,300。粮不动。<\/p><p>阿凯的第一个问题：钥匙丢了怎么办。这个问题我得先答。<\/p><\/aside>", "words": 4851}, {"num": 17, "title": "大船的规矩", "vol": 2, "html": "<p>七月十二号，周六，杭州三十六度。<\/p><p>林拓全职的第十七天。阳台太晒，他把小桌子搬进了客厅，靠着空调。桌上三样东西：笔记本电脑，一沓 A4 纸，一把旧螺丝刀。螺丝刀压着纸。<\/p><p>周冉一点整到。她拎着一袋冰矿泉水，进门先看桌子。「就这儿？」<\/p><p>「就这儿。」<\/p><p>「行。阿凯呢？」<\/p><p>「说十分钟。」<\/p><p>阿凯一点二十才到，背一个很沉的双肩包。他把包放在门边，先看了一眼路由器，又看了一眼林拓电脑上的贴纸。「摄像头贴了。行。」<\/p><p>沈月在厨房洗西瓜。学校放暑假了，她在家。她探出头：「吃了饭再开始？」<\/p><p>「先开始。」周冉说，「吃饱了人会困。」<\/p><p>林拓抽出一张纸，在最上面写了两个字：信风。下面画一条线。<\/p><p>「上次写了一条。」他说，「今天写全。」<\/p><p>「先说规矩。」周冉说，「每一条都要有理由。说不出理由的，不许写。」<\/p><p>阿凯点头。「而且理由要能顶住三年。三年后我们看回来，不能笑自己。」<\/p><p>林拓写：一、没有助记词。<\/p><p>「理由。」周冉说。<\/p><p>「阿珍。」林拓说，「八万块，一个本子。本子丢了，钱还在链上，永远拿不出来。」<\/p><p>助记词，上一次他们已经说清楚了：一把只有一份、丢了没法补的钥匙，谁捡到谁就能开门。他不想再说一遍。<\/p><p>「那用什么？」周冉问，「上次说指纹，我没听懂。」<\/p><p>「通行密钥。」林拓说，「就是用指纹当钥匙。手机认你的指纹，认了才放签名出去。单词不用记，钥匙也不用抄。」<\/p><p>「指纹能被偷吗？」<\/p><p>「指纹不出手机。」阿凯说，「出去的只是签好的字。」<\/p><p>阿凯举手。「有一个问题。」<\/p><p>「说。」<\/p><p>「上次那句。钥匙丢了怎么办。你答了吗？」<\/p><p>「没有。」<\/p><p>「那这条现在只有一半。」<\/p><p>林拓在这一条旁边画了一个圈，圈里写：钥匙在哪？<\/p><p>「画圈的意思是欠着。」周冉说，「欠着的不能上线。」<\/p><p>「嗯。」<\/p><p>二、不碰用户资产。<\/p><p>「这条是咔哒的规矩。」林拓说，「我们是一把扳手。钱一直在用户自己口袋里。」<\/p><p>「不够。」阿凯说，「你再想想，你要是碰了，会怎么样。」<\/p><p>林拓想了一下。「我们变成靶子。」<\/p><p>「对。你手里攥着一万个人的钱，全世界的贼都盯着你一个人。我在交易所那三年，」阿凯停了一秒，「一年被打几十次。有人守着都守不住。你三个人，守什么。」<\/p><p>「还有一条。」周冉说，「你攥着别人的钱，法律上你就是一家没牌照的银行。」<\/p><p>林拓在第二条后面写：不做靶子，不做银行。<\/p><p>三、核心合约不自写。<\/p><p>这条是阿凯的。他从包里拿出一个本子，翻开。<\/p><p>「信风是一个智能合约账户。上次说过，一个有规矩的保险箱，不是一把裸露的钥匙。保险箱的规矩写在链上。谁能开，怎么换锁，一次能拿多少，都是规矩。」<\/p><p>「我知道。」<\/p><p>「你想自己写规矩。」<\/p><p>「写得清楚。」<\/p><p>「你写得清楚，别人不信。」阿凯说，「你知道审计一遍多少钱吗？几十万。而且钱只买一个人看一遍。」<\/p><p>林拓没说话。<\/p><p>「造船，龙骨是最底下那根。歪了，整条船都歪。」阿凯慢慢说，「现在有几个开源的智能账户合约。代码公开，很多人查过，钱放在里面好几年没出过事。这是别人造好、很多人检查过的龙骨。我们拿来用。我们自己只写上面那一小块：怎么加钥匙，怎么换钥匙。」<\/p><p>「用别人的，出了事算谁的？」<\/p><p>「算我们的。」阿凯说，「但你自己写的没人打过。那根龙骨被人打了三年。你要没人打过的，还是被打了三年的？」<\/p><p>林拓写下第三条。后面加一句：龙骨用现成的，只写自己那一小块。<\/p><p>「好。」周冉说，「下一条。」<\/p><p>四、开源。<\/p><p>「钱包的代码要能看。」林拓说。<\/p><p>「为什么。」<\/p><p>「不能看，就是让人把钱放进一个看不见里面的箱子。」<\/p><p>「还有一个用处。」周冉说，「开源了，别人会帮你说话。你不用自己吹。」<\/p><p>「开源也让抄的人省事。」阿凯说。<\/p><p>「咔哒被抄过。」林拓说，「抄的三个月死了。」<\/p><p>「钱包不一样。钱包抄了能骗钱。」<\/p><p>三个人都停了一下。<\/p><p>「那就写清楚。」林拓说，「开源，但正版只有一个，写在首页上。」<\/p><p>五、可自托管。<\/p><p>沈月端着西瓜出来，放在桌角。「自托管是什么？」<\/p><p>林拓想了想怎么说。「钱包背后有四个小程序，在我们服务器上跑，帮手机跟链上说话。可自托管的意思是，后厨的门是开着的。你不信我们，可以自己搭一个一模一样的厨房。」<\/p><p>「为什么要给人搭？」<\/p><p>「我们要是倒了呢。」阿凯说。<\/p><p>沈月看了他一眼。<\/p><p>「他说得对。」林拓说，「我们倒了，用户也得能进门。」<\/p><p>沈月没再问，回厨房了。<\/p><p>六、不发币。七、不融 VC。<\/p><p>林拓写完这两条，笔停了。<\/p><p>「理由。」周冉说。<\/p><p>「我有理由。」林拓说，「但下周郑浩来。」<\/p><p>「郑浩是谁。」<\/p><p>「大学上铺。深圳，做 AI 客服，融了两千万。」<\/p><p>周冉笑了。「那他一定劝你融资。」<\/p><p>「他说要跟我聊聊信风。」<\/p><p>「那这两条的理由，你先别写。」周冉说，「等他来了，你当面说。说得过他，再写。」<\/p><p>「说不过呢？」阿凯问。<\/p><p>「说不过就划掉。」周冉说，「规矩不是写给自己看的，是写给反对的人看的。」<\/p><p>林拓看着那两行字。他把笔放下，拿起一块西瓜。<\/p><p>「你跟几个用户聊过？」周冉忽然问。<\/p><p>「阿珍。咔哒群里十几个。」<\/p><p>「不够。下周聊完郑浩，我们聊这个。」<\/p><p>阿凯把那张纸拍了一张照，存进手机。周冉说：「贴墙上。」林拓找了一卷胶带，把纸贴在桌子上方的墙上。七条，一个圈。螺丝刀放回桌角。<\/p><p>晚饭沈月做了三个菜。番茄炒蛋，清炒空心菜，一条鲈鱼。周冉吃得很快，吃到一半问沈月：「他全职这件事，你怎么想的？」<\/p><p>沈月夹了一筷子菜。「我不看他做什么。」<\/p><p>「那看什么？」<\/p><p>「看他晚上回不回来。」<\/p><p>周冉没懂。阿凯低头吃鱼。林拓知道她的意思。上个月裁员那几天，他有三个晚上坐在阳台上没进屋。<\/p><p>「回来了。」林拓说。<\/p><p>「那就行。」沈月说，「多吃点鱼。」<\/p><p>七月十八号，周五，晚上八点。<\/p><p>郑浩从深圳来，白天见一个客户，晚上约林拓在滨江一家大排档。露天，塑料凳，小龙虾，啤酒。郑浩瘦了，眼睛下面有两块青。他一坐下就说话。<\/p><p>「四十个人了。」<\/p><p>「嗯。」<\/p><p>「一个月烧八十万。A 轮的钱还能撑不到一年。现在在谈下一轮。」<\/p><p>「客户呢？」<\/p><p>「在谈。」<\/p><p>林拓剥虾。<\/p><p>「你那个我看了。」郑浩说，「没有助记词的钱包。这个能做大。」<\/p><p>「嗯。」<\/p><p>「你听我说完。」郑浩把手机扣在桌上，「钱包这种东西，靠的是用的人多。人越多越值钱。你一个人，一天能拉几个用户？」<\/p><p>「现在还没用户。」<\/p><p>「所以。」郑浩往前探身，「我帮你融五百万。发个币，早期用户每人发一点，他们自己会拉人。一年上交易所。币有价，用户有钱，你也有钱。这一套在圈子里跑通过一百次。」<\/p><p>「跑通过一百次。」林拓说，「死了几次？」<\/p><p>「死的多。」郑浩很坦白，「但活下来的都是这么活的。」<\/p><p>「我看过发币的钱包。」林拓说，「币涨的时候，群里全是人。币跌的时候，群里也全是人，骂的。没有一个人问产品。」<\/p><p>「那是他们产品不行。」<\/p><p>「不是。」林拓放下虾，「发了币，用户就不是用户了。是赌徒。他盯的是价格，不是钱包好不好用。我加一个功能，他问对币价有没有好处。我修一个漏洞，他问币会不会跌。」<\/p><p>郑浩没接话。<\/p><p>「我做钱包，是让人把钱放进去，能睡着。」林拓说，「放进去的人看着币价睡不着，那我做的是什么。」<\/p><p>「你太理想了。」<\/p><p>「可能。」<\/p><p>郑浩喝了半杯。「那不发币，融资总行吧。就拿钱。五百万，你要审计，要人，要服务器。你现在存款多少？」<\/p><p>「二十六万。」<\/p><p>「二十六万做一个钱包？」郑浩笑了，「审一次多少钱你知道吗？」<\/p><p>「知道。几十万。」<\/p><p>「那你怎么办？」<\/p><p>「还没算清。」林拓说，「但拿了钱，节奏就不是我的了。」<\/p><p>「什么节奏。」<\/p><p>「你融了 A 轮。下一轮什么时候谈？」<\/p><p>「年底。」<\/p><p>「年底之前，你得给他们看什么？」<\/p><p>郑浩想了想。「增长。」<\/p><p>「所以你这半年做的每一件事，都是为了年底那张表。」<\/p><p>郑浩没否认。他又倒了一杯。「对。那又怎么样？拿了钱就得干活。这不是应该的？」<\/p><p>「应该的。」林拓说，「但钱包不一样。钱包要的是信。信得慢。表要的是快。快和慢，我只能挑一个。」<\/p><p>「我没得挑。」郑浩说，「四十个人，每个月十五号等着发工资。我慢一个月，他们就少一个月。你一个人，你可以慢。我不行。」<\/p><p>「所以你不该劝我快。」<\/p><p>「我劝你的是别穷死。」郑浩说，「慢可以。穷着慢，慢不了多久。」<\/p><p>林拓想了想。「这句对。」<\/p><p>「你知道大厂会做吗？」郑浩说，「你做出来，他们三个月抄一个。他们有钱，有人，有牌照。你没钱，怎么打？」<\/p><p>「不知道。」<\/p><p>「你不知道？」<\/p><p>「我不知道怎么打。」林拓说，「但我知道拿了五百万也打不过。五百万在他们那儿是一个季度的广告费。」<\/p><p>「那你就不做了？」<\/p><p>「做。做他们不做的那一份。」<\/p><p>「哪一份？」<\/p><p>「还不知道。」<\/p><p>郑浩笑出声，靠回椅子。「你还是那样。大学就这样。别人打游戏，你在下铺看书，问你看什么，你说还不知道。」<\/p><p>两个人安静了一会儿。大排档的老板娘过来添了一盘毛豆。<\/p><p>「拓。」郑浩说，「我不是劝你。我是怕你后悔。」<\/p><p>「嗯。」<\/p><p>「你二十九了。沈月呢？你们俩要不要结婚？房子呢？她妈问不问？你这么做，三年后可能什么都没有。」<\/p><p>「嗯。」<\/p><p>「我们这条路，快。三年，要么有，要么没有，至少知道结果。你那条路，三年后可能还是一个月两万块。」<\/p><p>「两万块也是钱。」<\/p><p>「两万块养不起团队。」<\/p><p>「我不养团队。」林拓说，「我养一个店。」<\/p><p>郑浩看着他。「你会后悔。」<\/p><p>「可能会。」林拓说，「但拿了钱，我也会。」<\/p><p>郑浩举起杯子。「那就喝。」<\/p><p>两个人碰了一下。<\/p><p>十点半，林拓送郑浩到路边打车。郑浩点了一支烟，没抽，夹在手里。<\/p><p>「你们的客户，用你们客服系统的那些人。」林拓问，「你跟他们聊过吗？」<\/p><p>「有销售。」<\/p><p>「你自己呢。」<\/p><p>郑浩想了一会儿。「没有。」<\/p><p>车来了。郑浩上车前回头说：「你那个钱包，出来告诉我。我第一个用。」<\/p><p>「行。」<\/p><p>车走了。林拓在路边站了一会儿，走回家。<\/p><p>沈月没睡，在沙发上看书。「喝了多少？」<\/p><p>「三瓶。」<\/p><p>「他说什么？」<\/p><p>「让我融资。发币。」<\/p><p>「你呢？」<\/p><p>「没答应。」<\/p><p>沈月把书放在腿上。「他说得有道理吗？」<\/p><p>「有一半。」<\/p><p>「哪一半？」<\/p><p>「钱不够。」<\/p><p>「那另一半呢？」<\/p><p>「钱够了也不行。」<\/p><p>沈月看了他几秒。「碗在池子里。」<\/p><p>林拓去洗碗。水开得很小。他洗得很慢。沈月没再说话，翻了一页书。<\/p><p>第二天中午，周冉打电话来。<\/p><p>「说过了？」<\/p><p>「说过了。」<\/p><p>「输了没？」<\/p><p>「没输。也没赢。」<\/p><p>「行。那两条留着。」周冉说，「现在说下一件事。先别写代码。」<\/p><p>「我已经在写了。」<\/p><p>「停。」周冉说，「你写的每一行，现在都没人要。先看有多少人要。」<\/p><p>「怎么看。」<\/p><p>「咔哒每个工具页顶上，加一行字。我们在造一个没有助记词的钱包。想第一个用，留邮箱。就这一句，一个输入框。群里也发一条。」<\/p><p>「然后呢。」<\/p><p>「看漏斗。」周冉说，「漏斗你懂吧。上头宽，下头窄。一万个人看见，四百个人点，一百个人留。每一层漏掉多少，就是你的用户在哪一步不信你。」<\/p><p>「要看多久？」<\/p><p>「三天。」<\/p><p>「三天太短。」<\/p><p>「三天够了。」周冉说，「三天留不到一百个，这船你别造。」<\/p><p>林拓挂了电话，打开咔哒的代码。那一行字他改了四遍。最后是：我们在造一个没有助记词的钱包。想第一个用，留下邮箱。<\/p><p>下午三点上线。<\/p><p>三天后，周冉发来一张截图，是他自己后台的数字，她比他先看。看见的人七千一百。点的四百三十。留邮箱的一百三十八。<\/p><p>「行。」她说，「能造。」<\/p><p>林拓把一百三十八个邮箱导出来，存了一个文件，命名「等待名单」。<\/p><p>输入框旁边有一行「想说的话」，不是必填。四十多个人写了。他一条条看。<\/p><p>「别丢我钱。」<\/p><p>「我丢过一次，两万。」<\/p><p>「不用记单词就行。」<\/p><p>「你们跑路了怎么办？」<\/p><p>最后这条他看了两遍。他把它复制下来，贴在那张纸的第五条旁边。<\/p><p>七月二十号，周日。他把七条规矩写进航海日志，发出去。<\/p><p>发完，他把截图发给老船长。<\/p><p>老船长过了四十分钟才回。一句话：「规矩写了。谁付钱？」<\/p><p>林拓盯着这四个字，没回。<\/p><p>晚上十一点，沈月睡了。他打开咔哒的后台。<\/p><p>日访客的那条线，上个月一直在两千四百上下。这几天，两千一，一千九，一千八。手续费那条线也在往下走。他切到行情页。币价的线，从月初开始，一路往下。<\/p><p>他翻开记账的本子。这个月到今天，咔哒进账一万四。上个月同一天，一万九。存款那一栏，二十五万六。他在旁边写了一个日期。<\/p><p>他看了很久。<\/p><p>行情转了。<\/p><aside class=\"log\"><div class=\"log-label\">航海日志<\/div><p>7 月 20 日。信风的七条原则。写在这里，以后打脸大家看得见。<\/p><p>一、没有助记词。二、不碰用户资产。三、核心合约不自写。四、开源。五、可自托管。六、不发币。七、不融 VC。<\/p><p>每一条我都被人问过为什么。答不上来的那一条，我画了一个圈。<\/p><p>等待名单三天：看见 7,100，点 430，留 138。<\/p><p>咔哒继续跑。它养船。<\/p><\/aside>", "words": 4848}, {"num": 18, "title": "熊市", "vol": 2, "html": "<p>十月九号，国庆假期后的第一个工作日。林拓没有假期，也没有工作日。<\/p><p>出租屋里，墙上那张纸还贴着。七条，一个圈。他全职第四个月，信风造了三个月，代码有了一个能跑的壳，还不能装钱。<\/p><p>早上八点，他先看咔哒的后台。这是他的习惯，像父亲早上先拉卷帘门。<\/p><p>日访客一千一百。九月还有一千八。五月是两千四。<\/p><p>手续费那条线更难看。九月整月九千，十月过了九天，两千出头。<\/p><p>他把这几个数抄在本子上。旁边一栏是存款：二十一万。六月是二十六万。每个月少一万多，跟计划一样。计划是这样的，看着还是难受。<\/p><p>沈月出门前看了他一眼。「今天吃什么？」<\/p><p>「随便。」<\/p><p>「那我买鱼。」她说，「便宜。」<\/p><p>她走后，他打开咔哒的邮箱。第一封是退款。一个用了半年的 Pro 用户，写了两句话：「最近不做了。剩下的月份能退吗？」<\/p><p>按规矩，年费不退。他看了一眼这个人的记录。三月买的，用批量转账发过四十多次，每次几百个地址。<\/p><p>他回：「可以。按月折算，退你 41 块。有需要随时回来。」<\/p><p>第二封也是退款。第三封是问：「你们还做吗？」<\/p><p>他回：「做。」<\/p><p>一上午，四封退款，两封问还做不做。他一封一封回完，去阳台站了一会儿。楼下的桂花开了，味道很重。<\/p><p>十月十五号，云账单到了。四千一百块。<\/p><p>林拓把账单发给阿凯。阿凯晚上过来，坐在小桌子旁边，把账单一行一行看。<\/p><p>「有一个问题。」阿凯说，「你的数据库为什么是按量计费？」<\/p><p>「一开始用户少。按量便宜。」<\/p><p>「现在呢？」<\/p><p>「现在不便宜了。」<\/p><p>按量计费，林拓自己也想过怎么跟沈月解释。像打车。跑一公里算一公里，堵车也算钱。用户少的时候，一天跑两公里，几块钱。用户多了，一天跑两百公里，车费比买车还贵。<\/p><p>「换固定的。」阿凯说，「租一台小机器，一个月一个价。跑多跑少都是那个价。」<\/p><p>「多小？」<\/p><p>「你现在用了多少？」<\/p><p>林拓调出用量。数据库的实际负载，平均只用到一台小机器的三成。<\/p><p>「那就一台小机器。」阿凯说，「两核四 G。四百块。」<\/p><p>「一千六变四百。」<\/p><p>「先别高兴。」阿凯说，「下一行。」<\/p><p>下一行是计算。咔哒的十四个工具，每个工具后面都有一段程序在云上跑，按调用次数收费。一千二百块。<\/p><p>「这些都得跑吗？」<\/p><p>林拓把十四个工具的调用量拉出来。批量转账、余额雷达、授权撤销、钱包批量生成、事件扫描，这五个占了八成。剩下九个，一天加起来不到两百次。<\/p><p>「九个不常用的，静态化。」阿凯说。<\/p><p>「静态化。」林拓重复了一遍。他在想怎么写进日志。像把不常改的页面直接印成一张纸。有人来要，递过去。不用每次现写。<\/p><p>「五个常用的呢？」<\/p><p>「搬到那台小机器上一起跑。四百块的机器，跑得动。」<\/p><p>「挂了呢？」<\/p><p>「有一个问题，先问你。」阿凯说，「按量计费的从来没挂过？」<\/p><p>「挂过两次。」<\/p><p>「那一样。加一台备用的，一百块。定时备份。挂了切过去，五分钟。」<\/p><p>第三行，带宽和流量。七百块。<\/p><p>「余额雷达。」林拓说，「这个吃流量。每个人查一次，我们就去链上问一次。同一个地址，一分钟被查二十次，我们就问二十次。」<\/p><p>「缓存。」阿凯说。<\/p><p>「缓存。」<\/p><p>「怎么解释？」<\/p><p>林拓想了想。「柜台上贴一张纸。常问的问题，答案写在上面。有人问，先看纸。纸上没有，再去后面翻账本。」<\/p><p>「多久换一张纸？」<\/p><p>「三十秒。」<\/p><p>「三十秒够。链上的账三十秒也变不了多少。」<\/p><p>第四行，日志和监控。五百块。阿凯看了一眼，说：「你存了多少天的日志？」<\/p><p>「九十天。」<\/p><p>「你看过第三十天以后的吗？」<\/p><p>「没有。」<\/p><p>「留七天。」<\/p><p>林拓没有立刻动手。他用了两周。先把九个不常用的工具页面改成静态的，一个一个改，改完自己点一遍。再把五个常用的搬到小机器上，先搬一个，跑三天，再搬下一个。缓存最后加。加完，余额雷达那条流量线一夜之间掉了六成。<\/p><p>中间出过一次错。红包工具改成静态页那天晚上，山田发来邮件。日本用户，年初报过精度问题的那个。这次他说：红包页面的日语没了，全是中文。<\/p><p>林拓查了半小时。静态化的时候，他把语言切换那段漏掉了。九种语言，只剩一种。<\/p><p>他改完，回邮件道歉，又在本子上记了一行：改一个东西，九种语言都要点一遍。<\/p><p>山田回了一封：「谢谢。我知道你们最近不容易。我续了 Pro。」<\/p><p>十一月一号，新账单：一千五百三十块。<\/p><p>他把两张账单并排放在桌上。四千一，一千五。<\/p><p>沈月晚上回来看到了。「省了两千六？」<\/p><p>「嗯。」<\/p><p>「每个月？」<\/p><p>「每个月。」<\/p><p>「那够我们买两个月的菜。」她说，「去洗手吃饭。」<\/p><p>十一月一号，夜航船群里发上个月收入截图。这是群规。<\/p><p>林拓发了：咔哒，十月，八千零四十。<\/p><p>上一次他发的是两万一。中间几个月，一万九，一万三，一万一，九千。这个月八千。<\/p><p>群里陆续有人发。做行情工具的那个人，从三万掉到六千。做教程站的，从八千掉到两千。有一个人发了零，后面加了一句：「回去上班了。」<\/p><p>老船长最后发。三十几个站，五万二。上个月五万八。<\/p><p>他发完截图，隔了十分钟，又发了一段话。他打字慢，一段话要打很久。<\/p><p>「行情是潮。潮退了，船都在滩上，谁也跑不快。这时候能做的事有两件：一件是把船造完，一件是捡滩上的鱼。捡鱼快。造船慢。潮回来的时候，捡鱼的还在滩上，造船的在海上。你们自己挑。」<\/p><p>底下有人问：「老船长，潮什么时候回来？」<\/p><p>「不知道。」他说，「我做了十三年，没算准过一次。」<\/p><p>林拓把这段话截了图。<\/p><p>第二天，有人私聊他。做行情工具的那个人，收入从三万掉到六千的。<\/p><p>「兄弟，接不接外包？我这边有个客户要一个批量归集的定制版，三万块，两周。」<\/p><p>三万块。咔哒四个月的收入。<\/p><p>林拓看了那条消息很久。他打开信风的文件夹，看了一眼进度。壳有了，钥匙那块没答。两周不写，进度就停两周。<\/p><p>他回：「不接。谢谢你想着我。」<\/p><p>「你不缺钱？」<\/p><p>「缺。」他说，「但我在造船。」<\/p><p>对方发了一个大拇指，没再说话。<\/p><p>晚上他跟沈月说了这件事。沈月听完，问了一句：「三万块，你犹豫了多久？」<\/p><p>「二十分钟。」<\/p><p>「那还行。」她说，「犹豫二十分钟是正常人。不犹豫的是疯子。」<\/p><p>十一月五号，房租日。四千二百块。<\/p><p>他们有一个共同的账户，房租、水电、买菜从这里出。每月十号，沈月的工资到账，她转四千五进来。林拓的咔哒收入到账，他也转四千五。这是 2022 年定的规矩，那时候他一万四，她九千。<\/p><p>十月他转了四千五。十一月，他打开账户，看了一会儿，转了四千五。<\/p><p>存款那边少了一截。<\/p><p>他算过。两个人一个月花一万八千五。房租四千二，吃饭六千，服务器一千五，剩下是零碎。沈月九千，正好一半。以前他一万四，多出的那部分是存下的。现在他八千，少的那部分从存款里出。<\/p><p>沈月没问。她每次转账都是同一个数，同一个备注：「家用」。<\/p><p>他知道她算过。她记账比他还细。<\/p><p>那天晚上，沈月妈妈打电话来。林拓在小桌子这边，听得见。<\/p><p>「在看。」沈月说。<\/p><p>「滨江太贵，看看下沙。」<\/p><p>「看了。」<\/p><p>「小林现在……」<\/p><p>「他在做自己的事。」沈月说，「妈，我这边还有作业要改。」<\/p><p>她挂了电话，回来坐在沙发上，把一叠作业本放在腿上，红笔打开。<\/p><p>「你妈问房子？」林拓问。<\/p><p>「每周都问。」<\/p><p>「嗯。」<\/p><p>「你别嗯。」沈月说，「你知道我不着急。你要是也不着急，那咱们俩就都不着急。」<\/p><p>「我着急。」<\/p><p>「那你造你的船。」她说，「急也造。」<\/p><p>十一月，林拓的一天分成两半。<\/p><p>白天，信风。上午九点到下午六点，他只做钱包的事。手机认指纹，指纹放签名，签名上链。这三步他改了十几遍。<\/p><p>晚上，咔哒。八点以后，他打开咔哒的邮箱和群。用户的问题，报错，退款，日本用户山田隔几个月就来的一封邮件。他一个一个回。有一个老用户说，批量转账页面在新手机上排版乱了。他改了半小时，发上去，回了一句「好了，您再试试」。<\/p><p>他跟沈月说过一次这个分法。<\/p><p>「白天造船，晚上开店。」<\/p><p>「哪个是店？」<\/p><p>「咔哒。店要开门，货要上架，老主顾来了要认得。跟我爸那个一样。」<\/p><p>「那船呢？」<\/p><p>「船是还没造完的东西。」他说，「店养船。」<\/p><p>沈月想了想。「你爸知道你把他的店当比喻？」<\/p><p>「不知道。」<\/p><p>「别告诉他。」她说，「他会说你店都没开过。」<\/p><p>十一月十号，周冉来。<\/p><p>她现在给两家小公司做增长咨询，按天收钱，一周三天。剩下的时间给信风，不收钱。林拓提过一次分钱，她说：「先有钱再分。」<\/p><p>她进门先看等待名单。七月一百三十八。现在四百二十。<\/p><p>「四个月，三百个。」她说，「慢。」<\/p><p>「熊市。」<\/p><p>「熊市跟留邮箱有什么关系？」周冉说，「留邮箱不要钱。」<\/p><p>林拓没说话。<\/p><p>「你每天说一句话没有？」<\/p><p>「日志一周一篇。」<\/p><p>「一周一篇不叫每天。」她说，「四律第三条，每天说一句话。不是每周。熊市里没人看行情，正好看你。」<\/p><p>「说什么。」<\/p><p>「说你今天造了什么。哪怕是一颗钉子。」周冉说，「钱包这种东西，别人不是上线那天才开始信你的。是看你造了一年，才信的。」<\/p><p>她走之前，把等待名单的曲线截了图，发到三个人的小群里。「明天开始，每天一句。我盯着。」<\/p><p>十一月中，群里有人问 Pro 的事。<\/p><p>「怎么现在 Pro 要 299 了？我记得是 99。」<\/p><p>底下有老用户回：「九月涨的。老用户不变。」<\/p><p>「什么叫不变？」<\/p><p>「以前买过的，续费还是 99。永远。」<\/p><p>「那我亏了。」<\/p><p>「你没亏。你现在 299 买了，以后再涨也不涨你的。」<\/p><p>回话的是大鹏。咔哒第一个用户，第一个付钱的人。他后面加了一句：「这个站我从第一天用到现在。他没坑过人。」<\/p><p>林拓看到这几条，没插话。他回想九月那一次。<\/p><p>九月初，周冉看了咔哒的 Pro 数据，说了三句话。<\/p><p>「99 太便宜。」<\/p><p>「一个用批量转账的人，一次省下的手续费就不止 99。你在送。」<\/p><p>「涨到 299。」<\/p><p>林拓的第一反应是老用户会骂。<\/p><p>「所以老用户不涨。」周冉说，「已经付过的，续费永远 99。新来的 299。提前两周公告。公告里把这两句话写清楚：老用户锁价，新用户涨价。」<\/p><p>「新用户会少。」<\/p><p>「会少。」周冉说，「少一半，收入也是原来的一倍半。而且来的人更认真。」<\/p><p>九月十五号涨价。那个月新 Pro 少了四成。但每个 Pro 三倍钱，算下来，Pro 这一块比八月多了七成。<\/p><p>十月熊市来了，用户少了，Pro 那一块反而还撑着。八千块里，Pro 占了五千。<\/p><p>老用户一个骂的都没有。有人在群里说了一句：「锁价这个做法，够意思。」<\/p><p>林拓把那句话截了图，跟老船长那段放在一起。<\/p><p>十一月二十二号，阿凯来看代码。<\/p><p>不是审计，还没到审计。他只是来看林拓这三个月写的那一小块：怎么加钥匙，怎么换钥匙。<\/p><p>他看了两个小时，没说话。林拓在旁边等着，去厨房倒了两次水。<\/p><p>最后阿凯合上电脑。<\/p><p>「有一个问题。」<\/p><p>「说。」<\/p><p>「用户的通行密钥，存在哪儿？」<\/p><p>「手机里。系统管。」<\/p><p>「手机丢了呢？」<\/p><p>「系统会同步到云账号。换手机，登上账号，钥匙就回来了。」<\/p><p>「如果他没开同步呢？」<\/p><p>林拓没说话。<\/p><p>「如果他新手机登不上云账号呢？如果系统哪天改了规矩，把钥匙清了呢？如果他有两台手机，系统不一样，两边的云账号不通呢？」<\/p><p>「我……」<\/p><p>「我不是刁难你。」阿凯说，「我在交易所见过的那些人，丢钱的，一半是丢了助记词，另一半是丢了手机。」<\/p><p>林拓看着墙上那张纸。第一条旁边，那个圈。圈里三个字：钥匙在哪？<\/p><p>「你现在做的，」阿凯说，「是把本子换成了手机。本子丢了钱没了。手机丢了，钱也没了。你只是换了一个丢的地方。」<\/p><p>「嗯。」<\/p><p>「没有助记词，这句话没错。」阿凯站起来，背上包，「但它后面还有一句。你得说出来。」<\/p><p>「什么。」<\/p><p>「那钥匙在哪。」<\/p><p>阿凯走了。林拓坐在小桌子前，没开电脑。<\/p><p>沈月从卧室出来倒水。「阿凯走了？」<\/p><p>「嗯。」<\/p><p>「他说什么？」<\/p><p>「他说我没造完。」<\/p><p>「那就接着造。」沈月说，「水在壶里。」<\/p><p>她回了卧室。他把阿凯问的那几句话写在本子上，一句一行。没开同步。登不上账号。系统改规矩。两台手机。写完数了数，四条。每一条后面，他都画了一个圈。<\/p><p>十一月三十号，周日，月底。<\/p><p>林拓翻开本子。收入这一栏，十一月：八千一百。云成本：一千五百二十。存款：十八万零三千。<\/p><p>他在最后一行写：船造了五个月。<\/p><p>写完，他把笔放下，看了一会儿墙上那个圈。然后打开电脑，在信风的文件夹里新建了一个文件，命名：钥匙在哪。<\/p><p>文件是空的。他盯着它。跟一年半前那个空文件夹一样。<\/p><p>不一样的是，这次他知道要写什么。他只是还不知道怎么写。<\/p><aside class=\"log\"><div class=\"log-label\">航海日志<\/div><p>11 月 30 日。收入 8,000。云成本 1,500。存款 18 万。船造了 5 个月。<\/p><p>云成本从 4,000 压到 1,500。做法：按量计费换固定小机器。常查的东西缓存 30 秒。九个不常用的页面改成静态。花了两周。<\/p><p>Pro 九月涨到 299，老用户续费永远 99。没有一个人骂。<\/p><p>今天阿凯问我：钥匙在哪。我答不上来。<\/p><p>下个月答。<\/p><\/aside>", "words": 4875}, {"num": 19, "title": "恢复", "vol": 2, "html": "<p>十二月一号，周一，杭州降温了。<\/p><p>出租屋的暖气不好用，林拓在小桌子旁边放了一个小太阳。墙上那张纸，第一条旁边的圈还在。本子上，阿凯的四个问题，每个后面一个圈。<\/p><p>存款十八万。信风造了五个月，还是不能装钱。他给自己定了一个日子：十二月底前，钥匙这件事必须答完。<\/p><p>早上他给阿凯打电话。阿凯在上班，只有午休有空。林拓把想了一周的东西说了一遍。<\/p><p>「钥匙跟着手机的云账号走。这一层系统本来就有。换手机，登上账号，钥匙跟过来。」<\/p><p>「你说的那四条呢。」<\/p><p>「所以要第二把。」林拓说，「备用钥匙。」<\/p><p>「放哪儿。」<\/p><p>「第二台设备。旧手机，平板，都行。或者一个信任的人，他手机上装信风，我把他加成备用。」<\/p><p>「备用钥匙能干什么。」<\/p><p>「不能拿钱。」林拓说，「只能换锁。」<\/p><p>阿凯那边安静了几秒。「说清楚。」<\/p><p>「保险箱有两把钥匙。日常用一把，就是指纹。备用一把放在别处。丢了任何一把，用另一把进门，把丢的那把作废，再配一把新的。两把丢一把，还能进门。两把都丢，才真丢。」<\/p><p>「备用的人跑了呢？」<\/p><p>「他拿不走钱。他只能发起换锁。换锁有四十八小时。这四十八小时里，主钥匙可以否决。」<\/p><p>「四十八小时里主钥匙也丢了呢？」<\/p><p>「那就是两把都丢了。」<\/p><p>阿凯又安静了几秒。「行。这一层我先信。」他说，「有一个问题。换锁的那一瞬间，最危险。你以后审的时候，重点看那儿。」<\/p><p>「嗯。」<\/p><p>「还有。」阿凯说，「这套东西你得让人听懂。你刚才说了三分钟，我听懂了。用户不会给你三分钟。」<\/p><p>那天晚上，林拓问沈月：「你愿不愿意当我的备用钥匙？」<\/p><p>沈月正在切菜。「什么？」<\/p><p>「我手机丢了，你手机能帮我把门打开。你拿不走钱，只能帮我换锁。」<\/p><p>「我要记什么？」<\/p><p>「什么都不用记。你手机上装信风，我把你加上。」<\/p><p>「装了以后呢？」<\/p><p>「以后就放着。我不丢手机，你一辈子用不到。」<\/p><p>沈月切完菜，把刀放下。「你妈呢？」<\/p><p>「我妈手机上连银行都没装。」<\/p><p>「那行。」她说，「我当。你别丢手机。」<\/p><p>十二月五号，周冉定了用户测试的规矩。<\/p><p>「五个人。」<\/p><p>「五个够吗？」<\/p><p>「够。」周冉说，「五个人能找出八成的大问题。第六个人开始，你看到的都是重复的。」<\/p><p>「找谁？」<\/p><p>「咔哒的老用户。他们认识你，愿意花半小时。但他们没见过信风，跟新用户一样。」<\/p><p>「怎么测？」<\/p><p>「给他们原型，让他们从头走到尾。开手机录屏。让他们边做边说，想什么说什么。」周冉说，「最重要的一条：你不许说话。」<\/p><p>「他们卡住了呢？」<\/p><p>「卡住了也不许说。你说一句，你就永远不知道他会不会自己过去。」<\/p><p>「那看什么？」<\/p><p>「看退出点。」周冉说，「每个人在哪一步停了，停了多久，最后是过去了还是走了。五个人叠在一起，卡在同一个地方的，就是你的问题。」<\/p><p>林拓在咔哒群里发了一条：找五个人，测一个新东西，半小时，给一百块。十分钟报满了。<\/p><p>第一个是阿珍。丢了八万那个大学生。她说：「不用给钱。我想看看。」<\/p><p>第二个是大鹏。第三个是做空投的一个人，四十多岁，群里叫他老周。第四个是一个海外的华人用户，远程录屏。第五个是一个刚入圈半年的年轻人，用了三个月咔哒。<\/p><p>十二月八号到十号，三天，五场。<\/p><p>阿珍第一个。她坐在小桌子对面，用林拓的测试手机。周冉坐在沙发上，看着。林拓坐在她斜后面，手放在腿上。<\/p><p>第一屏：「创建智能合约账户」。<\/p><p>阿珍停了。「这是什么？」<\/p><p>没人回答。<\/p><p>「智能……合约……账户。」她念了一遍，「我要不要买什么东西？」<\/p><p>她看了看林拓。林拓没动。她点了「创建」。<\/p><p>第二屏：「注册通行密钥」。<\/p><p>「密钥？」阿珍说，「不是说没有密钥吗？」<\/p><p>她停了二十秒。周冉在本子上写了一行。<\/p><p>阿珍试着点了一下，手机弹出指纹。她按了。过了。<\/p><p>「哦。」她说，「是指纹。那为什么不写指纹。」<\/p><p>第三屏：「创建备用钥匙」。<\/p><p>阿珍看着这一屏，很久没动。「备用钥匙。」她说，「是要我再抄一个东西吗？」<\/p><p>她没抄。她也没点。她把手机放下了。「我上次就是抄了一个本子。」<\/p><p>林拓的手在腿上握了一下。<\/p><p>周冉说：「继续。」<\/p><p>阿珍拿起手机，点了「跳过」。<\/p><p>后面几屏她走得很快。走完，她把手机放回桌上，坐了一会儿。<\/p><p>「如果那时候有这个，」她说，「我那八万……」<\/p><p>「那时候没有。」林拓说。<\/p><p>「嗯。」她站起来，把外套穿上，「做出来告诉我。我第一个用。」<\/p><p>她走了。周冉在本子上写：第三屏，跳过。停一分十秒。<\/p><p>大鹏第二个。他在第一屏问了同一句：「这是什么？」在第三屏停了一分半，最后点了「跳过」。<\/p><p>老周第三个。他在第三屏退出了。直接按了返回，把应用关了。「我以为要交钱。」他说，「备用钥匙，听着像要买。」<\/p><p>大鹏做完，把手机推回来，说了一句：「你写这么多字干什么。咔哒不就一个按钮，一个框。」<\/p><p>林拓没答。周冉在本子上写了一行，画了个圈。<\/p><p>海外那位是远程。他那边是早上，杭州是晚上。他开着录屏，一边点一边说英文夹中文。第二屏停了四十秒。他说：「passkey，我知道这个。但你写的是密钥。我以为是另一个东西。」第三屏跳过了。<\/p><p>年轻人走得最快。他在第三屏也停了，说：「这个是不是那种守护人？我见过。」然后他也跳过了。<\/p><p>三天结束。周冉把本子摊在桌上，画了一张表。五行，一行一个人。每一列是一屏。格子里写停了多久，最后走没走。<\/p><p>第三屏那一列，五个格子全有字。三个人停了一分钟以上。一个人退出了。没有一个人真的创建了备用钥匙。<\/p><p>「五个人。」周冉说，「三个卡在同一步。一个走了。零个做完。」<\/p><p>林拓看着那张表。<\/p><p>「你这个东西，」周冉说，「最重要的一步，没有一个人做。你写的备用钥匙那些代码，写得再好，没人用。」<\/p><p>「代码没问题。」<\/p><p>「我知道代码没问题。」周冉说，「问题是字。」<\/p><p>「字？」<\/p><p>「用户没看代码。他只看字。」周冉说，「文案就是产品。你的产品现在是三行他看不懂的字。」<\/p><p>沈月那天在家。她听了一下午。测试结束，她从卧室出来，问周冉：「你们说的文案，是不是就是屏幕上写的话？」<\/p><p>「对。」<\/p><p>「拿来我看看。」<\/p><p>林拓把原型里所有的文字导出来，一共六十几句。沈月坐在小桌子前，拿了一支红笔，像改作文。<\/p><p>「创建智能合约账户。」她念了一遍，「你写给谁看的？」<\/p><p>「用户。」<\/p><p>「用户知道什么叫智能合约账户？」<\/p><p>「不知道。」<\/p><p>「那你为什么写。」<\/p><p>「因为它就叫这个。」<\/p><p>「它叫什么是你的事。」沈月说，「用户要知道的是他在干什么。他在干什么？」<\/p><p>「开一个钱包。」<\/p><p>「那就写开一个钱包。」她划掉那一行。<\/p><p>「注册通行密钥。」<\/p><p>「他在干什么？」<\/p><p>「用指纹当钥匙。」<\/p><p>「那就写这个。」她写：用你的指纹当钥匙。<\/p><p>「创建备用钥匙。」<\/p><p>林拓想了一会儿。「再留一把。万一手机丢了。」<\/p><p>沈月写：再给自己留一把备用钥匙。下面加了一行小字：手机丢了也能进门。不用记任何东西。<\/p><p>她一句一句改。改到「签名」，她问：「用户按指纹的时候，他觉得自己在干什么？」<\/p><p>「确认。」<\/p><p>「那就写确认。」<\/p><p>改到「Gas 费」。「这是什么？」<\/p><p>「链上的手续费。」<\/p><p>「写手续费。」<\/p><p>改到「守护人」。「这是谁？」<\/p><p>「备用钥匙的那个人。」<\/p><p>「那就写信任的人。」<\/p><p>改到「恢复」。「他在干什么？」<\/p><p>「找回钱包。」<\/p><p>「写找回。」<\/p><p>改到「设备」。「写手机。」<\/p><p>改到「网络」。林拓说这个改不了，这是链的名字。沈月说：「那你在旁边加一句人话。」<\/p><p>改到「同步」。她想了想，写：跟着你的手机账号走。<\/p><p>改到「确认交易」。她划掉「交易」，写「转账」。<\/p><p>最后改到「注册」。「这个字太像办证。」她说，「写开始。」<\/p><p>两个小时。改了十一处。<\/p><p>沈月放下笔。「剩下的能看懂。」她说，「但你这个东西，我改完还是不想用。」<\/p><p>「为什么。」<\/p><p>「因为我不知道你会不会跑。」她说，「这个字改不了。」<\/p><p>周冉在旁边听着，说：「这句话值钱。」<\/p><p>她把大鹏那句「一个按钮」也翻出来。「第一屏，三行字，一个说明链接。全删。留一个按钮，写开一个钱包。想知道底下是什么的，点右上角那个小问号。」<\/p><p>「那些解释放哪儿？」<\/p><p>「放问号里。」周冉说，「要看的人自己会点。不想看的人，你塞给他他也不看。」<\/p><p>她最后说了一句：「记住这个顺序。测完先改字，改完字再测。字最便宜。代码最贵。别一上来就改代码。」<\/p><p>林拓把这句写在本子上。<\/p><p>十二月十五号，林拓把改过的文案放进原型，又请了两个人回来。阿珍和老周。<\/p><p>阿珍在第三屏停了十秒，点了「留一把」。她加了自己的平板。<\/p><p>老周在第三屏念了一遍那行小字。「手机丢了也能进门。」他说，「哦，是这个意思。」他加了他老婆的手机。<\/p><p>两个人都做完了。<\/p><p>十二月十九号晚上，阿凯来了一趟。他听说林拓明天要放真钱。<\/p><p>「有一个问题。」他一进门就说，「测试网跑了几遍？」<\/p><p>「三百多遍。」<\/p><p>「换锁跑了几遍？」<\/p><p>「一百多。」<\/p><p>「备用钥匙跑了几遍？」<\/p><p>「五十。」<\/p><p>「跑到一百。」阿凯说，「明天再放。」<\/p><p>林拓那天晚上跑到凌晨两点。一百零三遍。阿凯在群里回了一个字：「行。」<\/p><p>十二月二十号，周六，下午。<\/p><p>林拓决定放真钱进去。<\/p><p>不多。一百块。他从交易所转了一百块钱进信风的账户。这是链上的一百块，跟他钱包里的一百块一样，是钱。<\/p><p>转账到了。他看着屏幕上那个数字。一百。<\/p><p>然后他要转出去。转到咔哒的收款地址。<\/p><p>他点了转出。输了金额。点了确认。手机弹出指纹。<\/p><p>他把拇指放上去。手在抖。<\/p><p>他没想到会抖。这个流程他跑过几百次，都是测试币，假钱。一百块钱，不多，抖得停不下来。<\/p><p>指纹过了。屏幕上转了一圈。十二秒。到了。<\/p><p>他没动。看着那个「已完成」，看了很久。<\/p><p>沈月在他旁边站着。她本来是来叫他吃饭的。她从他点确认开始就没走。<\/p><p>「这就转出去了？」<\/p><p>「嗯。」<\/p><p>「你没输密码。」<\/p><p>「没有。」<\/p><p>「你没抄任何东西。」<\/p><p>「没有。」<\/p><p>「那你要是手机丢了。」<\/p><p>「你的手机能帮我换锁。」<\/p><p>沈月看着那个屏幕。过了一会儿，她说：「原来你在做的是这个。」<\/p><p>林拓没说话。他把手机放下，站起来，去了厨房。水开得很小。他把早上的碗洗了，一个一个擦干，放进柜子。<\/p><p>沈月在客厅说：「菜要凉了。」<\/p><p>「来了。」<\/p><p>吃完饭，他把沈月的手机拿过来，装了信风。在他自己的手机上点「再给自己留一把备用钥匙」，选「信任的人」，扫了她手机上的码。<\/p><p>她的手机响了一下。屏幕上一行字：林拓把你设为备用钥匙。你拿不走他的钱，只能在他丢手机的时候帮他换锁。<\/p><p>「这句也是我改的。」沈月说。<\/p><p>「嗯。」<\/p><p>「写得还行。」她把手机放回口袋，「我去洗澡。」<\/p><p>那天的日志他写了很久。写完，发出去。<\/p><p>他没想到那条日志会被转。第二天早上，等待名单从四百五十变成六百七十。周冉在小群里发了一句：「看见没。一百块比一万字管用。」<\/p><p>十二月二十七号，周六，这个月最后一个周六。夜航船在「不打烊」聚会。林拓去了。<\/p><p>茶馆里二十来个人。熊市，来的人比夏天少。老船长坐在老位置，普洱泡了第三道。<\/p><p>林拓坐过去。老船长看了他一眼，慢慢说：「日志我看了。一百块。」<\/p><p>「嗯。」<\/p><p>「手抖了？」<\/p><p>「抖了。」<\/p><p>「抖是对的。」老船长说，「钱包是装钱的东西。做钱包的人手不抖，我不敢用。」<\/p><p>他倒了一杯茶推过来。<\/p><p>「谁付钱。」<\/p><p>林拓想了一会儿。「怕丢钥匙的人，会用。付钱的，还没想好。」<\/p><p>「半年了。」<\/p><p>「嗯。」<\/p><p>老船长没催。他喝了一口茶，问：「审计问过价没有？」<\/p><p>「发了三封邮件。没回。」<\/p><p>「会回的。」老船长说，「回了你再来找我。」<\/p><p>「为什么？」<\/p><p>「因为你会被吓一跳。」他说，「我做 App 那年，问过一次。当时我一年挣一百万，看了那个数也吓一跳。」<\/p><p>「多少？」<\/p><p>老船长没说。他把茶杯放下，看着窗外的湖。「回了再说。」<\/p><p>十二月二十八号，周日。<\/p><p>他给三家审计公司发过邮件，问审一遍信风要多少钱。前两家没回。第三家回了。<\/p><p>邮件很客气。附件是一张报价单。<\/p><p>审计范围：智能账户合约及相关模块。周期：六周。费用：人民币四十万元整。<\/p><p>他把报价单打开，看了一遍。又看了一遍。四十万后面有一行小字：不含复审。复审另计。<\/p><p>他翻开记账的本子，翻到最后一页。存款那一栏：十八万零三百。<\/p><p>他把报价单和本子并排放在桌上。<\/p><p>四十万。十八万。<\/p><p>墙上那张纸，第一条旁边的圈，他昨天刚擦掉。<\/p><aside class=\"log\"><div class=\"log-label\">航海日志<\/div><p>12 月 20 日。5 个用户测试。3 个卡在同一步。改了 11 处文案。今天第一次用指纹转了 100 块。<\/p><p>钥匙在哪：跟着你的手机账号走，换手机能拿回来。再留一把备用的，第二台设备或者信任的人。两把丢一把，还能进门。<\/p><p>用户测试的规矩：5 个人，录屏，边做边说，我不许开口，看退出点。<\/p><p>沈月改的文案。她说，剩下那句改不了：你会不会跑。<\/p><p>这句我得用一年来答。<\/p><\/aside>", "words": 4809}, {"num": 20, "title": "审计", "vol": 2, "html": "<p>一月三号，周六，2026 年的第一个周末。<\/p><p>出租屋里，那张四十万的报价单还在桌上。林拓没收。六天了，它就压在螺丝刀底下。存款十八万。信风造了六个月。钥匙那件事答完了，剩下的事是让人相信它没有洞。<\/p><p>前一天晚上他算过一笔账。四十万，存款十八万，差二十二万。借。找谁借。他在本子上写了三个名字，又一个一个划掉。<\/p><p>他给父亲打了一个电话。没提钱。<\/p><p>「崽。」<\/p><p>「爸。店里怎么样？」<\/p><p>「不好。」父亲说，「今年都不好。」<\/p><p>「嗯。」<\/p><p>「你那边呢。」<\/p><p>「在做。」<\/p><p>「做就做。」父亲说，「别借钱。」<\/p><p>林拓没说话。父亲也没说话。过了几秒，父亲把电话给了母亲。母亲说了十分钟，问吃饭，问沈月，问过年回不回。他说回。<\/p><p>挂了电话，他把本子上那三个划掉的名字撕了。<\/p><p>周冉和阿凯下午来。周冉进门先看了一眼报价单，说：「哦。」阿凯看了两遍，把它翻过来，扣在桌上。<\/p><p>「有一个问题。」阿凯说，「他们审什么？」<\/p><p>「智能账户合约及相关模块。」<\/p><p>「你自己写了多少？」<\/p><p>林拓打开电脑，把代码调出来。龙骨是开源的那个智能账户合约，别人造好、很多人检查过的。他自己写的，是上面那一小块：加钥匙、换钥匙、备用钥匙、四十八小时的否决。加起来六百行。<\/p><p>「六百行。」阿凯说，「他们报四十万，是按整条船报的。龙骨那部分，别人已经审过三次，报告是公开的。你不用再花钱让人审一遍别人审过的东西。」<\/p><p>「那六百行呢？」<\/p><p>「六百行我来。」阿凯说，「两周。」<\/p><p>「你一个人。」<\/p><p>「我一个人。」阿凯说，「我不是审计公司。我没有章。但我在交易所看了三年别人怎么丢钱。六百行，我一行一行读。」<\/p><p>周冉问：「一个人看，看漏了呢？」<\/p><p>「会漏。」阿凯说，「所以还要两件事。」<\/p><p>他在纸上写了两行。<\/p><p>第一行：公开赏金。<\/p><p>「什么意思？」林拓问。<\/p><p>「你把代码放出去，告诉全世界：谁找到洞，我给钱。」阿凯说，「一般的洞，五千。能让人丢钱的，两万。」<\/p><p>「两万。」林拓说。<\/p><p>「两万是底线。」阿凯说，「低于这个数，真正会找的人不看你。他们一天的工钱就不止这个。」<\/p><p>「赏金池的钱从哪儿出？」周冉问。<\/p><p>「存款。」林拓说。<\/p><p>三个人都没说话。<\/p><p>「就是这样。」阿凯说，「你没有四十万。你有的是十八万和一个愿意公开的态度。审计买的是一句话，别人替你担保。你买不起，就自己担。担的方法是把过程全放在明面上。」<\/p><p>第二行：找人。<\/p><p>「我有两个朋友。」阿凯说，「一个在审计公司上班，一个自由的。他们不能出报告，但可以看。义务的。」<\/p><p>「义务看，能看多细？」<\/p><p>「看多细我不保证。」阿凯说，「但他们跟我不是一个脑子。我看不到的，他们可能看到。」<\/p><p>林拓把这三条抄在本子上。内审两周。赏金五千起，重大两万。两个白帽朋友。<\/p><p>「白帽是什么？」沈月从厨房问。她在煮饺子。<\/p><p>「找洞的人。」林拓说，「找到了告诉你，不拿走东西。跟贼的区别是他敲门。」<\/p><p>「那黑的呢？」<\/p><p>「不敲门。」<\/p><p>沈月把饺子端出来。「那你们赶紧找白的。」<\/p><p>一月五号，阿凯开始内审。<\/p><p>他白天上班，晚上和周末看。他把六百行代码打印出来，二十几页，钉在一起。每天晚上看两页，看完在旁边写字。林拓在群里问进度，他只回一个字：「看。」<\/p><p>一月八号，两个白帽朋友进了一个临时群。一个叫「老猫」，在审计公司上班。一个只有一个英文名，自由的。他们不说话，只是拿代码。<\/p><p>一月九号，老猫在临时群里说了一句话。<\/p><p>「赏金规则写了没？」<\/p><p>「在写。」<\/p><p>「两万少。」老猫说，「但比没有强。你写的时候，把一条放在最前面：修好之后，公开时间线，写上报告人的名字。」<\/p><p>「为什么放最前面？」<\/p><p>「因为真正会找的人，钱不是第一位。名是。」老猫说，「你两万块请不动人。但你把他的名字写在你的公开记录里，他会来。」<\/p><p>林拓记下了。<\/p><p>一月十号，周冉来定内测的事。<\/p><p>「等待名单多少了？」<\/p><p>「一千一百。」<\/p><p>「行。」她说，「内测分两层。」<\/p><p>她在纸上画了两个圈，一小一大。<\/p><p>「第一层，五十个咔哒老用户。他们认识你。出了问题，他们会来告诉你，不会跑去骂。」<\/p><p>「第二层，等待名单前两百。陌生人。他们不认识你，只认字。你那十一处文案管不管用，看他们。」<\/p><p>「为什么不一起放？」<\/p><p>「五十个人先跑一周。」周冉说，「五十个人发现的问题，两百个人不用再撞一遍。你想让两百个陌生人第一眼看到的是一个洞？」<\/p><p>「不想。」<\/p><p>「还有一条。」阿凯在群里插了一句，「内测有上限。每个钱包最多放一千块。」<\/p><p>「为什么？」<\/p><p>「因为我还没看完。」<\/p><p>一月十二号，第一层内测开始。<\/p><p>林拓在咔哒群里发了一条。五十个名额，二十分钟报满。大鹏第一个，阿珍第二个，老周第三个。<\/p><p>第一天晚上，群里三十多条反馈。「指纹弹出来慢了一秒」「备用钥匙那页字太小」「转账完了不知道去哪看记录」。林拓一条一条记，一条一条改。<\/p><p>大鹏发了一条：「转了一百块进去。用指纹转出来了。行。」<\/p><p>第二天，老周在群里问：「上限一千是什么意思？我想放五千。」<\/p><p>「内测期间只能放一千。」林拓回。<\/p><p>「我自己的钱，我愿意。」<\/p><p>「你愿意，我不愿意。」林拓说，「阿凯还没看完。看完再放。」<\/p><p>老周发了一个「行」。过了一会儿又发了一条：「你这人，做生意不像做生意的。」<\/p><p>大鹏接了一句：「他爸开五金店的。修东西不收钱那种。」<\/p><p>第三天，一个人报了一个真问题。换手机之后，钥匙跟过来了，但备用钥匙那一栏显示的是空的。实际上还在，只是没显示。<\/p><p>林拓凌晨两点修好。早上六点，阿凯在群里回了一句：「显示的问题。不是链上的。但这种问题最吓人。用户看不到备用钥匙，会以为丢了。」<\/p><p>「嗯。」<\/p><p>「有一个问题。」阿凯说，「你以后每次改显示，都要问一句：链上的东西跟屏幕上的东西，是不是同一个？」<\/p><p>林拓把这句话写在本子上。<\/p><p>一月十四号，去注册公司。<\/p><p>咔哒一直是个体户。当初为了收钱方便，林拓注册了一个个体工商户，名字是「上饶市林拓网络工作室」，注册地在老家。<\/p><p>「个体户不行。」阿凯在一周前就说了，「钱包这类应用，应用商店要公司主体。个人的，交上去第一轮就打回来。」<\/p><p>沈月问：「有限公司和个体户有什么区别？」<\/p><p>林拓想了想。「个体户出了事，欠的钱是我的。也是你的。」<\/p><p>「有限公司呢？」<\/p><p>「出了事，赔到公司的钱为止。赔完就完了。不牵连家里。」<\/p><p>「那还等什么。」沈月说。<\/p><p>「还有一个原因。」周冉说，「以后要给人股份。个体户给不了。」<\/p><p>「给谁？」<\/p><p>周冉没答。阿凯也没答。林拓说：「以后再说。」<\/p><p>他找了一个代办，六百块。公司名字想了两天。沈月说：「就叫信风。」<\/p><p>「信风科技有限公司。」<\/p><p>「太长。」<\/p><p>「没办法，得这么长。」<\/p><p>一月二十号，营业执照下来了。杭州信风科技有限公司。法定代表人：林拓。注册资本十万，没实缴。代办说，记账报税每个月两百，一年起签。<\/p><p>他把执照拍了一张照，发给沈月。沈月回了一个字：「好。」<\/p><p>隔了一会儿，又发了一条：「法定代表人，听着像个大人。」<\/p><p>第二天他去银行问对公账户。柜员说法人要预约，最早排到下个月初，到时候带执照原件和公章。他填了预约单，回家。<\/p><p>路上他想，公司就是这样开起来的。一张纸，一个章，再等一个账户。跟父亲当年拉开卷帘门一样，也不一样。<\/p><p>一月十九号，第二层内测开始。等待名单前两百。<\/p><p>林拓给两百个人发了邮件。没写功能，写了阿珍的故事，三百字。最后一句：「如果你也丢过钥匙，试试这个。上限一千块。」<\/p><p>两天内，一百四十个人装了。九十个人开了钱包。六十个人留了备用钥匙。<\/p><p>有一个陌生人回了邮件。他说：「我没丢过钥匙。但我妈丢过。她不会用助记词那种东西。我给她装了。」<\/p><p>林拓把这封邮件转给周冉。周冉回：「这种人，记下来。以后你要找用户，先找他。」<\/p><p>周冉把这三个数排成一列。「两百，一百四，九十，六十。」她说，「备用钥匙这一步，三分之二的人做了。十二月是零。」<\/p><p>「文案。」林拓说。<\/p><p>「文案。」周冉说，「沈月那支红笔，值四十万。」<\/p><p>沈月在旁边改作业，没抬头。「值就行。」<\/p><p>一月二十号，阿凯内审结束。<\/p><p>他把那二十几页纸带来，摊在桌上。上面全是铅笔字。<\/p><p>「三个问题。」<\/p><p>「说。」<\/p><p>「一个中的。备用钥匙发起换锁的时候，你没检查发起人是不是当前有效的备用钥匙。一个已经被作废的备用钥匙，理论上还能发起换锁。」<\/p><p>林拓脸白了一下。<\/p><p>「四十八小时否决还在，所以拿不走钱。但用户会被吓。」阿凯说，「修。」<\/p><p>「两个低的。」他接着说，「一个是显示，一个是日志里多打了一个不该打的东西。」<\/p><p>林拓当天改完。阿凯第二天复查，回了一个字：「过。」<\/p><p>「换锁那块，」阿凯说，「我看了三遍。没看出别的问题。」<\/p><p>「那就是没问题？」<\/p><p>「不是。」阿凯说，「是我没看出。这两句不一样。」<\/p><p>一月二十二号，两个白帽朋友回话。老猫报了一个低的，跟阿凯发现的那个日志问题一样。自由的那个说：「六百行，干净。龙骨你选得对。」<\/p><p>阿凯在群里说：「赏金可以开了。」<\/p><p>一月二十四号，林拓在信风的网站上发了赏金规则。他写了一个晚上，五百字。<\/p><p>范围：信风自己写的合约、四个后端服务、手机应用。<\/p><p>一般漏洞五千。能让用户丢钱的两万。<\/p><p>先私下告诉我们，修好之后再公开。<\/p><p>不许碰用户的钱。<\/p><p>我们四十八小时内回复，修好后公开时间线，写上你的名字。<\/p><p>沈月看了一遍。「两万块。」<\/p><p>「嗯。」<\/p><p>「两万块是我们一个多月。」<\/p><p>「嗯。」<\/p><p>「你觉得会有人来拿吗？」<\/p><p>「不知道。」林拓说，「但我希望有人来拿，而不是有人不敲门。」<\/p><p>沈月想了一下，说：「也对。」<\/p><p>一月二十五号，等待名单过了一千二百。<\/p><p>周冉那天晚上把发布计划拿来了。一张表，三个月。<\/p><p>一月：内测，修，赏金开。二月：应用商店审核。审核期间每周给等待名单发一封信，说进展，说数字，不说空话。三月：发布。猎品榜，海外社交平台，中文社区，等待名单邮件。发布日选在三月中旬，看审核什么时候过。<\/p><p>每一行后面写了谁做。林拓，周冉，阿凯。<\/p><p>「三个月。」林拓说，「审核要多久？」<\/p><p>「不知道。」周冉说，「所以三月中旬，不是三月几号。」<\/p><p>「过不了呢？」<\/p><p>「过不了就改。」周冉说，「但你先交。」<\/p><p>她又拿出一张纸，是给等待名单的第一封信。二百字。第一段说内测数字，两百人，六十个留了备用钥匙。第二段说赏金开了。第三段说提交审核的日子。最后一句：「审核多久我们不知道。每周四给你写一封，不管有没有进展。」<\/p><p>「不管有没有进展？」林拓问。<\/p><p>「对。」周冉说，「没进展也写。写没进展。人怕的不是慢，是没消息。」<\/p><p>一月二十七号，林拓去了一趟「不打烊」。老船长说过，报价回了再来。<\/p><p>老船长听他讲完这一个月。内审，赏金，白帽，分层，公司。他听得很慢，中间只问了一句：「赏金多少？」<\/p><p>「两万。」<\/p><p>「你存款多少？」<\/p><p>「十八万。」<\/p><p>老船长点头。「行。」<\/p><p>「你那年问的价，多少？」林拓问。<\/p><p>「三十万。」老船长说，「2015 年的三十万。我没付。我当时想，我的 App 又不装钱，审什么。」<\/p><p>「后来呢？」<\/p><p>「后来出事了。不是安全的事。」他说，「是别的事。」<\/p><p>他没往下讲。林拓也没问。<\/p><p>「公司主体，」老船长说，「你注册对了。个人的东西，平台一句话就没了。公司的，好歹有个章。」<\/p><p>他停了停。「但也只是好歹。」<\/p><p>一月三十号，周五，晚上九点。<\/p><p>三个人在出租屋。沈月也在，坐在沙发上看书，没看进去。<\/p><p>应用商店的提交页面开着。名字：信风钱包。分类：金融。主体：杭州信风科技有限公司。截图五张，说明三百字，隐私政策一份。<\/p><p>阿凯把说明又读了一遍。周冉把截图一张一张点开看。林拓坐在椅子上，手放在腿上。<\/p><p>「行了。」周冉说。<\/p><p>「有一个问题。」阿凯说。<\/p><p>三个人看他。<\/p><p>「没有。」阿凯说，「我就是习惯了。」<\/p><p>林拓点了提交。<\/p><p>状态变成：等待审核。<\/p><p>没人说话。沈月放下书，去厨房。水开了，她泡了四杯茶。<\/p><p>周冉和阿凯十点半走的。阿凯走到门口又回来，把桌上那份报价单拿起来看了一眼，放回去。「留着。」他说，「以后有钱了，做一次真的。」<\/p><p>门关上。沈月在收茶杯。<\/p><p>「今天回来了吗？」她问。<\/p><p>林拓想了想。「回来了。」<\/p><p>「那就好。」她说，「明天开始等。等的时候也要回来。」<\/p><p>那天的日志，林拓只写了三行。<\/p><p>三天后，二月二号，周一，早上七点。<\/p><p>他醒来看手机。一封邮件。<\/p><p>「您的应用未通过审核。」<\/p><aside class=\"log\"><div class=\"log-label\">航海日志<\/div><p>1 月 30 日。提交了。赏金池 5,000 起。等待名单 1,200。<\/p><p>四十万的审计没做。做的是：龙骨用别人审过三次的。自己那六百行，阿凯审了两周。两个白帽朋友义务看了一遍。赏金公开。<\/p><p>内测两层：50 个老用户先跑一周，再放等待名单前 200。每个钱包上限 1,000 块。<\/p><p>注册了公司。个体户变有限公司。出事赔到公司为止。<\/p><p>等审核。<\/p><\/aside>", "words": 4845}, {"num": 21, "title": "三次被拒", "vol": 2, "html": "<p>2026 年 2 月 2 日，星期一，早上七点二十。<\/p><p>林拓是被手机震醒的。他睡在客厅沙发上，电脑还开着，屏幕停在应用商店的开发者后台。昨晚他看到两点，状态一直是「审核中」。<\/p><p>邮件标题只有一行：您的应用未通过审核。<\/p><p>他坐起来，点开。理由写得客气，翻成人话就三个字：你是谁。他的开发者账号是前年注册的个人账号，交上去的却是一个钱包。钱包这类应用，应用商店要求必须是公司主体。还要一套证明：营业执照、法人身份证、对公账户、公司域名的邮箱。<\/p><p>公司是一月中旬刚注册的。执照下来了，对公账户还没开，邮箱用的还是他的个人邮箱。<\/p><p>沈月从卧室出来，头发乱着。「几点了。」<\/p><p>「七点半。」<\/p><p>「什么事。」<\/p><p>「被拒了。」<\/p><p>她站了两秒，转身去厨房烧水。「吃了饭再说。」<\/p><p>九点，周冉到了。她把羽绒服扔在沙发上，围巾没摘，直接凑到屏幕前看那封邮件。看完她说：「行。这个不算拒，这个叫补材料。」<\/p><p>「一样的。」<\/p><p>「不一样。人家没说你东西不行，说你手续不全。手续不全是最好解决的一种。」她掰手指，「执照有了。对公账户，今天去银行。邮箱，买个企业邮箱，半天。还差什么？」<\/p><p>林拓把邮件往下拉。最后一条：请提供与应用功能相匹配的经营范围证明。<\/p><p>周冉看着他。「你注册的时候，经营范围写的什么？」<\/p><p>「技术服务，技术开发，技术咨询。」<\/p><p>「有没有『软件开发』四个字？」<\/p><p>他没说话。<\/p><p>「去工商局。」周冉说，「变更经营范围。今天就去。」<\/p><p>上午先去了银行。开对公账户要法人本人到场，要执照原件，要公章。公章在阳台桌子的抽屉里，和那把旧螺丝刀放在一起。柜台的人问他公司做什么的，他说软件。柜台的人问什么软件，他想了一下，说工具。柜台的人没再问。开完账户出来，他在银行门口站了一会儿，把回执拍了照，发到三人群里。<\/p><p>阿凯是中午在群里冒出来的。他白天在公司上班，只有中午和晚上能看消息。他打了一行字：有一个问题。<\/p><p>林拓等着。<\/p><p>阿凯：经营范围加了「软件开发」，钱包这种东西，会不会还要别的资质？我不确定。先问清楚，别跑两趟。<\/p><p>周冉回：问了。这个类别应用商店只看主体，别的它管不了。但你这问题问得对，我记下了。<\/p><p>下午两点，工商局。<\/p><p>林拓拿了一个号，前面还有六十几个人。大厅里全是人，椅子坐满了，墙边站着一排。他站在角落，手里攥着一沓纸，纸角已经被捏软了。<\/p><p>沈月是三点到的。她下午没课，从学校过来，背着一个鼓鼓的帆布包。她找了个台阶坐下，从包里掏出一摞作文本，拧开红笔。<\/p><p>「你不用来。」林拓说。<\/p><p>「我知道。」她低头改，「你站着也是站着。」<\/p><p>他站了一会儿，也坐下来。他看她改作业。有个孩子写「我爸爸是一个修车的」，她在旁边批：修车是好本事，写写他的手。<\/p><p>「你怎么知道要写手。」<\/p><p>「手上有东西。」她说，「你不也是。」<\/p><p>队伍走得很慢。叫号的声音每隔几分钟响一次。他看了三次手机，后台还是那个状态。他把材料按顺序又理了一遍：执照、身份证、章程、变更申请表。理完又理了一遍。<\/p><p>四点四十，叫到他的号。柜台的人翻了翻材料，说变更要五个工作日，章程也要重新备案，回去打印一份新的，法人签字。<\/p><p>「今天不能办完？」<\/p><p>「今天收件。」<\/p><p>出来天已经暗了。沈月把作文本塞回包里。红笔漏了，帆布包上一道印子。她看了一眼，没擦。<\/p><p>「排了多久。」<\/p><p>「两小时零七分。」他说。<\/p><p>「记这么清楚。」<\/p><p>「习惯。」<\/p><p>回去的地铁上她靠着他睡着了。他没动。他在手机备忘录里记：2 月 2 日，工商局，2 小时 7 分。银行，40 分钟。企业邮箱，¥360。<\/p><p>2 月 6 日晚上，材料齐了。对公账户开了，企业邮箱开了，新执照拍成照片，经营范围那一行多了四个字。他把所有东西塞进后台，一项一项对，最后点了提交。<\/p><p>提交的那个按钮是蓝色的。他按下去之前停了两秒。<\/p><p>周冉在群里发了第一封「进展」。她发给等待名单的 1,200 个人，同一段话也贴在圈子上：<\/p><blockquote><p>信风还在审核。1 月 30 日提交，2 月 2 日被打回，原因是公司资料不全。今天补齐重新提交了。不知道要等多久。以后每周四这个时候，我会在这里说一次进展。不管有没有进展。<\/p><\/blockquote><p>林拓看着那句「不管有没有进展」。<\/p><p>「为什么。」<\/p><p>「因为等的人最怕的不是慢，是没人说话。」周冉说，「你想想你等快递的时候。」<\/p><p>「我不等快递。」<\/p><p>「那你想想你等审核的时候。」<\/p><p>他不说话了。<\/p><p>周冉的进展有固定的样子：做了什么，卡在哪，下一步。三句话，不多写。她说多写就是找借口。<\/p><p>2 月 10 日，第二封邮件。<\/p><p>这次理由长了一些。审核员写：无法理解该应用的核心功能。「无助记词的钱包」与钱包类应用的一般描述不一致，请提供清晰的功能说明。<\/p><p>林拓把那句话读了三遍。<\/p><p>他跟周冉说：「他没看懂。」<\/p><p>「那就让他看懂。」<\/p><p>「说明我写了一千字。」<\/p><p>「他不看一千字。」周冉说，「审核员一天看几十个应用，一个应用给他三分钟。你得在三分钟里让一个没用过钱包的人明白你在做什么。」<\/p><p>「三分钟。」<\/p><p>「录个视频。」<\/p><p>那天晚饭他吃得很快。沈月看他把碗放下，问：「生气了。」<\/p><p>「没。」<\/p><p>「你吃饭的时候筷子敲碗。」<\/p><p>他看了一眼碗沿。「他说我的东西跟一般的钱包不一样。」<\/p><p>「那不是好话吗。」<\/p><p>「在审核那里不是。」<\/p><p>她想了一下。「我班上有个孩子，作文写得跟别人都不一样。我第一反应也是，他是不是没审题。后来我让他念给我听，我才知道他写的是什么。」<\/p><p>「所以。」<\/p><p>「所以你得念给他听。」<\/p><p>那天晚上他架起手机，对着另一部手机的屏幕录。第一遍录了七分钟。第二遍五分钟。他删掉所有讲原理的部分，只留下操作：打开，按指纹，钱包出现；转一笔钱，按指纹，钱出去；换一台手机，登录云账号，钱包回来。<\/p><p>第五遍，两分五十秒。<\/p><p>沈月在门口看他录。「你说话太快。」<\/p><p>「三分钟。」<\/p><p>「你说慢一点，反而显得你没什么要藏的。」<\/p><p>第六遍，两分五十八秒。他说得慢了。<\/p><p>视频之外，还有审核备注。周冉让他把应用商店的审核条款打印出来，一条一条对。他们被引用的是哪一条，备注里就写：针对第几条第几款，我们的做法是什么，视频第几秒可以看到。<\/p><p>一共写了九条。写完是凌晨一点。<\/p><p>阿凯半夜看到，回了一句：有一个问题。第七条你写「钱包不保存用户任何密钥」，但通行密钥的公钥我们是存的。别让审核员抓这个字眼。改成「不保存任何可以动用资产的密钥」。<\/p><p>通行密钥这个东西，他们在文案里叫「用你的指纹当钥匙」。它有两半：一半锁在手机里，只认指纹；另一半是公开的，像门牌号，谁看到都没关系。阿凯说的就是那半个门牌号。<\/p><p>林拓改了。<\/p><p>2 月 12 日，周四，周冉发了第二封进展。这一次底下有人问：审核这么慢，能不能先放一个安卓的安装包出来，我们自己装。<\/p><p>周冉回得很快：不能。审核期间不发任何包。你们装了一个，我们就要维护两个，出了问题两边都说不清。等。<\/p><p>林拓看到这条，问她：「这么硬？」<\/p><p>「硬一点他们才信你有主意。」周冉说，「等的人不怕你硬，怕你摇。」<\/p><p>2 月 13 日，第二次提交。<\/p><p>那天夜里咔哒的余额雷达报了一次错，一个日本用户的地址查不出来。他顺手修了，二十分钟。修完他坐在阳台上，看着两个后台并排放着：一个是店，每天开门；一个是船，还在等港口放行。店不能因为船就关门。他把这句话记进备忘录。<\/p><p>2 月 15 日，他们回上饶过年。<\/p><p>父亲的店春节不关，只是开得晚。林拓帮着搬了两天货，把一箱一箱的水管接头码到货架上。父亲没问他的事，他也没说。母亲问了，他说在等一个审核，母亲说审核是什么，他说就是等人点头。母亲说那你就等，点头的人又不认识你，急也没用。沈月在旁边剥橘子，听见了，把一瓣塞进他嘴里。<\/p><p>年初二晚上，父亲坐在柜台后面记账，忽然说：「你那个东西，过了没。」<\/p><p>「没。」<\/p><p>父亲把账本合上。「店门也不是天天开的。」<\/p><p>他没懂。他后来才懂。<\/p><p>2 月 20 日，回杭州那天晚上，第三封邮件。<\/p><p>这次的理由最短：应用内文案存在投资引导倾向，请修改。附了一张截图，是「换币」页面的一角，上面写着「换成稳定币，享受更稳定的收益」。<\/p><p>林拓盯着「收益」两个字。<\/p><p>那句话是他去年十一月写的。当时觉得没什么。<\/p><p>「我想申诉。」林拓说，「这句话不是投资引导。」<\/p><p>周冉这次没到现场，视频接进来。「申诉一次，等三天。改一次，一小时。你选。」<\/p><p>他没选。她替他选了：「全删。」<\/p><p>「哪些。」<\/p><p>「所有。收益、赚、回报、增值、年化、理财。一个都不留。你不是理财产品，你是一把钥匙。钥匙不承诺赚钱。」<\/p><p>林拓在代码里搜。中文搜出来十四处，英文九处，日文三处。他一处一处改。「享受更稳定的收益」改成「换成稳定币」。「让资产增值」改成「把币换成你需要的币」。改完，页面短了一截，也干净了一截。<\/p><p>他把改前改后的两个截图并排放着看了一会儿。改后的那个更像五金店的货架。东西就是东西，不说话。<\/p><p>阿凯晚上看了一遍：有一个问题。「收益」删了，但「换币」本身有汇率。审核员如果问汇率从哪来，你们要能答。<\/p><p>「答：从公开的链上兑换池来，我们不定价。」<\/p><p>「那就把这句话写进页面。」<\/p><p>2 月 21 日是周六，不是夜航船聚会的日子。老船长单独约他喝茶。<\/p><p>「不打烊」下午人少。老船长已经坐在里面，普洱泡好了。<\/p><p>「三次了。」老船长说。<\/p><p>「嗯。」<\/p><p>「每次原因一样吗。」<\/p><p>「不一样。」<\/p><p>「那就好。」老船长把茶推过来，「原因一样才可怕。」<\/p><p>林拓喝了一口。茶很烫。<\/p><p>老船长看着窗外的湖，慢慢说：「2018 年，我有一个 App。你听过。一天进四千块，一年一百多万。」<\/p><p>「嗯。」<\/p><p>「4 月的一天早上，我醒来，App 没了。不是被拒，是下架。理由一行字。我申诉，回复一段话。我又申诉，还是那段话。」<\/p><p>他停下来，倒茶。<\/p><p>「那一个月我什么都没干。就是申诉。写材料，等，被拒，再写。我以为是材料的问题。」<\/p><p>林拓等着。<\/p><p>老船长端起杯子，看了一会儿，又放下。「后来的事，以后再说。今天不说这个。」<\/p><p>「为什么。」<\/p><p>「你还在等审核。」他说，「等审核的人，不该听那个故事的后半段。」<\/p><p>林拓没再问。他把茶喝完，老船长又给他倒满。<\/p><p>「你第三次改的是什么。」<\/p><p>「文案。删了『收益』。」<\/p><p>老船长点头。「这一次离过近了。前两次是问你是谁，这一次是问你说了什么。他开始看你的东西了。」<\/p><p>「等待名单的人，跑了没有。」<\/p><p>「没有。还多了十几个。」<\/p><p>「那是周冉的功劳。」老船长说，「船还没下水，人先上来了。这种时候，每周说一次话，比什么都值钱。」<\/p><p>走的时候老船长送他到门口。「过了告诉我。没过也告诉我。」<\/p><p>2 月 23 日，第三次提交。<\/p><p>2 月 26 日，周四。周冉发了第四封进展：<\/p><blockquote><p>第三次提交了。前两次的原因是资料和说明，这次是文案。三次原因都不一样，说明每次都往前走了一步。等待名单现在 1,214 人。下周四见。<\/p><\/blockquote><p>底下有人回：加油。有人回：等了一个月了。有人回：不急，你们每周都说，我就放心。<\/p><p>林拓把最后那条截了图。<\/p><p>那几天他睡不好。他把后台刷新了无数次。沈月把他的电脑合上过两次，第二次她说：「刷新不会让它快一点。」他说知道。她说：「那你刷什么。」他答不上来。<\/p><p>2 月 27 日，凌晨。<\/p><p>他没睡着，躺在沙发上。窗外有一辆车开过去，灯扫过天花板。手机亮了一下。<\/p><p>三点零四分。<\/p><p>他看着标题：您的应用已通过审核。<\/p><p>他没动。过了一会儿，他起来，打开电脑，看后台。状态变成了绿色。他把这个页面截了图，存进「自己的东西」文件夹。文件夹里的东西已经很多了：番茄账本的差评，咔哒第一笔 137 块的截图，阿珍的那封邮件。现在多了一张绿色的状态页。<\/p><p>然后他去洗碗。水槽里有三个碗，两个杯子。他洗得很慢，每个碗冲了两遍。<\/p><p>沈月站在卧室门口。「过了？」<\/p><p>「嗯。」<\/p><p>她看他洗碗，没说话，回去睡了。<\/p><p>四点，他给周冉和阿凯发了消息，只有两个字：过了。<\/p><p>阿凯四点零三分回：有一个问题。发布之前，赏金池的公告要先挂出去。<\/p><p>周冉是五点半回的。她没有说恭喜。她发来一张表格。<\/p><p>表格的标题是：3 月 12 日。<\/p><p>第一行：00:10，提交猎品榜。<\/p><p>一共四十一行。每一行都有时间，精确到分钟。<\/p><aside class=\"log\"><div class=\"log-label\">航海日志<\/div><p>2 月 27 日，凌晨 3 点。过了。<\/p><p>三次被拒，每次原因都不一样：主体、说明、文案。<\/p><p>主体：换公司账号。营业执照、对公账户、企业邮箱、经营范围里加「软件开发」。工商局排了 2 小时 7 分。<\/p><p>说明：三分钟视频，只演示不解释。审核备注逐条引用条款，写清视频第几秒能看到。<\/p><p>文案：删掉所有「收益」类的词。钥匙不承诺赚钱。<\/p><p>等待的四个星期，周冉每周四发一次进展，不管有没有进展。<\/p><p>明天开始准备 3 月 12 日。<\/p><\/aside>", "words": 4808}, {"num": 22, "title": "发布日", "vol": 2, "html": "<p>2026 年 3 月 12 日，星期四。杭州滨江，出租屋。<\/p><p class=\"stamp\"><strong>00:10<\/strong><\/p><p>阳台上的小桌子今天挤了两台电脑。林拓坐在桌前，周冉坐在他左边一把从厨房搬来的凳子上，围巾还挂在脖子上。阿凯在自己家，视频开着，没开摄像头，只有一个黑框和他的呼吸声。<\/p><p>猎品榜是海外一个网站。每天有一批新产品排队上台，大家投票，像早市上比谁的摊位前人多。排得靠前，一天能来几千个看热闹的人，里面有些会留下。<\/p><p>周冉手里拿着那张四十一行的表，用笔尖点着第一行。「标题。」<\/p><p>「信风。没有助记词的钱包。」<\/p><p>「一句话。」<\/p><p>「你的指纹就是钥匙。」<\/p><p>「五张图。」<\/p><p>「传了。」<\/p><p>「六十秒视频。」<\/p><p>「传了。」<\/p><p>「首评论我三十分钟后发。」她说，「点。」<\/p><p>林拓点了提交。页面跳了一下，出现一个「排队中」。<\/p><p>三个人都没说话。阿凯那边传来一声杯子放下的响。<\/p><p class=\"stamp\"><strong>00:30<\/strong><\/p><p>首评论是产品作者自己在下面留的第一条话。周冉早就写好了一版英文，林拓昨天晚上重写了一遍。<\/p><p>他写的是阿珍。去年六月，一个大学生把一张纸弄丢了，纸上写着十二个词，八万块钱没了。那八万是她两年实习攒的，还有一部分奖学金。她没有做错任何事，她只是丢了一张纸。<\/p><p>最后一句：我们做了一个不需要那张纸的钱包。<\/p><p>没有功能列表。没有「多链」，没有「开源」，没有「可自托管」。<\/p><p>「不讲功能？」阿凯在黑框那边问。<\/p><p>「讲功能的有一千个。」周冉说，「讲阿珍的只有他。」<\/p><p>林拓把评论贴上去。<\/p><p class=\"stamp\"><strong>01:00<\/strong><\/p><p>海外社交平台的线程。八条。第一条还是阿珍，最后一条是链接。中间六条，每条一张图，一句话。<\/p><p>他发完，把手机扣在桌上。<\/p><p>周冉说：「现在没事干了。睡觉。」<\/p><p>「睡不着。」<\/p><p>「那就躺着。」她把羽绒服拉链拉到顶，倒在沙发上，「四点我看一眼。」<\/p><p class=\"stamp\"><strong>02:20<\/strong><\/p><p>他没躺。猎品榜上有二十三票，排名十四。他刷新，二十四票。再刷新，还是二十四票。<\/p><p>他把桌上那把旧螺丝刀拿起来，又放下。<\/p><p class=\"stamp\"><strong>03:10<\/strong><\/p><p>沈月起来上厕所，看见阳台的灯还亮着。她走过来，站在他身后。<\/p><p>「多少票。」<\/p><p>「三十一。」<\/p><p>「多不多。」<\/p><p>「不知道。」<\/p><p>她把手放在他肩上，放了一会儿。「明天我有课。你别叫我。」<\/p><p>「嗯。」<\/p><p>「你也别一直坐着。」<\/p><p class=\"stamp\"><strong>04:30<\/strong><\/p><p>周冉的手机响了一声。她坐起来，看了一眼，又躺下去。「五十一票，第九。睡。」<\/p><p>他去卧室躺了两个小时。沈月翻了个身，手搭在他胳膊上，没醒。<\/p><p class=\"stamp\"><strong>07:00<\/strong><\/p><p>中文社区。圈子上他发了三行：今天上线。没有助记词的钱包。链接在这里。<\/p><p>夜航船群里他也发了。群里规矩是每天说一句话，今天他说的是：下水了。<\/p><p>老船长第一个回。两个字，没有标点：谁付钱<\/p><p>林拓看了几秒，回：今天不知道。<\/p><p>老船长：行。先下水。<\/p><p>小杜跟在后面：哥我装了。<\/p><p>圈子上那条帖子底下，二十分钟有四十几条回复。有人问安卓有没有，有人问开源在哪，有人只回了一个船的表情。他一条一条回。回到第三十条的时候，沈月把一碗粥放在他手边，什么也没说，走了。<\/p><p class=\"stamp\"><strong>08:00<\/strong><\/p><p>等待名单的邮件。1,214 个人。周冉写了三段，一共不到一百个字：今天上线了。你等了六个星期。这是链接，谢谢你等。<\/p><p>她把鼠标停在发送键上，看了林拓一眼。<\/p><p>「发。」<\/p><p>她发了。<\/p><p>八点零六分，打开率 11%。八点二十，23%。她盯着那个数字，像盯着一锅快开的水。<\/p><p class=\"stamp\"><strong>09:00<\/strong><\/p><p>后台的注册数开始动。<\/p><p>七十二。九十。一百三十。<\/p><p>沈月出门上班前站在阳台门口，头发扎好了，包背着。「多少了。」<\/p><p>「二百一十。」<\/p><p>「晚上别点太辣。」她说，「周冉胃不好。」<\/p><p>周冉在沙发上抬了下头。「谢了。」<\/p><p>九点四十，用户群里第一条问题：某个牌子的手机，指纹弹窗弹不出来。林拓看了一眼型号，去年测试没有这一款。<\/p><p>他回：收到，今天看。<\/p><p>他打开代码想现在就改。周冉从沙发上说：「今天不改代码。」<\/p><p>「一个弹窗。」<\/p><p>「一个弹窗改坏了，是一千个人打不开。」她说，「今天你只做三件事：回话，记数，别死。」<\/p><p class=\"stamp\"><strong>10:00<\/strong><\/p><p>大鹏在群里冒出来。他是咔哒的第一个用户，从 2024 年那三百个地址开始。他发了一张截图，钱包创建成功的页面，配了两个字：装了。<\/p><p>后面跟着一行：备用钥匙我给我媳妇了。<\/p><p>林拓看着这一行，看了很久。<\/p><p>排名第八。<\/p><p class=\"stamp\"><strong>10:30<\/strong><\/p><p>猎品榜上来了第一条陌生人的评论。英文，问得很直接：这跟某某钱包的「社交恢复」有什么不同？<\/p><p>林拓打了一段，讲对方的方案哪里不好。打完没发，给周冉看。<\/p><p>「删掉。」周冉说。<\/p><p>「为什么。」<\/p><p>「你在别人的摊位前说别人的菜不新鲜，买菜的人只会觉得你这个人不行。」她说，「说你自己的。他们的方案要三个人帮你签名。我们的方案，你一个人，一部手机，一个指纹。就这么说。」<\/p><p>他重写了。三句话。发了。<\/p><p>十分钟后那个人回：Got it. Trying.<\/p><p class=\"stamp\"><strong>11:00<\/strong><\/p><p>排名第五。<\/p><p>周冉没有看排名。她把后台的几个数字抄到一张纸上，从上往下写：<\/p><p>邮件发出 1,214。打开 712。点链接 486。下载 391。创建钱包 312。留了备用钥匙 188。<\/p><p>她用笔在最后两行之间画了一道。「这里掉了四成。」<\/p><p>「知道。」<\/p><p>「知道就好。」她说，「今天不改。今天什么都不改，只记。明天再说。」<\/p><p>阿凯在群里冒了一句：有一个问题。索引服务的 CPU 到六成了。下午人会不会更多？<\/p><p>索引服务是四个后端里的一个。它的活是盯着链上每个钱包的动静，记下来，像店里那本每天记的账本。新用户一进来就要查余额，全压在它身上。<\/p><p>「会。」周冉说。<\/p><p>阿凯：那我下午过来。<\/p><p class=\"stamp\"><strong>12:30<\/strong><\/p><p>外卖到了。两份盖浇饭，一份番茄鸡蛋，一份土豆牛肉。周冉站着吃，边吃边看手机。林拓坐着吃，吃了一半放下了。<\/p><p>「吃完。」周冉说。<\/p><p>「不饿。」<\/p><p>「不是饿不饿的事。今天还有十一个小时。」<\/p><p>他吃完了。<\/p><p class=\"stamp\"><strong>14:00<\/strong><\/p><p>一个海外博主转了那条线程。二十多万粉丝，做加密行业的内容。他转的时候只引了一句话：她没有做错任何事，她只是丢了一张纸。<\/p><p>后台的曲线弯了一下。<\/p><p>九百。<\/p><p class=\"stamp\"><strong>14:40<\/strong><\/p><p>圈子上有一条评论：又一个钱包。这行业一年出一百个。<\/p><p>林拓盯着那条，手指在屏幕上停着。<\/p><p>「别回。」周冉头都没抬。<\/p><p>「他没用过。」<\/p><p>「他没用过，你回了他也不会用。」她说，「你回的每一个字，都是别人看的，不是他看的。今天你只回问问题的人。」<\/p><p>他把手机放下。过了一会儿，那条评论下面有人替他回了：我用了，指纹开的，没让我抄词。<\/p><p>是大鹏。<\/p><p class=\"stamp\"><strong>15:40<\/strong><\/p><p>手机响了。不是消息，是报警。短信只有一行：索引服务 CPU 92%。<\/p><p>林拓打开监控。四个后端服务里有三个是绿的，一个是红的。他看着那条红线，手心开始出汗。<\/p><p>「阿凯呢。」<\/p><p>「路上。」周冉说，「你先别动。」<\/p><p>「有人查不到余额。」<\/p><p>「查不到余额不丢钱。」她说，「你手抖着改配置，才丢钱。」<\/p><p>他把手从键盘上拿开。<\/p><p class=\"stamp\"><strong>16:00<\/strong><\/p><p>阿凯到了。他请了半天假，从公司直接过来，肩上背着电脑包，额头有汗。他没打招呼，坐下就开始看监控。<\/p><p>扩容，人话就是加桌子。店里人太多，一张桌子坐不下，就再开一张一模一样的，把人分到两边去。阿凯在云后台点了几下，又开了一台索引服务，然后改了一行配置，让新来的请求往两边走。<\/p><p>二十分钟。红线掉下来，变黄，变绿。<\/p><p>阿凯靠在椅背上，说：「有一个问题。这台机器一个月多六百。」<\/p><p>「先开着。」林拓说，「下周看。」<\/p><p>「记账。」<\/p><p>「记了。」<\/p><p class=\"stamp\"><strong>17:00<\/strong><\/p><p>他一个人坐在阳台上。周冉在客厅回评论，阿凯在沙发上看日志。<\/p><p>用户一千三百。<\/p><p>他手里握着那把螺丝刀。父亲送的，柄上的漆掉了一块。他没想什么，就是握着。<\/p><p class=\"stamp\"><strong>18:00<\/strong><\/p><p>周冉从客厅喊：「第三。」<\/p><p>他进去看。猎品榜上，信风排在第三。前面两个，一个是 AI 写作工具，一个是设计工具。<\/p><p>「第三。」他说。<\/p><p>「够了。」周冉说，「第一没用，第三够用。今天看到你的人，明天还得回来才算数。」<\/p><p>她截了图，没发出去。「留着，写复盘用。」<\/p><p>林拓把排名截图发给沈月。她回得很快：吃饭。<\/p><p>他回：吃了。<\/p><p>她回：你只吃了一半。周冉说的。<\/p><p>周冉又抄了一行数字。用户从哪来：猎品榜四成，等待名单邮件三成，圈子和夜航船一成半，剩下的说不清。<\/p><p>「邮件那三成，」她说，「是六个星期每周四换来的。记住这个。」<\/p><p class=\"stamp\"><strong>19:10<\/strong><\/p><p>沈月回来了。她拎着一袋水果，在门口站住，看着屋里三个人。一个在阳台，一个在沙发，一个坐在地板上，围巾还没摘。<\/p><p>「你们吃了吗。」<\/p><p>「中午吃了。」周冉说。<\/p><p>「那就是没吃。」她把水果放下，去厨房洗了三个苹果，一人手里塞一个。<\/p><p class=\"stamp\"><strong>20:00<\/strong><\/p><p>夜航船群里，老船长发了一个红包。二十个，备注四个字：信风下水。<\/p><p>群里两百个人，几秒钟抢完了。林拓抢到 0.88 元。小杜抢到 5.2 元，在群里说：哥，我请你喝奶茶。<\/p><p>老船长私信他：今天不用回我。明天日志照发。<\/p><p>他回了一个：好。<\/p><p>母亲的消息也在这个时候进来：你爸问你今天弄的那个东西上了没。<\/p><p>他回：上了。<\/p><p>母亲：你爸说知道了。<\/p><p>他把这三个字看了两遍。父亲说话就这样，「知道了」已经是很长的一句。<\/p><p class=\"stamp\"><strong>21:30<\/strong><\/p><p>用户一千六百五十。<\/p><p>周冉合上笔记本，拿出那张四十一行的表，在最后一行下面又写了三行。<\/p><p>「明天。」她说，「一，猎品榜上的每一条评论都回，不管说什么。二，用户群里的问题今天几点问的，明天几点之前答。三，指纹弹窗那个 bug。」<\/p><p>「今晚就能修。」<\/p><p>「明天修。」她说，「今晚你改的东西我不信。」<\/p><p>阿凯在旁边点头。他也有一张纸，上面只有两行：明天把今天所有报错的日志拉出来看一遍；下周把加的那台机器缩回去试试。<\/p><p class=\"stamp\"><strong>22:40<\/strong><\/p><p>后台跳出来一笔换币。有人把两百块的稳定币换成了别的币。信风从里面分 0.3%，六毛钱。<\/p><p>林拓把这六毛钱记进账本。那一行写着：2026.03.12，信风，换币分成，¥0.6。<\/p><p>周冉凑过来看了一眼。「六毛。」<\/p><p>「六毛。」<\/p><p>「先记着。」她说，「第一问还没答。今天不答。」<\/p><p>他把账本合上。这本账从 2024 年 3 月记到现在，第一页是存款 11 万，最新一页是六毛。<\/p><p class=\"stamp\"><strong>23:00<\/strong><\/p><p>第二次外卖。三份炒面，一份不辣的。三个人围着茶几坐，外卖盒摆成一排，桌上还有那把螺丝刀，不知道谁拿进来的。<\/p><p>沈月站在门口拍了一张照片。三个人都在低头，一个看手机，一个看电脑，一个在夹面。没人看镜头。照片里灯光发黄，茶几上还有中午的两个空盒子没扔。<\/p><p>她把照片发给林拓，配了两个字：留着。<\/p><p class=\"stamp\"><strong>23:50<\/strong><\/p><p>周冉把电脑装进包里，围巾绕了两圈。<\/p><p>「今天 1,800。」她说。<\/p><p>「嗯。」<\/p><p>「别高兴。」<\/p><p>「没高兴。」<\/p><p>「你去洗碗了。」她说，「我看见了。」<\/p><p>他没说话。<\/p><p>「三十天后再看。」她在门口穿鞋，「发布是发布，增长是增长。今天来的人是听说的，三十天后还在的人才是用的。」<\/p><p>「看什么。」<\/p><p>「看还有多少人在。」<\/p><p>门关上了。阿凯走得早一点，说明天还要上班。屋里剩下他和沈月，还有一茶几的外卖盒。<\/p><p>他去洗碗。碗不多，他洗得很慢。<\/p><p><strong>一周后<\/strong><\/p><p>六千。<\/p><p>指纹弹窗的 bug 修了，第二天上午修的，不是当晚。猎品榜的评论回了一百三十七条，每一条都回，包括那条「又一个钱包」，回的是：谢谢，欢迎试试。用户群里多了两个志愿者，一个帮着答日文问题，一个韩文。<\/p><p>周冉每天把漏斗抄一遍，纸贴在冰箱上。第七天，「留备用钥匙」那一步从掉四成变成掉两成半。他们只改了一处：把「创建备用钥匙」那个按钮，改成了「再给自己留一把」。<\/p><p>存款 15 万。服务器多了六百。换币分成一共 ¥41。<\/p><p>周冉在冰箱那张纸的最下面写了一个日期：4 月 11 日。她说那天再看留下多少人，今天不算数。<\/p><p>林拓每天早上开门第一件事是看那张纸。第二件事是发日志。<\/p><p><strong>4 月 1 日，23:12<\/strong><\/p><p>三十天差一点。<\/p><p>他坐在阳台上看后台，用户八千一百。留下来的，按周冉的算法，六成。他准备把这个数字写进明天的日志。<\/p><p>邮箱响了一声。<\/p><p>英文邮件。标题只有四个词：I found a vulnerability.<\/p><p>发件人：0xRain。<\/p><aside class=\"log\"><div class=\"log-label\">航海日志<\/div><p>3 月 12 日。上线。猎品榜第 3。1,800 用户。<\/p><p>发布日清单：00:10 提交，00:30 首评论，01:00 线程，07:00 中文社区，08:00 等待名单邮件。<\/p><p>首评论讲了阿珍，没讲功能。<\/p><p>15:40 索引服务报警，16:00 阿凯加了一台机器，每月多 600。<\/p><p>漏斗：邮件 1,214，创建钱包 312，留备用钥匙 188。最后一步掉四成，明天看。<\/p><p>第一笔换币分成，六毛。<\/p><p>周冉说：30 天后再谈。<\/p><\/aside>", "words": 4812}, {"num": 23, "title": "0xRain", "vol": 2, "html": "<p>2026 年 4 月 1 日，晚上 11 点 12 分。滨江，出租屋的阳台。<\/p><p>林拓把那封邮件读了两遍。<\/p><p>邮件是英文的，很短，没有客套。翻过来是这样：<\/p><blockquote><p>我在信风的恢复模块里发现一个漏洞。用户更换备用钥匙时，旧钥匙作废和新钥匙生效之间有一个空档。在这个空档里再发一次「注册备用钥匙」，合约不会检查这是不是同一次更换，会多登记一把。<\/p><p>严重程度：高。我只在测试网上试过，没有碰任何真实钱包。<\/p><p>附：复现步骤，测试脚本。<\/p><p>我按你们赏金页面的规则来，90 天内不公开。请在 72 小时内回复。<\/p><p>0xRain<\/p><\/blockquote><p>下面是一段代码，还有一个文件。<\/p><p>他把手机拿起来，又放下，又拿起来。拨了阿凯的电话。<\/p><p>响了四声。阿凯的声音是刚醒的。「嗯。」<\/p><p>「有人报漏洞。恢复模块。」<\/p><p>那边安静了两秒。「有一个问题。今天是四月一号。」<\/p><p>「他附了脚本。」<\/p><p>「那我看。发我。」<\/p><p class=\"stamp\"><strong>23:40<\/strong><\/p><p>周冉的视频接进来。她刚洗完头，头发湿着，第一句话：「有没有人丢钱。」<\/p><p>「不知道。」<\/p><p>「先查这个。」<\/p><p>「先复现。」阿凯在另一个框里说，「复现了才知道往哪查。」<\/p><p>林拓把邮件里那段话又念了一遍。念完他自己翻成人话：门锁允许在换锁的一瞬间多配一把钥匙。<\/p><p>「就是这个意思。」阿凯说，「换锁的时候，旧的拆下来了，新的还没装上，门是虚掩的。这时候有人拿一把毛坯钥匙过来，锁以为还是你在换，就给他配了一把。」<\/p><p>「他能进门？」周冉问。<\/p><p>「他能有一把钥匙。信风是两把钥匙丢一把还能进的门。他多了一把，就等于他跟用户一样有资格开门。」<\/p><p>周冉没说话了。<\/p><p><strong>4 月 2 日，01:10<\/strong><\/p><p>阿凯的框里传来一句：「复现了。」<\/p><p>他把屏幕共享出来。测试网上一个假钱包，本来两把钥匙。他跑了一遍脚本，第三把出现了。地址是他随手编的。<\/p><p>「多久。」林拓问。<\/p><p>「从你发我，一小时四十分。从你收到邮件，两小时。」<\/p><p>林拓看着那第三把钥匙。它就在那儿，安安静静地排在后面。<\/p><p class=\"stamp\"><strong>01:30<\/strong><\/p><p>回信。林拓写的，阿凯看了一遍，周冉看了一遍。<\/p><blockquote><p>已确认。24 小时内修复，上线后通知你。按赏金页面，重大漏洞 ¥20,000。修复前请你继续保密。谢谢。<\/p><\/blockquote><p>发出去七分钟，回信来了：<\/p><blockquote><p>收到。修复补丁发我，我看一遍。<\/p><\/blockquote><p>一句话。<\/p><p class=\"stamp\"><strong>01:40<\/strong><\/p><p>阿凯开始写另一个脚本，扫链上所有信风的钱包。八千一百个。他要看的东西只有一个：有没有哪个钱包的钥匙数量对不上。<\/p><p>「多久。」<\/p><p>「一个小时。链上查东西慢。」<\/p><p>周冉说：「那我们现在决定一件事。用户什么时候知道。」<\/p><p>三个人都不说话。<\/p><p>「现在说，」阿凯先开口，「等于告诉所有人这扇门虚掩着，修好之前谁都能试。」<\/p><p>「不说，用户不知道自己的门有问题。」周冉说。<\/p><p>「修好再说。」林拓说，「但要快。二十四小时。」<\/p><p>「二十四小时里门还是虚掩的。」<\/p><p>阿凯想了一下。「有一个办法。把换锁停了。」<\/p><p>「停什么。」<\/p><p>「暂停『更换备用钥匙』这个功能。不换锁，就没有那一瞬间。已经有的钥匙照常用，只是这两天不能换新的。」<\/p><p>「正在换的人呢。」<\/p><p>阿凯查了一下。「十二个。」<\/p><p>「一个一个通知。」周冉说，「我来写。」<\/p><p>她写的时候，林拓忽然问：「这个人是谁。」<\/p><p>「不知道。」阿凯说，「名字是一串字母加一个雨。邮箱是匿名邮箱。」<\/p><p>「他为什么不直接偷。」<\/p><p>「因为他不是那种人。」阿凯说，「我在交易所那几年，见过两种人拿到漏洞。一种发邮件，一种发交易。发邮件的，你要对他好一点。」<\/p><p>「怎么对他好。」<\/p><p>「快。给钱。说到做到。」<\/p><p class=\"stamp\"><strong>03:05<\/strong><\/p><p>扫完了。阿凯发来一个数字：0。<\/p><p>八千一百个钱包，没有一个多出钥匙。<\/p><p>林拓坐在阳台上，把窗开了一条缝。四月的夜里还有点凉。他吸了一口气，吐出来。<\/p><p>周冉在视频里说：「现在能睡一会儿了。」<\/p><p>「你睡。」<\/p><p>「我睡。」她说，「六点起。你也睡。」<\/p><p>他没睡。他把 0xRain 的脚本一行一行读了。那人写得很干净，注释只有三处，每一处都是必须的。<\/p><p class=\"stamp\"><strong>04:10<\/strong><\/p><p>「更换备用钥匙」的入口关了。App 里那个按钮变成灰色，点开是一句话：这个功能正在维护，预计两天内恢复。<\/p><p>阿凯给他领导发了一条消息：明天请假一天，家里有事。<\/p><p>发完他说：「不算撒谎。」<\/p><p>周冉给那十二个正在换钥匙的人一个一个发了私信。九个人当时就回了，八个说好，一个问为什么。她回：门在修，两天。那个人回：行。<\/p><p class=\"stamp\"><strong>07:30<\/strong><\/p><p>沈月起床，看见他还坐在阳台上，眼睛红的。<\/p><p>「什么事。」<\/p><p>「有漏洞。」<\/p><p>「有人丢钱吗。」<\/p><p>「没有。」<\/p><p>「那先吃饭。」她去煮了两个鸡蛋，放在桌上。「你今天要干什么。」<\/p><p>「修。」<\/p><p>「几点能修好。」<\/p><p>「今天晚上。」<\/p><p>「那晚饭我做。」她说，「你别点外卖了。」<\/p><p class=\"stamp\"><strong>09:00<\/strong><\/p><p>修的是他们自己写的那一小块。信风的核心合约是开源的龙骨，被很多人审过，他们没碰。恢复模块是自己写的，去年十二月。<\/p><p>阿凯在白板上画。白板是一块贴在冰箱上的磁贴板，本来是沈月写菜单用的。<\/p><p>「一次只能有一个换锁流程。每次换锁给一个编号。注册钥匙的时候必须带编号，编号对不上就拒。换完编号作废。」<\/p><p>「就这些。」<\/p><p>「就这些。」阿凯说，「难的不是改，是证明改对了。」<\/p><p>林拓写改动。阿凯写测试。测试的意思是把那个漏洞当成一道题，每次改完都拿题来考一遍。0xRain 的脚本就是第一道题。<\/p><p>阿凯又加了六道。其中一道是：两个人同时换锁。<\/p><p>「谁会同时换。」<\/p><p>「没人会。」阿凯说，「所以才要测。」<\/p><p class=\"stamp\"><strong>12:20<\/strong><\/p><p>改完了。七道题全过。<\/p><p>林拓抽空看了一眼咔哒的后台。今天到现在两百多个访客，一笔手续费，¥19。店还开着。他把那扇门关上，回到船上。<\/p><p>林拓把补丁发给 0xRain。周冉是早上八点到的，进门就问「修到哪了」，然后一直坐在冰箱前面写通知。中午她去楼下买了面，三个人在冰箱前面站着吃。周冉的头发干了，扎起来了。<\/p><p class=\"stamp\"><strong>16:30<\/strong><\/p><p>0xRain 回信。两条意见。<\/p><p>第一条：编号应该在流程结束时才作废，不是开始时。否则用户中途取消，编号已经废了，下次换不了。<\/p><p>第二条：测试里少一种情况，换锁的人自己就是攻击者。<\/p><p>林拓看了第一条，脸有点热。是他写错了。<\/p><p>阿凯看了第二条，说：「有一个问题。这种情况我们防不了，也不用防。他自己的门，他多配一把钥匙，损失的是他自己。」<\/p><p>「那就在回信里说清楚。」周冉说。<\/p><p>改了第一条。第二条写了回复。四点五十发出去。五点零三分回信：<\/p><blockquote><p>同意。可以上。<\/p><\/blockquote><p class=\"stamp\"><strong>19:00<\/strong><\/p><p>问题来了：怎么上。<\/p><p>信风的钱包是链上那个有规矩的保险箱。恢复模块是保险箱上可以换的一块零件。新用户直接装新零件。老用户要换零件，需要按一次指纹，同意换。<\/p><p>八千一百个人，每人按一次。<\/p><p>「不按呢。」周冉问。<\/p><p>「不按就还是旧零件。旧零件的换锁功能我们停着，他不会被偷。但他也不能换备用钥匙，直到他按。」<\/p><p>「那通知里要写清楚。按一下，三十秒。」<\/p><p>还有 App。零件换了，App 也要更新。更新要过应用商店。<\/p><p>林拓打开开发者后台，看着那个熟悉的提交按钮。<\/p><p>「加急。」周冉说，「他们有加急审核。写清楚是安全修复，附时间线。」<\/p><p>他写了。这一次他知道该怎么写：针对哪一条，做了什么，为什么急。二十分钟写完。<\/p><p>沈月在厨房喊吃饭。三个人过去。四菜一汤。周冉说好久没吃到有汤的饭了。<\/p><p class=\"stamp\"><strong>23:50<\/strong><\/p><p>应用商店通过了。五个小时。<\/p><p>阿凯看着那封邮件，说：「上一次是二十八天。」<\/p><p>「上一次他们不知道我们是谁。」周冉说。<\/p><p><strong>4 月 3 日，01:12<\/strong><\/p><p>新零件上链。新版 App 上架。<\/p><p>阿凯盯着监控看了十分钟，说：「行了。」<\/p><p>「更换备用钥匙」的按钮从灰色变回蓝色。<\/p><p>从收到邮件到这一
