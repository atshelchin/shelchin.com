he did not sound unkind. \"Here's where Halyard is. The project doesn't relate to our business. It wasn't developed with our resources, apart from eleven minutes that I'm going to describe in my notes as a policy violation and not as anything else. The company isn't asserting any interest in it and has no claim to it. I'll attach a paragraph to your agreement saying so, so that nobody has to have this call again, including me.\" A pause. \"Don't do it again.\"<\/p><p>\"I don't work there.\"<\/p><p>\"I noticed,\" Rachel Lindgren said. \"Sign when you're ready.\"<\/p><hr class=\"break\"><p>He signed Friday at 4:10 at the kitchen table, in pen, with the paragraph attached, and sent it in from his phone, and the folder was a folder.<\/p><p>Claire came in at 4:30 with her bag and Lucy and looked at the table.<\/p><p>\"It's signed.\"<\/p><p>\"And the call?\"<\/p><p>\"They don't want it. She said so, in writing. She said don't do it again.\"<\/p><p>\"Good.\" She put her bag on the hook. \"Then we do this like a business meeting. Sunday. Bring everything.\"<\/p>", "words": 2196}, {"num": 28, "title": "Runway", "part": 2, "meta": "January 19 – February 10, 2025 · Quince Court, a phone call to Campbell, and a video call to San Mateo", "html": "<p>Claire had a legal pad, and she had written on the first page, before he sat down, five lines with numbers in front of them, and the first line said <em>What we have.<\/em><\/p><p>It was Sunday at 9:10. Lucy was at the Reyeses' until noon. He had brought what she said to bring: the laptop, the folder, the stack of cards from under the coffee maker. She had her laptop open to the household sheet, and a pen, and coffee.<\/p><p>\"Closed months only,\" she said. \"Put December down.\"<\/p><p>He put the card down. <em>140. $1,190.<\/em><\/p><p>\"January isn't closed.\"<\/p><p>\"Then it's not on the pad.\" She wrote <em>Dec: 140 / $1,190<\/em> under <em>What comes in,<\/em> which was line four, and went back to line one. \"Savings. Fifty-two thousand, as of Tuesday. I looked Tuesday night. The severance comes after the twenty-one days, and after taxes it's about twelve thousand.\"<\/p><p>\"About twelve.\"<\/p><p>\"I'm writing twelve, and I'm writing it in pencil.\" She had a pencil for the numbers that were not real yet and a pen for the ones that were. He noticed and said nothing, because it was, exactly, what he would have done.<\/p><p>Line two was <em>What goes out.<\/em> She turned the laptop so he could see the sheet, which had a column now with his project's name at the top that he had not put there.<\/p><p>\"Rent's thirty-seven fifty. That doesn't move. The after-school program is gone, because you're at Room 9 at 2:40 now, and I called them Wednesday, and Thursday's the last day. Camps: the six-week day program, paid up front in June, not the whole summer. The line at the bottom, eating out and gifts and clothes and everything else, was eighteen hundred. It's eight hundred now. You're not going to like the eight hundred.\"<\/p><p>\"I don't go anywhere.\"<\/p><p>\"You go to Orchard.\"<\/p><p>\"Four twenty-five.\"<\/p><p>\"Twice a week. Fifty-two weeks. It's in the eight hundred.\" She turned the pad so he could read it upside down. <em>Out: ≈ $9,900.<\/em> Under it, <em>In (me): $5,700.<\/em> Under that, a line, and under the line, <em>−$4,200.<\/em><\/p><p>\"That's the hole,\" she said. \"Every month. Starting February.\"<\/p><p>He looked at the $4,200 for a while. He could have worked it out any Sunday since March, and had not, because he had been paid on the fifteenth and the thirtieth and the hole had been a shape under a paycheck. Now it was on a pad in his wife's handwriting, and it was larger than $1,190.<\/p><p>\"Insurance,\" Claire said. Line three.<\/p><p>She had the district's form already. She had called the district office Wednesday from her car at lunch, and the form was in a folder with a sticky note on it that said <em>30 days.<\/em><\/p><p>\"Your coverage ends January thirty-first. From then, we have thirty days to get on mine. It's six hundred fifty a month out of my check, before taxes, for the three of us. COBRA on yours is twenty-three hundred.\"<\/p><p>\"The letter pays two months of COBRA.\"<\/p><p>\"The letter pays two months of twenty-three hundred. Then it's March, and we've missed the thirty days on mine, and we wait for October. So the two months are two months of a thing we can't afford the third month of.\"<\/p><p>He took the letter out and read the paragraph again with that in it. On the roof it had read like generosity, and it had been, he thought, in the room where somebody wrote it. For a family with a teacher in it, it was a coupon for a store they were not going to shop at. Nobody at Halyard had done anything wrong. The letter did not know who he was married to.<\/p><p>\"Sign the form,\" Claire said. \"I'll take it in tomorrow.\"<\/p><p>He signed the form.<\/p><hr class=\"break\"><p>Line four had the December card on it, and under the card, three things that were not real yet, in pencil.<\/p><p>The first was the state. He would file Monday, which was a holiday, on a website that did not care. Four hundred fifty dollars a week was the most they paid anyone, and the first week did not count, and he had called Lena on Friday to ask what a man did about a business that made $1,190 a month while he was collecting it.<\/p><p>\"What did she say.\"<\/p><p>\"She said, 'You report what it makes, net, every two weeks. You tell them you're available for full-time work, and you mean it. What you do at five in the morning is between you and your coffee, and I'm not on that call.'\" He had heard the shrug over the phone.<\/p><p>Claire wrote <em>EDD: $450/wk, maybe, minus what the thing makes,<\/em> and did not comment on the shrug, because she had met Lena.<\/p><p>The second was the contract, and it was Priya's, and he had not told her yet.<\/p><p>\"Priya sat down at my table yesterday. At Orchard.\"<\/p><p>Claire put the pencil down.<\/p><p>\"She's never sat down. She sat down with her cup and said, 'My friend Wen runs engineering at a freight software company in San Mateo. She has a queue that loses things and nobody who understands why. Twenty hours a week, ten weeks. I gave her your number. I told her you found the lock at 10:31.'\" He turned his coffee. \"Then she said, 'I wrote a statement,' and I said I knew, and she said, 'It was true. That is the only kind I write.' And she got up.\"<\/p><p>\"That's all?\"<\/p><p>\"She said Rohan liked the dragon.\"<\/p><p>Claire wrote <em>Meridian: 20 hrs × ? × 10 wks<\/em> and, in the margin, <em>ask for 110,<\/em> and circled it. \"When's the call?\"<\/p><p>\"Tuesday.\"<\/p><p>\"Ask for one-ten.\"<\/p><p>\"Okay.\"<\/p><p>\"Not that okay.\"<\/p><p>\"Yes.\"<\/p><hr class=\"break\"><p>Line five said <em>The line.<\/em><\/p><p>\"The contract ends April eleventh,\" Claire said. \"After that it's the hole and the savings. Fifty-two thousand is twelve months of the hole if nothing breaks, and something always breaks, so call it ten. I'm not going to live inside ten months not knowing. So there's a number. Not a feeling. A number the thing has to be paying by a date far enough past April that we know. July first.\"<\/p><p>\"Okay.\"<\/p><p>\"What's the number.\"<\/p><p>He started to work it out from the hole backward: $4,200, less what he could cut from the eight hundred that she had said not to cut, less the state, which would be zero by then, less what the contract would have left in the account.<\/p><p>\"Thirty-five hundred,\" Claire said.<\/p><p>She had it before he had gotten to April. She had it the way she had had the eight hundred, which meant she had done this before, on some page he had not seen, without him, and he heard that and did not ask where.<\/p><p>\"Why thirty-five.\"<\/p><p>\"Because it's most of the hole and it isn't a miracle. Twelve hundred to thirty-five hundred in five months is a thing that could happen. It isn't a thing that has to.\" She wrote it, in pen, and read it aloud as she wrote, in the voice she used on the reading log. \"<em>July 1: $3,500 a month, or Nate looks for a job and takes one.<\/em> If it's there, you keep going and I carry the rest, and I don't say a word about the rest. If it isn't, you job-hunt, and you build this at five in the morning like you did before, and that's not a punishment. That's what it was. It's our number. Say it back.\"<\/p><p>\"Thirty-five hundred by July first.\"<\/p><p>\"Or.\"<\/p><p>\"Or I look for a job and take one.\"<\/p><p>She tore the page off the pad and folded it once and put it under the coffee maker, on top of the cards, where he would see it every morning at five, and where she would see it too.<\/p><hr class=\"break\"><p>He filed with the state Monday at 8:15 in the morning, on a holiday, and the site asked the name of his last employer and whether he was able and available for full-time work, and he checked the box, and meant it, and the day was in front of him with nothing in it, which had not happened since 2014.<\/p><p>Wen called Tuesday at eleven. She was quick and specific, and she said ninety-five an hour, twenty hours a week, February third through April eleventh, afternoons, from home, and did that work.<\/p><p>\"Yes,\" he said. \"That works.\"<\/p><p>He remembered the circle in the margin as he was saying <em>works.<\/em> He told Claire at 4:30, including the part where he had remembered. She wrote <em>$95<\/em> on the pad in pen, over the question mark, without a word, and the not-saying was worse than anything she could have said, and he thought she knew that.<\/p><p>The card from the district's plan came on the thirty-first with her name first and his under it. Lucy's pediatrician changed, and Claire handled it, and he found out when it was done.<\/p><p>The state paid him once. $450, on a card it mailed him, for the week after the week that did not count. The next form had a place for what he had earned, and Meridian's first week went in it, and the number at the bottom was zero, and he filled it out once more to be sure and then stopped.<\/p><hr class=\"break\"><p>Meridian was a Kotlin service that took bookings from trucking companies and put them in a queue, and the queue lost about one in four hundred, and nobody there could say which one or why. He found out why on the second afternoon, in a log nobody had read. It was, to the letter, the third line on a card he had written in October of 2023, <em>nothing near logistics,<\/em> and he was doing it now at ninety-five dollars an hour from his kitchen table, and he found this funny about once a day and told no one.<\/p><p>The mornings were his. Five to seven from habit, and then eight to noon because the house was empty and the contract was afternoons, and he had never in his life had four hours of daylight in a row for the thing.<\/p><p>He built the page.<\/p><p>Not an app. A page. One for every teacher, public, with no login and nothing to install: the policy in the teacher's own words, the notice window, what a credit was, and the teacher's name at the bottom. Diane had said there should be a page that was just the policy, and now there was, and Yolanda's said, in full, <em>Credit if canceled before 9 a.m. the day of the lesson. A credit is one 30-minute lesson,<\/em> and under it, in writing for the first time, <em>Credits don't expire,<\/em> because he had asked her on the phone and she had said, \"Then it doesn't,\" and he had typed that.<\/p><p>Under it, a page for each family, reached from a link and only from a link: that family's lessons and credits and the open slots for makeups and, if the teacher had it on, the invoice, and a button on each lesson that said <em>Cancel,<\/em> which did the thing, with the policy at the top of the page while it did it. The links to those pages were signed now, a long tail of letters after the address, so the page could tell the link had come from him and not from someone changing a number. The short links in the reminder texts, the ones that had gone out every evening at six since August, he left as they were, because they fit in a text and they worked and there were more than a hundred and sixty teachers' worth of them already in the world.<\/p><p>And on every lesson, on the teacher's side, a button that said <em>Send Policy,<\/em> which sent that family its page, with the policy on it, in one tap, before the parent had finished typing.<\/p><p>It shipped Monday, February 10, at 6:40 in the morning, from the table, in the dark, with the coffee. The recital planner and the two libraries and Devin's app went out the same minute, quietly, and Bev had her file, and nobody wrote to ask where anything had gone. He sent Devin the link at 6:41. At 9:30 Devin wrote <em>nice<\/em> with no period, and that was the whole conversation, and it was more than last week's.<\/p><p>At 12:15 he stood at the counter with a sandwich and wanted, for a full minute, somewhere to eat it with a view of Mathilda and a car around him, and he sat down at the table with it and the list of policy pages going up one by one.<\/p><p>The phone went at 12:38. Marcus.<\/p><p class=\"note\"><em>Monday at 4. Mom texted at 12:20 \"so sorry, something came up\" and I hit the button before she finished. She read it. She wrote \"ok got it, see you next week.\" Nobody argued with me. Nobody argued with the page. Now it's the bad guy.<\/em><\/p>", "words": 2165}, {"num": 29, "title": "The Bad Guy", "part": 2, "meta": "February 11 – March 13, 2025 · Persimmon Lane, Quince Court, and a column in a spreadsheet", "html": "<p>Yolanda had her phone out before Lucy was on the bench, which was not a thing Yolanda did, and she held it across the studio at him like a summons.<\/p><p>\"Two.\"<\/p><p>\"Two what?\"<\/p><p>\"Texts. After nine at night. Since the first of the month.\" It was Thursday the twentieth, 4:30, which had been Lucy's slot since January, and Lucy was finding middle C with the confidence of a child who had found it before and expected it to have moved. \"One was the Nguyens, because it rained Tuesday and they text when it rains whether I've got a link or not. One was a wrong number. Last February it was eleven. I know because I keep them. I'm a person who keeps things.\"<\/p><p>\"Two.\"<\/p><p>\"Two's a pickup. It isn't a bar yet.\" She put the phone in her cardigan pocket. \"And I did the thing your trumpet player does. The one from the February email. Mrs. Ruiz started typing at me Tuesday at 2:10, and I could see the little dots, and I pressed your button before she was done, and I felt like a woman who'd pulled a fire alarm. She took Saturday at eleven. She wrote <em>thank you.<\/em>\" Yolanda turned to the piano. \"Thank you, Nathaniel. For the page. Lucy. Both hands. Nobody's chasing you.\"<\/p><p>He wrote <em>2<\/em> on a card in the CR-V, and under it <em>11.<\/em><\/p><hr class=\"break\"><p>Saturday he was at the table at 5:40 with the coffee and the list of everyone who had signed up since the tenth, which was longer than any twelve days since the church hall in August, and he was looking at a column he had added in February and had not looked at since.<\/p><p>The column was called <em>from,<\/em> and it held the page a person had been on the moment before they landed on his. Most rows said what they had always said: Kim's group, the notes page, nothing at all. Eleven rows, since the tenth, said something new. <em>/p/carol-ng.<\/em> <em>/p/bev-ostrowski,<\/em> three times. <em>/p/luis-serrano.<\/em> <em>/p/yolanda-beck.<\/em><\/p><p>He opened Carol's page to see what eleven people had seen. Her policy, in her words, the notice window, what a credit was, her name. And at the bottom, in gray, in the smallest type on the page, a line he had put there on the ninth in about four seconds: <em>This page is made with Fermata.<\/em> He had put it there because a page ought to say where it came from. Eleven people had read a piano teacher's cancellation policy, and found the stamp, and followed it, and signed up.<\/p><p>He looked at that for a while, because it was the first thing in sixteen months that had happened without him standing on a driveway.<\/p><p>Claire came out at seven in the sweatshirt with the coffee cup already in her hand, and he said it to her in one sentence, because that was the rule now.<\/p><p>\"Eleven people signed up in twelve days from a page that isn't mine. They're reading Bev's policy, or Carol's, and there's a line at the bottom with my name on it, and they follow it.\"<\/p><p>\"Who reads a cello teacher's policy?\"<\/p><p>\"Her parents.\"<\/p><p>\"And what are her parents.\" She was at the coffee maker with her back to him. \"Ruth Amsel's daughter takes violin. Half of Room 12's parents teach something. Somebody's kid takes cello from Bev, and somebody reads the page at ten at night after a cancellation, and somebody thinks, <em>I want one of those.<\/em>\" She turned around. \"Teachers have kids, Nate. It's a school. That's all it is.\"<\/p><p>It was a mechanism, and it had a line at the bottom, and he had drawn it the size of a stamp.<\/p><hr class=\"break\"><p>He had four emails that week from teachers on trial that said, in four ways, <em>What should mine say?<\/em> And Bev, who had been paying since June, had written on Tuesday to ask whether a parent texting at 8:58 for a nine o'clock lesson was inside the window or outside it, and he had answered her in one sentence and then thought about the sentence for two days.<\/p><p>So on Saturday, instead of anything else, he built a page that asked five questions.<\/p><p>How much notice do you want. What happens if they give it. What happens if they don't. Does a credit run out. How do they book the makeup. On the other side of the button, a policy in plain sentences, the teacher's name at the bottom, a page anyone could link to, and a PDF for the ones who wanted to hand a parent a piece of paper at a garage door. No account. Free. And under it, in gray, the stamp.<\/p><p>He was still building it Saturday at 9:40 at night when Claire came to the doorway with her book.<\/p><p>\"Is that the app?\"<\/p><p>\"It's a page. Anybody can use it. You answer five things and it writes your policy.\"<\/p><p>\"Is it free?\"<\/p><p>\"Yes.\"<\/p><p>\"Then what's it for?\"<\/p><p>Lucy had asked him that once, about a whale, and he had not had an answer. He had one now. \"For the line at the bottom.\"<\/p><p>Claire looked at the screen from the doorway, and at him, and said, \"Okay,\" and went to bed.<\/p><p>It went live at 11:05 on the twenty-second. He did not post it anywhere. He put it under the word <em>Free<\/em> on his own site and sent it to Bev and went to sleep.<\/p><hr class=\"break\"><p>The first Saturday in March he put a card under the coffee maker that said <em>200. $1,700,<\/em> and Claire wrote it in pen on the pad without comment, and then he opened the notes page and wrote six hundred words about 8:58.<\/p><p>He wrote it the way he had answered Bev, without adjectives. A parent who texts at 8:58 for a nine o'clock lesson is inside a nine o'clock window by two minutes, and a policy that says <em>before 9 a.m.<\/em> means before 9 a.m., and the teacher who honors that will feel like a person who has pulled a fire alarm, and the parent will not think about it again, and next month the text will come at 7:30. He put Bev's question at the top with her name off it and posted it at 8:20.<\/p><p>The Saturday after that he wrote about Angie's siblings, because he still did not have the feature and could at least say in public what the problem was. He did not know whether anyone read them. Nobody had asked him about 8:58 since.<\/p><hr class=\"break\"><p>Thursday, March 6, at 6:15 in the morning, a piano teacher in Kettering, Ohio, signed up for a year.<\/p><p>Her name was Patrice Gallo. She had thirty-one students. The <em>from<\/em> column said only a search engine. But on the twenty-third he had added a box to the signup page that said <em>How did you find this?<\/em> and left it optional, and she had typed in it: <em>Googled \"makeup lesson policy template.\" Yours was third. I made a policy on your free page and then I saw what the page came from. I have been looking for something like this for two years.<\/em><\/p><p>A woman in Ohio had typed four words into a search box, and the third thing it gave her was a page he had built in a weekend because Bev had asked about 8:58, and she had followed the stamp.<\/p><p>He picked up his phone.<\/p><p class=\"note\"><em>Someone in Ohio signed up for the year. Kettering.<\/em><\/p><p>Devin wrote back at 9:50: <em>dayton.<\/em><\/p><p>Then nothing. He wrote <em>How's the search<\/em> and looked at it and sent it.<\/p><p class=\"note\"><em>bad.<\/em><\/p><p>That was the whole conversation. He put the phone face down on the card that said <em>2<\/em> and <em>11.<\/em><\/p><hr class=\"break\"><p>The afternoons were Meridian, and Meridian was a queue.<\/p><p>He had found the why on his second day in a log nobody had read, and the rest of the ten weeks was the slow part: proving it, fixing it, writing it down so someone in San Mateo could read it in June without him. Wen called Fridays at four for four minutes. He sent an invoice every other Friday, forty hours times ninety-five, and the money arrived in ten days, in full, without a conversation.<\/p><p>He had expected to resent it. He had a thing at five in the morning that he would have done for nothing, and then at one o'clock he closed it and opened someone else's problem and was paid for that, exactly, on time. He was grateful in a way that surprised him, and the gratitude had a shape he knew from Gilroy. His father had taken the job at the big landscaping company in 2017 and had come home the first Friday with a paycheck that was not an invoice, and had set it on the table, and had said nothing about it, and had eaten dinner.<\/p><p>The house from eight to 2:40 had nobody in it. He talked to the dog two houses down through the fence. At 2:40 he was at Room 9, and Lucy came out and asked what he had done all day, and he said \"Work,\" and she said \"Which,\" and he did not always have a good answer.<\/p><hr class=\"break\"><p>Wednesday, March 12, was thirty days.<\/p><p>He ran it at 5:20 with the coffee: every cancellation since the tenth of February, and how it had come in. A parent could press the button on her page, or text the teacher the old way and have the teacher type it in, and the difference was a column.<\/p><p>Through the page, ninety-two of every hundred. The rest were texts, most of them the Nguyens' kind, rain and habit, typed in by teachers who did not seem to mind.<\/p><p>Ninety-two. He wrote it on the card under the <em>2<\/em> and the <em>11<\/em> and, for the first time, drew a line under all three.<\/p><hr class=\"break\"><p>Thursday he took Lucy to Persimmon Lane at 4:30, because Thursday was his now, and they were back on Quince Court at 5:20, Lucy with a sticker on her hand that Yolanda gave for both hands.<\/p><p>Claire's Civic was in the driveway. Claire was home at 5:20 on a Thursday maybe once a month.<\/p><p>She was in the kitchen with the refrigerator open and everything that had been in it on the counter: the mustards, the jars, the yogurt with the date on the lid, a bag of carrots gone soft. She had a sponge. She did not turn around.<\/p><p>\"Hey,\" he said.<\/p><p>\"Hey.\"<\/p><p>Lucy went past her to the sticker drawer. Claire's school bag was on the hook by the door, and the front pocket was not zipped, and the corner of an envelope stood up out of it, white, with the district's return address in the blue the district used on everything.<\/p><p>She had seen him see it. She was looking at a jar.<\/p><p>\"It's the district,\" she said. \"Everybody they hired after a date. I'll tell you all of it. Not tonight. Tomorrow's your birthday, and there's a cake in the trunk of my car, and I'm not doing this with a cake in the trunk.\"<\/p><p>\"Okay.\"<\/p><p>He came and stood beside her at the counter and started putting the jars back, the ones with dates that were still good, and she let him.<\/p>", "words": 1885}, {"num": 30, "title": "Pink Slip", "part": 2, "meta": "March 13–21, 2025 · Arbor Elementary and Quince Court", "html": "<p>Lorenz had the envelopes in a stack on her desk with a form on top, and she did not ask Claire to sit down, because there was a line in the hall behind her of people who had also been called at 3:10.<\/p><p>\"I have to hand you this myself, and you have to sign that I did. That's the only reason I'm doing it this way.\" Lorenz slid the form across. \"I'm sorry. It's nine of you. It's everybody after a date, and the date's a spreadsheet, and I've known the spreadsheet since November and I couldn't say so.\"<\/p><p>Claire signed the form. Her signature looked like hers.<\/p><p>\"Read it in your car,\" Lorenz said. \"Not in the hall. Bernie's out there and she'll cry.\"<\/p><p>She read it in the Civic with the engine off and the lot draining after Wednesday's rain.<\/p><p class=\"note\"><em>NOTICE OF RECOMMENDATION THAT SERVICES WILL NOT BE REQUIRED FOR THE 2025–2026 SCHOOL YEAR. Pursuant to Education Code sections 44949 and 44955, you are hereby notified that on March 11, 2025, the Governing Board of the Alder Creek Union School District adopted Resolution No. 24-25-14, reducing or discontinuing the following particular kinds of services: 5.0 FTE multiple-subject elementary classroom teaching; 1.0 FTE reading intervention specialist. It has been recommended that notice be given to you that your services will not be required for the ensuing school year. You have the right to a hearing. A request for a hearing must be delivered to the Office of the Superintendent within seven days of service of this notice.<\/em><\/p><p>Two pages. The second was the request form. She read the first one twice, marking nothing, and stopped at the line about the reading specialist and read it a third time.<\/p><p>One point zero FTE. That was Mrs. Adair, and the rolling cart, and the Tuesdays and Thursdays split three ways, and it was also the cell on Claire's spreadsheet colored gray, and the $28,000, and a job the district had just voted not to have.<\/p><p>She put the letter in the front pocket of the school bag, where there was already a letter, and drove home and took everything out of the refrigerator.<\/p><hr class=\"break\"><p>Friday was his birthday, and she had bought the cake on Wednesday, before anything, and she was not going to let Resolution No. 24-25-14 have a cake she had already paid for. So there was a cake, and Lucy had made a card with a horse on it, which was new, and Nate was thirty-four, and Claire watched him look at her over the candles and not ask, and understood that it cost him, and let it.<\/p><p>Sunday her mother called at seven.<\/p><p>\"Did you tell him?\"<\/p><p>\"About which.\"<\/p><p>There was a silence on the line from Roseville that had a mirror in it.<\/p><p>\"Claire Elizabeth.\"<\/p><p>\"Thursday the district gave me a letter. Monday there's a meeting. Tuesday I'll tell him both. I'm not doing them one at a time, Mom. I've done that for two years and the pile's the same size.\"<\/p><p>\"Are you going to lose the job?\"<\/p><p>\"Probably not. They always notice more than they cut.\" She had read that on the union's page Friday night in the bath. \"That's not the part.\"<\/p><p>\"What's the part?\"<\/p><p>\"I'll know Monday.\"<\/p><hr class=\"break\"><p>The Arbor library had a carpet with the alphabet on it and eleven chairs meant for eight-year-olds, and at 3:30 Monday there were nine teachers sitting in them with their knees up, and the union president, Joan Petrakis, who taught eighth-grade science at the middle school and had driven over with a box of copies.<\/p><p>\"Seniority list,\" Joan said, handing it around. \"By first date of paid service. This is the district's list. If your date is wrong, tell me today, because the date is the whole thing.\"<\/p><p>Claire found herself. <em>Aguilar, Claire E., 08/17/2015.<\/em> Under her, in order: Beltran, Owen's fourth-grade teacher, January 2016. A kindergarten teacher from 2017. Two from 2019. Then 2021, 2022, 2023, and a first-year teacher at the middle school who was twenty-three and was looking at the paper as if she had studied the wrong chapter.<\/p><p>\"Nine notices. Six positions,\" Joan said. \"They always notice more. Three of you are insurance, and the district won't say which three, because the board doesn't know how many kindergartners are showing up in August any more than you do. Count up from the bottom. Six names is the cut as it stands.\"<\/p><p>Claire counted. The first-year teacher, 2023, 2022, 2021, and the two from 2019. Six. Then the kindergarten teacher. Then Beltran. Then her.<\/p><p>Three names from the line.<\/p><p>\"And the reading position,\" said Ruth Amsel, who had no notice and had come anyway.<\/p><p>\"Adair has a multiple-subject credential from 1999. They cut her position, she bumps into a classroom, and the line moves up one name. That's already in the six.\" Joan looked around the carpet. \"I'm not going to pretend that's not what it is. She's been doing that job eleven years, and in August she'll have twenty-four third-graders and no cart.\"<\/p><p>Bernie was in the doorway with her jacket on, not coming in, because this was not her meeting. \"They do ours in April,\" she said, to nobody. \"So you know it's not only you.\"<\/p><p>Joan went through the rest. Request the hearing, all of you; it costs nothing and it makes the district prove the order. Final notices by May 15. Most of you will be rescinded. Not all.<\/p><p>Claire filled out the request form on her knee in pen, gave it to Joan, and walked out past the mural of the orchard to her car.<\/p><p>She was thirty-four. She had a cold every March, and she had one now, in her chest, where it went. Her lower back had a place in it from the kidney-shaped table since October. She had twenty-four children, one of whom had read two pages without his finger in December because she had given him Friday lunches for a year that nobody paid her for. She had a letter from a university, a letter from a district, and a note on her phone with a hundred and some lines in it, and none of the three had been written by her husband, and she had been keeping every one as if they had.<\/p><p><em>Don't be the wife who waits,<\/em> her mother had said, fifteen months ago, from the recliner.<\/p><p>She was not waiting. She was on a list.<\/p><hr class=\"break\"><p>He had a card.<\/p><p>That was the first thing she saw Tuesday night, at 8:30, with Lucy down: he was at the table with the laptop closed and a card in front of him with four lines on it, and he had been working on the lines while she read three chapters of a book about a horse.<\/p><p>She sat at her end and told him. The letter, the resolution, the nine and the six, the list, three names from the line, Adair's cart. She said it in order, and it took four minutes, and he listened without moving.<\/p><p>Then he turned the card around.<\/p><p>\"Wen said Friday they'd take me full-time if I asked. I'll ask tomorrow. There's a recruiter from October, from the company Bea went to, who wrote again in January. Priya knows people. I can have something by April.\" He had it in the voice he used for a plan. \"I'm not going to let this be a thing that happens to you while I sit at this table at five in the morning.\"<\/p><p>\"Nate.\"<\/p><p>\"I'm serious. Tomorrow.\"<\/p><p>\"I don't need you to fix it.\" She heard the school voice arrive and did not send it away. \"I need you to know what it costs. Those are different. You've done the first one to me for seventeen months, and I let you, and I kept score instead of saying so. So I'm saying so.\"<\/p><p>She took her phone out and unlocked it and opened the note and turned it toward him on the table and took her hand off it.<\/p><p>He read the first line and looked up at her, and she nodded at the phone, and he read.<\/p><p class=\"note\"><em>Nov 30. 10:15–1:20. Didn't ask.<\/em><\/p><p>She knew what was under it without looking. The winter, three or four lines a week, the times exact because the chair had a sound. A line for the night in March 2024 when he said it was different. A line for the Saturday in August when $6,000 left the house fund in a driveway in Gilroy, <em>didn't ask, told at Morgan Hill.<\/em> The Saturdays at Devin's, and the line in November, <em>plate, 8:30, didn't sit,<\/em> which was hers, not his. <em>Dec 20. 10:40–1:10, Devin.<\/em> No third part. And the last line, typed at this table on January 14 at 9:40 at night while he lay in the dark down the hall: <em>Jan 14. All of it. Asked.<\/em><\/p><p>He read to the end. It took a while. He did not scroll back up.<\/p><p>\"You kept this the whole time.\"<\/p><p>\"I keep running records. It's what I'm for.\" She had decided in the car not to apologize for it. \"I'm not proud of it. I did it instead of talking to you, which is what you did, and I knew that in December. I'm not ashamed of it either. Every line on there is true, and you didn't know any of them, and now you do. That's the cost.\"<\/p><p>He put the phone down on the table between them, face up, as she had.<\/p><p>\"There's one more thing.\"<\/p><p>She got up and took the school bag off the hook and took the other letter out of the front pocket and put it in front of him, unfolded, with the seal up.<\/p><p>\"I applied in October. It came December twenty-third. It's been in that bag since. A master's in reading, at State, the last week of August, fourteen thousand a year for two years. It moves me a column, thirty-four hundred a year, and it's the job the district just voted not to have, and I'm doing it anyway. I have to tell them by April first.\"<\/p><p>He read the date at the top.<\/p><p>\"December twenty-third.\"<\/p><p>\"Yes.\"<\/p><p>\"Three weeks before.\"<\/p><p>\"Yes. I decided on the porch on the twenty-seventh, when my mother's car was still in the street, that I'd give you until summer and then go in August no matter what, and I didn't tell you that either. And on New Year's Eve, at the Kasprzaks', Arun told me at the counter that the board had approved a list. I watched you stand by the window with a paper plate for an hour and a half, not knowing, and I didn't say it.\" She sat back down. \"You said spring.\"<\/p><p>\"I know.\"<\/p><p>\"It's Thursday. The twentieth. I looked it up this time. I'm not asking you to stop. I'm telling you what I'm doing. That's a different sentence. My mother told me so, and she was right, and I've been sitting on it for three months to prove her wrong.\"<\/p><p>He looked at the two letters and the phone, all three face up on the table, and at the card with his four lines on it, and turned the card over.<\/p><p>\"Okay,\" he said, and she heard it, and something in her chest that was not the cold let go a quarter inch.<\/p><hr class=\"break\"><p>Thursday was the first day of spring, and they did it at the table, at 8:40, with the pad.<\/p><p>He kept going until July 1. The line under the coffee maker stood, at $3,500, in her handwriting, and she said the number out loud again, and he said it back. If he was under it, he looked for a job and took one, and the district's letter did not change that, because the letter was the district's and the line was theirs.<\/p><p>She started in August no matter what. Rescinded or not. The intent-to-enroll form was on the university's site, and she filled it out at the table while he watched, and pressed the button, and the page said <em>Thank you,<\/em> and she wrote <em>Aug 25<\/em> on the pad in pen.<\/p><p>Every number, every Sunday. His and hers. The card from under the coffee maker and the note from her phone, both on the table, and neither of them kept anywhere else.<\/p><p>\"And Sacramento,\" she said. \"Next week. I'm coming.\"<\/p><p>\"It's a hotel conference room. You'd be in the front row of a thing about cancellation policies.\"<\/p><p>\"Yes.\"<\/p><p>\"Why?\"<\/p><p>\"Because I've watched you leave for it for seventeen months, and I've read the cards, and I've never once seen the people. I want to see what they see.\" She capped the pen. \"Lucy can go to your mother's. I've already asked.\"<\/p><p>He did not say that she had done it again, without him. He looked at her a while, and she let him, and then he said, \"Okay,\" and it was the good one.<\/p>", "words": 2164}, {"num": 31, "title": "Sacramento", "part": 2, "meta": "March 27–31, 2025 · I-680, I-80, and a hotel across from the convention center", "html": "<p>Yolanda had a bag of oranges in the back seat, from the neighbor's tree, and by Walnut Creek she had peeled three and was handing segments forward between the seats without being asked, one to Claire and one to him, like a woman feeding a car.<\/p><p>\"Eleven lessons,\" she said. \"Thursday and Saturday. I pressed one button on Sunday night and every one of them got a credit and a note, and I got one text back, from Trish Nguyen, asking whether it was going to rain in Sacramento.\" A segment came over his shoulder. \"In 1996 I'd have made eleven phone calls and lied to four of them about a funeral.\"<\/p><p>Claire had the printed program open on her knee to page 9, where it said, in the conference's typeface, <em>Studio Policies Parents Actually Follow. Nathaniel Aguilar, Fermata. Friday, 2:15 p.m., Sierra B.<\/em> Harriet Lum had put his name in, in December, when he was a Halyard engineer with a thing on the side, and there it was.<\/p><p>\"How many times are you going to say 'I think,'\" Yolanda said.<\/p><p>\"I don't know.\"<\/p><p>\"You said it five times at St. Bede's in front of twenty-two people. There'll be forty. Say it four. Nobody's chasing you.\"<\/p><p>Lucy was in Gilroy. Rosa had taken Friday off, her second personal day in twenty-three years, and Lucy regarded a Friday with no school and a grandmother as the greatest thing that had ever happened to a person. Claire had taken one too, her first since Lucy was born, and had said so at Sunol and then been quiet until the toll plaza.<\/p><p>680 went to 80 at Cordelia in the last light, and it was 6:50 when the skyline came up, which in Sacramento was a short thing to say.<\/p><hr class=\"break\"><p>The hotel was across J Street from the convention center, and the exhibit hall was a ballroom with the chairs taken out and forty tables put in, and his was between a man selling metronomes and the Bay Music Supply man from August, who nodded at him as if they had been neighbors before, which they had.<\/p><p>He had a tablecloth, a banner Kim had made him buy, a laptop open to Yolanda's page, and a stack of policies from the free tool, printed at the library at 15 cents a page. $1,140, all in, on a card in his pocket: the table, two nights, the gas, the banner.<\/p><p>Rondo had the end of the row, both corners. A backdrop the height of a door that said <em>RONDO<\/em> and under it <em>Free for teachers. Always.<\/em> Tote bags, canvas, good ones, in a stack that went down as fast as people walked past it. Two people in matching quarter-zips and one in a gray sweater, younger than the other two, who was, Nate understood by nine o'clock, the one the other two looked at.<\/p><p>By noon Friday half the teachers in the ballroom were carrying the tote bag.<\/p><p>\"That's a lot of bags,\" Claire said, from behind his table, where she had put herself at eight and stayed.<\/p><p>\"They're free.\"<\/p><p>\"I see that.\"<\/p><hr class=\"break\"><p>Sierra B was set for sixty and had forty in it, and he was at the front with the laptop and a clicker he had not tested and his hands somewhere he could not find them.<\/p><p>Yolanda and Claire were in the front row with their coats on the chairs beside them. Yolanda had her arms folded. Claire had a pen and the program and was not looking at him at all. She was looking at the room.<\/p><p>He had twenty minutes and a plan, and the plan was to show them a page instead of talking.<\/p><p>He put Yolanda's policy page on the screen, the public one, and let them read it. Then the family page, the one a parent got from a link: the lesson, the policy at the top, the credit, the open Saturday, and the button. Then a number.<\/p><p>\"Since February tenth, ninety-two of every hundred cancellations in the studios using this came through that page. Not a text. The page. The parent reads the policy while she's canceling, and she doesn't argue with it, because there's nobody there to argue with.\" He looked at Yolanda without meaning to. \"One teacher I know had eleven texts after nine at night in February of last year. This February she had two, and one was a wrong number.\"<\/p><p>\"Two,\" Yolanda said, to the room, and a few people laughed, and it helped.<\/p><p>He got through the rest. The free page that wrote a policy in five questions, for anyone. The button that sent a family its page before the parent had finished typing. He said <em>I think<\/em> four times, because he was counting, and then stopped counting.<\/p><p>Then questions. The first two were easy: yes, it texts; no, it does not do recitals, and he said why in one sentence.<\/p><p>The third was from a woman in the third row with a lanyard from Elk Grove and the tote bag on the chair beside her.<\/p><p>\"I got that bag this morning from the people across the hall,\" she said. \"Nice people. It's free. Free for teachers, always. So I have to ask, and I'm not being mean. Why would I pay you nine dollars a month when they're free?\"<\/p><p>He had known the question was in the room since nine in the morning and had not written down an answer, because he had thought one would come.<\/p><p>\"They charge your parents,\" he said. \"Three percent and fifty cents on every payment. I don't charge your parents anything.\"<\/p><p>\"My parents pay a fee at the dentist. They pay one on the Venmo. They don't notice.\"<\/p><p>\"It's nine dollars.\"<\/p><p>\"Theirs is zero.\"<\/p><p>\"I think,\" he said, and heard it, the fifth one, \"the difference is who's paying for it. If your parents are paying for it, then it's built for—\" He did not finish that, because he could see where it went and could not get there in front of forty people. \"I don't have a good answer for that yet. That's honest. I'll have one.\"<\/p><p>A man near the back said, \"So they're cheaper,\" and got a laugh, and the woman from Elk Grove said, \"Thank you,\" in a voice that meant she had gotten what she came for, and it was 2:41, and Harriet was at the door.<\/p><p>He closed the laptop. His shirt was stuck to his back. Claire stood up from the front row and came to the table and, while he was winding the cord, put her hand flat between his shoulder blades and left it there, and did not say anything, and the not-saying was the best thing anyone had done for him in a month.<\/p><hr class=\"break\"><p>\"Seven,\" Yolanda said, in the hall, with her coat on. \"'I think.' I counted. Four in the talk and three at the woman. And you said <em>nine dollars<\/em> four times. Nobody in that room cares about nine dollars, Nathaniel. They pay nine dollars to park.\"<\/p><p>\"I know.\"<\/p><p>\"You don't yet. You will.\" She looked at the tote bags going past. \"The number was good. Ninety-two. You should have said it twice.\"<\/p><p>Claire had the program with pen marks on it, and at his table, with the stack of policies going down to people who had been in the room, she showed him what she had been doing instead of watching him.<\/p><p>\"Forty people. Thirty-one wrote something down when you said ninety-two. Two wrote something when you said nine dollars. When the woman asked about free, eleven people looked at the bag on her chair.\" She capped the pen. \"That's what they see. They see a bag and a number. You've got the number. You don't have an answer, and they know it, and they still came to the table.\"<\/p><p>By noon Saturday there were eight of them on a card, in the box that said <em>how did you find this,<\/em> every one of them <em>Sacramento<\/em> or <em>your talk<\/em> or, once, <em>the two texts lady.<\/em><\/p><hr class=\"break\"><p>The bar off the lobby was doing a slow Friday, and at 9:40, with Claire gone up and Yolanda gone up an hour before her, the gray sweater sat down on the next stool with two beers and pushed one over.<\/p><p>\"You're the ninety-two percent guy. I was in the back. Grant Halloran.\" He was thirty, or looked it, with a handshake he had practiced and then stopped practicing. \"That number's real?\"<\/p><p>\"It's real.\"<\/p><p>\"It's a good number. I'd have said it twice.\" He drank. \"I liked the page. It's small. It's very nicely small. The Elk Grove lady was right, though, and you know she was, which is why you couldn't answer her.\"<\/p><p>\"Tell me why she was right.\"<\/p><p>Grant told him. He did not lecture; he argued, and he had argued it a hundred times, in rooms with worse chairs. \"Teachers hate paying for software. They've hated it for twenty years, and Allegro made a business out of it. Parents don't notice a fee on a payment. Three percent and fifty cents on a fifty-two-dollar lesson is two dollars and six cents, and nobody has ever canceled a piano lesson over two dollars and six cents.\" So the teacher paid nothing, the parent paid what a parent paid everywhere, and the whole thing ran on the fee.<\/p><p>\"Twenty thousand teachers by Christmas,\" Grant said. \"That's the number.\"<\/p><p>\"What are you at now?\"<\/p><p>\"A little under three thousand.\"<\/p><p>\"Since when?\"<\/p><p>\"Since June.\"<\/p><p>Nate turned a napkin over. Three percent of $52 was $1.56, and with the fifty cents, $2.06. Stripe took 2.9 and thirty cents on the same charge, which was $1.81. He wrote the two numbers down and subtracted.<\/p><p>\"You keep a quarter.\"<\/p><p>\"We don't pay Stripe's rate.\"<\/p><p>\"You pay somebody's.\"<\/p><p>\"At volume it's interchange plus, and at twenty thousand teachers times forty families times a payment a month it's a very different quarter.\" Grant smiled, and it was a real smile. \"You did the napkin. Everybody does the napkin. Twenty thousand quarters is five thousand dollars, right? That's the napkin.\"<\/p><p>\"That's the napkin.\"<\/p><p>\"That's why we don't think in quarters. We think in teachers.\"<\/p><p>\"What happens when a parent pays by check?\"<\/p><p>\"Then we make nothing on that lesson, and the teacher still has the schedule and the reminders and the page, and she's still ours. Next month her card families are easier than her check families, and she notices, and she turns on card for everybody. Seventy percent do inside ninety days.\" He had that number ready too. \"Ask me a harder one.\"<\/p><p>Nate thought about it.<\/p><p>\"What's it cost you to have a teacher who pays nothing?\"<\/p><p>\"Servers. Support. Me.\" Grant shrugged. \"Two point four million of somebody's money, until the parents cover it. They will. Not at three thousand. That's why it's twenty.\"<\/p><p>He was not lying. That was the part Nate kept coming back to, on the second beer, with the napkin under his hand. Grant Halloran believed every word of it, and had the numbers in the right order, and had put a tote bag on half the shoulders in a ballroom in nine months, and worked eighty-hour weeks and said so without complaining, and the thing he was building was aimed at the same people Nate had spent a year finding one at a time.<\/p><p>\"Your thing's nice,\" Grant said, standing, putting a twenty under his glass. \"I mean that. It's small. Small's a choice. Just make sure it's yours.\"<\/p><hr class=\"break\"><p>Jonah called at 7:40 Saturday morning while Nate was walking down J Street for a coffee, and Nate told him the napkin.<\/p><p>\"He's paying to acquire your customers,\" Jonah said, before Nate had finished. \"Every free teacher costs him servers and support, and he's covering that with somebody's two point four until the parents' quarters do, and at three thousand they don't, and he knows it, which is why he needs twenty. It's a bet on a number, is what it is. Sometimes those pay.\" A pause. \"I've got a thing to tell you too. Not on the phone. Farah's, the eighth.\"<\/p><p>\"Is it bad?\"<\/p><p>\"It's not bad,\" Jonah said. \"That's the thing about it.\"<\/p><hr class=\"break\"><p>They were home Saturday at 6:20 with the oranges gone and eight names on a card. Lucy came back from Gilroy Sunday with tamales and a report that Grandma's roof did not leak in the front anymore, only the back.<\/p><p>Monday morning at 7:10 Kim posted in the group, without comment, a link.<\/p><p><em>Rondo Reaches 3,000 Teachers Nationwide; Announces Free-for-Teachers Commitment Through 2026.<\/em> A photograph of a gray sweater on a stage. A line near the bottom about a seed round and a payments partner.<\/p><p>Three thousand. On Friday night it had been a little under.<\/p><p>Under Kim's link, at 7:14, there was one comment, hers: <em>For what it's worth, free is a price. Somebody pays it.<\/em><\/p>", "words": 2162}, {"num": 32, "title": "Peninsula", "part": 2, "meta": "April 8–11, 2025 · Castro Street, Mountain View, and Quince Court", "html": "<p>Farah did the room the way she always did it, one sentence each, no exceptions, and when she got to him she pointed with the marker.<\/p><p>\"Whiteboard guy.\"<\/p><p>\"Cancellations and credits for music teachers,\" he said. \"Two hundred forty paying. Two thousand forty a month.\"<\/p><p>The room did nothing in particular. Farah wrote <em>2,040<\/em> on the whiteboard behind her with the rest of them and said, \"That's a number. Took you eleven months,\" and moved on to a man with a browser extension, and Nate sat down with the sentence still in his mouth. He had said it. He had said a real number out loud in a room, and the room had let it be a number, and that was the whole event, as far as he was concerned.<\/p><p>Jonah was against the wall by the coffee with his arms folded, and Farah left him for last.<\/p><p>\"Jonah. One sentence.\"<\/p><p>\"I'm going to need three.\" He did not unfold his arms. \"Leash Ledger is twenty-two hundred a month, down from thirty-one. I'm shutting it down May thirty-first and starting on the second of June at a company whose name is on a building on 101. I'm not sad, and I want to say that before you all do the face.\"<\/p><p>They all did the face.<\/p><p>It was a room of twenty-six people who had each, at some point, stood where Jonah was standing and said a number, and most of the numbers had been smaller than his. He had been the one at the back for six years saying <em>charge from day one,<\/em> and now he was the one saying <em>May thirty-first,<\/em> and nobody knew where to put their hands.<\/p><p>\"Why not sell it?\" said the browser extension.<\/p><p>\"To who? For what? Eleven months of revenue, if I'm lucky, and four months of my life to find the buyer. I can turn it off in one email.\"<\/p><p>\"That's a failure, though,\" said someone by the window who was not yet thirty and did not mean it unkindly. \"I mean. Technically.\"<\/p><p>\"It paid a room in Mountain View for six years,\" Jonah said. \"Call it what you want. I've stopped needing it called anything.\"<\/p><p>\"What do the dog walkers get?\"<\/p><p>\"Sixty days. An export. Refunds on anything prepaid. Two names of things they can use instead, one of which is a spreadsheet.\" He looked at Farah. \"I'm going to have dental. I'm going to be home at six. I've been telling this room what to do for six years and I'd like, for a while, to have a desk somebody else pays for and find out if I was right about any of it.\"<\/p><p>\"He's often wrong,\" Farah said, from habit, and the room did not laugh, and Jonah did, once.<\/p><hr class=\"break\"><p>Afterward they sat at one of the long tables with the room emptying around them and Jonah's laptop open to a draft that had four <em>sorry<\/em>s in it, and Nate read it once and said, \"Three of these have to go.\"<\/p><p>\"You've done this.\"<\/p><p>\"In December. Smaller. I cut three things and a friend's app and wrote to everybody who used them.\" He turned the laptop. \"Say the date first. Then what they get. Then what to use instead. Then thank you. One sorry, near the end, and it has to be for something specific, not for the whole thing.\"<\/p><p>\"What's specific?\"<\/p><p>\"That they'll have to move their data. That's a real cost. Say that one.\"<\/p><p>Jonah wrote for a while. Nate watched Castro Street through the glass, the platform lit and empty, and thought that it was the second time in his life he had helped someone say a thing was over. The first time he had been the one deciding, and this time he was the one holding the laptop, and it was easier and it was not.<\/p><p>\"Read it.\"<\/p><p>Nate read it. <em>Leash Ledger will shut down on May 31, 2025. Until then everything works as it does today. On May 1 you'll get an export of every client, invoice, and route, in a file that opens in anything. If you paid for a year, the unused part comes back to your card in May, automatically. Two things that will do most of what this did are below; one of them is free. I'm sorry that you'll have to move your data; I know what that costs, because I built the thing you're moving it out of. Thank you for six years. Jonah.<\/em><\/p><p>\"That's it,\" Nate said.<\/p><p>\"It's short.\"<\/p><p>\"It's done.\"<\/p><p>Jonah looked at it a while longer with his hands off the keys. He did not look like a man reading a thing he regretted. He looked like a man who had checked a bill and found it correct.<\/p><p>\"You're doing the face,\" he said.<\/p><p>\"I'm not.\"<\/p><p>\"You are. A little. It's fine.\" He closed the laptop. \"You've got a number now. Two thousand forty. That's real. Mine was thirty-one hundred at the top and it was real too. I'm not telling you it's the same. I'm telling you I'm not sad, and you should believe me, because I've never once said a thing in this room I didn't believe. Ask Farah.\"<\/p><p>Farah was at the door with her keys, waiting to lock up, and she had heard her name.<\/p><p>\"He's often wrong,\" she said. \"Nate. Speak sometime. Twenty minutes. What you said tonight, with the number, and the Sacramento thing, the part where the woman asked why she'd pay you and you didn't have it. People need to hear the part where you don't have it.\"<\/p><p>\"Maybe.\"<\/p><p>\"That's a yes with a coat on,\" Farah said. \"Sometime. I'll write it down.\"<\/p><p>He walked to the car past the platform as a train came in, and he did not look at the board, because for the first time since 2017 nobody he knew was on it.<\/p><hr class=\"break\"><p>Wen called Friday at four, which was the last four minutes.<\/p><p>\"The queue hasn't lost one since February twentieth. Fifty days. I've had the number on a sticky note and I'm taking it down.\" She was quick and specific and did not do goodbyes. \"Your last invoice came in this morning and it'll pay Monday. I'm writing you a reference without being asked. Priya said you'd say no to full-time, so I'm not going to ask and make you say it.\"<\/p><p>\"She's right.\"<\/p><p>\"She generally is. That's a problem for the people who work for her.\" A pause. \"Nate. It was a real bug. Not everybody who came in here would have read that log.\"<\/p><p>\"Okay.\"<\/p><p>\"I don't say things to be nice. Have a good weekend.\"<\/p><p>The last invoice was $3,800, forty hours at ninety-five, and with it the ten weeks came to $19,000, gross, before Lena took her look at it in a year. It was the most money he had ever been paid for something he could have done in his sleep, and he did not feel one way or the other about it, and then he did. He had sat at this table on the fourteenth of January with a folder and a number that was not real. Now the number was real and it was in the account, and the account was higher than it had been that day, by Claire's pad. The hole under it was $4,200 a month and had not moved.<\/p><p>At 4:30 he opened the state's site.<\/p><p><em>Reopen your claim.<\/em> It remembered him. It wanted to know if he was able and available for full-time work, and whether he had looked for any, and it wanted the answers to be true. He had checked the box in January and meant it, on a holiday, with a day in front of him with nothing in it.<\/p><p>There was a card under the coffee maker in Claire's handwriting that said what happened if he was under $3,500 on July 1. It did not say anything about April. He looked at the box for a while. Then he closed the site without checking it, because he would have had to mean it, and he did not, and the not-meaning-it was worth $450 a week, which was a thing he was going to have to say out loud on Sunday.<\/p><p>He said it at 4:40 instead, when Claire came in with her bag.<\/p><p>\"I closed the unemployment page.\"<\/p><p>She put the bag on the hook. \"Why.\"<\/p><p>\"Because I'd have to say I'm looking for a job. And I'm not, until July. That's the deal.\"<\/p><p>She looked at him for a while, and then went to the pad, which lived on top of the microwave now, and wrote <em>EDD: 0<\/em> on line four in pen, and under it <em>Meridian: done, $19,000,<\/em> also in pen, and put the pen down.<\/p><p>\"It's a number,\" she said. \"Zero's a number. It's on the page.\"<\/p><hr class=\"break\"><p>The March card had gone under the coffee maker on the first and onto the pad on Sunday: <em>240. $2,040.<\/em> Forty in during March: the eight from Sacramento, on a card of their own, against $1,140, which Claire had written beside them without comment; the rest from the stamp, and the free page, and Kim's group, and a violin teacher in Toledo who had found the policy page of a teacher in Ann Arbor and followed the line at the bottom, and whom he had not told Devin about, because Devin's last text had been <em>bad,<\/em> and the one before it had been <em>dayton.<\/em><\/p><p>Friday night, with Lucy down and Claire in the bath with a mystery, he took a card and drew a calendar on it by hand, April through June, the way he had drawn schedules on the backs of his father's estimates when he was thirteen, and counted the squares from tomorrow to July 1.<\/p><p>Eighty-one.<\/p><p>Under the calendar he wrote <em>$2,040<\/em> and, under that, <em>$3,500,<\/em> and subtracted, and wrote <em>$1,460<\/em> and circled it. He did not write anything about whether that was a thing that could happen in eighty-one days, because he did not know, and neither did the card.<\/p><p>He put it under the coffee maker, under the folded page in Claire's handwriting, where he would see it at five, and turned off the light over the stove.<\/p>", "words": 1712}, {"num": 33, "title": "Plateau", "part": 3, "meta": "April 15 – May 11, 2025 · Quince Court and a back office on Bascom Avenue, San Jose", "html": "<p>The back office of Bay Music Supply had a desk, a safe, two chairs, and a wall of rental violins in cases with the sizes on masking tape, and Dolores Fanucchi did not sit in either chair. She sat on the safe.<\/p><p>\"Walt says you don't have a brochure.\"<\/p><p>\"I have a page.\"<\/p><p>\"Then show the page to Walt. Walt's the one who gets asked.\" She pointed at the man from the church hall in August and the ballroom in March, who was leaning in the doorway with a pencil behind his ear and had still, as far as Nate knew, never said a word to him. \"I don't have 'I don't know' at my counter.\"<\/p><p>So he did it for Walt, on his phone, with Dolores watching him and not the phone. A lesson. Yolanda's one sentence. The button, the credit, the two open Saturdays under it. Walt took the pencil from behind his ear, wrote something on a rental form, and put the pencil back.<\/p><p>\"How much?\"<\/p><p>\"Nine a month. Seventy-nine a year. The parent pays nothing.\"<\/p><p>Dolores had a ledger on the desk, green cloth, and she turned it around: names, with a column of numbers beside each.<\/p><p>\"Teachers. The ones who send me families. Eleven of them stopped sending last year. Two retired. The rest just quit, and when I called, a woman in Milpitas told me she'd taken a job at a dentist's.\" She closed the book. \"A teacher who quits is forty families who don't come in here in September. I don't sell to people who walk in off Bascom. I sell to people who were sent. So here's what I want, and then you tell me what you want.\"<\/p><p>She wanted him back on a Tuesday, when Rhonda was on, for ten minutes at the counter. She wanted three lines in her newsletter, her words, with a link that was hers so she would know what the letter had done. And two dollars a year for every teacher who came in through the link, for as long as that teacher paid him.<\/p><p>\"Two dollars.\"<\/p><p>\"It's not the money, Mr. Aguilar. It's that somebody pays somebody, so it's a deal and not a favor. Favors end when somebody dies. My father did favors on this street for forty years and I'm still hearing about them from people who think I owe them a violin.\" She got down off the safe. \"What are you spending on now?\"<\/p><p>\"Search ads. Two weeks.\"<\/p><p>\"How's that going?\"<\/p><p>\"Three hundred and eighty dollars and one teacher, so far.\"<\/p><p>Walt, in the doorway, made a sound that was almost a word.<\/p><p>\"I stopped the Yellow Pages in 2009,\" Dolores said, \"and nobody noticed. Saturday. Twelve thousand people. Three lines.\"<\/p><hr class=\"break\"><p>He turned the ads off Tuesday the twenty-ninth at 5:10 in the morning, because the two weeks were up.<\/p><p>It was an honest machine. It had shown his sentence, <em>Cancellation policies parents actually follow,<\/em> to people who typed <em>piano lesson cancellation policy<\/em> into a box, charged him each time one of them clicked, and counted. Four hundred and ten clicks. Fourteen trials. Two paid, one for a year and one for a month. $600.<\/p><p>Three hundred dollars a teacher. At nine dollars a month, thirty-three months to get it back, if she stayed thirty-three months.<\/p><p>Under <em>HN: 38,000, 700, 4,<\/em> he wrote <em>Ads: $600, 14, 2.<\/em> The machine had done exactly what it said. The people it found did not know him and had no reason to, and $600 had bought him that fact.<\/p><p>Dolores's three lines had gone out Saturday.<\/p><p class=\"note\"><em>A software man from Alder Creek came in and showed my counter a page that lets a parent cancel a lesson and see what it costs them. Nine dollars a month for the teacher, nothing for the parent. First one of these I'd let Walt explain. —D.F.<\/em><\/p><p>By the following Saturday the link that was hers had brought seventeen people. He did not write it on the card yet. She had said three weeks, and she would have her own number.<\/p><hr class=\"break\"><p>April closed at 295 and $2,510, and Claire wrote it on the pad in pen, and on Thursday morning at 5:20, with the ads off, he did the thing he had been not doing since Sacramento.<\/p><p>Rondo gave every teacher a public page. He typed the name of the thing, and <em>piano,<\/em> and <em>San Jose,<\/em> then <em>Fremont,<\/em> then <em>Sacramento.<\/em> Forty-one pages by seven o'clock, each with a name and a photograph and a rate and, at the bottom, in gray, a line that said whose the page was.<\/p><p>He knew what that line was. He had one.<\/p><p>He wrote to the first name, a piano teacher in Fremont, and he wrote it well, because he had gotten better at writing. Her name. Her studio. What her parents were paying on every payment, in a figure. What he charged, and to whom. A link. Then a second. Then a third.<\/p><p>It was 7:25 when he stopped, and it was less a decision than a feeling under the sternum, the one he got after a left turn he should not have made. The third woman had a sentence on her page about her studio dog. She had chosen the thing. She had never heard of him, and he was in her kitchen at 7:25 in the morning telling her the people she had chosen were charging her parents, which was true, and which was the call Kim got from Allegro twice a year and hung up on. <em>They know my student count. They say it to me like a compliment.<\/em><\/p><p>He knew forty-one student counts. He had typed the search himself.<\/p><p>He deleted the three drafts, and the list, and then the search from the history, which was stupid, and which he did anyway.<\/p><hr class=\"break\"><p>Devin's text came Friday, May 2, at 3:12, while Nate was on the sidewalk outside Room 9 with the other parents.<\/p><p class=\"note\"><em>dad. hospital. toledo.<\/em><\/p><p class=\"note\"><em>I'm sorry. What do you need.<\/em><\/p><p class=\"note\"><em>nothing. flying tonight. pneumonia on top of the copd. hes a tough old bastard.<\/em> Then: <em>dont call. i cant do the voice thing yet.<\/em><\/p><p>Lucy came out with a drawing of a horse, and he said it was a good horse, and she said it was a mustang, which was a specific kind, and he drove home with the phone face down in the cup holder and did not call.<\/p><hr class=\"break\"><p>The comparison page took him the weekend, and he was ashamed of the first version before he had finished reading it back.<\/p><p>It had a table. Two columns. The first row said <em>Price for teachers,<\/em> and under Rondo it said <em>Free,<\/em> and under Fermata it said <em>$9/month,<\/em> and the rows went on for a while after that, and none of them mattered, because the first row had said everything. Rondo was free for teachers. He had written that and stopped, and the rest of the page was a man who did not have the next sentence, filling the space with rows.<\/p><p>He closed it and did the dishes. Sunday at 6:10, with Claire in the bath, he wrote it again without the table.<\/p><p class=\"note\"><em>Rondo is free for teachers. That's true, and you should know it. Free is a price; somebody pays it. Here's who. Your parents pay 3% and 50¢ on every payment: $2.06 on a $52 lesson, about $80 a year for a family with one lesson a week, about $3,300 a year across a studio of forty families. It's money that leaves your families and doesn't come to you. Here's what you get from me for $9 a month: the page, the credits, the texts, and me answering your email, honestly, by the next morning. Nobody else pays anything. If you'd rather your parents paid it than you did, Rondo is a good product and the people who make it are decent. I've met them.<\/em><\/p><p>He sent it to Kim at 7:40 with no note. She wrote back at 7:52.<\/p><p class=\"note\"><em>I'll share this one. Take out \"honestly.\" If you have to say it, it isn't. Also, you have never once answered me by the next morning; you answer me in nine minutes, which is worse, and you should say that instead.<\/em><\/p><p>He took out <em>honestly.<\/em> He left the next morning in, because it was a promise he could keep.<\/p><hr class=\"break\"><p>Devin, Friday the ninth, at 9:50 at night, which was 12:50 in a hospital in Ohio, to a question Nate had asked at noon: <em>140 applications. 4 phone screens. 0. front end is dead dude. im in a cafeteria with a vending machine and a guy on a ventilator upstairs, ask me about the search next week.<\/em><\/p><p>Nate wrote <em>Okay,<\/em> deleted it, wrote <em>I'm here,<\/em> and sent it. It was true and it was not enough, and he knew what would have been enough, and it was not his to give, and in a way he could not look at directly on a Friday night it was also exactly his.<\/p><hr class=\"break\"><p>He called Dolores on Saturday the tenth, at the end of the second week, because she had said she would ask and he did not want to be asked.<\/p><p>\"Twenty-six from your link. Nine paying so far. The rest are in the thirty days.\"<\/p><p>\"I have twenty-six,\" she said. \"Rhonda counts the clicks. Walt's been asked four times at the counter, and he's said it four times, and I've listened twice, and it was fine. Call me at three weeks with the other number. Not for the two dollars.\"<\/p><p>By the following Thursday it was thirty-one, and he put it on the card under the ads that night. <em>Bay Music: 12,000, 31.<\/em> Thirty-one people who had been sent.<\/p><hr class=\"break\"><p>The pauses started on the fifth, as they had the year before, only there were more people to pause now. Diane Foyle first: <em>Back in August, same as last year.<\/em> Then six more in a week, from studios that ended when school ended, each with a date to come back on or no date, each keeping everything. He had built the button for exactly this, and every time it worked it took a small amount off a line on a chart that had, since the twenty-fifth of April, not gone anywhere.<\/p><p>He looked at it Sunday, May 11, at 5:15, as he had every morning for three weeks, as if it might have moved in the night. A slope up to the twenty-fifth. After that, a line you could have laid a ruler on, with a small tooth in it each time a Bay Music teacher's thirty days ended and she paid, and a tooth the other way each time somebody went to the beach. Signups in, pauses out, and the line did not care which was which.<\/p><p>It was Mother's Day. He called Gilroy at eight, and Rosa said the orange tree had done nothing this year and that Gil Pacheco was coming on the twenty-fifth to look at the back, and Nate said good, and did not ask what looking would cost, and she did not tell him.<\/p><p>Claire came in at 8:30 with Saturday's mail, which she had left in the box overnight. Two catalogs, a roofing flyer, a bill. Nothing in the district's blue. She put the stack on the counter and looked at it a moment longer than a stack of mail needed.<\/p><p>\"Thursday's the fifteenth.\"<\/p><p>\"I know.\"<\/p><p>\"Joan says they hand-deliver the finals. So it wouldn't be in the box anyway.\" She squared the catalogs. \"I'm going to keep checking the box.\"<\/p><p>\"Okay.\"<\/p><p>His calendar was under the coffee maker, under her folded page, and he took it out and crossed off Saturday's square, which left fifty-one. The chart was still open beside it, flat since the twenty-fifth with its small teeth, and he looked from the one to the other, the squares going down and the line going nowhere, until Lucy came in with the mustang and wanted to know what the flat part meant. He said it meant a lot of people were at the beach. She said she wanted to go to the beach. He said August, and put the card back.<\/p>", "words": 2040}, {"num": 34, "title": "Rescinded", "part": 3, "meta": "May 12–31, 2025 · Arbor Elementary, the Alder Creek Community Center, and Gilroy", "html": "<p>Lucy came out of Room 9 at 2:40 with a folder and a report that a boy named Theo had thrown up during silent reading, and by the time she had finished the report they were at the CR-V and Claire was still not out.<\/p><p>Claire's class let out at 2:40 too. At 2:52 Nate could see her door from the lot, and the door was open, and Lorenz was standing in it with a folder of her own.<\/p><p>\"Is Mom in trouble?\"<\/p><p>\"No.\"<\/p><p>\"Then why is Mrs. Lorenz there?\"<\/p><p>\"Get in the car.\"<\/p><p>Claire came across the lot at 3:05 with the school bag on her shoulder and a single sheet of paper in her hand, blue, and she did not walk fast, and when she got to the car she put the paper on the hood between them so he could read it without taking it from her.<\/p><p class=\"note\"><em>NOTICE OF RESCISSION.<\/em> Two paragraphs. The resolution number. Her name spelled right. <em>The preliminary notice dated March 13, 2025, is hereby rescinded, and you will be offered employment for the 2025–2026 school year.<\/em><\/p><p>\"She did it at the door. With the form. Same as March.\" Claire's voice was fine. \"Beltran got one. The kindergarten got one. Dani didn't.\"<\/p><p>\"Dani's the—\"<\/p><p>\"Twenty-three. Middle school. She got the other kind at 2:45 and she's in the staff bathroom, and I'm out here.\" And then, without anything in her face changing first, she was crying, in the lot, at the hood of the car, with the paper under her hand, and she was furious about it before the second breath.<\/p><p>\"Oh, for God's sake.\"<\/p><p>\"It's fine.\"<\/p><p>\"It's not fine, it's a parking lot.\" She wiped her face with the back of her wrist. \"It's the same paper. It's the same blue. I've been doing arithmetic on a list since March and the arithmetic came out and I'm standing here doing this over a form.\"<\/p><p>Lucy had the window down. \"Why are you crying if it's good?\"<\/p><p>\"Because I'm tired, Lucy.\" Claire said it to her straight, as she said true things to seven-year-olds. \"Sometimes that's all it is.\"<\/p><p>Nate did not say anything. He picked up the paper, so it would not blow, and folded it once, and held it, and she let him. After a while she got in the passenger side and said, \"Drive. Don't say anything smart,\" and he drove and did not.<\/p><hr class=\"break\"><p>The Alder Creek Community Center was a gym with a stage at one end, and on Saturday the seventeenth the stage had a black baby grand on it that belonged to the city, and a hundred folding chairs on the floor faced it, and by 9:50 every chair had a parent in it and the bleachers on the side had the grandparents.<\/p><p>Yolanda's recital programs went back to 1996 on a corkboard in her garage, and this year's was a single folded sheet, printed at the library, thirty-four names in an order that went from smallest to tallest. Lucy was ninth. <em>Lucy Aguilar. \"Ode to Joy,\" Beethoven.<\/em> Lucy had read it four times and pointed out that the comma was after the title and not after her name.<\/p><p>At 10:00 Yolanda came up the side steps in the black she wore for recitals and walked to the piano, and stopped.<\/p><p>The fallboard was down. The city kept a lock on it, a small brass one at the center of the lip, and the custodian had left the key in it, and Yolanda put her thumb and finger on the key and turned, and it did not turn. She tried again. Her face did the thing it did for parents, the pleasant nothing, and she took her hand off the key and looked at it, the key, as if it had been rude.<\/p><p>Arjun Patel got up from the front row. He was eleven now and had been in the beta in his pajamas. He went up the steps without hurrying, turned the key, lifted the fallboard, and went back down and sat. Nobody had asked him to, and most of the gym had not seen it, because most of the gym was looking at their programs for their own child's name.<\/p><p>\"Thank you, Arjun,\" Yolanda said, in her ordinary voice, and Arjun said, \"It sticks,\" and she said, \"It does,\" and turned to the chairs and began.<\/p><p>Nate had seen it. He had seen her thumb pressed into her palm in February of last year and a pencil stop a quarter inch into a word, and he had not written those down either, and he kept his hands on his knees and did not take out a card.<\/p><hr class=\"break\"><p>Lucy went up ninth in the dress with the horses on it, which she had insisted on, and sat, and put her feet on the bar Yolanda had set for the smaller ones, and looked at the keys for a long moment, as she had looked at middle C in the first week, and played.<\/p><p>He knew the piece the way you know the piece your child has played four hundred times in the next room. He could hear the second line coming. In the second line, on the way back down, she played a D where an E went, and the note was wrong in the gym in front of a hundred people, and her shoulders did not move, and her hands did not stop, and she played through it and on to the end and took her hands off and stood up and looked for them.<\/p><p>Claire had his arm above the elbow. She had had it since the D.<\/p><p>\"She didn't stop,\" Claire said.<\/p><p>\"No.\"<\/p><p>In November Yolanda had told a group of four thousand teachers that he had played a wrong note and stopped and played the bar again, and that this was what you wanted, and that it was the ones who kept going you could not teach. He had thought about that sentence for six months. His daughter had just kept going, in front of a hundred people, and it had been the right thing to do, and he was clapping.<\/p><hr class=\"break\"><p>At 11:20, with thirty-four children done and the cookies out on a folding table, Yolanda stood at the front and said the thing she always said at the end, thank you for coming, and then a new thing.<\/p><p>\"There's no Thursday next week. I'm taking it. The Saturday times are on the page. If you want one, take one; if you don't, the credit sits there. I'm not going to text you about it.\"<\/p><p>And a hundred parents took their phones out.<\/p><p>He watched it. He could not have not watched it. Mrs. Ruiz, three rows up, with her thumb on the link. Trish Nguyen, showing the page to her husband, who nodded as if he had built it. Two mothers by the bleachers holding their phones side by side, comparing Saturdays. A grandfather who could not find the text and was being helped by a nine-year-old. Nobody looked for Yolanda. Nobody raised a hand. The page did what the page did, in a gym, forty times at once, and he stood by a folding table full of cookies and saw the thing he had made being used by people who did not know he was in the room.<\/p><p>Then Lucy came down off the stage with a certificate, and he put the phone in his pocket without having taken it out, and stopped watching.<\/p><hr class=\"break\"><p>Yolanda found him at the cookies.<\/p><p>\"I'm dropping the sevens,\" she said. \"Both of them. The Tuesday and the Wednesday. They can have a Saturday if they want one. For now.\"<\/p><p>\"Why?\"<\/p><p>\"Because it's May and I'm fifty-nine.\" She took a cookie and did not eat it. \"It's a rest, Nathaniel. A rest has a length. It's written on the page. I haven't written this one in yet.\"<\/p><p>\"Okay.\"<\/p><p>\"Don't write that down either.\"<\/p><p>He had not reached for a card. She had seen him not reach for it, and said it anyway, and went to find the Patels.<\/p><hr class=\"break\"><p>Gil Pacheco was on his mother's roof at nine on Sunday the twenty-fifth with Lucy holding the ladder, because that was her job, and Rosa on the porch with her coffee, because that was hers.<\/p><p>The tarp on the back slope had done a winter. It was blue in the places the sun had not reached and gray everywhere else, and Gil pulled a corner of it up and put his hand on what was under it and came down the ladder without saying anything from the top, which was how Nate knew before Gil opened his mouth.<\/p><p>\"The back's the same as the hall was. Worse. The decking's soft in three places I can find with my hand and I didn't look hard.\" He wiped his palm on his jeans. \"I can tarp it again. That's four hundred and I'm not going to tell you it'll hold, because it held once and I don't like the odds twice. Or you do the roof.\"<\/p><p>\"What's the roof?\"<\/p><p>\"Tear-off, new decking where it's gone, which is more than you think, comp shingle, the vents, the flashing, all of it. Twenty-two thousand. That's the church price. Anybody else says eighteen, he's not replacing the decking, and you'll know it in three years.\"<\/p><p>Rosa said, from the porch, \"I have some of it.\"<\/p><p>\"Mrs. Aguilar,\" Gil said, \"you've said that to me twice,\" and went to write it up in his truck.<\/p><p>Twenty-two thousand.<\/p><p>He knew where the money was. That was the thing about the pad on the microwave; he knew where every dollar was and what was already spoken for. There was $4,200 a month going out of the house fund whether or not anybody touched it. There was Claire's first installment in August, $4,700, which was on the pad in pen. There was the line, thirty-seven days away, and what happened after it if he was under. He had stood in this driveway nine months ago with his back to the door and moved six thousand dollars with his thumb and told his wife at Morgan Hill.<\/p><p>C
