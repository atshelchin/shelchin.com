<style>

}

    --ground:#16171A; --surface:#1E2024; --surface-2:#292C31; --ink:#E8E4DC; --ink-2:#BDB7AD; --muted:#8F8981;

    --shadow:0 12px 32px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#16171A; --surface:#1E2024; --surface-2:#292C31; --ink:#E8E4DC; --ink-2:#BDB7AD; --muted:#8F8981;
  --rule:#33363C; --accent:#8FB4E0; --accent-ink:#0F1622; --brass:#D2A25E; --brass-soft:#2B2519;

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:var(--toc-w) 1fr;min-height:100vh}

/* ---------- Contents ---------- */
.toc{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--rule);padding:28px 22px 40px;scrollbar-width:thin}
.toc .brand{display:flex;flex-direction:column;gap:2px;margin-bottom:6px;cursor:pointer}
.toc .brand h1{font-family:var(--serif);font-weight:700;font-size:22px;margin:0;line-height:1.15;color:var(--ink);letter-spacing:-.01em}
.toc .brand span{font-size:11px;color:var(--muted);letter-spacing:.16em;text-transform:uppercase}
.toc .tag{font-size:12px;color:var(--muted);margin:8px 0 22px}
.vol{margin-bottom:18px}
.vol-h{display:flex;align-items:baseline;gap:8px;padding:6px 0;border-bottom:1px solid var(--rule);margin-bottom:6px}
.vol-h b{font-family:var(--serif);font-size:14px;font-weight:600;color:var(--ink)}
.vol-h i{font-style:normal;font-size:11px;color:var(--muted);letter-spacing:.02em;margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.toc ol{list-style:none;margin:0;padding:0}
.toc li button{display:grid;grid-template-columns:2.2em 1fr;align-items:baseline;width:100%;text-align:left;padding:6px 8px;border-radius:6px;color:var(--ink-2);line-height:1.35;font-size:14px}
.toc li button:hover{background:var(--surface-2);color:var(--ink)}
.toc li button.on{background:var(--accent);color:var(--accent-ink)}
.toc li button.read:not(.on){color:var(--muted)}
.toc li button .n{font-variant-numeric:tabular-nums;font-size:12px;opacity:.75}
.toc li button.on .n{opacity:.9}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20}

/* ---------- Main ---------- */
main{min-width:0;display:flex;flex-direction:column}
.bar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:saturate(1.2) blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
.bar-in{display:flex;align-items:center;gap:10px;padding:10px 18px;max-width:calc(var(--measure) + 120px);margin:0 auto;width:100%}
.bar .where{flex:1;min-width:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .where b{color:var(--ink);font-weight:500;margin-left:6px}
.ib{width:36px;height:36px;display:inline-grid;place-items:center;border-radius:8px;color:var(--ink-2)}
.ib:hover{background:var(--surface-2);color:var(--ink)}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib.menu{display:none}
.progress{height:2px;background:var(--rule)}
.progress i{display:block;height:100%;width:0;background:var(--brass);transition:width .15s linear}

.page{flex:1;width:100%;max-width:calc(var(--measure) + 120px);margin:0 auto;padding:40px 60px 60px}
article{font-family:var(--body-font);font-size:var(--fs);line-height:var(--lh);color:var(--ink);max-width:var(--measure);hyphens:auto;-webkit-hyphens:auto}
article .eyebrow{font-family:var(--sans);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--brass);margin:0 0 10px;font-variant-numeric:tabular-nums}
article h1{font-family:var(--serif);font-size:2em;font-weight:700;line-height:1.2;margin:0 0 .35em;text-wrap:balance;letter-spacing:-.01em}
article .meta{font-family:var(--sans);font-size:13px;color:var(--muted);margin:0 0 2.2em;padding-bottom:1.1em;border-bottom:1px solid var(--rule);font-variant-numeric:tabular-nums;line-height:1.6}
article .meta em{font-style:italic;color:var(--ink-2)}
article h2{font-family:var(--serif);font-size:1.25em;font-weight:600;margin:2.2em 0 .8em;color:var(--ink)}
article p{margin:0 0 1em;text-align:var(--align);overflow-wrap:break-word}
article p.note{color:var(--ink-2)}
article hr.break{border:0;height:auto;background:none;margin:2em 0;text-align:center;line-height:1}
article hr.break::before{content:"\2022\00a0\00a0\00a0\2022\00a0\00a0\00a0\2022";color:var(--muted);font-size:.9em;letter-spacing:.1em}
article em{font-style:italic}
article strong{font-weight:600}

/* Cover */
.cover{max-width:var(--measure)}
.cover .kicker{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--brass);margin:30px 0 18px}
.cover h1{font-family:var(--serif);font-size:clamp(44px,8vw,80px);font-weight:700;letter-spacing:-.02em;margin:0 0 14px;line-height:1.02;color:var(--ink);text-wrap:balance}
.cover .sub{font-family:var(--serif);font-size:18px;line-height:1.6;color:var(--ink-2);margin:0 0 34px;max-width:34em}
.cover .cta{display:inline-flex;align-items:center;gap:10px;background:var(--accent);color:var(--accent-ink);padding:12px 22px;border-radius:8px;font-weight:500;font-size:15px}
.cover .cta:hover{filter:brightness(1.06)}
.cover .cta svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cover .facts{display:grid;grid-template-columns:repeat(3,auto);gap:28px;margin:44px 0 0;padding-top:24px;border-top:1px solid var(--rule);width:fit-content}
.cover .facts div{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.cover .facts b{display:block;font-family:var(--serif);font-size:24px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:0;margin-bottom:2px;text-transform:none}
.cover .vols{margin:40px 0 0;padding:0;list-style:none;display:grid;gap:10px}
.cover .vols button{display:grid;grid-template-columns:5.6em 1fr auto;align-items:baseline;gap:12px;width:100%;text-align:left;padding:14px 16px;border:1px solid var(--rule);border-radius:8px;background:var(--surface)}
.cover .vols button:hover{border-color:var(--accent)}
.cover .vols .v{font-family:var(--sans);font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--brass)}
.cover .vols .t{font-family:var(--serif);font-size:17px;font-weight:600;color:var(--ink)}
.cover .vols .t small{display:block;font-family:var(--sans);font-weight:400;font-size:12px;color:var(--muted);margin-top:3px}
.cover .vols .r{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.cover .rules{margin:40px 0 0;padding:20px 22px;border-left:3px solid var(--brass);background:var(--surface);border-radius:0 6px 6px 0;font-family:var(--serif);color:var(--ink-2);font-size:15px;line-height:1.7}
.cover .rules b{display:block;font-family:var(--sans);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--brass);margin-bottom:8px;font-weight:600}

/* Pager */
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:var(--measure);margin:48px 0 0;padding-top:24px;border-top:1px solid var(--rule)}
.pager button{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border:1px solid var(--rule);border-radius:8px;background:var(--surface);text-align:left}
.pager button:hover:not(:disabled){border-color:var(--accent)}
.pager button:disabled{opacity:.35;cursor:default}
.pager button.next{text-align:right;align-items:flex-end}
.pager small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.pager span{font-family:var(--serif);font-weight:600;color:var(--ink);font-size:15px}

/* Settings */
.panel{position:fixed;top:56px;right:16px;z-index:30;width:320px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);padding:16px}
.panel h3{margin:0 0 12px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600}
.row{display:grid;grid-template-columns:80px 1fr;align-items:center;gap:10px;margin-bottom:12px}
.row label{font-size:13px;color:var(--ink-2)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:8px;padding:3px;gap:3px}
.seg button{padding:7px 4px;border-radius:6px;font-size:13px;color:var(--ink-2);text-align:center}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg button.f-serif{font-family:var(--serif)}
.seg button.f-sans{font-family:var(--sans)}
.seg button.f-georgia{font-family:var(--georgia)}
.stepper{display:grid;grid-template-columns:36px 1fr 36px;align-items:center;background:var(--surface-2);border-radius:8px;padding:3px}
.stepper button{height:30px;border-radius:6px;font-size:18px;color:var(--ink-2)}
.stepper button:hover{background:var(--surface);color:var(--ink)}
.stepper output{text-align:center;font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink)}
.panel .hint{font-size:12px;color:var(--muted);margin:6px 0 0;line-height:1.5}
kbd{font-family:var(--sans);font-size:11px;padding:1px 5px;border:1px solid var(--rule);border-bottom-width:2px;border-radius:4px;background:var(--surface-2)}

.foot{max-width:var(--measure);font-size:12px;color:var(--muted);margin:60px 0 0;line-height:1.6}

/* ---------- Phone ---------- */
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .toc{position:fixed;left:0;top:0;bottom:0;width:min(84vw,340px);z-index:25;transform:translateX(-104%);transition:transform .22s ease;box-shadow:none}
  .toc.open{transform:none;box-shadow:var(--shadow)}
  .scrim.show{display:block}
  .ib.menu{display:inline-grid}
  .page{padding:26px 20px 48px}
  :root{--measure:100%;--fs:18px}
  article{max-width:100%}
  .cover .facts{grid-template-columns:repeat(3,1fr);width:100%;gap:14px}
  .cover .vols button{grid-template-columns:5.2em 1fr}
  .cover .vols .r{grid-column:2}
  .panel{top:auto;bottom:0;left:0;right:0;width:100%;max-width:100%;border-radius:14px 14px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
}
@media (prefers-reduced-motion:reduce){.toc{transition:none}.progress i{transition:none}}
[hidden]{display:none!important}

<script id="data" type="application/json">{"parts": [{"id": "Part One", "name": "Notice", "span": "Aug 2023 – Mar 2024"}, {"id": "Part Two", "name": "Build", "span": "Mar – Oct 2024"}, {"id": "Part Three", "name": "Ship", "span": "Nov 2024 – Apr 2025"}, {"id": "Part Four", "name": "Season", "span": "Apr – Dec 2025"}, {"id": "Part Five", "name": "Exposure", "span": "Dec 2025 – Mar 2026"}, {"id": "Part Six", "name": "Terms", "span": "Mar – Jun 2026"}], "chapters": [{"num": 1, "title": "Forty-Five Dollars", "part": 0, "meta": "August 26–29, 2023 · Alder Creek and Sunnyvale", "html": "<p>Yolanda Beck shook his hand at the door of the garage and then, for a second, held her own right hand against her hip as if she'd caught it in something.<\/p><p>\"Piano hands,\" she said. \"Come in. You're the parent, so you sit there. Lucy, you're with me.\"<\/p><p>The chair was a metal folding chair against the wall, one of two. The garage had a Yamaha upright along the back wall and an electric piano on a stand beside it, a space heater unplugged in the corner, a mini-fridge, a corkboard shingled with recital programs, and a whiteboard the size of a door. A box fan turned in the open side window. It was ten to ten on a Saturday morning and already warm.<\/p><p>Lucy climbed onto the bench. She was six and had started first grade at Arbor the week before, two doors down from her mother's classroom, and she had been talking about this lesson for most of that week, mainly about whether the piano would have all the keys.<\/p><p>\"Eighty-eight,\" Yolanda said. \"Count them later. Right now I want one. Find middle C.\"<\/p><p>Lucy pressed a key at the far left. The sound came up out of the floor.<\/p><p>\"That's a C,\" Yolanda said. \"It's just not the one in the middle.\"<\/p><p>Lucy pressed one at the far right.<\/p><p>\"Also a C. You have good instincts and no information. Look at the black keys. See how they come in twos and threes? Find a two. Now the white key just to the left of the two, right in front of your belly button.\"<\/p><p>Lucy found it. She played it four times, hard.<\/p><p>\"Once was enough. Now take your hand off and find it again.\"<\/p><p>She couldn't. She found the one above it, and then the one below it, and then she said, \"Why is it called C if it's in the middle? It should be called M.\"<\/p><p>\"Take it up with a monk who's been dead a thousand years,\" Yolanda said. \"Again.\"<\/p><p>Nate watched. He had expected her to be softer with a first-grader and sharper with him, and she was, but the sharpness with him was brisk rather than unkind, and the patience with Lucy had no bottom that he could see. Lucy lost middle C eleven times in thirty minutes. Yolanda never once found it for her.<\/p><p>The wall beside his chair held a sheet of paper in a plastic page protector, thumbtacked at the corners. STUDIO POLICIES, it said, in a font from another decade. He read it because it was there.<\/p><p class=\"note\"><em>Lessons are 30 or 45 minutes, weekly. Tuition is due the first of the month. 24 hours' notice is required to cancel. One makeup lesson per semester, at the teacher's discretion. Lessons canceled by the teacher are credited at $45. Credits expire at the end of the semester and are not refundable.<\/em><\/p><p>Forty-five. They were paying fifty-two a lesson; Claire had asked on the phone and written it on the calendar. The sheet was older than the rate.<\/p><p>He looked from the sheet to the whiteboard. It had two columns, drawn in green marker and gone over more than once. The left column said MAKEUPS OWED and held nine family names, some with a number after them, one with a question mark. <em>Nguyen 2. Ortega 1 (Mar?). Patel Sat 12:30??<\/em> The right column said OPEN and held three times, two of them crossed out. An arrow ran from one column to the other and then back. Down at the bottom, in different ink, someone had written <em>CALL DENTIST<\/em> and <em>juice<\/em>.<\/p><p>Nine names on a board, under a sheet that said one makeup per semester. A question mark next to a credit from March that, by the sheet, had expired in June. He read the sheet again to be sure he had the sentence right. He did.<\/p><p>\"Nathaniel.\" Yolanda had turned on the bench. \"Tuesdays at four-thirty. I send a request on the first of the month and you pay it. Don't send me money I haven't asked for. It confuses my books.\"<\/p><p>\"Okay.\"<\/p><p>\"What do you do?\"<\/p><p>\"Software. In Sunnyvale.\"<\/p><p>\"Is that a business or a job?\"<\/p><p>\"A job.\"<\/p><p>His father had run a business. That was the whole sentence he ever said about it.<\/p><p>\"Good,\" Yolanda said. \"Then you'll be at work at four-thirty, and the practicing will fall on your wife, and you should know that going in.\" She turned back to Lucy. \"Once more. Belly button.\"<\/p><p>Lucy found it.<\/p><p>In the car Lucy said she'd found it four times. Nate said she had found it once and then found the other ones, and she said that still counted, and he said okay, it counted.<\/p><hr class=\"break\"><p>The letter was on the kitchen table when they got home, in Claire's hand. Mrs. Halvorsen had typed it. She typed everything, on a machine she kept on her own kitchen table, and her letters came over folded in thirds with the duplex's address on the front, as though they had come through the mail instead of across the shared wall.<\/p><p class=\"note\"><em>Effective September 1, 2023, the monthly rent for 14B Quince Court will be $3,650.<\/em><\/p><p>\"A hundred and fifty,\" Claire said. \"That's eighteen hundred a year.\"<\/p><p>\"Everything's going up.\"<\/p><p>\"I know everything's going up. I teach in this town. I'm not saying don't sign it.\" She had her school voice on, the one that got twenty-four eight-year-olds into a line. She heard it and let it go. \"I'm saying she's handing us a piece of paper and we could hand her one back. Ask if she'd do two years at that number. And ask about the dryer. It's been since June.\"<\/p><p>The dryer was in the garage next to Lucy's bike and had not turned since the second week of June. They had been hanging laundry on a rack under the lemon tree. It worked fine in August. It would not work fine in January.<\/p><p>\"Okay,\" Nate said.<\/p><p>Mrs. Halvorsen's kitchen was the mirror of theirs with forty more years of things in it. The typewriter sat on the table under a tea towel. There was a bowl of lemons, and the newspaper, and a photograph of a man in a Navy uniform. She was eighty-one and had kept the books for a lumberyard in Redwood City until it closed, and she asked about Lucy first, and whether the piano lady on Persimmon Lane was the one with the recitals at the community center, because she had gone to one, years ago, for a neighbor's grandson.<\/p><p>\"She is.\"<\/p><p>\"Well. That's a nice thing for a girl.\"<\/p><p>He signed both copies where she had typed the lines. She put one in a folder and handed him the other, and then she filled a paper bag with lemons from the bowl and handed him that.<\/p><p>\"For your wife. She likes them.\"<\/p><p>\"She does. Thank you.\"<\/p><p>He stood in the doorway with the lemons. He could see the garage from there. The words were available to him; he said harder things to a database every day. He said, \"Have a good weekend, Mrs. Halvorsen,\" and went home.<\/p><p>Claire was at the sink. \"And the dryer?\"<\/p><p>\"It didn't come up.\"<\/p><p>She dried her hands. She took the bag from him and set the lemons in the bowl one at a time, and he watched her decide not to say anything, which took longer than saying it would have.<\/p><p>\"Eighteen hundred,\" she said finally, to the lemons. \"That's most of a year of piano.\"<\/p><hr class=\"break\"><p>Monday he was on Alder Creek Road at 6:45 and through the Halyard turnstile at 7:03. The cafeteria on the ground floor had stopped serving breakfast in the spring, so he carried coffee from home in the same steel cup he had carried since Pixelbridge. Four floors, mostly dark at that hour. The Orders pod sat at the north end of the third floor, six desks, one of them empty since March and not refilled.<\/p><p>Stand-up was at 9:15. Ben Sattler ran it from his laptop. Nate said what he had said Friday: the retry work on the order service was done, the tests were green, the deploy was Wednesday if nothing came up. Nobody asked a question. Priya Venkataraman, who ran the pod on the other side of the glass, passed in the hallway with her own laptop under her arm and nodded at him, and he nodded back. They had spoken maybe forty times in six years, always about a queue.<\/p><p>At 10:30 the review portal reminded him to acknowledge his mid-year check-in. He had read it already. <em>Meets expectations. Nate is thorough, dependable, and careful in his designs. Could be more visible to partner teams and leadership.<\/em> He clicked the box that said he had read it.<\/p><p>Then, because the browser was already open and it was the last Monday of the month, he opened the equity portal. The shares he had vested since the IPO had a number next to them, and the number was about a quarter of what the grant letter had said it would be, two years ago, when the letter had been a reason to stay. He had done the arithmetic before. He did it again anyway.<\/p><p>When he had told his mother about the Halyard offer, in 2017, she had asked what the insurance was before she asked what it paid. She had never once asked about the stock. He had never once told her the number, and he was aware, looking at it, that this was not the same thing as her not wanting to know.<\/p><p>He closed the tab. He went home at 5:40, and Claire asked how work was, and he said fine, and it had been.<\/p><hr class=\"break\"><p>The text came Tuesday at 2:08, while he was in a meeting about the Wednesday deploy.<\/p><p class=\"note\"><em>No lessons today. Something came up. I'll figure out makeups. Y<\/em><\/p><p>It had gone to a group. He hadn't known he was in a group. There were twenty-seven numbers at the top of the thread, some with names Claire must have saved, most without.<\/p><p>The first reply came at 2:09. <em>Feel better!!<\/em><\/p><p class=\"note\"><em>Is that a makeup or a credit?<\/em> said someone named Mike O. <em>We still have one from May.<\/em><\/p><p class=\"note\"><em>The May one was ours Mike,<\/em> said Trish Nguyen. <em>She moved you into our slot that week.<\/em><\/p><p class=\"note\"><em>She said we'd both get it.<\/em><\/p><p><em>Does anyone know if Thursday is still on,<\/em> said a number with no name.<\/p><p><em>Yolanda can you confirm the May credit is the Nguyens,<\/em> Trish wrote, and put a thumbs-up on her own message.<\/p><p>Six replies in ten minutes. Nate read them under the table. Yolanda replied to none of them, then or, as far as he could tell, ever.<\/p><p>Claire texted him separately at 2:20. <em>Did you see. I already sent her the $104 for the two August lessons. So do we get 52 back or 45 or a Saturday?<\/em><\/p><p><em>I don't think she knows,<\/em> he wrote.<\/p><p class=\"note\"><em>Then who does?<\/em><\/p><p>He didn't have an answer, so he sent a thumbs-up, which in their marriage was the symbol for that.<\/p><hr class=\"break\"><p>At nine that night Lucy was down and Claire was grading spelling pretests at the table with a red pen and a cup of tea. He had the thread open on his phone. He had counted the twenty-seven numbers and matched what he could to the whiteboard: Nguyen, two owed; Ortega, one, with a question mark. He wasn't sure why he was doing it. He was aware that it was more interesting than the deploy.<\/p><p>Claire came around behind him to get to the kettle and stopped, reading over his shoulder.<\/p><p>\"You've still got that open.\"<\/p><p>\"There's a policy sheet on her wall,\" he said. \"In a page protector. It says one makeup a semester and credits expire. And next to it there's a whiteboard with nine families on it, and it's August.\"<\/p><p>\"So the sheet's wrong.\"<\/p><p>\"The sheet's what she wants. The board's what she does.\"<\/p><p>Claire read a little further. Mike O. had come back at 6:40 to say he'd found a Venmo note from May that said <em>credit<\/em>, but not for whom.<\/p><p>\"So who tracks the makeup?\" she said.<\/p><p>He didn't know. Yolanda, in the planner he'd seen lying open on the Clavinova, in pencil. The parents, in their heads and their Venmo notes. The whiteboard, in green marker, until somebody's elbow.<\/p><p>\"I don't know,\" he said.<\/p><p>\"Come to bed.\"<\/p><p>\"Okay.\"<\/p><p>He sat a minute longer with the phone. What he noticed, and it surprised him a little, was that he wanted to know.<\/p>", "words": 2103}, {"num": 2, "title": "The Whiteboard", "part": 0, "meta": "September 5–16, 2023 · Alder Creek, Sunnyvale, and the Mountain View Caltrain station", "html": "<p>\"Two hundred and eight,\" Claire said. \"Four Tuesdays. No credit.\"<\/p><p>She had the Venmo request open on her phone and turned it toward him across the table, the way she would turn a worksheet toward a parent. It had come in Friday, the first of the month, exactly as Yolanda had said it would. <em>September. 4 lessons. $208.<\/em> Nothing about the Tuesday that hadn't happened.<\/p><p>\"She said she'd figure out makeups.\"<\/p><p>\"It's been a week. Lucy had a lesson today and nobody mentioned it. I'm not going to stand in that garage and ask a woman about forty-five dollars in front of my daughter.\" She put the phone down. \"So I'm asking you to ask her. Tuesday. I have a staff meeting; you'll have to leave work early anyway.\"<\/p><p>\"I could make her a spreadsheet.\"<\/p><p>Claire looked at him.<\/p><p>\"Families down the side,\" he said. \"Dates across. What's owed, what's been used, what's expired. She prints it and tapes it over the board. It's an hour.\"<\/p><p>\"Or you could ask her where the forty-five dollars is.\"<\/p><p>\"I'll ask.\"<\/p><p>\"You'll bring her a spreadsheet.\"<\/p><p>\"I'll bring her a spreadsheet and I'll ask.\"<\/p><p>She paid the two hundred and eight while he watched, and she didn't add a note, and he understood that the note was his job now.<\/p><hr class=\"break\"><p>Devin found him in the cafeteria on Thursday with a plate of the Tuesday chicken, which was what it became by Thursday. Devin Kowalczyk was thirty-four, from Toledo, and had been at Halyard four years, on the front end of the same product Nate worked the back of; they'd met in an incident channel at two in the morning and had eaten lunch together since. He rode the N-Judah to Fourth and King every morning and Caltrain from there to Sunnyvale, an hour and a quarter each way, and he did most of his reading on the train and most of his talking at lunch.<\/p><p>\"So tell me about the piano lady,\" Devin said. \"You said a whiteboard. You said it like it was a crime scene.\"<\/p><p>Nate told him. The sheet in the page protector. The nine names. The group text with twenty-seven numbers and the argument over a credit from May.<\/p><p>\"Dude.\" Devin put his fork down. \"That's a product.\"<\/p><p>\"It's a whiteboard.\"<\/p><p>\"Okay but hear me out. What is every founder thread. Every single one. Solve a problem you have. You have a problem. Your kid's piano teacher lost forty-five dollars of your money in a Trapper Keeper.\"<\/p><p>\"A planner.\"<\/p><p>\"In a <em>planner<\/em>. And there's, what, thirty of her? A hundred? Every piano teacher in the country's got the same whiteboard.\" He picked the fork back up. \"I'm just saying. I've built two things. Budgeting app, 2018, four users, one of them my mom. Fantasy football lineup thing, 2021, got to two hundred people and then the season ended and so did I. I never had the problem. I just had the idea. You have the <em>problem<\/em>.\"<\/p><p>\"I made her a spreadsheet.\"<\/p><p>\"Oh no.\"<\/p><p>\"It's a good spreadsheet.\"<\/p><p>\"I'm sure it's a beautiful spreadsheet.\" Devin chewed. \"There's a meetup next Tuesday, Mountain View, on Castro. Indie people. A woman named Farah runs it, she's got a podcast thing that actually pays her rent. Come.\"<\/p><p>\"It's a school night.\"<\/p><p>\"You don't go to school.\"<\/p><p>\"My daughter does.\"<\/p><p>Devin pointed the fork at him. \"That's the problem, right there. That's the whole problem with you.\"<\/p><hr class=\"break\"><p>He left work at 3:50 and was in the folding chair at 4:28 with the spreadsheet printed on two sheets and stapled. Lucy had found middle C in the first ten seconds, to Yolanda's visible satisfaction, and was working on \"Hot Cross Buns\" with her right thumb.<\/p><p>\"What is that?\" Yolanda said, without turning around. She had seen the staple.<\/p><p>\"A spreadsheet. For the makeups.\"<\/p><p>\"No.\"<\/p><p>\"It's just families and dates. You'd write in the—\"<\/p><p>\"Nathaniel. No.\" She put a hand on Lucy's shoulder. \"Keep going. Thumb, thumb, pointer. Don't look at me, look at your thumb.\" She came over and took the pages from him and looked at them, which he hadn't expected, and handed them back. \"That's very neat. Where do I keep it?\"<\/p><p>\"On the wall.\"<\/p><p>\"And when the Nguyens text me at ten at night from a restaurant, do I get up and go out to the garage to look at the wall?\"<\/p><p>He didn't say anything.<\/p><p>\"Come here.\" She went to the Clavinova, where the planner lay open. It was a paper week-at-a-glance, the kind the drugstore sold in January, and it was in pencil, every line, with erasures gone gray where the same square had been used three times. Her phone lay next to it with Venmo open. \"This is the system,\" she said. \"The planner is what's true. Venmo is what's paid. The texts are what people think happened. And the board is what I owe, when I remember to write it.\"<\/p><p>She turned back a page with her thumb and there was Tuesday, August 29, with a line drawn through it and, in the corner of the square, small: <em>cr. Aguilar 45. Nguyen 45. Ortega 45.<\/em> Seven of them.<\/p><p>\"It's in the planner,\" she said. \"It didn't make it to the phone. I do the requests on the first from the planner, and the first was a Friday, and I did them at the kitchen table, and the planner was out here.\"<\/p><p>\"Okay,\" Nate said. \"So the credit's somewhere. It's just not somewhere anyone can see.\"<\/p><p>\"I can see it.\"<\/p><p>\"And it says forty-five.\"<\/p><p>\"The sheet's from before I raised the rate. I've been meaning to retype it.\" She said it the way people say they've been meaning to floss. \"You want fifty-two. You'll get a Saturday, which is worth fifty-two, and I'll erase the forty-five.\"<\/p><p>She went to the whiteboard and erased <em>Patel Sat 12:30??<\/em> with the side of her hand and wrote <em>Aguilar Sat 9/16 12:30<\/em> in the space. She didn't erase anything in the planner. Nate looked at the board while she did it. In full, it was worse than he'd remembered. Thirteen names now, three with numbers, two with question marks, one with an arrow to a Saturday that had been crossed out and rewritten. At the bottom, under <em>juice<\/em>, someone had added <em>ask Nguyen re: May<\/em> and then, later, in a different green, <em>???<\/em><\/p><p>Trish Nguyen came in at 4:55 with a boy about nine, five minutes early for the five o'clock, and stood in the door with her keys in her hand.<\/p><p>\"Yolanda, sorry, real quick. That May credit.\"<\/p><p>\"You're fine,\" Yolanda said, without looking up from Lucy's thumb. \"Take the twenty-third at ten. Saturday.\"<\/p><p>\"You're sure? Because Mike—\"<\/p><p>\"I'm sure. Ten o'clock. Write it down.\"<\/p><p>Trish wrote it down, on her phone, and looked relieved, and sat in the other folding chair. Yolanda didn't write it anywhere. When Lucy's half hour ended and she was gathering her book, Yolanda said to Nate, low, at the door, \"It's easier than the conversation,\" and he wasn't sure if it was an explanation or an apology, and he was sure she didn't care which.<\/p><hr class=\"break\"><p>The text came Tuesday at 8:52 p.m., after Lucy was down. <em>Meetup done. Come get me.<\/em><\/p><p><em>It's four blocks to the station,<\/em> Nate wrote.<\/p><p class=\"note\"><em>I know where the station is dude. Come get me.<\/em><\/p><p>He told Claire, who was reading in the bath with the door open, that he'd be forty minutes. She said to bring back milk if anywhere was open. The Civic started on the second try, which it had been doing since July.<\/p><p>Devin was on the sidewalk outside the coworking place on Castro Street with a tote bag that said something about a conference, and he got in and said, \"Honestly? That was great. Twenty people. A guy who does invoicing for dog walkers. Three thousand a month. From dog walkers.\" He was talking fast, the way he did after a beer and a room full of people. \"You'd have hated it. Everyone talked about themselves. You'd have hated it and it would've been good for you.\"<\/p><p>Nate drove the four blocks. The next northbound was twenty-five minutes out; the board said so. They sat on the bench on the platform in the warm dark with the diesel smell from the last train still on the air and the lights of the Castro Street restaurants across the tracks.<\/p><p>\"So the spreadsheet,\" Devin said.<\/p><p>\"She said no.\"<\/p><p>\"Good.\"<\/p><p>\"She showed me the system instead. It's a planner, a phone, a group text, and the whiteboard. Four places. Nothing agrees with anything. She gave a woman a free Saturday tonight so she wouldn't have to argue about May.\" He heard himself. \"She gave us one too.\"<\/p><p>\"Okay, so.\" Devin turned on the bench. \"You know what every thread says. Before you build anything. Talk to users. Twenty of them. Ask them what they do. You've got one, and you've got her group text, and there's a Facebook group for these people, there's always a Facebook group. You could do twenty interviews in a month.\" He shrugged. \"I never did that part. That's my whole problem. I did the fun part twice and I never did the boring part.\"<\/p><p>\"Which part's the boring part?\"<\/p><p>\"All of it. Interviews. Invoices. Collecting the money. Chasing people.\" He said it lightly.<\/p><p>Nate watched the signal down the track. He hadn't planned to say it and it came out flat.<\/p><p>\"My dad ran a landscaping business. In Gilroy. Twenty-three years. Somebody didn't pay him once, a big job, and he sent them the invoice again and that was it. That was the whole collection process. The business was gone a year later.\"<\/p><p>Devin was quiet, which he was rarely.<\/p><p>\"How much?\"<\/p><p>\"I don't know. I was at Pixelbridge. He didn't talk about it.\" Nate looked at the tote bag. \"Enough.\"<\/p><p>\"Jesus, man.\"<\/p><p>\"Yeah.\"<\/p><p>The train's horn came from the south, long and then short. Devin stood and got the bag onto his shoulder.<\/p><p>\"Twenty interviews,\" he said. \"Don't build anything.\"<\/p><p>\"I'm not building anything. I made a spreadsheet.\"<\/p><p>\"That's how it starts.\"<\/p><hr class=\"break\"><p>Saturday at 12:30 he sat in the folding chair for the makeup, which by now he thought of as the forty-five dollars, and watched Lucy play \"Hot Cross Buns\" all the way through, twice, and get a sticker for it, a whale, because Yolanda had asked the first week what she liked and had apparently gone to the drugstore.<\/p><p>The thirteen names were still on the board. <em>Aguilar Sat 9/16 12:30<\/em> had a line through it now. Nobody had touched <em>cr. Aguilar 45<\/em>, he was fairly sure, in the planner.<\/p><p>At the door, with Lucy already out on the driveway counting the neighbor's cats, he said, \"Could I ask you some questions sometime? About how you run this. Not the spreadsheet. Just how it works. The credits, the texts.\"<\/p><p>Yolanda looked at him the way she'd looked at the staple.<\/p><p>\"Why?\"<\/p><p>\"I'm curious.\" It was true, as far as it went, and he felt her hear that it didn't go all the way.<\/p><p>\"You can ask,\" she said. \"I charge fifty-two dollars a half hour.\"<\/p>", "words": 1867}, {"num": 3, "title": "Gilroy", "part": 0, "meta": "Sunday, September 24, 2023 · U.S. 101 and Gilroy", "html": "<p>The stain on the hallway ceiling was the size of a dinner plate. At Easter it had been the size of a saucer.<\/p><p>\"It's not doing anything,\" his mother said from the kitchen doorway. \"It's September. It hasn't rained since March.\"<\/p><p>\"It'll do something in November.\"<\/p><p>\"Then we'll talk in November.\"<\/p><p>Rosa Aguilar was sixty-one and had run the front office of Uvas Middle School for twenty-two years, which meant she had spent twenty-two years telling other people's children to sit down and wait, and she did not, as a rule, lose arguments about timing. Nate went out to the garage anyway and got the ladder. It was his father's, aluminum, with AGUILAR in black marker down one rail in case a crew left it at a job, which they had, twice. He carried it around the side of the house past the orange tree his mother had planted the year they moved in, and set it against the eave, and Lucy came out of the back door at a run to hold it.<\/p><p>\"Grandma says you'll fall.\"<\/p><p>\"Grandma says a lot of things.\"<\/p><p>\"She says you fell off a truck when you were fourteen.\"<\/p><p>\"Thirteen. Hold the ladder.\"<\/p><p>The roof was composition shingle, twenty-seven years old, and from the top of the ladder he could see what the ceiling had been trying to tell her. The shingles above the hall had curled at the corners like old book covers, and where the vent pipe came through, the metal collar had lifted and the tar somebody from her church had troweled on last spring had cracked and pulled back from it in a ring. He put his weight on the decking beside the pipe. It gave, a little. Not much. Enough.<\/p><p>From up there he could see the whole street. Nine ranch houses on each side, the same three floor plans, most of them painted since he was a kid and two of them not. A man he didn't know was mowing four doors down, and the smell came up to him, cut grass and two-stroke, and he stood on the ladder and breathed it in as he had every summer from thirteen to twenty-two and told himself the same thing he always told himself, which was that he hated the work and loved the smell and that both things were allowed.<\/p><p>\"Well?\" Rosa said from the yard. She had come out with Claire, who had a dish towel over her shoulder from helping.<\/p><p>\"It's the vent. The flashing's lifted and the wood under it's soft. It needs a roofer. Before the rain, it needs a tarp at least.\"<\/p><p>\"A tarp.\" His mother said it the way she'd have said <em>a helicopter<\/em>.<\/p><p>\"A tarp's a couple hundred dollars. I'll pay for it.\"<\/p><p>\"You already send me three hundred a month.\"<\/p><p>\"That's Dad's line. That's not the roof.\"<\/p><p>\"Ay, Nate. It's all the same account.\" She turned and went in. Claire looked up at him on the ladder and raised her eyebrows and went in after her, and Lucy said, \"Can I come up,\" and he said no, and she said, \"Then why am I holding it,\" and he didn't have an answer for that either.<\/p><hr class=\"break\"><p>She had made chile verde, and there was a stack of tortillas under a towel, and the radio on top of the refrigerator was tuned to the station his father had kept it on, low, so that Los Tigres del Norte came through the meal like a neighbor's television. Lucy ate three tortillas with butter and nothing else and told Rosa that blue whales had hearts the size of a car and that she could find middle C every time now, and Rosa said which car, and Lucy said a big one.<\/p><p>\"And the job?\" Rosa said to Nate. She asked it as she did every Wednesday on the phone, between the weather and Lucy.<\/p><p>\"Fine.\"<\/p><p>\"The insurance is still the same?\"<\/p><p>\"Still the same.\"<\/p><p>\"And they still like you?\"<\/p><p>\"Meets expectations.\"<\/p><p>\"What does that mean.\"<\/p><p>\"It means they like me.\"<\/p><p>Claire did not look up from cutting Lucy's tortilla into strips, which was how he knew she was listening. She had read the review, or the part of it he'd forwarded, and the part she hadn't read was four words long and sat in his chest at a slight angle.<\/p><p>\"And the stock.\" Rosa said the word carefully, the way she said <em>Wi-Fi<\/em>. \"The thing they gave you.\"<\/p><p>\"It's down. Everybody's is.\"<\/p><p>\"Down how much?\"<\/p><p>\"It's down, Mom.\"<\/p><p>Claire looked up then. It was the same answer he had given her in April. She had accepted it in April the way you accept a weather report. Now she held his eye for a second and went back to the tortilla, and he understood that the answer had been filed, and that she kept a file.<\/p><p>\"Well,\" Rosa said. \"You have insurance. That's what matters. Your father had a plan too. His plan was that people would do what they said.\"<\/p><p>Lucy, who was six and had no idea what had just happened, said, \"Grandpa's dead, though,\" and Rosa said, \"Yes, mija, that's why we're talking about him,\" and gave her another tortilla.<\/p><hr class=\"break\"><p>The banker's boxes were on the shelf over the workbench, four of them, in his mother's handwriting: AGUILAR LANDSCAPING 2010–13, 2014–17, HOUSE, TAXES. He had come in to put the ladder back and to find the card of the church man who'd done the tar, which Rosa said was in HOUSE. It was, with the deed and the water heater warranty and a Polaroid of the orange tree at two feet tall. He wrote the man's number on his hand.<\/p><p>He should have stopped there. He took down 2014–17 because it was the one next to it and because he was thirty-two and had never once opened it.<\/p><p>Invoices, carbon copies, pink and yellow, the kind from a pad. A rubber stamp with the company name and the address of this house. Bank statements with a rubber band gone brittle. Payroll for a crew of four in 2015 and six in 2016, and then four again in 2017, and then two. He turned the invoices over one at a time. Residential, residential, the Catholic school downtown, the outlets' east lot, residential. Most were stamped PAID in the corner in his father's blue.<\/p><p>The one under the payroll folder was three pages stapled and had no PAID on it. <em>Coyote Ridge Business Park, Phase II — landscape installation and 90-day establishment. Balance due: $38,000.00.<\/em> Dated May 2016. Across the top, in red, from a stamp he hadn't seen in the box until now: 2ND NOTICE.<\/p><p>Under it, folded in thirds, a sheet of the lined paper his father had used for estimates, with a paragraph in his father's handwriting on the outside fold, the start of an address. <em>Coyote Ridge Business Park, attn:<\/em> and then a name, and then nothing.<\/p><p>He did not unfold it.<\/p><p>\"That's the one,\" his mother said from the doorway. She had a bag of tortillas for them to take home and she stood holding it the way she'd held the ladder argument.<\/p><p>\"Thirty-eight thousand.\"<\/p><p>\"Two months of the crew, and the plants, and the water. He kept paying them. He said they'd pay.\" She came in a step. \"They were a big company. They had a lawyer. He had a truck.\"<\/p><p>\"Did he sue?\"<\/p><p>\"He sent it twice.\"<\/p><p>\"It says second notice. He asked twice.\"<\/p><p>\"That's the stamp asking.\" She said it flatly, without any weight on it, the way she said everything true. \"He'd rather lose it than ask twice himself. You know that. You're standing there with a phone number on your hand instead of on a piece of paper because you didn't want to ask me for a pen.\"<\/p><p>He looked at his hand.<\/p><p>\"And the letter?\"<\/p><p>\"He wrote it. He didn't send it. Put it back the way it was, I know where everything is.\"<\/p><p>He put the invoice back on top of the payroll and the letter under it, still folded, and the lid on the box, and the box on the shelf. His mother watched him do it.<\/p><p>\"The tarp,\" he said.<\/p><p>\"Think about it,\" she said. \"I'll think about it too.\"<\/p><p>He knew what it meant. It was the same thing he meant when he said okay.<\/p><hr class=\"break\"><p>Lucy fell asleep before the San Martin exit, her head against the window, a tortilla in her fist. Claire had the passenger seat back a notch and her eyes closed and was not asleep.<\/p><p>The traffic north was Sunday traffic, the outlets emptying, the fields on both sides cut down to stubble and the garlic smell mostly gone from the air until Morgan Hill, where it came back for a mile. Past Morgan Hill the valley narrowed and the hills came in on both sides, brown, and at the south edge of San Jose a green sign came up on the right with an arrow: COYOTE RIDGE BUSINESS PARK. NEXT RIGHT.<\/p><p>He had driven past it a hundred times. He had never once looked. He looked now. Three long tilt-up buildings the color of sand, a parking lot half full on a Sunday, and in front of them, along the frontage road, a strip of lawn a quarter mile long, edged, green in September, with young sycamores in a row, each with its stake and its ring of bark. Somebody was being paid to mow that. Somebody had put those trees in and stood there ninety days to make sure they took.<\/p><p>\"What,\" Claire said, without opening her eyes.<\/p><p>\"Nothing. A sign.\"<\/p><p>She let it go. They were past it. After a while she said, \"Your mother's roof.\"<\/p><p>\"She won't let me.\"<\/p><p>\"She lets you send three hundred a month.\"<\/p><p>\"That's different.\"<\/p><p>\"I know it's different. I'm saying she let you.\" She opened her eyes. \"What does a roof cost?\"<\/p><p>\"A tarp's a couple hundred. A roof's real money.\"<\/p><p>\"We have the house fund.\"<\/p><p>They called it that. It was a savings account with forty-one thousand dollars in it, named in 2019 for a house that had cost, on the street they rented on, $2.6 million the last time either of them had looked, which was why it had a name and not a plan.<\/p><p>\"It's not for that,\" he said.<\/p><p>\"I didn't say it was. I said we have it.\" She closed her eyes again. \"Talk to her in November, then. Since that's when it'll rain.\"<\/p><hr class=\"break\"><p>He carried Lucy in at 8:40 and she woke enough to say she'd found it every time, and he said he knew, and she was asleep again before he had her shoes off.<\/p><p>Claire ran a bath. He did the dishes from breakfast, which were the only dishes, because there was no reason not to. The number was still on the palm of his hand, smudged where he'd held the wheel. He copied it onto an index card from the stack on the table and then stood looking at the card.<\/p><p>The laptop was on the counter. He opened it and opened a blank document and looked at that for a while too. Then he gave it a name, because he couldn't leave a file without one, and the name he gave it was <em>Music teacher problems<\/em>.<\/p><p>Under that, he typed one line.<\/p><p class=\"note\"><em>Nobody knows who's owed what.<\/em><\/p>", "words": 1905}, {"num": 4, "title": "Questions", "part": 0, "meta": "October 2–14, 2023 · Alder Creek, Sunnyvale, and a Zoom window in Campbell", "html": "<p>Yolanda had written him into the planner. He saw it when he came in at 7:28, upside down on the Clavinova: Monday, the 7:30 square, in pencil, <em>Aguilar (N)<\/em>, with the same small check mark she gave the students who'd confirmed.<\/p><p>\"Sit,\" she said. \"Not there. There.\" She pointed at the piano bench. \"You paid for the half hour, you get the bench. The chair's for parents.\"<\/p><p>He sat on the bench with his back to the keys. She took the folding chair, which put her in his usual place and him in Lucy's, and he understood that this was deliberate and that she found it funny. The garage smelled of the last student's bubble gum. It was the first week of October and still warm enough that she had the side window open, and through it he could hear somebody's sprinklers ticking.<\/p><p>He had six index cards in his shirt pocket. He'd written the questions on them at lunch, one to a card, in the order Devin's threads said to ask them. The last card had one question on it that he had written and crossed out and written again.<\/p><p>\"How much of your week goes to scheduling?\" he said. \"Makeups, credits, the texts.\"<\/p><p>\"Ask my phone.\"<\/p><p>\"Roughly.\"<\/p><p>\"Nathaniel, I don't know. I teach Monday through Thursday two-thirty to seven-thirty and Saturday nine to one. That's the part I can count. The rest is in the cracks. I answer a text while the Ortega boy finds his page. I answered one at my son's birthday dinner in Sacramento and he took my phone and put it in his pocket.\" She folded her hands. \"Sunday I counted, because you were coming. Forty-one. Forty-one texts on a Sunday, and I don't teach on Sunday.\"<\/p><p>He wrote <em>41 texts Sun<\/em> on the first card.<\/p><p>\"What's the hardest part?\"<\/p><p>\"Parents.\"<\/p><p>\"Of the scheduling.\"<\/p><p>\"Parents.\" She waited to see if he'd push, and when he didn't she gave him a little more. \"The kids are fine. A kid's sick, fine. It's the ten o'clock text from the restaurant asking if they can move Thursday, and the ten-oh-five text asking if that means they lose the credit, and the ten-fifteen text from a different family who saw the first one and remembered they had a credit too. I don't have a credit. I have a whiteboard.\"<\/p><p>He wrote <em>10 pm texts<\/em> and <em>credit chain<\/em> and, under it, <em>whiteboard = memory<\/em>.<\/p><p>\"What have you tried?\"<\/p><p>\"A binder. 2015. A scheduling app, once, a woman in the association swore by it. Nineteen dollars a month for something that wanted me to enter every student's birthday. I lasted a month.\" Her mouth turned. \"And a spreadsheet, recently. A very neat one.\"<\/p><p>\"Would you pay for something that worked?\"<\/p><p>\"I paid nineteen dollars for something that didn't. Ask me a real question.\"<\/p><p>He turned to the last card. He had rehearsed it in the car so that it would sound like the other questions and not like what it was.<\/p><p>\"If the kids practiced more,\" he said. \"If there were something, an app, that got them to practice, and let you see that they had. Would that help?\"<\/p><p>Yolanda looked at him for a while.<\/p><p>\"Do I want them to practice more,\" she said. \"Sure. Every teacher since Bach wants that. Ask anybody, they'll say yes.\" She stood and went to the whiteboard and picked up the green marker and put it down again. \"But that's not what I want. What I want is to stop texting parents at ten at night.\"<\/p><p>He wrote both sentences, because she'd said both, one under the other: <em>wants them to practice more — \"sure, ask anybody\"<\/em> and <em>stop texting parents at 10 at night.<\/em> He looked at the card. The second line was about texting. The first line was about the thing he'd asked.<\/p><p>\"That's twenty-eight minutes,\" Yolanda said.<\/p><p>He had written the check that morning, fifty-two dollars, with <em>questions<\/em> on the memo line because he hadn't known what else to put. She took it and read it, front and back, the way she'd read the spreadsheet, and put it in the planner at Monday.<\/p><p>\"You'll get a receipt,\" she said. \"I'm a business.\"<\/p><hr class=\"break\"><p>The check cleared Friday. He saw it in the bank app at his desk: CHECK 1147, $52.00. He had half expected her to hand it back at Lucy's lesson, folded in thirds, as a joke neither of them would mention. She had deposited it Tuesday. It occurred to him that she'd been telling him something with that too, and he couldn't have said what, and he closed the app.<\/p><p>Kim Duong texted Thursday night, in full sentences, which he would learn was the only way she texted.<\/p><p class=\"note\"><em>Yolanda Beck gave me your number. I can give you fifteen minutes on Saturday at 9:45 at the coffee place on Alder Avenue. I have a student in Los Altos at 10:30, so your town is on the way. Please be on time.<\/em><\/p><p>Orchard Coffee on a Saturday was strollers and cyclists and Gail behind the counter in her Sun Microsystems fleece. He took the small table by the window with a drip coffee and his cards. Kim came in at 9:44 in a black puffer vest with a car key on one finger and found him without looking around, because he was the one with index cards.<\/p><p>\"Nate. Kim. I'm going to get a tea and then you have until ten-fifteen.\" She got the tea. She sat. \"Go.\"<\/p><p>She taught voice, forty students, from a studio in her parents' converted garage in San Jose, and she ran the Facebook group, which had four thousand one hundred members and which she described as \"a fire I put out on my lunch.\" She scheduled in Google Calendar and billed through a spreadsheet and Venmo and gave one makeup a year, in writing, and enforced it.<\/p><p>\"And every September I lose a family over it,\" she said. \"One, two. Fine. I'm not Yolanda. Yolanda gives away Saturdays like they're mints. She said you paid her.\"<\/p><p>\"She charges.\"<\/p><p>\"Good for her. What are you building?\"<\/p><p>\"I'm not building anything yet.\"<\/p><p>\"Sure.\" Kim looked at the cards. \"Ask.\"<\/p><p>He asked the cards. Time: \"Two hours a week, maybe, if you count the group.\" Hardest: \"Parents who think a text is a contract.\" Tried: \"Allegro. Nineteen a month. They called me to sell it. They still call.\" He wrote it all down. He was aware of the clock over the espresso machine and that he was saving the last card, the way he had with Yolanda.<\/p><p>\"If there were an app that got kids to practice,\" he said. \"That tracked it, so you could see. Would that be useful?\"<\/p><p>\"Sure. Yes. Definitely.\" She said it fast, all three, like a form she was initialing. \"Kids never practice. There's a couple of those already, I think. I've never used one.\" She looked at her phone. \"Okay. I'll give you five names. They'll say yes because I asked. Don't waste their time and don't sell them anything, and if this turns into something, you come to my workshop in August and you tell me first.\" She was typing while she said it. His phone buzzed with five names and five numbers and one line: <em>Dana Whitlock does Zoom. The rest are phone people.<\/em><\/p><p>\"Thank you.\"<\/p><p>\"Ten-twelve,\" Kim said, and took her tea with her.<\/p><p>He stayed at the table with the cards afterward. <em>A couple of those already.<\/em> He decided it meant the thing was real, that other people had seen it too, and felt the small lift of being right. Then he took the pen and went back to Monday's card, to Yolanda's two lines, and underlined <em>practice<\/em>. Twice. Two teachers now. The line under it, about texting, he left as it was.<\/p><hr class=\"break\"><p>He made the phone calls from the Civic, on the top level of the Halyard parking structure, where nobody parked because of the sun. The cafeteria was loud, and he didn't want to be heard, and he had not thought about why he didn't want to be heard.<\/p><p>Monday, a guitar teacher in San Jose named Hector, who said, \"Oh, yeah. Yeah. They'd use that.\" Tuesday, a flute teacher in Santa Clara named Ellen, who said she had two apps already that parents ignored and did not want a third, and then talked for eleven minutes about a family that had paid her in September for August. He wrote <em>no<\/em> on her card and <em>paid Sept for Aug<\/em> under it. Wednesday, a cello teacher in Los Gatos who said yes before he'd finished the question. Thursday, a piano teacher in Cupertino, Marguerite, who said her students practiced fine, thank you, what she couldn't do was get anybody to pay before the fifteenth, and did he have anything for that. He said he didn't. He wrote <em>no<\/em>. Friday, a drum teacher in San Jose, Jill, on a lunch break of her own, who said, \"Sure, if it's free,\" and he wrote <em>yes<\/em> and did not write the second half.<\/p><p>Thursday night, after Lucy was down, he sat at the kitchen table in his one dress shirt and met Dana Whitlock in a Zoom window. She taught violin in Campbell, twenty-eight students, from a room with a cat tree in it, and she was warm and tired and had a glass of wine just out of frame.<\/p><p>\"My students would love that,\" she said, when he got to the card. \"Love it. Anything with a streak. They're on their iPads anyway. Half of them won't woodshed unless somebody's watching, and I'm not in the house.\"<\/p><p>\"Woodshed?\"<\/p><p>\"Practice. It's a jazz word. You go out to the woodshed where nobody can hear you and you do it until it's not embarrassing.\" She laughed. \"The kids look at me like I'm a hundred.\"<\/p><p>He wrote <em>woodshed<\/em> on the card and put a box around it, for no reason he could have given.<\/p><hr class=\"break\"><p>Saturday afternoon, with Lucy at a birthday party at the pool and Claire at Costco, he built the spreadsheet. Eight rows. He typed the column headers with some care, because Devin's threads were clear that you wrote down what people said and not what you wanted them to have said: <em>Name. Instrument. Students. How they schedule. How they bill. Wants practice app (Y/N).<\/em><\/p><p>He filled it in from the cards. Yolanda got a <em>Y?<\/em>, because she'd said sure, and then the question mark, because of the rest. Kim, Y. Hector, Y. Ellen, N. The cello teacher, Y. Marguerite, N. Jill, Y. Dana, Y.<\/p><p>Five of eight. Six if you counted Yolanda, and he half did.<\/p><p>The cards had other things on them. <em>41 texts Sun. 10 pm texts. Credit chain. Paid Sept for Aug. Before the 15th. They still call.<\/em> He looked at those and at the headers and did not see a column they went in, and the light was going, so he left them on the cards and put the cards in a rubber band.<\/p><p>Claire came in at five with the Costco string cheese and a twenty-five-pound bag of rice they didn't need, and Lucy behind her with a goodie bag and pool hair. When the bags were in and Lucy was on the living-room floor sorting the goodie bag by color, he said it, because it had been in his mouth all afternoon.<\/p><p>\"I think I found it.\"<\/p><p>Claire was putting the cheese in the drawer. \"Found what?\"<\/p><p>\"The thing. For Yolanda. For music teachers.\" He heard that this was not a sentence. \"An app. For the kids, for practicing. So the teacher can see, and the parents can see, and—\" Claire had straightened up and was waiting, with the refrigerator open, the way she waited for a third-grader to finish a thought. \"Five out of eight of them said they'd want it.\"<\/p><p>\"Want what?\"<\/p><p>He started again. He got as far as <em>practice<\/em> and stopped, because the next part was going to be about credits and texts at ten at night, and he could not make it join.<\/p><p>Claire closed the refrigerator.<\/p><p>\"Tell me when it's one sentence,\" she said, and went to get Lucy out of the goodie bag.<\/p>", "words": 2042}, {"num": 5, "title": "Yes, Definitely", "part": 0, "meta": "October 16–28, 2023 · Sunnyvale, the Inner Sunset, and Quince Court", "html": "<p>Bea Nakamura kept a red pen for design docs and nothing else, and she had it in her hand when Nate came to her desk on Tuesday with a question about the retry queue. She answered the question in four sentences. He was still standing there.<\/p><p>\"There's something else,\" she said.<\/p><p>\"Can I ask you something that's not about the queue?\"<\/p><p>\"You can ask.\"<\/p><p>\"If somebody wanted to build something. On their own time. Not related to anything here—\"<\/p><p>\"Stop.\" She held the pen up between them like a crossing guard. \"Don't tell me what it is. Don't tell me what it's for. I don't want to know, and if you think about it for a second you'll figure out that you don't want me to know.\"<\/p><p>He thought about it for a second.<\/p><p>\"Read your agreement before you write a line,\" Bea said. \"The one you signed the week you started. It's in the HR portal under your name and nobody has read it since the day they signed it, including me, until I had a reason to.\" She lowered the pen. \"I'm not a lawyer. Neither are you. That's the whole point. Read it at home, on your own machine. And whatever it is, it doesn't live on anything with a Halyard asset tag on the bottom. Not once. Not to check email.\"<\/p><p>\"Is there something in it?\"<\/p><p>\"There's something in everybody's.\" She went back to the doc. \"I've watched it go badly twice. Once here. Go read.\"<\/p><hr class=\"break\"><p>Wednesday night he called his mother at eight, as he did every Wednesday, and she asked about the job and he said it was the same, and she said the ceiling was the same too and that she'd bought a bucket, which might have been a joke. Then Lucy was down, and Claire was in the bath with a mystery, and he sat at the kitchen table with his own laptop, the 2017 MacBook Pro with the sticker Lucy had put on it, and searched his personal email for <em>Halyard<\/em>.<\/p><p>It was there, from August 2017. <em>Welcome to Halyard! Your signed documents are attached for your records.<\/em> He had never opened the attachment. He remembered signing: at a Pixelbridge desk at lunch, on a screen that said <em>Sign here<\/em> in yellow, eleven times, and he had signed eleven times because the offer was good and the insurance was better and he was twenty-six.<\/p><p><em>Employee Proprietary Information and Inventions Assignment Agreement.<\/em> Nine pages and two exhibits.<\/p><p>He read it the way he read a spec, slowly, once through and then back. Section 3 said that he assigned to the Company all his right, title, and interest in any Invention he conceived or reduced to practice during his employment. All of it. He read that and felt the back of his neck go warm. Then, at the bottom of the section, a paragraph in the same small type: <em>This assignment does not apply to any Invention that qualifies fully under California Labor Code Section 2870, notice of which is attached as Exhibit B.<\/em><\/p><p>He went to Exhibit B. It was one page, in capitals at the top: LIMITED EXCLUSION NOTIFICATION. Under that, the law itself, or a piece of it, quoted.<\/p><p class=\"note\"><em>...does not require you to assign to the Company any invention that you developed entirely on your own time without using the Company's equipment, supplies, facilities, or trade secret information except for those inventions that either: (1) Relate at the time of conception or reduction to practice of the invention to the Company's business, or actual or demonstrably anticipated research or development of the Company; or (2) Result from any work performed by you for the Company.<\/em><\/p><p>He read it three times. <em>Entirely on your own time.<\/em> He looked across the kitchen at the work laptop, closed on the counter where he'd left it, the asset tag on the bottom. <em>The Company's equipment.<\/em> He got up and put the work laptop in his bag and zipped the bag and sat back down.<\/p><p><em>Relate to the Company's business.<\/em> Halyard sold software to companies that moved things through warehouses and onto trucks. His service took orders and put them in a queue and made sure the queue didn't lose them. A timer for a child at a piano did not relate to that. He turned it every way he could and could not make it relate. He noticed that he was relieved, and he noticed that the relief was doing some of the reading for him, and he made himself go back to the top.<\/p><p>Section 4 he had not expected. <em>Disclosure.<\/em> He agreed to promptly disclose to the Company, in writing, all Inventions he made during his employment, including any he believed qualified under Exhibit B, so that the Company could determine whether it agreed. There was a form for it. The form had a box for a description.<\/p><p>He looked at that for a while. The form was a sentence to HR that said <em>I am building something<\/em>, and then a conversation, and then a decision made by somebody who was not him. He read the section again to see if it said <em>must<\/em> or <em>should<\/em>. It said <em>agree to<\/em>. He left the form where it was.<\/p><p>Exhibit A was the last page. PRIOR INVENTIONS. Two boxes. <em>No inventions or improvements.<\/em> <em>See below.<\/em> Under the boxes, four blank lines, and under the lines his signature, from the yellow tab, dated August 14, 2017, 12:22 p.m.<\/p><p>Neither box was checked. He had signed a page that asked him a question and he had not answered it. He hadn't had anything to list in 2017, so it hadn't mattered, and it didn't matter now, and it bothered him the way an empty required field bothers anyone who has spent ten years building forms.<\/p><p>He took an index card from the stack and wrote on it:<\/p><p class=\"note\"><em>1. Never on the work laptop.<\/em><\/p><p class=\"note\"><em>2. Never on work time.<\/em><\/p><p class=\"note\"><em>3. Nothing near logistics.<\/em><\/p><p>He looked at the disclosure section one more time. A fourth line would have been an email. He let the card have three, and put it under the laptop's edge where he'd see it, and closed the PDF.<\/p><p>Claire came out in her robe with her hair up and her phone in her hand.<\/p><p>\"The three-ten came out,\" she said. \"The loan. First one since March of 2020. I'd forgotten what it looked like.\"<\/p><p>\"What does it look like?\"<\/p><p>\"Three hundred and ten dollars.\" She kissed the top of his head. \"I'm just saying it out loud so it's been said. Don't stay up.\"<\/p><hr class=\"break\"><p>Devin's apartment was on Ninth Avenue above a dry cleaner, a one-bedroom he had gotten in 2013 and would, he said, be carried out of. \"Twenty-four hundred. Rent-controlled. If I move I'm paying thirty-two for less.\" The N-Judah went past the corner every eight minutes and the whole building leaned into it a little. Nate had driven up 280 in the Civic, which had started on the second try, and had come off at 19th Avenue into fog so thick that he'd used the wipers, in October, and parked two blocks away, and it was 10:30 on Saturday morning and Devin was making coffee with a device that took four minutes and a scale.<\/p><p>The living room was a couch, a monitor, a Toledo Mud Hens cap on a hook, and a whiteboard. On the whiteboard, faded, were the screens of the fantasy football app, still. Devin saw him look at it.<\/p><p>\"I'm going to erase it today, in fact.\" He handed Nate a mug. \"Okay. So. Tell me the thing.\"<\/p><p>Nate told him. Eight teachers. Five yeses. A timer, a streak, a place for the teacher to leave a note. He laid it out the way he'd lay out a service: the kid opens it, hits start, plays, hits stop; the app remembers the days; the teacher looks at a list.<\/p><p>\"I was going to do it as a website,\" he said. \"Kid logs in on whatever they have. I can do that in a weekend. I've done that a hundred times.\"<\/p><p>\"Okay but hear me out.\" Devin put his mug on the whiteboard ledge. \"Who's the user?\"<\/p><p>\"The kid.\"<\/p><p>\"Where's the kid?\"<\/p><p>\"On an iPad, mostly. Dana said—\"<\/p><p>\"On an iPad. Is the kid going to open Safari and type your URL? The kid is six. Your kid is six. What does she do with an iPad?\"<\/p><p>\"Taps the whale.\"<\/p><p>\"She taps the whale. There's an icon, she taps it, it opens, it's hers. That's the whole thing. The App Store is distribution. Nobody finds a website. You put it on the store, there's a page, there's a search box, a parent types <em>piano practice<\/em> and you're there next to the other guys. You put up a website and you're a URL on a flyer in a garage.\" He picked up a marker. \"And notifications. 'Time to practice.' The streak. You can't do that from a website. Well, you can, and it's terrible, and nobody turns it on.\"<\/p><p>\"I don't know Swift.\"<\/p><p>\"You know Kotlin. Same brain, different accent. And I'll do the screens. I'm fast in SwiftUI, I did the whole football thing in it.\" He looked at Nate over the marker. \"Honestly, dude. I've seen your screens.\"<\/p><p>\"They're clear.\"<\/p><p>\"They're clear like a tax form is clear.\"<\/p><p>Nate drank the coffee, which was very good.<\/p><p>\"If something breaks on a website, I fix it and it's fixed,\" he said. \"If it's on the store, I fix it and then I wait for somebody at Apple to push a button.\"<\/p><p>\"It's a day. They do ninety percent in a day. It's fine.\" Devin was drawing already: a rectangle, a big number in the middle, a button. \"Three screens. Timer. Streak calendar. Teacher note. That's the MVP. We don't add a fourth thing until somebody asks for it.\"<\/p><p>\"I read my agreement,\" Nate said. \"The invention thing. From when we started.\"<\/p><p>\"Your what?\" Devin didn't stop drawing. \"I've never read mine. Halyard sells software to people who own trucks. Nobody at Halyard is going to want a piano app.\"<\/p><p>\"That's more or less what it says.\"<\/p><p>\"So there you go.\" He shrugged with the marker.<\/p><p>Devin's phone rang on the couch, and he looked at it and said, \"It's my dad, one sec,\" and took it into the bedroom, and Nate heard him through the door, slower than he'd been all morning: \"Hey, Pop. Yeah. Did you do the thing with the—okay. Okay. No, I'll call her.\" A minute. Then he was back, and fast again, and the whiteboard had three rectangles on it.<\/p><p>Nate looked at the rectangles. Distribution. He turned the word over. It sounded like the answer to a question he had not yet figured out how to ask, and Devin had said it the way Devin said everything, like it was already true, and he found that he wanted it to be.<\/p><p>\"Okay,\" he said, which usually meant he wasn't going to argue. Then, and it surprised him, \"Yeah. Okay. Swift.\"<\/p><p>Devin erased the football app.<\/p><hr class=\"break\"><p>Friday night he started the download at nine, after Lucy was down, and at 11:40 the icon appeared in the dock. The MacBook's fan had run the whole time, and the kitchen was warm with it. He had bought a course on Tuesday and watched two hours of a man in Austin explaining variables as if he'd never met one, and he had let him, because it was faster than skipping.<\/p><p>He opened it. <em>Welcome to Xcode.<\/em> A window with three choices. He chose the one that created a project, and the next screen asked him for a name, and the cursor sat in the box.<\/p><p>He typed <em>Woodshed<\/em>.<\/p><p>\"Nate.\" Claire, from the bedroom, not loud. \"Come to bed by one?\"<\/p><p>\"Okay.\"<\/p>", "words": 1978}, {"num": 6, "title": "Woodshed", "part": 0, "meta": "October 30 – November 19, 2023 · Quince Court, Foothill Expressway, Sunnyvale, and the Inner Sunset", "html": "<p>\"We're leaving at six-fifteen,\" Claire said. \"Whale or no whale.\"<\/p><p>\"Ten minutes.\"<\/p><p>It was 6:04 on Halloween. Lucy stood in the middle of the kitchen in a blue hoodie with a felt fin Claire had sewn onto the back over two nights and a tail that dragged, and she was explaining to no one that a blue whale was the biggest animal that had ever lived, bigger than any dinosaur, and that she was going to say so at every house. Claire had a flashlight and the good pillowcase. Nate had the laptop open at the end of the table and the timer running in the simulator on the screen, and the timer was wrong.<\/p><p>It had been wrong since Sunday. He'd paid Apple ninety-nine dollars on Monday night, on the credit card, for the right to eventually put the thing on a phone, and he hadn't mentioned it, and the timer had been wrong before and after. It counted fine while you watched it. If you locked the phone, or switched to anything else, and came back, it had lost time. A kid who put the iPad face down for a minute to turn a page lost the minute. He'd been reading about it at lunch for three days in the Civic, on his own phone, with the work laptop closed in the bag beside him.<\/p><p>\"Nate.\"<\/p><p>\"Go. I'll catch up. Two minutes behind you.\"<\/p><p>Claire looked at him with the flashlight in her hand and decided something and didn't say it. \"Quince Court first, then Alder Creek Road to the fog house. Lucy, say goodbye to your father.\"<\/p><p>\"Bye, Daddy. Blue whales have hearts the size of a car.\"<\/p><p>\"I know. Which car?\"<\/p><p>\"A big one.\"<\/p><p>The door closed. The house was very quiet with the fan of the MacBook in it.<\/p><p>He found it at 6:41. He had been counting ticks. Every second the app was awake it added one, and every second it was asleep it added nothing, and the fix was to stop counting and instead remember when the kid pressed start and subtract, which was ten lines and which he should have seen on Sunday. He typed the ten lines. He ran it. He locked the simulator's phone and made coffee and came back and unlocked it, and the number was right, and he sat and looked at the right number for what he thought was a moment.<\/p><p>It was 6:55 when he got his jacket. The street was full of small figures and parents with wine in coffee cups, and every porch on Quince Court had a bowl out, and Mrs. Halvorsen was in her doorway in a witch's hat handing out full-size bars. He didn't find them on Quince Court. He found them on Alder Creek Road, at the house with the fog machine and the plastic graveyard, Lucy coming down the walk with the pillowcase held in both arms like a baby.<\/p><p>\"You missed the fog house,\" she said. \"It has a fog.\"<\/p><p>\"I see that.\"<\/p><p>\"I told him about the whale. He said a T. rex could beat a whale and I said not in the water.\"<\/p><p>Claire had the flashlight pointed at the sidewalk. \"I told her you were coming,\" she said, not loud. \"Four houses in a row I told her. Then I stopped telling her.\"<\/p><p>He carried the pillowcase the rest of the way. Lucy said the whale thing at every house and got, by his count, three T. rex rebuttals, and at home Claire sorted the candy into piles while Lucy stood on a chair and supervised, and he did not open the laptop, and the ten lines sat in it, right, while he did the dishes instead.<\/p><hr class=\"break\"><p>The Civic died on Wednesday, the eighth, at the light at San Antonio on Foothill Expressway, in the last of the light, with a line of cars behind him that grew for the fifty-one minutes it took the tow truck to arrive.<\/p><p>He'd taken Foothill because 85 was stopped for a wreck, and he had been thinking about streaks, about whether a missed day should reset the count to zero or just leave a hole, when the engine stuttered and the dash lit up like a switchboard and everything went quiet except the turn signal. He tried it. Nothing, nothing, a click. He put the hazards on. A man in a landscaping truck pulled around him and then stopped, and got out, and helped him push it onto the shoulder. \"Two-thirteen?\" he said, and Nate said yes, and the man said, \"Miles?\" and Nate said a hundred and ninety. The man patted the roof the way you pat a horse and drove off.<\/p><p>The tow driver said the same thing with fewer words. The shop on El Camino called Thursday at 10:15. Timing chain. It had jumped, and what it had done on its way to jumping was the part that cost money, and the man on the phone said it kindly: \"You're looking at more than the car.\"<\/p><p>He called Claire at her lunch. He could hear Room 14 behind her, twenty-four voices at a low boil.<\/p><p>\"Then we buy a car,\" she said.<\/p><p>\"I know.\"<\/p><p>\"Saturday. I'll look tonight. Used, two or three years old, something that fits a car seat and a cello if she ever switches.\" A pause, a child's name said in the teacher voice, then back. \"It's eight or ten thousand down, Nate. From the house fund. Say it so I know you heard the number.\"<\/p><p>\"Eight or ten thousand. From the fund.\"<\/p><p>\"Okay. I'll look tonight.\"<\/p><p>He drove Claire's Civic to work Friday and she walked Lucy the mile to Arbor, and neither of them enjoyed it, and the ninety-nine dollars sat where it was on the credit card, small behind a number he'd had to say out loud because there had been no way not to.<\/p><hr class=\"break\"><p>The lot was on El Camino in Sunnyvale, between a mattress store and a pho place, and the CR-V was gray, a 2019 with forty-eight thousand miles, and it smelled, Lucy said from the back seat, like a hotel. Claire did the talking. She had three printouts and a number in her head, and when the salesman came back from the manager's office with a different number she said, \"No,\" in the voice, and he went back, twice, before the paper said what she'd decided on Thursday. Nate signed. He signed eight times, the way he'd signed for Halyard, and the last page said $8,000 down and $383 a month for five years, and he read that page twice.<\/p><p>\"That's a lot of piano,\" Claire said in the parking lot, and it was a joke, and she was tired, and he heard both.<\/p><p>He drove it home with Claire following in her Civic and Lucy in the back of the new one because she'd asked. At a light she said, \"Daddy, is this our car forever?\" and he said five years, and she said that was forever, and he said okay, it was forever.<\/p><p>The next Wednesday his mother asked if it was insured before she asked what it was.<\/p><hr class=\"break\"><p>The email came Monday at 8:02, before stand-up. <em>Organizational update.<\/em> Ben Sattler was moving to Denver to lead engineering at the office there. The Orders pod would report to Priya Venkataraman. Doug Ferrante thanked everyone for their flexibility.<\/p><p>Ben stopped at his desk at 9:10 with his laptop under his arm. \"Denver,\" he said. \"They asked. Apparently I'm a leader.\" He looked at the empty desk in the pod. \"You'll like Priya. She reads the docs.\"<\/p><p>Priya's first one-on-one was Thursday at four, in a room called Tahoe that had a window on the parking structure. It was raining. It had started around noon, the first real rain since March, and the whole building had a smell to it, wet concrete and the carpet, and out the window the top level of the structure where he ate lunch was shining and empty.<\/p><p>She had a notebook. She did not open her laptop.<\/p><p>\"Let me be direct,\" Priya said. \"I have read your last four reviews. They all say some version of 'could be more visible.' I would like to tell you what that means, since it appears no one has.\"<\/p><p>\"Okay.\"<\/p><p>\"It means that when a name comes up in a room you are not in, yours does not. Your work is good. I have read the retry design. Nobody who was not on this pod knows you wrote it.\" She turned a page in the notebook, though there was nothing on it he could see. \"Next year this company is going to be asked to do more with less. I don't know the shape of it yet. When it comes, the names that come up in rooms are the names that are safe. I would like yours to come up. That is my job, and I will do it, but I need you to send the design to the platform group yourself, with your name on it, by Friday.\"<\/p><p>\"I can do that.\"<\/p><p>\"Good.\" She closed the notebook. \"One more thing. I believe we have seen each other at Orchard Coffee on Saturday mornings.\"<\/p><p>\"We have.\"<\/p><p>\"I'm comfortable continuing not to.\"<\/p><p>\"Okay,\" he said, and she nodded once, and that was the meeting.<\/p><p>He texted his mother from the parking structure with the wipers going. <em>Is it raining there?<\/em><\/p><p class=\"note\"><em>There's a bucket in the hall. Don't start. Thanksgiving.<\/em><\/p><hr class=\"break\"><p>Saturday it rained again, and he drove the CR-V up 280 with the wipers he'd never used and found that the car did not care about the rain at all, which he was not used to. Devin had the whiteboard clean and the three rectangles redrawn, and by noon the timer was a ring that filled as the minutes went, blue, and the streak was a row of little suns instead of dots, and the number he had put in the center of the screen was gone.<\/p><p>\"Where's the number?\"<\/p><p>\"Kids don't want a number. Kids want the ring to close.\" Devin was on the couch with the laptop on his knees, moving faster than
