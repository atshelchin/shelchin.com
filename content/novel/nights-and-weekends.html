e car.<\/p>", "words": 1762}, {"num": 21, "title": "Scope", "part": 1, "meta": "October 1–19, 2024 · Quince Court, the Inner Sunset, Sunnyvale, and Arbor Elementary", "html": "<p>The thermometer on the kitchen window said 88 at ten o'clock on Tuesday night, inside, and Lucy was asleep on her mattress on the living-room floor in front of the box fan with the sheet kicked off, and through the wall Mrs. Halvorsen's window unit ran like a truck left idling in a driveway.<\/p><p>\"The portables were ninety-four at one,\" Claire said. She had a wet washcloth on the back of her neck and a stack of spelling tests she was not grading. \"Lorenz moved us into the library after lunch. Three classes on the carpet. Bernie read to sixty kids for an hour and I love him.\"<\/p><p>\"Is Mrs. Halvorsen's house cold?\" Lucy said, from the floor, not asleep.<\/p><p>\"One room of it.\"<\/p><p>\"Can I sleep in her one room?\"<\/p><p>\"No.\"<\/p><p>\"Why does she get a cold room?\"<\/p><p>\"Because she's eighty-two,\" Claire said, and Lucy accepted that, and was asleep.<\/p><p>The phone was face up beside the laptop. Bev Ostrowski had written at 9:31. <em>December recital is the 14th. I need a list. Who plays what, in what order, how long, and then I need to print it. Can it do that? Allegro does that.<\/em> Marguerite in Cupertino had written at six: <em>Does it do invoices yet? Fall billing is killing me.<\/em> The cello teacher in Los Gatos wanted to know who had which of his three quarter-size cellos, because a mother had returned one that was not his.<\/p><p>Eight requests since the church hall, in a note on the phone. He had answered every one of them <em>not yet,<\/em> and <em>not yet<\/em> had been going out since May, and he was aware, in the heat, that it had started to sound like a promise.<\/p><hr class=\"break\"><p>Wednesday the radio in the CR-V said 106 at the San Jose airport and that the old October record was 101, from 1987. He ate the burrito at his desk, because the roof of the structure was not a place a person could sit, and answered Bev from under the desk, <em>not yet.<\/em><\/p><p>The duplex was 91 when he got home. Friday night at nine the wind came around from the ocean and the kitchen dropped ten degrees in an hour, and Claire slept, and he sat at the table with the window open onto the sound of 85 and looked at the forty screens until 12:30.<\/p><hr class=\"break\"><p>He drove up 280 on Saturday at 8:30 into fog, and parked two blocks from Ninth Avenue, and the dry cleaner under Devin's apartment was open and steaming.<\/p><p>The whiteboard was clean. The fantasy football screens, faded to a ghost in a corner of it for three years, were gone.<\/p><p>\"I erased 2021 for you,\" Devin said. He had the coffee device going with the scale under it. \"You should feel something.\"<\/p><p>\"I do.\"<\/p><p>He had the prototype on the monitor and a green marker. \"Okay. What is version two.\"<\/p><p>\"Invoices.\"<\/p><p>\"Invoices.\" He wrote PAY in a box. \"What else.\"<\/p><p>\"Paying them. Through the page. The parent sees the number and the credit next to it, so there's nothing to argue with, and presses the button, and the money goes to the teacher.\"<\/p><p>\"To the teacher. Not to you.\"<\/p><p>\"Not to me.\"<\/p><p>\"Okay.\" A second box. \"Recital.\"<\/p><p>\"Two people asked.\"<\/p><p>\"Two people asked and it's a list with times on it, and it's on screen twenty-two already, it's gorgeous.\" A third. \"Library. Your cello guy.\"<\/p><p>\"That's one person.\"<\/p><p>\"It's a list with a date on it. It is the same table as the recital, dude, it's a thing and a kid and a day. You have the table, I have the screen, it costs nothing.\" A fourth. \"Repertoire.\"<\/p><p>\"Nobody asked for that.\"<\/p><p>\"Nobody asked for the cancel link either. Yolanda asked to stop texting at ten at night and you built her a link. Repertoire is the library with the cello taken out. Same table.\" He wrote it. \"And mine.\"<\/p><p>PARENT APP, in a fifth box, off to the right, with a bell drawn next to it.<\/p><p>Nate looked at the board. Nothing on it was free; he knew what a table cost, and <em>it's the same table<\/em> was a sentence he had said to himself about Saturdays in July, twice. The thing to say was that eight teachers had asked for one of the five boxes, and that Marcus had said <em>build it, you're going to<\/em> in a voice that meant <em>don't.<\/em> He had had the sentence on 280.<\/p><p>\"The invoices go first,\" he said.<\/p><p>\"They all go. That's what a version is. You ship a version, not a feature. Nobody writes a post about a feature.\"<\/p><p>\"Who's writing a post?\"<\/p><p>\"Somebody. Eventually. Me.\" Devin capped the marker. \"Look. Honestly. I've had two things on that board and zero people used them, because I built the idea and not the problem. You've got the problem. Sixty-one people pay you for it. I want to build one thing that a person uses. Don't make it a small thing.\"<\/p><p>The N-Judah went by under the window and the building leaned into it.<\/p><p>Nate took the marker. In the bottom right corner, small, he wrote SEND POLICY.<\/p><p>\"What's that.\"<\/p><p>\"Marcus. A button on the lesson that sends the page before the parent finishes canceling. He does it by hand.\"<\/p><p>\"Sure.\" Devin drew a box around it the size of a stamp. \"That's a Tuesday.\"<\/p><p>It stayed the size of a stamp. Devin drew lines between the five boxes, and at the top of the board, over a smear of something older, he wrote NOV 16 and circled it.<\/p><p>\"Six weeks. I've got nights and no pod, you've got five to seven in the morning. Six weeks is generous.\"<\/p><p>\"I think six weeks.\"<\/p><p>Devin tapped the smear. \"You know what was under that? October seventh. I wrote it in August. The parent thing was going to go out on its own, and then you sent me forty screens' worth of notes. So we're already late, which is great, because now nobody can say we're late.\"<\/p><p>His phone buzzed, and he put it face down.<\/p><p>\"Pop. He's fine. He asks about it now. I told him I've got a thing, and he asked what my cut was, and I said we shook on it, and he said, 'Shook.' Like it was a word he was going to have to look up.\"<\/p><p>Nate had a card in his shirt pocket. He knew it was there.<\/p><p>\"We'll write it down,\" he said.<\/p><p>\"Yeah. After.\"<\/p><hr class=\"break\"><p>At 11:40 that night, with the house asleep, he opened the payments company's site and found the part of it for companies that wanted other people to take payments through them.<\/p><p>The teacher would get her own account with the payments company, in her name, with her tax number and her bank, and the money for a lesson would go from the parent's card to her and never pass through him. His part was the page: the number, the credit beside it, and the button. He would be a door.<\/p><p>The form asked for the business, and he typed the LLC. Above it, on the account he had opened in June, his own name was still where the business's name should have been. He noticed. It was midnight. At 12:04 the page said <em>Enabled,<\/em> and he sent Devin the screenshot, and Devin, awake, wrote back <em>LETS GO.<\/em><\/p><p>Sunday morning Claire was at the table with the sheet open on her laptop and the coffee made.<\/p><p>\"How long is the thing with Devin.\"<\/p><p>\"Six weeks. The sixteenth.\"<\/p><p>\"Of November.\"<\/p><p>\"Before Thanksgiving.\"<\/p><p>\"The festival's Saturday,\" she said. \"You're on the ring toss at eleven, with me. I signed us up in August.\"<\/p><p>\"I'll be there.\"<\/p><p>She wrote nothing in the sheet. She closed the laptop and went to get Lucy up.<\/p><hr class=\"break\"><p>He sent Yolanda the teacher's half of it Thursday night, because she was first for everything, and she called Friday at 8:20 while he was at the table with the parent's half.<\/p><p>\"Nathaniel. There is a form on my screen that wants my Social Security number, my date of birth, and my bank, and it has your name at the top of it, and it is not you.\"<\/p><p>\"It's the payments company. The money goes to you, so they need to know you're you. I never see the number.\"<\/p><p>\"Then why does it say Fermata.\"<\/p><p>\"Because I opened the door. You walk through it.\"<\/p><p>\"That is not what a door is.\" A pause, with a television behind it. \"Hold on. I have to find a check.\"<\/p><p>It took fifty-five minutes. The routing number was on a check in a drawer she had not opened since Dale. The form wanted an industry and had no piano teacher in it, and she chose <em>Other education.<\/em> At 9:15 it said she was a business, and she said, \"I've been a business since 1994, but thank you,\" and then, before she hung up: \"The Ortegas. They'll get a page with the number on it.\"<\/p><p>\"With the credit next to it.\"<\/p><p>\"They'll argue with the number,\" Yolanda said. \"They've never once argued with a credit.\"<\/p><p>Saturday he sat down with the parent's half at nine, and looked at the clock at 11:40 and at 12:10, and got to Arbor at 12:35, and the ring toss was a folding table by the portables with Ruth Amsel behind it in a visor.<\/p><p>\"Claire's at the cakewalk,\" Ruth said. \"I've got this. I've had this since eleven.\"<\/p><p>Lucy had a cat's face painted on and had won an angel food cake in the cakewalk, and carried it to the car herself. Claire handed him the paper plates and said nothing at the festival, and nothing in the car, and at home she put the cake on the counter and said, \"Ruth's sixty-one,\" and went to change.<\/p><hr class=\"break\"><p>Tuesday the fifteenth the reminder Lena had watched him make came up on the phone at nine, and at lunch, on the roof, cool enough to sit in again, he paid the state $800 for existing. He told Claire that night, before the statement, which was the rule now, and she said, \"Eight hundred,\" and he said, \"For being a company,\" and she said, \"Okay.\"<\/p><p>That week she was at the far end of the table every night with black felt and a white belly, because Lucy had decided in September that a whale was for babies and an orca was a whale that ate things, and Denise had sent the old sewing machine down from Roseville. He was at the near end with the invoice page. Wednesday he said, \"I can do the fin,\" and she said, \"I've got it,\" and that was the whole exchange, and it was easy, and he noticed that the ease was the thing to notice.<\/p><hr class=\"break\"><p>Saturday the nineteenth Lucy was at Mia's, and the laundromat bag was on the bed at four in the afternoon, still warm, and they were folding.<\/p><p>Claire did the socks first. She always did. Lucy's soccer socks, the green ones, one into the other. He had the towels, which were his because they had no rules to them.<\/p><p>\"I applied to something,\" she said. \"I'll tell you when I know.\"<\/p><p>He had a towel in his hands. He knew where the something lived, in a tri-fold on a counter in July with a seal in the corner. The thing to do was ask. He could feel the question sitting exactly where the <em>no<\/em> had sat on the creek bed, and he could not get to it either.<\/p><p>He folded the towel in half, and in half again, and put it on the stack.<\/p><p>\"Okay,\" he said.<\/p><p>She matched two socks, and put them with the others, and did not look up.<\/p>", "words": 1967}, {"num": 22, "title": "Front Page", "part": 1, "meta": "October 21–31, 2024 · Quince Court and Sunnyvale", "html": "<p>The email came in at 2:05 on Tuesday morning, to the address that went to his phone, while he was at the table with the invoice page open and three lines on it unfinished since Thursday.<\/p><p class=\"note\"><em>Hi Nate. I'm going to close my account. I'm not going to teach after December. This isn't about the tool. I'm writing because you asked once what teachers actually do, and I thought you'd want the numbers.<\/em><\/p><p class=\"note\"><em>26 students at $52. That's $1,352 a week on paper, which is $5,400 a month on paper. In September I collected $3,890. The difference is lessons I gave back because somebody was sick, or had a tournament, or forgot, or I felt bad. Room rent in Tracy is $850. Insurance is $610. My accountant says to set aside a quarter for taxes. I am left with about $1,800 for a month of driving to a room to be told a kid didn't practice.<\/em><\/p><p class=\"note\"><em>The call center at the hospital starts at $24 an hour and has dental. I have eleven credits out that I want to honor through December. Is there a way to get them out in a list, so I have them after I close it?<\/em><\/p><p class=\"note\"><em>Thank you for the tool. It was the only thing that ever took my side. Joanne Whitcomb.<\/em><\/p><p>He had met her once, at a card table, in August; she had driven in from Tracy for it. He built the list by hand at 2:20, twenty-six rows and eleven credits, and sent it at 2:40 with four lines, and did not close her account, because she had said December.<\/p><p>At 2:55 he opened the notes page on the site, which had three help articles on it and had been read, in its life, by Bev, and started to type. He had her numbers, and seventy other teachers' numbers, and a thing he had known since a whiteboard in a garage in September of last year and had never once said in a sentence.<\/p><p class=\"note\"><em>A piano teacher with 26 students at $52 a half hour makes $5,400 a month on paper. I have now seen about seventy of these on paper. Nobody makes the paper.<\/em><\/p><p class=\"note\"><em>The difference is the lessons she gives back. A kid is sick, and she says of course. A family forgets, and she says next week. She has a policy on the wall in a page protector and has never once enforced it, because the only way to enforce it is to be the bad guy at ten o'clock at night, by text, to a parent she likes.<\/em><\/p><p class=\"note\"><em>So she eats it. Ten, twelve, fifteen lessons a month. That's her rent.<\/em><\/p><p>It was 4:10 when he stopped. He read it once and did not soften anything, which was new, and put a title on it that he would not have put on an email, <em>Why Your Kid's Piano Teacher Is Quietly Going Broke,<\/em> and pressed the button, and sent the link to Devin because Devin would care, and slept fifty minutes.<\/p><p>Joanne wrote at 7:30. <em>Thank you. That's what it is.<\/em> The page counter said 41 that day, and most of the 41 were him.<\/p><hr class=\"break\"><p>Devin's text came Thursday at 6:52 in the morning, from the train.<\/p><p class=\"note\"><em>posted it to hacker news. dont look. actually look.<\/em><\/p><p>He was on Alder Creek Road. At his desk at 7:30 the counter said 300. At 8:15 it said 2,000, and the number changed while he watched it, which it had never done. At nine Devin wrote <em>FRONT PAGE. #4. above a thing about rust.<\/em><\/p><p>Devin found him in the cafeteria at noon and was talking before he sat.<\/p><p>\"So it's a list. Programmers post links, programmers vote, the top thirty are the front page, and everybody who writes code in the English-speaking world looks at it twice a day and pretends they don't. Eleven years I've been on that site and never made the front page, and I put your thing up from a train and it went in forty minutes.\" He ate. \"Don't read the comments. Read the comments. It's the worst people you know being right about one thing each.\"<\/p><p>He read them on the roof, in the CR-V, with the engine off. A hundred and forty by one o'clock. A man with a spreadsheet who had computed what Joanne should charge. Four people who said she should use a Google form. A woman whose mother had taught piano in Indiana for thirty years and had died with a whiteboard. A man who said nine dollars was too cheap and a man under him who said nine dollars was too much for teachers. Someone who said the signup was broken in Firefox, which it was. A man in Ann Arbor who said his wife taught violin and that he had just signed her up for the year and that she would kill him.<\/p><p>He answered the Firefox one first, because it was true, and then the spreadsheet, plainly, and then he could not stop. He answered from the roof, and under the desk, and in the kitchen with the phone against the counter while Claire packed.<\/p><p>\"What's Hacker News?\" she said. She had Lucy's bag open on the table and was counting socks into it.<\/p><p>\"A website. Programmers post links, and vote on them.\"<\/p><p>\"Programmers.\"<\/p><p>\"Programmers.\"<\/p><p>\"Do programmers have kids in piano?\"<\/p><p>\"Some.\"<\/p><p>\"How many of them teach piano?\"<\/p><p>\"I don't know yet,\" he said, and she zipped the bag.<\/p><p>She had promised her mother the weekend in September, and he had said he would come, and Thursday night, with the counter at 21,000 and the signups at 380, he said the thing, and she said, \"I know. The thing.\" Friday at 3:30 she and Lucy left for Roseville in the Civic with the orca in a garbage bag on the back seat, so Denise could see the fin.<\/p><hr class=\"break\"><p>Friday the hosting company wrote to say that usage had exceeded the plan and that the difference, $84, would be on the next invoice. The checker he had built in September ran every hour through it all and found nothing wrong, because nothing was.<\/p><p>He sat in the duplex Saturday with the phone and the laptop and nobody to say a number to. The counter was at 34,000. The signups page, which had been sixty-one names he could have recited, was 640, and he read them the way he had once read Yolanda's group text, for the count. Company email addresses. <em>test.<\/em> <em>asdf.<\/em> A father in Seattle who did not teach anything and wanted to know if he could use it to make his son's teacher enforce her policy. Three recruiters, one from the company Bea had gone to, who had all loved the writing. A man from a firm on Sand Hill Road: <em>Loved the post. Quick call next week? We're spending time in the creator economy for educators.<\/em> He looked at that one a while, and did not answer it.<\/p><p>Of the 640, thirty-one had added a student. Two had paid, both the year, the violinist in Ann Arbor and a teacher in Raleigh whose brother wrote code.<\/p><p>Yolanda texted Saturday at four. <em>Andre sent me your thing. Andre works for the state. He said it like it was an accomplishment. Is it?<\/em><\/p><p class=\"note\"><em>Ask me Thursday.<\/em><\/p><p class=\"note\"><em>I'm asking now. Are any of them teachers?<\/em><\/p><p class=\"note\"><em>Two.<\/em><\/p><p><em>Then it's a very long program for two,<\/em> she wrote, and nothing else.<\/p><p>Claire came in Sunday at 8:40 with Lucy asleep in the back, and he carried Lucy in, and Claire stood in the kitchen with the keys still in her hand.<\/p><p>\"So?\"<\/p><p>\"Thirty-eight thousand people.\"<\/p><p>\"And?\"<\/p><p>\"Six hundred and forty signed up. Thirty-one put a kid in it. Two paid.\"<\/p><p>\"Two.\"<\/p><p>\"Two. Both the year.\"<\/p><p>She put the keys down. \"Nineteen came out of a church hall,\" she said, which was his line, off his card, and she had taken it. \"Mom asked where you were. I said working. She said, 'On a Saturday.' I said yes.\"<\/p><hr class=\"break\"><p>The retry document had been due to Priya at five on Friday, and it was Monday, and she stopped at his desk at 9:10 with her bag still on her shoulder.<\/p><p>\"The retry document.\"<\/p><p>\"Tonight.\"<\/p><p>\"It was due Friday.\"<\/p><p>\"I know.\"<\/p><p>She had one eyebrow up, which he had not seen before.<\/p><p>\"I read something on Thursday,\" she said. \"So did the pod. Raj printed it. I did not read the name on it, and I have not read the comments, and I would like you to stop reading them at this desk. The desk is the part I can see.\"<\/p><p>She went. He sent the document at 11:40 that night, and it was Monday.<\/p><hr class=\"break\"><p>The business account, Monday, on the phone in the car: the hosting company's line, $65 with the $84 beside it, and four lines up, from the fifteenth, the state's $800, in the same column. The card at the end of the month was going to say $665. He did that arithmetic once, in the car, and did not do it again.<\/p><p>He wrote it on the card Tuesday, under the other three lines. <em>St. Bede's: 22, 3. Forty emails: 2, 1. Grace: 61, 19.<\/em> And under those, <em>HN: 38,000, 700, 4.<\/em> Seven hundred by Tuesday; four by Tuesday, the fourth a teacher in Austin who had read it on her husband's phone. Sixty-one people in a room had made nineteen. Thirty-eight thousand had made four, and $84, and two hundred answers from a phone, and a document that was Monday.<\/p><p>Devin, Tuesday, on the train: <em>700 signups dude. SEVEN HUNDRED.<\/em><\/p><p class=\"note\"><em>4 teachers.<\/em><\/p><p class=\"note\"><em>700 is a number.<\/em><\/p><p class=\"note\"><em>19 came out of a church hall.<\/em><\/p><p class=\"note\"><em>ok but 700 is a number,<\/em> Devin wrote, and then, a minute later, <em>how's the invoice page.<\/em><\/p><p>He did not answer that one either.<\/p><hr class=\"break\"><p>Wednesday at 7:12 in the morning an email from Apple said his membership had expired. He had paid them ninety-nine dollars on the Monday before Halloween, a year ago, on the credit card, without saying so. On the roof at lunch he looked the whale up on his phone, and the store said the app was not available, and that was the whole of Woodshed: forty-one downloads in a week, about a hundred and twenty in its life, three people in February, one of them Lucy. He did not tell anyone, because there was no one it was news to. He thought about it anyway, for the length of the burrito.<\/p><p>The invitation came at 4:40 that afternoon, from Doug Ferrante's calendar. <em>All-Hands: Strategic Review. Tuesday, November 12, 10:00–11:30 a.m. Required.<\/em> Devin, from across the floor: <em>strategic review lol. thats the one with the chart.<\/em><\/p><p>Bea had said eight months, at the cake. May to now was five. He put the laptop in the bag and zipped it.<\/p><hr class=\"break\"><p>Thursday he was home at 5:20, forty minutes early, and Lucy was an orca in the kitchen, a whale that ate things, and told every house on Quince Court so, and he was at every house, with the phone buzzing against his leg and staying in the pocket. Mrs. Halvorsen said the fin was very good, and Claire said, \"Thank you,\" and did not say she had done it, and Lucy said, \"Mommy did it,\" which covered it.<\/p><p>At 9:30, with Lucy down and the candy sorted into piles she had rules for, he sat at the table with the card. <em>78. $665.<\/em> Seventeen in since September, four of them from thirty-eight thousand strangers, the rest from the church hall's stragglers and Kim's group and Bev, who told people.<\/p><p>He put the card under the coffee maker, on top of the one that said HN. The board in the Inner Sunset had said October seventh once and said November sixteenth now, and the invoice page had been open on this table for two weeks with the same three lines unfinished. He had answered two hundred strangers in eight days and had not answered Marguerite. The work laptop was in the bag by the door with an invitation on it for the twelfth.<\/p><p>Claire came in from the hall in her robe and looked at the card, and at him, and did not ask what any of it was. She turned off the light over the stove and went back down the hall, and he sat in the light from the laptop with the three of them in front of him, the seven hundred and the four, the sixteenth, the twelfth, and did not move the card.<\/p>", "words": 2099}, {"num": 23, "title": "Six Weeks", "part": 2, "meta": "November 1–18, 2024 · Quince Court, the Inner Sunset, Sunnyvale, and Persimmon Lane", "html": "<p>Claire turned thirty-four on a Saturday, and at 7:40 that morning he was standing in the kitchen with the laptop bag on his shoulder and a card Lucy had made, which said HAPPY BIRTHDAY MOMMY in six colors and had an orca on it, because the orca was still going.<\/p><p>\"Go,\" Claire said. She was in her robe with the coffee he had made. \"Mom's calling at five. Be back for that and I'll count it.\"<\/p><p>\"Four-thirty.\"<\/p><p>\"Say five. Then you can be early.\"<\/p><p>He was back at 4:50 with a box from Sun Wah, pineapple buns and a small cake Lucy had negotiated by phone at three. Claire looked at the clock and said, \"Early.\" Denise called at 5:02 and asked where he'd been, and Claire said, \"Here,\" and it was true for ten minutes.<\/p><hr class=\"break\"><p>Saturdays in November went like that: the drive, the stairs over the dry cleaner, the scale. They worked until four with the N-Judah going by under the window, and he drove home. The board did not change. NOV 16 stayed circled at the top of it and the five boxes stayed under it and nobody wrote on it again, because there was nothing left to plan. Devin did the parent side. It went on a phone's home screen now, from the browser, with the bell, and the bell rang, and every one of the forty screens went somewhere and came back. Nate did the money: the invoice, the number, the credit beside the number, the button, and the part underneath the button that no one would ever see, which took the parent's press and turned it into a charge on the teacher's account and listened for the answer. Devin's part was done on the ninth, and he said so, and showed Stan on a video call, and Stan said it looked like a real one. Nate's part was not done, and he said, \"Close,\" which was what he had been saying since the twenty-sixth of October.<\/p><p>\"Close is a word people use when a thing isn't done,\" Devin said, on the ninth, in the doorway.<\/p><p>\"I know what it's a word for.\"<\/p><p>\"I'm just saying I'm done. I've been done since Tuesday. I'm sitting here being done.\"<\/p><p>\"Sit there. It's a week.\"<\/p><hr class=\"break\"><p>Lucy's lesson was Saturday at nine now, before he left, which had been Claire's idea, and on the ninth he drove her to Persimmon Lane at 8:50 with the bag in the back and sat in the folding chair and looked at the invoice page on his phone while Yolanda took her through the hands-together part of a piece she had not practiced.<\/p><p>\"Who sits with you,\" Yolanda said, \"when you practice.\"<\/p><p>\"Nobody.\"<\/p><p>\"Nobody.\"<\/p><p>\"Mommy's grading. Daddy's always on the computer.\"<\/p><p>She said it to the keys, not to him, in the voice she used for facts, the way she would have said that the dog next door was brown. Yolanda did not turn around. She let a whole bar go by.<\/p><p>\"Then you sit with yourself,\" she said. \"Left hand. From the top.\"<\/p><p>He put the phone face down on his knee for the rest of the half hour and did not pick it up. At 9:32 he drove Lucy home and himself to the city, and the sentence rode with him to about Daly City, and then he was working.<\/p><hr class=\"break\"><p>The all-hands was in the big room on the first floor with the folding wall opened, and Denver on the screen, and Doug Ferrante at the front with a clicker and no jacket, which was a decision somebody had made for him. Nine hundred people, six hundred in the room. Devin was at the back by the door. Priya was in the second row with her hands folded on her knee, and she did not turn around once.<\/p><p>There was a chart. Devin had said there would be a chart. It had two lines on it, and one of the lines was flat, and the other one was not.<\/p><p>\"What we're undertaking,\" Doug said, \"is a strategic review of our cost structure, so that we can align our investment with the priorities where we have the right to win. I want to be clear that no decisions have been made. This is a process. We'll have more to share early in the new year, and in the meantime I'd ask everyone to stay focused on the work, because the work is what gets us through.\"<\/p><p>He said it for eighty minutes, in different orders, and took eleven questions, and answered each with the sentence about no decisions. Priya asked nothing. At 11:30 she stood, and walked past his desk on the way to Tahoe, and stopped, and said, \"The retry document was good,\" and went on, and he could not have said, an hour later, what her face had been doing.<\/p><p>Claire asked at dinner. Lucy was telling a long story about a girl named Harper and a hamster, and in the gap between the hamster and its consequences Claire said, \"So what was it.\"<\/p><p>\"They're going to lay people off after Christmas and they haven't picked who.\"<\/p><p>She put her fork down. Lucy said, \"The hamster's name was Peanut,\" and Claire said, \"That's a good name,\" and to him: \"When after Christmas.\"<\/p><p>\"They didn't say. Early in the new year.\"<\/p><p>\"Is it you?\"<\/p><p>\"There isn't a list yet. That's what the meeting was for. To tell us there isn't a list.\"<\/p><p>\"Lorenz has a spreadsheet too,\" she said. \"He's not saying either.\" She picked the fork up. \"Peanut. Then what happened.\"<\/p><hr class=\"break\"><p>The money code was done Friday night at 11:50, except for the part that was not, and he sat at the table with it while the house slept and the wall heater ticked.<\/p><p>What was left was the part nobody would see. A parent pressed Pay on her phone. The phone asked his server to charge the card. If the phone did not hear back in eight seconds, it asked again, because phones in driveways and school parking lots did not always hear back, and he had put the eight seconds in himself, on Wednesday, after seven years at Halyard watching orders die on worse networks than a driveway. He had written eleven pages for Priya in October about exactly this, about what a second try had to carry with it so that a warehouse did not ship the same pallet twice. Here the second try carried nothing. It was a press, and then it was another press, and his server could not tell one from the other and would not try to.<\/p><p>The right way was a number on every press, and a list of numbers on the server, and a rule that a number it had already seen got the first answer again and not a second charge. Forty minutes to write, he thought, and an hour to test properly, to make the phone lie and the network stall and the same press arrive twice and three times and watch what the account did. It was 12:50. He had been awake since five. Devin's dot had been green in the corner of the screen for an hour, waiting, and had written <em>??<\/em> at 12:31 and nothing since.<\/p><p>He wrote <em>retry test<\/em> on a card in the block letters he used for things he meant, and put it under the edge of the laptop, and pushed the code without the number on it at 1:04, and wrote Devin <em>done.<\/em><\/p><p class=\"note\"><em>DONE done?<\/em><\/p><p class=\"note\"><em>Done.<\/em><\/p><p class=\"note\"><em>dude. six weeks. we did SIX WEEKS.<\/em> And then: <em>seven. whatever. nobodys counting.<\/em><\/p><p>He was counting. It was the sixteenth. He closed the laptop at 1:10 with the card under it and slept.<\/p><hr class=\"break\"><p>They did not ship on the sixteenth. Saturday and Sunday went to the parts a version needed that were not the version: the help page, the note to teachers, the install on Devin's phone and on Nate's and on Claire's. She allowed it, holding the phone out to him with the screen already unlocked, and took it back with the bell on it, and looked at the bell, and said nothing. Devin wanted to press the button Sunday at midnight. Nate wanted the teachers to wake up to it Tuesday, with a night's sleep behind him and a workday between, and to press it himself from the table, and they settled on Monday at nine, which Devin called Tuesday in Toledo.<\/p><p>Monday he was home at 5:40 and at the table by six. Lucy had a reading log to sign, and he signed it without reading it, and she said, \"You have to <em>read<\/em> it,\" and he read it, and she watched him read it.<\/p><p>At 8:30 Claire came in from the hall with a plate. Rice and the chile verde from Sunday, a fork, a folded paper towel. She set it at his elbow, on the side away from the mouse, where the plates went. She did not sit. She looked at the screen, which had a button on it he had not pressed yet, and at him, and at the clock on the stove, and went back down the hall. The bedroom door did not close, and it did not stay open either.<\/p><p>At 9:02 he pressed it.<\/p><p>Nothing happened for a full minute, which was what nothing looked like when it was working. Then the note went, to every teacher, paying and trying: invoices and payments were on, the parent app, the recital planner and the libraries, what to do first. He wrote Marguerite in Cupertino separately, one line, <em>Yes. Now,<\/em> thirteen months after she had first asked, and she wrote back inside four minutes, <em>Finally,<\/em> and had a student in by 9:20.<\/p><p>Helen Pak in Fremont sent twenty-two invoices at 9:08. He watched them go, one row at a time, from the same page he had watched the texts on in September, and there was nothing on it that was red, and he thought, without meaning to, that this was the first thing he had ever shipped that moved money he would never touch, and that it had gone. Bev sent eleven. Carol Ng sent four and stopped. Yolanda sent nothing, because it was 9:30 and she would look at it in the morning, before her scales, and would call.<\/p><p>The plate was cold at 9:40, and he ate it cold, standing, with the list open.<\/p><hr class=\"break\"><p>The two rows were on the payments company's list at 10:20, when he went to look at the night's charges once before bed.<\/p><p>Fremont. <em>Helen Pak Piano.<\/em> $156, and under it $156, from the same card, at 9:14 and at 9:15.<\/p><p>He looked at them for a while. There was a card under the edge of the laptop with two words on it, and he knew the two words, and there was another explanation, which was a parent in a kitchen on a Monday night pressing a button she had never seen before, and seeing nothing happen, and pressing it again, which was a thing parents did. He could see her doing it. He could see the eight seconds. He could not, at 10:20, on the night, with the whole thing gone out clean and a workday in nine hours, see the difference between the two explanations, and he decided that he would see it in the morning, when he was a person who could.<\/p><p>He turned off the light over the stove at 12:40 and went down the hall, and the bedroom door was where Claire had left it.<\/p><p>By morning it was fourteen.<\/p>", "words": 1939}, {"num": 24, "title": "Refunds", "part": 2, "meta": "November 19 – December 7, 2024 · Quince Court, Sunnyvale, Gilroy, and Persimmon Lane", "html": "<p>At 5:50 on Tuesday morning the list had fourteen pairs on it, and he counted them twice, and then he counted the teachers, which was seven.<\/p><p>Helen Pak, three. Carol Ng, three. Bev, two. Diane Foyle in San Carlos, one. The violinist in Ann Arbor, two, at 6:40 and 7:05 her time, before he was awake. Marcus, one: <em>Tillman Brass,<\/em> $220, at 9:51 and 9:52. Yolanda, two, between 5:41 and 5:43 this morning, because she had sent invoices before her scales, and the Ortegas had paid theirs inside four minutes, twice.<\/p><p>Twenty-eight charges. Fourteen that should have been. $1,932 that should not.<\/p><p>He turned the Pay button off at 6:02. The bar from September came back across the top of every page, red this time, <em>Payments are paused while I fix a problem. Nate, Nov. 19,<\/em> and it was the ugliest thing on the site and he was glad to see it.<\/p><p>The money had gone from the parent's card to the teacher's account, twice, and the only refund button that existed this morning was inside the teacher's account, under her name. He was not going to write more money code at six in the morning on the same night's sleep.<\/p><p>Seven emails, then, the teacher's name at the top of each, the word <em>sorry<\/em> in the first line, and the same five steps: sign in to the payments company, find the second charge, press refund, press it again when it asks if you're sure, tell the family. Under the steps: that it was his mistake, that Pay was off until it wasn't, that the company would keep its fee on the refunded charge and he would send her that himself, and to reply with the word <em>call<\/em> if she wanted him on the phone. He sent the seven at 6:10, and at seven he drove to Sunnyvale.<\/p><p>Bev replied <em>call<\/em> at 6:14 and then called anyway, at 7:15, on Mathilda.<\/p><p>\"What do you mean I have to refund it? You took it.\"<\/p><p>\"The page took it. It went to you. It's in your account, Bev. I never see it.\"<\/p><p>\"Then what am I paying you for?\"<\/p><p>\"Nine dollars a month,\" he said, \"and this morning I don't know,\" and she was quiet, and then said, \"Send me the steps again, I deleted them,\" and he sent them from the structure.<\/p><p>Carol and Diane did theirs by eight. Yolanda did not write. Marcus texted at 9:30: <em>Jaden's mother. Twice. She called me at 6:15. She has never in her life called me at 6:15. Refunded it. Keeping the call.<\/em><\/p><hr class=\"break\"><p>He fixed it Tuesday night in the forty minutes he had known it was on Friday.<\/p><p>Then the hour he had not spent: he made the phone lie, and the network stall, and the same press arrive four times, and watched the test account take one charge and say <em>paid<\/em> four times, and ran it again, because once was a story and twice was a fact. He turned Pay back on at 11:25 and left the red bar up until morning, in case.<\/p><p>The company's note about the refunds came Wednesday, and it began <em>Dear Nathaniel Aguilar,<\/em> because the account still had his name over the LLC's, and he let it go.<\/p><p>The company kept 2.9 percent and thirty cents of every one of the fourteen second charges when the money went back. He worked it out by teacher on a card, sixty dollars and change across the seven, and sent each her share by Venmo with a note that said <em>the fee. I'm sorry.<\/em> Yolanda sent hers back inside ten minutes with <em>No,<\/em> and when he sent it again she called.<\/p><p>\"Nathaniel. I am not taking twelve dollars from a man with a child in my studio. Put it toward the child.\"<\/p><p>\"It's your money.\"<\/p><p>\"It's the Ortegas' money, and they have it back, and they were so pleased to have paid twice that they haven't argued once.\" A juice box opened on her end. \"Are you eating?\"<\/p><p>Marcus's came back the next morning with <em>Keep it. Buy the kid a taco.<\/em> Five of the seven kept theirs. It came to $41, and he wrote that on the card under <em>$1,932,<\/em> and it was the first money the thing had cost him that he had not chosen, and he looked at it longer than forty-one dollars deserved.<\/p><hr class=\"break\"><p>It rained Wednesday for the first time since April, the kind the radio had promised for a week and the ground had not believed. Claire came home at four with her shoes in a grocery bag. \"The lot's a lake. Lorenz had cones out.\"<\/p><p>Thursday it was still raining, and Helen Pak posted at 12:40 in Kim's group, and he read it in the CR-V on the roof of the structure with rain sheeting down the windshield.<\/p><p class=\"note\"><em>Three of my families were charged twice Monday night by the Fermata payments thing. I found out from a parent at 9:20, not from the developer. I had to refund them from my own Stripe account, and Stripe kept its fee, which he offered to cover, which is not the point. I have 22 students and I do not have time to be somebody's beta. This is why I don't trust one-man apps. I've canceled. I'm going back to my spreadsheet, which has never charged anyone anything.<\/em><\/p><p>He did not read the forty comments under it. He read Yolanda's, at 1:15, because Kim had liked it, and Kim did not like things.<\/p><p class=\"note\"><em>Helen. Two of mine, too. I'm not defending him; he did it. I'm correcting the record. He wrote me at 6:10 Tuesday morning with the steps and the word \"sorry\" in the first line, and by Wednesday he was trying to Venmo me the fee, and I sent it back. He played a wrong note and stopped and played the bar again. That's what you want. It's the ones who keep going that you can't teach. Your spreadsheet never charged anyone because it never collected anything either. Go well.<\/em><\/p><p>Helen's account said <em>canceled<\/em> at 12:38, two minutes before the post, with a note: <em>See group.<\/em> Twenty-two students. The first nine dollars, in June, at 6:11 in the morning. He had never met her. He had answered her one email in September inside an hour and had not written her since, because nothing had been wrong.<\/p><hr class=\"break\"><p>Friday night the rain was loud on the carport, and he had the draft open at 8:30, four paragraphs, and he hated all of them.<\/p><p>Claire came in from putting Lucy down, and pulled the other chair around to his side of the table, and sat.<\/p><p>\"Read it to me.\"<\/p><p>He read it. It said sorry three times and <em>I have no excuse<\/em> once, and in the third paragraph it offered everyone a free month.<\/p><p>\"Stop.\" She had the soft voice on. \"Tell me what happened. Not the email. What happened.\"<\/p><p>\"A parent pressed Pay. Her phone asked my server to charge the card, and if it didn't hear back in eight seconds it asked again. I wrote the eight seconds. I didn't write the part that says <em>this is the same press.<\/em> Monday night was slow, because everybody was looking at once, so for fourteen families the phone asked twice, and the server charged twice, and said yes both times.\"<\/p><p>\"Say that.\"<\/p><p>\"I did.\"<\/p><p>\"You said it to me. Say it to them. Say what happened. Say what you'll do. Don't grovel. They don't want a free month. They want to know you know what it was.\"<\/p><p>He deleted the free month, and two of the sorries, and <em>I have no excuse,<\/em> because he had one, and it was called eight seconds, and it was a poor one, and true.<\/p><p class=\"note\"><em>Subject: Fourteen families were charged twice on Monday. Here's what happened.<\/em><\/p><p class=\"note\"><em>When a parent pressed Pay, her phone asked my server to charge the card, and if it didn't hear back in eight seconds it asked again. I wrote that part and not the part that tells the server the second ask is the same one. For fourteen families in seven studios, it asked twice and I charged twice. I knew on Friday it was a risk and shipped anyway, because we were late.<\/em><\/p><p class=\"note\"><em>Every family has been refunded by the teacher, from her own account, and I have paid each teacher the fee the payments company kept. Since Tuesday night every press carries a number, and a press the server has already seen gets the same answer back and no second charge. I tested it the way I should have on Friday. If you'd rather not have me, reply with \"refund\" and December is yours. I'm sorry for the parents, and for the seven of you who had to give back money you never took.<\/em><\/p><p>She made him take out one more <em>sorry<\/em> he had not noticed, and said, \"Send it,\" and sat there while it went, at 9:35, to every teacher, in the rain.<\/p><p>Three said <em>refund.<\/em> Nobody else left. Kim wrote at 10:10, <em>Seen. I'm leaving Helen's post up.<\/em> He wrote back, <em>Leave it,<\/em> and she wrote, <em>I was going to.<\/em><\/p><hr class=\"break\"><p>Thanksgiving was at Rosa's, and the tarp on the back slope had held through three days of rain, which she reported as if the tarp had done it on purpose, and at 2:40, with the turkey out, he was in the CR-V in the driveway with Diane Foyle on the phone, because a parent in San Carlos could see the invoice and could not see the credit. He found it at 2:52: the app kept its own copy, from Sunday, and had not asked for a new one. He wrote it down to fix Friday.<\/p><p>Rosa was at the driver's window, in the apron and her house shoes, with the look.<\/p><p>\"You're on the phone in my driveway. At least be on the phone at my table.\"<\/p><p>He went in. He was on the phone at her table once, for a minute, and Lucy told the whole table that Daddy had a bell now, and Claire passed the beans.<\/p><hr class=\"break\"><p>The card on Saturday the thirtieth said <em>105,<\/em> and under it <em>$890.<\/em> Thirty-one in, in the month he had charged fourteen people twice: the church hall's last stragglers, Marguerite and two of her friends, six from Kim's group in the week after Helen. Three out, and Helen. He put it under the coffee maker with the others.<\/p><p>The emails ran forty a day the first week and twenty the second, a mother who had installed the app on the wrong phone, a father who wanted the bell off, Bev, four times, and on Sunday Claire sat down with the sheet and asked what a week of it was, and he told her, and she wrote it down.<\/p><hr class=\"break\"><p>Saturday the seventh he sat in the folding chair on Persimmon Lane while Lucy did the same piece, with the left hand mostly there now, and Yolanda said, \"That's a rest, not a hole. Count it,\" and Lucy counted it out loud, which was not what a rest was for either.<\/p><p>At 9:30 Yolanda walked them to the door. She had her hand on the frame, flexing the fingers without looking at them, and looked at Nate instead.<\/p><p>\"Nobody uses the recital thing, by the way.\"<\/p><p>\"Bev asked for it.\"<\/p><p>\"Bev used it. It put her cellos in alphabetical order. She did the program in Word, like a person, and printed it at the library.\" A car pulled up for the 9:30. \"Nobody uses it, Nathaniel. I'm telling you so you don't have to find out from a card.\"<\/p>", "words": 1947}, {"num": 25, "title": "What They Actually Do", "part": 2, "meta": "December 9–22, 2024 · Quince Court, Sunnyvale, twelve video calls, and Orchard Coffee", "html": "<p>He pulled the numbers Monday at 5:10 in the morning, before the coffee, because Yolanda had said <em>a card<\/em> on Saturday and he had heard it as an instruction.<\/p><p>Every press since April was in the database; he had kept them the way his father had kept receipts, without a plan for them. He asked it, teacher by teacher, what each had touched in the three weeks since the eighteenth, and wrote the answers on a card in the order they came.<\/p><p class=\"note\"><em>Cancel links: 100. Credits: 90. Invoices: 40. Recital: 3. Repertoire: 1. Library: 2. Parent app installed: 6.<\/em><\/p><p>Percent. Three percent of a hundred and five was Bev, and two teachers he had never heard from, and one who had put a recital in and taken it out. One percent was one person. Six percent of the families had a bell.<\/p><p>Forty for the invoices was real; forty was Carol and Marguerite and Helen Pak's twenty-two, and it was the thing seven teachers had been humiliated for, and it was worth it, probably. The rest of the board in the Inner Sunset was on the card in figures, three and one and two and six, and he had spent his Saturdays since October and a birthday on them, and Devin had spent every one.<\/p><p>Then he asked it the other thing, the one he had thought of on 880 in September and had not asked since.<\/p><p>Of the cancellation pages a parent had opened, how many had been opened before the six o'clock text for that lesson had gone? There was only one way a parent got the page before the text. A teacher had sent it. By hand. First.<\/p><p>Three hundred and eighty, since June. Thirty-one teachers.<\/p><p>He heard it then, at the table, in Marcus's voice and not his own: <em>I know what it does. I'm telling you what it's for.<\/em> In May he had laughed, one breath, in a hot car. In September he had nodded. Thirty-one people had been doing it with their thumbs for six months, copying a link out of one text into another at 7:40 on Friday nights, while he built a lending library.<\/p><p>He took a fresh card and wrote SEND POLICY on it in the block letters, and did not draw a box around it.<\/p><hr class=\"break\"><p>He wrote to twelve teachers that night, and did not call it research, and did not call it anything.<\/p><p class=\"note\"><em>Could I have twenty minutes on a video call this week or next? I want to understand how you actually use it, not what you'd like added. I won't be showing you anything.<\/em><\/p><p>Eleven said yes inside a day. Marcus said, <em>You asked me in May. Ask somebody who hasn't told you,<\/em> and Nate asked Dana Whitlock instead.<\/p><p>He had a card for each, and a spreadsheet with two columns and not three. The first column was one question, the same for all twelve: <em>Walk me through the last time a parent canceled.<\/em> The second was a heading he had not had in October of last year, and had needed: <em>Said without being asked.<\/em><\/p><p>Luis Serrano, Wednesday at seven, from the guitar room in Palo Alto with the amps behind him. \"The last one. Thursday. A dad, for Friday. He texted at nine, <em>hey, can we,<\/em> and I sent him the Friday page before he finished, and he opened it and took the Sunday slot. I've been doing that since June.\" A pause. \"Is that wrong? Am I supposed to wait for the text?\"<\/p><p>\"No.\"<\/p><p>\"Good. Because I'm not going to.\"<\/p><p>Diane Foyle, Thursday at lunch, from a car. \"Canceled? The Okafors, Tuesday, by the link, at seven in the morning, no words, and I have never loved a family more.\" She had a sandwich. \"Here's what nobody asked me. My parents don't install things. They click things. Three of them installed your app and two have asked me where it went. The rest click the text. And they ask me what the policy is, still, in December, and I send them a lesson page that isn't theirs so they can read it off the top. There's no page that's just the policy. There should be a page that's just the policy.\"<\/p><p>He wrote <em>page that's just the policy<\/em> in the second column and underlined nothing.<\/p><p>Carol Ng, Friday, from Mountain View, in nine minutes. \"Invoices. I turned them on the eighteenth and off Wednesday. Not because of the double thing. Because they argued with the number. Two families. They've never once argued with a credit. I'll turn it back on in January when I've forgotten.\" Then: \"The recital thing wanted me to type in all twenty-six kids. I have them in a list already. I have them in <em>your<\/em> list already. Why does it want them again?\"<\/p><p>Angie Reyes, Saturday, thirty-four minutes, of which four were the question, and she asked about siblings for the third time, and he wrote <em>siblings<\/em> in the second column and, under it, <em>3rd.<\/em><\/p><p>The violinist in Ann Arbor, whose husband had signed her up from a comment, said, \"There's a recital thing?\" and then, \"The link is the whole thing for me. If the link works I don't care what else it does, and honestly I'd rather it didn't.\"<\/p><p>Twelve, over ten days, at lunch in the CR-V and at the table after eight, and by the nineteenth the second column had eleven lines in it and four of them were the same line. <em>Where's the policy. My parents ask me.<\/em> Nobody said <em>recital.<\/em> Nobody said <em>repertoire.<\/em> Nobody said <em>app,<\/em> except to ask where it had gone.<\/p><hr class=\"break\"><p>Halyard in December was a building where nobody said anything. Priya was in Tahoe with the door closed more than it was open. Devin was in the cafeteria at noon with his laptop, and looked up when Nate came in, and said, \"Dude, the install screen. I've got a fix for the bell thing,\" and Nate said, \"Friday,\" because Orchard on Friday was where he had decided to say it, and not in a room with chicken tikka in it.<\/p><p>Joanne Whitcomb wrote on the fifteenth: <em>Last lesson Thursday. Close it after. Thank you for the list.<\/em> He closed it Friday morning, with eleven credits on it that she had honored to the last one, and it was the first account he had ever closed that he had not wanted to.<\/p><hr class=\"break\"><p>Friday the twentieth, 5:40 in the morning, at the table, a card.<\/p><p class=\"note\"><em>CUT: recital. repertoire. library.<\/em><\/p><p class=\"note\"><em>KEEP: links. credits. invoices (off by default).<\/em><\/p><p class=\"note\"><em>BUILD: a page per teacher that is just the policy. Public. No link needed. A page per family, no app, no login, from a link: schedule, policy, credits, open slots, invoice. Send Policy on every lesson.<\/em><\/p><p>Under BUILD he wrote <em>signed links.<\/em> He should have done that in April. He wrote <em>Feb<\/em> beside it and moved on.<\/p><p>He looked at the CUT line for a long time. Three tables. Devin had been right that they cost nothing to build, and wrong about what nothing cost.<\/p><p>Claire came in at 6:30 and read the card over his shoulder with her coffee.<\/p><p>\"Three percent.\"<\/p><p>\"Three teachers. Four if you count the one who took hers out.\"<\/p><p>\"And the app?\"<\/p><p>\"Six.\"<\/p><p>\"Devin's.\"<\/p><p>\"Devin's.\"<\/p><p>She read it again. \"When are you telling him.\"<\/p><p>\"Tonight.\"<\/p><p>\"Not at work.\"<\/p><p>\"Orchard.\"<\/p><p>\"Okay,\" she said.<\/p><hr class=\"break\"><p>He picked Devin up at the Mountain View station at 5:35, off the electric train, in the dark and the rain, and drove him the six minutes to Alder Avenue, and Gail was closing at six and gave them the window table anyway and said, \"Twenty minutes.\"<\/p><p>He put the card on the table, the one with the percentages, and then the one with CUT on it, and Devin read them both, and read the second one again.<\/p><p>\"You're cutting my app?\"<\/p><p>\"I'm cutting the recital and the two libraries. And the app, yes. The parent side goes to a page. No install. A link.\"<\/p><p>\"Six percent.\" Devin had not touched the coffee. \"It's been five weeks. It shipped the same night you charged people twice, and it's December, dude, nobody installs anything in December, they're buying toys. You're reading a number that isn't done being a number yet.\"<\/p><p>\"Diane's parents asked her where it went. Two of the three.\"<\/p><p>\"So that's a bug. I've got a fix for the bell thing. I told you Wednesday.\"<\/p><p>\"It's not the bell.\" He said it carefully. \"I asked twelve people what they do. Not what they want. What they do. They click the text. They want to read the policy without canceling anything. Nobody said app, except to ask where it went.\"<\/p><p>\"You asked twelve people.\" Devin looked out at Alder Avenue, at the rain on it. \"Forty screens. Every Saturday since the fifth of October. I did the bell at two in the morning on a Tuesday. I did the install on a train. I told Pop.\" He turned back. \"I told Pop we shook on it. He said <em>Shook.<\/em> Like that. And now I get to tell him what. That it was six percent?\"<\/p><p>Nate had a card in his shirt pocket. He knew what was on it, which was nothing.<\/p><p>\"I know.\"<\/p><p>\"You know.\" Devin picked up the coffee and put it down. \"So what was it for. The handshake. What's my cut of, exactly.\"<\/p><p>There was a sentence for that, or there were two, and they were opposite, and he could not say either one at the window table with Gail stacking chairs.<\/p><p>\"I don't know yet,\" he said, and Devin looked at him for a while, and nodded, and said, \"Okay,\" in a voice that was not the one Nate used it in, and stood up, and asked to be driven to the station.<\/p><p>They drove the six minutes in the rain with the radio off. At the curb Devin got out and leaned back in.<\/p><p>\"Send me the email. The one that tells them. Before you send it to them.\"<\/p><p>\"I will.\"<\/p><p>\"I'm in Toledo tomorrow. Phone works in Toledo.\" He shut the door and went up to the platform, and the electric train came in without a sound, and that was the last of him.<\/p><hr class=\"break\"><p>He wrote it Saturday morning at the table, in the form, and it was short. What was coming out, in February, and why, in the words the twelve had used. What was staying. What was new: the policy page, the family page from a link, the button. That the recital planner and the libraries had been built with care by a friend and used by very few, and that the few could have their lists back as a file, today, with a reply. He sent it to Devin at 10:40 with one line, <em>Tell me what to change.<\/em><\/p><p>He sent it to no one else.<\/p><p>Saturday went by. Lucy and Claire made a gingerbread house from a kit that did not hold, and Lucy ate the parts that fell, and said the house was for the orca, who had moved to the mantel. He looked at the phone at noon and at four and at nine. Devin's dot was gray, and then green for a minute at 7:10 Toledo time, and then gray.<\/p><p>Sunday the phone stayed on the counter, face up, where he could see it from the table, and he worked on the policy page with one eye on it. Denise called at five and Claire took it in the bedroom with the door closed. Lucy asked if Devin was coming for Christmas, which he had not done any year, and Nate said no, he was with his dad in Ohio, and Lucy said, \"Does his dad have a bell?\"<\/p><p>At 11:15 on Sunday night the draft was still in the sent folder with nothing under it, and the dot was gray, and it was the third night. He put the phone face down, and then face up, and left it.<\/p>", "words": 2007}, {"num": 26, "title": "Winter Break", "part": 2, "meta": "December 23, 2024 – January 1, 2025 · Quince Court, Gilroy, and the Kasprzaks' house", "html": "<p>The envelope had the seal on it, and it was thick, and Claire knew from the thickness before she had it all the way out of the box.<\/p><p>It was Monday, the first real day of break, 11:20, and Lucy was in the living room explaining to the orca why it could not come to Gilroy on Wednesday. Claire did not open it at the curb, because you did not open a thing in front of the class until you knew what your face was going to do. She opened it in the bathroom with the fan on.<\/p><p><em>Dear Ms. Aguilar: On behalf of the faculty of the Department of Teacher Education, I am pleased to offer you admission to the Master of Arts in Reading and Literacy program for the Fall 2025 term.<\/em> Classes began the last week of August. Tuition and fees were estimated at $14,000 per year for two years. She was asked to confirm her intent to enroll by April 1.<\/p><p>She read it twice. Then she did the arithmetic she had already done in November, in a cell of the spreadsheet she had colored gray so it would not look like a plan: two years of $14,000, and at the end of it the column on the salary schedule one to the right of hers, $3,400 a year more until she retired, and a rolling cart of decodables like Mrs. Adair's with her name on it. Owen Sato was in fourth grade now and still came to Room 14 on Fridays at lunch to read to her, because nobody had told him he could stop, and on the twentieth he had read two pages of a book about a dog without his finger. That was what the $28,000 was for.<\/p><p>She folded the letter along its folds and put it in the front pocket of her school bag, which hung on the hook by the door and would not be opened by anyone in this house before January 6, and went to tell Lucy the orca could ride in the back.<\/p><hr class=\"break\"><p>Denise arrived Christmas Eve at two, in the Camry, with a cooler packed in Roseville as if the Peninsula had no stores, and hugged Lucy first and looked at Nate over Claire's shoulder and said, \"Nathan,\" which she had called him since 2015 and which he had stopped correcting in 2016.<\/p><p>\"Denise.\"<\/p><p>\"You're home.\"<\/p><p>\"It's Christmas Eve.\"<\/p><p>\"Mm,\" her mother said, and carried the cooler in.<\/p><p>She had Lucy's room; Lucy had the air mattress on their floor and was thrilled about it in a way that would last until about eleven. Claire wrapped at the kitchen table after dinner, with the good scissors and a roll of reindeer paper she had hidden in the trunk of her car, where Nate did not go. Denise was in the bath with one of Claire's mysteries. Nate was at the other end of the table with the laptop, writing emails, with the face he used for things he did not want to send.<\/p><p>\"Who's that one to?\"<\/p><p>\"Bev. She used the recital thing. It's going away in February.\"<\/p><p>\"Does it say sorry?\"<\/p><p>\"Once.\"<\/p><p>\"Good.\" She cut a length of reindeer. \"Who else?\"<\/p><p>\"The cello guy in Los Gatos, about the library. The one teacher who put in a repertoire list. That's who used it.\" He did not look up. \"It's a strange thing to write. <em>The thing you asked me for is going away, and I built it, and I'm sorry, and here's your list as a file.<\/em>\"<\/p><p>\"You say that better than you say most things.\"<\/p><p>\"That's what Devin said. Two words.\" He turned the phone so she could see it, from that morning: <em>send it.<\/em> No capital letter and a period, which for Devin was a treaty. She had watched him not have that text for three days and had not asked, and let the not-asking go by, because there was a fire truck to wrap.<\/p><p>It was the first Christmas Eve in two years that he was at the table to take things away from people instead of to make them. She held the paper down, and he reached across without being asked and put his finger on the fold, and she taped it.<\/p><hr class=\"break\"><p>Christmas was in Gilroy, all four of them in the CR-V, Denise in the back with Lucy and the orca. The two grandmothers divided Rosa's kitchen without a word, one at the stove and one at the sink, and stayed that way until three, and Claire, who had shared a classroom with a para for nine years, did not interfere.<\/p><p>\"Ay,\" Rosa said to Denise, at the sink. \"Yours?\"<\/p><p>\"Mine had a boat.\"<\/p><p>\"Mine had a truck. Same truck.\"<\/p><hr class=\"break\"><p>Thursday Nate took Lucy to the creek trail, because the creek was running again and Lucy wanted to know whether it was deep enough for a whale, and Denise sat at the kitchen table with her coffee and waited about four minutes.<\/p><p>\"Did you tell him?\"<\/p><p>\"Not yet.\"<\/p><p>\"It came when?\"<\/p><p>\"Monday.\"<\/p><p>\"So you've had it three days.\"<\/p><p>\"I've had it three days, Mom. He's had his thing fourteen months.\"<\/p><p>\"You're counting.\"<\/p><p>\"I'm a teacher. I count everything. I have a spreadsheet.\" She had not meant to say the last part, and there it was, and her mother, who had spent thirty-five years finding things in people's mouths, did not even look pleased.<\/p><p>\"Show me.\"<\/p><p>She did not show her. She told her. There was a column on the household sheet now, since November, with the project's name at the top, because it had a name and she was being fair. Under it went what she could find and what he told her on Sundays with the sheet open: the hosting, $65; the texts; the $800 the state had wanted in October for the privilege of existing; and $41, which he had paid out of checking to five teachers because a payments company kept its fee on money that went backward, and which he had explained in one plain sentence the first time she asked. On the other side, the cards from under the coffee maker: $890 at the end of November. $1,190 at the end of December, if the card said what he said it would.<\/p><p>\"So it pays for itself.\"<\/p><p>\"Since about September. Not for him.\"<\/p><p>\"How many hours.\"<\/p><p>\"I stopped writing that down.\" She had not stopped. The note on her phone had a line for the twentieth of December, <em>10:40–1:10, Devin,<\/em> and nothing about asking, because she had asked, and he had told her. It was the first line in a year without the third part.<\/p><p>\"You're going to do it anyway.\"<\/p><p>\"Yes.\"<\/p><p>\"Then when you tell him, tell him it's a thing that's happening. Not a thing you're asking. It's a different sentence, and men hear the difference.\" She drank. \"Your father heard me ask for thirty years. Don't ask.\"<\/p><p>\"Mom.\"<\/p><p>\"I'm not saying he's Gary. I'm saying August is eight months. Say it in January.\"<\/p><hr class=\"break\"><p>Denise left Friday at ten, and by the time the Camry was out of the cul-de-sac Claire had decided.<\/p><p>She would give him until summer. Not spring; he had used spring, and it had turned out to mean something else. Summer, and she would say nothing to him about a date, and she would start the program the last week of August whether the thing was paying for itself or paying for him or paying for nothing. She thought this on the porch with her hand still up at a car that was already gone, and noticed that she had just set a date alone, in her head, and called it patience. She put her hand down. It did not change the date.<\/p><hr class=\"break\"><p>The Kasprzaks were the two-story rebuild at the end of the court, and every New Year's Eve since 2022 they had opened the garage for the kids and the kitchen for the adults. This year there was a projector in the garage and eleven children under it, Lucy and the Kasprzak twins and Rohan Venkataraman and the rest, watching something with a dragon.<\/p><p>Priya was in the kitchen. Claire had known she would be, because Arun worked with Paul Kasprzak at the payments company, and she had watched Nate work it out in the front hall when he saw Priya's coat, and had watched the two of them, at 9:30, say hello like people who had met once at a conference. Priya had a glass of wine she was not drinking.<\/p><p>By 10:40 Claire was by the drinks with Jen Kasprzak, who was explaining the twins' preschool waitlist, and Arun came over for ice. Arun was the talker of that marriage; she had met him twice and knew Rohan's swim times. He was two drinks in, or three, with the loose shoulders of a man at a neighbor's on a holiday, and he leaned on the counter and said to Jen, \"She's been asleep by nine every night since the tenth. I'm not kidding. Nine.\"<\/p><p>\"The tenth?\"<\/p><p>\"Board meeting. They approved a reduction. Priya's got a list she can't talk about, and she can't talk about it to me, which, fine, I'm just the guy who lives there, but she's got it in her head all day and she comes home and she's—\" He turned to include Claire in it, hospitably, and stopped, and she watched him arrive at her face and go backward through the last four sentences to find out what he had said.<\/p><p>\"You're Nate's—\"<\/p><p>\"Yes.\"<\/p><p>\"I didn't say anything.\"<\/p><p>\"You didn't.\" She heard how it sounded, and said it again more gently, because he had gone the color of the counter. \"Arun. You said she's tired. I have a mother. I know what tired looks like.\"<\/p><p>Arun took his ice and went, and did not go to Priya, and Claire stood with a cup she had forgotten she was holding and looked through the doorway into the living room, where her husband was standing by the window with a paper plate, listening to Paul Kasprzak explain where the creek had come up to in 2017, nodding, with his weight on one foot, the way he stood when he was interested and did not need to say anything.<\/p><p>He did not know. She watched him not know for a while. The board had met on the tenth, and it was the thirty-first, and he had spent the three weeks between cutting things out of his own project to build the right one, and somewhere in that building there was a list, and a woman asleep by nine who had made it.<\/p><p>She could take the plate out of his hand and walk him out under the string lights and say it, and Lucy would come out of the garage at midnight to a father who had been told.<\/p><p>She did not. She decided not to, on purpose, standing there, and she knew as she decided it that she was doing the thing she had watched him do for fourteen months, at the table, with the cards, and that it had a name in her house, and the name was his. It did not feel like his. It felt like hers. That was the part she had not expected.<\/p><p>At midnight the garage door went up and the children came out into the court yelling, and Lucy found her and then found Nate, and Nate put his hand on the back of her neck and said, \"Happy new year,\" and she said it back, and it was true.<\/p><hr class=\"break\"><p>They were home at 12:20. Nate carried Lucy in asleep and got her out of her shoes without waking her, which took three minutes, and which Claire watched from the hall.<\/p><p>When the bedroom door was mostly closed she took the letter out of the front pocket of the school bag and unfolded it under the light over the stove. <em>I am pleased to offer you admission.<\/em> April 1. The last week of August.<\/p><p>She folded it along its folds, and put it back in the bag, and turned off the light.<\/p>", "words": 2032}, {"num": 27, "title": "Fourteenth of January", "part": 2, "meta": "January 14–17, 2025 · Sunnyvale and Quince Court", "html": "<p>The invitation came at 8:40 with no title on it, thirty minutes, nine o'clock, a room on the first floor called Shasta that he had never been in, from a woman in People Operations named Tessa Brandt whose name he knew from the bottom of emails about open enrollment.<\/p><p>He looked at it for as long as it took to know, which was no time. Then he looked at the pod. Aaron had his headphones on. Bea's desk still had nobody at it. Tahoe's blind was down.<\/p><p>His phone went at 8:47. Devin.<\/p><p class=\"note\"><em>you too?<\/em><\/p><p class=\"note\"><em>Yes.<\/em><\/p><p class=\"note\"><em>mine's a video call at 9:15. im on the train. im going to get laid off on caltrain dude. between palo alto and california ave.<\/em><\/p><p>He wrote <em>I'm sorry<\/em> and deleted it, because it was the wrong thing to say to a man about to be handed the same folder, and wrote <em>Text me after,<\/em> and at 8:56 he walked down the stairs.<\/p><hr class=\"break\"><p>Doug Ferrante was in the room, with a jacket this time, and Tessa Brandt with a laptop and a folder, and a box of tissues on the table that someone had set down square with the edge.<\/p><p>\"Nate. Sit down. Thank you for coming.\" Doug had a page in front of him and did not look at it. \"I'm going to get right to it, because you'd want me to. As part of the strategic review, Halyard is reducing its workforce today by approximately twelve percent. Your role has been eliminated, effective today. I want to say clearly that this is not a reflection of your performance.\"<\/p><p>He had known for sixteen minutes, and it still arrived under the sternum, where the coffee was.<\/p><p>\"Okay.\"<\/p><p>\"Tessa's going to walk you through the details. I'll say one more thing first.\" The corporate thing went out of Doug's face for about a sentence. \"I read the retry document. All eleven pages. And I know who found the lock in May, and at what time. I'm sorry.\"<\/p><p>\"Okay,\" Nate said again, and heard it land as something other than what it was.<\/p><p>Tessa did the rest, from the page, kindly. His last day was today. His badge would stop working at the end of the meeting, and Facilities would bring his things down. In the folder was a separation agreement and general release: if he signed it, six weeks of base salary, and Halyard would pay two months of COBRA premiums for his family so that coverage continued without a gap. He had twenty-one days to consider it. Information about unemployment insurance was in the back. Did he have questions?<\/p><p>\"How many,\" he said. \"Here.\"<\/p><p>Tessa looked at Doug, and Doug said, \"I'm not able to get into site numbers today,\" and that was, in its way, a number.<\/p><p>It was 9:19. Doug stood and shook his hand, and it was a real handshake, and neither of them said anything else.<\/p><hr class=\"break\"><p>The turnstile at the bottom of the stairs beeped red at his badge, twice, with the little light, and he stood on the wrong side of it looking up at the second floor, where his bag was, and a photo of Lucy taped to the monitor, and understood that he was a visitor.<\/p><p>Through the glass of Tahoe, Priya was standing with her back to the window, on the phone, not sitting. She did not turn around. He did not wait for her to.<\/p><p>A woman from Facilities named Yesenia came down at 9:31 with his bag and a box, and said, \"I'm sorry, honey,\" and meant it, and checked his name off a list on her phone.<\/p><p>He carried the box up the ramp to the roof of the structure, where the CR-V was in the sun, and sat in it with the folder and did not start the car.<\/p><p>Seven pages. He read them once through and then back. Six weeks. Two months of premiums. A release of any and all claims, known and unknown. A paragraph about company property and confidential information. Twenty-one days. He worked the six weeks out in his head before he could stop himself, gross and then what would be left after the payroll people took what they took from money that was not a paycheck, and the second number was about twelve thousand, and it was a real number, and it sat on the dashboard next to the ones that were not real yet.<\/p><p>The phone went at 9:40. <em>done. 9:15 to 9:24. got off at mountain view. turning around. she had a slide.<\/em> Then: <em>280 is going to be full of us. drive careful.<\/em><\/p><p>Out the windshield the view was the one it had been at 12:20 every weekday since 2017: Mathilda, the light-rail wire, the hills behind Los Altos gone green since the rain. He had taken Marcus's first call here. He had done more of the real work of the last year in this parking space than at any desk in the building, and the space was what he would miss, and that was an embarrassing thing to know about himself, and he started the car.<\/p><p>Alder Creek Road at 10:15 on a Tuesday had nobody on it. He was home in eleven minutes, which was a number he had not known existed.<\/p><hr class=\"break\"><p>He texted Claire from the driveway. <em>It's me. Devin too. I'm fine. I'm home. Tell you tonight.<\/em> She would not see it until lunch, and at 11:50 she wrote <em>Okay. 3:10. I love you,<\/em> and then <em>Do NOT sign anything today.<\/em><\/p><p>At 12:10 the phone said: <em>46 at sunnyvale. 108 total. somebody in the alumni slack counted. 46 is 4 under the WARN number, which is 50, which is why nobody got 60 days. u think thats an accident.<\/em> He did not think it was an accident. He did not think it mattered what he thought.<\/p><p>He was outside Room 9 at 2:40 for the first time in his life, and Lucy came out with her backpack on both shoulders and stopped.<\/p><p>\"Why are you here?\"<\/p><p>\"I got done early.\"<\/p><p>\"With what?\"<\/p><p>\"With work.\"<\/p><p>She thought about it, and took his hand, and said, \"Can we get a pineapple bun,\" and they got a pineapple bun, and the after-school program had one fewer child that afternoon and did not notice.<\/p><hr class=\"break\"><p>Lucy was down at 8:20, after three chapters, because the day had been strange and she had noticed. Claire came out and pulled the other chair around to his side and sat and put her hands flat on the wood.<\/p><p>\"All of it,\" she said. \"Start wherever it starts.\"<\/p><p>It started in October of 2023 with $99 to Apple on a Monday, which she knew, and he said so, and she said, \"I know. Say it anyway.\"<\/p><p>So he said it. The $99, and the $300 for the first thing, and Halloween. Five to seven most mornings since March, and the Saturdays since October, and before that the nights, ten to one. $19 a month for the hosting and then $65 when the texts broke, and the state's $800 in October. About $5,600 had come in last year and about $3,500 had gone out, and the difference was $2,100, for the year, for the hours, which he had never added up and now did, roughly, out loud, and it was more than a thousand and he stopped there.<\/p><p>\"Keep going.\"<\/p><p>A hundred and forty teachers on the last day of December. $1,190 a month, if every one of them stayed, which they would not. The $6,000 for his mother's roof, moved from the house fund in a driveway with his back to the door before he said a word to her. \"You said you'd have agreed in four seconds. I know you would have. I didn't give you the four seconds. That's the part.\"<\/p><p>\"That's the part,\" she agreed.<\/p><p>The $41. Fourteen families. Helen Pak, whom he had never met.<\/p><p>Then the laptop, in order, without the sentence that had made it all right at the time. Wednesday, May 15, 12:20, at his desk with a burrito. Yolanda's Saturdays. Eleven seconds to pull the code onto a machine with an asset tag on the bottom, a six to a seven, pushed at 12:29. Bea had told him never, over a sheet cake. Priya had told him never, in a room with a window. He had written it on a card that was still under the laptop's edge, and done it anyway, and deleted it nine days later, and the push was still in a spreadsheet somewhere with his name and the tag, and the folder on the table had a paragraph about company property in it, and he did not know yet what it cost.<\/p><p>Claire had not said anything for a while.<\/p><p>\"And spring,\" he said. \"I told you if it wasn't working by spring I'd stop. It wasn't working. I didn't stop. I never said that either. I just started the other thing and let you find out which one it was.\"<\/p><p>That was all of it.<\/p><p>\"Okay,\" Claire said.<\/p><p>It was not his <em>okay.<\/em> It had a floor under it. He heard the difference and did not know what it was made of.<\/p><p>\"Is that everything?\"<\/p><p>\"That's everything.\"<\/p><p>\"Then go to bed. I'm going to sit here a while.\"<\/p><p>He went down the hall and lay in the dark, and she did not come in for an hour and ten minutes, and the chair did not make its sound, because she did not get up.<\/p><hr class=\"break\"><p>The call came Thursday at 10:15 in the morning, from a Sunnyvale number, and the woman on it said her name was Rachel Lindgren, that she was Associate General Counsel at Halyard, and that this was a routine call in connection with his separation; he was not in any trouble and did not have to talk to her.<\/p><p>\"Okay.\"<\/p><p>\"When an employee leaves, we review company-managed devices. Yours flagged one item. On May 15 of last year, at 12:20 p.m., a personal code repository was cloned onto your laptop. It was removed on May 24. The repository name was Fermata.\" She said it as if it were any word. \"I'd like to understand what that was.\"<\/p><p>He had had thirty-eight hours to decide, and it turned out he had decided on the roof.<\/p><p>\"It's a scheduling tool for independent music teachers. Cancellations and credits. I built it at home, on my own machine, on my own time, from October 2023. On the fifteenth there was a bug in my first customer's Saturday lessons, and I was at my desk waiting on a migration, and I pulled the code down and changed one character and pushed it. About eleven minutes. I knew I wasn't supposed to. I deleted it nine days later. That's all of it.\"<\/p><p>\"Did it use any Halyard code, data, or information?\"<\/p><p>\"No.\"<\/p><p>\"Does it have anything to do with supply-chain or logistics software?\"<\/p><p>\"Piano teachers.\"<\/p><p>A pause with typing in it.<\/p><p>\"Your manager provided a written statement yesterday. It says the project is a scheduling tool for music teachers, that it's unrelated to Halyard's business or to any work she is aware of, that to her knowledge it was developed on your own time, and that she instructed you in May not to use company equipment for it. It's a short statement. It's very clear. She wasn't required to write it.\"<\/p><p>He did not say anything for a second. Priya, in Tahoe with the blind down. Priya, whose priority date had not moved. A page with her name at the bottom, for him, with the list on her desk.<\/p><p>\"I'm also looking at your agreement from 2017,\" Lindgren went on. \"Your Exhibit A, prior inventions, has neither box checked. And there's no Section 4 disclosure on file for this project, which is what Section 4 is for. You could have sent us one paragraph in 2023 and had this conversation then, with a lot less at stake.\"<\/p><p>\"I read it. In October of '23. I decided not to.\"<\/p><p>\"I gathered.\" S
