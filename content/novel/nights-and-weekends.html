laire was in the doorway behind his mother. She was not looking at his hands. She was looking at his face.<\/p><p>He took the phone out of his pocket, because his hand did that, and looked at it, and put it back.<\/p><p>\"I can't,\" he said. Out loud, in the driveway, to his mother, with Gil's truck door open and Lucy still holding a ladder nobody was on. \"Not this year. I can't do twenty-two and I can't do half of it. Not with August. Not with July. I'm sorry.\"<\/p><p>Nobody said anything. Lucy let go of the ladder and it stayed up.<\/p><p>His mother looked at him from the porch for a long moment, with her arms still folded, and something in her face that he had seen once before, in the garage, over a box.<\/p><p>\"Good,\" Rosa said. \"Now you know what it's like.\"<\/p><p>She went in. The radio was on in the kitchen, on the station his father had kept it on. Claire stayed in the doorway and did not come to him and did not go in. He stood in the driveway with the phone in his pocket and the number said and nothing moved, and Gil came back with a sheet of paper and handed it to Rosa's empty chair.<\/p><hr class=\"break\"><p>He crossed May off the calendar on Saturday night, the last square, with the pen from the pad, and looked at what was left before he put it back under the coffee maker.<\/p><p>Thirty-one.<\/p><p>He put the pen back on the pad, squared to the edge the way she kept it. From the hall, without coming in, Claire said, \"Thirty-one,\" because she had been counting too.<\/p>", "words": 1986}, {"num": 35, "title": "The Line", "part": 3, "meta": "June 28 – July 12, 2025 · Quince Court, the Costco lot in Mountain View, and the Mountain View Caltrain platform", "html": "<p>Claire had set the table for it.<\/p><p>The pad in the middle, squared to the edge. His cards in a stack at his place. Her laptop at hers, open to the household sheet. Two pens, one pencil. It was Sunday, June 29, at 9:10, and Lucy was at the Reyeses' pool until noon, and he stood in the kitchen doorway and understood that the thing they had been doing standing up at the microwave since March had just been given a chair.<\/p><p>\"Sit,\" she said. \"This is a meeting now. It has a name. I wrote it at the top.\"<\/p><p><em>Sunday numbers.<\/em> Underlined once.<\/p><p>\"Closed months only,\" she said, and he put May on the pad, <em>340. $2,890,<\/em> and she wrote it. \"Now this morning, in pencil.\"<\/p><p>He said it. A little over three thousand one hundred. Eleven teachers on pause, with dates or without. She wrote all three numbers small, and looked at them.<\/p><p>\"Tuesday's the first.\"<\/p><p>\"I know.\"<\/p><p>\"You're going to be under.\"<\/p><p>\"By about three hundred. Unless nine people I don't know about pay on Tuesday.\"<\/p><p>\"Then Tuesday we'll know by how much.\" She capped the pen. \"And next Sunday we decide what it means. Not Tuesday. I'm not deciding anything at five in the morning off a screen, and neither are you, and that's the first rule of a thing with a name.\"<\/p><p>\"The card says—\"<\/p><p>\"The card says July first. I wrote it. It doesn't say July first at five a.m.\" She turned the pad around so the words faced him. \"Bring me something next Sunday besides the top line. You've had one number for six months, and it's a number a stranger could read off a chart. I want to know what you know that the chart doesn't.\"<\/p><hr class=\"break\"><p>He read it Tuesday night, not Tuesday morning, because he had decided on Sunday that the first of July would get its whole day, and at 9:05 p.m., with Lucy down and Claire in the doorway with her arms crossed, he opened the laptop at the table.<\/p><p>374 paying. $3,180.<\/p><p>Nine trials had ended on the first and paid, which was the kind of thing that happened on the first of a month, and he had not counted on it, and it had not been enough.<\/p><p>He did the subtraction on a card, and she watched him do it. Three hundred and twenty dollars short. He divided, and wrote <em>9.1%,<\/em> and turned the card so she could read it.<\/p><p>\"Nine percent,\" Claire said.<\/p><p>\"Nine point one.\"<\/p><p>She came and took the pen from the pad and wrote it under May, in pen, all of it: the date, the 374, the $3,180, the $3,500 beside it, and <em>−$320<\/em> beside that. Then she put the pen down.<\/p><p>\"Sunday,\" she said.<\/p><p>\"The card says I look for a job and take one.\"<\/p><p>\"I know what the card says. I wrote the card. Sunday.\"<\/p><hr class=\"break\"><p>Wednesday morning at 5:10 he pulled the numbers she had not asked for, the ones that had been in the database since April of last year and that he had looked at once, in December, and not since. It took most of the week. There were four of them by Saturday, on a card, in his own words, because she was not going to accept a percent sign as an answer.<\/p><p>The Fourth was pancakes at the fire station and a parade of bicycles, and Lucy's had streamers on it and a horse's name, and he clapped for it going past and did not check his phone, because there was nothing on it that would change Sunday.<\/p><hr class=\"break\"><p>She did not do it at the table.<\/p><p>They went to Costco Sunday at ten, as they did most weeks, and came out at 10:50 with the rotisserie chicken and the string cheese, and loaded it, and she got in the driver's side of the CR-V and did not start it.<\/p><p>\"Here,\" she said.<\/p><p>\"In the lot.\"<\/p><p>\"Not under the coffee maker. I don't want to do it with that page under the coffee maker.\" She had the pad. She had brought the pad to Costco. \"Read me the card.\"<\/p><p>He read it.<\/p><p>\"The house fund's fifty-six thousand four hundred as of Tuesday. That's from your sheet. The line was thirty-five hundred and we're at thirty-one eighty.\"<\/p><p>\"I have that. Read me the other card.\"<\/p><p>He took it out.<\/p><p>\"Of every hundred teachers who start the thirty days, forty-one pay. That's this year. Last year it was thirty-eight, and under one for the Hacker News week, which I left in the chart for two months because it looked good.\" He looked at the next line. \"The ones who stay are the ones who put five students in inside a week. Sixty-one of every hundred do that now. The ones who don't, mostly leave. I could tell you in seven days who's going to be paying in a year, and I've never once looked.\"<\/p><p>\"Go on.\"<\/p><p>\"Of every hundred who are paying in a month, two leave. A little over two. Last summer it was nearly three and a half, and that was the summer, and pauses aren't leaving, they come back.\" He turned the card over. \"A third pay for the year up front. Thirty-four of a hundred. Those are the ones who don't pause in June, because they've already paid for June. Yolanda did that in the first week. The Los Gatos woman did it at a card table. I've been pushing the year since August and I never once looked at whether it was working, and it is.\"<\/p><p>Claire had written none of it down. She was looking at him.<\/p><p>\"Which of those did you know in January?\"<\/p><p>\"None of them. I had one number in January.\"<\/p><p>\"Which one would have told me thirty-five hundred was wrong?\"<\/p><p>He thought about it, with the chicken going cold in the back.<\/p><p>\"The forty-one. If four in ten pay, and the ones who come in on their own from the pages and the free tool and Dolores are about sixty a month, then it was never going to be thirty-five hundred by July. It was going to be about this. I could have done that arithmetic in February. I didn't want to know.\"<\/p><p>\"No. I didn't want to know either. I wanted a number I could put in pen.\" She looked at the pad. \"The deal was the deal.\"<\/p><p>\"The deal was the deal. I'll write to Wen tomorrow. There's a recruiter from October. I'm not going to make you say it.\"<\/p><p>\"I'm not going to say it.\" She uncapped the pen. \"Then the line was wrong.\"<\/p><p>\"Claire.\"<\/p><p>\"I wrote thirty-five hundred in January off a hole. Not off any of this. I didn't have any of this, and neither did you, and I'm allowed to be wrong in pen, that's what the pen's for. Three more months. October first. Same card, new number, and I'll write the number when I've seen these four for twelve weeks, not before.\" She was writing as she said it. \"Every number, every week. Not every month. Every week, these four and the top one, and if one of them moves, I want to know why, in your words, before Sunday. And you tell me before you move money, not after. Anything. Not just the roof. If it's more than a tank of gas and it's not on the sheet, I hear about it first.\"<\/p><p>\"That's five lines. The card had one.\"<\/p><p>\"It's a meeting. Meetings have minutes. If you're under in October I don't want a card. I want a résumé. Say it back.\"<\/p><p>He said it back. Three months. Every number, every week. Before, not after. October first.<\/p><p>Then he said, \"Okay. Then here's one now.\"<\/p><p>She waited.<\/p><p>\"The Halyard shares. The purchase-plan ones, from before. There's about seven thousand there. I've been not selling them since January because the stock's down sixty from the top and I kept thinking—\" He stopped. \"They're not going back up. I've known that since March. I was going to sell them this week and tell you Sunday.\"<\/p><p>\"You were going to tell me after.\"<\/p><p>\"Yes.\"<\/p><p>\"Tuesday,\" she said. \"At the table. You show me the screen and then you press it. I want to watch you do it in the right order once, so I know what it looks like.\"<\/p><p>She started the car.<\/p><hr class=\"break\"><p>Tuesday, July 8, at 6:35 in the morning, she sat at the table in her robe with her coffee and he turned the laptop toward her. The brokerage page. Halyard's ticker and its small red number. A box that said <em>Sell all,<\/em> and under it an estimate: $7,040 and some cents.<\/p><p>\"That's it?\"<\/p><p>\"That's it. It settles tomorrow. It's in the account Thursday.\"<\/p><p>\"Go.\"<\/p><p>He pressed it. The page thought about it and said <em>Order placed,<\/em> and she wrote <em>+7,000<\/em> on the pad, and on Thursday, when it landed, the house fund said $63,400, and the recruiter's email from October sat where it had sat since October, unanswered, and he did not open it.<\/p><hr class=\"break\"><p>Devin came down on the 10:22 on Saturday, on one of the electric trains, and texted from the platform at Mountain View: <em>it doesnt smell like anything. i dont know how to feel about that.<\/em><\/p><p>He had an hour. The movers came Monday, the apartment on Ninth Avenue was going back to a landlord who had been waiting since 2013 for exactly this, and Devin was flying Tuesday with two suitcases and the Mud Hens cap on his head because it did not fit in either one.<\/p><p>They sat on the bench on the northbound side. It was already warm at eleven, the hills behind the station gone brown, a flag on the far platform hanging straight down.<\/p><p>\"He's home. He's on the oxygen all day now, not just nights, and he can't do the stairs, and he doesn't want anybody who isn't me, which is a thing he's never said in his life and said to a nurse.\" Devin turned the cap around. \"So. Toledo. Honestly, the front-end thing's dead anyway. I can be dead cheaper in Ohio.\"<\/p><p>\"What'll you do?\"<\/p><p>\"Drive him to things. There's a guy from Ohio State who does contract stuff for a bank. I'll take whatever's remote.\" He shrugged. \"I stopped counting the applications. That's the update. I stopped.\"<\/p><p>A train came in southbound and let out nine people and left, and it made almost no noise doing it.<\/p><p>\"The thing I built,\" Devin said. \"The parent thing. It's been off since February. I know. I'm not mad. It was good.\"<\/p><p>\"It was good.\"<\/p><p>\"It was really good, dude. Nobody installed it, but it was good.\" He looked down the track toward Sunnyvale. \"You're at what, three thousand?\"<\/p><p>\"Thirty-one eighty.\"<\/p><p>\"Real money. I told you in August it was a real number, and it's more real now.\" He stood up, because the board had his train on it. \"Don't forget me when you're rich.\"<\/p><p>He said it the way he said things, fast, half a joke, with the cap in his hand, and Nate heard the half that was a joke and heard the other half too, the half that had been standing on a creek bed with 85 going by behind the trees and nothing in either of their hands but the other one, and Devin did not say that part, and Nate did not say it either.<\/p><p>\"I'm not going to be rich.\"<\/p><p>\"Then don't forget me when you're not.\"<\/p><p>The train came in with almost no sound and stood there with its doors open, humming. Devin hugged him, hard and short, and got on, and stood in the door with the cap on, and said, \"Phone works in Toledo,\" and the doors closed on the last word, and it pulled out so quietly that Nate was still standing there after it had gone.<\/p><hr class=\"break\"><p>He drove home on Alder Creek Road with the windows down. The creek under the bridge by the library was cobbles and blackberry. In Gilroy the garlic would be in the air by now, and at the community center the sign-ups for fall soccer would be taped to the door in a week or two.<\/p><p>At the table he took the calendar out from under the coffee maker, the one that ended on the first of July with every square crossed, and drew a new one on a fresh card, July and then August, and stopped there. August had been a church hall and nineteen people. August was when the teachers came back and opened their planners and decided what the year would be. He looked at the empty squares of it for a while, and did not write anything in them yet.<\/p>", "words": 2134}, {"num": 36, "title": "Screenshots", "part": 3, "meta": "July 14 – August 8, 2025 · Quince Court and a voice studio in San Jose", "html": "<p>Marcus's text came Monday at 8:40 in the morning, which for Marcus in July was early.<\/p><p class=\"note\"><em>Jaden's mom canceled on the page at 7:50. Page did its thing. I was on 580 at 7:50 and the email went wherever email goes. Found out in her driveway with the horn in my hand.<\/em> Then: <em>Your page needs to tap me on the shoulder, man. Not send me a letter.<\/em><\/p><p>Nate read it twice at the table with Lucy across from him drawing a horse that was, she had explained, a palomino, which was a color and not a kind.<\/p><p>A page could not ring a phone by itself. To ring the phone you needed a thing installed on it, and he had spent last fall watching what happened when you asked a parent to install something: six in a hundred did, and the rest clicked the link, and the link was the product.<\/p><p>Teachers were not parents. Teachers had written <em>tell me when they cancel<\/em> in the box at the bottom of the signup page forty-one times since February. He had counted, in June, and done nothing with it.<\/p><p>So: teachers only. A thin box around the pages he already had, one for each kind of phone, whose whole job was to hold the login and ring. Parents would still install nothing.<\/p><p>He went to the developer sites and found that the ninety-nine dollars he had let lapse in October was ninety-nine dollars again, and that Google wanted twenty-five and twelve people to test the thing for two weeks before it would let anyone else have it.<\/p><p>He wrote <em>$99 + $25<\/em> on a card and paid neither, because it was Monday, and the rule was before, not after.<\/p><hr class=\"break\"><p>\"That's the Woodshed ninety-nine,\" Claire said Sunday, at the table, with the pad.<\/p><p>\"Same ninety-nine. Different thing.\"<\/p><p>\"Say what it's for.\"<\/p><p>\"Teachers' phones. So the phone taps them when a parent cancels. Right now it's an email, and Marcus found out in a driveway.\"<\/p><p>\"And parents?\"<\/p><p>\"Nothing. They still get the link.\"<\/p><p>She wrote <em>$124, phones, teachers only<\/em> in pen and said, \"Go,\" and it was the cheapest thing that had happened at that table in a year.<\/p><p>Kim found the twelve testers in her group in forty minutes. <em>Twelve teachers with Android phones who will install a thing and not complain for two weeks. Done. You owe me a favor I will name in August.<\/em><\/p><hr class=\"break\"><p>It took two weeks of mornings. Lucy was at the day camp until one, which was what the $3,600 in June had bought, and on the second morning she asked over her cereal, before drop-off, why he kept taking pictures of his own phone.<\/p><p>\"The store wants pictures.\"<\/p><p>\"Of what it looks like?\"<\/p><p>\"Of what it does.\"<\/p><p>She leaned over and looked at the one he had just taken. The week, Monday to Saturday, every lesson in a box, the boxes in rows.<\/p><p>\"It's a list,\" she said, and went back to the book.<\/p><p>The store wanted a name in thirty characters, and he typed <em>Fermata for Teachers,<\/em> so the tile would say who it was for. A second line, thirty more: he wrote <em>Studio scheduling and billing<\/em> and deleted <em>billing,<\/em> because that was Allegro's word. <em>Cancellations, credits, makeups.<\/em> A hundred characters of words people might type into a search box, commas and no spaces, an hour spent on those like a man packing one bag for a long trip. Pictures of the thing on two sizes of phone he did not own.<\/p><p>He gave it five. The week. The credits ledger. The family list. The settings. The policy in the teacher's words with the button under it, the only one with a sentence on it.<\/p><p>Saturday morning the five in a row looked like the thing, which was the problem, and he did not see it yet.<\/p><hr class=\"break\"><p>Kim taught out of the front room of a house off The Alameda, built for a family and made over for one voice at a time. An upright against the inside wall. A full-length mirror. A row of water bottles on the sill with names on tape, one per student that day. A kettle on a hot plate in the corner, and above it a calendar from a nail-supply company with her last name on it, open to a month in a year that had ended.<\/p><p>\"Forty this fall,\" she said, seeing him count the bottles. \"Nobody sings well at eight a.m. and nobody's ever believed me.\" She made two cups of tea without asking. \"Show me.\"<\/p><p>She went through the five pictures once fast, once slowly, and set the phone face up on the piano lid.<\/p><p>\"Your screenshots look like a spreadsheet.\"<\/p><p>\"They're the app.\"<\/p><p>\"They're a spreadsheet. Everybody in that group has one, and the ones who hate it wouldn't say so in a picture.\" She turned the phone toward him with one finger. \"What did Yolanda say she wanted? The first week?\"<\/p><p>\"To stop texting parents at ten at night.\"<\/p><p>\"Then show me that. Show the text a parent gets. Show the credit going away. Show the teacher not texting.\" She picked up her tea. \"Five pictures of what she stops doing. Nobody's ever bought a piano from a picture of the strings.\"<\/p><p>Lucy had said it Tuesday in three words.<\/p><p>\"You should have done this a year ago,\" Kim said. \"I've had four thousand people asking me every August what to use, and for two years I've said 'not Allegro' and then nothing, because the honest answer was 'a website a man in Alder Creek runs.' That's not a name. 'It's in the store' is a name. People stop asking me what a link is.\"<\/p><p>\"Is that the favor?\"<\/p><p>\"No. That's for me.\" She set the cup down. \"The favor's August. Three hundred and fifty dollars for the coffee, which is what the church charges me for the urn and the cups and the man who watches it. Your banner from Sacramento, which you already own, so bring it. That's the table. Same spot by the coffee, and a sign on the urn with your name on it, which is what three hundred and fifty dollars buys.\"<\/p><p>\"Okay.\"<\/p><p>\"You didn't ask what else.\"<\/p><p>\"You'd have said it first.\"<\/p><p>\"Two minutes at the front. Not ten. Then go stand by your table.\" She stood; the three o'clock was in the driveway. \"Send me the new pictures before you send them to Cupertino. I'll tell you which one's still a spreadsheet.\"<\/p><hr class=\"break\"><p>He rebuilt them Sunday, with Lucy as the parent.<\/p><p>She typed the text herself, in the voice she believed parents used: <em>Sorry can't make Thursday, we have a thing!!<\/em> Under it, the reply that was not a reply: the page, Yolanda's sentence, the credit, two Saturdays. Second: the credit, one, and the same line an hour later, zero, gone where a parent could see it go. Third: a phone at 9:40 on a Thursday night with no texts on it at all, the hardest to take, because it was a picture of nothing and the time had to show. Fourth: the Monday list. Fifth: the policy and the button.<\/p><p>Across the top of each, one line. <em>Stop texting at ten at night.<\/em> <em>Stop doing the arithmetic.<\/em> <em>Stop chasing the credit.<\/em> <em>Start Monday knowing.<\/em> <em>Say it once.<\/em><\/p><p>Kim, in eleven minutes: <em>The fourth one is a spreadsheet. Everything else is fine. Send them.<\/em><\/p><p>He cut the fourth to a phone with one notification on it and sent it all Sunday night at 9:50, and it went into the queue.<\/p><hr class=\"break\"><p>Tuesday, July 29, at 10:14 in the morning, the queue answered.<\/p><p>He had been rejected once before, in December of 2023, over children, and knew the letter came with a number and a paragraph and no person. This one said that the app did not do enough to be an app. It offered an experience not sufficiently different from opening the website in a browser; apps should include features that made them more than a website in a wrapper. A link to the rule. A button to reply.<\/p><p>It was right. He had built a box with his website in it and a bell on the box, and told a stranger in Cupertino it was an app, and the stranger had opened it and seen a website in a box.<\/p><p>He did not reply. He made it do two things a website could not. The bell, done properly: a settings page that lived on the phone, where a teacher chose what rang, cancellations, payments, the Monday list, and when nothing rang at all. He set the quiet hours to nine at night and seven in the morning, because of Yolanda, and made them movable. And Marcus's driveway: the week's lessons now stayed on the phone once loaded, so the thing opened and showed the day in a house with one bar of signal or none.<\/p><p>In the notes to the reviewer he wrote four plain sentences about driveways, and sent it again Friday night.<\/p><p>Monday, August 4, at 4:50 in the afternoon, it was approved, with no paragraph at all. He set it to go live at six the next morning, both stores, and sat at the table doing nothing for a while, which he had gotten better at.<\/p><hr class=\"break\"><p>Yolanda, Tuesday, 6:31 a.m.:<\/p><p class=\"note\"><em>Nathaniel. My phone made a sound at 6:12 to tell me a Nguyen has a cold. I understand the sound is the point. Not before seven.<\/em><\/p><p class=\"note\"><em>It won't again. Nine to seven is quiet unless you move it. I turned yours on last night, ahead of the rule.<\/em><\/p><p class=\"note\"><em>Then it's the first machine in my house that knows where the bar line is.<\/em><\/p><p>Marcus, at 7:05: <em>It tapped me.<\/em> No second line, which was as close as Marcus came to a review.<\/p><p>By Friday, two hundred and six teachers had it on a phone.<\/p><hr class=\"break\"><p>He had texted Devin Thursday, after the rejection, <em>How's your dad,<\/em> because it was the thing he could ask.<\/p><p class=\"note\"><em>home from round two. sleeps in the recliner now, stairs are done for him.<\/em><\/p><p class=\"note\"><em>watched the whole mud hens game last night and told me the bullpen was garbage. so hes fine.<\/em><\/p><p>Nate wrote <em>Good,<\/em> then <em>I'm glad,<\/em> and sent the second. He did not say what was in the store, or that a man in Cupertino had called it a website in a box, all of which Devin would have had something to say about, and none of which he could find a way to begin.<\/p><hr class=\"break\"><p>Kim's text came Friday, August 8, at 4:15, while Lucy was in the Reyeses' pool and he was on a plastic chair at the edge of it.<\/p><p class=\"note\"><em>140 registered. That is double last year and I have closed it. Rondo bought a table. It is next to yours; the church put the tables where the church put them, and I am not moving either of you. Bring the banner. Bring change for the urn man. Two minutes.<\/em><\/p><p>A hundred and forty. Last year the hall had held sixty-one, and he had written the number down as if it were the size of the world.<\/p><p>Lucy came up the ladder streaming and asked what he was looking at.<\/p><p>\"A room. Next Saturday.\"<\/p><p>\"Is it a big room?\"<\/p><p>\"Same room. More people in it.\" He put the phone in his pocket. \"And the people with the bags are next to me.\"<\/p><p>\"What bags?\"<\/p><p>\"Free ones.\"<\/p><p>She gave that the seriousness she gave anything free, and went back down the ladder, and he sat by the pool with a week to find a sentence, and did not have it, and knew for the first time since Sacramento roughly where it was.<\/p>", "words": 1962}, {"num": 37, "title": "Why Should I Pay You", "part": 3, "meta": "August 9 – September 6, 2025 · Grace Community Church, San Jose; Quince Court; the middle-school field", "html": "<p>The sign on the urn was Kim's, printed, taped at the corners: COFFEE · FERMATA · $9/MO, $79/YR. He had not asked for the prices. A sign that did not say what the thing cost, she said, was a sign about nothing.<\/p><p>His table was where it had been last year, by the coffee, with the banner from Sacramento clipped to the front and the laptop open to the signup page, the year on the first line. Rondo's was the next table over, eighteen inches away, and by 9:20 it had the backdrop up, <em>Free for teachers. Always.<\/em>, and the totes in a stack, and one person setting it up alone, a woman in the quarter-zip who came around the end of her table and put her hand out.<\/p><p>\"You're the neighbor. Priyanka Rao. I do partnerships, which today means I do the table. I read your comparison page. It's fair. I'd have written it meaner.\"<\/p><p>\"Grant's not here?\"<\/p><p>\"New York this week.\" She said it lightly and did not say why, and he did not ask. \"Fifty-three hundred as of Friday, since you're going to ask that too.\"<\/p><p>Twenty thousand by Christmas. Fifty-three hundred in August. He did the subtraction and put it away.<\/p><p>Yolanda came through the side door at 9:40 and went straight to the urn and read the sign and filled a cup.<\/p><p>\"You bought the coffee.\"<\/p><p>\"That was the price.\"<\/p><p>\"It's better than last year's.\"<\/p><p>\"It's the same coffee.\"<\/p><p>\"Then I'm in a better mood.\" She drank some. \"I'm giving up Saturdays after Christmas. Four hours on the bench with no rest between them. My hands have opinions by eleven now.\" She said it to the urn and went to find a chair, and he did not write it down, and would remember later that it was the first time she had said a thing about her hands in words.<\/p><hr class=\"break\"><p>Kim gave the vendors two minutes each at ten, from the front, with the phone up, and he used his to hold up his own phone and let it ring.<\/p><p>\"It's in the store now. Both stores. For teachers. It taps you when a parent cancels or pays, and it's quiet from nine at night to seven in the morning unless you tell it otherwise. Parents get the link, same as before.\" He put the phone down. \"That's the news. The rest is what it was.\"<\/p><p>\"Time,\" Kim said, at a minute fifty.<\/p><p>A hundred and forty people on folding chairs, where there had been sixty-one, and what he noticed from the front was the totes. Half the chairs already had one. Priyanka had done that between the door and ten o'clock without leaving her table.<\/p><hr class=\"break\"><p>The break was 10:40, and the two tables shared a crowd, because a person who stopped at one had stopped at both. By 10:50 there were thirty people between the urn and the backdrop, and he was answering <em>does it text<\/em> for the fourth time when a woman near the front of his side, with a tote on her shoulder and, folded in it, a policy he recognized as one of his own from the free tool, said, \"Can I ask the thing everybody's thinking?\"<\/p><p>\"Sure.\"<\/p><p>\"Sandra Lieu. Piano. Campbell. I've got this bag. I've got one of your pages in it, from your free thing, which I used, thank you. She's free.\" A nod at Priyanka, who smiled. \"Free for teachers, always, it's on the wall. So why should I pay you nine dollars a month when they're free?\"<\/p><p>He had heard it in Sacramento from a woman in Elk Grove, and had said <em>nine dollars<\/em> four times and not had the sentence, and Claire had watched eleven people look at the bag.<\/p><p>He did not look at the bag.<\/p><p>\"Because when the free thing goes away, I'll still be here, and you'll be paying me, which is why I'll answer your email.\"<\/p><p>Nobody said anything for a second. Then somebody behind Sandra Lieu laughed, once, not unkindly, and a man by the urn said, \"Well,\" and a woman he could not see said, \"That's cold,\" in a voice that meant it was not, and Kim, at the back, said nothing, which from Kim was a sentence.<\/p><p>Priyanka waited for it to settle.<\/p><p>\"That's fair,\" she said, to the thirty people and not to him. \"We're not going anywhere. But that's fair, and I've heard that question at forty tables, and it's the first time I've heard it answered.\" She picked up a tote and held it out to the nearest hand. \"Bag?\"<\/p><p>Sandra Lieu looked at Priyanka, and at the laptop with the year on the first line, and said, \"Okay,\" and took a card, and did not type, and moved off, and the thirty became a line.<\/p><hr class=\"break\"><p>The line took forty minutes. He said the sentence once. People who had heard it said it for him, in their own words, to people who had not, and he heard it go down the line in three versions and corrected none of them.<\/p><p>She was near the end of it, twenty-eight or so, in a cardigan in August, with a printed policy gone soft at the folds.<\/p><p>\"Ana Solis. I'm in Sunnyvale. Eighteen students, in my apartment, the neighbors already hate the scales.\" She put the policy on the table. \"I made this in February. It says twenty-four hours. I've never once charged a makeup. Not once, in four years. I don't know how to say it to a person.\"<\/p><p>\"You don't say it. The page says it.\"<\/p><p>\"And if they leave?\"<\/p><p>\"Some will. Most won't.\" He turned the laptop so she could see Yolanda's page. \"She hadn't charged one in thirty years either. Her parents cancel on the page now. She still has all of them.\"<\/p><p>Ana Solis looked at the page the way people read a form they do not want to sign.<\/p><p>\"I'll sign up,\" she said. \"I might not turn it on.\"<\/p><p>\"That's allowed.\"<\/p><p>She typed the month, not the year, and put no students in, and went away with the policy folded back into the cardigan pocket, and he thought about her a second longer than the line allowed, and then the person behind her had a question.<\/p><hr class=\"break\"><p>By eleven that night it was sixty-one. Under <em>Grace: 61, 19<\/em> he wrote <em>Grace #2: 140, 61,<\/em> and looked at the two lines together, and put the card in his shirt pocket instead of the stack.<\/p><p>Kim, 11:20: <em>Sixty-one is what I have too. Now I have a name I can say.<\/em><\/p><hr class=\"break\"><p>The sign for fall soccer had gone up on the community center door the Monday after the hall, and he had signed Lucy up standing in the doorway with the phone, and told Claire at dinner, before, because it was more than a tank of gas.<\/p><p>Practice was Tuesdays at 5:30 on the middle-school field, twelve eight-year-olds and a coach who was somebody's father. Lucy had wanted the Mustangs and got the Green Comets, and accepted the Comets the way she accepted weather. He stood on the sideline. Last fall, every Saturday from October, he had been on Ninth Avenue in front of a whiteboard, and Claire had stood here, and he had not once asked what the team was called.<\/p><hr class=\"break\"><p>Monday, August 25, at 6:40 in the morning, Claire sat at the table in her school clothes with the laptop turned toward him. The program's payment page. <em>Fall installment: $4,700.<\/em> A button.<\/p><p>\"Right order,\" she said.<\/p><p>\"Right order.\"<\/p><p>She pressed it. The page thought and said <em>Paid.<\/em> She wrote <em>−4,700<\/em> on the pad in pencil and, under it, in pen, because the bank would show it by noon, <em>$51,000.<\/em><\/p><p>He watched it leave. That was what he would remember about the day: not the number, which he had known since December, but watching it go with his coffee in his hand and no wish to stop it.<\/p><p>\"Class is five to seven forty,\" she said. \"I'll be home by nine if 280 behaves. There's the pasta.\"<\/p><p>\"I know where the pasta is.\"<\/p><p>\"There's the good peas.\"<\/p><p>\"Claire.\"<\/p><p>She went to teach third grade, and at 4:15 came home and changed and drove to State in the Civic, and he made the pasta with the good peas on the side, because peas on the side were a different food, and Lucy ate it and asked where her mother was.<\/p><p>\"At her school.\"<\/p><p>\"Mom's school is Arbor.\"<\/p><p>\"Her other school. She's a student now, at night.\"<\/p><p>Lucy considered this. \"Does Mom have homework?\"<\/p><p>\"She does.\"<\/p><p>\"Do you?\"<\/p><p>\"Every day.\"<\/p><p>\"That's not fair to either of you,\" Lucy said, with real sympathy, and went to run the bath herself, which was new this year and about a third successful.<\/p><p>He did the bedtime. Two chapters of the horse book. Claire came in at 8:50 with a syllabus and sat on the edge of the bed in the dark, and said the professor had taught kindergarten in Hollister for twenty-two years and had not used the word <em>pedagogy<\/em> once, and that there were nineteen of them, and that she was the only one whose district had sent her a pink slip this year, and she had said so in the go-around, and nobody had flinched.<\/p><p>\"Good,\" he said.<\/p><p>\"It was good.\" She lay down beside him with her shoes on. \"Forty pages by Monday.\"<\/p><hr class=\"break\"><p>He read the month on the thirty-first at 9:05 at night, because that was the rule now, with Claire at the table and the pad open.<\/p><p>520 paying. $4,420.<\/p><p>She wrote it in pen. On the line above, in the same pen, was $3,180 with a minus beside it, and she looked from that line to this one and said nothing about the distance.<\/p><p>\"There's another number,\" he said. \"Cash. Not the monthly one. Sixty-nine hundred came in this month from people paying the year. That's August money. It has to last them till next August, and me too.\"<\/p><p>\"So it's not yours.\"<\/p><p>\"It's mine. It's spoken for. Twelve months of promises in one deposit.\"<\/p><p>She wrote <em>$6,900, annual, August<\/em> in pencil, and put a bracket around it, and did not put it in pen.<\/p><p>\"Anything else.\"<\/p><p>\"Forty emails a day. Some days.\"<\/p><p>\"How long is forty emails?\"<\/p><p>\"Three hours. Four.\"<\/p><p>She wrote that down too, in pencil, and looked at it longer than the money.<\/p><p>\"The twelve weeks are up on the twenty-eighth,\" she said. \"That's when I write October. Not tonight.\" She capped the pen. \"But I'll tell you what I'm not writing. I'm not writing 'or Nate looks for a job.' That sentence is done. Whatever's on the line in October, it isn't that.\"<\/p><hr class=\"break\"><p>The Green Comets' first game was Saturday, September 6, at nine, on the far field with the small goals, against a team in orange from the other side of El Camino.<\/p><p>Lucy played badly and completely. She ran to wherever the ball was, with everyone else, in a knot of green and orange that moved up and down the field as one animal, and once, in the second half, she came out of the knot with the ball in front of her and open grass ahead and ran, and the parents on both sides stood up, and she ran the length of the field with her tongue out and put it, low and hard and sure, into the goal her own team was defending.<\/p><p>She threw both arms up.<\/p><p>The orange parents clapped, because you did. The green parents clapped, because she was eight and had scored a goal, and it took her a second to turn and see her teammates' faces, and by then she had decided it counted, and kept her arms up and looked for the sideline.<\/p><p>Claire was laughing into her coffee. Nate was clapping. He was still clapping when the phone buzzed in his back pocket, and he took it out with the other hand, because it was Saturday, and Saturday was the morning he had told the monitoring service to tell him things, so it would not be one more thing on a weekday.<\/p><p class=\"note\"><em>weekly-reminders · Mon Sep 1 · 7:00 a.m. · 11 min 20 s · up from 7 min 05 s.<\/em><\/p><p>He read it once, clapping, and put it back, and Lucy was still looking for them, and he raised both hands so she would see.<\/p>", "words": 2078}, {"num": 38, "title": "Monday, 7 A.M.", "part": 3, "meta": "September 2–28, 2025 · Quince Court, the middle-school field, and a page that said whether things were working", "html": "<p>There were thirty-eight of them at 5:05 on Tuesday morning, from Labor Day and the night, and he read the first line of all thirty-eight before answering any, because that was the only way to know which ones were on fire.<\/p><p>Four said <em>it's not working<\/em> and meant four different things. Six were the app. Nine were makeups. He answered until 7:20, when Lucy came out in the shirt she had chosen for the day after Labor Day, and there were nine left, and he closed the lid on them.<\/p><hr class=\"break\"><p>Monday, September 8. He was at the table at 6:50 with the coffee and the night's fourteen, Claire in the hall making Lucy find the other shoe, and at 7:00 the job started, as it did every Monday, and he did not look up, because it had started every Monday since April of last year.<\/p><p>At 7:02 the error monitor sent a message. Then, before he had read it, twelve more.<\/p><p><em>Could not obtain a database connection. Timed out after 30 seconds.<\/em> Thirteen times, from thirteen pages opened by thirteen teachers starting their week.<\/p><p>He opened the site and got the page he had written himself for exactly this, <em>Something's wrong on our end. It's not you.<\/em><\/p><p>He knew what it was before it finished loading. The job built the week for every studio: every lesson, every family, every credit, every text to go out that evening. Five hundred and twenty studios last Monday had taken eleven minutes and twenty seconds, and the digest had told him so on a soccer field, and he had clapped. The job had every connection to the database and the pages had none.<\/p><p>7:04. He restarted the web process from the hosting panel. It came up, answered for eleven seconds, and stopped, because the job still had every connection and the new process had gone looking for one and found none.<\/p><p>7:09. Marcus: <em>Page is dead. I got a house at 8.<\/em><\/p><p>7:11. He killed the job from the panel. Six seconds later it started again, because a year ago, after the texts had failed silently for three weeks, he had made every job restart itself if it died, so nothing would ever be quietly dead again. It took the connections back, and he watched it do it.<\/p><p>7:14. Bev Ostrowski, ringing. He let it ring. Then Carol Ng: <em>Is this me?<\/em><\/p><p>7:18. Kim: <em>Is it you or is it me? I have forty people asking and I would like to tell them one thing.<\/em><\/p><p class=\"note\"><em>It's me. 7:02. I'm on it.<\/em><\/p><p>7:20. Yolanda: <em>Nathaniel. Your page is holding a fermata and nobody has told it when to come off. I am reading Monday off the whiteboard like it's 1996.<\/em><\/p><p>7:22. He found the switch that made the job restart itself, turned it off, and killed the job again, and it stayed dead, and the connections did not come back. The database was holding them anyway, a hundred conversations stopped in the middle and not hung up. There was one thing left in the panel, <em>Restart database,<\/em> with a warning that said up to ten minutes, and he pressed it at 7:24 and said \"Jesus\" to the kitchen.<\/p><p>Claire was in the doorway with Lucy and the bag.<\/p><p>\"Is the computer broken?\" Lucy said.<\/p><p>\"Yes.\"<\/p><p>\"Do you need—\"<\/p><p>\"Go.\"<\/p><p>They went. The panel said <em>restarting<\/em> for six minutes, and twenty-two texts came, and he answered none, because there was one sentence to say and Kim had said it to the group at 7:19. <em>He knows. 7:02. He's on it.<\/em><\/p><p>7:31. The database came back. 7:33. The site answered. He felt nothing yet, because the job had not run. Nobody's week was built; nobody's texts were queued.<\/p><p>He ran it by hand, in pieces, fifty studios at a time, watching the connection count climb to fifty and fall to zero and climb again, eleven times. It was done at 7:42.<\/p><p>Forty minutes. He wrote <em>7:02–7:42<\/em> on the back of an envelope, because on the bridge at Halyard someone had always written the times down and it had always been him, and then opened the mail, sixty-one new things, and started at the top.<\/p><hr class=\"break\"><p>He bought the page that afternoon. A hundred and twenty dollars a year, from a company that did nothing else: the name, a green circle or a yellow one or a red one, and a place to say in words what was happening. He put the link in the footer of every page and looked at the circle for a while, green, the only thing on the site that did not depend on him being awake.<\/p><p>The write-up went out Tuesday at 6:00, to every teacher, written for people who did not know what a connection was and should not have to.<\/p><p class=\"note\"><em>At 7:00 Monday morning the job that builds the week's reminders started, as it does every Monday. There are a lot more of you than there were in June, and it took every connection to the database and kept them. Your pages use the same connections, so every page waited, and then every page failed. It was down from 7:02 to 7:42.<\/em><\/p><p class=\"note\"><em>Here's what I changed. The job now reads from a copy of the database, not the one your pages use. It runs in pieces of fifty studios instead of all at once. If it runs long, it stops and tells me, instead of telling you.<\/em><\/p><p class=\"note\"><em>I'm sorry. Monday at seven is the worst hour I could have picked to find this out, and I picked it, in April of last year, when there were ten of you.<\/em><\/p><p>The copy of the database was thirty dollars a month more. Hosting went from $110 to $140, and he told Claire before it did.<\/p><hr class=\"break\"><p>Monday the fifteenth, Kim sent a link with no comment. One of the sites that listed software and let people rate it had a page for Fermata now, which he had not made, and on it one review, two stars of five.<\/p><p class=\"note\"><em>Does what it says, and the parents like the link. Went down Monday morning for 40 minutes during my first lessons of the week with no warning. No phone support. One guy. Fine if you never need to call anyone.<\/em><\/p><p>He read it four times looking for the part that was wrong.<\/p><p>\"Is it true?\" Claire said, at dinner, when he showed her.<\/p><p>\"Yes.\"<\/p><p>\"Then it's a description, not a review. Two stars for a description seems low.\"<\/p><p>Where the site let the maker answer, he wrote one line, and it took longer than the write-up. <em>All true. The outage report is here.<\/em><\/p><hr class=\"break\"><p>The thirty days on the sixty-one from the church hall ran out that week, and Wednesday night he pulled them up with a column he had never put in a table before: how many students each had added in the first seven days.<\/p><p>Thirty-seven had put in five or more. Thirty-five of those were paying. Twenty-four had put in fewer, and of those, fourteen were gone or had never come back after the first night, and the ten who remained were the ten who wrote <em>it's not working<\/em> and meant they had not turned it on.<\/p><p>Sixty-one of a hundred, the number he had said in a Costco lot in July as a thing he knew. Now it had names. Sandra Lieu, twenty-two students by the Tuesday, the year paid. Ana Solis, zero students, the month paid, nothing on, thirty-one days.<\/p><p>He wrote to the twenty-four, two lines each. <em>Want me to put them in? Send me the list.<\/em> Eleven sent lists. He typed two hundred and six children into other people's studios over three nights, days and times and parents' numbers, and it was the most useful thing he did that week, and it was typing, and it was eleven at night when he stopped.<\/p><p>Ana Solis did not send a list.<\/p><hr class=\"break\"><p>Saturday the twentieth the Green Comets played a team in white, and he stood on the sideline with the phone, because a teacher in Fresno had written at 8:40 that her Saturday reminders had gone to a number a family gave up in 2023, and a stranger's family had written to the teacher, and the teacher had written to him.<\/p><p>He was finding the number when the ball came out of the knot in front of Lucy and she kicked it, hard and in the right direction, into the space in front of the white goal where no one was, and the green parents said \"Oh!\" together, and she looked at the sideline.<\/p><p>He looked up at the \"Oh.\" He saw her see him look up.<\/p><p>She said nothing about it at the orange slices. In the car, with the window down, she said, \"You were on the phone.\"<\/p><p>\"For a minute.\"<\/p><p>\"You were on it when I kicked it.\"<\/p><p>\"I was.\"<\/p><p>She looked out at Alder Creek Road and said nothing else, and neither did he, and it stayed in the car the whole way home.<\/p><hr class=\"break\"><p>Sunday, September 28, 9:10 in the morning, the pad.<\/p><p>Claire had August on it already, <em>520 / $4,420,<\/em> in pen, from the thirty-first. \"This morning,\" she said. \"Pencil.\"<\/p><p>\"Six hundred. Fifty-one hundred.\"<\/p><p>She wrote it small, and he gave her the rest. Hosting $140. The texts, $310 for September, which made her put the pen down.<\/p><p>\"Three hundred and ten dollars of texts.\"<\/p><p>\"Thirty-seven thousand of them. Not a penny each.\"<\/p><p>Forty emails a day. Six hundred teachers, of whom he had spoken to perhaps ninety, ever.<\/p><p>\"And one thing before, not after. I want to move six thousand from the business account to the house. The August money's sitting there and the hole's been coming out of the house since February.\"<\/p><p>\"Do it.\"<\/p><p>He did it at the table, with her watching, and it took nine seconds, and it felt like stealing from a child, and he said so.<\/p><p>\"It's not a child,\" Claire said. \"It's yours. Sixteen months and you've never paid yourself a dollar.\" She turned the pad to a clean line. \"I said I'd write October today.\"<\/p><p>\"Write it.\"<\/p><p>She did not write a number. She wrote a sentence and turned it so he could read it.<\/p><p class=\"note\"><em>October 1: hire someone.<\/em><\/p><p>\"I can't afford it.\"<\/p><p>\"You can't afford not to.\" She did not raise her voice; she never did. \"You have six hundred customers and forty emails a day and a review that says 'one guy,' and it's right. You typed two hundred children into a computer at eleven at night. That's not what you're for. Somebody in that group of four thousand knows what a makeup is and needs fifteen hours a week. Ask.\"<\/p><p>\"I don't know what I'd be asking for.\"<\/p><p>\"Then that's the first thing to find out.\"<\/p><hr class=\"break\"><p>He opened the laptop that night at 9:30, with Lucy down and Claire at the table with her forty pages, and went to the group, four thousand one hundred people, and opened the box where you wrote a post.<\/p><p class=\"note\"><em>Looking for<\/em><\/p><p>He looked at the two words for a long time.<\/p><p>Looking for what. Someone to answer email. Someone who knew that <em>it's not working<\/em> meant six things and could tell which. Someone who knew what a makeup was, what a credit was, what a parent's Tuesday-at-four text sounded like from the other side, and could tell a teacher what she had done wrong without making her feel it. Someone who was not him, doing the part of the day he had never once thought of as a job, because it came after the code, and the code was the job.<\/p><p>The cursor blinked after <em>for.<\/em> Claire turned a page. He did not know what to call it, and sat there not knowing, with the box open, until the coffee was cold.<\/p>", "words": 1981}, {"num": 39, "title": "Yolanda", "part": 3, "meta": "September 16–27, 2025 · A hand clinic in Los Altos; Persimmon Lane", "html": "<p>The picture of her hands was on a screen the size of a music stand, and the doctor was younger than Andre and had the decency not to say so.<\/p><p>\"Here,\" he said, and touched the base of her right thumb on the screen, where two bones met and there should have been a dark line between them. \"And here. Both sides. And these.\" The second knuckle of each fourth finger. The ones that hurt in the first octave and were fine by G.<\/p><p>\"You said mornings on the form.\"<\/p><p>\"They're worse in the mornings.\"<\/p><p>\"The film doesn't do mornings. The film does years.\" He said it kindly, the way you told a child the note was a B-flat and had been all along. \"Osteoarthritis. Moderate at the thumbs, mild in the fingers. It's not going to reverse. It can be slowed, some, and it can be managed, and I'm going to say the word <em>rest<\/em> and you're going to hear me say it.\"<\/p><p>\"I teach piano.\"<\/p><p>\"How many hours are you playing?\"<\/p><p>\"I'm not playing. I'm teaching. Four hours Saturday, five the weeknights. I demonstrate.\"<\/p><p>\"Demonstrating is playing.\" He turned from the screen. \"Corinne's going to fit you for a brace for the thumb, nights, both hands, and give you a sheet of exercises. Heat in the morning before you use them. Not after. Before.\"<\/p><p>Corinne put a thing on Yolanda's right hand that held the thumb where a thumb went and closed with a strap, and handed over a sheet. Make a fist, open it, spread the fingers, hold.<\/p><p>Yolanda read it once. \"I do these.\"<\/p><p>\"Since when?\"<\/p><p>\"Since I was seven. Four octaves, both hands. C major, then around the circle. That's your whole sheet, in order, with a tune.\"<\/p><p>Corinne laughed, which Yolanda had wanted, and then said, \"Slower, then. And the heat first,\" which Yolanda had not.<\/p><p>The visit was $210 after what the plan called her share, and she drove home down Foothill with the brace in a paper bag on the passenger seat like a thing she'd bought and wasn't sure of.<\/p><p>Her mother had stopped playing at sixty, in Fresno, and died twelve years later of something else. Friday Yolanda would be sixty. Tuesday had been the first opening.<\/p><hr class=\"break\"><p>The four o'clock was a new boy from the waitlist, and she taught him thumb-under with her thumb in a brace she had not planned to wear in the room.<\/p><p>\"What's on your hand?\"<\/p><p>\"A brace.\"<\/p><p>\"Did you break it?\"<\/p><p>\"No. It's old. Thumb under. Again.\"<\/p><p>The board behind him said thirty-six. She had cut two seven o'clocks in May and called it a rest, and the waitlist had filled them in August without asking her, because she had said yes to the mothers on the phone, as she always had, and now she had the two seven o'clocks back and two more besides, and a brace in a bag. The corkboard on the far wall went back to 1996, program on program, and every name on it had sat in this room at four on a weekday with a parent in the folding chair, and she had said <em>thumb under<\/em> to all of them, and had not once, in thirty-one years, said <em>the rate is going up.<\/em><\/p><hr class=\"break\"><p>She did the arithmetic that night at the kitchen table, in her reading glasses, in his little table.<\/p><p>Nathaniel's thing kept everything. That was the trouble with it. It kept every lesson since the twenty-second of April of last year and every credit she had given and every time she had pressed the button that said <em>Add credit anyway,<\/em> which she had pressed, the machine said, fifty-three times. Fifty-three lessons canceled after nine in the morning, on which her own rule said <em>no,<\/em> and on which she had looked at the name and said yes. Twenty-two credits open tonight. Eleven hours of Saturdays she had already been paid for and had not yet sat down for.<\/p><p>Then the rate. $52 for thirty minutes. $75 for forty-five. She had set those in the fall of 2021 and had not touched them, and in the four years since, the tax on the house had gone up by its two percent every year and the Covered California premium by more than that every January, like a chord that only went one direction, and she had absorbed all of it without a word.<\/p><p>She typed 58 into the box beside 52 and did not press anything. Six dollars. Nine on the long lesson. Thirty-six children, four weeks. She did it on the back of the clinic receipt. About nine hundred dollars a month, if nobody left.<\/p><p>Four years of that.<\/p><p>She did the four years, and looked at it, and turned the receipt face down.<\/p><hr class=\"break\"><p>Andre called Friday at six, from Sacramento, with the dishwasher going.<\/p><p>\"Sixty,\" he said.<\/p><p>\"I was there.\"<\/p><p>\"Did you do anything?\"<\/p><p>\"I taught the Ruiz girl the F-sharp she's been avoiding since June.\"<\/p><p>Then she said, because it was her birthday and he was the only person on earth she would say it to, \"They took a picture of my hands on Tuesday.\"<\/p><p>The dishwasher ran in the silence.<\/p><p>\"And?\"<\/p><p>\"And it's what Grandma had. Both hands. I wear a thing at night now.\"<\/p><p>\"Mom.\"<\/p><p>\"I'm telling you so you don't hear it from someone else. There's no one else. So.\"<\/p><p>\"Okay.\" The careful voice, the work one. \"Then can I say the thing.\"<\/p><p>\"You're going to.\"<\/p><p>\"You're sixty. You've got no pension. The IRA is a used car. You're sitting on a house that's worth—\"<\/p><p>\"I know what it's worth. The Wongs told the whole street.\"<\/p><p>\"So sell it. Take the money and stop. You don't need thirty-six kids and a garage. You could be near me.\"<\/p><p>\"Sacramento.\"<\/p><p>\"Or Fresno.\"<\/p><p>\"Fresno was cheaper when I left it. That was the point of leaving.\" She turned the receipt over and back. \"And you'd take most of it.\"<\/p><p>\"I wouldn't take anything.\"<\/p><p>\"The state would. You're the state.\"<\/p><p>\"Mom.\"<\/p><p>\"Sell the retirement to retire. That's your advice. From the tax people.\" She was smiling, a little, and let him hear it. \"I did the math, Andre. Not on the house. On the studio. I know now exactly how much I've been giving away, and for how long. Four years. I did it in Nathaniel's little table. It's on a receipt on my kitchen table, face down.\"<\/p><p>\"How much?\"<\/p><p>\"Enough that I'm going to fix it Monday. And I'm not selling the house, and I'm not moving to Fresno, and I'm going to wear the thing at night, and you can put all of that in a file.\"<\/p><p>He laughed, finally, and said happy birthday, and after she hung up she stayed at the table, the phone in her lap and the brace beside the receipt, and did not cry, because it was her birthday and she had decided.<\/p><hr class=\"break\"><p>Monday, September 22, at 7:15 in the morning, after the scales, with the heat first.<\/p><p>The screen said <em>Rates.<\/em> Two boxes. Under them, a line she had not used in seventeen months: <em>Effective date,<\/em> and a note that would go on every family's page and at the top of the October invoices.<\/p><p>She typed 58 and 84 and October 1. In the box for the note she typed, with two fingers, <em>Rates change October 1: $58 for 30 minutes, $84 for 45. This is the first change since 2021.<\/em><\/p><p>She looked for a way to say <em>I'm sorry<\/em> and did not find one that she meant, and pressed the button.<\/p><p class=\"note\"><em>Saved. Families will see this on their next visit and on the October invoice.<\/em><\/p><p>No phone. No folding chair, no mother with her keys in her lap, no face to arrange while she said the number. Thirty-six families were going to read a sentence with her name over it, and she had not said it out loud to one of them, and was not going to, and she sat at the Clavinova with her coffee waiting to feel like a coward, and instead felt like a woman who had finally played the note she had been fingering for four years.<\/p><p>Then she went in to get dressed.<\/p><hr class=\"break\"><p>The first left Wednesday. A note through the page, from a family that had come in August: <em>We're going to take a break from lessons for now. Thank you for everything.<\/em> For now. She had used that phrase herself, in May.<\/p><p>The second left Friday, at 6:10 in the morning: <em>We've found someone closer to home.<\/em> Closer than three miles. She went out to the board with the eraser and took the two names off, both from the bottom of the September column, and counted what was left.<\/p><p>Thirty-four. What she'd had in April of last year, the week the first link went out.<\/p><p>Nobody else wrote. Nobody called. Trish Nguyen sent a thumbs-up on Thursday about nothing, which Yolanda decided to count.<\/p><p>She put the eraser down, and picked up the green marker, and wrote across the top of the Saturday column, in capitals, <em>SATURDAYS END DEC 20.<\/em> She had said it in August, at an urn, to no one. Now it was on the board where the parents sat, and on Monday it would go in the studio note on his page, in ink.<\/p><hr class=\"break\"><p>Saturday was Saturday. Nine to one, seven children, no rest between them, and her hands had opinions by eleven, as promised, and by 12:30 they had stopped offering opinions and started filing complaints.<\/p><p>Lucy Aguilar was the 12:30. Claire had moved her there in September for the soccer, and Lucy came in at 12:31 with grass on her knees and a report on the score, which she gave in full before sitting, and then sat, and found middle C without looking.<\/p><p>The Burgmüller. The left hand was a problem, and Yolanda demonstrated it twice, with a thumb that did not want to, and then let the child do it wrong four times and right once, which was the lesson.<\/p><p>Nathaniel sat in the folding chair with no card out. He had stopped bringing them into the room in May. He watched Lucy's hands, and then, when Yolanda played the left hand the second time, he watched hers, and she let him.<\/p><p>At one she walked them to the side door.<\/p><p>\"Saturdays end in December,\" she said. \"The twentieth. It's on the board. She'll need a weekday after Christmas. Tuesday at 4:30 is coming free. The Lindqvists' boy is a freshman now and has decided he's done at Christmas. That's a rest I'm not going to argue with.\"<\/p><p>\"Okay.\"<\/p><p>Lucy was already at the car, telling it about the score.<\/p><p>Yolanda stood in the doorway with her right hand in her left, where it had gotten in the habit of going, and looked past him at the street. The Wongs' second story. The persimmon tree, which had set fruit again, which it did whether or not anyone was going to pick it.<\/p><p>\"Nathaniel.\"<\/p><p>\"Yes.\"<\/p><p>\"If I stop.\" She said it plainly, to the street. \"Not Saturdays. If I stop. What happens to my students' accounts? The credits, the pages, the Nguyens' half hour with no end on it. Thirty-four families with my name over them. Where does it go?\"<\/p><p>He did not have an answer. She watched him not have one, which she had watched him do at this door for two years, over cancellations and rain and the price of a text, and had always, until now, found restful.<\/p>", "words": 1931}, {"num": 40, "title": "Rondo", "part": 3, "meta": "October 14–26, 2025 · Quince Court; a Zoom with San Francisco", "html": "<p>The first forward came at 9:52 on Tuesday morning from a teacher in Elk Grove whose name he did not know, with one line above it: <em>Is the nine dollars still nine dollars?<\/em><\/p><p>The second came at 10:04 from Modesto, with nothing above it at all. The third, at 10:31, from a teacher in Fremont who had left Fermata for Rondo in April and said so: <em>I know. Don't say it. Can I come back?<\/em><\/p><p>Under all three, the same email, and he read it three times before he understood that it was the same because it had gone to everyone.<\/p><p class=\"note\"><em>I'm writing to every Rondo teacher, all of you, just under six thousand, because you should hear this from me and not from a banner.<\/em><\/p><p class=\"note\"><em>Rondo will shut down on Saturday, November 15. We built something free for teachers and paid for by a small fee on your parents' payments, and the fee never covered what it cost to serve you. We spent the summer trying to raise the money to get to the size where it would, and we couldn't. That's the whole story. I'm sorry.<\/em><\/p><p class=\"note\"><em>Between now and the 15th, everything you've put in is yours to take out: students, families, schedules, balances. Settings, then Export. Next Monday I'll send a short list of other tools, with what they cost, so you can decide. Nobody's paying me to recommend anyone.<\/em><\/p><p class=\"note\"><em>Grant.<\/em><\/p><p>Twenty thousand by Christmas. Fifty-three hundred in August, from a woman with a stack of totes. He did not do the subtraction this time. There was nothing to subtract from.<\/p><p>Kim posted it in the group at 10:05 without a word, and by eleven it had ninety comments, which he did not read, because a teacher in Elk Grove had asked him a question.<\/p><p class=\"note\"><em>Yes. Nine. Or seventy-nine for the year. Could you do me a favor? Export your file and send it to me, just the file, so I can see what it looks like. I'll build something that reads it.<\/em><\/p><p>She sent it at 11:40. A spreadsheet, one sheet, four hundred and twelve rows, twenty-six students and their families, a column for everything. Phone, email, day, time, length, rate. And one column at the far right, headed <em>Owed,<\/em> with a number in it for every family, and he looked at it for a long time and did not know which direction it pointed.<\/p><hr class=\"break\"><p>He told Claire at dinner, before, because it was going to be more than a tank of gas.<\/p><p>\"I'm going to build a thing that reads their file. Tonight through Saturday. Every night. I'm telling you now because I won't be at the table.\"<\/p><p>\"How many of them are there?\"<\/p><p>\"Six thousand. Most of them will go to Allegro.\" He put the fork down. \"Some of them are going to be looking for a place to put twenty-six children by the fifteenth of November, and I'd like the place to be ready before they look.\"<\/p><p>Lucy said, \"Is somebody's computer broken?\"<\/p><p>\"Somebody's company.\"<\/p><p>\"Is that worse?\"<\/p><p>\"For him,\" Nate said. \"Yes.\"<\/p><hr class=\"break\"><p>It took four days, because the file was honest and the column was not.<\/p><p>Tuesday night he wrote the part that read a spreadsheet and found the columns by their names, so that a teacher who had renamed <em>Phone<\/em> to <em>Mom's cell<\/em> would not lose her mothers. Wednesday at five he built the page: drag the file in, see your students laid out as they would look in Fermata, anything the file could not place in red, fix it there, then a button that said <em>Import these<\/em> and did nothing until you pressed it. He put Lucy in a test file and imported her nine times.<\/p><p>Thursday was the column.<\/p><p class=\"note\"><em>Owed.<\/em> The Elk Grove teacher's Hendersons had 104 in it. He had assumed that was what the Hendersons owed her. He wrote to ask. <em>No,<\/em> she wrote back, at 6:15 in the morning, in the tone of a woman who had explained this to someone before. <em>They paid ahead. October and November. That's what I owe them. It's always been backwards and I stopped noticing.<\/em><\/p><p>So a positive number under <em>Owed<\/em> was a lesson the teacher had already been paid for and had not yet taught. Two lessons at $52. He had been about to bring strangers' families into Fermata with every debt turned inside out, and what had stopped him was one question to one person.<\/p><p>He did not decide what to do with the balances Thursday. He put a card on the table that said <em>BALANCES: ask Grant<\/em> and went to bed.<\/p><hr class=\"break\"><p>Thursday at noon Kim posted a screenshot.<\/p><p>Allegro's page, with a green banner across the top. <em>Coming from Rondo? Your first three months are on us. Free migration by our team. Phone support 7 to 7 Central. Welcome home.<\/em><\/p><p>Under it, Kim: <em>For the record, \"free migration by our team\" means a person calls you. That's what nineteen dollars buys. It's fair to want it.<\/em><\/p><p>He looked at the banner for a while at the table with the file open beside it.<\/p><p>Claire, home at four, read it over his shoulder. \"Can you do that?\"<\/p><p>\"Three months free?\"<\/p><p>\"Yes.\"<\/p><p>\"I can press a button that does it.\" He turned the laptop toward her. \"Two hundred teachers is fifty-four hundred dollars I don't collect, and servers for two hundred studios nobody's paid for, and two hundred people writing to me the first week, because they've just been moved. And I stood in a church in August and told a woman the reason to pay me was that she'd be paying me.\" He shrugged. \"I'm not going to match it. I'm going to be ready and answer the phone.\"<\/p><p>\"You don't have a phone.\"<\/p><p>\"I'll have a link to fifteen minutes of me. That's what I've got.\"<\/p><p>She looked at the banner, and at him, and wrote <em>Allegro: 3 mo free<\/em> on the pad in pencil with nothing after it.<\/p><p>Devin, that night, by text, because Nate had asked about Stan on Sunday and Devin was slow now: <em>same. cold here already. he made me put the storm windows in.<\/em> Nate wrote <em>Good<\/em> and did not write the rest.<\/p><hr class=\"break\"><p>Grant's face on Friday at four was the same face from the bar in Sacramento, thinner, with a bookshelf behind it instead of a backdrop.<\/p><p>\"How are you?\" Nate said.<\/p><p>\"Tired. Everybody's been very decent, which is worse.\" He rubbed his eyes. \"You wanted to ask about the export.\"<\/p><p>\"The <em>Owed<\/em> column.\"<\/p><p>\"Positive is what the family's paid ahead. It's the ledger's point of view. A liability. We named it in the first month and never renamed it, and every teacher learned to read it backwards, and I've been waiting all week for somebody to import it the wrong way.\"<\/p><p>\"I almost did.\"<\/p><p>\"I figured you'd ask first.\" He drank something from a mug. \"What are you going to do with them? The balances. That's my actual question. Some of those families have three hundred dollars sitting in that column, and on the fifteenth the column stops existing.\"<\/p><p>\"I don't know yet.\"<\/p><p>\"Good. Don't guess. Whatever you do, make the teacher look at each one. Don't let a number walk in by itself.\"<\/p><p>Nate wrote that on the card under <em>ask Grant,<\/em> and crossed out <em>ask Grant.<\/em><\/p><p>\"Can I ask what happened?\"<\/p><p>Grant nodded.<\/p><p>\"The fee was the business. The fee needed twenty thousand teachers to be a business, and we got to six, and half their families still write checks, so we made a quarter on half of the lessons instead of all of them. I spent August in New York asking people for eighteen more months, and they asked me what six thousand teachers were paying us, and I showed them, and that was the meeting.\" He turned the mug. \"It wasn't the product. The product was fine. The teachers never paid for it, and the parents didn't pay enough for it, and I'd known that since the napkin. I just thought I'd get to twenty.\"<\/p><p>\"I'm listing you Monday. And Allegro. Both, with prices. You're the only one who ever answered the question, and I've got six thousand people who are about to ask it.\"<\/p><p>\"Why not just Allegro?\"<\/p><p>\"Because some of them chose us for the reason they'd choose you.\" Grant looked at something off the screen. \"Priyanka's got a job at a payments company after Thanksgiving. I'm going to sleep for a month. Ship your thing Saturday. They'll start reading Monday.\"<\/p><hr class=\"break\"><p>It shipped Saturday at 6:40 in the morning, before the game.<\/p><p>A page called <em>Coming from Rondo.<\/em> Five steps with pictures: Settings, then Export, in Rondo; drag the file here; check the red; look at every balance and say yes or no to each; your families get a new link Monday morning with your name over it. Under the five steps, one more thing, a calendar. <em>Fifteen minutes with me, on video, while you do it. Pick a slot.<\/em> He had put up forty, evenings and early mornings, none on Saturday at nine.<\/p><p>He sent the link to the three and to Kim, and went to watch the Green Comets lose to a team in purple. By the time Lucy had finished the orange slices, eleven of the forty were taken.<\/p><p>By Sunday night, thirty-one.<\/p><hr class=\"break\"><p>Grant's list went out Monday at 9:00. Two paragraphs, alphabetical. <em>Allegro Studio (Nashville): $19/month, three months free for Rondo teachers, phone support, invoicing, recitals; a large company that has been doing this since 2012. Fermata (Alder Creek, CA): $9/month or $79/year, cancellations, credits, a page for your families; one person, who has built an importer for our file and will sit on a call with you while you use it. I've met both. Pick the one you'd have picked if we'd never existed.<\/em><\/p><p>At 9:20 the signup page had eleven new names on it. By noon, forty-one.<\/p><p>The box that asked where a person had come from filled with one word in every spelling. <em>Rondo. rondo. Grant's email. the list.<\/em> At 3:15 a teacher in Tucson wrote <em>both, still deciding,<\/em> and paid for nothing yet.<\/p><p>By Friday night it was a hundred and forty. The hosting panel had a second color on it now, the yellow of a thing being asked to do more than it was bought for. He moved it up a size, $140 to $180, on Thursday, and told Claire before he pressed it, at the table, with Lucy doing spelling between them.<\/p><p>\"Before,\" Lucy said, to nobody.<\/p><hr class=\"break\"><p>Sunday, October 26, at 9:10 in the morning, the pad.<\/p><p>\"September's closed,\" Claire said. \"Six hundred. Fifty-one hundred. In pen.\" She wrote it. \"Now this week. Pencil.\"<\/p><p>\"Two hundred signups since Monday. Sixty-three of them paid the year, because the year skips the trial and they wanted it done. The rest are on thirty days.\"<\/p><p>\"So they're not paying.\"<\/p><p>\"The sixty-three are paying. The rest are looking.\"<\/p><p>She wrote <em>200 / 63,<\/em> small. \"And what did it cost.\"<\/p><p>\"Forty dollars a month more on the servers. Four nights. Every slot on the calendar for the next three weeks, which is seventy of them, fifteen minutes each, which is not fifteen minutes each.\"<\/p><p>\"And the six thousand?\"<\/p><p>\"Most of them went to Allegro. Some of them went to a spreadsheet.\" He turned the laptop toward her, because it was easier than a number. The hosting panel, the one with the circle, and beside the circle a bar that had been green for a year and yellow on Thursday, and was, this morning, with two hundred new studios building their first Monday, red.<\/p><p>She looked at it for a while.<\/p><p>\"Say which part was luck.\"<\/p><p>\"The date. If Grant had run out of money in June I'd have had a thing with a red bar and no importer and Kim telling forty people it was me. He ran out in October. That's not mine.\"<\/p><p>\"And the rest?\"<\/p><p>\"The rest was eighteen months of being here when nobody was closing.\"<\/p><p>She wrote both down, in pencil, under <em>200 / 63,<\/em> in her own words, <em>luck: the date<\/em> and <em>not luck: the rest,<\/em> and looked at the red bar again, and did not put either line in pen, because neither had closed.<\/p>", "words": 2048}, {"num": 41, "title": "Migration Calls", "part": 3, "meta": "October 21 – November 10, 2025 · Quince Court; seventy small windows; a kitchen in Fresno", "html": "<p>The Modesto teacher had her file on the desktop already, named <em>rondo export FINAL,<\/em> and dragged it in at 6:31 on Tuesday morning while he was still saying good morning.<\/p><p>Twenty-two students came up on his screen and hers, Monday to Friday, three of them in red because Rondo had let her write <em>after school<\/em> in a box that wanted a time. She typed 3:30, then 4:00, and for the third said, \"That one's whenever her mother gets off,\" and typed 5:00, and the red went away.<\/p><p>\"Balances,\" he said.<\/p><p>Seven families with a number. Each on its own line, the way he had built it Sunday night after Grant: the number from the file, and beside it, in plain words, what it would become. <em>$104 prepaid: 2 lessons at $52. Add as credit?<\/em> Yes or no, one at a time, nothing on any family's page until she pressed it.<\/p><p>She pressed yes seven times, reading each one out loud first, then <em>Import these,<\/em> and it was 6:40.<\/p><p>\"That's it?\"<\/p><p>\"That's it. They get the new link Monday, with your name on it.\"<\/p><p>\"Grant said you'd sit there while I did it. You sat there. Okay. Bye.\"<\/p><p>Nine minutes. He wrote <em>1<\/em> on a card and put it under the laptop.<\/p><hr class=\"break\"><p>There were seventy, in the end, over three weeks, and the card went to seventy in a hand that got smaller.<\/p><p>Six in the morning and eight at night, fifteen minutes each, on a calendar that refilled itself. Lucy learned to hold up the horse book from the doorway and go away when he raised one finger. The same five steps, in the same order, to a teacher in Boise and a violinist in Bakersfield with four hundred rows and eleven reds who said \"oh\" at each one. The balances did what Grant had said: every number walked in on its own line and waited to be looked at, and about one in ten got a no, and one in twenty got a different number typed over it by a teacher who knew something the file did not. The mail was fifty-five a day. He answered it between calls, and by the second week could do a migration in his sleep and very nearly did.<\/p><hr class=\"break\"><p>The Thursday call at eight was a piano teacher in Santa Rosa named Joyce, sixty or so, with a cat on the back of the couch behind her, and the file went in clean, and then the balances came up and she stopped.<\/p><p>\"The Kesslers.\"<\/p><p>Three hundred and twelve dollars prepaid. Six lessons at $52.<\/p><p>\"They paid September and October in August. Then the boy broke his arm, and then they went to Oregon for her mother, and then it was 'we'll be in touch,' and that was the sixteenth of September. They haven't answered a text since. I've sent four.\" She looked at the line. \"I don't know if I'm supposed to press yes. It's their money. I can't put it on a page with my name on it if they're never coming back, and I can't not, and every morning it's the first thing I see.\"<\/p><p>He said nothing, and she went on, because nobody had asked since September.<\/p><p>It took forty minutes. The arm. The mother in Oregon. The four texts, read to him from her phone. The thing she was actually afraid of, which came out at 8:35: she had spent the money in August on a tuner, and if the Kesslers wrote and asked for it back she would have to say something to a person.<\/p><p>\"Press yes,\" he said, at 8:38. \"It's theirs. The page says so. If they come back, the page says six lessons, and you teach them. If they never come back, it sits on their page and not on yours. And if they write and ask for the money, you have a page with your name on it that says what you owe them, and you say yes, and that's the whole conversation.\"<\/p><p>She pressed yes. She said, \"You're the first person who's asked me what I wanted to do with it,\" and he said, \"Grant told me to,\" and she laughed, and the cat left.<\/p><p>Forty-one minutes. He wrote <em>23.<\/em><\/p><hr class=\"break\"><p>Monday, November 3, at 7:30 in the morning, the call was from Tucson, and the woman on it, Carla Whitfield, forty-four students, piano and voice, had signed up for both trials on the twentieth and written <em>still deciding<\/em> in the box, and she said, before he could start, \"I'm going with Allegro. I wanted to tell you on the call, not let you find out from the page.\"<\/p><p>\"Okay.\"<\/p><p>\"Can I tell you why?\"<\/p><p>\"Please.\"<\/p><p>She had a list, on paper, and held it up.<\/p><p>\"Phone. I called them Wednesday at four about the autopay thing, and a woman named Deb picked up on the second ring and stayed on till it was fixed. I called you and got a calendar.\" Her finger moved. \"Invoices. Forty-four kids and sixty-one parents, because of the divorces, and three families who pay on the fifteenth because that's when the husband gets paid, and I need a statement I can hand to a man in a custody fight. You have a number on a page. They have a thing that prints.\" Her finger stopped. \"And you're one guy. You were the better call, Nate. Honestly. You knew what a makeup was and they read off a script. But you were on a call with me at 7:30 in the morning, which means you're the guy at 7:30 in the morning, and if you get hit by a bus I've got forty-four kids in a spreadsheet. They've got forty people. I've got a business.\"<\/p><p>\"That's fair.\"<\/p><p>\"I know it's fair. I'm telling you so somebody tells you.\" She put the paper down. \"The three months free didn't hurt. But I'd have paid the nineteen.\"<\/p><p>He thanked her, and meant it, and she left the call, and he wrote under <em>23,<\/em> three words, <em>phone. invoices. one guy.,<\/em> and boxed the last two, and did not argue with her in his head, which was new.<\/p><hr class=\"break\"><p>The Stripe email came Tuesday. Payouts paused, pending a review of recent changes in account activity; a form asking what the business did. He wrote three sentences, one with the word <em>Rondo<\/em> in it, and told Claire at dinner that about four thousand dollars would be two days late and that nothing was wrong, and it was two days late, on Thursday, and nothing was wrong, and he told her that too.<\/p><hr class=\"break\"><p>Sunday the second had been the pad, October in pen: <em>720. $6,120.<\/em> Under it, the house, from the bank, $47,800, and she had looked at that number longer than the other two, because the six thousand he had moved in September was already inside it.<\/p><p>\"Fifty-five a day,\" she had said. \"Emails.\"<\/p><p>\"Fifty-five.\"<\/p><p>\"It's November.\" She had turned back a page, to the line she had written on the twenty-eighth of September, <em>October 1: hire someone,<\/em> and put her pen on it, and not said anything else, because she did not need to.<\/p><hr class=\"break\"><p>Marisol Ochoa's post went up in the group Thursday, November 6, at 8:52 at night, in a thread about Rondo that had gone to four hundred comments, most of them angry at a man who had already apologized.<\/p><p class=\"note\"><em>If anyone's drowning in Rondo refugees, I taught piano for eighteen years and closed my studio in 2023. I know what teachers mean when they write \"it's not working.\" I'm in Fresno with a kitchen table and a laptop. Not looking for a favor; looking for work, part-time, for whoever's building the thing they're all moving to. Message me.<\/em><\/p><p>Kim, under it, at 9:05: <em>@Nate.<\/em><\/p><p>He read it three times at 9:40. <em>I know what teachers mean when they wr
