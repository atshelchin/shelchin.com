d I want it to be something and not \"I don't know yet.\" I talked to a lawyer, a friend, just to see. I'd rather we did this ourselves.<\/em><\/p><p class=\"note\"><em>I read the post about the links. It was a good post. I'm asking anyway, because I'm in Toledo and I don't have a job, and because I asked you a year ago Saturday in a coffee shop and you said you didn't know yet, and that's been a year.<\/em><\/p><p class=\"note\"><em>Devin<\/em><\/p><p>He read it once. He put the subject in, one word, capitalized, because it was a proper noun and this was a proper email. Outside the plow went by and its blade scraped the whole street in one long sound. It was 11:48.<\/p><p>He pressed Send.<\/p>", "words": 1882}, {"num": 49, "title": "Share", "part": 4, "meta": "January 5–12, 2026 · Quince Court; Palo Alto", "html": "<p>Lucy went back to school Monday the fifth with a horse on her lunch bag and a spelling list with <em>January<\/em> on it, and at 8:05 the house was empty and the email was open on the laptop where it had been open every morning since the twenty-second.<\/p><p>Fourteen days. He counted them the way he counted everything, and he could account for every one.<\/p><p>Christmas Eve at his mother's, under the new roof, which did not leak, which Rosa said four times. Christmas Day, when nobody answered email. The twenty-seventh, when he had pulled the history of every change to the code since 2024 and looked for Devin's name in it, at eleven at night, and had told no one. New Year's Eve in the Kasprzaks' garage, where Paul Kasprzak had asked how the business was and he had said fine. The estimates for the fifteenth, the late one and the one on time, done early, both, for the first time in his life. The runbook for Wes Tanaka and for Marisol, forty pages, so that if he were hit by a truck somebody could turn the Monday job back on. Lucy's break, all of it.<\/p><p>Every one of those was true and every one was a place to stand where the email could not see him. He had known it on the twenty-third, and knowing it had never once been the same thing as answering.<\/p><p>He had three replies in the drafts folder. One said <em>Let's talk this week,<\/em> and had been there since the twenty-third. One was two words, <em>I know,<\/em> and he had come closest to sending that one.<\/p><p>He closed the laptop and answered Marisol's overnight questions instead, which took until nine, and was work, and counted.<\/p><hr class=\"break\"><p>Thursday morning at 6:40 Claire was at the table in her robe with the pad, doing what she did on Thursdays, which was look at the week, and he sat down across from her with his coffee and said it before he could arrange it.<\/p><p>\"I need to spend money. More than five hundred. On Sunil.\"<\/p><p>She looked up. \"The breach?\"<\/p><p>\"No. Devin.\"<\/p><p>\"What about Devin.\"<\/p><p>\"He sent an email. On the twenty-second. He wants his share of the business in writing. He's talked to a lawyer.\"<\/p><p>She put the pen down. Not hard. Down.<\/p><p>\"The twenty-second.\"<\/p><p>\"Of December.\"<\/p><p>\"You've had a lawyer's email for seventeen days.\"<\/p><p>\"It wasn't from a lawyer. It was from Devin. He said he'd talked to one.\"<\/p><p>\"Nate.\" She did not raise her voice; she did the other thing, where every word arrived by itself. \"You stood in this kitchen on the third of December and initialed a page that says before, not after. That's the only reason I'm hearing this at all, isn't it. You need to write a check and the rule says you have to tell me first, so here you are, on day seventeen, telling me.\"<\/p><p>\"Yes.\"<\/p><p>\"Then the rule works. Good.\" She picked the pen back up, and he watched her decide something. \"Under the rule I say yes or no. Yes. Call a lawyer today. Not tomorrow. Today. And I don't mean the seven-thirty phone call, I mean you go and sit in a room with him.\"<\/p><p>\"He's in Palo Alto.\"<\/p><p>\"Then you drive to Palo Alto.\" She wrote something on the pad, small, and turned it so he could read it. <em>Sunil. Jan 8. Told.<\/em> \"I'm not asking what you're going to say to Devin. I don't want to know yet. I'm telling you what you're doing at nine o'clock.\"<\/p><p>At nine o'clock he called, and a paralegal named Josie said Mr. Batra had an hour tomorrow at nine, and did he want it.<\/p><hr class=\"break\"><p>Sunil Batra's office was a second-floor suite on a side street off University Avenue, four doors along a hall and a conference room at the end with a window onto a parking lot, and he was smaller than his voice, gray at the temples, in a white shirt with no jacket, and he did not shake hands so much as acknowledge that hands existed.<\/p><p>\"Mr. Aguilar. Sit. Tell me the deal. Exactly. Not what you meant by it. What was said.\"<\/p><p>Nate told him. The creek bed, the seventeenth of August, 2024, the freeway behind the trees. The parent app, on the side, nights. <em>Okay yes.<\/em> His hand in his pocket for a card and no card there.<\/p><p>\"'If this ever makes money, I'll cut you in.' And he said 'Deal.' And we shook hands.\"<\/p><p>\"Those words.\"<\/p><p>\"Those words.\"<\/p><p>\"Anyone else present.\"<\/p><p>\"A woman with a dog.\"<\/p><p>Sunil wrote that down, which Nate had not expected. \"Anything on paper. Then or after. A text that says 'my share,' 'my cut,' a percentage, an email, a napkin.\"<\/p><p>\"No. I had a card in my pocket in October and I knew it was there. It had nothing on it.\"<\/p><p>\"I'm not interested in the card.\" He turned a page on the pad. \"What did he build, when, and where is it now.\"<\/p><p>\"A parent app. Forty screens, October fifth to November sixteenth, 2024. It shipped November eighteenth. Six percent of families installed it. I took it out in February. I pulled the history over the break.\" He had it on one sheet and put it on the table. \"Three parts of his are still in the page. The row of days across the top. The little counter for credits. The list of open makeup times. A fourth I rewrote half of and his name's still on the half I didn't.\"<\/p><p>Sunil read the sheet without touching it.<\/p><p>\"Here's what he owns, in one sentence. The code he wrote is his: he wrote it, nobody paid him, nobody had him sign anything, so it's his the way a song you wrote in somebody's kitchen is yours, even if they've been singing it for a year.\" He looked up. \"That's the part with teeth. Not the handshake. The handshake is real. A verbal agreement is a real agreement. It's also unprovable, which is a different thing from unreal. 'Cut you in' is not a number. A jury can make it one, and a jury is twelve people who've all been promised something by a friend.\"<\/p><p>\"So what does he get?\"<\/p><p>\"Legally? Possibly nothing. Possibly a lot. I don't tell people the middle of that range, because they hear the number they like.\" He put his pen down. \"What I'll tell you is what he can do. He can't shut you down. He can make you take four things out of a page and pay a lawyer while you do it, and he can sue you on a handshake and lose slowly, and every month of that is my rate. That's his lever. Realistic exposure is nuisance value plus whatever a jury thinks of a guy who said 'I'll cut you in' and didn't.\"<\/p><p>\"I didn't say I didn't.\"<\/p><p>\"You didn't say anything. For a year. He's going to say that too.\"<\/p><p>Nate looked at the parking lot.<\/p><p>\"He read my post about the links. He said so. He knew what December was and he sent it anyway.\"<\/p><p>\"Yes. He's a person with a lawyer and a father on oxygen, and he waited two weeks after your worst day, which somebody in Columbus probably told him was decent of him.\" Sunil waited. \"You're angry. Fine. Be angry in the car. In here I need three things. The list, with file names and dates and what each part does, in words a clerk can read. Every text between you and him since August 2024, exported, not screenshots. And you don't reply to him. Not a word. Not 'got it.' He has a lawyer, and now you have one, and that's what we're for.\"<\/p><p>\"I haven't replied in eighteen days.\"<\/p><p>\"Then that's the one thing you've done right, and you did it by accident.\"<\/p><p>He wrote something else.<\/p><p>\"Retainer's two thousand against my time. You'll go through it. This will cost you more than the breach did.\" He looked up. \"And Mr. Aguilar. I said it on the phone in December and you heard it as permission. Hear it the other way now. Guilt isn't a legal theory. Bring me facts.\"<\/p><p>In December it had meant he did not have to say <em>my fault<\/em> in an email. In the conference room it meant a list, by Monday, with file names, and the year of texts he had not wanted to read again.<\/p><p>Josie took the card at the front desk and gave him a receipt, and it was 10:05.<\/p><hr class=\"break\"><p>He drove home on Foothill with the radio off and did what he had been told.<\/p><p>The list took two hours. Four parts, with the names of the files and the dates Devin had written them and the date Nate had touched each one since. He wrote what each did in plain English, the row of days, the counter, the list, the message at the bottom, and did not write anything about how good they were, which was true and not a fact.<\/p><p>The texts took longer, because he read them. <em>ill have mockups by sunday. 700 signups dude. SEVEN HUNDRED. we did SIX WEEKS. send it. nice. dayton. bad. home from round two. sleeps in the recliner now. cold here already.<\/em> A year and a half of a friend in lower case, and in all of it not one word about a share, from either of them, because Devin had never asked in writing and Nate had never once said it back.<\/p><p><em>Saw the Rondo thread. Congrats. We should talk.<\/em> And under it, nothing, and under the nothing, the email.<\/p><p>He sent both files to Sunil at 3:40.<\/p><p>Claire, home at four, read the receipt on the counter and wrote <em>2,000<\/em> on the pad under <em>Told,<\/em> in pen, and said, \"How was he?\"<\/p><p>\"He wrote down the woman with the dog.\"<\/p><p>\"Good,\" she said. \"Someone should have.\"<\/p><hr class=\"break\"><p>There was no meeting Sunday. Claire said December was closed, nine hundred eighty-five and eighty-three seventy, and she had already written it, and nothing else was ready to be a number. They took Lucy to the creek trail instead, running full and brown under the footbridge after a week of rain, and Lucy threw sticks in on the upstream side and ran to the downstream side to see them come out, with a stopwatch. The water was over the cobbles.<\/p><hr class=\"break\"><p>Monday the twelfth, at 6:12 in the morning, with the coffee, an email from an address he did not know, with a PDF on it.<\/p><p>Letterhead. Three names across the top in a serif, an address in Columbus, Ohio, a suite number. <em>Re: Devin Kowalczyk / Fermata LLC.<\/em><\/p><p>He read it at the counter.<\/p><p>The firm represented Mr. Kowalczyk. On or about August 17, 2024, Mr. Kowalczyk and Mr. Aguilar had entered into an oral agreement under which Mr. Kowalczyk would design and develop the parent-facing application for the Fermata product in exchange for a share of the business. In reliance on that agreement Mr. Kowalczyk had contributed approximately forty screens of software over October and November 2024, portions of which remained in the product. No written assignment of Mr. Kowalczyk's copyright in that software existed. Mr. Kowalczyk was therefore entitled to recognition of his interest in Fermata LLC and to an accounting of revenues since November 18, 2024. The firm requested a response within fourteen days, failing which Mr. Kowalczyk would pursue all available remedies, including with respect to the unauthorized use of his copyrighted work.<\/p><p>Then the number, in its own paragraph, in words and in figures.<\/p><p class=\"note\"><em>Mr. Kowalczyk's interest in Fermata LLC is fifty percent (50%).<\/em><\/p><p>He forwarded it to Sunil at 6:14 without a word above it, as he had been told, and stood in the kitchen with the coffee going cold, and read the last paragraph again.<\/p><p>Fifty percent.<\/p>", "words": 1987}, {"num": 50, "title": "Buyout", "part": 4, "meta": "January 13 – February 9, 2026 · Quince Court; Palo Alto; Orchard Coffee", "html": "<p>\"It says I didn't promise anything.\"<\/p><p>\"It says you didn't form a partnership.\" Sunil had the letter on the table between them, two pages, going out at noon. \"You promised something. Read it again. Paragraph three.\"<\/p><p>Nate read paragraph three again, in the conference room with the parking lot, Tuesday the thirteenth at nine. <em>Mr. Aguilar does not dispute that in August 2024 he expressed an intention to compensate Mr. Kowalczyk should the product become profitable.<\/em> Then the rest of it, which said that an intention to share an unspecified amount of money that did not exist was not a partnership; that Fermata LLC had one member and had since June 2024; that the four components Mr. Kowalczyk had identified were identified correctly, were being removed, and would be gone before anything was signed; and that Fermata was prepared to compensate Mr. Kowalczyk for his 2024 work in exchange for a written assignment of that work and a release, and invited a figure.<\/p><p>\"That's it?\"<\/p><p>\"That's the whole game. He says half. We say the four things are coming out and here's a door. He walks through it or he sues you on a handshake in California from Ohio, and his lawyer knows what that costs.\" Sunil capped his pen. \"You want to pay him. I can see it from here. Don't pay for guilt. Pay for two things you can hold in your hand: a release and an assignment. That's what money buys in this room. Everything else you settle with him on the phone, and I'm not on that call.\"<\/p><hr class=\"break\"><p>Wes Tanaka came in on a Tuesday, the twentieth, by video, a man about Nate's age in a hoodie with a whiteboard behind him that had nothing on it, and asked for the hosting login and the code and four days, and did not ask for anything else.<\/p><p>Friday at four he called, which was the one call.<\/p><p>\"Report's in your inbox. Eleven pages. Nine of them are fine, and by fine I mean things I'd fix in March. Two I'd fix tonight.\" He did not read from anything. \"One. When a teacher signs in, you email her a link, and the link signs her in. I found one in a test inbox from June 2024. It still works. Anyone who's ever had a teacher's old email, a phone she sold, a laptop she gave a kid, can be her. Same mistake as December, in a different room.\"<\/p><p>Nate said nothing, because there was nothing.<\/p><p>\"Two. In October you let seventy teachers upload their files from Rondo. Names, phones, balances. The files are still on the server. All seventy, in a folder, since October. Nobody deleted them. Anyone with the hosting login can read every one.\" A pause. \"That's not a hole. You made a pile and forgot it.\"<\/p><p>He fixed both that night. The links died in fifteen minutes now. The folder was gone by nine, and he wrote to seventy teachers to say it had existed and that it did not. He paid Wes twenty-four hundred dollars from the business account Monday, and put the eleven pages in the takeout drawer with the Los Altos teacher's email and Joyce's cat, because it belonged with the things he did not want to lose.<\/p><hr class=\"break\"><p>The counter came Tuesday the twenty-seventh, from Columbus, and Sunil read it to him over the phone in a voice that had already decided.<\/p><p>\"Fifteen percent of the company, ongoing. Or, in the alternative, sixty thousand dollars.\"<\/p><p>\"Fifteen.\"<\/p><p>\"Ongoing is a marriage. You'd send him a tax form every year for the rest of your life and a check every quarter, and every time you raised a price he'd have an opinion with a lawyer attached. No. The sixty is the number they wrote so that thirty sounds like a gift.\" He turned a page. \"What did his work cost, honestly. Hours, at a rate.\"<\/p><p>\"Two hundred hours, about. Seven Saturdays and the nights. At what Halyard paid him by the hour, seventy-five, maybe. Fifteen thousand.\"<\/p><p>\"Then fifteen is what he's owed, and three is what a release costs, and eighteen is a number I can say out loud to a man in Columbus without laughing. Can you pay eighteen?\"<\/p><p>\"Not in a month. The business account is Marisol's paycheck and the servers and the taxes I just sent. I can do three a month.\"<\/p><p>\"Then six months. They'll take it. They want the first check more than they want the last one.\"<\/p><p>He hung up, and went to the table, and told Claire, before, with the pad open. She wrote <em>−3,000 × 6<\/em> lightly in the margin of February, and looked at it, and said, \"From where.\"<\/p><p>\"The house fund. Through the business.\"<\/p><p>\"Say that again slower.\"<\/p><p>\"I'll have Lena say it.\"<\/p><hr class=\"break\"><p>He rewrote the four parts at night.<\/p><p>Five to seven in the morning and ten to midnight, from the twenty-sixth, at the table, the way he had built Woodshed in the fall of 2023 when Lucy was six and drew him at the computer. The row of days across the top of the family page, from nothing. The counter for credits. The list of open makeup times and how it folded on a phone. The message at the bottom that said <em>Canceled. Credit added.<\/em> He wrote each one in his own names, and his looked like spreadsheets, as they always had, and the row of days in particular looked like something from a payroll system, and he shipped it anyway on Thursday the fifth at six in the morning, and by Friday nobody had written to say the page looked worse, because parents did not look at pages; they pressed the thing that said cancel. Devin's prefix was gone from the site. He searched for it twice to be sure.<\/p><hr class=\"break\"><p>Lena, by phone, Thursday afternoon, in one breath, because he had asked her to say it slowly and she did not have a slow.<\/p><p>\"The company pays the settlement. It's the company's expense, all eighteen, and it comes off the company's income like the servers do. The company doesn't have eighteen to spare, so every month you put three thousand into it from the house fund and we write that down as you putting money into your own company, which is what it is, and the company sends it to Ohio. Six times. Then it stops.\" Paper moved. \"And since it's the same conversation: the election I filed in January is effective the first. From February you're an employee of your own company. Sixty-five hundred a month, gross, through the payroll thing, with a stub, taxes out, the twenty-seventh is the first one. That's the number the company can carry with three thousand going to Ohio and a woman in Fresno on the fifteenth, and it's not a number you argue with me about in March.\"<\/p><p>\"Sixty-five hundred.\"<\/p><p>\"You'll take home about forty-nine. Tell Claire before she reads the stub. I'm told there's a rule.\"<\/p><hr class=\"break\"><p>Friday the sixth.<\/p><p>January had closed Sunday at a thousand and ten, eighty-five eighty-five, the first month since November to go up, and Claire had written it without a word, because the other number was still in the margin.<\/p><p>He read the settlement at the table at seven in the morning, all nine pages, the way he had learned to read a page in January of 2025: for the number, and for what it bought. Eighteen thousand dollars, in six installments of three thousand, the first on signing and the rest on the sixth of each month through July. A full assignment to Fermata LLC of every line Mr. Kowalczyk had written for Nate's products, 2023 to 2024, the two Woodshed Saturdays included, which he had not thought of and Sunil had. A mutual release: nobody would sue anybody about anything before today. No admission by either side that anything had ever been promised. Each side its own lawyer's bill. Sunil's, through the sixth, with the retainer, came to forty-two hundred dollars, which he paid the same morning from the business account, and which was more than the breach had cost him in refunds, as Sunil had said it would be.<\/p><p>Devin signed in Toledo at 5:40 in the evening, his time. The email said so, with a green check beside his name. Nate signed at 2:44 in the afternoon at the kitchen table, with Claire, who had taken the afternoon, standing behind his chair, and Lucy at the Reyeses', and the page took his typed name and put it in a script nobody had ever written by hand, and the green check appeared beside it.<\/p><p>Then the money, in the right order. He turned the laptop. <em>From:<\/em> the house fund. <em>To:<\/em> Fermata LLC. <em>3,000.00.<\/em> Memo: <em>contribution, Feb.<\/em> She read it. He pressed it. Then the business account, to the trust account of a law firm in Columbus, Ohio, three thousand, and she read that, and he pressed it, and it was 2:51.<\/p><p>She took the pad and found <em>−3,000 × 6<\/em> in pencil in the margin where it had been since the twenty-seventh. She went over it in pen, wrote <em>Feb 6<\/em> beside it, and <em>Devin,<\/em> and drew the line under it.<\/p><p>\"That's a debt,\" she said. \"On paper. Finally.\"<\/p><hr class=\"break\"><p>Devin called Saturday at 10:05, and Nate was at Orchard, at the window table, because the house had Lucy's friend Mia in it and a horse game with rules, and Gail had put the coffee down and gone back to the counter without asking how long.<\/p><p>\"It's signed.\"<\/p><p>\"It's signed.\"<\/p><p>He could hear the concentrator. It sounded like a refrigerator in another room.<\/p><p>\"I'm not sorry about the money.\"<\/p><p>\"I know.\" He looked at Alder Avenue, gray and wet, a woman with a dog. \"I'm sorry I promised something I hadn't thought about.\"<\/p><p>Devin didn't say anything for a while. It was not the silence from the platform and it was not the one from this table fourteen months ago. It was a third thing, and neither of them tried to fill it.<\/p><p>\"You took my stuff out.\"<\/p><p>\"Thursday.\"<\/p><p>\"I saw. The week thing looks like a spreadsheet.\"<\/p><p>\"It does.\"<\/p><p>\"Pop asked me if you paid me.\" A breath. \"I said yes. He said, 'Well.'\"<\/p><p>\"How is he.\"<\/p><p>\"Worse. They're talking about the hospital again, and he's not going, and I'm not making him.\" The concentrator. \"That's not yours. I'm just saying it to somebody.\"<\/p><p>\"Okay.\"<\/p><p>\"Okay,\" Devin said, and there was a second where either of them could have said the other thing, the creek bed, the cap, the platform, and neither did, and he hung up.<\/p><p>Nate sat at the window with the coffee until it was cold. Gail came by once and did not take the cup.<\/p><hr class=\"break\"><p>Monday the ninth. He was at the table at 7:10, before the coffee had finished, when Nashville wrote.<\/p><p class=\"note\"><em>Nate, I'm Renee Castellanos, VP of Marketing at Allegro Studio. The ad in December was mine, and I'd like to make a different call. I've watched what you built since the Rondo transition, and I read your post on the ninth twice, and I've read it to my team. We'd love to explore an acquisition.<\/em><\/p>", "words": 1875}, {"num": 51, "title": "Offer", "part": 4, "meta": "February 9–13, 2026 · Quince Court; a Zoom to Nashville", "html": "<p>\"I ran the ad,\" Renee Castellanos said. \"I want that to be the first thing I say, so it isn't the thing you're waiting for.\"<\/p><p>Wednesday the eleventh, eleven in the morning, one o'clock in Nashville. She was forty or so, in a blue sweater, at a desk in front of a brick wall with one framed recital program on it, and she had a coffee she had not touched.<\/p><p>\"I wrote it, I bought the placement, and I had it in Kim Duong's group inside two days of your worst night, and I'd do most things in this job again and that isn't one of them. I'm sorry. I'm saying it once, because if I say it twice you'll stop believing the first one.\"<\/p><p>\"Okay.\"<\/p><p>\"Okay.\" She let it go. \"Tell me about the woman in Fresno.\"<\/p><p>He told her about Marisol. He had not planned to start there, and he understood, while he did it, that she had picked the one thing about his company that a company could not screenshot.<\/p><hr class=\"break\"><p>Monday he had read the email four times before Claire came out of the bedroom, and had said, at 7:20, with her lunch bag in her hand, \"Nashville wants to buy it.\"<\/p><p>\"Buy what?\"<\/p><p>\"The company.\"<\/p><p>She had stood there with the bag. \"Is money moving?\"<\/p><p>\"No.\"<\/p><p>\"Then you don't have to tell me.\"<\/p><p>\"I'm telling you.\"<\/p><p>\"I can see that.\" She had put the bag down, and picked it up. \"Go find out what they mean. Then tell me that. Not the email. What they mean.\"<\/p><p>Tuesday he had written one line, <em>Wednesday at eleven Pacific works,<\/em> and had spent the rest of the day answering forty emails and not thinking about Nashville, which took most of his attention.<\/p><hr class=\"break\"><p>\"Thirteen years,\" Renee said. \"Forty people, one floor, a phone that gets picked up on the second ring, and a product that does everything, and I mean everything, and you need a login to do any of it. Rondo took nine hundred of our teachers in a year. We got about four hundred back in November. You got the rest, and the ones you got are the ones who read.\" She turned her cup and did not drink from it. \"I can tell which of our new signups came from you. They call and ask why there's a password.\"<\/p><p>\"There doesn't have to be.\"<\/p><p>\"I know. I've read your page. I've read your December post more times than you have, probably. I read it to nine people in a room and told them that we could not have gotten that email past our own lawyer in a week, and you sent it at eight in the morning.\" She stopped. \"So here's what I'm going to do. I'm going to say a number, and then I'm going to tell you what it's made of, and you're not going to answer today, because I'd worry about you if you did.\"<\/p><p>He had a card on the table beside the laptop and a pen on it.<\/p><p>\"Four hundred and eighty thousand dollars.\"<\/p><p>He wrote it down. It looked like a phone number.<\/p><p>\"That's about four and a half times what you'll take in this year if nothing changes. It's more than the numbers are worth on their own, and you know that, and I know that, so let's not pretend either way. We're paying for a thousand teachers who've decided they like you, and for you writing our emails instead of yours.\"<\/p><p>\"How is it paid.\"<\/p><p>\"Sixty percent when we sign. The rest in two pieces, at twelve months and twenty-four, tied to how many of your teachers are still with us.\"<\/p><p>\"Still with you.\"<\/p><p>\"Still paying. At a year we count, and at two years we count. A teacher who's paying us counts. A teacher who went to a spreadsheet doesn't. A teacher who quit teaching doesn't, and that one isn't your fault and it counts against you anyway. That's what <em>retained<\/em> means, and I'd rather you hear it from me than find it on page three.\"<\/p><p>\"And if you move them to nineteen in the first month.\"<\/p><p>\"Then a lot of them leave and your second and third checks get small, and that's why we wouldn't, and it's also why you'd be here.\" She said the next part like a person who had said it to other people. \"Two years. Remote is fine; half of us are. A week in Nashville each quarter, and we fly you. You'd run the family side. The portal, the policy pages, the parents. Your name stays on the product about a year, and then it's ours. Salary is a separate conversation with somebody who isn't me, and it would be a real one.\"<\/p><p>\"And Marisol.\"<\/p><p>\"We'd talk about her. I'm not promising you anything about a woman I haven't met, and you'd think less of me if I did.\"<\/p><p>\"And the nine dollars.\"<\/p><p>\"Would be nineteen eventually. Not the first year. I won't tell you it stays nine, because it wouldn't, and you'd know I was lying, and then nothing else I said would count.\"<\/p><p>He looked at the card. Four hundred and eighty. Sixty. Two years. Nineteen.<\/p><p>\"I'll have it in writing by Friday,\" she said. \"Read it with somebody. And Nate. I meant the first thing.\"<\/p><hr class=\"break\"><p>He did the arithmetic that night at the kitchen table after Lucy was down, on the card, in a column, because a column was the only way he had ever been able to look at a number that size without it looking back.<\/p><p>Four hundred eighty, times sixty percent. Two hundred eighty-eight thousand dollars, at the signing, before taxes, and Lena would have a sentence about taxes that he did not want to hear yet. The other hundred ninety-two in two checks of ninety-six, a year apart, if a thousand teachers stayed with a company that had sent them a coupon on his worst night. He did not write anything beside the ninety-six.<\/p><p>Then the other column. The house fund, which he would look at Friday, when the number was real, and which he already knew was about twenty-two. The five installments still to go to Columbus, three thousand each on the sixth of March, April, May, June, and July: fifteen. Twenty-two minus fifteen was seven, and seven thousand dollars was a number his father had once kept in a coffee can.<\/p><p>Two hundred eighty-eight, beside seven.<\/p><p>Claire came in from the bath with her hair up and the mystery under her arm and saw the column and sat down across from him, and he turned it so she could read it.<\/p><p>She read it for a while.<\/p><p>\"Say it.\"<\/p><p>\"Four hundred eighty thousand. Two eighty-eight up front. The rest over two years if the teachers stay. Two years working for them. Nashville four times a year.\"<\/p><p>\"That's more than both of us have made since—\"<\/p><p>\"Two years. Both of us together. About.\"<\/p><p>She picked up the pad, and did not open it to February, and wrote <em>480<\/em> on the inside of the cover, small, in the corner, where it was not a line and not a month and had not happened.<\/p><p>\"I'm not going to say anything tonight,\" she said. \"I'm going to look at it. So are you. Not the number. Me.\"<\/p><p>He looked at her. She had a towel around her neck and a book about a detective, and she had just written a number on the wrong page of the pad on purpose so that it would not be on the right one, and he understood that this was what she had for him tonight and that it was a lot.<\/p><hr class=\"break\"><p>The PDF came Friday the thirteenth at 9:10 in the morning. <em>Indication of Interest. Non-binding.<\/em> Four pages. The numbers were her numbers, in the order she had said them, in a font that made them look like they had been true for years.<\/p><p>Then the things she had not said, on page three. <em>Retained<\/em> was a paragraph, and it meant what she had said it meant, and it also meant that a teacher who paused for the summer and came back in September was a question mark for a lawyer. A promise not to build anything for music teachers for three years after he left. The company's name for the thing he did: <em>Product Lead, Family Experience,<\/em> which he read and could not hear Yolanda say.<\/p><p>He looked at the house fund at 9:30, which he had been not doing since Monday. Twenty-two thousand dollars, even. The first three had gone to Columbus on the sixth and half a month had gone by with no paycheck, and the first one from his own company was the twenty-seventh. It was the lowest the number had been since he had started writing it down, and in August of 2023 it had been forty-one, with the Civic still alive.<\/p><p>Two hundred eighty-eight thousand was thirteen of it.<\/p><p>He shut the laptop and answered the email until noon, because Marisol had left nine for him and they were real.<\/p><hr class=\"break\"><p>Renee called at three, five her time, and did not do a preamble.<\/p><p>\"Did it land?\"<\/p><p>\"It landed.\"<\/p><p>\"Anything on it you didn't hear from me?\"<\/p><p>\"The three years.\"<\/p><p>\"That's standard. It's also negotiable, and I just told you that, which my CEO would rather I hadn't.\" Paper, on her end. \"So I'm going to ask you where you are, and you're allowed to say nowhere.\"<\/p><p>He was at the kitchen table. Lucy's spelling list was under his elbow, <em>February<\/em> on it, with the <em>r<\/em> she kept losing. The pad was on the microwave with a number in the corner of its cover.<\/p><p>\"I need a week.\"<\/p><p>Nothing, for a second, on the line to Nashville.<\/p><p>\"Then take a week,\" she said. \"Friday the twentieth. I'll call you at three, and if it's no, it's no, and I'd like to hear why, because I'll learn something. Thank you for not saying yes today.\"<\/p><p>She hung up. He held the phone a while after.<\/p><p>He had never said that sentence to anyone. He had said <em>okay<\/em> to Ben Sattler for six years. He had said <em>okay<\/em> to Halyard's offer in 2017 without reading the part about inventions, and <em>okay yes<\/em> on the cobbles to Devin, and <em>sure<\/em> to Kim about a banner, and <em>I'll think about it<\/em> to a hundred people, which was a way of saying yes slowly. He had asked a woman in Nashville, with half a million dollars on a PDF, for seven days, in four words, and she had said take them.<\/p><p>A week was the twentieth. He wrote it on the card under the two columns, and then, because the card was not where things went anymore, he took the pad down from the microwave and wrote it on the February page, on a line of its own, where it had happened.<\/p>", "words": 1827}, {"num": 52, "title": "Kitchen Table", "part": 4, "meta": "February 14–17, 2026 · Quince Court; Persimmon Lane; the creek trail", "html": "<p>Lucy's card for him had a horse on the front and, inside, in the handwriting of someone who had been told to slow down, <em>Happy Valentines Day Dad you are good at computers and dishes.<\/em><\/p><p>\"Both of those are true,\" he said.<\/p><p>\"Mom's says she's good at reading and being the boss.\"<\/p><p>\"Also true.\"<\/p><p>\"I made twenty-six for school and I only had to make two today, so I did the horse for a long time.\" She looked at the horse. \"The leg's wrong.\"<\/p><p>\"Horses have hard legs.\"<\/p><p>\"That's what Yolanda says about the left hand.\"<\/p><p>Claire had brought a pizza home from the place on Alder Avenue in a box that steamed the car windows, and they ate it on the couch with the horse card standing up on the coffee table, and nobody said Nashville. The PDF was in the laptop in the kitchen. The pad was where it lived, with the number still inside the cover. At nine, when Lucy was down, Claire put her feet in his lap and said, \"Not tonight,\" and he said, \"No,\" and they watched half a movie about a wedding in Italy. It was a good Valentine's Day. It cost twenty-four dollars, which he knew because he had looked at the receipt the way he looked at everything now, and had then put it in the drawer with the takeout menus instead of on the pad.<\/p><hr class=\"break\"><p>Jonah called Sunday at four, because Nate had texted him Saturday, <em>Got an offer. Can I ask you a thing,<\/em> and Jonah had written back, <em>Sunday. I have a life now, it's very disorienting.<\/em><\/p><p>\"How much.\"<\/p><p>\"Four eighty. Most of it up front, and two years working for them.\"<\/p><p>\"Jesus, Nate.\" A kitchen, on his end. A dishwasher. \"Okay. I'm going to say the obvious thing and you're going to be annoyed, and then I'm going to say it again. Take it.\"<\/p><p>\"That's the obvious thing.\"<\/p><p>\"That's the obvious thing. You've done the hard part. The hard part was the first two hundred and the breach and whatever Devin was, and you did those. Let somebody else do the boring part. The boring part is the next four years, and it's the same thousand teachers and a phone bill from Twilio and a woman in Tucson who wants a printout.\" The dishwasher changed cycles. \"I'd have gotten eleven months of revenue if I'd found a buyer, and I said so, in that room, in front of you. You're getting four and a half years, and you called me to ask if that's enough.\"<\/p><p>\"I called you to ask what it was like.\"<\/p><p>\"What what was like.\"<\/p><p>\"After.\"<\/p><p>Jonah was quiet, which cost him something.<\/p><p>\"I'm home at six. I have a dentist, an actual one, with a chair. I was right about maybe a third of what I said in that room for six years, and I've been keeping a list, and the third I was right about was mostly the part about charging.\" He laughed at himself, once. \"It's a job, Nate. You've had a job. You were fine at a job. Two years remote with a Nashville badge is a job with a check at the front of it, and the check's bigger than anything you're going to make at the kitchen table, and you know it, because you've done the column.\"<\/p><p>\"I did the column.\"<\/p><p>\"And?\"<\/p><p>\"And I was fine at a job.\"<\/p><p>\"That's the face,\" Jonah said. \"I can hear it from here. It's fine. I'd still take it.\"<\/p><hr class=\"break\"><p>Monday was Presidents' Day, and Yolanda did not start until 2:30, and she said noon, and he went.<\/p><p>She was at the Clavinova with a cup of tea and the brace on her right hand, at noon, in daylight, which it had not been in September.<\/p><p>\"Some days it's a day thing now,\" she said, before he could look at it. \"Don't write it down. Sit.\"<\/p><p>He sat in the corner chair and told her, all of it, down to the lawyer in Ohio the money was still going to.<\/p><p>She listened to all of it without a face, which was how she listened to a child play a piece the second time.<\/p><p>\"Four hundred and eighty thousand,\" she said. \"That's a quarter of what this house is worth, if the Wongs are right about the street, and I'm not selling that either. So.\" She turned the tea. \"What would they do with my students?\"<\/p><p>\"They'd keep the pages. They'd keep the credits. The price goes to nineteen in a year or two.\"<\/p><p>\"That's what they'd do with the list. I asked about my students.\" She looked at the whiteboard, thirty-four names in four colors. \"The Nguyens cancel on rain. Mrs. Ruiz needs to be told twice and thanked once. A company doesn't know that, Nathaniel. A company puts you on hold with Vivaldi and calls it support.\"<\/p><p>\"They have forty people.\"<\/p><p>\"I have thirty-four families and two hands, and I know which ones are which.\" She flexed the right one inside the strap, once, and stopped. \"You wrote me a page in April of 2024 that said what I couldn't say. I paid you seventy-nine dollars for it and told you we were square. If you sell it, I'd like to know who I'm square with.\"<\/p><p>He did not have an answer, and she did not wait for one; the Monday four o'clock's mother was already in the driveway, early, and Yolanda said, \"Go home. Ask your wife. She's the one who does the arithmetic out loud.\"<\/p><hr class=\"break\"><p>Tuesday at 4:31 they left Lucy at the side door with her music and walked to the creek, because a lesson was thirty minutes and the trail was right there and neither of them had suggested the kitchen table.<\/p><p>The creek was up. It had rained four days out of the last seven, and the water went over the cobbles brown and fast under the footbridge and made a sound of its own under the sound of 85 behind the trees, which was the larger sound and always would be. Claire had on her school clothes and sneakers from the car. They walked upstream, toward the park, on the paved side.<\/p><p>\"Okay,\" she said. \"I've looked at it. Your turn. What would we do with it?\"<\/p><p>He had done this column too, on Sunday night, and he said it the way it was.<\/p><p>\"Two eighty-eight before taxes. After, call it two hundred and some. A condo in Sunnyvale, two bedrooms, is about a million now. Two hundred down. The payment on the rest is more than the rent. So we'd own a condo in Sunnyvale that we could afford for exactly as long as I work for Nashville, which is two years, and then we'd be a family with a mortgage and a guy looking for a job at thirty-seven in a market I've watched.\"<\/p><p>\"That's the honest one.\"<\/p><p>\"That's the honest one.\"<\/p><p>\"I've done it too. Twenty-two thousand in the fund, and fifteen of it is Ohio's through July. I know what two eighty-eight looks like next to that. I've known since Wednesday, and I've been walking around a classroom with it.\" She kept walking. \"And the dryer.\"<\/p><p>\"We can buy a dryer without selling anything.\"<\/p><p>\"We've said that for three years.\"<\/p><p>The water went under the bridge. A man went by with a dog that wanted the creek and was not allowed the creek.<\/p><p>\"Then that's the money,\" she said. \"What's the other side? Not Yolanda's side. Not Jonah's. Yours. What do you lose?\"<\/p><p>He walked a while. He knew the shape of it and not the words, and he had known that since Friday at three, holding a phone.<\/p><p>\"The thing I just learned to do.\"<\/p><p>\"Say it in a sentence.\"<\/p><p>\"I ask people for things now.\" It came out plain, and he kept going, because it was true and there was nobody on the trail. \"I couldn't ask Devin for a piece of paper for a year. I couldn't tell you what the whale server cost. I asked Renee for a week on Friday and I've never once said that to anybody. I learned it at that table, with the pad, and with Lena yelling, and Sunil, and a woman in Tucson telling me I was one guy. It's the only place I ever learned it. If I sell it, I go back to being a man who says okay, with a badge, and I'd be good at it, and I'd be that.\"<\/p><p>Claire did not say anything for a hundred yards.<\/p><p>\"Then don't sell.\" She said it to the path. \"But you don't get to be a martyr about it either. You don't get to keep a thing that pays a woman in Fresno and a lawyer in Palo Alto and Ohio, at nine dollars, and call that a decision. If it's worth four hundred eighty thousand dollars to them, it's worth more than nine to a teacher. Raise the price.\"<\/p><p>\"Fourteen.\"<\/p><p>\"Why fourteen?\"<\/p><p>\"You'll see it in the email.\"<\/p><p>She looked at him sideways, and he saw her decide not to make him say it on the trail.<\/p><p>\"Tonight,\" she said. \"And Nashville?\"<\/p><p>\"Friday. After they've seen the price. Four sentences.\"<\/p><p>It was 4:52. They turned around at the bench where the trail bent, and walked back down with the water going the same way, faster than they were.<\/p><hr class=\"break\"><p>He wrote it on the phone, on the couch, at 9:15, with Claire beside him reading over his shoulder and not helping, which she had said was the deal.<\/p><p>Subject first. <em>A price change (not for you).<\/em> She read that and said nothing.<\/p><p>Then the price. Fourteen dollars a month, one twenty-nine a year, for anyone new from Wednesday. Then the part he had typed three times: anyone already paying kept their price through December 31, and he would write again in the fall before it changed.<\/p><p>\"Where's the why?\"<\/p><p>\"I was getting there.\"<\/p><p>\"You were getting to the end. Two sentences. Plain. Not sorry.\"<\/p><p>He typed two sentences. One was about thirty cents. One was about Marisol. She read them and did not cut either, and put her chin on his shoulder.<\/p><p>\"Six o'clock,\" she said.<\/p><p>\"Six.\"<\/p><p>He saved it, and did not press anything, and put the phone face down on the coffee table beside the horse with the wrong leg, and it was a draft, and it would be a draft until morning.<\/p>", "words": 1751}, {"num": 53, "title": "Fourteen Dollars", "part": 4, "meta": "February 18–28, 2026 · Quince Court", "html": "<p>At 5:58 he had it open on the phone, standing at the counter with the coffee not made yet. At 6:00 he pressed it, and it went to 1,031 paying teachers and 58 on trial and the pricing page all at once, and the kitchen did not change.<\/p><p class=\"note\"><em>Subject: A price change (not for you)<\/em><\/p><p class=\"note\"><em>Starting today, Fermata is $14 a month or $129 a year for anyone new. If you already have an account, paid or on trial, your price doesn't change through December 31, 2026, and I'll write to you in the fall before it does.<\/em><\/p><p class=\"note\"><em>Two reasons. On a $9 charge the card company keeps 56 cents, and 30 of those cents are the same at any price, so at $9 it was taking six percent of every month and at $14 it takes five. And since November there are two of us answering your email, Marisol in Fresno and me, and $9 was a price for one person at a kitchen table.<\/em><\/p><p class=\"note\"><em>Nothing else changes today. Nate<\/em><\/p><p>Then he made the coffee, because the next forty minutes were going to be nothing, and he had learned in June of 2024 that nothing was easier to stand with a cup in his hand.<\/p><p>He had asked for something. Not a favor, not a week. Money, from strangers, in figures, at six in the morning, with his name at the bottom and no sorry in it. It was under a hundred and twenty words, and it was the thing Claire had said she had never seen him do, at this table, with four cards laid out like a hand, and he had done it now twice.<\/p><hr class=\"break\"><p>Carol Ng, 6:41. <em>It's still not nineteen. Leave me alone.<\/em> He read that as a yes.<\/p><p>Diane Foyle, 7:05. <em>I paid the year in August. So August is still seventy-nine? I want to hear it from you and not the page.<\/em> He wrote <em>Yes. August is seventy-nine. The page says so too,<\/em> and did not add anything.<\/p><p>A teacher in Boise on the annual plan, 7:20, six words: <em>Good. You were leaving money on the table.<\/em> A teacher he did not know, 7:26, on trial since Thursday, canceled without a note. A second one at 7:40, on trial since Monday, with a note: <em>not paying 14 for something I haven't tried,<\/em> which was true, and which the email had said she did not have to.<\/p><p>Marisol's morning note came at 8:00, as it did, in her order.<\/p><p class=\"note\"><em>Nate. Forty-one replies by eight. Nine are questions and I've answered seven; the two for you are below. Thirty-two are nothing you need to read; I'd call them fine. Two cancellations, both trials from the last week, neither had put a student in. Theresa Molina wrote one line: \"About time.\" I'm not counting that as a question.<\/em><\/p><p>He read <em>About time<\/em> from a woman who had shouted at him for four minutes in December, and put the phone down, and answered the two that were his.<\/p><hr class=\"break\"><p>Kim, 9:10, in the texts, which she still used for the things she did not want in the group.<\/p><p class=\"note\"><em>You should have done this a year ago.<\/em><\/p><p>Then, before he could answer: <em>I've been telling people to pay you nine dollars for two years and feeling like I was underselling them. Fourteen's a price. Nine was an apology.<\/em><\/p><p>Then: <em>The banner's five hundred this year. That's not related.<\/em><\/p><p>He wrote <em>Okay<\/em> to the first two and <em>Okay<\/em> to the third, and she sent a thumbs-up, and that was the whole conversation, and he thought it might have been the best review he had ever gotten.<\/p><hr class=\"break\"><p>Friday the twentieth he wrote the four sentences at the kitchen table at 2:30, and at 2:40 he read them out loud to Claire, who had come home early on purpose and was standing at the counter with her coat on.<\/p><p>He read them the way he had written them, one at a time.<\/p><p>\"<em>Renee, thank you for the offer, and for the week, which I needed more than I knew.<\/em>\"<\/p><p>\"Yes.\"<\/p><p>\"<em>I'm not going to sell Fermata, and it isn't the number; I found out this week that I'd say no to a larger one, which I didn't know on Wednesday.<\/em>\"<\/p><p>\"That's a semicolon.\"<\/p><p>\"It's a semicolon.\"<\/p><p>\"You've never used one in your life. Keep going.\"<\/p><p>\"<em>You'll have seen that I raised my price on the eighteenth, and that was the other half of the same answer.<\/em>\"<\/p><p>She nodded.<\/p><p>\"<em>I'd like to keep talking with you, because we share a lot of teachers, and they'll call whichever of us picks up, and I'd rather that be a conversation between us than an ad.<\/em>\"<\/p><p>Claire did not say anything for a second.<\/p><p>\"The last one's a little proud.\"<\/p><p>\"It's true.\"<\/p><p>\"I know it's true. Send it.\"<\/p><p>He sent it at 2:48, so that it would be in front of her before three, because a no ought to be in writing before it was a voice, and at 3:04 the phone lit with Nashville on it, and it was an email, not a call.<\/p><p class=\"note\"><em>Got it. I'm in a room until six. I'm going to answer this properly, not fast, and that'll take me a few days. Thank you for the four sentences; most people need a page. R.<\/em><\/p><p>Claire read it over his shoulder with her coat still on.<\/p><p>\"She's good,\" she said.<\/p><p>\"She's good.\"<\/p><p>\"That's not the same as done.\"<\/p><p>\"No.\"<\/p><p>She took her coat off, then, and hung it up, and went to the pad and wrote <em>Feb 20. Allegro: no,<\/em> on its own line, and drew the line under it, and put the pad back on the microwave, and that was the week.<\/p><hr class=\"break\"><p>The two weeks went by threes and twos, which he knew how to count now.<\/p><p>Eleven cancellations by the twenty-eighth. Four were trials that had never put a student in. Three were from the Rondo October. Two of those three wrote to say they were tired of being nickel-and-dimed, at a price they were not paying and would not be until 2027; he answered both with their name first and the sentence from the email, and one of them wrote back <em>oh,<\/em> and did not come back. Two were teachers he had never heard of, from states he had to look up. Bev Ostrowski called, at 9:25 in the evening, to say that she was not going to cancel, and to ask whether <em>anyone new<\/em> included her sister-in-law. He said yes. She said, \"Then I'll tell her fourteen and she can decide,\" and hung up, and did not cancel, which he did not count.<\/p><p>The number he watched was the second line on the dashboard, the trials that turned into a card. It had said forty-one out of a hundred all of last year. Wednesday the twenty-fifth it said thirty-eight. He looked at that for most of a morning and did not change anything, because there was nothing on the page to change except the price, and the price was the point. Saturday the twenty-eighth it said thirty-nine, and he closed the laptop before it could think about it.<\/p><p>On Marisol's Friday note, one line: <em>Nine of December's 74 are back since January. None with a note. None asked what the price was; they've still got theirs, and I told the two who wondered.<\/em><\/p><p>The stub from the payroll service came Friday the twenty-seventh and said what Lena had said it would. Claire had known the number since the fifth, so there was nothing on it to tell, and he told her anyway, at the counter, and she said, \"I know,\" and took a picture of it for the drawer.<\/p><p>February was going to close Sunday at a thousand and sixty, ninety-one hundred, the first month over nine thousand, and Claire would write it, and he was not going to say a word about fourteen dollars having done that, because it had not. Fourteen dollars had been in the world for ten days. The thousand and sixty were mostly people who had decided about him in December and taken until now to say so.<\/p><hr class=\"break\"><p>Renee's answer came Friday the twenty-seventh at 4:40 in the afternoon, with Lucy at the table drawing a horse that had learned to stand.<\/p><p class=\"note\"><em>Nate. I've had your email open all week and wanted to answer it the way it deserved, which is not from a phone in a parking lot. Thank you for the no, and for the why. I read the why to the same nine people, and one of them said, \"That's the one we should have hired in 2024,\" and she wasn't wrong. I saw the fourteen dollars. It was the right call, and you'll hear that from people who like you less than I do. The offer doesn't stay open forever, but the door does, and if the year goes somewhere you didn't plan, I'd like to be the first call and not the last. We'll keep in touch. Renee.<\/em><\/p><p>He read it once, and it was a good email from a person who wrote good emails, and he felt the thing he had felt on the trail, which was that he had said no to a decent person for a reason he could say out loud.<\/p><p>He read it a second time for the door, which was open, and which he understood he would think about in a bad month.<\/p><p>He read the last sentence a third time by itself, with Lucy's marker going on the table beside him. <em>We'll keep in touch.<\/em> She had been in touch in December. Touch was a screenshot with a coupon on it, a day and a half after his worst night. She ran the marketing for forty people, and she had a year of his prices and a copy of his page and nine people in a room who had heard his post twice, and she was telling him, in the nicest sentence she owned, that the next thing he saw from Nashville was not going to be addressed to him.<\/p><p>\"Dad,\" Lucy said. \"Is the leg right now?\"<\/p><p>He looked. It was.<\/p><p>\"It's right,\" he said, and closed the laptop, and did not tell Claire about the last sentence until Sunday, when there was a pad to say it to.<\/p>", "words": 1725}, {"num": 54, "title": "Family Hub", "part": 4, "meta": "March 2–13, 2026 · Quince Court; a diner in San Jose; Persimmon Lane", "html": "<p>Carol Ng put it in the group at 7:05 Monday morning, which was how he learned that Allegro Studio had a press office.<\/p><p><em>They've got your page,<\/em> she wrote, over a link, and under the link four screenshots that somebody in Nashville had made on a very clean phone.<\/p><p class=\"note\"><em>Introducing Family Hub. No logins. No apps. Your studio policy, public and clear. One tap to cancel; credit applied automatically. Because families shouldn't need a password to miss a lesson.<\/em><\/p><p>He looked at the screenshots at the counter. A row of seven days across the top with the lesson lit. A number in a pill that said how many credits a family had. A list of open times. A button that said <em>Cancel this lesson,<\/em> and under it, in gray, what the policy would do if you pressed it. At the bottom of the page, where his said <em>made with Fermata<\/em> in gray, theirs said <em>Powered by Allegro Studio<\/em> in blue, and it was the one line on the page he could not have written.<\/p><p>It was good. That was the first thing. It was his page, done by people who knew where a button went, and the row of days did not look like a payroll system.<\/p><p>Under Carol: <em>Is this the same thing?<\/em> from a teacher in Fresno. <em>Nate, are you worried?<\/em> from Diane Foyle, at 7:30, with a question mark and no second sentence, which Diane did only when she wanted to know.<\/p><p>He did not answer in the group. He read all of it, and then read the press release, which used the word <em>families<\/em> eleven times and said that Family Hub was included at nineteen dollars a month, and that teachers switching from <em>other tools<\/em> could bring their credits.<\/p><p>Then he answered the email, thirty-one messages, and did not think about a blue line for as long as an hour.<\/p><hr class=\"break\"><p>Marisol's Friday note, at 8:00.<\/p><p class=\"note\"><em>Nate. Six teachers asked me this week whether you're worried. I told each of them I'd ask you. I'm asking you.<\/em><\/p><p>He wrote back one word, <em>Yes,<\/em> and then, because she had earned the second one, <em>I'll write something Sunday. Tell them that.<\/em> At 8:10 he sent three thousand dollars to Columbus, in the right order, which took ninety seconds and was not a conversation.<\/p><hr class=\"break\"><p>Marcus's text had come Thursday. <em>Wedding Saturday. San Jose. Done by ten thirty if the best man can read. Eggs after. You're buying. I hear you're rich.<\/em><\/p><p>The diner was on The Alameda and had been open since before either of them, and at 10:55 on Saturday night it had a cop, two nurses coming off a shift, and Marcus Tillman in a tuxedo shirt with the tie in his pocket and the trumpet case on the seat beside him like a passenger.<\/p><p>\"Best man could read,\" he said. \"Bride's father couldn't dance. Two hundred people, the hotel by the arena, and they wanted 'September' three times, which is the contract, so.\" He ordered eggs over medium and bacon without looking at anything, and Nate got coffee. \"So. Four eighty, and you said no.\"<\/p><p>\"I said no.\"<\/p><p>\"Tanya's going to want the why. Not the money why. She does the money at our house. The other why.\" He put both hands flat on the table. \"Go.\"<\/p><p>Nate told him. The trail, shorter. The thing he had learned at the table and could not take with him to Nashville.<\/p><p>Marcus listened to the whole of it, and the eggs came, and he did not touch them until Nate was done.<\/p><p>\"Okay. That's a good why. I'll give her that one.\" He ate. \"Now the other thing. Monday. The page.\"<\/p><p>\"You saw it.\"<\/p><p>\"Everybody saw it. Jaden's mother sent it to me at seven in the morning with three question marks. Sent me a screenshot of a page that looks like your page and asked me if I was going to switch to it.\" He pointed the fork at Nate. \"You know what I told her?\"<\/p><p>\"No.\"<\/p><p>\"I told her a man with forty people built the door I already had. And then I asked her who she thought was going to pick up when she called the number on that door at 7:30 on a Tuesday, and she said she didn't know, and I said, right, and neither do I.\" He put the fork down. \"They copied the door, Nate. What they can't copy is you picking up.\"<\/p><p>Nate looked at the coffee.<\/p><p>\"You think I'm making you feel better. I'm not in that business at eleven at night in a tux.\" Marcus took a piece of bacon.<\/p><p>\"They've got forty people.\"<\/p><p>\"They've got forty people and not one of them's calling a teacher in Tucson at 7:30 in the morning, because a company can't. Their word is <em>scale.<\/em> I teach trumpet. I know what scales are; they're the thing you do instead of playing.\" He finished the eggs. \"That woman with the list. Phone, printouts, one guy. You fixed one guy. You've got a woman in Fresno now, and I've talked to her, and she starts every email with my name, which I noticed. The printouts you'll get to or you won't. The phone you already have; it's just you, and it doesn't scale, and that's the only reason you're sitting here.\"<\/p><p>\"So I don't build anything.\"<\/p><p>\"You build what somebody asks you for. You don't build a thing this week because Nashville put a blue line on a page.\" He pulled the tie out of his pocket and looked at it and put it back. \"Post it. Sunday. Say what you've got, and don't say a word about what they've got, because they've got a press office and you've got a Sunday.\"<\/p><p>The check was twenty-six dollars and Nate paid it. Marcus said, \"Rich,\" and they stood on The Alameda for a minute with the trucks going by, and Marcus said, \"It's almost Sunday, and it's March. You thinking the email was the mistake?\"<\/p><p>\"No.\"<\/p><p>\"Then I was wrong. Write it down.\" He picked up the case and got in his van.<\/p><hr class=\"break\"><p>He wrote it at the table Sunday morning, before the pad, and posted it in the group at 9:10.<\/p><p class=\"note\"><em>Allegro shipped a family page on Monday. If you've seen both, you know it looks a lot like ours, and that's allowed; a door is a door. Six of you asked Marisol this week if I'm worried. Yes.<\/em><\/p><p class=\"note\"><em>Here's what Fermata is in March 2026, so you can decide with the facts. About eleven hundred teachers. Two people: me, and Marisol Ochoa in Fresno, who answers your email by nine in the morning with your name at the top. One December that you all watched me handle in public, that some of you left over, and that nine of you have come back from since. Fourteen dollars, or nine if you were here first.<\/em><\/p><p class=\"note\"><em>I'm not building anything this week to make a point. I'm going to answer the email. Nate<\/em><\/p><p>Kim put a thumbs-up on it, which she did about twice a year. Carol wrote <em>Fine.<\/em> Diane wrote <em>Okay,<\/em> with no question mark, and he took that as the answer to Monday's.<\/p><p>Claire read it from the doorway with her coffee, and then, under February on the pad, a thousand and sixty, ninety-one hundred, written since last Sunday, she added a line in his words, <em>Allegro: door,<\/em> and he let her.<\/p><hr class=\"break\"><p>Yolanda said Friday, noon, the studio, and to bring nothing, and he brought nothing.<\/p><p>She had both braces on, at noon, in daylight, and she was at the whiteboard with the green marker when he came in, and the board said thirty-four names in four colors, and beside fourteen of them there was a small green dot.<\/p><p>\"You're thirty-five tomorrow,\" she said, without turning. \"Lucy told me Tuesday. Twice. There's a card, and I'm not allowed to say what's on it, and it's a horse.\"<\/p><p>\"It's usually a horse.\"<\/p><p>\"Sit.\"<\/p><p>He sat in the corner chair. She capped the marker and turned around and held her right hand in her left, in the strap, and looked at him the way she looked at a parent who was going to hear a number.<\/p><p>\"I'm cutting to twenty.\"<\/p><p>He did not say anything.<\/p><p>\"Not Saturdays. Saturdays were December. Twenty. Four afternoons, shorter, and that's what these will do.\" She lifted the hands an inch and put them back. \"In May I called it a rest. This isn't a rest. It's a cut, and I've written the fourteen down, and I've cried about it once in this room, on Tuesday, after your daughter, and I'm done with that part.\"<\/p><p>\"Where do they go?\"<\/p><p>\"That's what I'm telling you. I asked you in September what happened to my students' accounts if I stopped, and you stood at that door and didn't have one, and I let you.\" She did not come away from the board. \"Fourteen families. Their credits, their pages, the Nguyens' half hour with no end on it, two years of what they've paid me and what I owe them, with my name over all of it. They go to a teacher I pick. My name comes off. Theirs goes on. Nothing gets lost, and nothing gets typed twice by a mother in a driveway, and I don't make fourteen phone calls, because I've made one, on Tuesday, to Trish Nguyen, and I am not doing it thirteen more times.\"<\/p><p>\"On the page.\"<\/p><p>\"On the page. Where I could raise my rate. Where I couldn't say it with my mouth, and said it anyway.\" She looked at the fourteen dots. \"Kim says there's a girl in Sunnyvale with eighteen students and room in her week, who came to your table in August and signed up and never turned it on. I'd like to meet her. I'd like to meet her with a page in my hand that says what she's getting, and not a story.\"<\/p><p>\"Yolanda.\"<\/p><p>\"I know what I'm asking. You've got a company in Nashville with a blue line and a lawyer in Ohio and a woman in Fresno and a daughter with a card. I read the group. I know what your week is.\" She put the marker in the tray. \"I need you to help me hand them off, Nathaniel. Not in June. The Nguyens are in the studio Monday, and I'd like to be able to tell them where they're going.\"<\/p>", "words": 1746}, {"num": 55, "title": "Transfer", "part": 5, "meta": "March 16 – April 3, 2026 · Sunnyvale; Persimmon Lane; Quince Court", "html": "<p>The upright stood against the wall that Ana Solis's apartment shared with 2B, and at 12:40 on a Wednesday, while Yolanda was still choosing a chair, somebody on the other side of it knocked twice, not hard, like a person knocking on a door he had knocked on before.<\/p><p>\"That's Mr. Dao,\" Ana said. \"He's fine. He just likes me to know he's home.\"<\/p><p>The studio was the living room. A Kawai upright with a folded towel under the pedals, a keyboard on a stand by the window, a card table with a printer on it, a rug that had been bought for the neighbors and not the room. Eighteen students came through the door four afternoons a week and played their scales into Mr. Dao's wall. Ana was twenty-nine and had a cardigan on in March, and she had not sat down since she opened the door.<\/p><p>Yolanda sat. She had the brace on her right hand and a single sheet of paper in her left, and she put the sheet on the card table and turned it to face Ana.<\/p><p>\"That's what you're getting. Not a story. Fourteen families. The day they come, the child's name, what they pay me, what I owe them. Nine credits open across all of them. The Nguyens have one with no end on it, and that's my fault and his, and it moves with them.\"<\/p><p>Ana read the page the way she had read his laptop in August, like a form she was going to be asked to sign.<\/p><p>\"They've had your rule for two years,\" she said. \"Before nine in the morning. Mine says twenty-four hours. I typed it into his free thing a year ago and never sent it to anybody.\"<\/p><p>\"Then whose page do they get?\" Yolanda asked Nate, without turning.<\/p><p>\"Hers. Whatever it says the day they say yes.\"<\/p><p>\"And if I say nine?\" Ana said. \"Like yours?\"<\/p><p>\"Then say nine.\"<\/p><p>\"I've never charged anyone for a missed lesson. Not in four years. If I start with your families, they'll think—\" She stopped. \"And if they leave?\"<\/p><p>\"Some will,\" Yolanda said. \"Ask him. He has the number.\"<\/p><p>\"Two,\" Nate said. \"Maybe three. It's usually two or three.\"<\/p><p>Ana looked at the nine credits. \"I can't take a lesson somebody paid you for.\"<\/p><p>\"You're not taking it. You're honoring it, and I'm paying you for it. What's your rate?\"<\/p><p>\"Forty-eight.\"<\/p><p>\"Nine at forty-eight is four thirty-two. I'll bring a check on the thirtieth.\" Yolanda stood, which took her a second longer than it used to. \"And stop apologizing to me. You're going to have to stop with them too, and I'd start now, while it's just the three of us and Mr. Dao.\"<\/p><p>On the other side of the wall a television came on, low, and Ana said, \"Sorry,\" and heard it, and did not say it again.<\/p><p>At the door she asked the other question, the one she had been holding since the check.<\/p><p>\"What do I say when the first one texts me? The first time it's after nine, and it's one of yours, and she says the baby's sick.\"<\/p><p>\"Nothing,\" Yolanda said. \"You'll want to. Don't. The page has already said it, and it said it nicer than you would have.\" She put her hand, the braced one, on the door frame. \"I answered those texts for thirty years, at ten at night, in my kitchen. You're not going to. That's what you're getting. The fourteen are just how it comes.\"<\/p><hr class=\"break\"><p>He built it in two weeks at the kitchen table, and the second week Claire stopped asking what it was and started asking when.<\/p><p>The teacher's side was one screen. Her families, a box beside each, a button that said <em>Offer.<\/em> The family's side he wrote four times. A page from a signed link, in plain words: Yolanda Beck was offering your lessons to Ana Solis, in Sunnyvale, on this day, at this rate, under this policy, and the rate and the day and the policy printed there were Ana's. Under that, a list of exactly what would move if they said yes. Two years of lessons. The credits, by count. The one line of notes with the family's own words in it. Two buttons: <em>Yes, move us.<\/em> <em>Not yet.<\/em> Nothing moved on <em>Not yet.<\/em> Yolanda saw the <em>Not yet<\/em> and no reason, and no reminder went out behind it.<\/p><p>Claire came and read it on the Thursday, the way she read everything he was about to send.<\/p><p>\"What moves?\"<\/p><p>\"What the family can already see on their own page, and only if they press yes on it. Not before. Not for her. Nothing Yolanda ever wrote about them that they can't read themselves.\" He scrolled to the bottom, where it said, in gray, that Yolanda would keep a copy of the history for her own records, because she had taught the lessons. \"Not this time.\"<\/p><p>Claire did not say anything about April of 2024, and neither did he, and she went back to her forty pages.<\/p><p>Yolanda asked to see it the other way around, Thursday at 7:40, after her last child, from the parents' chair, on her own phone, as Trish Nguyen. He sent her the link and watched her read the page with her glasses on, all of it, the two years, the credit, the line she had typed herself, Ana's name and Ana's nine o'clock, and get to the two buttons and stop.<\/p><p>\"Not yet,\" she said. \"Not <em>no.<\/em>\"<\/p><p>\"Not yet. If they never press anything, nothing happens. They're still yours.\"<\/p><p>\"And I can't send it twice.\"<\/p><p>\"You can't send it twice.\"<\/p><p>\"Good.\" She handed the phone back without pressing either. \"I'd have pressed <em>Not yet<\/em> on every one of them in 2010, and I'd have wanted somebody to have made that a button.\"<\/p><p>Marisol's Friday note, the twenty-seventh, had one line under the counts. <em>Nate. Four teachers have asked me since November what happens to their credits if they close the studio. I've had nothing to tell them. Once this is live I'd like to tell them this. Is that all right?<\/em><\/p><p class=\"note\"><em>Yes,<\/em> he wrote. <em>Monday. Tell them it's for closing too.<\/em><\/p><p>Saturday at 9:15 a text from a 408 number he had saved in August and never used. <em>I put mine in. All 18. It says nine, like hers. I haven't sent it to anyone yet. Is that allowed?<\/em><\/p><p class=\"note\"><em>It's allowed,<\/em> he wrote, and then, because she had asked the question behind it: <em>They'll see it when the first one cancels. You won't have to send anything.<\/em><\/p><hr class=\"break\"><p>Monday, March 30, 7:05 a.m. <em>Done. Fourteen. Now we wait, which I have never been good at. Y<\/em><\/p><p>She had done it alone at the Clavinova after the scales, with the brace still on; he had offered to come at seven and she had said she had raised her rate in that chair without him and could manage a button. The fourteen pages went out at 7:06.<\/p><p>Trish Nguyen pressed <em>Yes, move us<\/em> at 7:21, from the school drop-off line, and wrote under it: <em>Told Cody. He asked if the new teacher lets you cancel on rain. Told him it's on the page.<\/em> By noon, six, and Yolanda in Sunnyvale with a check for $432 that Ana had tried, by text, to refuse, and had not been allowed to. By Tuesday night, nine.<\/p><p>Marisa Ortega pressed the other button Tuesday at 9:40 at night and wrote why, which the page allowed and did not require.<\/p><p class=\"note\"><em>We started with you in 2021. If Danny's stopping, he's stopping with you and not with somebody in Sunnyvale. He's thirteen and he's been asking since Christmas. No offense to her. Thank you for the thumb under.<\/em><\/p><p>Yolanda forwarded it to him at 9:52 with nothing above it, and at 9:58 wrote, <em>I'd have said the same thing in her chair. Don't answer this.<\/em><\/p><p>The second <em>Not yet<\/em> came Wednesday morning from a family who had arrived in the fall of 2025 and had never been anyone's in particular. It came with nothing under it, and by noon they had canceled with Yolanda too, through the page, in one line: <em>We'll find someone near us.<\/em><\/p><p>Twelve moved. Two went. On Ana's screen, Wednesday afternoon, twelve new names came in under the eighteen with their days and their credits, and one of them had a line of notes beside it that Ana read out loud on the phone to him, as if to check it was real.<\/p><p>\"It says <em>Cancel when it rains.<\/em>\"<\/p><p>\"It does. She typed that in April of 2024 with two fingers. It's theirs now. So are you.\"<\/p><hr class=\"break\"><p>Wednesday, April 1, 6:20 in the evening, with the last of the day's children gone, Yolanda stood at the whiteboard with the eraser in her left hand and took the fourteen names off one at a time, and did not look at the two any longer than the twelve.<\/p><p>\"Danny Ortega found middle C in eleven tries in 2021,\" she said, to the board. \"I'll know that one in ten years. The other one I couldn't have picked out of the driveway.\"<\/p><p>Twenty names, in four colors, with room around them.<\/p><p>\"How did you pick,\" he said. He had not asked in March.<\/p><p>\"Who can get to Sunnyvale by four. Who needs me; I kept those. Who needs somebody who'll get down on the floor; she got those.\" The eraser went in the tray. \"The Nguyens don't need me. They need somebody who'll let them cancel on rain and not sigh, and she'll do that better than I ever did. It's a key change, Nathaniel. Same tune. If you do it right the children don't notice.\"<\/p><p>She flexed the right hand inside the strap, once, and let it go.<\/p><p>\"Twenty is what these get. That's the deal I made with them in September, and I've kept it, and I'd like a cup of tea.\"<\/p><p>He made it, in her kitchen, which he had never done, and she let him, and told him where the good cups were, which was not where he had looked. She drank it at the table with both hands around the cup, the strap dark where the steam reached it, and said that the mornings were the same as they had been and that the afternoons, with twenty, were a different thing already, and that she was not going to say more about it than that, and did not.<\/p><hr class=\"break\"><p>It rained Friday.<\/p><p>Not February's kind. April's, the last of it, gray from before light, and at 8:05 his phone lit on the counter with the 408 number.<\/p><p>A screenshot first. Ana's page, in Ana's name. <em>Nguyen family canceled Friday, April 3, 4:00 p.m. Notice given before 9:00 a.m. Credit recorded: 1 lesson (30 min).<\/em><\/p><p>Under it, in capitals, which she had not used once in his hearing: <em>IT WORKED. I didn't have to say anything.<\/em><\/p>", "words": 1826}, {"num": 56, "title": "S-Corp", "part": 5, "meta": "March – April 2026 · Fresno, by video; Quince Court; Campbell", "html": "<p>Marisol asked for it on a Wednesday morning in March, from the yellow kitchen, with a sheet of paper she had written on by hand and held up to the camera before she said anything.<\/p><p>\"Nate. I counted.\"<\/p><p>The sheet had five weeks on it. Under each week, a number of replies and a number of hours, in a hand that had filled in a lot of lesson planners.<\/p><p>\"Thirty a day, most days. Thirty-four on Mondays. A reply that starts with somebody's name and answers the actual question is six minutes if I know it and eleven if I have to look. That's three hours and forty most days, four on Monday, five days. Eighteen and change. Call it nineteen.\" She put the sheet down. \"You pay me fifteen. I've been doing the other four since January and not saying so, which is how I ran a studio for eighteen years, and I closed the studio. So I'm saying so.\"<\/p><p>\"Twenty.\"<\/p><p>\"Twenty. From the sixteenth, so it's a clean pay period. That's a hundred and forty a week more before whatever Lena's taxes are on it.\" She waited. \"You're going to say you have to tell Claire first.\"<\/p><p>\"I have to tell Claire first.\"<\/p><p>\"Good. That's why I did it on a Wednesday.\"<\/p><p>He told Claire at 4:40 at the counter, before, and she said, \"She counted?\" and he said on paper, and she said, \"Then that's the number,\" and wrote <em>Marisol 20, Mar 16<\/em> on the pad in pen, because it would be true Monday whether or not anyone wrote it.<\/p><hr class=\"break\"><p>He woke up Tuesday, April 7, with the cold Lucy had carried home from school and a throat like a rasp, and lay there and did what he always did, which was list what would break if he stayed where he was.<\/p><p>The Monday job had run Monday. Tuesdays were Marisol's day at her brother's tire shop, and at 7:40 she had told Claire, by text, that the tires could wait until Thursday. The servers had not paged since January. Lena had the payroll. There were forty pages in a shared folder that Wes Tanaka had read and Marisol had read, and they started on page one with the Monday job, and there was nothing before page one.<\/p><p>\"You're not getting up,\" Claire said, from the doorway, with her school bag on. It was not a question.<\/p><p>\"I'm not getting up.\"<\/p><p>\"Say what breaks.\"<\/p><p>\"Nothing. Marisol moved the tires.\"<\/p><p>\"Then I'm taking Lucy, and the laptop is in the kitchen, and it's staying in the kitchen.\"<\/p><p>Marisol's note came at 8:00, as it did. <em>Nate. Claire texted me. Stay in bed. Nothing's on fire, and I'd tell you if it were. 28 in. Two for you, and they'll keep.<\/em><\/p><p>He slept until eleven, and woke with the phone in his hand and wrote, with his thumbs, the paragraph that belonged before page one.<\/p><p class=\"note\"><em>If I'm hit by a bus. Marisol Ochoa, Fresno, answers the email and can turn the Monday job off and on; the forty pages under this tell her how. Lena Marsh, Campbell, runs payroll and can see the bank. Wes Tanaka has read the code and will take a call. Every password is in the manager on Claire's phone as of today. Fermata will run ninety days with nobody touching it. Then somebody has to decide what it is, and that's Claire, and she doesn't have to keep it.<\/em><\/p><p>It was the shortest thing he had written about the company and the only one with her name in it.<\/p><p>Claire came home at 3:20 with Lucy and a bag of oranges, and Lucy stood in the bedroom door and asked whether he was sick or working.<\/p><p>\"Sick.\"<\/p><p>\"Good. Mom said you'd say working.\" She went for the horse book and read him two chapters from the foot of the bed, badly and with feeling, and did the horse's voice, which the horse did not have in the text.<\/p><p>At four Claire sat on the edge of the bed with the laptop, because it was the first Tuesday, and opened the sheet. He watched her find her own name at the top of it, beside his, where it said who could change things and not just look at them, and read the paragraph above the forty pages, and say nothing about the last sentence.<\/p><p>Then she typed the March row herself. <em>1,140. $10,050.<\/em> On the household tab, the bank's number as of the thirty-first, <em>$20,400,<\/em> and under it the third installment, gone to Columbus on the sixth, which was why the house went down every month while the company went up, and would through July. She put the laptop on the dresser.<\/p><p>\"The oranges are for you,\" she said, and went to make dinner, and nothing broke.<\/p><hr class=\"break\"><p>Lena Marsh's office on Winchester was what it had been in June of 2024: the blinds half down over the nail salon, the fan on the file cabinet, the calculator with the paper tape, and Lena behind the desk with a red pen and a folder that had his company's name typed on the tab.<\/p><p>\"Sit. You sound terrible.\"<\/p><p>\"I'm better.\"<\/p><p>\"You're upright. That's different.\" She opened the folder. \"First quarter of a corporation. I'll go in order and you nod. Salary, sixty-five hundred a month, February and March, withheld and sent; the service did it and I checked it. That's a number I can defend to a man with a badge: what somebody gets paid to do your job, which I looked up, and it's less than Sunnyvale paid you and more than you paid yourself last year. Marisol, twenty hours from the sixteenth, call it twenty-seven hundred a month with the taxes on top. Columbus, three thousand, three of six. Hosting, the text company, the insurance, the rest.\" The tape ran. \"A business that spends about forty-three hundred a month before it pays you, pays you seven with the taxes, pays Ohio three, and took in a little under ten, because your August people paid in August.\"<\/p><p>\"What's left.\"<\/p><p>\"Sixteen thousand at the end of March. Seventeen-four in January. It goes down in April and May and it comes back in August,
