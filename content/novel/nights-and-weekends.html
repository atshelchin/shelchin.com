wo more teachers want to see it. Tuesday, church hall, Los Altos. Wear a collar.<\/em><\/p>", "words": 1958}, {"num": 14, "title": "First Ten", "part": 1, "meta": "May 7–31, 2024 · Los Altos, Alder Creek, Mountain View, and Sunnyvale", "html": "<p>The hall at St. Bede's had a linoleum floor and a kitchen pass-through and twenty-two music teachers on folding chairs, and Nate stood at the front of it in his one dress shirt with the laptop on a card table and understood, at about the time the treasurer sat down, that the shirt had been a mistake.<\/p><p>\"Yolanda's brought a guest,\" Harriet Lum said, from the agenda.<\/p><p>\"This is Nathaniel,\" Yolanda said, without standing. \"He's a parent. He built me a thing. He has five minutes, and then Bev has her question about the June hall.\"<\/p><p>He had practiced it in the CR-V on Cuesta with the engine off. He said none of that. He turned the laptop so the front row could see it and said, \"This is what a parent sees,\" and showed them the page: a lesson, a time, Yolanda's name, her sentence, and the button. Then her Wednesday, with the Nguyens' credit sitting under it, and the list of open Saturdays, which was two.<\/p><p>\"Does it text?\" A woman in the second row, cello case at her feet.<\/p><p>\"Not yet. Email.\"<\/p><p>\"My parents don't read email.\"<\/p><p>\"I know.\"<\/p><p>\"What's it cost?\"<\/p><p>\"Nothing right now. It's free while I find out what's wrong with it.\"<\/p><p>\"It's ugly,\" said a man near the pass-through, not unkindly.<\/p><p>\"Yes.\"<\/p><p>That got a laugh, and the laugh helped, and the shirt stuck to his back, and he kept going.<\/p><p>\"Does it do the billing?\"<\/p><p>\"No.\"<\/p><p>\"Then what do I—\"<\/p><p>\"It does the one thing, Carol,\" Yolanda said. \"Bev, the hall.\"<\/p><p>Afterward, by the coffee urn, three of them gave him their emails, on an index card, because he had one. Bev Ostrowski, the cello. Carol Ng, piano, Mountain View, who said she was not paying nineteen dollars for anything and he said good, it was zero. And a guitar teacher from Palo Alto named Luis Serrano who had said nothing during and said, after, \"The link part. That's the part,\" and wrote his email under the other two in very small letters.<\/p><p>Yolanda was in her car with the window down when he got to the lot.<\/p><p>\"Three,\" she said. \"That's a trio. Don't get excited.\"<\/p><p>\"I said 'I think' four times.\"<\/p><p>\"Five. Go home and change your shirt.\"<\/p><hr class=\"break\"><p>He emailed Kim on Wednesday night, before he'd built the three their accounts, because he had said he would.<\/p><p class=\"note\"><em>You said tell you first. It's a web thing for cancellations and credits. One teacher on it since April 22, three more this week. It's free right now. I won't post in the group. If you want to look, here's a link.<\/em><\/p><p>She wrote back in forty minutes.<\/p><p class=\"note\"><em>Thank you for telling me first. Do not post it. I will post it, because if you post it, it is an ad, and if I post it, it is a recommendation, and I have not recommended it, so I am going to say that too. You still owe me August.<\/em><\/p><p>The post went up Thursday at 6:50 a.m. He read it at the light at Maude.<\/p><p class=\"note\"><em>A parent in Yolanda Beck's studio built a small tool for cancellations and credits. It does one thing. It does not invoice. It is free while he works out the bugs, which means you are the bugs. I have not used it. Yolanda has, for two weeks, and she has stopped texting me about her whiteboard, which I consider evidence.<\/em><\/p><p>Forty-one comments by noon. He answered none of them. A trumpet teacher in Oakland asked whether it texted, \"asking for my parents, who do not read email,\" and eleven people liked that. By Saturday two teachers had signed themselves up through the link, a piano teacher in Fremont and a violin teacher in San Jose, neither of whom he had met, and he sat at the window table at Orchard looking at two names he had not typed and did not know what to do with his hands.<\/p><hr class=\"break\"><p>Saturday, and the Saturday after, he wrote emails at the window table with Gail's drip going cold.<\/p><p>The eight first. He wrote them one at a time, three sentences each, plainer than January's. Dana Whitlock wrote back in nine minutes, <em>YES. Send me the link. Is the whale one dead?<\/em>, and signed up before he'd answered. Marguerite in Cupertino wrote <em>Does it do invoices?<\/em> and he wrote <em>No<\/em> and she wrote <em>Let me know when.<\/em> Jill in San Jose wrote <em>is it free<\/em> and he wrote <em>Yes<\/em> and that was the last of Jill.<\/p><p>Then the directory. The chapter's member list had come attached to Harriet's agenda, which Yolanda had forwarded without comment: sixty names. He took the forty he had never met and wrote them the same three sentences, Saturday the eleventh and Saturday the eighteenth, the name at the top typed by hand. He had done this in January for the whale, and it had felt like standing on a driveway with flyers, and it felt like that now, with a better flyer.<\/p><p>Two replies. One said <em>Please remove me from your list,<\/em> and he was not a list, and he removed her anyway. One, from a piano teacher in San Carlos named Diane Foyle, said <em>Yes, but I have four questions,<\/em> and asked them, and he answered them, and she signed up Monday and had six students in by Tuesday.<\/p><p>Forty. Two. One. He wrote it on a card and set it beside the other card, the one that said <em>St. Bede's: 22, 3<\/em>, and left the two of them there side by side.<\/p><hr class=\"break\"><p>The water heater quit on a Friday, which was when water heaters quit. Mrs. Halvorsen's man could come Tuesday at the earliest. Tom Reyes, whose daughter Mia was in Lucy's swim group at the community pool, heard about it from Claire on the pool deck Saturday morning and was in the garage at noon with his head in the closet where the heater lived.<\/p><p>\"Thermocouple,\" he said, from inside it. \"Twenty-three dollars. Forty minutes. Don't let anybody sell you a tank.\"<\/p><p>He did it in thirty-five, and would not take money for thirty-five minutes from a family he ate pizza with after swim, and said so with his hands in the utility sink.<\/p><p>\"My sister teaches flute,\" he said instead. \"Angie. In Willow Glen. Nineteen kids. She's got a whiteboard on her refrigerator like the one on your phone, and she calls me about it. Can you do the thing for her.\"<\/p><p>\"Yes.\"<\/p><p>\"Then we're square.\" He dried his hands on his jeans. \"Don't let her talk your ear off. She will.\"<\/p><p>Mrs. Halvorsen sent a check for $23 across the wall that afternoon, made out to Tom Reyes in blue ink, with lemons. Angie Reyes signed up Sunday and called Monday night and talked for thirty-one minutes, and he minded less than he'd have guessed, and she had a question about siblings that he wrote down.<\/p><hr class=\"break\"><p>Devin texted on the twenty-first at 4:15. <em>farah's is tonight. u going? cant, stan's got a thing at 6 their time. go. tell jonah I said hi.<\/em><\/p><p>So he went alone, up Castro Street at ten to seven, into a coworking space with twenty-some people in it and the good kind of tired. Farah found him inside a minute. She was in her forties and had a voice that had done a podcast, and she ran the room the way Yolanda ran a garage, by making everyone say one thing.<\/p><p>\"You're Devin's friend. The whiteboard.\"<\/p><p>\"Yes.\"<\/p><p>\"One sentence. Everybody does one.\"<\/p><p>\"Cancellations and credits for music teachers,\" he said. \"Nine people. It's free.\"<\/p><p>\"Say it like it's a number,\" Farah said. \"Jonah. This is the whiteboard guy.\"<\/p><p>Jonah Pruitt was thirty-eight and looked like a man who had rented a room in Mountain View for six years and had opinions about it. He had a tool for dog walkers, invoices and reminders and mileage, and he said, before Nate had asked, \"Thirty-one hundred a month. Sounds like a number until you know it was twenty-nine hundred a year ago. Free?\"<\/p><p>\"For now.\"<\/p><p>\"Charge from day one or you'll never learn anything.\" He said it like a man who had bought the sentence at full price. \"I said 'for now' for a year. I learned that people like free. I'd have paid nine dollars to learn that in a week.\"<\/p><p>\"Not yet,\" Nate said.<\/p><p>\"That's what 'for now' means. Nine people who pay you nine dollars tell you nine things. Nine people who pay you nothing tell you they like you.\" He shrugged. \"I'm often wrong. Ask Farah.\"<\/p><p>\"He's often wrong,\" Farah said, from across the room, and the room laughed, and Jonah laughed hardest.<\/p><p>Nate drove home at 9:10. On the way to the car he looked at the board on the platform side of Castro and then remembered that nobody was waiting for a train.<\/p><hr class=\"break\"><p>The email from Oakland had come Sunday. <em>Saw you in Kim's group. Trumpet. I don't sign up for things I haven't talked to a person about. Call me. Wednesday, 12:15, I've got forty minutes between a school and a kid in Piedmont. Marcus.<\/em><\/p><p>He called from the CR-V on the top level of the structure at 12:15, with the sun on the dash and the windows down.<\/p><p>\"Nate. Okay. Let me tell you who you're talking to, and then you tell me what you built, and we'll see if they're the same thing.\"<\/p><p>Marcus Tillman was forty-five, born in East Oakland and still there, and he taught band two mornings a week at two middle schools for what the district paid, which was eleven hundred a month and which he called a joke he happened to love. The rest was twenty-five private students, some at his house, some at theirs, and weddings, and a funk band that played Saturdays and paid in exposure and, occasionally, money. His wife Tanya was an ICU nurse. Two teenagers, one of whom drove, God help them all.<\/p><p>\"Fifty-five a half hour at my place. Sixty-five at theirs, because theirs has a dog. Everybody in this business acts like the money's a secret. It's the rent.\" He had a voice that went somewhere while it talked, and came back. \"Now you.\"<\/p><p>Nate told him. The link, the policy, the credit, the open slots. Email, not text, yet. Free, for now.<\/p><p>\"For now,\" Marcus said, and let it go. \"Here's my thing, and then I'll sign up, because you sound like a person. When a parent cancels on me, they're canceling on a man they know. They saw me play at their cousin's wedding. So they push, can we do Saturday, can we do the credit and Saturday, and I fold, because I'm the nice one, and the nice one is most of what they're paying for.\" A truck went by on his end. \"What I want is a thing that isn't me. The app should be the bad guy.\"<\/p><p>Nate laughed, one breath, in the hot car. \"It just shows them the policy.\"<\/p><p>\"I know what it does. I'm telling you what it's for.\"<\/p><p>He was still laughing a little when he got to the next part, how to put twenty-five students in, and Marcus said he'd do it tonight, and asked one more question, about siblings, the same question Angie had asked, and Nate said not yet, and Marcus said, \"You say that a lot,\" and they were done at 12:54, and he was through the turnstile at 1:02 with his shirt in the shape of the seat.<\/p><p>Marcus's account appeared at 9:14 that night, with twenty-five students in it, in a studio he had named <em>Tillman Brass<\/em>.<\/p><p>He sat at the table with the phone and did not open the laptop. Yolanda. Bev, Carol, Luis. The two from Kim's, Fremont and San Jose. Dana. Diane and her four questions. Angie Reyes and her thirty-one minutes. Marcus. Ten. Every one of them free, and every one of them with his number, or his email, or Yolanda's.<\/p><p>Bev had called four times in three weeks, once at 9:40 at night. Angie had called once, for half an hour. He tried the arithmetic on a card, ten teachers, so many calls apiece, and then a hundred, and got as far as writing the hundred and put the pen down, because there was not, anywhere in the house, a number he could put next to it.<\/p>", "words": 2074}, {"num": 15, "title": "Terms of Employment", "part": 1, "meta": "May 13–24, 2024 · Sunnyvale and Quince Court", "html": "<p>The bridge opened at 10:24 Tuesday morning with a sound like a doorbell, and by 10:26 there were thirty-one people on it and none of them was talking about the thing that was wrong.<\/p><p>He knew what it was at 10:31. Orders were going in and not coming out. The queue he had spent two years making patient was being patient, which was the trouble: it was holding eleven thousand orders for a freight customer in Ohio and trying, politely, every few seconds, to write them into a table that would not take them. He looked at the table. Somebody on the platform side had started a migration on it at 10:19, and the migration had a lock, and the lock would hold until the migration finished or somebody killed it.<\/p><p>He typed it into the incident channel. <em>Orders table has an exclusive lock from a migration started 10:19. Queue is healthy, it's waiting on the lock. Who owns the migration?<\/em><\/p><p>Twelve messages went by under it. The incident commander, a woman from the Denver office he had met twice, wrote <em>Thanks, we're looking at the queue,<\/em> and then somebody asked whether the queue had been deployed recently, and Devin, from somewhere on the front-end side, wrote <em>the buttons are fine its the back<\/em> and got a laughing face.<\/p><p>At 10:52 the platform lead, a man named Raj who sat one floor up, wrote <em>Found it. Migration on orders is holding a lock. Killing it.<\/em> Eight people thanked Raj. The queue drained in four minutes. The bridge closed at 1:15, after the customer in Ohio had been called, and the commander asked the Orders pod for a postmortem by end of day Wednesday, and Priya, who had said nothing on the bridge for three hours, sent him one line in a private message: <em>I saw 10:31.<\/em><\/p><p>He wrote the doc that afternoon, and it was good, and it had his name on it. He went home at 6:20 and ate what was left and was asleep on the couch at 8:40 with the TV on. Claire put a blanket over him. Lucy, he learned later, put a whale on the blanket.<\/p><hr class=\"break\"><p>Yolanda's text was on the phone at 9:55, when he woke up to move to the bed.<\/p><p class=\"note\"><em>Saturday credits are not there. Two of them. The Lindqvists and the Patels, both before nine. Bev says her Saturday ones are not there either. It did the weekdays. Fix it or I go back to the board.<\/em><\/p><p>He sat on the edge of the couch with the phone and knew before he had finished reading. He had counted the days of the week from zero, the way the language did, Sunday zero, and when he'd checked whether a lesson fell on a day the policy covered he had stopped one short. Saturday was six. Saturday had never existed. A weekday lesson canceled before nine got a credit; a Saturday lesson canceled before nine got a page that said the right thing and a ledger that wrote nothing down. Her best day. The one nobody was tired on.<\/p><p>It was one character. He could see the line. He could see the number on the line.<\/p><p class=\"note\"><em>I know what it is,<\/em> he wrote. <em>Tomorrow.<\/em><\/p><p class=\"note\"><em>Tonight would be better.<\/em><\/p><p class=\"note\"><em>Tomorrow morning. First thing.<\/em><\/p><p>He did not do it first thing. The alarm went at 4:50 and he sat at the table with the coffee and the laptop and the postmortem open in his head instead, because the postmortem was due and had his name on it, and 6:40 came, and he was on Alder Creek Road at 6:45 with the fix still in his head and his own laptop still on the table.<\/p><hr class=\"break\"><p>Wednesday the pod ate at their desks. Priya had asked them to stay close while the migration went back out, correctly this time, at noon, and so at 12:20 he was at his desk with a burrito from the cafeteria and the work laptop open and the bridge, reopened at a lower volume, in one window. In the other window, the postmortem, done. He was tired in the way that made things simple.<\/p><p>Yolanda had sent one more at 11:40. <em>Bev has called me twice.<\/em><\/p><p>The fix was one character. His own laptop was on the kitchen table nine miles away. The code was on the same site every piece of code on earth was on, and his password was in his head, and the machine in front of him had a browser like any other browser.<\/p><p>He typed the address. He signed in. He made a folder and pulled the code down into it, which took eleven seconds, and the folder sat on the disk one line below the folder called <em>orders-service<\/em>. He opened the file and found the line and changed the six to a seven and ran the tests, which took a minute, and pushed. Then the hosting site, one button. It was 12:31. The Lindqvists and the Patels had their Saturdays, and Bev had hers.<\/p><p>He had the card in his head the whole time. He had written it in October at the kitchen table with the agreement open beside it, and it was still under the edge of his own laptop at home. <em>Never on the work laptop. Never on work time. Nothing near logistics.<\/em> He had done the first two in eleven seconds, over a burrito, and the third was on the disk one line under the Orders service, if you wanted to be literal about it, and he did not want to be. It was a piano teacher's Saturday and one character and it had nothing on earth to do with trucks. That was the sentence. He closed the folder and went back to the bridge, and the sentence held for about a day and a half.<\/p><hr class=\"break\"><p>Tahoe, Friday, four o'clock. The top level of the structure was full and bright out the window and had his car on it. Priya had the notebook.<\/p><p>\"The postmortem is good,\" she said. \"I sent it to Doug. Your name is on it, which is what a name is for.\" She turned a page. \"Raj found the lock at 10:52. You found it at 10:31. Next time I would like you to say so twice, and to the commander directly, not to the channel. The channel is where things go to be thanked later by someone else.\"<\/p><p>\"Okay.\"<\/p><p>\"That is one thing. This is the other.\" She closed the notebook. \"I walked past your desk on Wednesday at twenty to one. I was not looking at your screen. I do not look at screens. I am telling you what I did not see so that you understand me when I say that I am not going to ask what you're working on, and you are not going to show me on that laptop.\"<\/p><p>He did not say anything. There was nothing available to him that was not either a lie or a confession, and she had built the sentence so that he would notice that.<\/p><p>\"I have known about Orchard Coffee since November,\" she said. \"I have known about the index cards since you read from one at stand-up in March. I am not a person who can know things. My priority date is from 2014, and on the first of every month I check whether it has moved, and it has not. If I lose this job I have sixty days to find another one that will carry the paperwork, and Rohan is seven and has never lived anywhere else.\"<\/p><p>She let that sit as long as she let everything sit.<\/p><p>\"So I know nothing. If anyone in this building asks me what you do at lunch, I will say you eat a burrito in your car on the roof, which is true, and I will say it without having to think, which is the part that matters. Keep it true for me.\"<\/p><p>\"It's true.\"<\/p><p>\"It was true until Wednesday.\" She opened the notebook again. \"Bea's last day is next Friday. There will be cake. Go.\"<\/p><hr class=\"break\"><p>There was cake. Friday the twenty-fourth, three o'clock, the kitchen on the second floor, a sheet cake from the Safeway with the bad parking lot, GOOD LUCK BEA in blue gel, and forty people who had each worked out that they had about thirty seconds. Bea stood by the coffee machine with a paper plate and did not make a speech. Doug Ferrante made one, short, about the retry queue and the design docs and the red pen, and somebody had bought her a red pen, a good one, in a box, and she looked at it and said, \"I'll use this,\" and people laughed, and she meant it.<\/p><p>The company she was going to had a campus and a shuttle and a name everyone said with the same small shrug. She would be a staff engineer there too, on something she could not describe, at a number she would not say.<\/p><p>He got to her at 3:25 with a piece of cake he did not want.<\/p><p>\"You read it?\" Bea said.<\/p><p>\"I read it.\"<\/p><p>\"Good.\"<\/p><p>That was going to be all of it, and then it wasn't. She looked past him at the pod, at her desk with the monitors already gone.<\/p><p>\"You know why I'm going.\"<\/p><p>\"The money.\"<\/p><p>\"The money's fine. They're not backfilling me.\" She said it like a fact about the weather. \"I asked Doug in April. He said my req was 'headcount under review.' I've read that sentence before, at a different company, about eight months before the other sentence. It's not a secret. It's just not going to be said in a room you're in.\"<\/p><p>\"Okay.\"<\/p><p>\"Don't say okay to me. I'm leaving. Say it to Priya.\" She picked up the plate and put it down again. \"And whatever it is. Not on the asset tag. I said it in October and I'm saying it with cake.\"<\/p><p>He went back to his desk at 3:40 and opened the folder that sat one line below <em>orders-service<\/em> and looked at it. It had been there nine days. He had not opened it since the burrito. He deleted it and emptied the trash, and then he looked at the clean disk and knew what he knew. The push had gone out from this machine at 12:29 on the fifteenth with his name on it and a time. The machine had a number on the bottom, and the number was in a spreadsheet somewhere with his name beside it, and none of that came off with the folder. There was no button for it. He had spent ten years building forms, and there had never once been a button for it.<\/p><p>Priya went past at 5:35 with her bag on her shoulder and her badge in her hand, and stopped.<\/p><p>\"Whatever it is,\" she said, \"keep it clean. I might not be able to help you later.\"<\/p>", "words": 1833}, {"num": 16, "title": "Nine Dollars", "part": 1, "meta": "June 2–5, 2024 · Campbell, Quince Court, and Sunnyvale", "html": "<p>Lena Marsh's office was on the second floor of a building on Winchester Boulevard in Campbell, over a nail salon, with the blinds half down against the four o'clock sun and a fan going on the file cabinet, and she had been talking since before he sat down.<\/p><p>\"Jonah says you're not an idiot. That's the whole referral, so don't let it go to your head. What is it?\"<\/p><p>\"A website. For music teachers. Cancellations.\"<\/p><p>\"How much.\"<\/p><p>\"Nine dollars a month. Seventy-nine a year.\"<\/p><p>\"Have you taken a dollar?\"<\/p><p>\"Nine.\"<\/p><p>\"From who?\"<\/p><p>\"I don't know.\"<\/p><p>She looked at him over the glasses for the first time. She was fifty-two, and she had a red pen too, and beside the monitor a calculator with a paper tape, which he had not seen since his father's kitchen.<\/p><p>\"You took nine dollars from a person you don't know into what account?\"<\/p><p>\"Ours. The checking.\"<\/p><p>\"Okay.\" She wrote something. \"Here's the next two weeks of your life, and then we'll do the part you came for. Monday you file a limited liability company with the state, online, seventy dollars. Not tonight. Monday. You're going to sleep on the name, because everybody hates the name by Friday. Inside ninety days there's a Statement of Information, twenty dollars, and I'll remind you, because nobody remembers.\"<\/p><p>\"I'll remember.\"<\/p><p>\"Nobody remembers. The city of Alder Creek wants a business license, a hundred and ten. A bank account that isn't yours and isn't your wife's. And the state wants eight hundred dollars whether you make a dime.\"<\/p><p>\"Eight hundred.\"<\/p><p>\"A year. For being a company in California. Yours comes due October fifteenth, because of when you file, and every April after that. Put it on a calendar now, where I can see you do it.\"<\/p><p>He put it on the calendar where she could see. \"For nine dollars a month.\"<\/p><p>\"For existing. They used to waive the first year. They stopped, for anybody forming this year or later, so you're late for that and so is everyone else.\" She turned the calculator tape with one finger, out of habit. \"You'll pay me twelve hundred in the spring for the return, and you'll pay them eight hundred for nothing. That should bother you. It shouldn't stop you.\"<\/p><p>\"Do I charge sales tax?\"<\/p><p>\"Not on software, not in California. If a teacher in Texas signs up, call me.\" She picked up the sheet he'd brought and read down it, and stopped at the last line, and read it again. \"Who did this?\"<\/p><p>\"My wife.\"<\/p><p>\"She put your hours on it.\"<\/p><p>\"At zero.\"<\/p><p>\"I can see it's at zero. She put them on it.\" Lena took the glasses off. \"Keep her.\"<\/p><hr class=\"break\"><p>The sheet had started Sunday at two in the afternoon at the kitchen table, with the whale documentary going in the living room and Lucy on the floor in front of it, and Claire had opened her own laptop and turned it around before he'd finished sitting.<\/p><p>\"I made a thing. Don't be insulted.\"<\/p><p>It was a spreadsheet. She had made it the way she made the class list, with the columns the same width and the header bold. <em>Hosting, $19. Email, $15.<\/em> He had moved off the free plan in May when Bev's parents stopped getting the reminders. <em>Domain, $14 a year,<\/em> and beside it, in the monthly column, <em>$1.17.<\/em> Then a line he had not expected. <em>Whale server, $4.<\/em><\/p><p>\"Is that still on?\"<\/p><p>\"Yes.\"<\/p><p>\"You said in April you'd turn it off.\"<\/p><p>\"I know.\"<\/p><p>\"Turn it off tonight, and I'll delete the row.\" She scrolled. Under the four dollars there was one more line, and she had put it in bold. <em>Nate, hours per week: 12. Rate: $0.<\/em><\/p><p>\"I said zero.\"<\/p><p>\"I know what you said. Zero is what you're paying yourself. It isn't what it costs.\" She said it in the voice she used to explain a rubric to a parent, kindly and with no room in it. \"I'm not putting a number. I'm putting the hours, so they're on the page with the rest of it. Thirty-nine dollars and twelve hours a week. That's what it costs to have ten people using it for free.\"<\/p><p>He looked at the page. He had done this arithmetic in his head four or five times since April and had never once let the hours onto the card, and there they were, in bold, in a column, in her font.<\/p><p>\"Okay.\"<\/p><p>\"Okay. Now the part you asked me here for.\" She had four index cards, his, and she laid them on the table like a dealer. <em>$5. $9. $15. $19.<\/em><\/p><p>\"Nineteen is what the other one charges,\" she said. \"The one Carol won't pay.\"<\/p><p>\"Carol won't pay nineteen for anything.\"<\/p><p>\"Carol isn't paying nine either, currently.\"<\/p><p>He had texted Jonah on Saturday, <em>If you had to pick,<\/em> and Jonah had texted back, <em>19,<\/em> and nothing else, and then, forty minutes later, <em>whatever you pick, pick it Monday.<\/em> He had texted Yolanda the same question and she had answered in the middle of a lesson: <em>Teachers will pay ten and hate twenty. Stop asking me things during the Clementi.<\/em><\/p><p>\"Five,\" Claire said. \"Make the case.\"<\/p><p>\"Fifty dollars a month from ten people. It doesn't cover the hours at zero.\" He moved the card to the side. \"And it's a number nobody's afraid of, which sounds good until you think about who that gets you.\"<\/p><p>\"Fifteen.\"<\/p><p>\"A hundred and fifty. It's real. Carol walks. Half of Kim's group walks before they've tried it, because fifteen is a number you say to your husband.\"<\/p><p>\"You could say nine to your husband.\"<\/p><p>\"You could say nine to anyone.\"<\/p><p>Lucy came in from the whale, which had reached the part where it dove, and stood at the end of the table and read the cards, which she could do now.<\/p><p>\"Yolanda costs fifty-two,\" she said.<\/p><p>\"Yes.\"<\/p><p>\"Fifty-two is more than nine.\"<\/p><p>\"Yes.\"<\/p><p>\"So you're cheaper than Yolanda.\"<\/p><p>\"Yes.\"<\/p><p>\"Is that good?\"<\/p><p>He did not have an answer, and Claire waited to see if he did, and Lucy took a string cheese from the refrigerator and went back to the whale.<\/p><p>\"Nine,\" he said. \"Seventy-nine for the year. Twelve nines is a hundred and eight, so the year's three months free and change. Enough to notice.\"<\/p><p>\"She said ten.\"<\/p><p>\"I know she said ten.\"<\/p><p>\"So why nine?\"<\/p><p>\"Because nine sounds like I thought about it.\"<\/p><p>\"Did you?\"<\/p><p>\"For about a week.\"<\/p><p>Claire wrote <em>9<\/em> at the top of the sheet in a cell of its own and made it bold. \"And free? For the little ones. Five students and under, or the first three months, or whatever the phone companies do.\"<\/p><p>\"No.\"<\/p><p>\"Why not?\"<\/p><p>\"Because the free ones call.\" He said it before he had thought about how it sounded, and then kept going, because it was true. \"Bev's paid nothing and she's called me five times. Jill wrote 'is it free' and that was the last of Jill. If somebody's paid nine dollars, they read the help page before they call, because they've decided it's a thing. If it costs nothing, it looks like something a parent made in his kitchen.\"<\/p><p>\"It is something a parent made in his kitchen.\"<\/p><p>\"It doesn't have to look like it.\"<\/p><p>She looked at him a while. \"And the ten. The ones who've had it since April.\"<\/p><p>\"Thirty days free for anybody new. The ten have had their thirty days. Monday they pay or they go.\"<\/p><p>\"You're going to say that to Yolanda.\"<\/p><p>\"Yolanda's going to say it to me.\"<\/p><p>\"Okay,\" Claire said, and it was a different okay from his, one with a decision in it. \"Nine. Write the email tonight and send it to me before you send it to them. I've never seen you ask anybody for anything. I'd like to read it first.\"<\/p><p>He wrote it at 8:30, eleven lines, and sent it to her, and she sent it back with one sentence cut, the one that apologized, and he sent it to ten people at 9:04. At 9:06 he turned off the whale server, and it was gone, four dollars a month gone, a thing he had built for four months and paid for ever since, and nobody in the house said anything about it, because there was nothing to say.<\/p><hr class=\"break\"><p>Monday he set up the card thing before anyone else was up.<\/p><p>He had made the account Sunday night in his own name, because the form had asked for a name and he had one. Now he made the two prices, <em>Fermata monthly, $9.00,<\/em> and <em>Fermata annual, $79.00,<\/em> and set the trial at thirty days for anyone who signed up from today, and read the pricing page, which he had not read, because you did not read the pricing page until you had a price.<\/p><p class=\"note\"><em>2.9% + 30¢ per successful card charge.<\/em><\/p><p>He got a card.<\/p><p><em>9 × .029 = .26. + .30 = .56.<\/em> Fifty-six cents on nine dollars. Six percent and a bit. Under it, <em>79 × .029 = 2.29. + .30 = 2.59.<\/em> Three percent and a bit. And under that, in the small type, seven-tenths of a percent more for the part that remembered to charge people every month, which was the only part he needed.<\/p><p>He looked at the two lines a while. The thirty cents did not care what the charge was. It was the same thirty cents on nine dollars as on seventy-nine, and on nine dollars it was most of the fee, and there was nothing he could build that would make thirty cents smaller. He wrote <em>Push the year<\/em> on the card, under the arithmetic, and moved the annual price to the top of the signup page, where the eye went first, and made the monthly one the second line. That was all he could do about thirty cents at 5:50 in the morning, and it was 5:50, and the house was about to wake.<\/p><p>Then nothing happened, all day.<\/p><p>He ate the burrito in the car on the roof of the structure at 12:15, which was true, and looked at the phone, which said nothing. At 4:40 Yolanda wrote, <em>Read it. I'll pay for the year. Saturday, when you're here with the laptop, because I'm not typing a card number into a telephone. Consider it the bill.<\/em> Carol wrote, <em>It's not nineteen. Fine.<\/em> Diane Foyle in San Carlos wrote, <em>School's out the fourteenth and I lose half my kids until August. Can I come back then?<\/em> and he did not have an answer for that and said he'd think about it. The San Jose violin teacher, whom he had never met, said nothing at all, and by dinner he understood that nothing was her answer.<\/p><p>\"Nobody?\" Claire said, at ten, in the doorway.<\/p><p>\"Nobody.\"<\/p><p>\"It's been a day.\"<\/p><p>\"It's been a day.\"<\/p><hr class=\"break\"><p>Tuesday, 6:12 a.m. He was at the table with the coffee and, finally, nothing from May in his head, when the phone buzzed once on the wood.<\/p><p class=\"note\"><em>Payment received. $9.00.<\/em><\/p><p>He opened it. Under the nine there was a name, and under the name an email address, and under that a city, Fremont, and a studio name with <em>Piano<\/em> in it. Helen Pak. He had never typed the name. He had never met her. She had read a sentence of Kim's on the ninth of May and made herself an account on a Saturday, and had put, he checked, twenty-two students into it, and had gotten his eleven lines Sunday night and had done nothing for a day, and at 6:11 on a Tuesday morning she had typed sixteen digits into a page he had built and paid a man in Alder Creek nine dollars for his Saturdays. Fifty-six cents of it was already gone. He knew that without looking.<\/p><p>He did not know what she looked like. He did not know what she'd been doing at 6:11 in the morning, in Fremont, with her card out, whether it was scales or a child or a kitchen like this one. He knew that Wednesday at four he was going to be in Campbell, in an office over a nail salon, because you did not take a dollar from a stranger into the checking account and then not.<\/p><p>He wrote it on a card. <em>Jun 4. $9. Fremont. Helen Pak.<\/em> It was the first card in the house with a dollar sign on it that he had not been the one paying, and he was still looking at it when Lucy came down the hall at 6:40.<\/p>", "words": 2097}, {"num": 17, "title": "June", "part": 1, "meta": "June 15 – July 21, 2024 · Alder Creek, Quince Court, and Santa Cruz", "html": "<p>The cake was a blue whale, mostly frosting, and it was in the shade of the snack bar at the community pool at 11:15 on Saturday morning with seven candles in it and a paper plate over it against the flies, and Lucy was in the shallow end with six children explaining that she was seven now, since Sunday, and that this changed things.<\/p><p>Tom Reyes had brought pizza, four boxes, because that was what Tom did after swim, and he was sitting on the edge of the deep end with his feet in and Mia on his shoulders, and Claire was at the table with the goodie bags in a row, and it was fine. It was June in Alder Creek, fog until ten and then this, and Nate's phone rang in his pocket.<\/p><p>Bev Ostrowski. 11:22 on a Saturday. He looked at the shallow end and looked at Claire and went out through the gate to the parking lot, because Bev did not leave voicemails, she called back.<\/p><p>\"A mother canceled at nine-forty for an eleven-thirty and the page told her no credit. Which is right, that's my policy, nine o'clock, I put it in. But it's the Hendersons, and the grandmother died. I need to give her the credit.\"<\/p><p>\"You can. There's a button.\"<\/p><p>\"Where.\"<\/p><p>He walked her to it from the lot, with the CR-V's hood hot under his hand: the lesson, the three dots, <em>Add credit anyway,<\/em> and a box for why. Bev typed <em>grandmother<\/em> into the box and hung up without saying goodbye, which was how Bev said goodbye. Four minutes. The cake had not moved.<\/p><p>The second call was Angie Reyes, at 12:05, in the middle of the candles. He saw the name and let it ring. It rang. Claire looked at the phone and then at him, and he said, \"Two minutes,\" and went out again.<\/p><p>\"It's asking me for a card,\" Angie said. \"Tommy said it was free.\"<\/p><p>\"It was. It's nine dollars a month now. I sent an email.\"<\/p><p>\"I'm asking why nine. Tommy said you'd charge me twenty. I told my husband twenty. Now I have to go back and tell him nine and he's going to think it's not a real thing.\"<\/p><p>\"It's a real thing.\"<\/p><p>\"I know it's a real thing. I've got nineteen kids in it.\" She was quiet a second. \"Nine. Fine. I'll do it tonight. Is Tommy there? Tell him to put sunscreen on Mia.\"<\/p><p>Tom was at the gate when he came back in, drying his hands on his shorts.<\/p><p>\"Was that Angie?\"<\/p><p>\"That was Angie.\"<\/p><p>\"She talk your ear off?\"<\/p><p>\"Four minutes.\"<\/p><p>\"That's a record.\" Tom looked back at the pool. \"She tell you to sunscreen Mia?\"<\/p><p>\"Yes.\"<\/p><p>\"She tells everybody that.\"<\/p><p>Lucy had blown the candles out without him. There was a picture on Claire's phone of Lucy with her cheeks full of air and an empty place at the end of the table. Later, in the car, with her hair still wet and the goodie bag in her lap, she said, \"Mia's dad stayed in the water the whole time.\"<\/p><p>\"Mia's dad is a plumber.\"<\/p><p>\"So?\"<\/p><p>He drove. Claire looked out her window, and he understood she was leaving the question for him, and he did not have anything for it, and Lucy let it go, because she was seven and there was a whale in the bag.<\/p><hr class=\"break\"><p>The card at the end of June said <em>12<\/em> and, under it, <em>$100,<\/em> which was near enough if you spread the yearly ones out across the months, and he had, in pencil, on the back. Yolanda had paid her seventy-nine on the eighth at the studio with the laptop on her knees, reading the card number off in the voice she used for the Ortega boy's fingering, and said, when it went through, \"That's the bill. We're square.\" Marcus had paid the month. \"I don't buy a year from a man I met in May. Ask me in May.\"<\/p><p>Then school ended, and the emails came.<\/p><p>Diane Foyle's had come first, in June, and he had said he'd think about it. Now there were four like it. <em>I go down to eight kids in July.<\/em> <em>We're in Taiwan the whole month.<\/em> <em>Can I stop and come back? I don't want to lose the credits.<\/em> There was nothing on the page for that. There was <em>Cancel,<\/em> which threw the account away, and there was paying nine dollars for a month with nothing in it to cancel, and he read the four emails at the table on the last Sunday in June and understood, the slow way, that he had built a thing for a business that stopped every summer and had not put a summer in it.<\/p><p>The first of July was a Monday. The charges went out at midnight, nine dollars each, from a machine that did not know it was summer. At 7:10 Tuesday morning Luis Serrano wrote two lines from Oaxaca. <em>Charged this morning. I'm here till August, no lessons. Can you refund it and stop it till I'm back? Sorry.<\/em><\/p><p>He found the refund button. It asked if he was sure. He was sure. Nine dollars went back to Palo Alto, and on the next line the page said what it did with the fifty-six cents, which was keep it. He had paid fifty-six cents to be paid nine dollars and paid it again to give the nine back. Luis had said <em>sorry,<\/em> and there was nothing to be sorry for, and he wrote back and said so in one line.<\/p><p>He built the button that week, at the table, five to seven. <em>Pause.<\/em> It stopped the charging and kept everything else: the students, the credits, the week, the sentence on the parent page, and a date to come back on, or no date. He put it where <em>Cancel<\/em> was and moved <em>Cancel<\/em> underneath it, smaller. Four people used it in the first six days: Diane, Luis, Taiwan, and the one going down to eight kids. None of them left, which was the point, and none of them paid either, which was the other point.<\/p><p>Sunday at Orchard he wrote the first help page. <em>How to give a credit anyway.<\/em> Three paragraphs and a picture of the three dots, for Bev, who had asked him the same question four times since May. He put it where a person would look before they called. Bev called once the next week, about something else.<\/p><hr class=\"break\"><p>Yolanda texted Tuesday the ninth at 4:52, during his job, which she still did not care about.<\/p><p class=\"note\"><em>Saturday the thirteenth is gone from my week. The Patels used their credit on the sixth and now their regular Saturday isn't there. You held one lesson and cut the next one. That's not a fermata, Nathaniel, that's a cut.<\/em><\/p><p>He saw it at the light at Maude and saw the cause before the light changed. When a family used a credit to book an open Saturday, the code wrote the makeup on top of the regular lesson instead of beside it. The Patels had gotten their makeup and lost their Saturday. It would have done the same thing on a Tuesday. It had just never been a Tuesday.<\/p><p class=\"note\"><em>I see it. Tomorrow at five. On mine.<\/em><\/p><p class=\"note\"><em>What is it with you and Saturdays.<\/em><\/p><p>He fixed it Wednesday at 5:05 at the kitchen table, on the laptop with Lucy's sticker on it, with the card under the coffee maker that now said <em>Saturdays, twice,<\/em> and put the Patels' lesson back by hand, and wrote Yolanda one line, and she wrote back <em>Good,<\/em> and then, a minute later, <em>The Nguyens are in Tahoe. It's not raining there.<\/em><\/p><hr class=\"break\"><p>Santa Cruz was Claire's idea, and the thirteenth was the first Saturday it could be, and they were over 17 by 9:30 with the fog still on the summit and on the beach past the harbor by 10:15 with the fog gone.<\/p><p>Lucy went in to the knees and stood there being brave about it. Claire went in with her. He put the towels down and the cooler and sat. The phone was in his hand because it was in his hand. At 11:20 Bev wrote about a different button, and he answered it, three lines, with sand blowing across the screen, and looked up.<\/p><p>Claire was standing at the water's edge with Lucy's hand in hers and the waves coming to their shins, and she had turned around, and she was looking at him.<\/p><p>He knew angry. He had known angry since the forty-five dollars in September. This was the look she had given the Arbor lot in February, the brown water at the hubcaps: a thing she was going to have to deal with, and had not decided how. It lasted as long as a wave. Then Lucy pulled, and Claire turned back to the water, and they went in to the waist together, and Lucy screamed the way you scream at cold, happily.<\/p><p>He put the phone in the cooler, under the ice packs, next to the string cheese, and closed the lid. It stayed there through the sandwiches and the sandcastle and Lucy's hour in the water and the walk to the car. He took it out at the summit on 17, with Lucy asleep in the back and sand in everything. It had six things on it, and none of them was Bev.<\/p><p>\"You put it in the cooler,\" Claire said, at the top of the hill.<\/p><p>\"I did.\"<\/p><p>\"I saw.\"<\/p><p>That was all. She put her hand on the back of his neck for a second, where the sun had gotten it, and took it away, and they came down into the valley with the windows open.<\/p><hr class=\"break\"><p>The email came Monday from a piano teacher in Los Altos he had met once, at St. Bede's, who had taken the thirty days and paid on the eighth: the ninth teacher, the one who made the July card say <em>9<\/em> and <em>$78<\/em> instead of eight and something less.<\/p><p class=\"note\"><em>A mom canceled at 7 Tuesday night for a 4:30 Wednesday. I have said yes to that for eleven years. This time I didn't say anything, because I didn't have to. The page said it. She wrote back \"understood.\" I sat in my kitchen and did not feel like a bad person. I wanted you to know that. Thank you.<\/em><\/p><p>He read it four times. Thursday night he printed it at the library on Alder Avenue for fifteen cents, one page, and at home he put it in the drawer with the takeout menus, face up, on top of the card that said <em>invoices<\/em> and <em>recitals,<\/em> which was still face down.<\/p><p>Friday the nineteenth he came home at 6:10 and there was a brochure on the counter by the mail. Glossy, tri-fold, the state university's seal in the corner. <em>Reading and Literacy, M.A. Information session Wednesday, August 7, 6:30 p.m.<\/em> It was on top of the mail, not under it. Claire was in the shower. He read the front of it with his bag still on his shoulder, and set the bag on the counter beside it, not on it, and got a glass of water, and did not pick it up.<\/p><p>She came out with her hair in a towel and made dinner. The brochure was on the counter through dinner, and after dinner it was not, and he did not ask where it had gone, and she did not say.<\/p><hr class=\"break\"><p>Kim texted Sunday night at 8:40.<\/p><p class=\"note\"><em>You owe me August. Back to Studio is Saturday, August 3, Grace Community Church in San Jose, nine to one. I am giving you the slot after the coffee, when they are awake and before they are hungry. Ten minutes. Sixty teachers. Don't be boring.<\/em><\/p><p>He wrote <em>Aug 3. Ten minutes.<\/em> on a card and set it on the counter, on the spot where the brochure had been on Friday. Claire was reading in bed with the door open. He turned off the light over the stove and went down the hall.<\/p>", "words": 2023}, {"num": 18, "title": "Back to Studio", "part": 1, "meta": "August 3–31, 2024 · San Jose, Quince Court, the Alder Creek trail, and Gilroy", "html": "<p>The hall at Grace Community Church had a stage with a curtain nobody had opened in years, a coffee urn the size of a water heater, and sixty-one music teachers on folding chairs at 10:05 on a Saturday morning, and Kim Duong was at the back of it with her phone held up so he could see the timer on it.<\/p><p>\"I'll hold it up at eight,\" she had said at the door, with the car key on her finger. \"At ten I say 'time' and I mean it.\"<\/p><p>He had no slides. He had the laptop on a music stand somebody had found him and his phone in his hand.<\/p><p>\"In May I did this at St. Bede's,\" he said, \"and Yolanda Beck counted how many times I said 'I think.' Five, in five minutes. I'm going to try for none.\"<\/p><p>That got the small laugh he needed. Yolanda, in the third row, did not laugh, and held up five fingers.<\/p><p>He showed them the phone. A lesson. A time. A teacher's name and her one sentence, and the button. He pressed it, and the page said what it said, a credit, before nine, and then the two open Saturdays underneath.<\/p><p>\"Nobody under thirteen touches it. Nobody installs anything. The parent gets a text or an email with a link, and the link is a page, and the page says your policy in your words and does the arithmetic.\" He turned the laptop to the front row. \"This is the summer. You press this and it stops charging you and keeps everything, your kids, your credits, your Saturdays. Four people used it in July. None of them left. That's the whole product. It doesn't do your invoices. It doesn't plan your recital.\"<\/p><p>\"Does it text?\" A man near the urn. He had known it was coming since St. Bede's, and he had an answer ready, and it was not the one he had planned.<\/p><p>\"By the twelfth. Before school starts.\"<\/p><p>\"What's it cost?\"<\/p><p>\"Nine dollars a month. Seventy-nine for the year. The year's three months free and change.\" He looked at Kim, who had the phone up, eight. \"If you take the year, you're not on a trial. You're a customer. I answer customers first.\"<\/p><p>\"Why should I pay you and not Allegro?\"<\/p><p>\"Because Allegro's nineteen and does forty things, and you use three of them, and I'm not calling you on Tuesday to ask how it's going.\"<\/p><p>\"Time,\" Kim said.<\/p><p>Kim, passing him at the side of the stage, said, \"Nine fifty. That was fine. Go stand by your table.\"<\/p><p>The table was a card table by the coffee with a sheet of paper on it that said FERMATA in his own handwriting and a laptop open to the signup page, the year on the first line and the month on the second, where the eye went. Between sessions people came and asked one question, or typed. A piano teacher from Los Gatos read the two prices for a long time and then read her card number into the laptop, seventy-nine dollars, and said, \"There. Now I don't have to think about it,\" and he understood that this was what the year was for. A man from Bay Music Supply, who had a table of method books across the hall, took a card and said nothing.<\/p><p>Kim came at 12:50 with her tea. \"How many?\"<\/p><p>\"Eleven. And people took cards.\"<\/p><p>\"They'll do it tonight, after they've told their husbands.\" She looked at the sheet with his handwriting on it. \"You'll want a banner next year. And you're buying the coffee.\"<\/p><p>Nineteen by ten that night. He wrote it on a card in the morning under the other two. <em>St. Bede's: 22, 3. Forty emails: 2, 1. Grace: 61, 19.<\/em><\/p><hr class=\"break\"><p>Monday morning at 5:10 he did the thing he had promised sixty-one people he would do.<\/p><p>The company that sent the texts had a form, and the form wanted the company that would be sending them. He had one. The LLC had come back from the state on June 10 with a stamp on it, and the Alder Creek license two days later, and he typed the name into a form for the first time as if it were a fact. Then a second form, about the messages: what they said, how often, a sample, and a box that asked how the people receiving them had agreed to receive them. He typed a sentence into the box and moved on, because the sample was the part that mattered.<\/p><p>There were fees, small ones, and a page that told him what a text cost, $0.0079 a segment, which he wrote on the card to look at it. Twenty texts for sixteen cents.<\/p><p>At the top of the page, where the answer went, it said <em>Pending<\/em>.<\/p><p>He looked at <em>Pending<\/em> a while. The help page said reviews took a few business days. It was the fifth. School in the district started the twenty-sixth, and Yolanda's fall term started the same Monday, and he had said the twelfth in a church hall.<\/p><hr class=\"break\"><p>He shipped it Monday the twelfth at 5:40 in the morning. A switch on every teacher's page, <em>Text reminders,<\/em> off by default, the text going the evening before at six, which was what the teachers had asked for. He turned it on for Yolanda himself, and she wrote back, <em>Good. Turn it on for the ones who don't read email and leave the rest alone, I'm not paying for texts to Trish Nguyen.<\/em><\/p><p>The registration page still said <em>Pending<\/em>. He checked it at 5:41 and again at 12:15 from the roof of the structure, and it said the same thing, and he decided, over the burrito, that pending meant soon.<\/p><p>By Friday twenty-two teachers had turned the switch on.<\/p><hr class=\"break\"><p>Devin came down on the seventeenth, on the 8:22 out of Fourth and King, and texted from the platform at Mountain View: <em>there was one of the new trains at 4th and king and I did NOT get it. got the old one. it smells like 2009.<\/em><\/p><p>He had been to Orchard twice and never past the counter. He stood on Alder Avenue with his coffee and looked at the four blocks of it and said, \"So this is the town,\" and Nate said it was, and they walked.<\/p><p>The trail started behind the library. In March the creek had been loud and brown under the footbridge; now it was a strip of gray cobbles with blackberry grown over both banks, and the roar of 85 came through the trees from the south, steady, the way it came into the backyard on Quince Court. Devin walked on the cobbles and looked at the houses through the fences, the old ones and the rebuilt ones side by side.<\/p><p>\"That one's four million,\" he said, \"and the one next to it's whatever the old lady paid in 1971. Dude. This place.\"<\/p><p>\"How's your dad?\"<\/p><p>\"Same. Worse. Same.\" He kicked a cobble. \"He's got the oxygen at night now. He's fine with it. I'm the one who's not.\" He walked a while. \"The pod's dead, by the way. Half the front-end team's on the migration and I'm on the other half, which is nothing. I read threads.\"<\/p><p>Nate let him talk.<\/p><p>\"How many?\" Devin said.<\/p><p>\"Twenty-six paying, as of this morning. Nineteen came out of a church hall two weeks ago.\"<\/p><p>\"That's a real number, Nate.\" He stopped on the cobbles. \"So I've been thinking about the parent side. Don't make the face.\"<\/p><p>\"I'm not making a face.\"<\/p><p>\"You are, and I'm not saying the store. I heard you in March. But there's a thing now that goes on the home screen from a web page. It installs like an app and nobody in a building anywhere says yes to it. And it gets the bell.\" He had his hands out, shaping it. \"The parent taps the link once, ever, and after that it's an icon next to Instagram, and when the lesson's tomorrow the bell goes. You keep your link. I build the thing around it. On the side. Nights. Honestly, I've got nothing but nights.\"<\/p><p>A woman went by on the paved path with a dog that wanted the blackberries.<\/p><p>He had a page in a drawer that said no parent app. He had said <em>not yet<\/em> in March and Devin had drunk the cold coffee. He was standing on the cobbles with a friend who had two dead projects and a father on oxygen and had just offered him his nights, and he was grateful, and he could feel the <em>no<\/em> somewhere below the gratitude and could not get to it.<\/p><p>\"Okay,\" he said.<\/p><p>\"Okay yes?\"<\/p><p>\"Okay yes.\" He put his hand in his pocket for a card and there was no card; they were in the car. \"If this ever makes money, I'll cut you in.\"<\/p><p>Devin looked at him, and did the thing his face did before he was sarcastic, and then didn't.<\/p><p>\"Deal,\" he said, and stuck his hand out, and Nate shook it, on the creek bed, with 85 going by behind the trees and nothing in either of their hands but the other one.<\/p><p>They walked back on the path. Nate said the texts had gone live Monday and the registration was still pending, and Devin said, \"It's always pending. That's what it says,\" and at the station he had the iPad out of his bag before the train came in.<\/p><hr class=\"break\"><p>On Tuesday an email from the texting company went where the texting company's emails went, a folder he had made on the fifth so the receipts would stop coming to the top, and sat there.<\/p><hr class=\"break\"><p>The roofer from his mother's church was named Gil Pacheco, and he had said April in March and after the rain in April, and on Saturday the twenty-fourth at nine in the morning he was on the roof in Gilroy with a pry bar, and what came off the hall was worse than the flashing.<\/p><p>\"Two sheets of decking,\" he said from the top of the ladder, which Lucy was holding, since that was her job. \"The vent, the flashing, the shingles over the hall. And I'm tarping the back slope, because the back slope's next.\" He came down. \"That buys her a winter. Maybe two. The whole roof's a different conversation, and not this year.\"<\/p><p>\"How much?\"<\/p><p>\"Six for what I said. Half today.\"<\/p><p>His mother was in the kitchen doorway with her arms folded, and she had heard, and she said, \"I have some of it,\" and he said, \"Mom,\" and she said, \"I have some of it.\" He took the phone out, standing in the driveway with his back to the door, and moved six thousand dollars from the account Claire called the house fund into the checking, all of it, so it would be there when Gil was done, and wrote Gil Pacheco a check for three on the hood of the CR-V. Gil folded it without looking at it and went back up.<\/p><p>\"Ay, Nate.\"<\/p><p>\"It's done.\"<\/p><p>\"Your father would have done it himself.\"<\/p><p>\"And fallen off.\"<\/p><p>\"And fallen off,\" she agreed, and went in to make the eggs.<\/p><p>Claire had been inside with Rosa the whole time, and none of it was said in front of her, and by the time they were on 101 north at three with the garlic coming through the vents and Lucy asleep against the window, it had been a decision for six hours, and he had not made it out loud.<\/p><p>He told her at Morgan Hill.<\/p><p>\"Six thousand.\"<\/p><p>\"Half today, half when he's done. I moved all of it. From the house fund.\"<\/p><p>She did not say anything until Morgan Hill was behind them.<\/p><p>\"I'd have said yes,\" she said. \"In about four seconds. You know that.\"<\/p><p>\"I know.\"<\/p><p>\"So the four seconds weren't the problem.\"<\/p><p>She looked out her window, and he drove, and it stayed in the car all the way to Alder Creek Road, and at home she took Lucy in and he took the bags, and she said nothing else about it that night, or the next.<\/p><hr class=\"break\"><p>The card at the end of August said <em>44<\/em> and under it <em>$375.<\/em> The texting company's bill was twelve dollars. The hosting was still nineteen. The registration page still said <em>Pending,<\/em> and he had stopped checking it every day, because school had started Monday and the texts were going out at six every evening with the link in them, and nobody had said a word.<\/p><p>Devin's text came Saturday night at 10:40. It was a photograph of an iPad on a coffee table with the Mud Hens cap beside it, and on the iPad a screen in a color Nate would never have picked, with a bell in the corner, and under the picture: <em>ill have mockups by sunday.<\/em><\/p>", "words": 2159}, {"num": 19, "title": "Silent", "part": 1, "meta": "September 3–22, 2024 · Quince Court, Orchard Coffee, Sunnyvale, and Persimmon Lane", "html": "<p>Helen Pak's email was three lines long, and it was the first thing she had ever written him, and he read it at the window table at Orchard at 9:20 on Saturday the seventh with the drip going cold beside it.<\/p><p class=\"note\"><em>Text reminders show \"on\" for all 22 of my students. Two parents told me yesterday they haven't had a text since school started. They did get the emails. Is there something I need to set on my end? Thank you for the tool.<\/em><\/p><p>He opened his own page first. It said what it had said every morning since the twenty-sixth. <em>Texts sent this week: 412.<\/em> Under it a list, family by family, each with a time and the word <em>Sent.<\/em> He had written that screen to say <em>Sent<\/em> when the texting company took the message. He had never written the part that asked, an hour later, what the company had done with it.<\/p><p>He signed in to the texting company.<\/p><p>It was a list too, the same families, the same times. Every row was red. Every row had the same number on it and the same four words after the number, and the fourth word was <em>unregistered.<\/em> He scrolled back to the twenty-fifth, a Sunday, six in the evening, the first night of the fall term, and the rows there were red. The company had taken every message he had handed it, for two weeks, and had delivered none of them, and had said so, in red, on a page he had not looked at.<\/p><p>He found the folder next. It was called <em>Twilio,<\/em> and he had made it on August 5 so the receipts would stop coming to the top, and there were nine things in it, and the fourth one, dated August 20, said <em>Your campaign was rejected.<\/em> Under that, a reason, and the reason was the box. The sentence he had typed on the fifth and moved on from. They had told him so the same day, and he had checked <em>Pending<\/em> from the roof of the structure for a week after and then stopped.<\/p><p>On Tuesday the church hall's thirty days had run out and eight charges had come in a row at 6:12 in the morning, nine dollars each, and he had thought that was the news of the week.<\/p><p>He did the arithmetic. Forty teachers had turned the switch on. Eleven hundred texts, about, since the twenty-fifth. None. Gail came for the cup and said, \"You all right?\" and he said, \"I think so,\" and she took the cup.<\/p><hr class=\"break\"><p>He wrote it Sunday at six in the morning at the kitchen table, and it took him an hour, and he sent it to Claire's phone before he sent it to anyone, and went and stood in the bedroom door while she read it in bed.<\/p><p class=\"note\"><em>Subject: Text reminders have not been going out. Here's what happened.<\/em><\/p><p class=\"note\"><em>Since August 25, text reminders from Fermata have not been delivered. Email reminders went out. Texts did not. Your screen said \"on\" because I wrote it to say what I had sent, not what had arrived. That was my mistake.<\/em><\/p><p class=\"note\"><em>What happened: the phone carriers won't deliver texts from a business until the business registers with them and describes, in words they accept, how people agreed to get the texts. I applied on August 5. On August 20 they turned the application down because of how I described that. The email went to a folder I don't check. I turned texting on August 12, while it was still pending, because school was starting. That was my decision and it was wrong.<\/em><\/p><p class=\"note\"><em>What I'm doing: I'm rewriting the application this week. They take up to a week to answer. When it's approved, I'll tell you here and on your page. I'm also building the part that checks whether each text actually arrived, so the screen can't say \"on\" when it isn't.<\/em><\/p><p class=\"note\"><em>Until then, please send reminders the way you did before. If you want September back, reply with the word \"refund\" and I'll do it that day. I'm sorry.<\/em><\/p><p>She read it and handed the phone back.<\/p><p>\"Send it.\"<\/p><p>\"Nothing to cut?\"<\/p><p>\"Not this time.\"<\/p><p>He sent it to every teacher at 7:14, sixty-eight of them, paying and trying, and the replies came through the day, and most of them were kind, and six said <em>refund,<\/em> and he did the six before lunch, fifty-four dollars, and the page kept fifty-six cents six times.<\/p><hr class=\"break\"><p>Yolanda did not reply, which he took for Yolanda.<\/p><p>She called Tuesday at 4:48, when he was on the third level of the structure with the badge still in his hand, and he sat down on the concrete wheel stop by the CR-V, because he knew the voice.<\/p><p>\"Nathaniel. Three empty benches today. The Ruizes at three. The new girl at four, whose mother I have met once. And the Lindqvists at four-thirty, who have been with me six years and have not missed a lesson since the boy had his tonsils out.\"<\/p><p>\"They didn't get the text.\"<\/p><p>\"Nobody got the text. I turned it on for the ones who don't read email. That was the whole point of it.\"<\/p><p>\"I sent an email Sunday.\"<\/p><p>\"You sent me an <em>email.<\/em> In <em>September.<\/em>\" She let that sit. \"I have thirty-four children finding the bench this week and half of them have grown four inches since June and I do not read mail in September, I read the page you put in front of me. That's a rest I didn't write, three of them, and I sat through every one.\"<\/p><p>\"I'm sorry.\"<\/p><p>\"Don't be sorry. Put it where I look.\" A car door on her end, a child's voice, the four-thirty, or the five. \"And call the Lindqvists yourself. No. Don't. I'll call them. You'd apologize.\"<\/p><p>He built it that night at the table, after Lucy was down: a bar across the top of every teacher's page, yellow, that could not be closed. <em>Text reminders are not being delivered. Email reminders are. Please send texts by hand until this bar is gone. Nate, Sept. 10.<\/em> It was ugly, and it was in front of the thing they came to look at, and it went up at 9:50, and Yolanda wrote at 9:52, <em>Fine.<\/em><\/p><p>Kim wrote at 10:15. <em>Three people in my group are asking whether the texts work. I'm not asking. I'm telling you they're asking, and that I recommended you.<\/em> He wrote back the same four lines, and she wrote, <em>Thank you for saying it plainly. Fix it,<\/em> and posted nothing.<\/p><p>Nine of them left between the tenth and the twentieth. Four were from the church hall, and had had him five weeks. One wrote a paragraph. Most of them pressed the button and said nothing, and the button told him each time, at whatever hour, and he read every one. He wrote it on a card, <em>9,<\/em> and under it <em>$54,<\/em> and put the card with the others.<\/p><hr class=\"break\"><p>Thursday the twelfth, at five in the morning, he opened the form again, and this time he read the box before he typed in it.<\/p><p class=\"note\"><em>How do recipients opt in to receive messages?<\/em><\/p><p>On the fifth he had typed something about teachers and reminders that he could no longer remember, a way past the box. He wrote it now the way he would have said it to Bev in her driveway. Parents give their phone number to their child's music teacher, in person or on the teacher's fall form, and ask to be reminded. The teacher turns reminders on for each family, one at a time, on a switch. Every message ends with <em>Reply STOP to stop,<\/em> and STOP stops it. He read it four times. He put the STOP line on the end of the sample, which had not been there in August, and built the part that heard STOP, and paid the fee again, and pressed the button, and it said <em>Pending.<\/em><\/p><p>He deleted the folder rule. Whatever the texting company said from now on would land at the top, with his mother's Wednesday emails and Lucy's school.<\/p><p>Then the part he had promised sixty-eight people: a job that ran every hour and asked the company what had happened to each text, and counted. If more than a few in a row came back red, the yellow bar went up by itself, on every page, and his own phone got a text. The job needed a machine that stayed awake, and the plan he had been on since April did not include one, and the next plan up was sixty-five dollars.<\/p><p>He told Claire Thursday night before the statement.<\/p><p>\"Sixty-five. Hosting. Starting today.\"<\/p><p>\"From nineteen.\"<\/p><p>\"It's the part that checks.\"<\/p><p>\"Okay,\" she said, and wrote it in the sheet, in the row under his hours.<\/p><hr class=\"break\"><p>The approval came Friday the twentieth at 3:14 in the afternoon, to the top of his inbox, one line, and he read it in the CR-V before he started the engine.<\/p><p>Saturday morning he wrote the second note, shorter than the first. What the carriers required, in the plain words. That they had said no on August 20 and yes on September 20, and what had changed in between, which was the words. That the yellow bar would come down at six tonight, when the first real ones went, and that if it ever came back, he would already know.<\/p><p>At six on Saturday evening he sat at the table with the texting company's list open and watched the rows come in. The first one was green. He had never seen a green one. <em>Delivered.<\/em> Then thirty. Then three hundred and some, Yolanda's Monday and Bev's and Helen Pak's twenty-two, and the yellow bar went down on its own at 6:04, and he watched the list and did not touch it.<\/p><p>Devin had been texting since morning. Caltrain had turned the diesels off that day, all of them, and put the new trains on, and Devin had ridden one from Fourth and King to San Jose for no reason at all and was riding it back.<\/p><p class=\"note\"><em>DUDE. its silent. you can hear people TALKING.<\/em><\/p><p class=\"note\"><em>there are OUTLETS. at every seat. im charging things i dont need to charge.<\/em><\/p><p class=\"note\"><em>59 minutes to san jose. i timed it. i have never once cared about a train and i care about this train.<\/em><\/p><p class=\"note\"><em>theres a party at palo alto with a band. the band is worse than your customers.<\/em><\/p><p>He read them at the sink, and they were the only thing in the whole week that had made him laugh, and he wrote back <em>how's the mockup<\/em> and Devin wrote <em>tomorrow. for real tomorrow.<\/em><\/p><hr class=\"break\"><p>The card on Sunday the twenty-second said <em>61,<\/em> and under it <em>$520.<\/em> Nine gone. Twenty-six in since the third, most of them from the church hall's thirty days and from Kim's group after, some of them the year. It had grown while it was broken, because the emails had gone and the pages had worked and the thing the teachers had paid for was still the thing it had been in April, and he could not decide whether that was a comfort.<\/p><p>The file came at 9:50 Sunday night, from Devin, with no message on it, and he opened it at the table.<\/p><p>Forty screens. He counted, because that was what he did. They were beautiful. They were in the color from the photograph and a second color he would not have thought of, and every one had the bell, and a parent's name at the top, and the lesson under it, and the credit, and a button that was the right size for a thumb. He scrolled. A screen for the schedule. A screen for the policy, in the teacher's words, prettier than the teacher's words. A screen for an invoice. A screen for paying it. A screen that said <em>Spring Recital,<\/em> with a program on it. A screen for a lending library, with a cello in it.<\/p><p>He had a page in a drawer that said none of that. He scrolled to the end, and back to the beginning, and sat with the forty screens the way he had once sat with one page, and did not close the laptop.<\/p>", "words": 2048}, {"num": 20, "title": "Oakland", "part": 1, "meta": "Saturday, September 28, 2024 · I-880 and East Oakland", "html": "<p>The band room at Havenwood Middle School had chairs in three arcs, a sousaphone on a stand with a dent in the bell, and six kids in it at 10:20 on a Saturday morning playing the same four bars for the fifth time, and Marcus Tillman was standing in the middle of them with a trumpet under his arm, not playing it.<\/p><p>\"Again. From the pickup. Simone, you're early. You're always early. Be early somewhere else.\"<\/p><p>They played it again. A girl on baritone, who Nate would learn was Simone, fourteen, Marcus's own, and a year into the instrument, got the four bars right, and Marcus pointed at her without looking, and the others heard it and got closer, and he let them stop.<\/p><p>\"That's low brass. Go home. Tell your mothers I said so.\"<\/p><p>He had said ten-thirty and it was 10:31. He put the trumpet in a case that had been re-latched with a zip tie and walked Nate out past a wall of photographs, thirty years of bands, the same risers, the kids' clothes changing and the sousaphone the same.<\/p><p>\"Eleven hundred a month, two schools,\" Marcus said, in the lot. \"I told you that in May. What I didn't tell you is the district gives the program nine hundred a year for reeds, valve oil, and repair. I spend twenty-four hundred. The difference is a wedding in Walnut Creek tonight, and the difference has been a wedding for eleven years.\" He unlocked a Corolla with a horn case in the back seat. \"Follow me. It's eight minutes. Don't stop at the yellow, they don't here.\"<\/p><hr class=\"break\"><p>Nate had been to Oakland twice in his life, once to an A's game with his father, who had talked about the parking the whole way home, and once to a Halyard off-site at a hotel by the airport that could have been anywhere. He had driven up 880 that morning at 8:40 with the port cranes on his left and the Coliseum on his right and the road under him the color of old concrete, and had thought, going past the airport, that an hour was not very far to go to see a customer, and that he had never once done it.<\/p><p>The house was a bungalow on a street of bungalows with a chain-link fence and a lemon tree that was doing worse than Mrs. Halvorsen's. Tanya Tillman was at the kitchen table in scrubs with a mug of tea, home since 8:15 from a night on the unit, and she looked at Nate with the expression of a woman who had been awake for twenty-two hours and was going to be polite for ten more minutes.<\/p><p>\"You're the link man.\"<\/p><p>\"I'm the link man.\"<\/p><p>\"He talks about you like you're a person he knows.\"<\/p><p>\"I've met him once. On the phone.\"<\/p><p>\"That's a person he knows.\" She stood up with the tea. \"I'm going to bed. He's going to feed you. Don't let him play you anything, he'll play you the whole set.\" A boy of seventeen, Deshawn, came through the kitchen with car keys already in his hand and said \"Hey\" to Nate and \"Tank's on E\" to his father and was gone, and a door somewhere had music behind it, which was Simone, who had ridden home in the Corolla and gone straight to it.<\/p><p>Marcus put a pan on. Eggs, sausage, grits from a pot that had been on low since before the sectional.<\/p><p>\"Sit. You drove an hour to watch me text. You're going to eat while you watch.\"<\/p><hr class=\"break\"><p>He showed him at the table with the phone flat between them and the grits steaming.<\/p><p>\"This is Jaden's mother. Jaden's my Saturday ten o'clock at their house, sixty-five, because of the dog. Read that.\"<\/p><p class=\"note\"><em>Hey Marcus!! So sorry, I think we forgot about tomorrow, Jaden has a thing, is that ok??<\/em><\/p><p>\"Friday night. 7:40. She forgot in March, and I gave her the lesson back. She forgot in April and I gave it back. She forgot in May, and Tanya said, You know she's not forgetting.\"<\/p><p>\"And you gave it back.\"<\/p><p>\"I gave it back.\" He turned the phone. \"Now watch what I did. I didn't type a word.\"<\/p><p>Under her message there was a link, and nothing else. Nate knew the link. It was the one the app sent in the six o'clock text, the one that went to the page.<\/p><p>\"I copied it off her Saturday and sent it. That's all. That's the whole technique.\" He scrolled. Ten minutes went by on the screen. Then, from her: <em>Ok got it. We'll take Sunday 2. Thx.<\/em><\/p><p>\"She opened the page. The page said 7:40 Friday for 10 Saturday, and it said my policy, which is a day, because I've got to drive to the dog, and it said no credit, and then it said here's Sunday at two anyway if you want it, because you turned that on for me. She took Sunday. She paid for Saturday. She never said another word about forgetting.\" He ate some eggs. \"I've been doing it since June. Anybody texts me with two exclamation points, I don't read the rest. I send the page.\"<\/p><p>\"Before they cancel.\"<\/p><p>\"Before they <em>finish.<\/em>\" He pointed the fork. \"Parents don't cancel on me. They cancel on a text they can argue with. Now they cancel on a page they can't. I'm still the nice one. I'm the nicest I've ever been. You built a bad-guy machine and you don't know it.\"<\/p><p>Nate nodded. He was thinking that the link Marcus had copied was the same link he had shipped in April with the number on the end of it, and that there was a screen in Devin's forty that would have had a button for exactly this, <em>Send policy,<\/em> in the second color, and that the button would be a good screen to keep when the other thirty-nine got argued over, and that if Marcus was doing this by hand, other people were, and he should look at the logs.<\/p><p>\"You've got a look,\" Marcus said.<\/p><p>\"I'm listening.\"<\/p><p>\"You're nodding. That's a different thing.\" He got up and filled Nate's plate again without asking. \"What's it cost you to text my people?\"<\/p><p>\"About thirty-eight dollars this month. For everybody. Sixty-one teachers.\"<\/p><p>\"And August?\"<\/p><p>\"Twelve.\"<\/p><p>\"For what?\"<\/p><p>\"For nothing. It didn't work in August.\"<\/p><p>Marcus laughed, a real one, with his head back. \"You paid twelve dollars to send nothing. Man, that's the district.\" He sat back down. \"Sixty-one. At nine.\"<\/p><p>\"Five-twenty a month. Some of them pay the year.\"<\/p><p>\"That's less than I make from the district.\"<\/p><p>\"I know.\"<\/p><p>\"That's a joke you happen to love.\"<\/p><p>\"I know.\"<\/p><hr class=\"break\"><p>\"What do you still do by hand?\" Nate said, at the second plate.<\/p><p>\"The money. Same as everybody. Venmo, and a spreadsheet, and Jaden's mother owes me for May.\" Marcus looked at him. \"Why. What's the look.\"<\/p><p>\"That's next. Invoices. Paying through the page. And a recital thing, a program you can print, and a library for the loaner horns, and the parent gets a real app, on the home screen, with the bell.\"<\/p><p>\"Who asked for the recital thing?\"<\/p><p>\"Two people.\"<\/p><p>\"Who asked for the library?\"<\/p><p>\"One.\"<\/p><p>\"Who asked for the parent app?\"<\/p><p>Nate did not say Devin. \"It's a good idea.\"<\/p><p>\"I'm sure it's a good idea.\" Marcus put his fork down. \"Here's what I asked for. I asked for a thing that isn't me. You built it. It's in my phone. It works when I'm at a wedding. Now you're going to put a recital program on it.\"<\/p><p>\"You'd use the invoices.\"<\/p><p>\"I'd use the invoices,\" Marcus admitted. \"Jaden's mother would not. She'd get a page with a number on it and she'd argue with the number, and I'd be the one on the other end of it again.\" He shrugged. \"Build it. You're going to. I'm telling you what you've got, in case you forget you've got it.\"<\/p><p>Nate nodded again. He was on the invoices already, on whether a page with a number on it could show the credit beside the number so there was nothing left to argue with, because the forty screens were in the car in his bag, printed, and he had spent the drive up 880 sorting them.<\/p><p>\"Can I put you on the site?\" he said. \"Your name. What you just told me. A paragraph.\"<\/p><p>\"No.\"<\/p><p>\"Why?\"<\/p><p>\"Because I'm not a paragraph. I'm a trumpet player with a dog to drive to.\" Marcus stood and took the plates. \"Put Yolanda on it. She'd like it.\"<\/p><p>\"She wouldn't.\"<\/p><p>\"No,\" Marcus said, \"she wouldn't,\" and ran the water.<\/p><hr class=\"break\"><p>He walked Nate out to the CR-V at 12:40. The horn case was on the porch already, for Walnut Creek, along with a garment bag and a folding stand with tape on one leg.<\/p><p>\"Three hundred and a plate,\" Marcus said. \"The plate's the good part. The bride's mother is Filipino, there's going to be lumpia.\" He put his hand on the roof of the car, the way the man in the landscaping truck had put his hand on the Civic's, a year ago on Foothill, after it died. \"Nate. The bad-guy thing. I said it in May.\"<\/p><p>\"I remember.\"<\/p><p>\"You laughed.\"<\/p><p>\"I remember.\"<\/p><p>\"Okay.\" He took his hand off the roof. \"Drive safe. Don't stop at the yellow.\"<\/p><hr class=\"break\"><p>He was south of the Coliseum at 1:05 with the cranes on his right now and the bay under the haze, and he had the radio on his father's station, which came in from somewhere down the bay, and he was thinking about the logs, and whether he could see how many teachers had sent a link before a cancellation instead of after, and what that number would be.<\/p><p>The phone buzzed once in the cupholder, and then twice more.<\/p><p class=\"note\"><em>prototype. 40 screens. every button goes somewhere. click anything.<\/em><\/p><p class=\"note\"><em>its not pictures anymore dude. its a THING.<\/em><\/p><p class=\"note\"><em>dont open it driving<\/em><\/p><p>He did not open it driving. He drove it down 880 to 237 to the duplex with the link sitting in the cupholder. At 2:10 he pulled into Quince Court and turned the engine off and sat, and opened it. The first screen was there, in the color, with the bell. He touched the button that said <em>Schedule,<\/em> and it went somewhere, and he touched the next one, and it went somewhere, and it was 2:30 before Lucy came out to the driveway to find out why he was still in th
