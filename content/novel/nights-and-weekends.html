 Nate could follow. \"And when the streak hits seven, something happens. A sticker. Something drops in.\"<\/p><p>\"Yolanda gives stickers.\"<\/p><p>\"See? Validated. What does your kid like?\"<\/p><p>\"Whales.\"<\/p><p>\"Then it's a whale.\" He was already drawing one, badly. \"We'll get a real one. There's icon packs. Twenty bucks.\"<\/p><p>Nate watched the ring close on the simulator and felt a small clean thing he recognized from a green test suite and hadn't felt in a while, and he let himself have it for the length of the drive home, with the rain coming down on the new car and the wipers doing what they were told.<\/p><hr class=\"break\"><p>Sunday afternoon Lucy drew at the other end of the table while he worked, which she did most days now, without asking, the way she'd have sat by a fire. She had the big crayons and the paper Claire brought home from school. He didn't look up. At some point she took the drawing to the refrigerator and asked Claire for the whale magnet, and Claire gave it to her, and there was some discussion about height.<\/p><p>He saw it at 12:40 that night, getting water.<\/p><p>A man at a table, drawn in brown, with a rectangle in front of him. The rectangle was colored blue, hard, the crayon gone shiny, and the man's face was turned to it. Over on the right, small, a girl with a whale, and a woman with a flashlight, and a lot of sky. Across the top in her letters, the R backward:<\/p><p>DADY AT THE COMPUTR<\/p><p>He stood with the glass and looked at it. He did not take it down.<\/p>", "words": 1977}, {"num": 7, "title": "Room 14", "part": 0, "meta": "November 27 – December 8, 2023 · Arbor Elementary and Quince Court", "html": "<p>Owen Sato's mother had brought her own copy of the report card and underlined the reading line in pen, and she set it on the kidney-shaped table the way Claire's third-graders set down a drawing they were not sure about.<\/p><p>\"It says 'approaching,'\" Mrs. Sato said. \"It said 'approaching' in June.\"<\/p><p>\"It did.\"<\/p><p>\"So he's not approaching. He's standing there.\"<\/p><p>It was 1:20 on the Monday after Thanksgiving, the first of twenty-four conferences in five days, and Claire had the folder open to Owen's running record, the words he'd missed marked in her small print above the words he'd been given. He was eight. He read like a careful six-year-old, one word at a time, with a finger, and he knew it, and in October he had started asking for the nurse at 10:50, when the reading groups moved.<\/p><p>She said the true things in order. He was working hard. He was two years behind where a third-grader ought to be by spring. Mrs. Adair, the reading specialist, was at Arbor Tuesdays and Thursdays, split among three schools, and Owen was on her list, which was long. The rest of the time he was Claire's, with twenty-three others, and Bernie's, the para, who was in Room 14 from 10:40 to 11:30 and belonged to Rooms 12 and 16 the rest of the day.<\/p><p>\"What would you do,\" Mrs. Sato said. \"If he was yours.\"<\/p><p>Claire had an answer for that and could not give it, because the answer was that she would sit with him forty minutes a day, every day, with the letter tiles and the decodable books Mrs. Adair kept in a rolling cart that went home with her on Thursdays, and she did not have forty minutes a day for one child. She had twenty-four children and a room built in 1961 with the radiators to prove it. She had a rolling cart of her own, in her head, and it had a name, the program at State, fourteen thousand dollars a year for two years, and the page was bookmarked on her phone in a folder called <em>Recipes<\/em>, because she was thirty-three and hiding a website from her husband was apparently a thing she did now.<\/p><p>\"I'd read with him every night,\" she said. \"Ten minutes. Him reading to you, and you not helping until he asks.\"<\/p><p>\"He gets so mad.\"<\/p><p>\"I know. Let him be mad at the book. It can take it.\"<\/p><p>Mrs. Sato laughed, once, and it went out of her like air, and Claire wrote <em>decodables home Tues<\/em> on the folder and <em>call Adair<\/em> under it, and at 1:40 she stood up, because the Delgados were in the hall.<\/p><hr class=\"break\"><p>The rumor came through the staff room on Wednesday with the birthday cake.<\/p><p>\"Three K next year,\" said Ruth Amsel, who had taught second grade since 1998 and had the good chair. \"Not four. That's from the district office. That's not me.\"<\/p><p>\"Three's a rumor.\"<\/p><p>\"Three's a spreadsheet. Lorenz has it. She's not saying it because it's November and she wants us to have a nice Christmas.\" Ruth cut the cake. \"Three K means two first in two years, and then it's you people.\"<\/p><p>The staff room was eleven adults and a sheet cake for a para turning fifty, and everyone in it could do the arithmetic and did it, silently, by hire date. Claire had started in August of 2015. There were people in the room from the nineties and people from last year, and she was closer to the middle than she liked. She ate the cake.<\/p><p>Enrollment had been falling since 2019. Everyone knew it the way they knew the lot flooded. Families left for Tracy and for Texas, and the houses they left sold for $2.6 million to couples who did not have children yet, or had one, or sent the one to the school with the Mandarin program. It had never been about her before. She put her plate in the trash and went to get her class off the field.<\/p><hr class=\"break\"><p>Thursday she had six conferences and a fire drill, and at 7:40, with Lucy down after two chapters and a negotiation about a third, she put the folder of reading assessments at her end of the kitchen table and the red pen beside it and sat.<\/p><p>Nate was at his end, with the laptop and the index cards and a coffee he'd made at seven, and the screen showed the thing, the ring, blue, filling. He looked up when she sat and said, \"Hey,\" and she said, \"Hey,\" and that was the conversation.<\/p><p>She did not mind it. She had married a quiet man on purpose, having grown up in a house where her father narrated the news back to the television, and for an hour the table was the one she'd have picked from a catalog: the lamp, the dishwasher running, each of them with their work. Once he laughed at something on the screen, one breath through the nose, and did not say what, and she did not ask, and she filed that she had not asked.<\/p><p>At ten she put the pen down and said she was going to bed.<\/p><p>\"Okay.\"<\/p><p>\"Come soon.\"<\/p><p>\"Okay.\"<\/p><p>She heard both okays and knew what each one was worth.<\/p><p>She knew, lying in the dark, what time it was when he sat back down after the bathroom, because the chair had a sound. 10:15. She knew because she looked. She had a rule with the third-graders about the clock, which was that watching it did not make it go, and she lay on her side and watched it not go.<\/p><p>He came in at 1:20. She was awake. He got in carefully, and she did not turn over or ask what it was, and she noticed the not-asking the way you notice a tooth.<\/p><hr class=\"break\"><p>She did the bills on the first Saturday of the month, at the table, with coffee, while Nate took Lucy to the laundromat on El Camino, because the rack under the lemon tree was no use in December and the dryer in the garage had been a shelf since June. She had asked him to ask about the dryer in August, and in September. In October she had stopped, which was not the same as being fine.<\/p><p>The card statement had closed on the twenty-eighth. She read it and the checking account the way she read a running record, line by line, marking nothing. Costco, twice. Gas. Piano, $208, on the first. The $300 to Rosa on the fifth, which was Ray's and not up for discussion. The loan, $310, the third since October. And on the thirtieth of October, between a Trader Joe's and a Shell: APPLE.COM/BILL, $99.00.<\/p><p>She looked at it for a while. It was an hour and change of her, before the state and CalSTRS took their pieces. The date was the part. October thirtieth was the Monday before Halloween, and on Halloween he had been two minutes behind them for four houses, and she had known then that he'd bought something, the way you know a child has a note in his backpack that he has decided is not a note.<\/p><p>She went through the rest. The first payment on the CR-V would come out on the eleventh, $383, and she had already moved it. She balanced the sheet and put the statement in the folder where the statements went. She did not write the ninety-nine dollars anywhere, and she did not say it when they came home smelling of dryer sheets, Lucy hugging the warm bag against her chest.<\/p><hr class=\"break\"><p>Her mother called at seven on Sundays, from the recliner in Roseville, with the Sacramento news on mute.<\/p><p>\"How were conferences.\"<\/p><p>\"Long. Good. One mom cried, one dad brought a lawyer's tone, nobody brought a lawyer.\"<\/p><p>\"And the girl?\"<\/p><p>\"Lucy's fine. Lucy told her class that blue whales—\"<\/p><p>\"I know about the whales. And him?\"<\/p><p>Claire looked down the hall. Nate was at the table. He was always at the table. Lucy was on the living-room rug in front of the keyboard they'd bought off a listing in Los Altos in September, not playing it.<\/p><p>\"He's building something. An app. For kids, for practicing. It's a nights thing.\"<\/p><p>\"Is it a money thing?\"<\/p><p>\"Not yet.\"<\/p><p>\"Mm.\" Denise had cleaned teeth for thirty-four years and had a way of saying <em>mm<\/em> with a mirror in your mouth that told you exactly what she'd found. \"Your father had a boat that wasn't a money thing yet. Ninety-eight. It lived in the garage and I lived in the house and we both waited to see which he'd finish.\"<\/p><p>\"Mom.\"<\/p><p>\"I'm not saying he's Gary. I'm saying don't be the wife who waits. I did it. It's a bad job. The pay's terrible and there's no pension.\" A pause, the news changing behind her. \"Did you tell him about the program?\"<\/p><p>\"There's nothing to tell yet.\"<\/p><p>\"Mm,\" her mother said.<\/p><p>After the call she stood in the hall a minute longer. At the table her husband was building an app that made children practice the piano. Ten feet from him, his child was not practicing the piano, and had not since Tuesday, and he had not once looked up. She had said this to no one, because it was the kind of thing that got funnier the longer you kept it, and she was keeping it.<\/p><hr class=\"break\"><p>Tuesdays at 4:30 were hers, as Yolanda had told Nate at the first lesson they would be, and on the fifth she sat in the folding chair with spelling tests on her knee while Lucy played the first line of \"Jingle Bells\" with her thumb stuck on the same E.<\/p><p>\"She didn't practice,\" Yolanda said, not turning around.<\/p><p>\"No.\"<\/p><p>\"I can tell, and you can tell, and she can tell. Three people know and one of them's six.\" She moved Lucy's thumb. \"Again. Slower. Nobody's chasing you.\" Then, to Claire, in the same voice: \"He's still coming Saturday? With his phone thing?\"<\/p><p>Claire kept her face where it was. \"Saturday.\"<\/p><p>\"Six families. He asked for six. I said he could ask them himself, at the door, on his own time, and if it costs me a minute of a lesson I'll bill him.\" Yolanda glanced back. \"You knew that.\"<\/p><p>\"I knew he'd asked.\"<\/p><p>It was one of two true sentences available, and she had picked the shorter one. Yolanda looked at her a second longer than she needed to and went back to the E.<\/p><hr class=\"break\"><p>Friday she was in bed by 9:40 with a mystery she had been on page 60 of since Halloween. Conferences were done, twenty-four folders, twenty-four signatures, <em>decodables home Tues<\/em> crossed off and <em>call Adair<\/em> not. The chair made its sound down the hall. She had not, at any point in the week, asked. She had told herself that was a kindness and had known, saying it, that it was also a running total, and that she was very good at those.<\/p><p>She opened Notes. The last one was a grocery list from before Thanksgiving with <em>cranberries<\/em> still unchecked. She made a new one. The cursor sat at the top with the whole page under it, and she thought about what a running record was for: not to catch a child, but so that in June you could show somebody what had happened, in order, with dates.<\/p><p>She typed the date first, because she had been trained to.<\/p><p class=\"note\"><em>Nov 30. 10:15–1:20. Didn't ask.<\/em><\/p>", "words": 1926}, {"num": 8, "title": "TestFlight", "part": 0, "meta": "December 9–31, 2023 · Persimmon Lane, Sunnyvale, Quince Court, and Gilroy", "html": "<p>He had printed six copies of the instructions, one per family, and by 9:28 Saturday morning he was standing on Yolanda's driveway holding them like a man handing out flyers for a church he was not sure of himself.<\/p><p>Three steps. Install the TestFlight app. Tap the link. Tap Install. He had tested it on Claire's old iPad at six, and had still printed six, because paper was what you gave a parent at a garage door.<\/p><p>Trish Nguyen was first, with Cody, who was nine and had a Lakers jacket on over pajamas.<\/p><p>\"Yolanda said you'd be out here,\" Trish said. \"Is this the whale thing? Cody, it's the whale thing.\"<\/p><p>\"It's a timer,\" Nate said. \"He hits start, he practices, he hits stop. It remembers. There's a streak.\"<\/p><p>\"Is it free?\"<\/p><p>\"It's free.\"<\/p><p>\"Cody. Give the man your iPad.\"<\/p><p>By 12:50 he had six. The Nguyens. The Ortegas, whose boy set it up himself in the car while his mother texted. The Patels, who read every word of the sheet and asked what it did with the data, and he said a first name and the minutes and a note from the teacher, nothing else, and they looked at each other and said okay. A girl named Sunny whose father did it standing up. A boy whose grandmother wanted to know if it cost money next month, and he said no, and she said, \"They always say no,\" and installed it anyway. Six, not counting Lucy, who had it on the old iPad by that afternoon.<\/p><p>Yolanda came out at 1:05 with her keys.<\/p><p>\"Six?\"<\/p><p>\"Six.\"<\/p><p>\"Then we're done, and you're on the street.\" She held her phone out. \"Put yours on it. I'll look at it if a child makes me.\"<\/p><hr class=\"break\"><p>He kept a table on the little server that counted sessions. He looked at it from his own phone, at lunch, in the CR-V on the top level of the structure.<\/p><p>Saturday: six children, nine sessions, the longest fourteen minutes. Sunday: five. Monday: four. Tuesday: three, one of them Lucy, who did six minutes and then asked whether the ring made a sound when it closed and lost interest when it didn't. Wednesday: zero. Thursday: zero. Friday he did not check until 4:40, so that there would have been a whole day, and it was zero.<\/p><p>He had reasons. It was the week before break. Nobody practiced the week before break. The whale came at seven days and nobody had reached seven. He wrote the reasons on a card, in no order, because he did not want to find out which one he believed.<\/p><p>Saturday he went back to Persimmon Lane at 12:55 with two coffees from Orchard, which Yolanda looked at before she took one.<\/p><p>\"That's a bribe.\"<\/p><p>\"It's a coffee.\"<\/p><p>\"Then it's a bad bribe.\" She drank some. \"Cody Nguyen showed me his suns. Four of them. He was very proud of his suns.\"<\/p><p>\"Did he practice?\"<\/p><p>\"He played what he always plays. The first eight bars of the thing, fast, with the wrong fingering, four times.\" She was looking for the app on her phone, and it took her a while to find it, which he noticed. \"It's cute, Nathaniel.\"<\/p><p>She said <em>cute<\/em> the way she said <em>app<\/em>.<\/p><p>\"There's a note in there. For you. On the teacher side. Did you see it?\"<\/p><p>\"I saw a red dot. I don't open red dots.\" She put the phone away. \"Go home. It's Christmas.\"<\/p><p>He drove home thinking about four suns and a whale at seven, and what it was like to be nine with three to go and no reason in the world to keep going, and by Alder Creek Road he had the answer, which was stickers. One at day one. A different one at three. Something that dropped in every time, so there was never a stretch of nothing. Devin, on FaceTime Sunday with the Mud Hens cap on backward, said, \"Loot. Kids need loot,\" and had four drawn before Nate finished the sentence, and at 9:40 Sunday night Nate uploaded the build and filled in the form.<\/p><p>Category. There was a drop-down. Devin had been sure about this one. \"Kids. Six to eight. That's the shelf parents look at. You want to be on the shelf.\"<\/p><p>He set it to Kids, 6–8, and pressed Submit, and the status said <em>Waiting for Review<\/em>, and he went to bed at eleven, which Claire remarked on.<\/p><hr class=\"break\"><p>The email came Tuesday at 3:12, during a meeting about the January deploy. <em>The status of your app has changed to Rejected.<\/em><\/p><p>He read the message at his desk, on his phone, with the work laptop open beside it to something else. It was polite. It was from a person, or something that used a person's name. The app was in the Kids Category, and apps in the Kids Category had to follow the children's privacy laws that applied to them and could not send identifiable information about a child anywhere, and the reviewer had noticed that the app asked the child for a name on first launch and stored it on a server with a teacher's email, and there was no privacy policy linked in the listing, and would he please review the guidelines, with a number, and resubmit.<\/p><p>He read it twice, the way he read anything from a machine that had decided something. Then he went back to the meeting and said, when they asked, that Wednesday was fine for the deploy.<\/p><p>It rained Wednesday like it meant it, sideways against the cafeteria glass, and Devin sat down across from him with a tray and his phone out.<\/p><p>\"Okay. So I looked up the federal thing. The kids one. Under thirteen.\" He scrolled. \"There's a page that's, like, for humans. Listen. 'Before collecting personal information from a child under thirteen, you must give the parent notice of what you collect and how you use it, and you must obtain the parent's verifiable consent.' Verifiable. Then there's a list of what counts. A signed form. A credit card charge. A video call. A phone call with\"—he looked up—\"'trained personnel.'\"<\/p><p>\"Trained personnel.\"<\/p><p>\"That's what it says, dude.\"<\/p><p>\"It's a first name.\"<\/p><p>\"A first name is on the list. Full name's on the list. A screen name is on the list if it's their name. Anything you store with a device ID is on the list.\" He put the phone down. \"Cody typed 'Cody' into your thing on a Saturday in a driveway. That's the whole crime.\"<\/p><p>Nate ate a fry.<\/p><p>\"What if I take it out of the kids category?\"<\/p><p>\"Then you're a general app. Grown-ups. Four-plus.\" Devin picked the phone back up and read for a while without saying anything, which was rare. \"And then there's a part about if you actually know kids are using it anyway. I don't know how that part works.\"<\/p><p>\"Neither do I.\"<\/p><p>\"You could ask a lawyer.\"<\/p><p>\"I could.\"<\/p><p>They both let that sit on the tray with the fries.<\/p><p>He did it Thursday night with the rain still going. He changed the category to Education and the age rating to 4+. He wrote a privacy page and put it on the little server: <em>Woodshed stores a first name, the minutes you practice, and any note your teacher leaves. It does not store your location. It does not show ads. Email us and we'll delete it.<\/em> He changed the first screen from <em>What's your name?<\/em> to <em>Ask a grown-up to set this up<\/em>, with the same box under it. He pressed Submit at 11:20, and the status said <em>Waiting for Review<\/em>.<\/p><p>He knew what he had done. He had changed which shelf it sat on. The kid was still going to be the one holding it.<\/p><hr class=\"break\"><p>The bucket was in the hall at his mother's, where she'd said it would be, and it had an inch of water in it from Wednesday and Thursday, and the stain above it had gone from a dinner plate to something you'd serve a turkey on.<\/p><p>\"The church man came in November,\" Rosa said, before he could ask. \"He said after the holidays. It's the holidays.\"<\/p><p>\"The tarp—\"<\/p><p>\"Nate. It's Christmas. Take your shoes off.\"<\/p><p>She had made tamales with the neighbor, four dozen, and the house smelled of masa, and Lucy was on the floor showing her grandmother the iPad.<\/p><p>\"You get the whale after seven days,\" Lucy said.<\/p><p>\"Have you gotten it?\"<\/p><p>\"No.\"<\/p><p>\"Then what's it for?\"<\/p><p>Lucy thought about it. \"For getting.\"<\/p><p>He had the laptop open at the kitchen table by two. He had told himself he would only check, and it still said <em>Waiting for Review<\/em>, and then the Patels' iPad had a crash on the grown-up screen and he had the log up and was reading it, with the tamales going by him on their way to the table.<\/p><p>\"Is that the job?\" his mother said.<\/p><p>\"No.\"<\/p><p>\"Ay.\" She set a plate down beside the laptop, two tamales and beans, and a fork on top of the beans so that it would not touch the keys. \"Eat. It'll still be broken.\"<\/p><p>He looked up, and Claire was in the kitchen doorway with a dish towel in her hand, and she had been there for a while. She was not looking at the laptop. She was looking at the plate.<\/p><hr class=\"break\"><p>Lucy was asleep before Morgan Hill, the iPad dark in her lap. Claire waited until the outlets were behind them.<\/p><p>\"Your mother put a plate next to your laptop on Christmas.\"<\/p><p>\"She puts a plate next to everything.\"<\/p><p>\"I need you to hear me.\" It was the school voice; she heard it and did not take it back. \"I'm not asking you to stop. I'm asking when it gets decided. Whether it's a thing, or it's the thing you do at the table. When do I get to know that.\"<\/p><p>\"It's waiting for Apple.\"<\/p><p>\"That's not what I asked.\"<\/p><p>The valley narrowed. The hills were black on both sides. He had the wipers on low for the mist, and he thought about what he could say that would be true and would also be the end of this.<\/p><p>\"If it's not working by spring,\" he said, \"I'll stop.\"<\/p><p>\"What's working?\"<\/p><p>\"People using it. Real people.\"<\/p><p>\"How many?\"<\/p><p>He didn't have a number. He had never once thought of it as a number, and he noticed that, and he did not say it.<\/p><p>\"Spring,\" Claire said, and he heard her file it, the way she'd filed the stock in September, and she put her head against the window and did not say anything else until the Alder Creek exit.<\/p><hr class=\"break\"><p>On New Year's Eve Claire went to bed at 10:40. \"Wake me if something happens,\" she said. \"Not for the year.\" Lucy had been down since 8:30 with a promise that she'd be woken for the fireworks, which nobody intended to keep.<\/p><p>He sat at the table with the laptop and did not work. Devin had texted at nine with a date, Thursday the twenty-fifth, because the site he wanted to list it on was dead on weekends, and Nate had written back <em>okay<\/em> and then sat looking at the ring in the simulator, filling and closing.<\/p><p>Somebody on Alder Creek Road had fireworks. They went off at 11:30 and again at 11:45, and the dog two houses down said what it thought.<\/p><p>At 11:52 the laptop made its sound.<\/p><p class=\"note\"><em>The status of your app has changed to Ready for Sale.<\/em><\/p><p>He had set it to release by hand, so nothing was on the store yet, and nothing would be until he said. It was approved. It was three weeks from anyone. He put his hands flat on the table on either side of the laptop, the way his father used to sit at the end of a job with the estimate in front of him, and listened to the house.<\/p><p>Midnight came. Fireworks, the dog, somebody on Quince Court yelling the year. He did not wake her.<\/p>", "words": 2012}, {"num": 9, "title": "Launch Day", "part": 0, "meta": "January 25 – February 14, 2024 · Quince Court, Sunnyvale, and the top level of a parking structure", "html": "<p>At 5:41 on Thursday morning he pressed the button that said <em>Release This Version<\/em>, and the page thought about it and then said <em>Ready for Sale<\/em> in green, and the kitchen was exactly as it had been.<\/p><p>The link worked at 6:05. He opened it on his phone and there it was, the whale icon, the four screenshots Devin had taken on a Sunday, the name, <em>Woodshed<\/em>, and under it <em>Free<\/em>. Search didn't find it. He typed <em>woodshed<\/em> into the store and got a wood-splitting game and a country album. Devin, at 6:08, from a train: <em>normal. takes a day or two to index. don't panic. did you post in the group.<\/em><\/p><p>He had written the post on Wednesday night in four sentences and Devin had changed two of them, so that it said <em>we<\/em> and <em>launched<\/em> and <em>would love your feedback<\/em>. He put it in Bay Area Independent Music Teachers at 6:10 with the link, and put the phone face down on the table, and made Lucy's lunch.<\/p><p>It was gone by 7:32. He looked for it twice, on Alder Creek Road at a light, and then the text came from Kim.<\/p><p class=\"note\"><em>I removed your post. The group has a rule about promoting your own product without asking an admin first. It's the fourth pinned post, and nobody reads the pinned posts, which is why I have the rule. This isn't personal. Also, you said you would tell me first. You told four thousand people first.<\/em><\/p><p>Then, a minute later: <em>Send me the link. I'll look at it. Bring it in August like you said.<\/em><\/p><p>He sent the link. He wrote <em>Sorry. You're right.<\/em> and deleted <em>You're right<\/em> and then put it back and sent it, and turned into the structure, and was through the turnstile at 7:44, which was late for him.<\/p><hr class=\"break\"><p>Devin had listed it on Launchpad at 12:01 a.m., with a line under the name that Nate would not have written: <em>A practice timer kids actually want to close.<\/em> By lunch it had fourteen upvotes. Nate knew most of them. Devin, and the people Devin knew from the meetup, and Farah, who ran the meetup, and Dana Whitlock, who had made an account to do it. There was one comment, from a name with an underscore in it.<\/p><p class=\"note\"><em>Looks clean. Any plans for dark mode?<\/em><\/p><p>He read it in the CR-V on the top level with a sandwich. He wrote back, carefully: <em>Not yet. What device are you on? Happy to prioritize it.<\/em> The name with the underscore did not reply, then or ever, and he would catch himself looking for it for a week.<\/p><p class=\"note\"><em>14 on a thursday with zero audience is honestly solid,<\/em> Devin wrote at 12:40. <em>the dog walker guy got 9. he told me. he was proud of it.<\/em><\/p><hr class=\"break\"><p>He emailed the eight teachers that night, after Lucy was down, one at a time, because a group email was what Yolanda sent and he'd seen what happened to it. The email was five sentences and he had rewritten it six times, and it still read like something a bank would send: <em>I wanted to let you know that Woodshed, the practice app we discussed in October, is now available.<\/em> He sent it to Hector and Ellen and the cello teacher in Los Gatos and Marguerite and Jill and Dana, and to Kim, because she'd asked for the link, and to Yolanda, who as far as he could tell used email only to send receipts.<\/p><p>Dana replied Friday at 7:10 a.m. <em>Congrats!! Sending to my families this weekend.<\/em> Hector replied Friday night: <em>nice man<\/em> and a thumbs-up. Nobody else did. On Saturday a teacher account appeared on the little server, Dana's, and he watched it through Sunday for a student to appear under it, and none did.<\/p><p>The store found it Saturday. He typed <em>woodshed<\/em> and it was fourth, after the game.<\/p><hr class=\"break\"><p>The downloads dashboard ran a day behind, so that Thursday showed up on Friday, and he learned to check it once, in the morning, and did not learn it. Friday: 11. Saturday: 9. He knew who most of those were. Sunday: 4. Monday: 6, which he did not understand and did not question. By the next Thursday the week said 41.<\/p><p>He checked it at work. Never on the work laptop; on his phone, in the stall, in the CR-V, once under the table in a meeting about the January deploy while someone from the platform group explained the retry design back to him, with his name on it, badly. He watched the number go from 33 to 38 during that meeting and felt something go up and then, immediately, down, because 38 was not anything, and because he had felt it go up. He hated it. He hated it the way he hated the equity portal, and he opened it for the same reason.<\/p><p>Wednesday afternoon Aaron Feld opened a pull request on the retry path, 212 lines, and Nate approved it at 2:14.<\/p><p>He had opened it at 2:11. He knew that because Priya told him, Thursday morning, on Slack, in one line: <em>You approved at 2:14. Aaron opened it at 2:11. Tahoe at 4, please.<\/em><\/p><p>Staging had fallen over at 7:50 that morning. An order with no line items, a cancellation that had been re-queued, and the new code reached into the list and found nothing there and stopped. It was a null check. It was the kind of thing he caught in his sleep, and he had not caught it, because at 2:11 on Wednesday he had been looking at the number 38 and had scrolled Aaron's diff with his thumb the way you scroll a menu.<\/p><p>Tahoe had the window on the structure. It was not raining. Priya had the notebook.<\/p><p>\"Let me be direct,\" she said. \"The retry design was yours. This was the retry path. I would prefer that the second thing not undo the first.\"<\/p><p>\"I'll fix it.\"<\/p><p>\"Aaron will fix it. You will review it, slowly, and you will write in the review what you looked at, so that someone who is not on this pod can see that you looked.\" She made a small mark in the notebook. \"That is what visible means on a Wednesday afternoon.\"<\/p><p>\"Okay.\"<\/p><p>She did not ask what he had been looking at at 2:11. She closed the notebook and looked at him for a second the way Bea looked at a doc, and let him go.<\/p><p>He reviewed Aaron's fix at 5:15 and it took him thirty-one minutes and he wrote nine comments, and Aaron wrote back <em>thanks, this is helpful,<\/em> and Nate sat looking at that for a while before he closed the laptop.<\/p><hr class=\"break\"><p>The wind came Sunday night. By two in the morning the power on Quince Court was out and the lemon tree was throwing lemons at the garage, and Lucy was in their bed because of the noise, sideways, with a foot in his back. Monday it rained the way it had in December but with the wind behind it, and the rack of laundry in the garage fell over, and Claire's text came at 7:10 with a photo of the Arbor lot, brown water to the hubcaps of the one car in it.<\/p><p class=\"note\"><em>Lot's a lake. Park on Hallett. Boots for L.<\/em><\/p><p>Priya's message to the pod at 7:30 said that 17 was closed at the summit and that anyone coming from Santa Cruz should stay home, and two people did. Devin's train sat outside Millbrae for forty minutes. The top level of the structure was closed with a sawhorse, so he ate at his desk with the phone in his lap and the number at 47 and not moving.<\/p><p>Tuesday the rain thinned to a mist. Claire texted at 3:20, from Room 14, with the class going behind her: <em>Dentist. Two crowns, $1,800, not covered. Moving it from the fund. FYI.<\/em><\/p><p>He wrote <em>okay<\/em>. He looked at it. He wrote <em>Thank you for handling it<\/em> and sent that too, and she sent a thumbs-up, and that was the conversation for Tuesday.<\/p><hr class=\"break\"><p>On the fourteenth Lucy made valentines at his end of the table, because his end had the lamp. Twenty-two of them, one for everyone in her class, with the whale stamp on each and the names copied off a list her teacher had sent home so that nobody would be left out, and she made him read the list back to her twice, because she had a suspicion about the spelling of Mia.<\/p><p>The iPad was beside her, open to Woodshed. She had used it. Day two, again, of the seven; she had gotten to day four once, in January, and had lost it on a Saturday at Costco. She had put a heart sticker on the back of the iPad from the valentine kit, and had put one on the laptop, and had offered one to him, and he was wearing it.<\/p><p>Claire had gone to bed at 9:15 with a shoebox of Room 14's valentines and had said good night from the hall.<\/p><p>At 10:05 he opened the dashboard on the laptop, the other one, the one that did not count downloads but counted people. <em>Active devices, last 7 days.<\/em> It took a second to load. It always took a second.<\/p><p>3.<\/p><p>He knew one of them. It was on the table next to a stack of valentines with a heart on the back of it, and he had eaten the sticker's twin off his own shirt sometime around nine without noticing.<\/p><p>He closed the laptop. He did not tell Devin, who would have had a reason, and he did not tell Claire, who was asleep, and he did not write it on a card. He did the dishes, which were the valentine dishes, two glasses and a plate with glue on it, and it did not take long enough.<\/p>", "words": 1659}, {"num": 10, "title": "The Notes", "part": 0, "meta": "February 15 – March 2, 2024 · Quince Court, Persimmon Lane, and Sunnyvale", "html": "<p>The rubber band had gone soft in the drawer and it broke when he pulled it, and the cards fanned across the table like a dealt hand.<\/p><p>He had gone to the drawer for a blank one. Thursday night, Lucy down, Claire in the bath, and he had thought that if he wrote the number on a card it would be a thing on a card and not a thing in his chest. Three. The blank cards were under the takeout menus, and on top of them was the stack from the interviews, and now it was loose and he was looking at his own handwriting.<\/p><p><em>41 texts Sun.<\/em> His block letters, from the bench in Yolanda's garage with his back to the keys. <em>10 pm texts. Credit chain. Whiteboard = memory.<\/em> And the last card from that night, the one he had rehearsed in the car, with her two sentences on it, one under the other, the way she'd said them.<\/p><p class=\"note\"><em>wants them to practice more — \"sure, ask anybody\"<\/em><\/p><p class=\"note\"><em>stop texting parents at 10 at night.<\/em><\/p><p>The first line was underlined. Twice. The line under it, about texting, had nothing under it at all. There it still was, four months later, unmarked, like a thing someone had said in another room.<\/p><p>He had spent October to January on the underlined line, and it was on the store with a whale on it, and three people had opened it this week, and one of them was six and lived here. Everything that was not underlined was about the same thing. A text at ten. A credit nobody could find. They had told him, all of them, on cards, in his own hand, and he had made a spreadsheet with no column for it.<\/p><p>He did not write the three on a card. He put the cards in his shirt pocket and put the blank one back.<\/p><hr class=\"break\"><p>\"I'll take Tuesday,\" he said Sunday, over the paper.<\/p><p>Claire looked up. Tuesdays at 4:30 were hers, and he had never asked for one.<\/p><p>\"You have a thing?\"<\/p><p>\"I want to ask Yolanda something.\"<\/p><p>\"Ask her,\" Claire said, and went back to the paper, and he heard the September in it and let it go.<\/p><p>It rained Monday night and was still raining Tuesday, the first real storm since the one that had flooded the Arbor lot, and he was in the folding chair at 4:31 with the cards in his pocket and water running off the CR-V in the driveway. The garage smelled of wet coats.<\/p><p>At five, at the door, he said it.<\/p><p>\"Three people used the app last week. One of them's Lucy.\"<\/p><p>Yolanda was writing in the planner and did not stop. \"Nathaniel, I could have told you that in December.\"<\/p><p>\"You did.\"<\/p><p>\"I said it was cute.\" She finished the line. \"That's what I say about a fruit bowl.\"<\/p><p>\"In October, on the bench. I asked you about practicing and you said something after, and I wrote it down, and I didn't—\" He got the card out. \"I underlined the wrong one.\"<\/p><p>She took it and read it, front and back, the way she read everything he handed her, and gave it back.<\/p><p>\"I never said I wanted kids to practice more,\" she said. \"I said I wanted to stop texting parents at ten at night. You wrote down the wrong sentence.\"<\/p><p>\"Could I sit here,\" Nate said. \"Not ask questions. Sit. Three evenings. I want to see what happens between the lessons.\"<\/p><p>\"You want to watch me work.\"<\/p><p>\"Yes.\"<\/p><p>She pointed with the pencil at the corner between the mini-fridge and the heater, where there was a kitchen chair with a cushion he had never seen her use.<\/p><p>\"That one. The parents need the parents' chairs. You don't talk to a child. You don't talk to a parent unless they talk to you, and if they ask, you're Lucy's father, which is true. You don't touch the planner. You can write. You don't type; I can hear it. And I'm not charging you. I don't know what this is yet. When I know what it is, I'll bill you.\"<\/p><p>\"Tomorrow?\"<\/p><p>\"Now. Your wife can come get her. It's raining, so the Nguyens will cancel by five-fifteen, and you'll want to see that.\"<\/p><hr class=\"break\"><p>He texted Claire from the chair. <em>Can you get L at Y's? Staying till 7:30. Will explain.<\/em><\/p><p class=\"note\"><em>It's pouring,<\/em> she wrote. And then: <em>Fine.<\/em><\/p><p>The Nguyens' text came at 5:08. He had started a card, the time down the left side, and had written <em>5:00 Nguyen<\/em> and then nothing. Yolanda's phone lit on the Clavinova.<\/p><p>\"There she is,\" she said.<\/p><p>She read it and took the pencil and drew a line through the five o'clock square, and the line was harder than the writing. She did not answer the text.<\/p><p>5:11. It lit again. She made a sound through her nose. \"Now she wants to know if that means they lose January.\"<\/p><p>\"Do they?\"<\/p><p>\"You're not talking.\"<\/p><p>He wrote <em>5:08 cancel (rain). 5:11 credit? She doesn't answer.<\/em><\/p><p>5:14. The side-door bell. It was the Patels, early, Mrs. Patel with an umbrella and the boy from the beta behind her, and she said, before she was all the way in, \"Sorry, I know we're the five-thirty. The Saturday from before Christmas. Arjun thinks we used it and I think we didn't.\"<\/p><p>\"You didn't,\" Yolanda said.<\/p><p>\"So we still have it.\"<\/p><p>\"You still have it.\" She had not looked at the planner or the board. Mrs. Patel sat down relieved. Yolanda went to the whiteboard, looked at it, wrote nothing, and came back.<\/p><p>He wrote <em>5:14 credit? (Patel, Dec Sat), not written anywhere<\/em>. <em>Patel Sat 12:30??<\/em> was on the board again, the same words she had erased in September to make room for him. He didn't know if that was the same Saturday. He was fairly sure she didn't either.<\/p><p>Claire came at 5:22 in her school raincoat and took Lucy's hand at the side door and looked at him in the corner chair with a card on his knee, and did not say anything, and he knew he would answer for it, and not tonight.<\/p><p>Then it was a lesson, twenty-six minutes of a nine-year-old and a sonatina and Yolanda's voice going <em>and, and, thumb under, no, listen<\/em>, and nothing happened that he could write down, and he understood after ten minutes that this was the part that worked. Nobody had ever texted her at ten at night about the sonatina.<\/p><p>5:56. The Patels out, the six o'clock in. While the girl found her page, Yolanda thumbed a reply to the Nguyens with one hand and the pencil still in the other. Forty seconds. Then the pencil went to a square that was already full, and the eraser came out, and she erased something above it to make room, and the gray got grayer.<\/p><p>At 7:20, with the last student, a teenager, halfway through her forty-five minutes, the side door opened without a bell and it was Mr. Ortega, wet.<\/p><p>\"Yolanda, sorry. Real quick. Did February go through? Because Marisa says she sent it and I'm looking and I don't see it.\"<\/p><p>\"I'll check.\"<\/p><p>\"Because if it didn't—\"<\/p><p>\"I'll check. Go, it's pouring.\"<\/p><p>He went. She didn't check. She was in the middle of a phrase and stayed in it. He wrote <em>7:20 Ortega Feb $, \"I'll check\"<\/em> and thought about how many things he had watched her not check tonight, and that all of them were still owed.<\/p><p>At 7:47 the teenager left. Yolanda sat down on the bench and picked up the phone, and did the day. Five texts, thumb and thumb. The Nguyens: Saturday at 10, and he didn't know if that was the January credit or a new Saturday, and neither, he thought, did Trish. Then Venmo, and he saw her type <em>Hi! Just checking on February<\/em> and stop with her thumb over the send.<\/p><p>\"I hate the exclamation point,\" she said. \"If I leave it off they think I'm angry.\"<\/p><p>\"Are you?\"<\/p><p>\"You're not talking.\" She sent it. \"Yes.\"<\/p><p>She pressed her right thumb into the palm of her left hand, once, hard, the way you'd press a thumbtack, and wrote the Nguyens into Saturday.<\/p><p>\"Eleven minutes,\" Nate said, because he'd counted, and it was out before the rule.<\/p><p>\"That's a short night.\" She closed the planner. \"Go home. Same chair tomorrow.\"<\/p><hr class=\"break\"><p>Wednesday he put <em>appt<\/em> on his calendar from 3:30 and left the structure at 3:35 and nobody said anything, which he had been afraid of for four months. Wednesday was quiet: one cancellation, a stomach; three makeups written in; one <em>did you get my Venmo<\/em>, at the door, from a father who had sent it to the wrong Yolanda and had to be asked for it again.<\/p><p>Thursday was the one.<\/p><p>Two families had canceled by text before he sat down. Then the four-thirty texted at 2:40 that they were so sorry, they'd forgotten a dentist, could they possibly do Saturday. Yolanda read it while a seven-year-old did scales. He watched her decide. He watched her not decide. At 4:30 the square was empty and she sat in the parents' chair with the planner on her knee and looked at Saturday, which had the Nguyens at ten and one open half hour at 11:30, and wrote <em>Lindqvist 11:30<\/em> into it.<\/p><p>\"There's no credit,\" she said, not to him. \"They canceled at two-forty for four-thirty. There is no credit and she is getting Saturday, because she'll ask again on Sunday and I'll say yes on Sunday, and Sunday I don't teach, so I'd rather say it now.\"<\/p><p>She went to the whiteboard with the marker and stopped, and came back to the planner instead, and when she went to write again the pencil went a quarter inch and stopped. He saw her hand. The fingers had gone stiff in a shape that wasn't a grip and wasn't open, and she set the pencil down with her other hand and shook the right one out, twice, and made a fist and opened it.<\/p><p>\"Cold,\" she said.<\/p><p>The heater was on. He had taken his jacket off an hour ago.<\/p><p>\"Piano hands,\" she said, which was what she'd said in August at the garage door with his hand just out of hers, and picked the pencil up and finished the word.<\/p><p>He did not write that down. He wrote <em>4:30 free makeup, no credit, \"I'd rather say it now\"<\/em> and left a line under it empty.<\/p><p>At 7:35 he asked about Monday, and she opened the planner again without a word and read it off like a grocery list. Four cancellations, one at 7 a.m. One makeup. One family she'd had to ask twice. Saturday she texted him at 1:12, unasked: <em>Sat. 2 cancels, 1 makeup, Nguyens came. Don't reply.<\/em><\/p><p>He added it up in the Costco lot. Monday through Saturday. Eleven cancellations. Seven makeups written into a planner in pencil, one of them free and unforgiven. Four times she had asked somebody for money she had already earned. He had watched the lessons, all of them, and the lessons were fine.<\/p><hr class=\"break\"><p>It took him a week to write one page, because the first version was three and the second was two, and neither said anything Claire couldn't have gotten from the cards.<\/p><p>He wrote it Monday and Tuesday after Lucy was down, and Thursday, the twenty-ninth, at 5:10 in the morning, once, to see. By Friday it fit on one side of one sheet, typed, with the counts across the top like a scoreboard and under them the sentence he'd been unable to make in October with the refrigerator open. It was not his sentence. He had taken it off the card.<\/p><p>Saturday, March 2, with Lucy at swim and the coffee made, he put the page at her end of the table, where the red pen went, and sat down at his.<\/p><p>\"Three people used the app the week of Valentine's,\" he said. \"One of them was Lucy. I didn't tell you.\"<\/p><p>\"No.\"<\/p><p>\"There's a ninety-nine-dollar charge from October. Apple. I didn't tell you that either.\"<\/p><p>\"October thirtieth.\" She said it without heat. \"I know. Keep going.\"<\/p><p>\"That's it. That's the list.\"<\/p><p>She read it line by line with her finger not quite touching, and when she got to the bottom she went back to the top and read it again, which she had never done with anything of his.<\/p><p class=\"note\"><em>Mon–Sat, Feb 19–24: 11 cancellations. 7 makeups. 4 asks for money already earned.<\/em><\/p><p class=\"note\"><em>The lessons are fine. What she does between them is the job nobody pays her for.<\/em><\/p><p class=\"note\"><em>Stop texting parents at ten at night.<\/em><\/p><p>\"That's her sentence,\" Claire said.<\/p><p>\"Yes.\"<\/p><p>\"It's a good sentence.\" She put the page down flat and kept her hand on it. \"This is a different thing.\"<\/p><p>\"Yes.\"<\/p><p>\"Is it a different thing you can do at five in the morning instead of one?\"<\/p>", "words": 2164}, {"num": 11, "title": "One Page", "part": 0, "meta": "March 3–24, 2024 · Quince Court, Orchard Coffee, and Sunnyvale", "html": "<p>The alarm went at 4:50 Monday, and he was at the table with the coffee going by 4:58, and for the first twenty minutes he did nothing but sit in the dark kitchen and look at the page, because the page was the only thing there was.<\/p><p>He had set the alarm Saturday night with Claire watching from the bed. She hadn't said anything. She'd watched him do it the way she watched a third-grader write the date at the top of a paper, to see whether he'd write the year.<\/p><p>He did not open a code editor. That was the rule for the week, on a card under the coffee maker: <em>No code until the page is right.<\/em> What he did instead, Monday and Tuesday and Wednesday, from five until the house woke at 6:40, was write the second page, the one that said what wasn't on the first. No practice log. No streaks. No stickers. No invoices, no recitals, no student login, no parent login. No app. By Wednesday the second page was longer than the first and the more useful of the two, and he was asleep at 11:05 Wednesday night, before Claire, which had not happened since October.<\/p><hr class=\"break\"><p>Devin took the train down Saturday, which he had done twice in four years, and Nate picked him up at the Mountain View station at 9:20 and drove him to Orchard, where Gail was behind the counter and the window table was free.<\/p><p>Devin read the page with his coffee going cold. He read it fast, and then he read the middle of it again with his finger on it.<\/p><p class=\"note\"><em>Customer: an independent music teacher in the U.S. Works alone. 15–60 students. Teaches from a home studio. Runs her own schedule and her own billing. Paper planner, group text, Venmo, whiteboard.<\/em><\/p><p class=\"note\"><em>One loop. A parent cancels → the teacher's own policy decides what that means → a credit exists somewhere both of them can see it → the credit turns into an open slot. That's the whole product. Nothing else in the first version.<\/em><\/p><p>\"Okay,\" Devin said. \"Okay. This is good. This is a real doc.\" He turned it over to see if there was more, and there wasn't. \"Where's the parent app?\"<\/p><p>\"There's no parent app.\"<\/p><p>\"Then how does the parent—\"<\/p><p>\"A link. The reminder goes out, the link's in it, they tap it, it's a page. The page says: you canceled Thursday at 9:14 p.m. for Friday at 4:30, your teacher's policy says twenty-four hours, that's not a credit. Here are the open Saturdays anyway, if she's turned that on.\"<\/p><p>\"On a <em>web page<\/em>.\"<\/p><p>\"On a web page.\"<\/p><p>Devin sat back. \"Dude. You'll regret no push notifications. I'm telling you now so you can't say I didn't. You're gonna be sending text messages like it's 2009 and paying for every one of them, and the whole time there's a bell icon that does it for free.\"<\/p><p>\"There's no app store,\" Nate said. \"No review queue. No waiting two weeks for a person in a building somewhere to say the shelf's fine. Nothing a seven-year-old holds. And anything a seven-year-old holds comes with rules I'd need a lawyer to read. You read them to me. In December. Trained personnel.\"<\/p><p>\"That's for the kids category.\"<\/p><p>\"That's for anybody who knows a kid's using it. The Ortegas' boy set it up in the car. I know he's nine. I'm not building that again.\" He turned the page so it faced Devin. \"The teacher's the customer. The parent gets a link. Nobody under thirteen ever touches it.\"<\/p><p>Devin was quiet and looked out at Alder Avenue, and Nate let him, because he had been in a corner chair for three evenings and had learned something about waiting.<\/p><p>\"Nobody finds a website,\" Devin said.<\/p><p>\"Nobody found the app.\"<\/p><p>That sat on the table for a while with the cold coffee.<\/p><p>\"Why sixty?\"<\/p><p>\"Above sixty she's got a second teacher and somebody at a desk, and Allegro already sells her the desk. Below fifteen it's in her head, and her head's fine.\"<\/p><p>\"You made that up.\"<\/p><p>\"I made it up from Yolanda and Kim and Dana and five phone calls. That's what I've got.\" He heard himself say <em>I think<\/em> before the next part and let it stand. \"I think it's right for now.\"<\/p><p>Devin nodded, getting to the thing he'd come for.<\/p><p>\"So I'll do the front end. Two Saturdays, like before. You'll make it look like a tax form, and honestly, that's fine for the teacher, but the parent page has to not look like a tax form or they won't tap it twice.\"<\/p><p>\"Not yet.\"<\/p><p>\"Not yet what.\"<\/p><p>\"Not yet the front end. Not yet anybody. I want to build the ugly one myself and put it in front of Yolanda and see if she uses it before anyone's spent a Saturday on it.\" He said the next part to the table. \"I already spent your Saturdays once.\"<\/p><p>He had not known until he said it what it would cost, and it cost about what he'd have guessed. Devin's face did the thing it did before he was sarcastic, and then didn't, and then he said, \"Cool,\" and after a second, \"Cool cool cool,\" and picked up the cold coffee and drank it anyway.<\/p><p>\"Woodshed's dead, then.\"<\/p><p>\"It's on the store.\"<\/p><p>\"That's not what I asked.\"<\/p><p>\"I'm not touching it.\"<\/p><p>Devin said he'd get an Uber to the station, which he never did, and got one, and stood out on Alder Avenue looking at his phone while it came, and did not look in through the window. Nate paid for both coffees, $8.50. Gail came for the cups and said, \"Your friend all right?\" and he said, \"I think so,\" and that was two <em>I thinks<\/em> in one morning about things he was sure of.<\/p><hr class=\"break\"><p>Sunday night he opened the developer site for the first time since Valentine's Day. There was a button, <em>Remove from Sale<\/em>, gray, in a place you had to look for it. He looked at it a long time and did not press it.<\/p><p>He did the arithmetic instead, once, with nothing on a card. Four months of nights, October to January, call it three hours a night and every Saturday. Ninety-nine dollars, plus the course, plus the icons, plus the little server, which was still up and still costing something, call it $400 all in. Two Saturdays of Devin's. A Halloween, four houses. And a sentence in a car outside Gilroy that he had said to end a conversation, and that was not going to end it.<\/p><p>He wrote none of it down. On the little server there was still one teacher account, Dana's, with nobody under it, and he left that too. Lucy's iPad was on the couch, open to the ring, day one. He did not take it off. She would stop on her own, he thought, and she did, that week, and never said so.<\/p><hr class=\"break\"><p>His mother called Thursday at 6:52 in the morning, from the office at Uvas, where she'd been since 6:30 because the copier needed to be talked to.<\/p><p>\"Happy birthday.\"<\/p><p>\"Thanks, Mom.\"<\/p><p>\"You're driving?\"<\/p><p>\"I'm on Mathilda.\"<\/p><p>\"Then I'll be quick. Thirty-three.\" She let that sit, as if it were a figure on an invoice. \"Your father was thirty-three the year before he put the name on the truck. He had the truck two years before he had the name. Did you know that?\"<\/p><p>\"No.\"<\/p><p>\"Now you know. The church roofer came out. He says after the rain. I said it's March, when is after the rain, and he said April. I'm telling you so you don't ask.\"<\/p><p>\"I wasn't going to ask.\"<\/p><p>\"Ay. You were going to ask. Eat something today. Not at the desk.\"<\/p><p>Lucy's card was on the table when he got home, propped against the fruit bowl, a whale on the front in a party hat and on the inside in her own capitals: HAPPY BIRTHDAY DADDY. YOU ARE 33. I AM 6. THAT IS 27. Claire had checked the subtraction; he could see the small pencil check mark in the corner, Room 14's.<\/p><p>\"I did the math,\" Lucy said. \"Mommy did it after.\"<\/p><p>The cake was from a box and had eleven candles in it, because that was what was in the drawer.<\/p><p>\"That's not thirty-three,\" Lucy said.<\/p><p>\"It's what we have.\"<\/p><p>She looked at the candles for a while. \"Do it three times.\"<\/p><p>So they did. Three times, eleven candles, three wishes, and Lucy blew out the last set herself because he was, she said, taking too long, and Claire's card said <em>33. Come to bed by 11 and I'll consider it a present,<\/em> and he laughed, one breath through the nose, and looked up, and she was watching to see if he would.<\/p><p>Devin's text came at 9:40, a cake and nothing else, which from Devin was a paragraph.<\/p><hr class=\"break\"><p>The letter was in the mailbox Saturday, typed, in an envelope typed on the same machine.<\/p><p><em>Dear Mr. and Mrs. Aguilar,<\/em> it said. <em>This letter is to inform you that beginning September 1, 2024, the monthly rent for the property at Quince Court will be $3,750. My son says I should give more notice than I did last year, so this is more notice. Thank you for the way you keep the yard. Lucy is welcome to the lemons.<\/em> And her name, in blue ink, very small.<\/p><p>Claire read it standing at the counter.<\/p><p>\"A hundred.\"<\/p><p>\"Less than last year.\"<\/p><p>\"Last year was a hundred and fifty. So she's being kind twice.\" She put the letter down on the counter beside Lucy's card, so that the numbers lay next to each other, 27 and $3,750. \"Six months' notice. That's actually kind, Nate.\"<\/p><p>\"To do what?\"<\/p><p>\"I don't know. Think.\" She picked the letter back up. \"Go say thank you. Tonight, when you take the recycling. And ask her about the dryer.\"<\/p><p>\"Okay.\"<\/p><p>He went over at seven and stood in Mrs. Halvorsen's kitchen and said thank you for the notice, and she said her son was in Sacramento and worried about her, and gave him a paper bag of lemons the size of softballs. He came home with the lemons.<\/p><p>\"Lemons,\" Claire said.<\/p><p>\"Lemons.\"<\/p><p>She put the letter in the folder where the letters went. She did not mention the dryer. She did not have to.<\/p><hr class=\"break\"><p>Sunday the twenty-fourth was clear, and they walked the creek trail in the afternoon, all three, with the creek loud and brown under the footbridge and the hills the green they were for six weeks a year, and Lucy found a stick and named it. At dinner she looked up from her rice.<\/p><p>\"Are you still making the whale thing?\"<\/p><p>\"No.\"<\/p><p>\"What are you making?\"<\/p><p>\"Something for Yolanda.\"<\/p><p>\"Does it have a whale?\"<\/p><p>\"No.\"<\/p><p>Lucy considered this. \"Then what's it for?\"<\/p><p>\"Saturdays,\" he said, and she said, \"Oh,\" as if that settled something, and for her it did.<\/p><p>He had the laptop open at 8:40 with Lucy down, and the page beside it, and a blank file, because the next rule was that Monday he'd start. Claire came in from the hall with her book and stood at her end of the table with her hand on the back of her chair.<\/p><p>\"It was spring on Tuesday,\" she said. \"The nineteenth. I looked it up.\"<\/p><p>He closed the laptop halfway.<\/p><p>\"You said spring.\"<\/p><p>\"I know. This is different.\"<\/p><p>\"It's always different.\"<\/p><p>She said it without the school voice, without any voice in particular, the way you'd say the name of a street, and she took her book down the hall, and he heard the bedroom door not close.<\/p><p>He kept the page in front of him. The counts across the top, the sentence under them that was Yolanda's, the customer, the loop. The house made its sounds. A Caltrain horn came from the north on the wind. He did not open the laptop. He sat with the page until the house was quiet, and then a while after that.<\/p>", "words": 2019}, {"num": 12, "title": "Seven Weeks", "part": 1, "meta": "March 25 – April 20, 2024 · Quince Court and Persimmon Lane", "html": "<p>The card was under the coffee maker where the last one had been, and it had six lines on it, and at 4:58 Monday morning he read them before he opened anything, the way his father had read a list at the hardware store before he went in.<\/p><p class=\"note\"><em>1. She signs in. Email link, no password.<\/em><\/p><p class=\"note\"><em>2. Students. Families.<\/em><\/p><p class=\"note\"><em>3. The week. Same lesson, same time, every week.<\/em><\/p><p class=\"note\"><em>4. Her policy. Her words, her hours.<\/em><\/p><p class=\"note\"><em>5. Link in the reminder. Cancel → policy decides → a credit she can see.<\/em><\/p><p class=\"note\"><em>6. Open slots.<\/em><\/p><p>Nothing else. He had written it Sunday night after Claire went down the hall, and then he had written <em>invoices<\/em> and <em>recitals<\/em> on a second card, because they were in his head and he wanted them out of it, and put the second card in the drawer with the takeout menus, face down.<\/p><p>He opened the editor at 5:06. The folder was called <em>studio<\/em> because he did not have a better name and the folder did not care.<\/p><p>Devin texted Tuesday at 7:10, while Nate was on Mathilda. <em>what r u building it in<\/em><\/p><p class=\"note\"><em>The boring one.<\/em><\/p><p class=\"note\"><em>which boring one<\/em><\/p><p class=\"note\"><em>The one I've used for ten years.<\/em><\/p><p>There was a pause long enough to be an opinion. <em>and the database<\/em><\/p><p class=\"note\"><em>The one older than Lucy.<\/em><\/p><p><em>ok,<\/em> Devin wrote, and then, <em>at least its not swift,<\/em> and Nate laughed once at the light at Maude and put the phone face down on the seat.<\/p><p>That was the shape of the seven weeks. Alarm at 4:50, coffee, the card, two hours in the dark kitchen with the refrigerator humming, and at 6:40 the hall light came on and he closed the laptop mid-sentence and was on Alder Creek Road at 6:45 with the day's real work already done. He began to think of the commute as the break. At Halyard he did the Orders service and reviewed Aaron Feld's pull requests slowly and went home at 5:40, and at night he did not open the laptop, because the rule was the morning, and because by ten he could not have.<\/p><hr class=\"break\"><p>The number came Wednesday, the third of April, at 6:31.<\/p><p>He was building the link. Every reminder that went out would carry one, and the link had to know which lesson it belonged to, so it needed a name that was different from every other link's, and the simplest different name in the world was the next number. Lesson one was one. Lesson seven, the one on his screen, was seven.<\/p><p>He typed it, and looked at it, and saw the thing he had seen a hundred times at Pixelbridge, where they had paid him to see it. Seven was next to eight. Anybody holding seven could type eight and look at a page that was not theirs: the family's name, the time, the number Yolanda had on file for them. Not a password, not a card. A name and a phone number, which was what a group text already showed twenty-seven people. The right way was a long string nobody could guess, and a table to keep the strings in, and a place to make them, and he knew exactly how long that took, because it was twenty minutes if nothing went wrong and it was 6:31.<\/p><p>He wrote ADD TOKENS on a fresh card in block letters and set it at his elbow, on top of the six-line card, where he would see it in the morning.<\/p><p>Lucy came in at 6:38 in her whale pajamas and stood at his elbow with her hair in her face.<\/p><p>\"Is it Wednesday?\"<\/p><p>\"It's Wednesday.\"<\/p><p>\"Wednesday is the cereal with the marshmallows.\"<\/p><p>\"That's Saturday.\"<\/p><p>\"It's Wednesday <em>and<\/em> Saturday.\" She leaned on the table with both arms to make the case, and the cards went where cards go when a six-year-old leans on a table, and he got the cereal, the plain one, and the six-line card was on the floor and he picked that one up. The other had gone under the fruit bowl, and he did not think about it. He was thinking about the cereal, and the time, and that the link worked, which it did.<\/p><hr class=\"break\"><p>\"Nineteen dollars a month,\" he said, Saturday, at the counter. \"Hosting. It starts today. I'm telling you before the statement.\"<\/p><p>Claire was making Lucy's lunch for the birthday party at the pool, and she did not stop cutting the sandwich.<\/p><p>\"Nineteen.\"<\/p><p>\"Nineteen.\"<\/p><p>\"For the whale thing there was a server too.\"<\/p><p>\"That's still there. It's four dollars. I'll turn it off.\" He heard that he was not sure he would, and said it anyway. \"This one's nineteen.\"<\/p><p>\"Noted.\" She put the sandwich in the bag. \"Thank you.\"<\/p><p>That was all it was. He had rehearsed more. On the way to the pool Lucy asked what hosting was, and he said it was renting a computer that never turned off, and she said that sounded like his, and Claire looked out the window so he could not see her face.<\/p><p>Ten days later, in bed, in the dark, Claire said, \"You've been asleep by eleven for three weeks.\"<\/p><p>\"It's the five o'clock.\"<\/p><p>\"I know what it is.\" She turned over. \"I'm not complaining. I'm noticing.\"<\/p><p>He lay there and noticed too. His eyes had stopped hurting in the afternoons. Aaron Feld's second pull request had been fine and he had said so in one line. He had not, in three weeks, done a single thing at the kitchen table after Lucy was down that he'd needed to explain, and Claire had not once looked at the chair.<\/p><hr class=\"break\"><p>He went to Persimmon Lane on the twentieth at 1:05, when the last Saturday student was on the driveway, with the laptop and with Lucy, because Claire had Costco. Lucy took the Clavinova and the headphones without being asked and played the four bars of \"Ode to Joy\" she knew, silently, with her whole body.<\/p><p>Yolanda looked at the laptop and did not touch it.<\/p><p>\"Is this the thing?\"<\/p><p>\"This is the thing.\"<\/p><p>\"Then show me the thing.\"<\/p><p>He had made the first screen as plain as a form at the DMV, one box, <em>your email<\/em>, and a button. She typed her email with two fingers and pressed the button and the screen said <em>Check your email<\/em>.<\/p><p>\"Where's the password?\"<\/p><p>\"There isn't one. It emails you a link. You tap it and you're in.\"<\/p><p>\"Every time?\"<\/p><p>\"Every time.\"<\/p><p>She was quiet a second. \"I have a book of them. A little book. It's in the kitchen drawer and half the pages are crossed out and I hate the book.\" She got her phone and found the email, which took her a while, and tapped the link, and the laptop changed by itself, and she looked at it as if it had done a card trick. \"Well.\"<\/p><p>He had built her week in ahead of time from the three evenings and what she'd read him off the planner, most of it, so there would be something to look at. She looked at it. She looked at Wednesday.<\/p><p>\"The Nguyens are Wednesdays now. Five o'clock. Little League.\"<\/p><p>\"Since when?\"<\/p><p>\"Since Little League.\" She sat down in the parents' chair with the laptop on her knees. \"What's this.\"<\/p><p><em>Your cancellation policy.<\/em> A box, empty, and under it two smaller boxes: how many hours before a lesson a family could cancel and get a credit, and what a credit was worth.<\/p><p>\"Twenty-four hours,\" Yolanda said. \"It's on the wall.\"<\/p><p>He typed it. She watched the number go in and she watched it sit there.<\/p><p>\"No.\"<\/p><p>\"No?\"<\/p><p>\"Twenty-four hours is what I want. It isn't what I do. Everybody's got a fever at seven in the morning, and I have never once in thirty years said no to a fever.\" She looked at the number a while longer. \"By nine. Morning of. Before nine, you get a credit. After nine, you don't. That's what I actually do, when I do it.\"<\/p><p>He deleted twenty-four and typed nine a.m. the same day, and she read it, and read it again, and he understood that she had never seen it written before either.<\/p><p>\"And it's thirty minutes. A credit. Not forty-five dollars, not fifty-two. A lesson.\"<\/p><p>He had built it in dollars. He changed it, on the spot, in front of her, and she watched him do that too.<\/p><p>\"And here's the link,\" he said, and showed her the page a parent would see. A lesson, a time, her name, one sentence of hers, and the button.<\/p><p>She read the sentence. \"That's mine.\"<\/p><p>\"I asked you what you'd say if you could say it once. That's what you said.\"<\/p><p>\"Then I should have said it better.\" But she didn't change it.<\/p><p>Lucy had taken the headphones off and come over. \"That's the eye one,\" she said, pointing at nothing in particular on the screen.<\/p><p>\"What's the eye one?\"<\/p><p>\"In my book. The eye with the dot. It means you hold it.\"<\/p><p>\"Fermata,\" Yolanda said, not looking up. \"You hold it until I say.\" She scrolled to the credit, the one he had put in as a sample, sitting under a canceled Thursday. \"That's what this is, Nathaniel. The lesson's not gone. It's held.\" She tapped the top of the screen, where he had never gotten around to putting anything but her name. \"Call it that. It doesn't have a name and I'm not going to say 'the thing' to Trish Nguyen.\"<\/p><p>\"Fermata.\"<\/p><p>\"It's a good word. It's better than a whale.\" She handed the laptop back. \"Where do I put the note?\"<\/p><p>\"What note?\"<\/p><p>\"The note that says the Nguyens always cancel when it rains. So that when it rains, I already know.\"<\/p><p>There was nowhere. He had a students table and a families table and a schedule and a policy and a ledger of credits and a list of open slots, and there was not, anywhere in it, a place to write one sentence about a family. He took the six-line card out of his shirt pocket and wrote, under six, in smaller letters, <em>7. Notes.<\/em><\/p><p>\"Sunday,\" he said. \"It'll be there Sunday.\"<\/p><p>\"Then Sunday I'll write it.\"<\/p><p>They did the students after that. She read from the folder of September forms, all thirty-four, name and family and phone and email, and he typed. Lucy played the four bars with the sound on now. Once, at the Ortegas, Yolanda stopped and said \"April,\" to herself, and then the phone number, and he did not ask.<\/p><p>At 3:40 it was in. Her week, her thirty-four, her sentence, her nine a.m. The first reminders would go out Monday morning at seven, with the link in them.<\/p><p>\"Monday,\" he said.<\/p><p>She stood and looked at the whiteboard, which still said what it had said in August, and then at the laptop, which said the same thing in a font, and he watched her weigh them.<\/p><p>\"Fine. Monday,\" she said. \"But if it loses a credit, I'll never hear the end of it, and neither will you.\"<\/p>", "words": 1844}, {"num": 13, "title": "Persimmon Lane", "part": 1, "meta": "April 22 – May 3, 2024 · Persimmon Lane, Alder Creek", "html": "<p>C major was the first thing she played every morning and had been since she was seven, and this year it was the only thing she played badly.<\/p><p>Coffee, the garage, the space heater on for the room and not for her, the mug on the Clavinova where a mug was allowed. Then the bench, both hands, four octaves, at a tempo she'd have taken a child's allowance for. The first octave hurt where the thumbs met the hands and in the second knuckle of each fourth finger, a dull pull, as if the fingers had been folded overnight and put away in a drawer. The second hurt less. By G and then D the hands had agreed to be hands, and by A-flat they were hers, and she went back and played the C at speed, to show them.<\/p><p>Her mother's hands had gone like that at sixty, in Fresno, and her mother had blamed the cold, in July. Yolanda was fifty-eight and blamed nothing. The Covered California plan would pay for a doctor to tell her a word, after the deductible, and the word would not play the scale for her, so she played the scale.<\/p><p>It was Monday, the twenty-second of April, 6:35, and somewhere in Nathaniel's rented computer a clock was counting down to seven, when it would send her Monday families an email with her name on it and a link in it, and she was not going to sit here and watch that happen like a woman waiting for a train. The property tax had gone out on the ninth, the second half, $2,100, the biggest check she wrote all year, and every April she thought the same thing about it, which was that the county believed her house was worth what a house was worth here, and that the county was right, and that she could not eat it.<\/p><p>She played the C once more and went in to get dressed.<\/p><hr class=\"break\"><p>The Ortega boy was her four o'clock Monday and he came in with his book already open to the page, which was why she liked him, and he sat and found his place and waited for her to say go, which was why she liked him more.<\/p><p>Marisa Ortega sat in the parents' chair with her keys in her lap.<\/p><p>\"We got an email,\" Marisa said. \"This morning. From something called Fermata? With your name on it. I almost deleted it.\"<\/p><p>\"That's me.\"<\/p><p>\"Okay, good. I thought it was one of those. It had a link. For canceling.\"<\/p><p>\"For if you cancel.\"<\/p><p>\"We're not canceling.\"<\/p><p>\"Then don't touch it.\"<\/p><p>The boy played the first line of the Clementi and she said <em>and, and, thumb under,<\/em> and he did it, and the April request sat in the room like a fourth person. She had sent it on the first. Four lessons, $208. February she had sent twice and Marisa had said <em>so sorry, I'll do it tonight<\/em> and done it; about April Marisa had said nothing, and Yolanda had said nothing, and the boy had his thumb under and was through the turn clean.<\/p><p>\"Good,\" Yolanda said. \"Again, from the pickup.\"<\/p><p>She could say <em>thumb under<\/em> forty times to a child. She could say <em>that's a rest, not a cut<\/em> to a teenager who'd been told it by better teachers. What she could not do, thirty years in, was turn to a woman with her keys in her lap and say <em>April<\/em>. It was a small word. She had it in her mouth every Monday, and every Monday she swallowed it and taught the lesson, and the lesson was very good.<\/p><hr class=\"break\"><p>It rained Wednesday. Not February's kind, that had put the Aguilars' school under water, but real rain, the last of it probably, gray and steady from before light, and she sat down at 6:30 with the heater and the coffee and the scales were bad and then fine.<\/p><p>Sunday night she had typed her first sentence into the thing. Nathaniel had put the box under the family's name, as he'd said, and she had sat at the kitchen table in her reading glasses and typed with two fingers, <em>Cancel when it rains,<\/em> and felt like a woman writing in a diary, and closed the laptop. It had taken the Nguyens until Wednesday.<\/p><p>7:48. The phone lit on the Clavinova, and it was Trish, two lines, four exclamation points, <em>pouring<\/em> and <em>cough<\/em> and <em>so sorry<\/em>, and Yolanda's right thumb, which was still the morning's thumb, went to type what it had typed for eight years.<\/p><p>She stopped it.<\/p><p><em>Use the link,<\/em> she wrote, and sent that, and set the phone face down on the Clavinova and played the C again.<\/p><p>She had never said that before. There had never been a link. There had been her, at 7:48 in the morning, deciding, and at ten at night defending it, and on Saturday finding the half hour she'd promised in a week that did not have one. The phone buzzed once against the wood and she let it.<\/p><p>When she turned it over there were two things. One was an email from Nathaniel's machine, with her name at the top: <em>Nguyen family canceled Wednesday, April 24, 5:00 p.m. Notice given before 9:00 a.m. Credit recorded: 1 lesson (30 min).<\/em> And under it Trish, at 7:53: <em>Done!! It says we have a credit? Is that right??<\/em><\/p><p>She read the email again. It said the rule, her rule, the one she'd said out loud to Nathaniel on Saturday for the first time in her life, and it had applied the rule to Trish Nguyen without asking how she felt about Trish Nguyen, and put the credit where the credit went, and told her.<\/p><p>She did not answer the text. She held the phone in her lap and waited to feel bad about that, and instead something in her chest let go a half step, like a suspension resolving, and she sat with that too, because she resented it.<\/p><p>Thirty years. She'd had the sentence the whole time. <em>Before nine you get a credit; after nine you don't.<\/em> It had been in her mouth with <em>April<\/em> and the rest of them, and it had taken a man's machine to say it to Trish Nguyen at eight in the morning while she sat here playing scales.<\/p><p>At 7:58 Trish sent a thumbs-up. At 4:40 that afternoon, with the rain still going, Yolanda went to the whiteboard with the green marker to write <em>Nguyen 1<\/em> under the others, and stood there with the cap off, and didn't.<\/p><p>She looked for the rest of it instead. The sheet on the wall said credits expired at the end of the semester. The email said <em>Credit recorded<\/em> and a number, and nothing about June. She went through the screen with the glasses on, every button. It was not there.<\/p><p>She texted him at 4:52, which was during his job, and she did not care.<\/p><p class=\"note\"><em>Where does it say the credit expires.<\/em><\/p><p>He answered at 5:10, from wherever he was. <em>It doesn't yet.<\/em><\/p><p><em>Then it doesn't,<\/em> she wrote, and put the marker back, and understood that she had just given the Nguyens a half hour with no end on it, in ink, and that the machine had done exactly what she'd told it to.<\/p><hr class=\"break\"><p>Andre called Sunday at six, from Sacramento, from the sound of it while he was doing dishes.<\/p><p>\"Did you pay the second half?\"<\/p><p>\"On the ninth. Like every year since you were in diapers.\"<\/p><p>He worked for the Franchise Tax Board, which she had found funny for ten years and he had never found funny at all. \"Mom. I looked at what the Wongs' place sold for. The one across from you with the second story.\"<\/p><p>\"Don't.\"<\/p><p>\"Two point nine.\"<\/p><p>\"I said don't.\"<\/p><p>\"I'm saying you have no pension, an IRA that's a car, and a house worth more than the two of us will make in our lives, and you're fifty-eight and teaching thirty-four kids out of a garage.\" Water ran and stopped. \"You could sell the house.\"<\/p><p>\"And live where.\"<\/p><p>\"Near me. Sacramento. Fresno. It's cheaper.\"<\/p><p>\"There's nothing in Fresno.\"<\/p><p>\"You're <em>from<\/em> Fresno.\"<\/p><p>\"That's how I know.\"<\/p><p>He laughed, which she had wanted, and she let the rest go by. The house was the retirement. It had been the retirement in 2010, when Dale took the truck and the boat and his half of the savings and she took the mortgage and the Yamaha, and it was the retirement now, paid off, the tax due twice a year, the garage where the money was made. You did not sell the retirement to retire.<\/p><p>\"Are you still doing Saturdays?\"<\/p><p>\"Nine to one.\"<\/p><p>\"Mom.\"<\/p><p>\"They're the best ones. Nobody's tired on a Saturday.\"<\/p><p>She did not tell him about the scales. She had not told anyone. He asked what was new and she said a student's father had built her a thing for cancellations, and he said, \"An app?\" with the same weight she'd have put on it, and she said, \"A link,\" and then that it was working, so far, and was surprised to hear herself say it in that order.<\/p><hr class=\"break\"><p>Lucy Aguilar came in Tuesday at 4:31 talking about a whale that had been in the news, an old one, and did not stop talking to climb onto the bench or to open the book, and her right hand went down to the keys while she was telling Yolanda the whale's name and found middle C. In front of her belly button. Without looking. She played it once, not hard, the way you'd touch a table to be sure it was there, and went on about the whale.<\/p><p>Yolanda did not say anything about it. There were things you did not point at, because the child would look, and then it would be gone.<\/p><p>\"Both hands,\" she said. \"From the top. The whale can wait.\"<\/p><p>Claire Aguilar, in the parents' chair, had seen it too. They looked at each other over Lucy's head for exactly as long as it took, and then Lucy played the four bars, and a fifth, which was new, and got it wrong in a way that meant she'd practiced.<\/p><hr class=\"break\"><p>The chapter's email went out Thursday, the way it did the week before the first Tuesday: the agenda, the recital hall in June, dues at $95 for anyone who had not paid, parking on Cuesta. Harriet Lum had run the Peninsula chapter since 2011, and Yolanda had answered perhaps four of them in thirteen years, always one line, always reply-all, because she did not know which button was which and had stopped pretending.<\/p><p class=\"note\"><em>The Nguyens canceled Wednesday and I did not answer one text. Ask me Tuesday.<\/em><\/p><p>Bev Ostrowski wrote back inside ten minutes. <em>What do you mean you didn't answer?<\/em> Carol Ng wrote, <em>Is this the Allegro thing? I'm not paying nineteen dollars.<\/em> Harriet wrote, to her alone, <em>Do you want five minutes? I can give you five minutes after the treasurer.<\/em><\/p><p>She thought about it through the four o'clock and the four-thirty. She had told him she'd bill him when she knew what it was. She knew now. It was going to be difficult to send a man a bill for a thing he had built her for nothing, and she had been in business long enough to know that this was exactly how you ended up owing people, and that she was going to do it anyway.<\/p><p>At 7:50 Friday, with the planner open on the Clavinova beside the laptop, both saying the same week, she texted him.<\/p><p class=\"note\"><em>T
