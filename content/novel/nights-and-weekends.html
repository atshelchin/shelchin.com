ite \"it's not working.\"<\/em> Six things, he had told Claire in September. She had put it in one sentence, in a thread full of shouting, and had not shouted.<\/p><p class=\"note\"><em>Nate Aguilar, Fermata. I'm the thing they're moving to. Can I call you Saturday?<\/em><\/p><p class=\"note\"><em>Marisol here. Saturday's fine. After ten; my daughter has a thing at nine.<\/em><\/p><hr class=\"break\"><p>She was at her kitchen table in Fresno when he called at 10:15 Saturday, with the laptop open and a cup of coffee going cold, and she talked like a person who had decided what to say before the phone rang.<\/p><p>\"Eighteen years. Forty students at the end, out of the front room, which is my daughter's room now. I closed it in June of 2023 because I could not be the person at ten at night anymore. Not the teaching. The texting. I got to where I'd see a name on the phone and feel it in my stomach before I'd read the words, and one night I put the phone in a drawer, and in the morning I called everyone and said I was done.\" A pause. \"I do the books for my brother's tire shop two days a week. It's not enough of anything.\"<\/p><p>\"Why this?\"<\/p><p>\"Because I read that thread for a week, Nate, and every third comment was a teacher saying 'it's not working,' and I could tell you what each one meant. Bakersfield meant the link. Santa Rosa meant she was scared of a parent. Nobody was answering them. Or one person was, at eleven at night, and it was you.\" She let that sit. \"I don't want to teach. I want to talk to teachers. I can do fifteen hours from this table, and I'm faster than you at the part you hate, and I'll be kinder than you are, because I'm not the one who built it.\"<\/p><p>\"What do you need to be paid?\"<\/p><p>\"Twenty-eight an hour. That's what the tire shop pays me, and I know what you charge, so I know what you can pay. Fifteen hours is four hundred and twenty a week. I'll invoice you like I invoice my brother. First and fifteenth.\"<\/p><p>\"I'll call my accountant Monday about how to pay you.\"<\/p><p>\"That's the right answer. Every reply I send starts with their name. That's the only rule I've got. If you can't live with that one, we should stop now.\"<\/p><p>\"I can live with that one.\"<\/p><p>\"Then call your accountant.\"<\/p><p>Afterward he stayed at the table with the phone face down and thought that Fresno was where Yolanda was from and did not go back to, and that a woman there had just described, in four sentences, the job he could not write in a box in September.<\/p><hr class=\"break\"><p>Lena picked up Monday at 8:05 and was talking before he'd finished saying who it was.<\/p><p>\"Jonah told me about the Rondo thing. Congratulations. What.\"<\/p><p>\"I want to bring someone on. Part-time. Support. She's in Fresno, fifteen hours a week, twenty-eight an hour. She says she'll invoice me. She invoices her brother.\"<\/p><p>\"What's the brother do?\"<\/p><p>\"Tire shop. She does his books.\"<\/p><p>\"Fine. She's a contractor there. He sells tires, and she doesn't sell tires; she does a thing beside his business that isn't his business.\" The calculator tape turned. \"What does your business do?\"<\/p><p>\"It's a website.\"<\/p><p>\"No. What does a teacher pay you nine dollars for?\"<\/p><p>\"The page. The credits. Me answering the email.\"<\/p><p>\"Say the last one again.\"<\/p><p>\"Me answering the email.\"<\/p><p>\"And what's she going to do for you, from her kitchen, fifteen hours a week?\"<\/p><p>\"Answer the email.\"<\/p><p>\"Then that's the whole test. If the work she does is the work your company does, she's an employee, and the state doesn't care what she calls it or what she signs. Payroll service. Forty-five dollars a month, and it does the withholding and the quarterlies so I don't have to look at your face in April. I'll set it up Friday. Bring her address and a voided check.\"<\/p><p>\"She'd rather invoice. She said—\"<\/p><p>\"She can't be a contractor,\" Lena said. \"Not in California. Not for this.\"<\/p>", "words": 2003}, {"num": 42, "title": "One Thousand", "part": 3, "meta": "November 14–26, 2025 · Winchester Boulevard, Campbell; Quince Court; a kitchen in Fresno", "html": "<p>\"Voided check,\" Lena said, and he put it on the desk, and she looked at it without picking it up. \"Her address.\"<\/p><p>He put the card beside the check. <em>Marisol Ochoa,<\/em> a street in Fresno, a zip code.<\/p><p>\"That's the whole file?\"<\/p><p>\"She's filling out her own tax form. The site sends her a link. I never see her Social Security number and neither do you, which is how I like it.\" Lena had the payroll company's page open. \"Legal name of the employer.\"<\/p><p>\"Fermata LLC.\"<\/p><p>\"Which the state is about to learn has an employee. That's a number they give you, and it takes a week, and she can start before it comes, and she will, because you told her Monday. Workers' comp.\"<\/p><p>\"She's at her kitchen table.\"<\/p><p>\"It's your kitchen table now. On paper. If she trips over her daughter's backpack answering your mail, the state would like to know who pays, and the answer is a policy you buy from this same website for about the price of her first Tuesday.\" She typed. \"Sick leave; she earns it, an hour for every thirty. Pay schedule.\"<\/p><p>\"First and fifteenth. She asked.\"<\/p><p>\"Then the first check is December first, for the seventeenth through the thirtieth. Forty-five dollars a month for the service.\" She looked up. \"And about a hundred and eighty on top of her wage that she never sees and you never see. Your half of what the government takes. Write it on your card so you don't ask me in April.\"<\/p><p>He wrote it.<\/p><p>\"Now you.\"<\/p><p>\"Me.\"<\/p><p>\"You want to pay yourself. Jonah said. You have a look.\" She turned the laptop so he could not see it, which was what she did when she was about to say the thing. \"Not through this. Not till January. In January we talk about paying you like a person, with a stub, and it costs money to be that animal, and you're big enough now that it's worth it. Right now you've got two checking accounts with your name on them, and moving money from one to the other isn't a paycheck. It's a draw. It's a word for taking what's yours and not calling it anything.\"<\/p><p>\"How much?\"<\/p><p>\"What's the house short every month?\"<\/p><p>\"About forty-two hundred.\"<\/p><p>\"Then take four and leave the rest where it is, because you didn't send the state a dime in September when you were supposed to, and it remembers.\" She capped the red pen. \"Four thousand. On a day you pick. Every month, the same day, so your wife can put it on whatever she keeps.\"<\/p><p>\"A pad.\"<\/p><p>\"Good. Pads are how people stay married.\"<\/p><hr class=\"break\"><p>Marisol's kitchen at six on Monday morning was yellow, with a window over the sink and a backpack on the chair beside her that she moved out of the frame when she saw him looking at it.<\/p><p>\"Nate. I have the night's mail. Thirty-one. I'm going to read the first line of all of them before I answer any, and then I'm going to do the ones sent before six, because those are the scared ones. Say if that's wrong.\"<\/p><p>\"That's what I do.\"<\/p><p>\"I know. I read a year of your replies on Saturday.\" She was already scrolling. \"Go answer the ones I've marked with your name. I'll be here.\"<\/p><p>He had moved two years of mail into a shared inbox on Friday night, and it had felt like handing someone the keys to a car with the seat still warm. He watched her replies go out on the right side of his screen while he typed on the left.<\/p><p class=\"note\"><em>Linda, you can delete the credit from the family's page: the three dots, then Remove credit. But if what happened is that they didn't show and you don't want them to have a credit, mark the lesson no-show instead and no credit gets made. I'm guessing that's the one you want. Tell me if I'm wrong.<\/em><\/p><p>He read it twice. He had answered that question a hundred times, with the three dots. He had never once wondered why a teacher wanted a credit gone.<\/p><p class=\"note\"><em>Paul, which family?<\/em><\/p><p>That was the whole reply. He looked at the question above it, from a guitar teacher in Chico. <em>Can I turn off the texts?<\/em><\/p><p>\"How do you know it's one family?\"<\/p><p>\"Nate, nobody turns off the texts.\" She did not look up. \"One mother wrote him at ten at night and said the reminders were rude, and he wants her to stop, and he doesn't want to say her name to a stranger. It's always one mother. If I ask, he'll tell me, and I'll turn her off and leave the other twenty on. If I tell him where the switch is, he'll turn off all twenty-one and write you in January asking why nobody comes.\"<\/p><p>Paul wrote back at 6:31. <em>The Delgados. Just her. Thank you.<\/em><\/p><p>He answered eleven of his own before Lucy came out in the horse shirt, and when he closed the lid there were four left, and Marisol was still there in the corner of the screen, typing, with the backpack gone.<\/p><hr class=\"break\"><p>Tuesdays and Thursdays were her brother's tires. By Wednesday he had stopped watching the right side of the screen. By Friday he had nineteen to answer at night, and she had left him a note at the top of the inbox, in a place he had never known was for notes.<\/p><p class=\"note\"><em>Nate. The ones I marked \"yours\" this week were all the same thing under different words: they want to know what happens to the money if they stop. Nobody's asked me that in a way I can answer. I'm not going to guess. M.<\/em><\/p><p>He read it at 9:15 on Friday night, and thought of a side door on Persimmon Lane, and did not have an answer for her either.<\/p><hr class=\"break\"><p>Sunday, November 23, 9:10 in the morning, the pad.<\/p><p>\"October's in pen,\" Claire said. \"Now this morning.\"<\/p><p>\"Nine hundred and ninety-one.\"<\/p><p>She wrote it small. She did not look up, which was how he knew she had heard it.<\/p><p>\"The Rondo people. Their thirty days end this week. Most of the ones who are going to pay will pay by Thursday.\" He gave her the rest. Hosting $180. Marisol, a line she wrote without being asked: <em>$1,820 + $180 + $45.<\/em> \"It'll close around ten-fifty. Eighty-nine hundred and change. That's a guess.\"<\/p><p>\"It's a forecast. Say forecast; it's a nicer word.\" She wrote <em>~1,050 / ~$8,900<\/em> in pencil, lighter than the rest. \"How is she?\"<\/p><p>\"She asks them which family.\"<\/p><p>Claire put the pencil down. Ten years of parents; she knew exactly what that sentence meant, and did not say so.<\/p><p>\"One more. Before. Tuesday I want to move four thousand from the business to the house. Lena says four. The twenty-fifth, every month, if it holds. Same day, so it goes on this.\"<\/p><p>\"Okay.\"<\/p><p>She wrote <em>25th: 4,000<\/em> on the line for December before he had said anything else, in pen, and turned the page.<\/p><hr class=\"break\"><p>Monday, November 24. He opened the list at 6:12, before the mail, because it was the one thing he still looked at first.<\/p><p>The number at the top said 1,000.<\/p><p>He looked at it for a while. It was a list, sorted by newest, and the newest row was a woman named Anita Brar in Yuba City, twenty-three students, who had started her thirty days on the twenty-fifth of October with a file from Rondo and had been charged nine dollars at 6:04 this morning while he was making coffee. <em>From: rondo.<\/em> Lowercase. That was all the row said.<\/p><p>He had a picture in his head from some earlier year of what this would look like, and it had involved standing up. He stayed in the chair and thought about a woman in Yuba City who had woken up this morning owing him nine dollars and had not thought about it once.<\/p><p>At 6:20 Marisol's window came up. \"Nate. Anita Brar wrote at 6:15 about the Monday texts, whether they go out before or after the lesson. I told her before, the night before. Why do you have that face?\"<\/p><p>\"She's the thousandth.\"<\/p><p>\"Then she got a good answer.\" She went back to the mail.<\/p><p>He told Claire at dinner, because it was a number, and numbers went on the pad.<\/p><p>\"A thousand.\"<\/p><p>\"Say the whole sentence.\"<\/p><p>\"A thousand teachers are paying for it. As of this morning. A woman in Yuba City.\"<\/p><p>Lucy said, \"Is a thousand a lot?\"<\/p><p>\"It's a lot of teachers.\"<\/p><p>\"Is it more than the school?\"<\/p><p>\"Arbor has twenty-two teachers,\" Claire said. \"It's forty-five Arbors.\"<\/p><p>Lucy thought about forty-five Arbors and said that was too many recesses, and Claire wrote <em>1,000 — Nov 24<\/em> on the pad, because the day had happened, even if the month had not.<\/p><hr class=\"break\"><p>Tuesday, the twenty-fifth, 6:35 in the morning.<\/p><p>The business account said $31,000 and some dollars, which was August and September and October, the annual plans, sitting in a checking account like water in a bucket. He opened the transfer page. <em>From: Fermata LLC. To:<\/em> the household account, the one she called the house fund. He typed 4,000.00.<\/p><p>There was a line for a note. He typed <em>draw<\/em> and looked at it and deleted it. He typed <em>Nov<\/em> and left it.<\/p><p>Then he did not press the button.<\/p><p>In September it had taken nine seconds with Claire watching, and it had felt like stealing. Same page, same button, same two accounts. Nobody was watching. The number was one he had said out loud on Sunday and she had written down before he finished, and there was no reason on earth to be sitting in front of it at 6:41 with the coffee going cold.<\/p><p>He thought about his father, who had paid a crew of six on Fridays out of a checkbook with the company's name on it, and had never, that Nate knew of, written one to himself. Rosa had done the house from her paycheck. The business had paid the business.<\/p><p>He pressed it at 6:46. <em>Transfer scheduled.<\/em> The page did not know anything had happened.<\/p><p>He wrote <em>4,000<\/em> on the pad in pencil, under her line, and went to wake Lucy.<\/p><p>Claire went over it in pen at 4:20 that afternoon, with her coat still on, and that was the whole ceremony.<\/p><hr class=\"break\"><p>His mother called Wednesday at 6:50, from the kitchen, with something frying.<\/p><p>\"Bring the folding chairs. And Lucy's booster, the tall one; I gave the other one to the church.\"<\/p><p>\"Okay.\"<\/p><p>\"Gil came by Sunday after Mass.\"<\/p><p>He waited.<\/p><p>\"He can start the fifteenth. December. Three days if it doesn't rain, five if it does. He wants half on the fifteenth.\"<\/p><p>\"Eleven thousand.\"<\/p><p>\"I have some of it.\" She said it the way she had said it to Gil, twice. \"The credit union will do the rest. Like a car.\"<\/p><p>\"Mom.\"<\/p><p>\"The tarp's fine. It's its second winter; it doesn't know that. The bucket's in the garage. It hasn't been in the hall since August. Don't start. Thanksgiving.\"<\/p><p>She hung up on the last word, as she always did, and he stayed at the table with the phone in his hand and the laptop open beside it to a page that said $31,000, and did not open the other one, because he knew what it said, and it was Thanksgiving tomorrow.<\/p>", "words": 1909}, {"num": 43, "title": "Roof", "part": 3, "meta": "November 27 – December 5, 2025 · Gilroy; Quince Court", "html": "<p>\"Where's the bucket?\"<\/p><p>Lucy stood in the hallway under the stain, which had been painted over in April by a man from the church and was coming back through the paint in a ring, pale, like a water mark on a table.<\/p><p>\"Garage,\" Rosa said from the stove.<\/p><p>\"It was my job to empty it.\"<\/p><p>\"It's the tarp's job now. The tarp's doing it.\" Rosa did not turn around. \"Go tell your father the chairs go against the wall, not in the middle, he knows that.\"<\/p><p>The chairs went against the wall. There were nine at the table: the four of them, Rosa's sister Carmen and her husband from Salinas, two cousins, and a woman from the church office whose family was in Texas and who brought a pie in a box from Safeway and apologized for it twice. The radio on top of the refrigerator was on the station his father had kept it on, low. Lucy told the table that a horse could sleep standing up and that she had scored a goal in September, both true, and Carmen said which was harder, and Lucy said the goal.<\/p><p>\"The woman in Fresno,\" Rosa said to Nate, between the turkey and the beans. \"The one who answers your letters.\"<\/p><p>\"Marisol.\"<\/p><p>\"She has insurance?\"<\/p><p>\"She's fifteen hours a week. There's no insurance at fifteen hours. She has it through the state.\"<\/p><p>\"Your father had six men and no insurance for any of them. Including him.\" She passed the tortillas to Carmen without looking at them. \"I'm not saying anything. I'm asking.\"<\/p><p>\"I know.\"<\/p><p>\"Good.\" She put her fork down. \"I'm putting in my papers in January.\"<\/p><p>Carmen's husband stopped chewing. Claire looked up.<\/p><p>\"June. Twenty-five years at that desk, and the copier still needs to be talked to every morning, and they can find someone else to talk to it.\" Rosa said it to the table, not to him. \"The pension is what it is. It's more than your father got, which was a truck.\"<\/p><p>\"Mom.\"<\/p><p>\"I'm sixty-three. I've had the letter about the pension in the drawer since April. I've read it. I'm not asking anybody what they think of it, I'm telling you at a table so you don't hear it from Carmen.\"<\/p><p>\"I would have told him,\" Carmen said.<\/p><p>\"I know you would.\"<\/p><p>Claire said, quietly, \"What will you do?\"<\/p><p>\"Fix the roof. Then sit under it.\" Rosa picked her fork back up. \"Gil starts the fifteenth. He wants half. I have some of it.\"<\/p><p>\"We could help with some,\" Claire said. Out loud, at the table, with nine people at it. \"Not all of it. Some. If you'd let us.\"<\/p><p>His mother looked at her for a long moment, and then at him, and then at the tortillas.<\/p><p>\"No,\" she said. \"Thank you. Eat.\"<\/p><p>And they ate, and the woman from the church office apologized for the pie a third time, and Lucy said it was a good pie, and it was.<\/p><hr class=\"break\"><p>He drove down alone on Saturday, because Gil was coming at nine with the contract and Rosa had asked him to read it before she signed, which she asked about anything with more than one page. Claire had forty pages of her own on the table and Lucy was at the Reyeses' until noon.<\/p><p>Gil put the contract on the hood of his truck. Two pages. <em>Tear-off. Replace decking as needed, est. 6 sheets. 30-year architectural shingle, color: Weathered Wood. New vents and flashing. $22,000. 50% at start, balance on completion. Start Mon. Dec. 15, weather permitting.<\/em><\/p><p>\"Weathered Wood,\" Rosa said. \"It's a roof. It's going to look like a roof.\"<\/p><p>\"It's the brown one, Mrs. Aguilar.\"<\/p><p>\"Then say brown.\"<\/p><p>She signed. Gil folded it and said the fifteenth, and shook Nate's hand, and left, and the street was quiet, a leaf blower two blocks over that stopped and started.<\/p><p>Rosa went in to get the coffee. He stood in the driveway with the phone.<\/p><p>He had had her account since 2020, when the three hundred a month started and she wrote the numbers on the back of a church envelope. Four taps to the page. <em>From:<\/em> the house fund. <em>To:<\/em> Rosa Aguilar. He typed 8,000.00, and the phone asked if he was sure, and he was, and it said the transfer would post Monday, and he put the phone in his pocket, and it was 9:20 in the morning.<\/p><p>He told her on the porch, with the coffee, because there was no version of this where he did not tell her.<\/p><p>\"There's eight thousand in your account Monday. Take a smaller loan.\"<\/p><p>\"Ay, Nate.\"<\/p><p>\"It's done. It's not a loan. Don't send it back, because I'll send it again, and the bank will start to wonder about us.\"<\/p><p>She held the cup in both hands and looked at the street.<\/p><p>\"Does Claire know?\"<\/p><p>\"She will.\"<\/p><p>His mother looked at him then, the look from the garage, over a box.<\/p><p>\"She will,\" she said. Only that. She went in with her cup, and he stayed on the porch with his, and he heard the rest of the sentence anyway, in his father's voice, from a kitchen in 2016, about a business park that would pay.<\/p><hr class=\"break\"><p>Sunday, November 30, was the pad, and he gave her the pencil: a thousand and forty-one this morning; it closed tomorrow; ten-fifty was still the forecast. She wrote what he said. He did not say the other thing. He had a whole sentence ready and he did not say it, and the meeting was over in twelve minutes, and she went back to her pages.<\/p><hr class=\"break\"><p>Tuesday night he came out of Lucy's room at 8:35 and the bottom shelf of the refrigerator was on the kitchen floor.<\/p><p>Claire was on her knees beside it with a sponge. The milk, the yogurts, the jar of the good peas, the string cheese, the butter dish stood along the counter in the order they had come out, and the laptop was open on the table, turned toward the door, to the bank.<\/p><p>He read it from where he stood. <em>Dec 1. Transfer to ROSA AGUILAR. −8,000.00.<\/em><\/p><p>\"I update the sheet on the first Tuesday,\" she said, to the shelf. \"You know that. You've known that for a year. So either you forgot, or you did the arithmetic and thought you had until tonight to say it, and I honestly don't know which one I'd rather.\"<\/p><p>\"I was going to say it Sunday.\"<\/p><p>\"You were at the table Sunday. You said ten-forty-one.\" She wrung the sponge out into the bucket. \"I said it at her table. Out loud. In front of Carmen. I said we could help with some of it, and she said no, and you sat there and let her say no to me, and then you drove down Saturday and did it with your thumb. Not the roof, Nate. I'd have said yes. I said yes in the car in 2023 on the way home from that house. You didn't want the yes. You wanted to not ask.\"<\/p><p>He had nothing to put against that. He stood in the doorway with his hands empty.<\/p><p>\"You told me about the box,\" Claire said. \"You stood in this kitchen and told me about a man who wrote a letter and put it back in a box because he'd rather lose thirty-eight thousand dollars than ask twice. And I felt for him. I did. I've been feeling for him for two years.\" She sat back on her heels. \"And then you go and do exactly the thing he'd have done, in the same driveway, with better equipment.\"<\/p><p>\"Yes.\"<\/p><p>\"Don't agree with me. It's worse when you agree with me.\"<\/p><p>\"I'm not agreeing to get out of it.\" He came in and sat down, because standing in the doorway was a thing he did, and she knew it. \"I did it in her driveway with my thumb because she said 'I have some of it' for the fourth time, and I couldn't hear it a fifth. And I sat here Sunday with a sentence ready and didn't say it. I don't know why. That's not true. I know why. I didn't want to watch you find out I'd done it after, so I put off the after. That's all of it. I don't have a card and I don't have a plan, and I'm not going to build you one tonight. I'm sorry.\"<\/p><p>She looked at him for a while, from the floor, with the sponge in her hand.<\/p><p>\"Okay.\"<\/p><p>She got up and put the shelf back and started on the yogurts, and he did not help, because she had not asked, and when the refrigerator was full again she took the pen from the pad and wrote a line under the November numbers, small, in her own words, and turned it so he could read it.<\/p><p class=\"note\"><em>−8,000. Rosa. Nov 29. Found Dec 2.<\/em><\/p><p>Then she went to bed. The word <em>found<\/em> stayed on the table under the light, and he knew where he had seen its shape before: on a phone, in March, in a list that had ended with <em>Asked.<\/em><\/p><hr class=\"break\"><p>Wednesday at 6:35 in the morning she was at the table in her robe with the pad, and Lucy was not up yet, and she had a clean page.<\/p><p>\"Five hundred,\" she said.<\/p><p>\"Five hundred.\"<\/p><p>\"In July I said a tank of gas. It was a joke, and you knew it was a joke, and a joke isn't a number. So now it's a number. Anything over five hundred dollars that isn't on the sheet already, either of us, the other one hears about it before. Not after. Not at Morgan Hill. Before.\" She uncapped the pen. \"My mother, your mother, the car, my program, a piano, a roof. Either of us. I'm not writing a rule for you. I'm writing one for the house.\"<\/p><p>\"What about the business?\"<\/p><p>\"The business is yours. The house is ours. When the business pays the house, that's the twenty-fifth, and it's on the sheet.\" She wrote as she talked. <em>Nothing over $500 without the other one. Either of us. Before, not after.<\/em> \"Initial it.\"<\/p><p>He initialed it. She initialed it under his, and drew a line under both, and wrote the date.<\/p><p>\"And call your mother. Tonight, not Sunday. Tell her I know.\"<\/p><p>\"She asked me Saturday if you knew.\"<\/p><p>\"I'm sure she did.\" Claire capped the pen. \"Then she's been waiting four days to find out what kind of son she has. Go tell her.\"<\/p><hr class=\"break\"><p>He called at 6:50 that night, the Wednesday call, and his mother picked up with the television on.<\/p><p>\"Claire knows.\"<\/p><p>\"Good.\"<\/p><p>\"She's not happy about it.\"<\/p><p>\"Good,\" Rosa said. \"Neither was I.\" The television went down a notch. \"Gil says the fifteenth. I told the credit union seventy-five hundred instead of fifteen. The girl asked me if I'd won something. I said my son had.\"<\/p><hr class=\"break\"><p>Friday, December 5, at 6:52 in the evening, with the dishes done and Lucy in the bath telling Claire about a horse that could count, his phone lit on the counter.<\/p><p>Devin.<\/p><p class=\"note\"><em>Saw the Rondo thread. Congrats. We should talk.<\/em><\/p><p>Three sentences. A capital letter on each and a period after, which Devin did not do, had never once done in six years of texts, not for a layoff, not for a train. He read it twice at the sink with the water running. Then he dried his hands, and turned the phone face down on the counter, and did not answer it that night.<\/p><p>Claire came down the hall with Lucy wrapped in a towel and asked who it was. \"Devin,\" he said, and she looked at the phone, face down by the sink, and then at him, and took Lucy in to bed.<\/p>", "words": 1978}, {"num": 44, "title": "Quiet", "part": 3, "meta": "December 1–8, 2025 · Quince Court; Arbor Elementary; the middle-school field; Persimmon Lane", "html": "<p>\"There's one for you that isn't a bill,\" Lucy said, and put it on the table on top of the bills, which was where she thought mail went.<\/p><p>A square envelope, cream, with a cat on the stamp. The address was in a hand that leaned left. <em>Nate Aguilar, Fermata,<\/em> and then the street, which she could only have gotten from the bottom of a receipt, and had.<\/p><p class=\"note\"><em>Dear Nate. The Kesslers came back. The cast is off and the boy is playing again, badly, which is fine. They took the six lessons off the page without asking me a thing, and I did not have to say one word to a person about money, which is what I wanted you to know. Marisol answered my question about the recital date in ten minutes and used my name. I have been teaching since 1989 and this is the first company that ever wrote back. Merry Christmas. Joyce (Santa Rosa, the cat).<\/em><\/p><p>He read it standing up. Then he put it in the takeout drawer, under the menus, on top of a printed email from a piano teacher in Los Altos, July of 2024, fifteen cents at the library, which was the only other one there.<\/p><p>Marisol had said, at six that morning, from the yellow kitchen: \"Nate. My check came. It has a stub. I've never had a stub.\" And had gone back to the mail before he could say anything, which was the right thing to do with it.<\/p><hr class=\"break\"><p>Thursday night the multipurpose room at Arbor had two hundred folding chairs and paper snowflakes on every window, and the risers at the front were three deep with third-graders in white shirts who had been told not to wave and were finding out how hard that was.<\/p><p>Claire walked Room 14 in at 6:25, in a line, and handed them to Mrs. Tam at the risers, and stood for a second at the side where she had stood for ten Decembers with a class behind her. Then she came down the aisle and sat in the chair he had been holding with his coat since six.<\/p><p>Lorenz, by the door, saw it, and said nothing, and let it be.<\/p><p>\"Ten years,\" Claire said. \"I've never seen it from the front.\"<\/p><p>\"What's it look like?\"<\/p><p>\"Like a lot of shirts.\"<\/p><p>Lucy was second row, fourth from the left, between a boy who was already waving and a girl who had decided to be a statue. She found them. She did not wave. She put her chin up a quarter inch, which was the wave, and Claire's hand closed on the program and did not open again.<\/p><p>They sang a song about a dreidel, a song about a reindeer, and a song in Spanish about a donkey, and Lucy was loud and half a beat ahead on all three, as she was at the piano, as she was at everything, and when the donkey was done the room stood up and Mrs. Tam turned around and bowed for them, and Ruth Amsel, at the cookie table, said, \"I've had this since five,\" to nobody.<\/p><p>His phone was in his pocket and he did not take it out, not for the donkey, not once, and afterward, at the cookies, Lucy said, \"Did you hear the part where I was loud,\" and he said he had heard every part.<\/p><hr class=\"break\"><p>Saturday he put the phone in the glove box of the CR-V at 7:30 in the morning and locked the car and stood in the driveway with the key.<\/p><p>It was Claire's idea, on Wednesday, under the rule, in pencil: <em>Sat Dec 6: Nate off. All of it.<\/em> He had said okay. Now he stood by the car and put his hand in his pocket and found nothing there, and did it again a minute later, and went inside.<\/p><p>The Green Comets' last game had been rained out on the fifteenth of November and moved to now, on a field that had not dried and would not before March, and eleven children in green and eleven in orange ran through it in a knot for fifty minutes while the parents stood on the dry side. Lucy kicked the ball twice. Once it went sideways. Once it went toward the orange goal, not into it, but toward, and she looked at the sideline the way she had in September, fast, and he was looking, and she looked away, because you weren't supposed to look.<\/p><p>At the orange slices she said, \"You saw.\"<\/p><p>\"I saw.\"<\/p><p>\"Both times?\"<\/p><p>\"The sideways one too.\"<\/p><p>\"That one was on purpose,\" Lucy said, and took two slices, and that was the end of it. He had stood on a sideline with nothing in his hands for fifty minutes, and it had been, he could admit it, very hard for the first twenty and then not.<\/p><p>At 12:30 Yolanda opened the side door with no brace on, because the brace was for nights, and looked at his hands.<\/p><p>\"Where's the phone?\"<\/p><p>\"In the car.\"<\/p><p>\"Leave it there.\" She let Lucy in past her. \"Thirty-four. Nobody else left. Mrs. Ruiz asked what took me so long. Two Saturdays after this one, and then I'm a weekday woman, and your daughter's a Tuesday. It's on the board.\"<\/p><p>The Burgmüller. The left hand was there now, mostly. Yolanda demonstrated it once, with a thumb that did it, and sat back, and let Lucy do it wrong twice and right three times, and said, \"That's the lesson,\" and meant it as a fact and not a praise.<\/p><p>At one, at the door, she said, \"You look like a man on a whole rest. Four beats. Count them all; don't come in on three,\" and shut the door on it.<\/p><hr class=\"break\"><p>He read a novel in the afternoon. It was one of Claire's, from the bath, a detective in a cold country, the pages gone wavy, and he read forty pages on the couch with his feet up and found at the end of them that he had not read them, and went back, and read them, and they were fine. Lucy drew at the other end of the table with the big markers, which was where she drew. At four he fell asleep with the book on his chest and Claire let him, and when he woke up it was dark and there was rice going and nobody had needed him for two hours and nothing had broken.<\/p><p>He got up for water at 9:40.<\/p><p>The refrigerator door had the Green Comets schedule on it, and a horse, and a permission slip, and under the whale magnet, where it had been since a Sunday in November of 2023, the drawing. DADY AT THE COMPUTR, the R backward. The blue rectangle, colored hard. The man's face turned to it. The paper had gone soft at the corner and the schedule was pinned over the right side of it, over the small girl with the whale and the woman with the flashlight, so that only the man and the rectangle showed.<\/p><p>He had stopped seeing it, as you stop seeing anything on a refrigerator. He saw it now, with the glass in his hand, in the light from the hall. Two years and three weeks. She was eight. She drew horses.<\/p><p>He did not take it down. He moved the soccer schedule four inches to the left, so the girl with the whale showed, and the woman with the flashlight, and the sky, and stood there a while longer, and went to bed.<\/p><hr class=\"break\"><p>Sunday at 6:05 he got the phone out of the car in the dark. Thirty-one emails, nineteen of them already answered by a woman in Fresno on her Saturday morning, each beginning with a name. Nothing that could not wait. Devin's three sentences from Friday, still there, still unanswered.<\/p><p>Sunday's meeting was eleven minutes, under the rule with two sets of initials on it: November closed at <em>1,050. $8,925,<\/em> in pen, with the house at $47,600 under it and the eight thousand in pencil under December, because it had posted on the first. Lucy, at the counter with cereal, said that was short, and Claire said nothing had broken, and put the pad on top of the microwave.<\/p><hr class=\"break\"><p>Monday the eighth was a Monday. The job ran at seven in its pieces of fifty and told him so and told no one else. Marisol at six, the yellow kitchen, the backpack. Twenty-six for him by noon, none of them on fire. Rain in the afternoon, the lot at Arbor going under at the low end as it did every December.<\/p><p>Dinner. Lucy's spelling list at the table, ten words, one of them <em>schedule,<\/em> which she said was a trick.<\/p><p>At 7:30 he took her in for the horse book, two chapters, the one where the horse is sold and the one where it comes back, and Claire was at the table with her forty pages and her pen, and his phone was on the counter by the sink, face up, where he had put it down to dry his hands.<\/p><p>At 7:41 it lit.<\/p><p class=\"note\"><em>Bay Area Independent Music Teachers<\/em><\/p><p class=\"note\"><em>Is anyone else's parent seeing OTHER FAMILIES' schedules??<\/em><\/p><p>Nobody was in the kitchen. Claire did not look up from her pages, because it was his phone, and it was always lighting. In the bedroom the horse was on its way back to the girl who had sold it, and Lucy said this was the good part, and he agreed that it was.<\/p><p>The screen stayed lit for the length of time a screen stays lit, and then went dark.<\/p><p>Lucy wanted the next chapter, and he read it to her, the whole thing, with the door open. On the counter the phone lit again, and again. Claire turned a page.<\/p>", "words": 1647}, {"num": 45, "title": "Sequential", "part": 4, "meta": "December 8–9, 2025 · Quince Court", "html": "<p>The horse came back to the girl at 8:10, and Lucy said that was the good part again, and was asleep by 8:25 with the book still open on the blanket. He took it off her and turned out the lamp.<\/p><p>Claire had her forty pages at the table. He took the wavy detective novel to the couch and read the chapter where the inspector drives to the coast, and then the next one, and it was fine. At 10:20 Claire capped her pen and put her hand on his head on the way past and said, \"Lock up,\" and went down the hall.<\/p><p>He locked up at 10:50. The phone was where he had left it, by the sink. He picked it up to plug it in.<\/p><p>Two texts from Kim. Under them, still, Devin's three sentences from Friday. Above them, the group.<\/p><p class=\"note\"><em>Is anyone else's parent seeing OTHER FAMILIES' schedules??<\/em><\/p><p>A hundred and forty comments.<\/p><p>He read it from the top, standing. Laurel Kinsey, violin, Portland, Oregon, thirty students, a year and a half on the year plan. One of her mothers had gotten the six o'clock text that evening, the reminder for Tuesday, with the link in it, the short one, and had been curious about the number on the end, and had changed the last digit, and had gotten somebody else's Tuesday. So she had changed it again. She had spent the evening at it. She had made screenshots of some, a boy named Mateo in Tucson at 4:15, a family in Ohio with a phone number that started with 419, and she had put them in the group chat Laurel kept for her studio's parents, with <em>lol is this normal??<\/em>, and a father in that chat had said it was not normal and had sent them to Laurel, who had posted at 7:41.<\/p><p>Four screenshots. He made them big. Family name, a child's first name, a day, a time, a teacher's name, a phone number. His own sentence at the bottom of each, the one that said whose policy it was. His gray line under that.<\/p><p>Kim at 8:32: <em>@Nate Aguilar.<\/em> Kim at 9:05, in the texts: <em>Look at the group.<\/em> Kim at 9:50: <em>Nate.<\/em><\/p><p>A teacher in Tucson at 8:50: <em>That's my Mateo. That's his mother's cell.<\/em> Someone at 9:12: <em>This is why I use Allegro.<\/em> Someone at 9:20 who was Carol Ng: <em>Is he asleep? He answers at six in the morning, he's asleep.<\/em> Someone at 10:15: <em>I have 26 families and every one of them got a text with one of these links in it this morning.<\/em><\/p><p>His stomach went first, the way it had at 5:50 on a Tuesday morning last November with fourteen pairs on a list, except that morning he had not known what he was looking at for a full minute, and tonight he knew before the screenshots finished loading.<\/p><p>He knew which card it was.<\/p><p>It had said ADD TOKENS in block letters and it had been at his elbow at 6:31 on a Wednesday morning in April of 2024, on top of the six-line card, and Lucy had leaned on the table for cereal, and it had gone under the fruit bowl. The fruit bowl was still there. There were three bananas in it. He did not lift it. The card had gone out with something a year and a half ago, a stack of mail, a Costco receipt, and he saw it anyway, on the counter, in his own printing, as clearly as the phone.<\/p><p>Twenty minutes if nothing went wrong. That was what he had thought at 6:31. He had built the long tail of letters onto the portal links in February, and had looked at the short ones, and left them, because they fit in a text and they worked.<\/p><p>He typed one comment, at 10:58, under a hundred and forty.<\/p><p class=\"note\"><em>I see this. It's real. I'm turning the links off now and replacing them tonight. Every teacher gets an email from me by morning saying exactly what could be seen and what I've done. Nate.<\/em><\/p><p>Kim wrote back inside a minute, in the texts. <em>Fix it. Then write.<\/em><\/p><hr class=\"break\"><p>The kitchen light came on behind him at 11:06.<\/p><p>\"What.\" Claire, in the robe, with her hair down. She had heard him say <em>Jesus<\/em> to a phone, which he did about once a year.<\/p><p>\"Every text reminder has a link in it. To cancel. The link's got a number on the end, and the next family's lesson is the next number. Anybody can change the number and read the page. Name, kid's first name, the day, the time, the teacher, the phone number. A mother in Portland did it forty times tonight and put it in a group chat.\"<\/p><p>\"Everyone's?\"<\/p><p>\"Everyone's. Every lesson since April of last year.\"<\/p><p>She stood there and took that in, and he watched her do it, which was the price.<\/p><p>\"How long have you known it could do that?\"<\/p><p>\"Since the morning I built it. I wrote myself a note to fix it. I lost the note.\"<\/p><p>She did not say anything to that. She looked at the fruit bowl, because he was looking at it.<\/p><p>\"What are you doing now?\"<\/p><p>\"Turning them off. Then making new ones.\"<\/p><p>\"How long?\"<\/p><p>\"I don't know. Two. Three.\"<\/p><p>\"Wake me when it's done.\"<\/p><p>\"Okay.\"<\/p><p>She went back down the hall, and he sat down at the table, and opened the laptop, and the first decision was already sitting there waiting for him, and he made it at 11:09.<\/p><p>The links could stay up while he built the new ones, so that any parent who needed to cancel a Tuesday lesson before nine tomorrow could. Or he could kill every one of them now, and the parents who had a fever at seven in the morning would get a page that told them to text their teacher instead, and the teachers would hear about it. He killed them. At 11:12 every cancellation page on the site said <em>This link is being replaced tonight. Please text your teacher to cancel. Nate,<\/em> and the Portland mother, if she was still at it, got that too.<\/p><p>Then he built it.<\/p><p>The signing was already there from February; he had written it for the portal and it had been sitting in a file for ten months eight lines away from the short links. He put it on them. Every link that went out from now on carried a long string after the number that the page could check, and that nobody at a kitchen table in Portland could produce by counting. The links were longer now, and the texts would cost more to send, and he paid it. He gave each link a life: it worked until midnight on the day of the lesson, and then it did not. He made every link the site had ever sent stop working at once, all of them, the old numbers, dead, so that there was nothing left for anyone to count up from.<\/p><p>That was midnight. He drank a glass of water at the sink and did not look at the phone, which lit on the counter at intervals like something breathing.<\/p><p>The next two he had never built, in twenty months, because nothing had ever made him. Every time a cancellation page opened, the site would now write down which page, when, from where, and whether it had been opened by the phone the link was sent to or by some other one. And an address that opened more than a handful of pages in a minute would get an empty page for an hour. He wrote that part twice, because the first time it would have locked out a teacher checking her own week.<\/p><p>At 1:40 he tested it, the hour he had not spent on a Friday night in November. He sent himself a reminder to his own phone, opened the link, canceled a lesson on his test studio, got the credit. He changed the last digit of the link and got <em>This link isn't valid.<\/em> He changed it again and got the same. He changed it twelve times fast and got a blank page. He opened an old link from a text on his phone from last week, the real one, Lucy's Saturday, and it said <em>Please text your teacher.<\/em> Once was a story. He did all of it again.<\/p><p>He deployed at 2:10, and watched it go, and it went. Tuesday's six o'clock texts were sixteen hours off; they would carry the new links and tell no one.<\/p><hr class=\"break\"><p>Then the logs.<\/p><p>The hosting company had kept a line for every request since the day he had turned the plan on in April 2024, because that was what it did unless you told it to stop, and he had never told it anything. He pulled every visit to a cancellation page. Hundreds of thousands. He set each one beside the family the link had been sent to. A visit from a phone that had also opened its own link, ever, was a parent. A visit from an address that had never been sent anything was somebody else.<\/p><p>Sixty-one.<\/p><p>Sixty-one times in twenty months, a page had been opened by someone it had not been sent to. Forty of them were tonight, between 6:52 and 10:41, from one address in Portland, Oregon, in order, one number after the next, with a gap of nine minutes around eight o'clock that he guessed was a child's bath. The other twenty-one were spread across the whole twenty months, one here, one there, a single page each, never two from the same place: a number typed wrong from a paper note, a link forwarded to a grandmother, a thumb. Nobody had ever done what the Portland mother had done. It had been sitting there for anyone.<\/p><p>He made the list. Sixty-one pages, fifty-eight families, because three had been looked at twice, in thirty-seven studios. Mateo in Tucson. A 419 number in Ohio. A Wednesday in Fresno. A family of Marcus's, one of the twenty-one, from a Sunday in March. None of Yolanda's. He did not know why that mattered and it did.<\/p><p>Fifty-eight families whose phone numbers a stranger had read off a page with his sentence at the bottom of it. Thirty-seven teachers who did not know yet.<\/p><p>It was 2:55. Marisol was asleep in Fresno; Tuesday was her brother's tires. He wrote her a note at the top of the inbox, for six, in the place she had shown him was for notes. <em>M. Read the group first. Then the email I'm about to send. The scared ones are mine today. N.<\/em><\/p><p>He had not written the email. He had a list, and a fix, and fifty-eight names, and a card he could still see at his elbow. Eleven more comments and two more texts from Kim, unopened.<\/p><p>The hall light came on.<\/p><p>Claire stood in the kitchen doorway with the robe held closed at the neck. It was three in the morning. She looked at the laptop, and the list on it, and at him.<\/p><p>\"Is it done?\"<\/p><p>\"The fix is done. Two-ten.\" He turned the screen so she could see the list. \"Sixty-one times, in twenty months. Forty were tonight. Fifty-eight families. Thirty-seven teachers.\"<\/p><p>She read it from the doorway, the way she read a seating chart, all of it at once.<\/p><p>\"You have to tell everyone.\"<\/p><p>\"Everyone?\"<\/p>", "words": 1914}, {"num": 46, "title": "Disclosure", "part": 4, "meta": "December 9–12, 2025 · Quince Court; a phone call from Palo Alto; the group", "html": "<p>Marisol's text came at 6:20, on her brother's day.<\/p><p class=\"note\"><em>Nate. I saw the group at 5:40. I'm on; the tires can wait. Send me the thirty-seven names and I'll have their families' lists ready by the time you've talked to whoever you're talking to. You're talking to someone, yes?<\/em><\/p><p>Lena had answered his 6:05 text at 6:11 with a name and a number and one line. <em>Sunil Batra. Palo Alto. He's up; he'll call you at 7:30. He's four-fifty an hour and he's worth one hour. Don't send anything before you talk to him.<\/em><\/p><p>The draft was open on the table, written between 3:20 and 5:00, the fourth version, not sent.<\/p><hr class=\"break\"><p>The phone rang at 7:30 exactly.<\/p><p>\"Mr. Aguilar. Sunil Batra. Tell me what was on the page. Exactly. Not what you're afraid was on it.\"<\/p><p>\"A family's last name. A student's first name. The lesson day and time. The teacher's name. The parent's phone number.\"<\/p><p>\"Passwords.\"<\/p><p>\"There aren't any. It signs you in by email.\"<\/p><p>\"Emails, then. On the page.\"<\/p><p>\"No.\"<\/p><p>\"Card numbers.\"<\/p><p>\"I never see a card number. The payments company has them.\"<\/p><p>\"Addresses. Birthdays. Anything about the child besides a first name and a Tuesday.\"<\/p><p>\"No.\"<\/p><p>\"Who typed the child's first name in?\"<\/p><p>\"The teacher. Or the parent, on the teacher's form.\"<\/p><p>\"Adults. Fine. How many, and where.\"<\/p><p>\"Sixty-one pages in twenty months. Fifty-eight families. Thirty-seven studios, most of them in California. Forty of the sixty-one were last night, one woman in Portland.\"<\/p><p>\"All right. Here's the sentence you're paying for. California has a law about telling people when their information gets out, and it has a list of what counts, and a name next to a phone number isn't on it. A name next to a card number is. An email next to a password is. You've got a page with a phone number on it, and the law, read plainly, doesn't clearly require you to notify anyone.\" He let that stand about a second. \"And I'd tell them anyway if I were you, but that's not legal advice, that's a guess about your customers.\"<\/p><p>\"I'm telling them at eight.\"<\/p><p>\"Then I've saved you nothing and cost you a hundred and fifty dollars. Read me the email.\"<\/p><p>Nate read it. Sunil stopped him once, at the last paragraph.<\/p><p>\"You say it's your fault. It is. Guilt isn't a legal theory, Mr. Aguilar; it's a mood. What was on the page, what you did at 2:10, what you're doing today. You've done that. Send it. My letter comes at nine, and the next thing we talk about is the one you haven't told me yet, because there's always one.\"<\/p><p>\"There's a friend who built part of it. Nothing written.\"<\/p><p>\"That's the one. Not today.\"<\/p><hr class=\"break\"><p>Claire read it at 7:52 in her school clothes, with her coffee, and put her finger on one sentence in the last paragraph.<\/p><p class=\"note\"><em>I'd understand if you left.<\/em><\/p><p>\"That one's for you, not them.\"<\/p><p>\"It's true.\"<\/p><p>\"It's asking them to. Say what happened, say what you'll do. You did. Take it out.\"<\/p><p>He took it out. She put her cup in the sink and said, \"Eight,\" and took her bag off the hook. He pressed it at 8:00, to a thousand and sixty teachers, and heard the Civic start.<\/p><p class=\"note\"><em>Subject: Cancellation links could be read by strangers. Here's what happened.<\/em><\/p><p class=\"note\"><em>Last night a parent in Oregon changed the number at the end of a text-message cancellation link and saw other families' cancellation pages. She looked at about forty over the evening and posted some in her teacher's group chat. Each page showed a family's last name, a student's first name, the lesson day and time, the teacher's name, and the parent's phone number. No passwords, no card numbers, no emails, no addresses.<\/em><\/p><p class=\"note\"><em>This has been possible since April 2024, when I built the links. The numbers ran in order. I knew that morning and wrote myself a note and didn't.<\/em><\/p><p class=\"note\"><em>At 2:10 this morning I replaced every link. The new ones carry a long code that can't be guessed and stop working at the end of the lesson day. Every old link is dead; a parent who opens one gets a note to text you instead. Tonight's reminders will go out with the new links. I now keep a record of who opens each page, and an address that opens more than a few pages in a minute gets nothing for an hour.<\/em><\/p><p class=\"note\"><em>I have the records back to April 2024. In twenty months, 61 cancellation pages were opened by someone they weren't sent to. 40 were last night, by the one parent in Oregon. The other 21 are single visits spread across the whole period, a mistyped number or a forwarded link. Those 61 pages belong to 58 families in 37 studios. If yours is one of the 37, you'll have a second email from me by 9:00 with the families' names, and by tomorrow a button that sends each of your families a note about it, in your name, that you can read before it goes. If yours isn't, I can't find a page of yours that a stranger opened, and I'm telling you anyway.<\/em><\/p><p class=\"note\"><em>A lawyer told me this morning that a name and a phone number probably don't require me to notify anyone under California law. I'm doing it because you'd want to know, and your families would.<\/em><\/p><p class=\"note\"><em>If you'd rather not have me after this, reply \"refund\" and December is yours; if you paid for the year, I'll return the months you haven't used. I'm sorry. Nate<\/em><\/p><hr class=\"break\"><p>The post went up on the site at 9:15 under the same title, the email with the refund paragraph off it, so that a parent who found it from a search could read what had been on the page. He put the link in the group at 9:16, under a hundred and ninety comments, and Kim pinned it at 9:20. <em>Pinned under Laurel's. Laurel's stays.<\/em><\/p><p><em>Thank you for saying it at 8 in the morning and not Friday afternoon.<\/em> That was Diane Foyle. <em>He's had a year and a half. He says so himself. I'm not paying nine dollars a month for a year and a half.<\/em> That was someone in Walnut Creek with twenty students who had joined in October from Rondo. <em>Nobody at Rondo ever told us anything. Nobody at Allegro would either. I'm staying.<\/em> Carol Ng, at 9:40. <em>My Mateo's mother wants to know if she needs a new phone number. Does she?<\/em> The Tucson teacher, and he answered her in the group, in front of everyone: no, he didn't think so; if she wanted one he'd change it on the page in a minute, and it was her call.<\/p><p><em>I'm out,<\/em> someone wrote at 10:05, and someone wrote <em>same<\/em> under it.<\/p><p>The second emails went to the thirty-seven at 8:50, each with its names, which Marisol had lined up by 8:30 from her brother's office, a family on every line and the date and time the page had been opened beside it.<\/p><hr class=\"break\"><p>Wednesday at six she was in the yellow kitchen.<\/p><p>\"Nate. They will not forward an email to their families. They'll say they did. Half will paste it into a group text and cut the part that says whose fault it was, because they're embarrassed for you, and half will sit on it until Friday. Give them one button. It sends a note to every family in the studio, the family's name at the top, the teacher's under it, yours at the bottom. Show them what it says before they press. Don't let them edit it.\"<\/p><p>\"Every family? Not just the fifty-eight?\"<\/p><p>\"Every family of the thirty-seven. You don't tell a mother her neighbor's page got looked at and hers didn't. You tell the studio. I'll write it with you. Their name first.\"<\/p><p>He built it by eleven. She wrote it while he built, and read it to him at 10:40.<\/p><p class=\"note\"><em>Mrs. Ruiz, this is a note from your teacher's scheduling service. On Monday evening a parent in another city was able to open some families' lesson pages by changing the number in a text-message link. The pages showed a family's last name, a student's first name, the lesson day and time, the teacher's name, and a parent's phone number. Nothing else. The links were replaced early Tuesday morning and the old ones no longer work. The page for one or more families in this studio was among those opened. Your teacher wanted you to hear it from her. Nate Aguilar, Fermata.<\/em><\/p><p>\"That's Yolanda's Mrs. Ruiz,\" he said.<\/p><p>\"It's every Mrs. Ruiz. Their name first. Then hers. Then yours at the bottom.\"<\/p><p>By Thursday night thirty-four of the thirty-seven had pressed it, and Marisol had called the other three, and eleven hundred families, about, had a note with their own name at the top of it.<\/p><hr class=\"break\"><p>The ad was in the group at 10:20 Wednesday morning, between a recital hall in San Mateo and a metronome.<\/p><p>A screenshot of Laurel's thread, the title and the four pictures, phone numbers blurred, which was more than the Portland mother had done. Across it, in a font somebody had paid for: <em>Your families trusted you with their information. Allegro Studio: 13 years, 40 people, phone support, and a security team. Three months free for Fermata teachers through January 31.<\/em> A button.<\/p><p>Kim took it down at 11:05 and posted where it had been. <em>Ads aren't allowed here. Never have been. The ad is gone. Laurel's thread stays, and so does Nate's, and if anyone in Nashville wants to explain the difference to me, my number is in the group description.<\/em><\/p><p>She texted him at 11:06. <em>I took down the ad. The thread stays. Those are two different things and I know it.<\/em><\/p><p><em>I know it,<\/em> he wrote.<\/p><p class=\"note\"><em>Good. Fix the button thing today.<\/em><\/p><hr class=\"break\"><p>The call came at 2:40 Wednesday afternoon, from a 559 number, and he was at the table with the button half tested, and he picked up.<\/p><p>\"Is this Nate.\"<\/p><p>\"It is.\"<\/p><p>\"Theresa Molina. Fresno. Thirty-eight students. I've had you since the church in August of last year, and I have a mother in my <em>driveway.<\/em>\"<\/p><p>She did not stop for four minutes. He looked at the stove clock when she started, and did not say anything, because there was nothing in the four minutes that was not true. She had read his email at 8:04 Tuesday and pasted it into her own group text by 8:30, all thirty-eight families, because she was not waiting for a button. Two families had called her at ten that night, because she was the one they could reach. A mother in her driveway at 7:45 this morning with her phone out, asking who else had her number. A father who had said the word <em>lawsuit<\/em> and then said he was kidding and had not sounded like it. \"I recommended you. To <em>my<\/em> people. In <em>my<\/em> town. I said he's one guy and he writes back, and I said it like that was the good part. Do you know what my Wednesday looked like? I had a nine-year-old ask me if the man from the computer knew where she lived.\"<\/p><p>\"No. He doesn't.\"<\/p><p>\"I know he doesn't. I read your email. I read it out loud to a woman in my driveway.\" She breathed. \"Are you still there?\"<\/p><p>\"I'm here.\"<\/p><p>\"Good.\" She hung up.<\/p><p>Her account said what it had said that morning. He put the phone down and finished testing the button.<\/p><hr class=\"break\"><p>Tuesday had been twelve.<\/p><p>He had written it on a card at midnight, the one number, because he had wanted them in one place. The Walnut Creek teacher was on it. Laurel Kinsey was not, which he read four times. Twelve, in a day, with the word <em>refund<\/em> from seven, and he did the seven before he slept, and the page kept its thirty cents and its percent on each one, as it always had.<\/p><p>Wednesday he wrote a line under it. Thursday another. Friday another. Four lines, and none of them was zero.<\/p>", "words": 2023}, {"num": 47, "title": "Cancellations", "part": 4, "meta": "December 13–23, 2025 · Quince Court; the group; Gilroy", "html": "<p>Yolanda's post had gone up at 9:50 Friday night, and he read it Saturday at six with the coffee, because she had not told him she was writing it, which was how he knew she had meant it.<\/p><p class=\"note\"><em>I have had this man's link since April of last year, the first one. None of my families' pages were opened. I asked him Tuesday at 8:05 and he had the answer already, which is how I knew he'd looked before he wrote. Two things, and I mean both. He should have fixed this a year ago. He says so in his own email, which is more than the last three companies I paid ever said about anything. And he told every one of us at eight in the morning, with what was on the page written out plain, when a lawyer had just told him he didn't have to. That's not a wrong note. A wrong note is one bar. That's a fingering he knew was bad in April 2024 and kept because it was fast, and I have done that, and I have watched children do it for thirty years, and you fix it when you're caught, and you're embarrassed, and it's still fixed. I'm staying. If you're leaving, leave. But leave over the twenty months, not over the email. The email is the part you want. Y. Beck, Alder Creek.<\/em><\/p><p>Two hundred and six comments under it by six in the morning. He did not read them. Kim had liked it, which she had done once before, for a post of Yolanda's, in November of 2024.<\/p><hr class=\"break\"><p>Marcus called Sunday at 9:40, from a car, with the funk band's van door still open behind him.<\/p><p>\"Got the note. Tanya read it before I did. She said, 'Well, he told you,' and went to bed, which from Tanya is a parade.\"<\/p><p>\"One of yours was on the list. March.\"<\/p><p>\"The Fergusons. Sunday in March, one page, one time. I called them. She said, 'A stranger saw Malik's Saturday?' I said no, somebody's Saturday in Tucson saw yours. She said okay.\" A horn, not his. \"Jaden's mother called me. Different conversation. She wants to know why I use a one-man thing when there's a whole company in Nashville with a phone.\"<\/p><p>\"What'd you tell her?\"<\/p><p>\"I told her because the one man called me in May of last year for forty minutes and didn't sell me anything, and the whole company in Nashville sent me a screenshot of your worst night with a coupon on it. She's still with me. She's not happy. Those are two different things, and she knows it, and so do you.\" The van door shut. \"How many.\"<\/p><p>\"Fifty-one, as of this morning. Four hundred and change back to them.\"<\/p><p>\"That's a wedding and a plate and the gas.\" He was quiet a second, which he was not, usually. \"You did it right. It still cost you. Both things. Don't let anybody talk you out of either one. Yolanda's got the first one covered, so you hold onto the second, because there's going to be a Sunday in March when you think the email was the mistake, and it wasn't. The mistake was April.\"<\/p><p>\"I know.\"<\/p><p>\"You know it today. I'm saying it for March.\"<\/p><hr class=\"break\"><p>Monday the fifteenth, at 9:05, an agent named Kelsey at a company whose name was two words and a shield walked him through a form he could have done on the website and had not, because Lena had said, \"Talk to a person. They remember a person.\"<\/p><p>Two-factor on the hosting company, yes. Backups, nightly, tested when, and he said a date and she typed it. The payments company holds the cards, yes. An employee, one, part-time. Revenue, and he said it. Then the question that was on every form and had never once had a yes on it.<\/p><p>\"Any security incidents in the past thirty-six months? Unauthorized access, data exposure, anything reported to customers?\"<\/p><p>\"Yes. Last Monday.\"<\/p><p>She stopped typing. \"Can you describe it?\"<\/p><p>He described it. The page, the five things on it, the sixty-one, the forty, the fix at 2:10, the email at eight, the eleven hundred families. She typed while he talked and did not say anything until he was done.<\/p><p>\"Is it resolved?\"<\/p><p>\"Yes.\"<\/p><p>\"Okay.\" More typing. \"With what you've told me, it's fifty-eight a month for the year, and I'll be honest with you, the same form in November would have been forty-one. It's the incident, and it's that you told them; the second part helps you, the first part doesn't. Do you want it?\"<\/p><p>\"Yes.\"<\/p><p>\"It starts at midnight tonight. It doesn't cover last Monday. Nothing covers last Monday.\"<\/p><p>\"I know.\"<\/p><p>Rosa texted at 10:20, while he was still on with Kelsey. <em>They're on the roof. Four of them. Weathered Wood. It's brown.<\/em><\/p><p>Tuesday he wrote to Farah, because she would know a name, and she wrote back in nine minutes. <em>Wes Tanaka. Did mine in March; found two things I'd have sworn weren't there. Four days, a report, one call. About twenty-four hundred. Tell him I sent you. Also: sometime is still on my list.<\/em> Wes had the third week of January and took it, and Nate put <em>$2,400, Jan 20–23<\/em> on the pad in his own hand, and did not think about what the same four days would have cost in the spring of 2024, because Kelsey had already said it.<\/p><hr class=\"break\"><p>The count went by threes and twos after the first week. Tuesday the ninth had been twelve; the Friday after, seven; by the twentieth, seventy, and the word <em>refund<\/em> from thirty-eight of them, and six hundred and some dollars back out through the page. Theresa Molina in Fresno did not cancel. The Walnut Creek teacher did, and came back on the eighteenth with no note, and he did not write to ask.<\/p><hr class=\"break\"><p>Saturday the twentieth Claire took Lucy to Persimmon Lane for Yolanda's last Saturday, and he drove to Gilroy alone at eight, because his mother had asked him to be there when Gil finished, and because she had said, \"And get the Christmas box down. It's next to your father's.\"<\/p><p>The street was loud with it. Four men on the roof and a dumpster in the driveway where the CR-V went, so he parked at the curb. The hall slope was done, brown, and the back slope was half done, and the tarp that had done two winters was folded on the lawn with bricks on it. Gil, from the ridge, said, \"Two hours, Mrs. Aguilar,\" and Rosa, on the porch with her coffee, said, \"You said that at eight,\" and Gil said, \"It was true at eight.\"<\/p><p>The garage was cold and smelled of the lawn mower. The bucket was by the door, dry. The boxes were on the shelf over the workbench where they had been in September of 2023 and every visit since, in his mother's printing: AGUILAR LANDSCAPING 2010–13, 2014–17, HOUSE, TAXES, and beside them, newer, NAVIDAD.<\/p><p>He took NAVIDAD down and set it on the workbench. Then he took down 2014–17.<\/p><p>Payroll. Six men in 2016, then four, then two. The invoices, pink and yellow. The one under the payroll folder, three pages stapled, no PAID, red across the top: 2ND NOTICE. <em>Coyote Ridge Business Park, Phase II. Balance due: $38,000.00.<\/em> And under it, folded in thirds, the sheet of lined estimate paper with the start of an address on the outside fold. <em>Coyote Ridge Business Park, attn: Mr. Garvey.<\/em> His father's hand. He had stood here two years and three months ago with a roofer's number on his palm and had not unfolded it.<\/p><p>He unfolded it.<\/p><p class=\"note\"><em>Dear Mr. Garvey,<\/em><\/p><p class=\"note\"><em>I am writing about the balance on Phase II, $38,000, which was due March 15 at the end of the ninety days. The trees took. You can see them from the frontage road. I paid my men for that work out of the line at the bank and I am paying the interest on it now. I don't like to write a letter like this and I have never had to. I know you're good for it. If there is something wrong with the work, tell me and I will come look at it myself. If there is nothing wrong with it I would appreciate a check by the end of the month so I can pay the bank.<\/em><\/p><p class=\"note\"><em>Ramón Aguilar<\/em><\/p><p class=\"note\"><em>Aguilar Landscaping<\/em><\/p><p>It was finished. That was the thing. Not a draft that stopped: written in one pass without a crossing-out, in the blue pen that lived in the drawer with the stamp, signed on both lines, folded, addressed on the outside. It had needed an envelope and a stamp and a mailbox, and it had gotten this box, under a second notice, for nine years.<\/p><p><em>I know you're good for it.<\/em> Nate read that line four times. It was the sentence his father had said to a man who was not, and it was the sentence Nate had said, in other words, to a fruit bowl.<\/p><p>He took the phone out and photographed it, the whole page, flat on the workbench under the bare bulb, and then the outside fold, and then the invoice, and put the phone in his pocket. He folded the letter in thirds along its own creases and put it under the invoice and the invoice on the payroll folder and the lid on the box and the box on the shelf.<\/p><p>His father had written it and put it here. He had written his at three in the morning in four versions and sent it to a thousand and sixty people at eight. Seventy of them had left, and a woman in Fresno had shouted for four minutes, and he would send it again. That was the difference, and he put it in pencil, because of the fruit bowl.<\/p><p>\"Did you find it?\" Rosa, in the doorway, with the coffee.<\/p><p>\"Found it.\"<\/p><p>He picked up NAVIDAD and carried it past her into the house, and she looked at the shelf, once, where the box was where it had always been, and did not say anything, and neither did he.<\/p><p>Gil finished at 12:40. The back slope was brown, the vent had a new collar, and the flashing was silver and would not be by spring. Rosa stood in the yard with her arms folded and looked up at it for a long time.<\/p><p>\"Well,\" she said. \"It's a roof.\"<\/p><p>Lucy, on the phone at four from Quince Court, said Yolanda had given everybody a juice box and said don't get used to it, and that Tuesday was hers now, four-thirty, and the Lindqvist boy had said good luck, which was weird.<\/p><hr class=\"break\"><p>Sunday the twenty-first, the pad. Claire wrote December light, because it was not closed. <em>~985 / ~$8,370.<\/em> Under it, in his words: seventy-two out since the ninth, six hundred and twenty back, eight in. Insurance, fifty-eight, in pen, because it had started. Wes, twenty-four hundred, January. Marisol's line. Rosa's roof, done, no number, because it was not theirs.<\/p><p>\"That's the meeting,\" Claire said, and then did not put the pad on the microwave. \"How many by Christmas?\"<\/p><p>\"Seventy-five. Eighty.\"<\/p><p>\"And then?\"<\/p><p>\"And then it's January and they've forgotten, or they haven't.\"<\/p><p>She wrote nothing for that. She put the pad on the microwave.<\/p><hr class=\"break\"><p>Monday the twenty-second, at 8:48 in the evening, with Lucy down and the dishes done and Claire in the bath with the wavy detective, his phone lit on the counter.<\/p><p>An email. Devin. The subject line was one word, <em>Fermata,<\/em> which Devin had never once typed with a capital letter.<\/p><p>He opened it standing at the sink. It was longer than anything Devin had ever sent him. It had paragraphs. He read the first sentence and stopped there, because it was the sentence, and the rest was going to be the rest.<\/p><p class=\"note\"><em>I think we need to formalize my share.<\/em><\/p>", "words": 2001}, {"num": 48, "title": "Toledo", "part": 4, "meta": "December 20–22, 2025 · Toledo, Ohio", "html": "<p>The six o'clock nebulizer took eleven minutes if Pop didn't talk through it, and he always talked through it.<\/p><p>\"Snowing.\"<\/p><p>\"I see it.\"<\/p><p>\"Do the walk before it packs. Not the blue salt. The blue salt eats the concrete.\"<\/p><p>\"I know which salt.\"<\/p><p>Stan Kowalczyk sat in the recliner with the mouthpiece in his teeth and the little machine rattling on the TV tray, breathing the fog in and out, and the oxygen concentrator hummed on the other side of the chair like something the house had always had, which it had not. On the television the Buckeyes were playing a game from November with the sound off, because the concentrator was louder than any announcer, and Pop said he knew how it ended anyway.<\/p><p>Devin salted the walk. The street was ranches, one story, the same house eleven times with the garage on the left or the right, and the snow was coming down on all of them in the dark. He had left it at twenty-three with two suitcases and a job in a city that didn't have snow, and come back at thirty-five with the same two suitcases and a cap. He was thirty-six now. It was still the same street.<\/p><hr class=\"break\"><p>At the card table in the dining room, with the laptop and the coffee, he opened the thread again.<\/p><p>It was on the forum he'd read on the N-Judah for eleven years, and it had gone up in October when Rondo announced, and it was still open on his phone because closing it felt like a decision. Grant Halloran's notice was linked at the top. Six thousand teachers. Two companies named where they could go, one at nineteen dollars and one at nine, and the nine was Nate's.<\/p><p>A hundred and eighty comments, mostly about the fee. Then one from a piano teacher who had wandered in, who said she'd moved to the nine-dollar one, that it was one guy in California who had done seventy migration calls himself, and that according to the teachers' group he'd passed a thousand paying studios the Monday before Thanksgiving.<\/p><p>A thousand at nine was nine thousand a month, and some paid the year at seventy-nine, so call it eight and a half. In July, on a bench at Mountain View, Nate had said <em>thirty-one eighty,<\/em> and Devin had said <em>real money,<\/em> and had meant it, and had gotten on the train.<\/p><p>He had sent a hundred and forty applications since January. He had had four screens. He had had zero offers. He had said the numbers once, to Pop, in September, and Pop had said, \"Well,\" and had not asked again, and that had been enough.<\/p><hr class=\"break\"><p>He had not planned to look at the code. He had planned to look at the site, the way you look at a house you used to live in, from the sidewalk.<\/p><p>There was a new post on the front, from the ninth. <em>Cancellation links could be read by strangers. Here's what happened.<\/em> The short links, the ones with the number on the end. He had built forty screens around those links; the number had been in his own code, and he had never once thought about what it was. Sixty-one. Fifty-eight families. Nate had put all of it on a page with his name at the bottom and sent it to a thousand people at eight in the morning, and Devin read it and thought, honestly, that it was the best thing Nate had ever written, and then thought about the thousand.<\/p><p>Then he went to the sample page, the one that showed teachers what their families would see, and did the thing he'd done to every website since he was nineteen. He opened the source.<\/p><p>His prefix was still there. <em>dk-.<\/em> He had put it on everything in October of 2024 so his stuff and Nate's wouldn't collide. The week strip across the top, seven days with the lesson lit: his. The little pill with the number of credits in it: his, down to the corner radius. The list of open slots and the way it folded up on a phone: his. And the toast at the bottom, <em>Canceled. Credit added,<\/em> which had been his, and which somebody had gone into and rewritten half of, and left his name on the half they hadn't.<\/p><p>Three. Maybe four. Out of forty screens. On a page a thousand studios' worth of parents opened every Monday. In his blue.<\/p><p>Pop coughed in the next room, the long one, and then said, \"I'm fine,\" to nobody.<\/p><hr class=\"break\"><p>He could put himself on the cobbles. August 17, 2024. The creek behind the library with no water in it, the freeway going by behind the trees. Nate had said twenty-six paying, and Devin had said, <em>That's a real number, Nate,<\/em> and then made the pitch, the home-screen thing with the bell, on the side, nights. Nate had made the face. And then Nate had said, \"Okay,\" and Devin had said, \"Okay yes?\" and Nate had said, \"Okay yes,\" and had put his hand in his pocket for one of the cards and not had one, and had said it.<\/p><p>\"If this ever makes money, I'll cut you in.\"<\/p><p>\"Deal.\"<\/p><p>They had shaken on it, on the dry creek bed, standing on the cobbles. He remembered it exactly, because he had told it to Pop on the phone in October with NOV 16 circled on the whiteboard behind him, and Pop had said, \"What's your cut,\" and he had said, \"We shook on it,\" and Pop had said, \"Shook,\" in the voice he used for a word he'd have to look up.<\/p><p>And a year ago today. Orchard Coffee, the window table, the woman stacking chairs. Two index cards. <em>You're cutting my app?<\/em> And he had asked it in the plainest words he owned: <em>So what was it for. The handshake. What's my cut of, exactly.<\/em><\/p><p class=\"note\"><em>I don't know yet.<\/em><\/p><p>A year. Nate had known enough since to build a page a stranger couldn't count up from, and to hire a woman in Fresno, and to do seventy calls. He had not, in twelve months, known that.<\/p><p>And July. The platform, the cap in his hand. <em>Don't forget me when you're rich.<\/em> A joke, and he had meant it, both, and Nate had said <em>I'm not going to be rich,<\/em> and Devin had said <em>then don't forget me when you're not,<\/em> and gotten on. He would have taken <em>not.<\/em> He would have taken a text.<\/p><p>He had gotten <em>Good<\/em> and <em>I'm glad.<\/em><\/p><hr class=\"break\"><p>Sunday he called Brian Szabo, who had lived down the hall from him at Ohio State and was a lawyer in Columbus now with his name third on a door, and who said, \"Kowalczyk. Christmas call or lawyer call?\"<\/p><p>\"Just to see.\"<\/p><p>\"Okay. Just to see. Was anything written down?\"<\/p><p>\"No.\"<\/p><p>\"Texts. Emails.\"<\/p><p>\"Some. Not about that.\"<\/p><p>\"Did he ever say a number? A percent. Anything.\"<\/p><p>\"He said he'd cut me in.\"<\/p><p>\"That's not a number. What's it doing now?\"<\/p><p>\"A thousand studios. Nine a month each.\"<\/p><p>A pause with a kid in it, somewhere in Columbus.<\/p><p>\"Devin. That's a hundred thousand dollars a year, off a handshake, with your code still in it.\" Another pause. \"Don't send him a number. Send him that you want it in writing. Short. Send me the texts and the whiteboard pictures, and don't post anywhere. I'm not your lawyer. I'm a guy you went to school with, until you say otherwise.\"<\/p><p>\"I'm not saying otherwise.\"<\/p><p>\"Merry Christmas, then.\"<\/p><hr class=\"break\"><p>The six o'clock nebulizer, Sunday. Pop took the mouthpiece out at the end and held it, which was how you knew he'd been thinking through it.<\/p><p>\"Your friend. The piano thing.\"<\/p><p>\"Yeah.\"<\/p><p>\"Did he pay you?\"<\/p><p>\"It wasn't like that.\"<\/p><p>\"Then what was it like?\"<\/p><p>Devin looked at the television, where the Buckeyes were winning the same game again.<\/p><p>\"It was a thing I did on the side. For a guy. He said if it ever made money he'd cut me in. It didn't. Then he took my part out. Then it made money.\"<\/p><p>\"And you shook.\"<\/p><p>\"We shook.\"<\/p><p>Pop breathed for a while.<\/p><p>\"Thirty-one years at that plant, and every dime was on a piece of paper somebody had fought about. That's all a union is. A piece of paper.\" He put the mouthpiece on the tray. \"You told me once his old man got stiffed on a job and sent the bill again and called it a day.\"<\/p><p>\"Yeah.\"<\/p><p>\"So that's who you shook with.\" He picked up the remote and did not turn the sound up. \"You're going to do it anyway.\"<\/p><p>\"Yeah.\"<\/p><p>\"He's having a bad month, you said.\"<\/p><p>\"Yeah.\"<\/p><p>\"Well,\" Pop said, and that was the whole conversation, again.<\/p><hr class=\"break\"><p>Monday he wrote it at nine in the evening, at the card table, with Pop asleep in the recliner and the tubing rising and falling on his chest.<\/p><p>It was nine hundred words when he stopped. It had the creek bed in it, and the whiteboard, and the seven Saturdays, and the six percent, and the hours, which he had worked out once on the train at Halyard's rate and never said out loud. It had the word <em>partner<\/em> in it twice. It had a paragraph about Pop that he read back and felt his face go hot in an empty room.<\/p><p>He deleted all of it. Not to a drafts folder. Gone.<\/p><p>He sat until 11:20 with the cursor in an empty box. The shame was the thing. Not the asking; the asking was arithmetic, and the arithmetic was right. It was that he was asking a man who did not ask. He had watched Nate fail to say one sentence at a window table and had felt sorry for him. He was going to make him say it now, with a lawyer in the room if that was what it took.<\/p><p>He typed it again, short, and did not fix anything.<\/p><p class=\"note\"><em>I think we need to formalize my share.<\/em><\/p><p class=\"note\"><em>I built the parent app on a handshake in August of last year. Forty screens, every Saturday and most nights, October to November. You cut it in February. Some of it is still in the portal; I looked. You said if it ever made money you'd cut me in, and it makes money now. I'm not guessing. It's in the Rondo thread.<\/em><\/p><p class=\"note\"><em>I'm not naming a number tonight. I want it in writing, what my part is, an
