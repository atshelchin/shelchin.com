and that's the shape of your year now, and you can stop being surprised by it.\"<\/p><p>\"And a distribution.\"<\/p><p>\"When a month ends with more in the account than it started with, after her and you and Columbus, you can take one, and it's taxed as what it is, which is yours, with no Social Security on it, which is the whole reason we did this. That month isn't March. Ask me in June.\"<\/p><p>\"And the salary. Claire asked whether it could be seven.\"<\/p><p>\"Claire can ask me herself; I'd like that. No. Not while three thousand a month walks out of your house into the company so the company can pay Ohio. Raise it and you're paying yourself with your own savings and paying tax on the trip.\" She tore off the strip of tape and clipped it to the folder. \"August, when the last installment's gone and the annual people have paid, we'll look. Now the fifteenth.\"<\/p><p>\"It's on the calendar.\"<\/p><p>\"It's on the calendar, and the vouchers are in this folder, and you're going to pay them a week early, because I've had you in that chair two years and never once had you pay a thing when it was due that wasn't also a confession. The corporation's eight hundred goes to Sacramento with it. Same eight hundred. Different name on the check. And the card company finally has the company's name on the account instead of yours, which took you two years and one form, so the statements stop saying <em>Dear Nathaniel.<\/em>\"<\/p><p>He took the vouchers. The federal one was smaller than September's had been; most of what he owed came out of the stub now, before he saw it.<\/p><p>\"Who has the payroll login if you're in a ditch?\"<\/p><p>\"Claire. Since Tuesday. And you.\"<\/p><p>\"Write that down where she can find it.\"<\/p><p>\"I did.\"<\/p><p>Lena looked at him over the folder for a second longer than the sentence needed.<\/p><p>\"Rosa's retiring,\" he said. \"June.\"<\/p><p>\"That's not a tax question.\"<\/p><p>\"No.\"<\/p><p>\"Then tell her congratulations from me, and that the pension's taxable.\" She closed the folder. \"Congratulations. You're boring now. It's the nicest thing I say, and I don't say it to many people in that chair, and most of them are dentists.\"<\/p><hr class=\"break\"><p>He called his mother that night, because it was Wednesday.<\/p><p>\"The letter came Monday,\" she said. \"From the pension people. June twelfth. A Friday. I put in my papers in January like I said, and the copier still doesn't know.\"<\/p><p>\"Friday the twelfth.\"<\/p><p>\"Carmen wants a party. The thirteenth, at the house. You'll come, and you'll bring the girl and Claire, and you'll leave the phone in the car.\" A pause with the radio in it. \"Twenty-five years. They gave me a date on a letter and I'm looking at it like it's somebody else's.\"<\/p><p>\"It's yours.\"<\/p><p>\"Ay, Nate. I know whose it is.\" Then, because she had said enough about herself for one call: \"How's the girl.\"<\/p><p>\"Reading a horse book at me. I had a cold.\"<\/p><p>\"You stayed home?\"<\/p><p>\"I stayed in bed.\"<\/p><p>\"Well,\" his mother said, in the voice she used for a thing she had waited a long time to hear and was not going to make a fuss over. \"Good.\"<\/p><p>\"Lena says congratulations. And that the pension's taxable.\"<\/p><p>\"Tell Lena I've been reading a pay stub since 1980.\"<\/p><hr class=\"break\"><p>He paid both vouchers Thursday morning at the kitchen table, six days early, with Claire watching, and she drew the line under them.<\/p><p>The email came that night at 10:12, subject line lowercase, the way Farah wrote everything.<\/p><p class=\"note\"><em>Nate. You said \"sometime.\" It's sometime. Tuesday the 14th, Castro Street, 7:00. Twelve minutes, not twenty; I've heard you talk. Then questions till they run out. Say the numbers. Say December. Say the part where you didn't have it. F.<\/em><\/p><p>He carried the phone down the hall. Claire was up, with the red pen and somebody's forty pages. She read it and handed it back and said, \"Twelve minutes,\" and went back to the pages, and he stood in the doorway a second longer than he needed to. Then he went back to the kitchen, found a card in the takeout drawer, wrote six words on it, and turned off the light.<\/p>", "words": 1750}, {"num": 57, "title": "Peninsula, Again", "part": 5, "meta": "Tuesday, April 14, 2026 · Castro Street, Mountain View", "html": "<p>Farah did the room first, the way she always had, one sentence each and no exceptions, and there were thirty people in it, and she got to him last.<\/p><p>\"Nate. One sentence, and then twelve minutes, because a year ago he said 'maybe' in this room and I told him that was a yes with a coat on. He took the coat off by email last Thursday, which is the only way he takes anything off.\"<\/p><p>\"Cancellations and credits for music teachers. Eleven hundred forty paying. Ten thousand fifty a month.\"<\/p><p>She wrote <em>10,050<\/em> on the whiteboard under twenty-nine other numbers, most of them smaller, two of them larger, and said, \"Go.\"<\/p><p>He had no slides. He had a card in his shirt pocket with six words on it, and he did not take it out. Claire had said at the door, with Lucy behind her, \"Say the numbers,\" which was what Farah had said, and he had said okay, and Claire had said, \"Not that one,\" and Lucy had asked which number, and neither of them had answered her.<\/p><hr class=\"break\"><p>He said the whiteboard first. A garage on Persimmon Lane, a Saturday in August of 2023, a sheet in a page protector that said one makeup a semester, and beside it a board with nine names and a question mark. The sheet was what she wanted. The board was what she did. He had spent the next four months building for the sheet.<\/p><p>Woodshed. Ninety-nine dollars, four months of nights, forty-one downloads the first week, and on the fourteenth of February three people using it, one of them his daughter, who was six. \"I asked eight teachers whether their students would practice more with an app. Five said yes. I wrote down the answer I wanted and underlined it twice. The sentence I needed was on the same card and I didn't underline it, because it wasn't an answer to my question. It was a complaint about texting parents at ten at night.\"<\/p><p>He said the corner chair. Three evenings in February of 2024, no laptop, a folding chair against a wall, counting what she did between four and seven-thirty. The whole product, he said, was one sentence from October that he had not underlined, and it had cost him Halloween to find it.<\/p><p>He said the handshake. A dry creek bed behind the library, a friend from work, nine words, nothing written. He said eighteen thousand dollars over six months, the third of six paid on the sixth, to a lawyer's account in Columbus, Ohio, and that the nine words had been the most expensive sentence he had ever said, and that the friend had built a good thing and nobody had installed it and that was not the friend's fault. Somebody in the second row counted the words on their fingers.<\/p><p>He said December. A link with a number on the end, from April of 2024. A note to himself, lost. Seventy-four teachers gone in two weeks, six hundred twenty dollars back to cards, a woman in Fresno who shouted at him for four minutes and stayed. \"I told everybody at eight the next morning. The lawyer said I didn't have to. That's the only part of that month I'd do the same way.\"<\/p><p>He said Marisol. Twenty-eight dollars an hour, a W-2, twenty hours a week from a kitchen in Fresno, \"because the state says so and because Lena says so, in that order.\" Every reply she sent began with the teacher's name. The day she started was the day the company stopped being a man.<\/p><p>He said the five-hundred-dollar rule. Nothing over five hundred without the other one, before, not after, initialed by both of them on a legal pad, and the room laughed, and he said, \"I'm not telling you that as a joke,\" and the room stopped. He said it had cost eight thousand dollars and a quiet week to learn, and that he would tell them the rest if they asked, and hoped they wouldn't.<\/p><p>He said okay. That he had said it for six years to mean he was not going to argue. To his wife, about a landlord and a dryer. To a manager. To a friend on a creek bed. That most of what he had paid for in three years, he had paid for with that word.<\/p><p>Farah held up her phone at eleven minutes. He said the last thing, which was the number on the whiteboard, and that fourteen dollars of it was a price and nine dollars of it had been an apology, and that a friend had had to tell him which was which, and sat down.<\/p><p>The card said <em>whiteboard, Woodshed, handshake, December, Marisol, okay,<\/em> and he had said them in that order without it, and nobody in the room had done the face, because he had not asked them to.<\/p><hr class=\"break\"><p>\"You got lucky with Rondo.\"<\/p><p>The browser-extension man, end of the second row, arms folded, not unkindly.<\/p><p>\"Yes.\"<\/p><p>He let it stand by itself for a second, which he had learned to do at a kitchen table.<\/p><p>\"Two hundred teachers in a week in October. The importer took four days, and it took four days because the thing it imported into had been running for a year and a half and already had two years of somebody's mistakes in it. If Grant had run out of money in 2024 I'd have gotten forty of them and lost half by Christmas. It was luck. It landed on something that was standing up.\"<\/p><p>\"How much of it was luck?\"<\/p><p>\"I've tried to do that arithmetic and it doesn't come out. Call it half. Don't quote me.\"<\/p><p>\"You'd take the luck again.\"<\/p><p>\"I'd take it again. I'd also have the note about the tokens somewhere other than under a stack of mail.\"<\/p><p>A woman by the window. She had been there a year ago and had said <em>that's a failure, though<\/em> about Jonah and had meant it kindly, and she was twenty-six now and said so, as if it were a credential.<\/p><p>\"I'm twenty-six. I've got three ideas. How do I start?\"<\/p><p>\"Don't build any of them.\"<\/p><p>She waited for the rest.<\/p><p>\"Find somebody who does a job with a whiteboard in it. Ask if you can sit in the chair for three evenings and count. Not interview. Count. If you build something in the first month, you'll build it for the sheet on the wall, because the sheet's easier to read.\"<\/p><p>\"Whose whiteboard?\"<\/p><p>\"Anybody's. A piano teacher. A vet. A guy with a tire shop. My father ran a landscaping crew out of a truck for twenty-three years and had one on the dashboard, in grease pencil, and I never once read it, and I was on the crew.\"<\/p><p>\"That's it?\"<\/p><p>\"That's the part I skipped. It cost me four months and a Halloween. That's it.\"<\/p><p>Somebody asked what the software was written in and he said it did not matter and told them anyway, in one sentence.<\/p><p>\"Would you sell?\"<\/p><p>\"I was asked. In February. It was a real number and I said no, in four sentences, and my wife let the proud one stand.\"<\/p><p>\"How much?\"<\/p><p>\"That one isn't mine to say in a room. More than the board. Enough that I did the column twice.\" He looked at the whiteboard. \"I said no because the thing I'd have been selling was the part of me that learned to say a number out loud, and I'd only just gotten it, and it wasn't theirs.\" Somebody asked about the price, and Jonah said from the back, before Nate could, \"He charges fourteen. Write that down, Farah. One for me,\" and Farah said, \"One in six years.\" Jonah said, \"I'll take it,\" with his arms folded and a dental plan, and looked like a man who had come to hear a thing said in a room he used to say things in, and was content to hear it.<\/p><p>\"Last one,\" Farah said at 7:55.<\/p><p>A man near the door, thirtyish, in a jacket he had not taken off. \"What do you do when it's Monday at 7 a.m. and it's down?\"<\/p><p>\"Fix it. Then write down what happened, all of it, by nine, and put it where they can see it. The teachers will forgive forty minutes. They won't forgive not being told.\"<\/p><p>\"That's what you did?\"<\/p><p>\"The second time. The first time I found out from a stranger's email two weeks later. Ask me about the time in between and I'll tell you it was the worst month I've had, and I've had a December.\"<\/p><p>\"That's thirty,\" Farah said. \"Twelve and thirty. He's the only one who's ever come in under, and I'd like the room to notice.\"<\/p><hr class=\"break\"><p>Afterward it was chairs. Thirty people stacking thirty chairs against the glass, with the platform lit outside and a train sitting at it with its doors open and no one getting on. Farah at the door with her keys, saying goodnight by name.<\/p><p>He had two chairs in his hands when the man in the jacket stopped beside him.<\/p><p>\"That was good. The part about the word.\" He put his hands in his pockets. \"Ravi Menon. I was on the front-end platform team at Halyard till '23. Devin Kowalczyk was down the hall. We still talk, mostly about the Mud Hens. Priya Venkataraman's still there, far as I know. Nobody else from that floor is.\" He said it easily, a man who did not know what he was carrying. \"Farah puts the lineup on the list and he still reads the list, and he saw your name.\" He looked at the chairs, and back. \"He said to tell you Devin says hi.\"<\/p><p>Nate stood with a chair in each hand and did not know what that meant, and the man did not seem to know either, and had already turned to find his coat.<\/p>", "words": 1660}, {"num": 58, "title": "Andre", "part": 5, "meta": "Saturday, May 16, 2026 · The Alder Creek Community Center", "html": "<p>The program was one folded sheet, printed at the library, with two columns on it this year, and Lucy had found herself in the left one before they were through the door.<\/p><p>\"Fourteenth. <em>Lucy Aguilar. Sonatina in C, Op. 36, No. 1, first movement, Clementi.<\/em> The comma's in the right place.\"<\/p><p>\"Good.\"<\/p><p>\"There's fifty. Twenty and thirty.\" She had counted in the car. \"Ana's are in the other column. Cody's in Ana's now.\"<\/p><p>The gym was what it had been a year ago: the city's black baby grand on the stage, a hundred folding chairs on the floor, grandparents on the bleachers, the cookie table by the door with a sheet cake on it this time, under plastic, that Trish Nguyen had ordered and would not say from where. Rosa had driven up from Gilroy and taken a chair on the aisle, five rows back, in the blouse she wore for things at the school, and was reading both columns as if there were going to be a test.<\/p><p>\"Four weeks,\" she said, when he sat down beside her. \"Friday the twelfth. Don't make a face. Carmen's making all of them.\"<\/p><p>In the second row, on the end, was a man in his thirties in a gray quarter-zip, with Yolanda's forehead and his hands folded on his knee, watching the stage where nobody was yet.<\/p><hr class=\"break\"><p>At 10:00 Yolanda came up the side steps in the black she wore for recitals, with the brace on her right hand in daylight, and walked to the piano, and stopped.<\/p><p>The fallboard was down. The city's brass lock, the custodian's key in it. She put her right thumb and finger on the key, and it did not turn. Arjun Patel, twelve now and in Ana's column, was half out of the front row before she said, \"Sit, Arjun,\" in her ordinary voice. She moved the key to her left hand, which was the better one, and turned it, and lifted the fallboard.<\/p><p>\"It sticks,\" Arjun said, from his chair.<\/p><p>\"It does,\" she said, and turned to the room, and began.<\/p><hr class=\"break\"><p>Lucy went up fourteenth in the horse dress, which was short on her now, and put her feet on the bar, and looked at the keys for the length of time she looked at them, and played.<\/p><p>He knew the piece; it had come through the bedroom wall four hundred times since January, and he knew where the trouble lived, which was the left hand in the second half, where it had to walk down under the tune and had never once walked down cleanly in the duplex. It walked down. She got through it, and the tune came back on top as it was supposed to. In the last line, with nothing left to go wrong, her right hand went to a G that should have been an A, and there was a small wrong sound in a gym with a hundred people in it. She finished, and stood, and looked for them.<\/p><p>Rosa had his arm.<\/p><p>\"She didn't stop,\" Rosa said.<\/p><p>\"No.\"<\/p><p>\"Your father stopped. Every time. He'd sing the wrong word with the radio and go back to the top of the song.\" She let go of his arm. \"Ay. Look at her. She's looking at you.\"<\/p><p>He was already looking. Claire, on his other side, had the program folded in both hands and had not touched him since the second line. She said, without turning her head, \"That was the G,\" and he said, \"That was the G,\" and Lucy came down the side steps with a certificate and her tongue between her teeth.<\/p><hr class=\"break\"><p>Before the second column Yolanda stood at the foot of the stage and said one thing, to the room, with Ana behind her on the steps.<\/p><p>\"This is Ana Solis. Her students are the second column. Twelve of them were mine in March and are hers now, and you'll see the difference, which is that she's thirty years younger and can get down on the floor.\" She did not turn around. \"I've heard all thirty. She's a better teacher than I was at twenty-nine, and I was good.\"<\/p><p>Ana looked at the floor of the stage and did not say sorry, which he counted.<\/p><hr class=\"break\"><p>Ana came up the side steps in a cardigan in May and stood by the piano with her hands together and said each child's name and the piece, thirty times, no more than that, in a voice that carried better than she would have believed if anyone had told her. Cody Nguyen, twelve, played a march too fast and bowed too long. Arjun Patel played a Chopin waltz with his eyes closed for the middle section, and opened them for the end, and got it. Nobody stopped. One girl of seven played the same four bars twice, on purpose, because she had liked them, and Ana, from the stairs, said, \"That's allowed,\" and the gym laughed, and Nate did not, because he had heard the sentence before, in August, at a folding table, going the other way.<\/p><p>Yolanda sat in the front row through all thirty with her braced hand in her lap and did not once look at Ana, because looking at her would have been a thing Ana could feel, and she watched the children instead, all of them, the twelve she had picked and the eighteen she had never met.<\/p><hr class=\"break\"><p>At 11:50 Yolanda stood up at the front, and the gym did what it did for her, which was stop.<\/p><p>\"Thank you for coming. Some of you have been coming since 1996 and I have the programs to prove it.\" She waited for that to settle. \"This is the last one of these with my name on the whole sheet. From September I have twenty students, Mondays and Wednesdays, and that's the studio, and it isn't getting bigger. Tuesdays and Thursdays I'll be in this building, in the room behind that wall, teaching the city's program to children whose parents don't have a garage teacher, for a wage, with a pay stub, which I have never once had in my life and am told is a thing people like.\" A laugh from the bleachers. \"Ana's fall times are on Ana's page. Mine are on mine. I'm not going to text anyone about it.\"<\/p><p>Nobody took a phone out until she had sat down, and then everyone did, and he let them.<\/p><p>Andre Beck did not take his out. He sat in the second row with his hands on his knee and watched his mother sit down, and kept watching her after she had. Nate understood that he had driven two and a half hours to see this and not the children, and had gotten it.<\/p><hr class=\"break\"><p>The cake said <em>32 YEARS<\/em> in blue, and Yolanda cut it with her left hand and let Trish Nguyen serve it, which was its own sentence.<\/p><p>Andre found him at the cake table with a plate he was not eating from.<\/p><p>\"You're Nathaniel.\" The careful voice, the work one. \"She's called you that on the phone for two years. I assumed you were sixty. She told me about your thing in 2024 and called it a link, and I thought she meant an app and didn't know the word. I looked at it last night on her page, in the car, before I came in. It's a link.\" He looked across the gym at his mother, who was being thanked by a grandfather and enduring it. \"She raised her rate on it. Six dollars. She'd never once raised it in my life, and she did it in a chair at seven in the morning without telling me, and told me on her birthday like it was weather.\" He put the plate down. \"Thank you. I'm not going to say that twice.\"<\/p><p>\"You don't have to.\"<\/p><p>\"I know. That's why I said it once.\"<\/p><p>By 12:30 the gym was mostly chairs. Claire and Lucy and Andre were stacking them against the wall, Lucy directing, and Rosa was at the cookie table telling Ana Solis something about a copier that Ana was receiving as advice. Yolanda sat down on one of the last two folding chairs at the front, and Nate took the other, because that was where it was.<\/p><p>\"Twelve went and two quit,\" she said. \"I know the two by heart. I'll know them in ten years, in the store, and they won't know me.\" She looked at her hands. \"That's the whole cost. I'd like it written down somewhere that it wasn't nothing.\"<\/p><p>\"It's written down.\"<\/p><p>\"Good.\" She lifted her chin at the wall, where Andre had a stack of six chairs and Lucy was telling him it was too many. \"You met him.\"<\/p><p>\"At the cake.\"<\/p><p>\"He works for the Franchise Tax Board. I'd keep the salary to yourself. He's very nice about it and he can't help what he is.\" She watched her son carry the chairs. \"He wanted me to sell the house in 2024. He drove down last night to see me not sell it, and he'll say nothing about it, and drive back, and that's what I raised.\"<\/p><p>Lucy came over with a paper plate she had been sent with, and Yolanda took it and looked at the cake and did not eat it, and Lucy went back to the chairs.<\/p><p>\"So,\" Yolanda said. \"It pays you now.\"<\/p><p>\"A salary. Lena says that makes me an employee.\"<\/p><p>\"Of whom?\"<\/p><p>\"Of me.\"<\/p><p>She looked at him the way she had looked at him at the door of the garage on a Saturday in August with her hand against her hip.<\/p><p>\"Is that a business or a job, Nathaniel?\"<\/p><p>He thought about it, because she had asked it the first time and he had answered in one word and it had been the right word then.<\/p><p>\"Both.\"<\/p><p>\"Then you'll be at work at four-thirty, and the practicing will fall on your wife,\" she said, \"and you should know that going in,\" and ate the cake.<\/p><hr class=\"break\"><p>Four days later, Wednesday, at 6:10 in the morning, with the coffee not made yet, a message from Devin, four words and a period.<\/p><p class=\"note\"><em>My dad died Tuesday.<\/em><\/p>", "words": 1710}, {"num": 59, "title": "Ohio", "part": 5, "meta": "May 20–21, 2026 · Quince Court", "html": "<p>He read it standing up, with the kettle not on yet, and then he sat down and read it again, and it was still four words.<\/p><p>He did not type anything. Last year he had typed <em>Good<\/em> and <em>I'm glad<\/em> to a man who had wanted a sentence, and in December nothing at all, and had learned what that cost in a conference room with a parking lot in the window, and he was not going to learn it twice. He turned the phone face down on the table and made the coffee, and when Claire came out at 6:30 with her hair wet he turned it back over and showed her, before, which was the order now.<\/p><p>She read it once.<\/p><p>\"Tuesday.\"<\/p><p>\"Yesterday.\"<\/p><p>\"Are you going to write back?\"<\/p><p>\"No.\" He heard how that sounded and gave her the rest. \"I'm going to call him. Not at nine in the morning his time with a funeral home on the other line. Today.\"<\/p><p>\"Today is a thing you say.\"<\/p><p>\"Eight. After you go.\"<\/p><p>She looked at him for as long as it took her to decide he meant it, and put the toast in, and went to wake Lucy.<\/p><hr class=\"break\"><p>He called at 8:05 from the table, with the house empty and the laptop closed, and it rang five times in Ohio and went to a voice that was not Devin's, the carrier's, a woman, and he did not leave anything, because there was nothing you could leave on that.<\/p><p>At 9:40 the phone lit. <em>at the funeral home. tomorrow.<\/em> Lowercase, no period on the first, a period on the second. Devin's own punctuation, back, as if the capital letters in December had been somebody else's phone.<\/p><p>He did not write back. He answered the eleven Marisol had marked with his name, and a teacher in Modesto who wanted to know why a Sunday lesson reminder went out Saturday at six, which was when they all went out. Marisol's note at eight had said <em>Nate. 29 in. Nothing on fire,<\/em> which it said most days now, and he did not tell her about Toledo, because she had never met Devin and would have said the right thing anyway. At 4:30 Lucy came in with Claire and a spelling list and asked why he was looking at the wall.<\/p><p>\"I'm not looking at the wall.\"<\/p><p>\"You're looking at where the wall is.\"<\/p><p>\"Devin's dad died.\"<\/p><p>She thought about that with the list in her hand. She had met Devin; she had asked, at the kitchen table in December of 2024, whether Devin's dad had a bell like the one in the app, and had never gotten a real answer.<\/p><p>\"Is Devin sad?\"<\/p><p>\"Yes.\"<\/p><p>\"Is he coming back here?\"<\/p><p>\"No.\"<\/p><p>\"Okay,\" Lucy said, and went to do the list, and that was the right amount of it.<\/p><hr class=\"break\"><p>Wednesday night was his mother, at 6:50, with the television on.<\/p><p>\"Devin's father died. Tuesday. In Toledo.\"<\/p><p>The television went down.<\/p><p>\"The one with the oxygen.\"<\/p><p>\"Yes.\"<\/p><p>\"Ay.\" A pause with the set in it. \"Your father's men came to the church. All six. Nobody called them; they came in the trucks and stood in the back in their work shirts because they'd come off a job, and Beto cried like a child, and I didn't know he had it in him.\" She had not said that in six years. \"You'll call him.\"<\/p><p>\"Tomorrow. He's at the funeral home today.\"<\/p><p>\"Then tomorrow. Don't write. Anybody can write. And send the flowers to the funeral home, not the house. The house fills up with lilies and you can't breathe in your own kitchen.\" The television came back up a notch. \"Three weeks Friday. Carmen bought napkins with my name on them. My name, Nate. On a napkin.\"<\/p><hr class=\"break\"><p>Thursday at 7:50, after the drop-off, from the kitchen table.<\/p><p>Devin picked up on the second ring, and behind him there was nothing. In February there had been the concentrator, a refrigerator in another room, and Nate had listened to it for the whole of a call at a window table, and it was gone, and the house in Toledo was a quiet house with a man in it.<\/p><p>\"I figured you'd write,\" Devin said.<\/p><p>\"I called.\"<\/p><p>\"Yeah.\" Flat. The Toledo voice. \"Okay.\"<\/p><p>\"I'm sorry about your dad.\"<\/p><p>\"Yeah. Thanks.\" A breath. \"Tuesday, about two. He was in the chair. He skipped the noon nebulizer because the Mud Hens were on and he said he'd do it after the inning, and he didn't do it after the inning. The nurse said that's how it goes with them; they decide. I was in the kitchen making him a sandwich he wasn't going to eat.\" A pause. \"The hospice people came for the chair Wednesday. The concentrator went back to the company the same day, a guy with a van and a clipboard for it. It's a lot of room, a chair.\"<\/p><p>Nate said nothing, because the man had said it already and did not need it said back to him.<\/p><p>\"Saturday at eleven. The place on Sylvania. The union's sending a piece of paper with the local's name on it, which he'd have liked; he used to say that's all a union is. The neighbors have brought four hams. I don't know what a person does with four hams.\"<\/p><p>\"Freeze two.\"<\/p><p>\"That's what Aunt Pat said.\" Something almost like a laugh, and not. \"You don't have to send anything.\"<\/p><p>\"Okay.\"<\/p><p>There was a silence then, and it was not February's, and it was not the platform's, and it was not the one at the window table with Gail stacking chairs. It had a kitchen in it on both ends. Neither of them filled it.<\/p><p>\"The check came on the sixth,\" Devin said. \"Fourth one. Brian's office sends me a thing when it lands, like it's a package.\"<\/p><p>\"Two more.\"<\/p><p>\"I know how many. I wasn't asking.\" The flatness went out of his voice for a second and came back. \"I'm not sorry about the money. I said that in February and I'm saying it again so it's said at the right time.\"<\/p><p>\"I know.\"<\/p><p>\"Pop asked me in April if it was still coming. I said yes. He said, 'Well.' He said that about everything. He said it about the Buckeyes and he said it about my mother.\"<\/p><p>A truck went by on Alder Creek Road. In Toledo something ticked, a clock or the house.<\/p><p>\"Ravi said you did a thing on Castro Street.\"<\/p><p>\"Twelve minutes.\"<\/p><p>\"He said you said my name in a room. He said you said the handshake was the most expensive sentence you'd ever said.\"<\/p><p>\"It was.\"<\/p><p>\"Yeah,\" Devin said. \"Me too.\"<\/p><p>Then, because the other thing was too big for a Thursday: \"The bank came through in March. Twenty hours. It's a website from 2009 in Columbus and it's fine. I've got his Grand Cherokee and nowhere to drive it.\"<\/p><p>\"Are you staying?\"<\/p><p>\"Aunt Pat says a year before you sell a house. I don't know if that's a law or a Pat thing. The salt's in the garage for next winter, and I'm not thinking about next winter in May.\" He let that stand. \"Don't forget me when you're rich.\"<\/p><p>He said it flat, the way he said everything now, and it was the sentence from the platform with the joke taken out of it, and they both heard the platform, the cap in his hand, the train that had made no sound leaving, and neither of them said that part, again.<\/p><p>\"I'm not rich.\"<\/p><p>\"I know. I read the thread.\" A breath. \"You called, though.\"<\/p><p>\"I called.\"<\/p><p>\"Okay,\" Devin said, and there was the second where either of them could have said the rest, and neither did. He hung up. It was 8:04 in a kitchen in California and 11:04 in one in Ohio, and both of them were quiet.<\/p><hr class=\"break\"><p>He showed Claire at the counter at 4:40, before he pressed anything.<\/p><p>\"Flowers. To the funeral home in Toledo, for Saturday morning.\" He had the site open on the phone. \"About ninety dollars with the delivery. It's under five hundred.\"<\/p><p>\"I know it's under five hundred.\"<\/p><p>\"I'm telling you anyway.\"<\/p><p>She looked at the phone, and then at him, and heard the number all the way through before she said anything, which was what she did with a number.<\/p><p>\"From the three of us. Put Lucy's name on it. She asked about his bell.\"<\/p><p>The form had a box. <em>Card message (200 characters).<\/em> He typed a sentence about being sorry and deleted it, because the flowers were the sentence, and typed <em>Nate, Claire, and Lucy Aguilar. Alder Creek, California,<\/em> and left it at that, and pressed the button, and the site thanked him in a font that had thanked a great many people.<\/p><p>Then dinner, and the list, and the horse book, two chapters, the one where the horse learns the gate.<\/p><p>At 9:20 the kitchen was the pad on the microwave and Claire at the table with the paper that closed her year, due in two weeks, sixty pages of it, and the red pen she used on everything including herself. He put the phone face down on the counter beside the sink, where he had put it down in December with the water running, and it did not light, and he did not turn it over to see. He set Lucy's bowl out for the morning, and the spoon beside it, and turned off the light over the sink, and left the one over the table on, because she was still at it.<\/p>", "words": 1605}, {"num": 60, "title": "June", "part": 5, "meta": "June 1–13, 2026 · Quince Court; Sunnyvale; San Jose; Gilroy", "html": "<p>Claire pressed the button at 9:52 on Friday night, at the kitchen table, with the laptop turned away from him so he could not read the screen, and then turned it back so he could.<\/p><p><em>Submitted.<\/em> A green check. A time stamp.<\/p><p>\"That's one,\" she said.<\/p><p>\"One year.\"<\/p><p>\"One year. Two semesters, Mondays, nineteen people, forty pages a week, and that.\" She pointed at the check without touching it. \"Sixty pages on how you teach a kid to read who's decided he can't. Don't ask me what it says. Ask me in August, when I've forgotten it and can tell you.\"<\/p><p>She closed the laptop. She did not open the red pen, and the pad on the microwave had nothing on it about the paper, because the paper was not money. She got up and stood in front of the refrigerator with the door open for a while, not cleaning it, looking. She took the last of the string cheese out and ate it standing up, and he watched her be tired and pleased at the same time and did not say either word.<\/p><p>\"Sunday,\" she said. \"The condo.\"<\/p><p>\"You still want to.\"<\/p><p>\"I want to stand in one. I've looked at pictures of them for three years and I've never once stood in one, and it's open one to four, and it's on the way to Costco.\" She put the wrapper in the trash. \"We'll take Lucy. She should see a dishwasher that works.\"<\/p><hr class=\"break\"><p>The building was on a street off Mathilda, three stories of stucco from the eighties over a carport, and the agent had the door propped with a basket of blue shoe covers and a sign-in on an iPad. Claire wrote her name and her real number. Nate wrote nothing. Lucy, who would be nine on Tuesday and had opinions about that, put the covers on over her sneakers and walked like a duck.<\/p><p>Two bedrooms. Two baths, one of them the size of the duplex's hall closet. A kitchen with a dishwasher and a counter that turned a corner. Laminate put down for the sale, still smelling of it. A balcony over the carport that faced east, toward the freeway and the flat roofs of office parks he did not point at.<\/p><p>\"One point one,\" the agent said, \"and they're expecting over. The association covers water, trash, and the roof.\"<\/p><p>\"Who fixes the roof?\" Claire said.<\/p><p>\"The association.\"<\/p><p>\"Huh,\" Claire said, and he knew exactly which roof she was standing under, and so did she, and neither of them said Gilroy. The agent said what the association cost each month, and Claire nodded as if it were a number she had heard before, which it was.<\/p><p>Lucy opened every closet. \"The little room's mine?\"<\/p><p>\"If we lived here,\" Claire said.<\/p><p>\"Where does the keyboard go?\"<\/p><p>\"Your room.\"<\/p><p>\"Then where do I go?\"<\/p><p>\"Also your room.\"<\/p><p>\"Okay,\" Lucy said, and went to find the pool the agent had mentioned, and Claire and Nate stood on the balcony over eleven parked cars.<\/p><p>\"Say it,\" she said.<\/p><p>\"Two-twenty down, which is four of what we had the day I got walked out. A payment we couldn't make on what we make. And a job in Nashville to make it with, for two years, and then a man looking for work at thirty-seven.\"<\/p><p>\"That's it.\"<\/p><p>\"That's it.\"<\/p><p>\"I'm not sad.\" She said it to the carport. \"I'd like that on the record before you decide I'm sad. I wanted to stand in one that had a dishwasher and a front door nobody else's kitchen was on the other side of, and I've stood in it, and it's a nice one, and I'm hungry.\"<\/p><p>\"Okay.\"<\/p><p>\"Not that one.\"<\/p><p>\"No. I heard you. Costco.\"<\/p><p>Lucy came back with the shoe covers in her hand and the news that the pool was closed for something called resurfacing, and they gave the covers back to the basket, and in the CR-V, at the light on Mathilda, Claire said, \"Her letter's due. It's June,\" and he said he knew what month it was.<\/p><hr class=\"break\"><p>Tuesday Lucy was nine, and there was a horse on the cake, and Yolanda gave her the lesson anyway, and Kim Duong, who did not teach before one on Tuesdays, was on the sidewalk in front of the house off The Alameda at 11:30 in walking shoes, with no tea.<\/p><p>\"Two blocks and back, and then I've got a soprano. You get the two blocks.\"<\/p><p>Her block was old houses and a school, a fig tree over a fence, a man washing a truck.<\/p><p>\"August eighth,\" she said. \"You get two minutes at the front, like last year. Tell me what you're going to say in them, because if it's 'nothing new,' the two minutes go to the metronome man, and he'll take them.\"<\/p><p>\"Siblings.\"<\/p><p>\"That's a checkbox.\"<\/p><p>\"It's two kids and one mother and one credit, and every teacher in your group with a family of two has been doing that arithmetic by hand for two years and not telling me, because they think it's their fault. Angie Reyes asked me in May of 2024, and in December, and I wrote <em>third<\/em> on a card. I've got a dozen of those cards now. It's the same question in a dozen hands.\"<\/p><p>\"Fine. Then do the studios.\" She did not slow down. \"Two teachers, one page, one policy, one person at a desk. Half the people who've called me since March about Family Hub are studios with two or three teachers, and they're on Allegro because you don't do two teachers, and they hate it. That's not a checkbox. That's a second product. Call it something, charge them double, put it on the banner. Which you still owe me.\"<\/p><p>\"People are calling you about Family Hub.\"<\/p><p>\"Four this week. One switched. She called me from the hold music to ask if I'd ever heard it. She said it was Vivaldi.\"<\/p><p>He walked half a block with it. He knew what the second product was, because he had built it once, in a kitchen on Ninth Avenue in the fall of 2024: a desk, a second login, invoices, somebody to sit at the desk, and Allegro already sold the desk. He had said that to Claire on a Sunday in March of 2024 with one page on the table, and it had been true with one teacher, and it was true now.<\/p><p>\"It's a second company,\" he said. \"A desk and somebody at it. I've got a woman in Fresno and a Sunday. The studios can have Allegro. The checkbox is two years of teachers doing arithmetic in their heads and not saying so, and that's the one I'm good at.\"<\/p><p>\"So you're going deeper.\"<\/p><p>\"I'm going deeper.\"<\/p><p>\"On siblings.\"<\/p><p>\"On siblings first.\"<\/p><p>Kim stopped at her own gate, which was the two blocks.<\/p><p>\"Siblings by August, working, or you're not at the front, and I mean it, because I said 'not Allegro' for four years and I'd like the reason to keep being true.\" She opened the gate. \"And the banner.\"<\/p><p>\"The banner.\"<\/p><p>\"Good.\"<\/p><hr class=\"break\"><p>Lena's email came Thursday at 4:50, three lines and no greeting, because Lena's greetings cost money.<\/p><p class=\"note\"><em>Sacramento's budget bill has software in it this year, and it will pass, because it's the budget. From January the state taxes software subscriptions, yours included; your price will have a line under it, and I'll tell you what the line says when they tell me, which will be October if I know them. Nothing to do now. And yes to the thing you asked Monday, not a dollar more than you asked. Enjoy June. L.<\/em><\/p><p>He read it once. The card for the fall email, the one he had promised in February to write before the old price ended, said <em>price<\/em> on it; under that he wrote <em>tax,<\/em> and put the card back on the pad, and went back to the mail.<\/p><hr class=\"break\"><p>His mother called Friday at 3:40. Fridays were nobody's.<\/p><p>\"They gave me a plant,\" she said. \"And a card the whole building signed, and the principal said a thing in the lounge, and I said thank you, and then I went back to the office and told the copier goodbye, and it jammed.\" The office behind her had no sound in it. \"Twenty-five years, and it jammed. I'm sitting at the desk. It's not mine. It's very strange, mijo. Come tomorrow at two, and leave the phone in the car.\"<\/p><p>The phone went in the glove box of the CR-V at 1:55 on Leavesley Road, and he left it there.<\/p><p>The house had Carmen in it. Carmen had been in it since eight, and there were napkins on every flat surface with ROSA on them in gold script, and a banner over the kitchen door that said HAPPY RETIREMENT in letters someone had bought at the party store and someone else had hung crooked. The cousins were on the porch. Carmen's husband had the grill. Two women from the Uvas office were in the kitchen being told where things were by Carmen, who did not live there; one of them was Yvonne, who had the copier from Monday and did not know yet what that meant. The woman from the church office had brought a pie in a box from Safeway and set it on the counter and said nothing whatever about it, and Lucy, who was nine now and told everyone, cut it.<\/p><p>The hall had been painted in April by the same man from the church, and the ring was not coming back through. Nate stood under it with a plate and looked up, and there was nothing to look at.<\/p><p>A cousin asked about the computer thing and he said it was fine, and it was, and the cousin said his boy did something with computers too, in Hollister, and they talked about Hollister.<\/p><p>At 3:30 Carmen hit a spoon on a glass, and the porch and the yard came into the kitchen, and Rosa stood with her back to the stove and looked at forty people who had come to her house on a Saturday to watch her stop.<\/p><p>\"Twenty-five years at that desk and not one child's paperwork ever went missing, which is more than the district can say for itself. The copier is Yvonne's on Monday; eat.\"<\/p><p>They ate. Yvonne laughed like a woman who has just been handed something and has not looked at it yet.<\/p><p>By 4:40 the porch was cousins and the yard was Lucy and two children he did not know. Carmen was washing dishes that were not hers, and Claire was drying them, and his mother sat down.<\/p><p>She sat at her own kitchen table, in the chair by the wall, where she could see down the hall to the corner where the bucket had been, with a plate that had pie on it. Carmen said something to her about the plates. His mother said, \"You're washing them; they're yours,\" and did not get up, and ate the pie.<\/p>", "words": 1846}, {"num": 61, "title": "Sunday Numbers", "part": 5, "meta": "Sunday, June 14, 2026 · Quince Court", "html": "<p>The letter had been on the mat when they got in from Gilroy at nine, folded in thirds with the address typed on the front, the way they had come across the shared wall every year since 2023. Claire had picked it up and put it on the kitchen table and had not opened it, and it was still there at 9:10 Sunday morning, between the pad and the laptop, where neither of them had moved it.<\/p><p>\"Not first,\" she said. \"It's not a number until it's open, and I'm not doing it in pencil.\"<\/p><p>Lucy was at the Reyeses' until noon. The pad had a year on it now, June to June, and the top line still said <em>Sunday numbers,<\/em> underlined once, in a hand that had not known yet what it was starting.<\/p><p>Claire read. That was the change of the spring; she had the sheet, she was on it, and she read it to him now instead of the other way around, and he listened.<\/p><p>\"May closed at twelve-eighty. Eleven thousand nine hundred.\" Pen. \"June's on the thirtieth. This morning it's thirteen-twenty and twelve-seven, and that's the forecast, because I've learned the word.\" Pencil, lighter. \"Marisol, twenty hours, about twenty-seven hundred with the taxes. Columbus, the sixth: five of six.\" She did not look up. \"One more. July sixth. Then that line comes off this page, and I'd like you to know I'm going to draw through it myself.\"<\/p><p>\"Okay.\"<\/p><p>\"Your four.\"<\/p><p>He gave them, because they were his and she had never once taken them from him. Of every hundred who were paying at the start of a month, a little over two and a half left by the end of it now. It had been two, a year ago, in the Costco lot. Forty-one of a hundred paid for the year up front; that had been thirty-four in the lot. The trial number was back to forty. Support was thirty a day, and Marisol's. Nine of December's seventy-four had come back; the rest were not coming, and he had stopped keeping the list, which she knew, because the list had been on the sheet and was not anymore.<\/p><p>\"Two and a half,\" Claire said.<\/p><p>\"It was two.\"<\/p><p>\"Say what it is.\"<\/p><p>\"Some of it is Nashville. Some of it is June; June has always been June. Some of it is that it's slowing. It's real, and it's twelve-seven a month, and it's slowing, and I don't think it stops, and I don't think it's ever October again.\" He looked at the pencil number. \"I'm not building anything about it. I'm doing siblings, for August. Kim said.\"<\/p><p>\"Kim said.\" She wrote <em>2.6<\/em> small beside June, where a stranger would not have known to look for it. \"Then the house.\"<\/p><p>She read the house faster, because she had carried that column alone from January of 2025 to a Sunday in June, and did not slow down for it now. Rent thirty-eight hundred, until the letter. Tuition, the next one in August, forty-seven hundred, and a year after that it was over and her column went up. The fund, this morning, a little under; on the thirtieth, with the fifth installment gone and the tuition paid on the first and the thing they were about to do, thirteen thousand eight hundred.<\/p><p>\"Thirteen-eight,\" she said. \"From fifty-two at the layoff. I want that said once at this table, out loud, and then I don't want it said again, because I've done that subtraction every first Tuesday for sixteen months and I'm finished doing it out loud.\"<\/p><p>\"Thirteen-eight.\"<\/p><p>\"Now the thing.\"<\/p><p>He said the thing. Lena had said yes on Thursday, in the same email as the tax, not a dollar more than he'd asked, and he had asked five. Five thousand, from the company to the house, the first of what Lena called a distribution and Claire had been calling <em>the other check<\/em> since April. It was money the company had left over after Marisol and Ohio and him, the first month since February that had ended with more in the account than it started with, which Lena had said in April was the whole test.<\/p><p>\"Five.\" She wrote <em>5,000<\/em> in pencil, under June, on the line for the house. \"Show me.\"<\/p><p>He turned the laptop. <em>From:<\/em> Fermata LLC. <em>To:<\/em> the house fund. <em>5,000.00.<\/em> Memo: <em>distribution, Jun.<\/em> She read it, the account names, the memo, the way she read a page she was going to sign. He pressed it. It took four seconds. In November, at this table, alone, with the coffee going cold, it had taken eleven minutes and his father. The page said <em>Transfer scheduled,<\/em> and did not know anything had happened. She took the pen and went over the pencil, the five and the three zeros, and drew the short line under it.<\/p><p>\"That's the right order,\" she said. \"I'd like it noted that we did it once without anybody yelling.\"<\/p><p>\"Noted.\"<\/p><p>\"What's left in the company?\"<\/p><p>\"Twelve-five. It goes down till August, and August fixes it. Lena says that's the shape of the year.\"<\/p><p>\"Lena says.\" She capped the pen and set it down square to the pad, and he understood that the numbers were done and something else was not.<\/p><p>\"Terms,\" Claire said. \"I have four. I'm going to say them as terms, and you're going to say yours, and then we're going to open that.\" She nodded at the letter without looking at it.<\/p><p>\"Okay.\"<\/p><p>\"One. Hours. You're out of the chair at six. Not in the room at six with your hand on the lid. Out. If it's down, Marisol says it's down, and you go back, and that's the only reason. Two. Money. The stub stays where Lena put it until Lena moves it. Anything else that comes out of the company comes to this table first, like that did.\" She touched the five. \"Three. The five hundred stays. It's not a punishment. It never was. It's the house.\" She stopped, and it was the first time in the list she had stopped. \"Four. One Saturday a month is mine. Not the house's, not Lucy's, not yours, not the program's. I go, and I don't say where, and nobody texts me a number. The first one's the twenty-seventh.\"<\/p><p>He had heard terms set at that table, and had set some, and he had never heard four in a row said without a single <em>I need you to hear me<\/em> in them.<\/p><p>\"Those are the four.\"<\/p><p>\"Those are the four. Yours.\"<\/p><p>\"One.\" He had one. He had had it since a Sunday in the Costco lot. \"One Sunday a month with no numbers. No pad, no sheet, no first Tuesday if it lands on one. We go somewhere or we don't, and nobody says a figure out loud in this house from the time we get up to the time we go to bed, and Lucy can count whatever she wants.\"<\/p><p>\"Which Sunday?\"<\/p><p>\"You pick. Not this one.\"<\/p><p>\"Not this one.\" She took the pen back and wrote them, all five, under June, in short lines, in his words and hers. \"I'm not putting a season on any of them. I've had a season.\"<\/p><p>She did not read them back, because they had both been in the room. Lucy's bowl was still on the counter from breakfast, and neither of them got up for it.<\/p><p>\"Now the letter.\"<\/p><p>She opened it with the butter knife, which was what the butter knife was for on this table, and unfolded it, and read it, and turned it around so it faced him across the pad.<\/p><p class=\"note\"><em>Effective September 1, 2026, the monthly rent for 14B Quince Court will be $3,900.<\/em><\/p><p>Typed, in June, for September, because her son in Sacramento had told her in 2024 to give more notice, and she had given it ever since, more than the law asked. The ribbon was going; the nines were lighter than the threes. The lines for both of them at the bottom, and her signature already on the third, in blue ink, and under it, typed, a line that had not been in any of the others: <em>I hear the piano through the wall. It is much improved.<\/em><\/p><p>\"A hundred,\" Nate said.<\/p><p>\"A hundred. Fifty last year, a hundred the year before, on that typewriter, and she could get four-two for this place tomorrow from anybody with a badge, and she types a hundred and a sentence about the piano.\" Claire put the letter down. \"So.\"<\/p><p>\"So we could hand her a piece of paper back.\"<\/p><p>She looked at him.<\/p><p>\"That's my line.\"<\/p><p>\"I know whose line it is. I've had it for three years.\"<\/p><p>\"And you're going to.\"<\/p><p>\"I'm going to ask her for two years at thirty-nine. Tomorrow, at her table, before I sign anything.\"<\/p><p>\"And the dryer?\"<\/p><p>He laughed. He did not decide to; it came out of him at the table at 9:50 on a Sunday morning over a rent increase, and she heard it and started too. The dryer was in the garage with the recital chairs stacked on top of it, and had been a shelf for three years that month, and neither of them wanted it back, and neither of them had ever once said so.<\/p><p>The letter lay open between the pad and the laptop, typed, with two lines on it that nobody had signed, and the five thousand above it. Claire wiped her eyes with the back of the hand that still had the pen in it and said, \"Ask about the dryer,\" and that set him off again.<\/p>", "words": 1602}, {"num": 62, "title": "Recital", "part": 5, "meta": "Saturday, June 20, 2026 · Persimmon Lane", "html": "<p>Mrs. Halvorsen was at the shared door at 9:15 in a cardigan, with a paper bag, and she got into the back of the CR-V beside Lucy with the bag on her knees as if it were a purse.<\/p><p>\"For the piano lady,\" she said. \"I went to one of these in 1998. A neighbor's grandson. He played something with his elbows.\"<\/p><p>\"On purpose?\" Lucy said.<\/p><p>\"I never found out.\"<\/p><p>They had the two folding chairs from the garage in the back, off the top of the dryer, and Lucy's music, and the horse dress from May, shorter, and Claire drove, and on the refrigerator behind them a horse with its leg right was pinned over the older drawing that nobody had taken down.<\/p><p>Persimmon Lane had cars on both sides down to the corner. The fog had not burned off; it sat over the street at the height of the roofs, and the Wongs' rebuild across the road stood in it like a boat. Yolanda's garage door was up. The Yamaha was where it had always been, against the back wall, and the box fan had been carried to the mouth of the garage and pointed at the driveway, and in the driveway, from the garage to the sidewalk, were chairs.<\/p><p>Not hers. Hers were two, and they were inside. The driveway had camp chairs and dining chairs and a bench somebody had carried from a kitchen, and a stool, in rows that were nearly rows. By 9:40 most of them had a parent in them and the rest had a jacket saving them.<\/p><p>Rosa was on the aisle, if it was an aisle, in a blouse he had not seen before, which was not one of the ones for the school, because there was no school.<\/p><p>\"Eight days,\" she said. \"I slept till seven on Monday and got up to see what was wrong. Nothing was wrong. I did it again Tuesday.\" She looked at the chairs. \"Carmen wanted to come. I told her it was children.\"<\/p><p>Kim had brought her own chair, a good one with a cup holder, and put it at the end of the second row where she could see the piano and the street, and said, \"Twenty. She should have done this ten years ago,\" and then, \"Sit down, you're in the way.\"<\/p><p>Ana Solis stood. She had come in a cardigan, in June, and stood at the edge of the driveway by the fence with her hands together, and when he went to her she said, \"I'm not sitting. They're hers. I'm just here.\" Then, because she had learned to say the second thing: \"Tuesdays and Thursdays from September. She's giving me a key. Mr. Dao's getting two quiet days a week and doesn't know it yet.\"<\/p><p>Yolanda came out the side door at 9:50 in the black, with both braces on, in daylight, in June. She stood at the mouth of the garage beside the fan and looked at the driveway, and the chairs, and the cars down to the corner, and at Nate, who was standing.<\/p><p>\"Nathaniel. You're the parent. You sit there.\"<\/p><p>The corner chair. He sat in it.<\/p><p>From the corner chair you could see two things. The driveway, out through the garage mouth, with the fog on it and thirty-some people on chairs they had brought, and, on the wall to his left, the whiteboard.<\/p><p>It was the size of a door. It had three lines on it, in green, with room around them.<\/p><p class=\"note\"><em>Recital 6/20.<\/em><\/p><p class=\"note\"><em>Ana: keys.<\/em><\/p><p>And down at the bottom, in a different ink: <em>eggs, milk, Andre Sunday.<\/em><\/p><p>He read it because it was there. He read it again to be sure he had it right, and he did, and Yolanda said, \"Twenty,\" to the driveway, and began.<\/p><hr class=\"break\"><p>She had no program. She had twenty children shortest to tallest. She said each name and the piece and nothing more, and sat on the bench of the Clavinova with her hands in her lap. The children came in from the driveway one at a time and climbed onto the Yamaha's bench and played into a garage with the door up. The sound went out over the chairs and the cars and into the fog, and came back off the Wongs' house a little late.<\/p><p>The Monday four o'clock, who was seven now and had asked in September what was on her hand, played a minuet with his tongue out. Mrs. Ruiz's girl played something Spanish and looked at her mother the whole time. A boy of ten played the first page of a piece he had plainly been told was too hard for him and stopped where the page ended and bowed, and Yolanda said, \"Next year, the second page,\" and the driveway laughed.<\/p><p>He counted the phones. He had done it in the gym in May, and the May before that, and he did it now: three in the first row, up during the minuet, one recording, two somewhere else. Five by the third child. Kim had hers up, which did not count, because Marisol was on it.<\/p><p>\"Nate.\" Marisol, from the yellow kitchen, Saturday morning, the window over the sink behind her, the size of a playing card in Kim's hand held over the second row. \"Twenty-two in this morning. None for you. Marcus Tillman wants to know if siblings is real or a rumor; I told him August. I'm not calling about that. Tell Lucy the left hand, and tell Yolanda I'd have paid to be in that chair.\" She waved, at him and past him, at the garage, and Kim turned the phone so she could see the piano for the length of one child's piece, and then Marisol said, \"Go. I'm at work,\" and was gone.<\/p><p>Somewhere around the seventh child he noticed he had stopped counting. He did not know at which one. He knew his own phone was in his hand, because he had looked at the time when Marisol went, and it was 10:24, and there was nothing on it, and he put it in his pocket, and it stayed there.<\/p><hr class=\"break\"><p>Lucy was twelfth.<\/p><p>She went up in the horse dress and put her feet on the bar and looked at the keys for as long as she needed to, and Yolanda said, \"Lucy Aguilar. Clementi. Again, because a piece isn't yours the first time you play it for people,\" and Lucy played.<\/p><p>He knew where the trouble lived, and it was not where it had lived in May. The left hand walked down under the tune in the second half, and walked down as if it had always known how. What he was waiting for was the last line, and the A.<\/p><p>It was an A.<\/p><p>She did not look up at it. She finished, and stood, and did the bow Yolanda had taught her, which was short. She looked for them, and found her grandmother first, on the aisle, and then them.<\/p><p>Claire had her hands folded in her lap where a program would have been, and did not say anything, and then said, \"A,\" and he said, \"A.\" Rosa, on the aisle, said nothing at all, and had his arm.<\/p><hr class=\"break\"><p>At 10:55 the tallest one played, a girl of fourteen who had been on the board in 2023 with a number after her name and did not know it. It was Chopin, and it was good, and the fog went while she played it, and the driveway was in sun.<\/p><p>Yolanda stood up from the Clavinova bench and turned to the driveway.<\/p><p>\"That's twenty. I said in May it wasn't getting bigger, and it hasn't, and it won't. It's a chamber piece now; you can hear every part.\" She looked at the chairs. \"Tuesdays and Thursdays from September this garage is Ana's, and the fall times are on my page, and I'm not going to say another word about it, and there's juice in the refrigerator, and Lucy Aguilar is in charge of it.\"<\/p><p>Lucy was already at the mini-fridge.<\/p><p>Mrs. Halvorsen got up from her chair with the paper bag and walked up the driveway to the garage, which took a while, and put the bag into Yolanda's left hand, the one that could hold it.<\/p><p>\"For the piano lady. I came to one of these in 1998. The Osterhaus boy. He played with his elbows.\"<\/p><p>Yolanda looked in the bag, and there were lemons in it.<\/p><p>\"I remember the Osterhaus boy,\" she said. \"He did it on purpose. I probably have the program.\"<\/p><p>Kim folded her chair. Ana had not moved from the fence, and Yolanda looked at her across the garage, once, and Ana looked at the floor and did not say sorry, and then looked up. Rosa had a juice box that Lucy had given her and was drinking it.<\/p><p>The chairs went back into cars. The camp chairs, the kitchen bench, the stool, the two off the top of the dryer, which Claire carried; the cars pulled out one at a time down Persimmon Lane, and the driveway got wider as they went until it was a driveway, with oil spots on it and a garage open at the top of it.<\/p><p>He was still in the corner chair. Yolanda was at the board with the eraser in her left hand, and she looked at the three lines for a moment, and put the eraser back in the tray without touching any of them, and went to see about the juice.<\/p><p>Out on the driveway Lucy had the fan's cord in both hands and was asking where it went, and Yolanda said inside, and she carried it in.<\/p>", "words": 1622}], "total": 119774}</script>
<script>
(function(){
  var DATA = JSON.parse(document.getElementById('data').textContent);
  var CH = DATA.chapters, PARTS = DATA.parts, N = CH.length;
  var root = document.documentElement;
  var page = document.getElementById('page'), where = document.getElementById('where'), prog = document.getElementById('prog');
  var toc = document.getElementById('toc'), scrim = document.getElementById('scrim'), panel = document.getElementById('panel');

  function load(k, d){ try{ var v = localStorage.getItem('nw.'+k); return v===null? d : JSON.parse(v);}catch(e){ return d; } }
  function save(k, v){ try{ localStorage.setItem('nw.'+k, JSON.stringify(v)); }catch(e){} }
  function fmt(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  function mins(w){ return Math.max(1, Math.round(w/230)); }

  var prefs = { theme: load('theme','system'), font: load('font','serif'), fs: load('fs',19), lh: load('lh',1.65), align: load('align','left') };
  var readSet = load('read', {});
  var cur = null;

  function applyPrefs(){
    if(prefs.theme==='system') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', prefs.theme);
    root.style.setProperty('--body-font', prefs.font==='sans' ? 'var(--sans)' : prefs.font==='georgia' ? 'var(--georgia)' : 'var(--serif)');
    root.style.setProperty('--fs', prefs.fs+'px');
    root.style.setProperty('--lh', prefs.lh);
    document.getElementById('fs-out').textContent = prefs.fs;
    root.style.setProperty('--align', prefs.align);
    seg('seg-theme', prefs.theme); seg('seg-font', prefs.font); seg('seg-lh', String(prefs.lh)); seg('seg-align', prefs.align);
  }
  function seg(id, v){ var bs = document.getElementById(id).querySelectorAll('button'); for(var i=0;i<bs.length;i++) bs[i].classList.toggle('on', bs[i].dataset.v===v); }
  function bindSeg(id, key, cast){ document.getElementById(id).addEventListener('click', function(e){ var b = e.target.closest('button'); if(!b) return; prefs[key] = cast? cast(b.dataset.v) : b.dataset.v; save(key, prefs[key]); applyPrefs(); }); }
  bindSeg('seg-theme','theme'); bindSeg('seg-font','font'); bindSeg('seg-lh','lh', parseFloat); bindSeg('seg-align','align');
  document.getElementById('fs-minus').onclick = function(){ prefs.fs = Math.max(15, prefs.fs-1); save('fs',prefs.fs); applyPrefs(); };
  document.getElementById('fs-plus').onclick = function(){ prefs.fs = Math.min(26, prefs.fs+1); save('fs',prefs.fs); applyPrefs(); };
  document.getElementById('btn-theme').onclick = function(){
    var dark = root.getAttribute('data-theme')==='dark' || (!root.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
    prefs.theme = dark ? 'light' : 'dark'; save('theme', prefs.theme); applyPrefs();
  };
  document.getElementById('btn-set').onclick = function(e){ e.stopPropagation(); panel.hidden = !panel.hidden; };
  document.addEventListener('click', function(e){ if(!panel.hidden && !panel.contains(e.target)) panel.hidden = true; });

  // Contents
  function buildToc(){
    var h = '';
    PARTS.forEach(function(v, vi){
      h += '<div class="vol"><div class="vol-h"><b>'+v.id+': '+v.name+'</b><i>'+v.span+'</i></div><ol>';
      CH.filter(function(c){return c.part===vi;}).forEach(function(c){
        h += '<li><button data-n="'+c.num+'"><span class="n">'+c.num+'</span><span>'+c.title+'</span></button></li>';
      });
      h += '</ol></div>';
    });
    document.getElementById('toc-list').innerHTML = h;
  }
  document.getElementById('toc-list').addEventListener('click', function(e){ var b = e.target.closest('button'); if(b){ go(+b.dataset.n); closeToc(); } });
  function markToc(){
    var bs = document.querySelectorAll('#toc-list button');
    for(var i=0;i<bs.length;i++){ var n = +bs[i].dataset.n; bs[i].classList.toggle('on', n===cur); bs[i].classList.toggle('read', !!readSet[n]); }
    if(cur){ var on = document.querySelector('#toc-list button.on'); if(on && on.scrollIntoView) on.scrollIntoView({block:'nearest'}); }
  }
  function openToc(){ toc.classList.add('open'); scrim.classList.add('show'); }
  function closeToc(){ toc.classList.remove('open'); scrim.classList.remove('show'); }
  document.getElementById('menu').onclick = openToc; scrim.onclick = closeToc;
  var brand = document.getElementById('brand'); brand.onclick = function(){ cover(); closeToc(); }; brand.onkeydown = function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); cover(); closeToc(); } };

  // Cover
  function cover(){
    cur = null; save('cur', null);
    var last = load('last', null);
    var lastCh = last ? CH[last-1] : null;
    var readN = Object.keys(readSet).length;
    var h = '<div class="cover">'
      + '<p class="kicker">A novel</p>'
      + '<h1>Nights and Weekends</h1>'
      + '<p class="sub">Nate Aguilar writes software for a supply-chain company in Sunnyvale, rents half a duplex in a small Silicon Valley town, and has never negotiated anything. When his daughter’s piano teacher cancels a Tuesday by group text and six parents start arguing about whose makeup credit is whose, he notices that he wants to know. This is the story of what he builds on nights and weekends over the next three years, who pays for it, and what it costs.</p>'
      + '<button class="cta" id="cta">'+(lastCh?'Continue reading · Chapter '+lastCh.num+': '+lastCh.title:'Start at Chapter 1')+'<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>'
      + '<div class="facts"><div><b>'+N+'</b>chapters</div><div><b>'+fmt(DATA.total)+'</b>words</div><div><b>'+readN+' / '+N+'</b>read</div></div>'
      + '<ul class="vols">';
    PARTS.forEach(function(v, vi){
      var first = CH.filter(function(c){return c.part===vi;})[0];
      h += '<li><button data-n="'+first.num+'"><span class="v">'+v.id+'</span><span class="t">'+v.name+'<small>From Chapter '+first.num+'</small></span><span class="r">'+v.span+'</span></button></li>';
    });
    h += '</ul>'
      + '<div class="rules"><b>Studio policies</b>Lessons are 30 or 45 minutes, weekly. Tuition is due the first of the month. 24 hours’ notice is required to cancel. One makeup lesson per semester, at the teacher’s discretion. Credits expire at the end of the semester and are not refundable.</div>'
      + '<p class="foot">Alder Creek, Halyard, Fermata, Rondo, Allegro Studio, and everyone in them are fictional. The highways, the trains, the rents, the taxes, and the weather are not.</p>'
      + '</div>';
    page.innerHTML = h;
    document.getElementById('cta').onclick = function(){ go(lastCh ? lastCh.num : 1); };
    page.querySelector('.vols').addEventListener('click', function(e){ var b = e.target.closest('button'); if(b) go(+b.dataset.n); });
    where.textContent = 'Nights and Weekends'; prog.style.width = '0'; document.title = 'Nights and Weekends'; markToc();
    window.scrollTo(0,0);
  }

  // Chapters
  function go(n, keepScroll){
    var c = CH[n-1]; if(!c) return;
    cur = n; save('cur', n); save('last', n);
    var v = PARTS[c.part];
    var prev = CH[n-2], next = CH[n];
    page.innerHTML = '<article>'
      + '<p class="eyebrow">'+v.id+': '+v.name+' &nbsp;/&nbsp; Chapter '+c.num+'</p>'
      + '<h1>'+c.title+'</h1>'
      + '<p class="meta">'+(c.meta? '<em>'+c.meta+'</em><br>' : '')+fmt(c.words)+' words · about '+mins(c.words)+' min</p>'
      + c.html + '</article>'
      + '<nav class="pager">'
      + '<button class="prev" id="prev"'+(prev?'':' disabled')+'><small>Previous</small><span>'+(prev? 'Chapter '+prev.num+': '+prev.title : '')+'</span></button>'
      + '<button class="next" id="next"'+(next?'':' disabled')+'><small>Next</small><span>'+(next? 'Chapter '+next.num+': '+next.title : 'The end')+'</span></button>'
      + '</nav>';
    document.getElementById('prev').onclick = function(){ if(prev) go(prev.num); };
    document.getElementById('next').onclick = function(){ if(next) go(next.num); else cover(); };
    where.innerHTML = v.id+': '+v.name+'<b>Chapter '+c.num+': '+c.title+'</b>';
    document.title = 'Chapter '+c.num+': '+c.title+' — Nights and Weekends';
    applyPrefs(); markToc();
    if(keepScroll){ var y = load('scroll.'+n, 0); window.scrollTo(0, y); } else window.scrollTo(0,0);
    if(history.replaceState) history.replaceState(null, '', '#ch'+n);
  }
  function prevCh(){ if(cur>1) go(cur-1); } function nextCh(){ if(cur && cur<N) go(cur+1); }

  // Progress, read marks, position
  var tick = null;
  window.addEventListener('scroll', function(){
    if(!cur) return;
    var doc = document.documentElement;
    var max = doc.scrollHeight - innerHeight;
    var r = max>0 ? Math.min(1, scrollY/max) : 1;
    prog.style.width = (r*100).toFixed(1)+'%';
    if(r>0.92 && !readSet[cur]){ readSet[cur]=1; save('read', readSet); markToc(); }
    clearTimeout(tick); tick = setTimeout(function(){ save('scroll.'+cur, scrollY); }, 250);
  }, {passive:true});

  document.addEventListener('keydown', function(e){
    if(e.target.tagName==='INPUT') return;
    if(e.key==='ArrowRight') nextCh(); else if(e.key==='ArrowLeft') prevCh();
    else if(e.key==='t'||e.key==='T'){ if(toc.classList.contains('open')) closeToc(); else openToc(); }
    else if(e.key==='Escape'){ closeToc(); panel.hidden = true; }
  });

  // Start
  applyPrefs(); buildToc();
  var m = location.hash.match(/^#ch(\d+)$/);
  if(m && CH[+m[1]-1]) go(+m[1], true);
  else { var c0 = load('cur', null); if(c0 && CH[c0-1]) go(c0, true); else cover(); }
})();
</script>
