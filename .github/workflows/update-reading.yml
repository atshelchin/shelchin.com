# 每 6 小时抓取一次 data/feeds.toml 里的订阅源。
# 有新文章时提交 data/reading.json，Cloudflare Pages 随之自动重新构建；没有变化就不提交。
name: Update reading list

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-reading
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch feeds
        run: python3 scripts/update_reading.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/reading.json; then
            echo "No new posts."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reading.json
          git commit -m "chore(reading): update feeds"
          git push
